Locatiegegevens (nauwkeurig en bij benadering)","p_loc":"Met uw toestemming heeft de App toegang tot de op GPS en netwerk gebaseerde locatie van uw apparaat om zijn kernfuncties te bieden: het geotaggen van uw foto's en video's (het insluiten van coördinaten en adres in de afbeelding), het tonen van uw positie op een kaart, het berekenen van de kompasrichting, magnetische declinatie en zon/maan- en weerdetails voor uw locatie. De locatie wordt op uw apparaat verwerkt en ingesloten in de media die u vastlegt. Deze kan worden verzonden naar de externe diensten die in Sectie 3 worden vermeld (bijvoorbeeld om kaarten weer te geven of weersomstandigheden op te halen). Wij slaan uw locatie niet op onze eigen servers op.","h_cam":"Camera, foto's en media","p_cam":"Met uw toestemming gebruikt de App uw camera om foto's te maken en video's op te nemen, en leest/schrijft media zodat uw opnamen in uw galerij kunnen worden opgeslagen en in het in-app-album kunnen worden weergegeven. Uw foto's en video's blijven op uw apparaat, tenzij u ervoor kiest ze te delen of te exporteren. Wij uploaden of bewaren uw foto's of video's niet.","h_dev":"Apparaat- en gebruiksgegevens","p_dev":"Wij gebruiken Google Analytics for Firebase en Firebase Crashlytics om te begrijpen hoe de App wordt gebruikt en om crashes te diagnosticeren. Dit kan app-gebeurtenissen omvatten (zoals geopende functies), apparaatmodel, versie van het besturingssysteem, app-versie, taal en algemene regio/land, en crashdiagnostiek. Dit helpt ons bugs op te lossen en de App te verbeteren.","h_ad":"Advertentiegegevens","p_ad":"De gratis versie van de App toont advertenties via Google AdMob. AdMob kan toegang krijgen tot de advertentie-identificatie van uw apparaat en gerelateerde gegevens om advertenties weer te geven en te meten, inclusief gepersonaliseerde advertenties waar dit is toegestaan. Zie Sectie 4 voor uw advertentiekeuzes.","h_notif":"Meldingen","p_notif":"Als u meldingen inschakelt, gebruikt de App Firebase Cloud Messaging (dat een push-token voor het apparaat genereert) om optionele herinneringen te leveren, zoals waarschuwingen voor het gouden uur. U kunt meldingen op elk moment uitschakelen in de instellingen van uw apparaat.","h_purch":"Aankopen","p_purch":"Als u de optionele eenmalige upgrade „Advertenties verwijderen / Pro” koopt, wordt de transactie verwerkt door Google Play Billing. Wij ontvangen een bevestiging dat een aankoop is gedaan, zodat wij de Pro-functies kunnen ontgrendelen en voor u kunnen herstellen. Wij zien of bewaren nooit uw betaalkaart- of factuurgegevens — die worden volledig door Google afgehandeld.","h_provide":"Informatie die u ervoor kiest te verstrekken","p_provide":"Als u ons e-mailt (voor ondersteuning of feedback), ontvangen wij het e-mailadres en de inhoud van het bericht die u verzendt, en gebruiken deze alleen om u te antwoorden.","h2":"2. Sensoren","p_sensors":"De App leest de bewegingssensoren van het apparaat (versnellingsmeter en magnetometer) om de kompas-, waterpas- en kantelfuncties aan te drijven. Deze sensorgegevens worden in realtime op uw apparaat gebruikt en zijn geen persoonlijke informatie over u.","h3":"3. Diensten van derden","p_third_intro":"De App maakt gebruik van de volgende diensten van derden, die elk onderworpen zijn aan hun eigen privacybeleid:","tp_advertising":"(advertenties)","tp_analytics":"Google Analytics for Firebase & Firebase Crashlytics","tp_notifications":"(meldingen)","tp_purchases":"(aankopen)","li_weather":"Een externe leverancier van weergegevens kan worden bevraagd met uw locatie om de huidige omstandigheden weer te geven.","h4":"4. Advertenties en uw keuzes","p_ads_intro":"Advertenties worden geleverd door Google AdMob. U kunt gepersonaliseerde advertenties op uw apparaat beheren:","li_android":"Android: Instellingen → Google → Advertenties → uw advertentie-ID afmelden / resetten.","li_remove":"Advertenties volledig verwijderen: koop de eenmalige Pro-upgrade in de App.","h5":"5. Hoe wij informatie delen","p_share":"Wij verkopen uw persoonlijke informatie niet. Informatie wordt alleen gedeeld met de dienstverleners die in Sectie 3 worden vermeld, zodat zij hun functies kunnen uitvoeren (bijvoorbeeld het tonen van kaarten of advertenties), en waar dit wettelijk vereist is, door een juridische procedure, of om de rechten, veiligheid of eigendommen van onze gebruikers, het publiek of onszelf te beschermen.","h6":"6. Bewaring van gegevens","p_ret":"Foto's, video's en app-instellingen die door de App zijn gemaakt, blijven op uw apparaat totdat u ze verwijdert of de App deïnstalleert. Gegevens die door de diensten van derden in Sectie 3 worden verwerkt, worden bewaard volgens hun respectieve beleid.","h7":"7. Beveiliging","p_sec":"Wij nemen redelijke technische en organisatorische maatregelen om informatie te beschermen. Geen enkele app, transmissie of opslagsysteem is echter volledig veilig, en wij kunnen geen absolute veiligheid garanderen.","h8":"8. Privacy van kinderen","p_child":"De App is niet gericht op kinderen jonger dan 13 jaar (of de minimumleeftijd die in uw land vereist is), en wij verzamelen niet bewust persoonlijke informatie van hen. Als u denkt dat een kind ons informatie heeft verstrekt, neem dan contact met ons op en wij zullen deze verwijderen.","h9":"9. Uw rechten","p_rights":"Afhankelijk van waar u woont (bijvoorbeeld de EEA/UK onder de GDPR, of Californië onder de CCPA/CPRA), heeft u mogelijk het recht om uw persoonlijke informatie in te zien, te corrigeren, te verwijderen of het gebruik ervan te beperken, en om u af te melden voor bepaalde verwerkingen. U kunt op elk moment beheeropties op apparaatniveau uitoefenen door de locatie-, camera-, opslag- of meldingsmachtigingen van de App in te trekken in de instellingen van uw apparaat, en door uw advertentie-ID te resetten of u ervoor af te melden. Om een privacyverzoek in te dienen, neemt u contact met ons op via de onderstaande gegevens.","h10":"10. Internationale gebruikers","p_intl":"De App en de diensten van derden die deze gebruikt, kunnen informatie verwerken in andere landen dan het uwe, waar de wetgeving inzake gegevensbescherming kan verschillen. Door de App te gebruiken, stemt u in met een dergelijke verwerking in overeenstemming met dit beleid.","h11":"11. Wijzigingen in dit Privacybeleid","p_changes":"Wij kunnen dit Privacybeleid van tijd tot tijd bijwerken. Eventuele wijzigingen worden op deze pagina geplaatst met een herziene ingangsdatum, dus bekijk het regelmatig. Voortgezet gebruik van de App nadat de wijzigingen van kracht worden, betekent dat u het bijgewerkte beleid accepteert.","h12":"12. Neem contact met ons op","p_contact":"Als u vragen, verzoeken of feedback heeft over dit Privacybeleid of uw informatie, neem dan contact met ons op via:","footer":"© 2026 GO PRACHI LABS. Alle rechten voorbehouden."},"ui":{"ui_language":"Taal","ui_note":"Deze vertaling wordt aangeboden voor uw gemak. In geval van enige discrepantie is de Engelse versie de juridisch gezaghebbende versie."}},"el":{"privacy":{"title":"Πολιτική Απορρήτου","eff":"Ημερομηνία έναρξης ισχύος: 9 July 2026","intro":"Αυτή η Πολιτική Απορρήτου εξηγεί πώς η GO PRACHI LABS («εμείς», «εμάς» ή «μας») χειρίζεται τις πληροφορίες σε σχέση με την εφαρμογή για κινητά GPS Map Camera & Compass (όνομα πακέτου compass.photo.camera.map.gps.gpsmapcamera_compass) (η «Εφαρμογή»). Το απόρρητό σας έχει σημασία για εμάς. Παρακαλούμε διαβάστε προσεκτικά αυτήν την πολιτική. Χρησιμοποιώντας την Εφαρμογή, συμφωνείτε με τις πρακτικές που περιγράφονται εδώ.","note":"Με απλά λόγια: η Εφαρμογή σφραγίζει τις φωτογραφίες σας με την τοποθεσία σας, εμφανίζει μια πυξίδα και χάρτες και προβάλλει λεπτομέρειες για τον ήλιο/τη σελήνη και τον καιρό. Οι φωτογραφίες και η τοποθεσία σας επεξεργάζονται στη συσκευή σας και δεν μεταφορτώνονται στους δικούς μας διακομιστές. Χρησιμοποιούμε αξιόπιστες υπηρεσίες Google για χάρτες, διαφημίσεις, αναλυτικά στοιχεία, αναφορά σφαλμάτων, ειδοποιήσεις και αγορές, όπως περιγράφεται παρακάτω.","h1":"1. Πληροφορίες που συλλέγουμε και πώς τις χρησιμοποιούμε","h_loc":"Πληροφορίες τοποθεσίας (ακριβείς και κατά προσέγγιση)","p_loc":"Με την άδειά σας, η Εφαρμογή αποκτά πρόσβαση στην τοποθεσία GPS και δικτύου της συσκευής σας για να παρέχει τις βασικές λειτουργίες της: γεωσήμανση των φωτογραφιών και των βίντεό σας (ενσωμάτωση συντεταγμένων και διεύθυνσης στην εικόνα), εμφάνιση της θέσης σας σε χάρτη, υπολογισμός κατεύθυνσης πυξίδας, μαγνητικής απόκλισης και λεπτομερειών ήλιου/σελήνης και καιρού για την τοποθεσία σας. Η τοποθεσία επεξεργάζεται στη συσκευή σας και ενσωματώνεται στα πολυμέσα που καταγράφετε. Μπορεί να αποσταλεί στις υπηρεσίες τρίτων που αναφέρονται στην Ενότητα 3 (για παράδειγμα, για την απόδοση χαρτών ή την ανάκτηση καιρικών συνθηκών). Δεν αποθηκεύουμε την τοποθεσία σας στους δικούς μας διακομιστές.","h_cam":"Κάμερα, φωτογραφίες και πολυμέσα","p_cam":"Με την άδειά σας, η Εφαρμογή χρησιμοποιεί την κάμερά σας για τη λήψη φωτογραφιών και την εγγραφή βίντεο και διαβάζει/εγγράφει πολυμέσα ώστε να μπορεί να αποθηκεύει τις λήψεις σας στη συλλογή σας και να τις εμφανίζει στο άλμπουμ εντός της εφαρμογής. Οι φωτογραφίες και τα βίντεό σας παραμένουν στη συσκευή σας, εκτός εάν επιλέξετε να τα κοινοποιήσετε ή να τα εξαγάγετε. Δεν μεταφορτώνουμε ούτε διατηρούμε τις φωτογραφίες ή τα βίντεό σας.","h_dev":"Πληροφορίες συσκευής και χρήσης","p_dev":"Χρησιμοποιούμε το Google Analytics for Firebase και το Firebase Crashlytics για να κατανοήσουμε πώς χρησιμοποιείται η Εφαρμογή και για να διαγνώσουμε τα σφάλματα. Αυτό μπορεί να περιλαμβάνει συμβάντα εφαρμογής (όπως λειτουργίες που ανοίχτηκαν), μοντέλο συσκευής, έκδοση λειτουργικού συστήματος, έκδοση εφαρμογής, γλώσσα και γενική περιοχή/χώρα, καθώς και διαγνωστικά σφαλμάτων. Αυτό μας βοηθά να διορθώσουμε σφάλματα και να βελτιώσουμε την Εφαρμογή.","h_ad":"Διαφημιστικές πληροφορίες","p_ad":"Η δωρεάν έκδοση της Εφαρμογής εμφανίζει διαφημίσεις μέσω του Google AdMob. Το AdMob μπορεί να αποκτήσει πρόσβαση στο αναγνωριστικό διαφήμισης της συσκευής σας και σε σχετικά δεδομένα για την προβολή και τη μέτρηση διαφημίσεων, συμπεριλαμβανομένων εξατομικευμένων διαφημίσεων όπου επιτρέπεται. Δείτε την Ενότητα 4 για τις επιλογές σας σχετικά με τις διαφημίσεις.","h_notif":"Ειδοποιήσεις","p_notif":"Εάν ενεργοποιήσετε τις ειδοποιήσεις, η Εφαρμογή χρησιμοποιεί το Firebase Cloud Messaging (το οποίο δημιουργεί ένα διακριτικό push συσκευής) για την παράδοση προαιρετικών υπενθυμίσεων, όπως ειδοποιήσεις για τη χρυσή ώρα. Μπορείτε να απενεργοποιήσετε τις ειδοποιήσεις ανά πάσα στιγμή στις ρυθμίσεις της συσκευής σας.","h_purch":"Αγορές","p_purch":"Εάν αγοράσετε την προαιρετική εφάπαξ αναβάθμιση «Κατάργηση διαφημίσεων / Pro», η συναλλαγή επεξεργάζεται από το Google Play Billing. Λαμβάνουμε επιβεβαίωση ότι έγινε μια αγορά, ώστε να μπορούμε να ξεκλειδώσουμε τις λειτουργίες Pro και να τις επαναφέρουμε για εσάς. Ποτέ δεν βλέπουμε ούτε αποθηκεύουμε τα στοιχεία της κάρτας πληρωμής ή χρέωσής σας — αυτά διαχειρίζονται εξ ολοκλήρου από την Google.","h_provide":"Πληροφορίες που επιλέγετε να παρέχετε","p_provide":"Εάν μας στείλετε email (για υποστήριξη ή σχόλια), λαμβάνουμε τη διεύθυνση email και το περιεχόμενο του μηνύματος που στέλνετε και το χρησιμοποιούμε μόνο για να σας απαντήσουμε.","h2":"2. Αισθητήρες","p_sensors":"Η Εφαρμογή διαβάζει τους αισθητήρες κίνησης της συσκευής (επιταχυνσιόμετρο και μαγνητόμετρο) για να τροφοδοτεί τις λειτουργίες πυξίδας, αλφαδιού και κλίσης. Αυτά τα δεδομένα αισθητήρων χρησιμοποιούνται στη συσκευή σας σε πραγματικό χρόνο και δεν αποτελούν προσωπικές πληροφορίες σχετικά με εσάς.","h3":"3. Υπηρεσίες τρίτων","p_third_intro":"Η Εφαρμογή βασίζεται στις ακόλουθες υπηρεσίες τρίτων, καθεμία από τις οποίες διέπεται από τη δική της πολιτική απορρήτου:","tp_advertising":"(διαφήμιση)","tp_analytics":"Google Analytics for Firebase & Firebase Crashlytics","tp_notifications":"(ειδοποιήσεις)","tp_purchases":"(αγορές)","li_weather":"Ένας τρίτος πάροχος δεδομένων καιρού μπορεί να ερωτηθεί χρησιμοποιώντας την τοποθεσία σας για την εμφάνιση των τρεχουσών συνθηκών.","h4":"4. Διαφημίσεις και οι επιλογές σας","p_ads_intro":"Οι διαφημίσεις προβάλλονται από το Google AdMob. Μπορείτε να ελέγξετε την εξατομικευμένη διαφήμιση στη συσκευή σας:","li_android":"Android: Ρυθμίσεις → Google → Διαφημίσεις → εξαίρεση από / επαναφορά του αναγνωριστικού διαφήμισής σας.","li_remove":"Πλήρης κατάργηση διαφημίσεων: αγοράστε την εφάπαξ αναβάθμιση Pro στην Εφαρμογή.","h5":"5. Πώς μοιραζόμαστε πληροφορίες","p_share":"Δεν πουλάμε τις προσωπικές σας πληροφορίες. Οι πληροφορίες κοινοποιούνται μόνο στους παρόχους υπηρεσιών που αναφέρονται στην Ενότητα 3, ώστε να μπορούν να εκτελούν τις λειτουργίες τους (για παράδειγμα, την εμφάνιση χαρτών ή διαφημίσεων) και όπου απαιτείται από το νόμο, από νομική διαδικασία ή για την προστασία των δικαιωμάτων, της ασφάλειας ή της περιουσίας των χρηστών μας, του κοινού ή εμάς.","h6":"6. Διατήρηση δεδομένων","p_ret":"Οι φωτογραφίες, τα βίντεο και οι ρυθμίσεις εφαρμογής που δημιουργούνται από την Εφαρμογή παραμένουν στη συσκευή σας μέχρι να τις διαγράψετε ή να απεγκαταστήσετε την Εφαρμογή. Τα δεδομένα που διαχειρίζονται οι υπηρεσίες τρίτων στην Ενότητα 3 διατηρούνται σύμφωνα με τις αντίστοιχες πολιτικές τους.","h7":"7. Ασφάλεια","p_sec":"Λαμβάνουμε εύλογα τεχνικά και οργανωτικά μέτρα για την προστασία των πληροφοριών. Ωστόσο, καμία εφαρμογή, μετάδοση ή σύστημα αποθήκευσης δεν είναι απολύτως ασφαλές και δεν μπορούμε να εγγυηθούμε απόλυτη ασφάλεια.","h8":"8. Απόρρητο των παιδιών","p_child":"Η Εφαρμογή δεν απευθύνεται σε παιδιά κάτω των 13 ετών (ή στην ελάχιστη ηλικία που απαιτείται στη χώρα σας) και δεν συλλέγουμε εν γνώσει μας προσωπικές πληροφορίες από αυτά. Εάν πιστεύετε ότι ένα παιδί μας έχει παράσχει πληροφορίες, παρακαλούμε επικοινωνήστε μαζί μας και θα τις διαγράψουμε.","h9":"9. Τα δικαιώματά σας","p_rights":"Ανάλογα με τον τόπο διαμονής σας (για παράδειγμα, στην EEA/UK βάσει του GDPR ή στην Καλιφόρνια βάσει του CCPA/CPRA), ενδέχεται να έχετε δικαιώματα πρόσβασης, διόρθωσης, διαγραφής ή περιορισμού της χρήσης των προσωπικών σας πληροφοριών και εξαίρεσης από ορισμένες επεξεργασίες. Μπορείτε να ασκήσετε ελέγχους σε επίπεδο συσκευής ανά πάσα στιγμή ανακαλώντας τις άδειες τοποθεσίας, κάμερας, αποθήκευσης ή ειδοποιήσεων της Εφαρμογής στις ρυθμίσεις της συσκευής σας και επαναφέροντας ή εξαιρώντας το αναγνωριστικό διαφήμισής σας. Για να υποβάλετε αίτημα απορρήτου, επικοινωνήστε μαζί μας χρησιμοποιώντας τα παρακάτω στοιχεία.","h10":"10. Διεθνείς χρήστες","p_intl":"Η Εφαρμογή και οι υπηρεσίες τρίτων που χρησιμοποιεί ενδέχεται να επεξεργάζονται πληροφορίες σε χώρες διαφορετικές από τη δική σας, όπου οι νόμοι περί προστασίας δεδομένων ενδέχεται να διαφέρουν. Χρησιμοποιώντας την Εφαρμογή, συναινείτε σε τέτοια επεξεργασία σύμφωνα με αυτήν την πολιτική.","h11":"11. Αλλαγές σε αυτήν την Πολιτική Απορρήτου","p_changes":"Ενδέχεται να ενημερώνουμε αυτήν την Πολιτική Απορρήτου κατά καιρούς. Τυχόν αλλαγές θα δημοσιεύονται σε αυτήν τη σελίδα με αναθεωρημένη ημερομηνία έναρξης ισχύος, οπότε παρακαλούμε να την ελέγχετε περιοδικά. Η συνεχής χρήση της Εφαρμογής μετά την έναρξη ισχύος των αλλαγών σημαίνει ότι αποδέχεστε την ενημερωμένη πολιτική.","h12":"12. Επικοινωνήστε μαζί μας","p_contact":"Εάν έχετε ερωτήσεις, αιτήματα ή σχόλια σχετικά με αυτήν την Πολιτική Απορρήτου ή τις πληροφορίες σας, επικοινωνήστε μαζί μας στη διεύθυνση:","footer":"© 2026 GO PRACHI LABS. Με την επιφύλαξη παντός δικαιώματος."},"ui":{"ui_language":"Γλώσσα","ui_note":"Αυτή η μετάφραση παρέχεται για τη διευκόλυνσή σας. Σε περίπτωση οποιασδήποτε ασυμφωνίας, η αγγλική έκδοση είναι η νομικά έγκυρη."}},"cs":{"privacy":{"title":"Zásady ochrany osobních údajů","eff":"Datum účinnosti: 9 July 2026","intro":"Tyto Zásady ochrany osobních údajů vysvětlují, jak společnost GO PRACHI LABS („my“, „nás“ nebo „naše“) nakládá s informacemi v souvislosti s mobilní aplikací GPS Map Camera & Compass (název balíčku compass.photo.camera.map.gps.gpsmapcamera_compass) („Aplikace“). Vaše soukromí je pro nás důležité. Přečtěte si prosím tyto zásady pozorně. Používáním Aplikace souhlasíte s postupy zde popsanými.","note":"Jednoduše řečeno: Aplikace opatří vaše fotografie razítkem s vaší polohou, zobrazuje kompas a mapy a zobrazuje podrobnosti o slunci/měsíci a počasí. Vaše fotografie a poloha jsou zpracovávány ve vašem zařízení a nejsou nahrávány na naše vlastní servery. Používáme důvěryhodné služby Google pro mapy, reklamy, analýzy, hlášení chyb, oznámení a nákupy, jak je popsáno níže.","h1":"1. Informace, které shromažďujeme, a jak je používáme","h_loc":"Informace o poloze (přesné a přibližné)","p_loc":"S vaším svolením Aplikace přistupuje k poloze vašeho zařízení založené na GPS a síti, aby poskytovala své základní funkce: geografické označování vašich fotografií a videí (vložení souřadnic a adresy do obrázku), zobrazení vaší polohy na mapě, výpočet směru kompasu, magnetické deklinace a podrobností o slunci/měsíci a počasí pro vaši polohu. Poloha je zpracovávána ve vašem zařízení a vložena do média, které pořizujete. Může být odeslána službám třetích stran uvedeným v Oddílu 3 (například k vykreslení map nebo získání povětrnostních podmínek). Vaši polohu neukládáme na naše vlastní servery.","h_cam":"Fotoaparát, fotografie a média","p_cam":"S vaším svolením Aplikace používá váš fotoaparát k pořizování fotografií a nahrávání videí a čte/zapisuje média, aby mohla ukládat vaše snímky do vaší galerie a zobrazovat je v albu v aplikaci. Vaše fotografie a videa zůstávají ve vašem zařízení, pokud se je nerozhodnete sdílet nebo exportovat. Vaše fotografie ani videa nenahráváme ani neuchováváme.","h_dev":"Informace o zařízení a používání","p_dev":"Používáme Google Analytics for Firebase a Firebase Crashlytics, abychom pochopili, jak je Aplikace používána, a diagnostikovali pády. To může zahrnovat události aplikace (například otevřené funkce), model zařízení, verzi operačního systému, verzi aplikace, jazyk a obecný region/zemi a diagnostiku pádů. To nám pomáhá opravovat chyby a vylepšovat Aplikaci.","h_ad":"Reklamní informace","p_ad":"Bezplatná verze Aplikace zobrazuje reklamy prostřednictvím Google AdMob. AdMob může přistupovat k reklamnímu identifikátoru vašeho zařízení a souvisejícím údajům za účelem zobrazování a měření reklam, včetně personalizovaných reklam tam, kde je to povoleno. Vaše možnosti týkající se reklam naleznete v Oddílu 4.","h_notif":"Oznámení","p_notif":"Pokud povolíte oznámení, Aplikace používá Firebase Cloud Messaging (které generuje push token zařízení) k doručování volitelných připomenutí, jako jsou upozornění na zlatou hodinu. Oznámení můžete kdykoli vypnout v nastavení svého zařízení.","h_purch":"Nákupy","p_purch":"Pokud si zakoupíte volitelný jednorázový upgrade „Odstranit reklamy / Pro“, transakci zpracovává Google Play Billing. Obdržíme potvrzení o uskutečnění nákupu, abychom mohli odemknout funkce Pro a obnovit je pro vás. Nikdy nevidíme ani neukládáme údaje o vaší platební kartě nebo fakturaci — ty jsou zcela zpracovávány společností Google.","h_provide":"Informace, které se rozhodnete poskytnout","p_provide":"Pokud nám napíšete e-mail (pro podporu nebo zpětnou vazbu), obdržíme e-mailovou adresu a obsah zprávy, které odešlete, a použijeme je pouze k tomu, abychom vám odpověděli.","h2":"2. Snímače","p_sensors":"Aplikace čte pohybové snímače zařízení (akcelerometr a magnetometr) pro napájení funkcí kompasu, vodováhy a náklonu. Tato data ze snímačů jsou používána ve vašem zařízení v reálném čase a nejsou osobními informacemi o vás.","h3":"3. Služby třetích stran","p_third_intro":"Aplikace se spoléhá na následující služby třetích stran, z nichž každá se řídí vlastními zásadami ochrany osobních údajů:","tp_advertising":"(reklama)","tp_analytics":"Google Analytics for Firebase & Firebase Crashlytics","tp_notifications":"(oznámení)","tp_purchases":"(nákupy)","li_weather":"Poskytovatel meteorologických dat třetí strany může být dotázán pomocí vaší polohy k zobrazení aktuálních podmínek.","h4":"4. Reklamy a vaše volby","p_ads_intro":"Reklamy zobrazuje Google AdMob. Personalizovanou reklamu můžete ovládat ve svém zařízení:","li_android":"Android: Nastavení → Google → Reklamy → odhlásit se z / resetovat své reklamní ID.","li_remove":"Úplné odstranění reklam: zakupte si v Aplikaci jednorázový upgrade Pro.","h5":"5. Jak sdílíme informace","p_share":"Vaše osobní informace neprodáváme. Informace jsou sdíleny pouze s poskytovateli služeb uvedenými v Oddílu 3, aby mohli plnit své funkce (například zobrazovat mapy nebo reklamy), a tam, kde to vyžaduje zákon, právní proces nebo za účelem ochrany práv, bezpečnosti nebo majetku našich uživatelů, veřejnosti nebo nás.","h6":"6. Uchovávání dat","p_ret":"Fotografie, videa a nastavení aplikace vytvořená Aplikací zůstávají ve vašem zařízení, dokud je neodstraníte nebo Aplikaci neodinstalujete. Data zpracovávaná službami třetích stran v Oddílu 3 jsou uchovávána podle jejich příslušných zásad.","h7":"7. Bezpečnost","p_sec":"Přijímáme přiměřená technická a organizační opatření k ochraně informací. Žádná aplikace, přenos ani úložný systém však není zcela bezpečný a nemůžeme zaručit absolutní bezpečnost.","h8":"8. Soukromí dětí","p_child":"Aplikace není určena dětem mladším 13 let (nebo minimálního věku vyžadovaného ve vaší zemi) a vědomě od nich neshromažďujeme osobní informace. Pokud se domníváte, že nám dítě poskytlo informace, kontaktujte nás prosím a my je smažeme.","h9":"9. Vaše práva","p_rights":"V závislosti na tom, kde žijete (například EEA/UK podle GDPR nebo Kalifornie podle CCPA/CPRA), můžete mít práva na přístup, opravu, výmaz nebo omezení použití vašich osobních informací a na odhlášení z určitého zpracování. Ovládací prvky na úrovni zařízení můžete kdykoli uplatnit odvoláním oprávnění Aplikace k poloze, fotoaparátu, úložišti nebo oznámením v nastavení svého zařízení a resetováním nebo odhlášením svého reklamního ID. Chcete-li podat žádost o ochranu soukromí, kontaktujte nás pomocí níže uvedených údajů.","h10":"10. Mezinárodní uživatelé","p_intl":"Aplikace a služby třetích stran, které používá, mohou zpracovávat informace v jiných zemích, než je vaše, kde se zákony na ochranu údajů mohou lišit. Používáním Aplikace souhlasíte s takovým zpracováním v souladu s těmito zásadami.","h11":"11. Změny těchto Zásad ochrany osobních údajů","p_changes":"Tyto Zásady ochrany osobních údajů můžeme čas od času aktualizovat. Jakékoli změny budou zveřejněny na této stránce s revidovaným datem účinnosti, proto je prosím pravidelně kontrolujte. Pokračující používání Aplikace poté, co změny nabydou účinnosti, znamená, že přijímáte aktualizované zásady.","h12":"12. Kontaktujte nás","p_contact":"Pokud máte otázky, požadavky nebo zpětnou vazbu ohledně těchto Zásad ochrany osobních údajů nebo vašich informací, kontaktujte nás na:","footer":"© 2026 GO PRACHI LABS. Všechna práva vyhrazena."},"ui":{"ui_language":"Jazyk","ui_note":"Tento překlad je poskytován pro vaše pohodlí. V případě jakéhokoli rozporu je právně závazná anglická verze."}},"hu":{"privacy":{"title":"Adatvédelmi irányelvek","eff":"Hatálybalépés dátuma: 9 July 2026","intro":"Ez az Adatvédelmi irányelv elmagyarázza, hogyan kezeli a GO PRACHI LABS („mi”, „minket” vagy „miénk”) az információkat a GPS Map Camera & Compass mobilalkalmazással (csomagnév: compass.photo.camera.map.gps.gpsmapcamera_compass) (az „Alkalmazás”) kapcsolatban. Az Ön adatai fontosak számunkra. Kérjük, olvassa el figyelmesen ezt az irányelvet. Az Alkalmazás használatával elfogadja az itt leírt gyakorlatokat.","note":"Egyszerűen fogalmazva: az Alkalmazás rábélyegzi a helyzetét a fényképeire, iránytűt és térképeket jelenít meg, valamint nap-/hold- és időjárási részleteket mutat. Fényképeit és helyzetét az eszközén dolgozza fel, és nem tölti fel a saját szervereinkre. Megbízható Google-szolgáltatásokat használunk térképekhez, hirdetésekhez, elemzésekhez, összeomlás-jelentésekhez, értesítésekhez és vásárlásokhoz, az alábbiakban leírtak szerint.","h1":"1. Az általunk gyűjtött információk és felhasználásuk módja","h_loc":"Helyadatok (pontos és hozzávetőleges)","p_loc":"Az Ön engedélyével az Alkalmazás hozzáfér eszközének GPS- és hálózatalapú helyzetéhez, hogy biztosítsa alapvető funkcióit: fényképeinek és videóinak geocímkézése (koordináták és cím beágyazása a képbe), helyzetének megjelenítése egy térképen, az iránytű irányának, a mágneses deklinációnak, valamint a nap-/hold- és időjárási részleteknek a kiszámítása az Ön helyzetéhez. A helyzet az eszközén kerül feldolgozásra, és beágyazódik a rögzített médiába. Elküldhető a 3. szakaszban felsorolt harmadik felek szolgáltatásainak (például térképek megjelenítéséhez vagy időjárási viszonyok lekéréséhez). Helyzetét nem tároljuk a saját szervereinken.","h_cam":"Kamera, fényképek és média","p_cam":"Az Ön engedélyével az Alkalmazás a kameráját használja fényképek készítéséhez és videók rögzítéséhez, valamint médiát olvas/ír, hogy elmenthesse felvételeit a galériájába, és megjeleníthesse azokat az alkalmazáson belüli albumban. Fényképei és videói az eszközén maradnak, hacsak Ön nem dönt úgy, hogy megosztja vagy exportálja azokat. Fényképeit vagy videóit nem töltjük fel és nem tároljuk.","h_dev":"Eszköz- és használati információk","p_dev":"A Google Analytics for Firebase és a Firebase Crashlytics szolgáltatásokat használjuk annak megértéséhez, hogyan használják az Alkalmazást, és az összeomlások diagnosztizálásához. Ez magában foglalhat alkalmazáseseményeket (például megnyitott funkciókat), az eszköz modelljét, az operációs rendszer verzióját, az alkalmazás verzióját, a nyelvet és az általános régiót/országot, valamint az összeomlások diagnosztikáját. Ez segít nekünk a hibák kijavításában és az Alkalmazás fejlesztésében.","h_ad":"Hirdetési információk","p_ad":"Az Alkalmazás ingyenes verziója hirdetéseket jelenít meg a Google AdMob révén. Az AdMob hozzáférhet eszközének hirdetési azonosítójához és a kapcsolódó adatokhoz a hirdetések megjelenítése és mérése céljából, beleértve a személyre szabott hirdetéseket is, ahol ez engedélyezett. Hirdetési lehetőségeit a 4. szakaszban találja.","h_notif":"Értesítések","p_notif":"Ha engedélyezi az értesítéseket, az Alkalmazás a Firebase Cloud Messaging szolgáltatást használja (amely egy eszköz push-tokent generál) opcionális emlékeztetők, például aranyóra-riasztások kézbesítéséhez. Az értesítéseket bármikor kikapcsolhatja eszközének beállításaiban.","h_purch":"Vásárlások","p_purch":"Ha megvásárolja az opcionális egyszeri „Hirdetések eltávolítása / Pro” frissítést, a tranzakciót a Google Play Billing dolgozza fel. Visszaigazolást kapunk arról, hogy vásárlás történt, hogy feloldhassuk a Pro funkciókat, és visszaállíthassuk azokat az Ön számára. Soha nem látjuk és nem tároljuk fizetési kártyája vagy számlázási adatait — ezeket teljes egészében a Google kezeli.","h_provide":"Az Ön által megadni választott információk","p_provide":"Ha e-mailt küld nekünk (támogatás vagy visszajelzés céljából), megkapjuk az Ön által küldött e-mail-címet és üzenettartalmat, és csak arra használjuk, hogy válaszoljunk Önnek.","h2":"2. Érzékelők","p_sensors":"Az Alkalmazás beolvassa az eszköz mozgásérzékelőit (gyorsulásmérő és magnetométer) az iránytű, a vízszintmérő és a dőlésszög funkciók működtetéséhez. Ezeket az érzékelőadatokat valós időben használják az eszközén, és nem az Önre vonatkozó személyes információk.","h3":"3. Harmadik felek szolgáltatásai","p_third_intro":"Az Alkalmazás a következő harmadik felek szolgáltatásaira támaszkodik, amelyek mindegyikét saját adatvédelmi irányelv szabályozza:","tp_advertising":"(hirdetés)","tp_analytics":"Google Analytics for Firebase & Firebase Crashlytics","tp_notifications":"(értesítések)","tp_purchases":"(vásárlások)","li_weather":"Egy harmadik fél időjárási adatszolgáltatóját lekérdezhetik az Ön helyzete alapján az aktuális viszonyok megjelenítéséhez.","h4":"4. Hirdetések és az Ön választásai","p_ads_intro":"A hirdetéseket a Google AdMob jeleníti meg. A személyre szabott hirdetéseket eszközén szabályozhatja:","li_android":"Android: Beállítások → Google → Hirdetések → hirdetési azonosító letiltása / visszaállítása.","li_remove":"A hirdetések teljes eltávolítása: vásárolja meg az egyszeri Pro frissítést az Alkalmazásban.","h5":"5. Hogyan osztjuk meg az információkat","p_share":"Nem adjuk el az Ön személyes adatait. Az információkat csak a 3. szakaszban felsorolt szolgáltatókkal osztjuk meg, hogy elláthassák feladataikat (például térképek vagy hirdetések megjelenítése), valamint ahol azt a törvény, jogi eljárás írja elő, vagy felhasználóink, a nyilvánosság vagy magunk jogainak, biztonságának vagy tulajdonának védelme érdekében.","h6":"6. Adatmegőrzés","p_ret":"Az Alkalmazás által létrehozott fényképek, videók és alkalmazásbeállítások az eszközén maradnak, amíg nem törli őket, vagy el nem távolítja az Alkalmazást. A 3. szakaszban szereplő harmadik felek szolgáltatásai által kezelt adatokat az adott irányelveiknek megfelelően őrzik meg.","h7":"7. Biztonság","p_sec":"Ésszerű technikai és szervezési intézkedéseket teszünk az információk védelme érdekében. Azonban egyetlen alkalmazás, átvitel vagy tárolórendszer sem teljesen biztonságos, és nem tudunk abszolút biztonságot garantálni.","h8":"8. Gyermekek adatvédelme","p_child":"Az Alkalmazás nem 13 év alatti gyermekeknek (vagy az Ön országában előírt minimális életkor) szól, és tudatosan nem gyűjtünk tőlük személyes információkat. Ha úgy gondolja, hogy egy gyermek adatokat adott át nekünk, kérjük, lépjen kapcsolatba velünk, és töröljük azokat.","h9":"9. Az Ön jogai","p_rights":"Attól függően, hogy hol él (például EEA/UK a GDPR értelmében, vagy Kalifornia a CCPA/CPRA értelmében), jogosult lehet személyes adataihoz való hozzáférésre, azok helyesbítésére, törlésére vagy felhasználásuk korlátozására, valamint bizonyos adatkezelésekről való leiratkozásra. Az eszközszintű vezérlőket bármikor gyakorolhatja az Alkalmazás helymeghatározási, kamera-, tárolási vagy értesítési engedélyeinek visszavonásával eszközének beállításaiban, valamint hirdetési azonosítójának visszaállításával vagy letiltásával. Adatvédelmi kérelem benyújtásához lépjen kapcsolatba velünk az alábbi adatok segítségével.","h10":"10. Nemzetközi felhasználók","p_intl":"Az Alkalmazás és az általa használt harmadik felek szolgáltatásai az Önétől eltérő országokban is feldolgozhatnak információkat, ahol az adatvédelmi törvények eltérhetnek. Az Alkalmazás használatával hozzájárul az ilyen, a jelen irányelvvel összhangban történő adatkezeléshez.","h11":"11. A jelen Adatvédelmi irányelv módosításai","p_changes":"Időről időre frissíthetjük ezt az Adatvédelmi irányelvet. Bármilyen módosítás felkerül erre az oldalra egy módosított hatálybalépési dátummal, ezért kérjük, rendszeresen tekintse át. Az Alkalmazás további használata a módosítások hatálybalépése után azt jelenti, hogy elfogadja a frissített irányelvet.","h12":"12. Kapcsolatfelvétel","p_contact":"Ha kérdése, kérése vagy visszajelzése van a jelen Adatvédelmi irányelvvel vagy adataival kapcsolatban, lépjen kapcsolatba velünk a következő címen:","footer":"© 2026 GO PRACHI LABS. Minden jog fenntartva."},"ui":{"ui_language":"Nyelv","ui_note":"Ezt a fordítást az Ön kényelme érdekében biztosítjuk. Bármilyen eltérés esetén az angol változat a jogilag hiteles."}},"sv":{"privacy":{"title":"Integritetspolicy","eff":"Ikraftträdandedatum: 9 July 2026","intro":"Denna integritetspolicy förklarar hur GO PRACHI LABS (”vi”, ”oss” eller ”vår”) hanterar information i samband med mobilappen GPS Map Camera & Compass (paketnamn compass.photo.camera.map.gps.gpsmapcamera_compass) (”Appen”). Din integritet är viktig för oss. Läs denna policy noggrant. Genom att använda Appen godkänner du de metoder som beskrivs här.","note":"Enkelt uttryckt: Appen stämplar dina foton med din plats, visar en kompass och kartor samt visar detaljer om sol/måne och väder. Dina foton och din plats behandlas på din enhet och laddas inte upp till våra egna servrar. Vi använder betrodda Google-tjänster för kartor, annonser, analys, kraschrapportering, aviseringar och köp, enligt beskrivningen nedan.","h1":"1. Information vi samlar in och hur vi använder den","h_loc":"Platsinformation (exakt och ungefärlig)","p_loc":"Med ditt tillstånd får Appen tillgång till din enhets GPS- och nätverksbaserade plats för att tillhandahålla sina kärnfunktioner: geotaggning av dina foton och videor (inbäddning av koordinater och adress i bilden), visning av din position på en karta, beräkning av kompassriktning, magnetisk missvisning samt sol-/mån- och väderdetaljer för din plats. Platsen behandlas på din enhet och bäddas in i det media du fångar. Den kan skickas till de tredjepartstjänster som anges i avsnitt 3 (till exempel för att rendera kartor eller hämta väderförhållanden). Vi lagrar inte din plats på våra egna servrar.","h_cam":"Kamera, foton och media","p_cam":"Med ditt tillstånd använder Appen din kamera för att ta foton och spela in videor, och läser/skriver media så att den kan spara dina tagningar i ditt galleri och visa dem i albumet i appen. Dina foton och videor finns kvar på din enhet om du inte väljer att dela eller exportera dem. Vi laddar inte upp eller behåller dina foton eller videor.","h_dev":"Enhets- och användningsinformation","p_dev":"Vi använder Google Analytics for Firebase och Firebase Crashlytics för att förstå hur Appen används och för att diagnostisera krascher. Detta kan inkludera apphändelser (t.ex. öppnade funktioner), enhetsmodell, operativsystemversion, appversion, språk och allmän region/land samt kraschdiagnostik. Detta hjälper oss att åtgärda buggar och förbättra Appen.","h_ad":"Annonsinformation","p_ad":"Den kostnadsfria versionen av Appen visar annonser via Google AdMob. AdMob kan komma åt din enhets annonseringsidentifierare och relaterade data för att visa och mäta annonser, inklusive personanpassade annonser där det är tillåtet. Se avsnitt 4 för dina annonsval.","h_notif":"Aviseringar","p_notif":"Om du aktiverar aviseringar använder Appen Firebase Cloud Messaging (som genererar en push-token för enheten) för att leverera valfria påminnelser, till exempel varningar om den gyllene timmen. Du kan stänga av aviseringar när som helst i din enhets inställningar.","h_purch":"Köp","p_purch":"Om du köper den valfria engångsuppgraderingen ”Ta bort annonser / Pro” behandlas transaktionen av Google Play Billing. Vi får en bekräftelse på att ett köp har gjorts så att vi kan låsa upp Pro-funktioner och återställa dem åt dig. Vi ser eller lagrar aldrig dina betalkorts- eller faktureringsuppgifter — de hanteras helt av Google.","h_provide":"Information du väljer att lämna","p_provide":"Om du mejlar oss (för support eller feedback) får vi den e-postadress och det meddelandeinnehåll du skickar, och använder det endast för att svara dig.","h2":"2. Sensorer","p_sensors":"Appen läser enhetens rörelsesensorer (accelerometer och magnetometer) för att driva kompass-, vattenpass- och lutningsfunktionerna. Dessa sensordata används på din enhet i realtid och är inte personlig information om dig.","h3":"3. Tredjepartstjänster","p_third_intro":"Appen förlitar sig på följande tredjepartstjänster, som var och en regleras av sin egen integritetspolicy:","tp_advertising":"(annonsering)","tp_analytics":"Google Analytics for Firebase & Firebase Crashlytics","tp_notifications":"(aviseringar)","tp_purchases":"(köp)","li_weather":"En tredjepartsleverantör av väderdata kan förfrågas med hjälp av din plats för att visa aktuella förhållanden.","h4":"4. Annonser och dina val","p_ads_intro":"Annonser visas av Google AdMob. Du kan styra personanpassad annonsering på din enhet:","li_android":"Android: Inställningar → Google → Annonser → välj bort / återställ ditt annons-ID.","li_remove":"Ta bort annonser helt: köp engångsuppgraderingen Pro i Appen.","h5":"5. Hur vi delar information","p_share":"Vi säljer inte din personliga information. Information delas endast med de tjänsteleverantörer som anges i avsnitt 3 så att de kan utföra sina funktioner (till exempel visa kartor eller annonser), och där det krävs enligt lag, rättslig process, eller för att skydda våra användares, allmänhetens eller våra rättigheter, säkerhet eller egendom.","h6":"6. Datalagring","p_ret":"Foton, videor och appinställningar som skapats av Appen finns kvar på din enhet tills du raderar dem eller avinstallerar Appen. Data som hanteras av tredjepartstjänsterna i avsnitt 3 behålls enligt deras respektive policyer.","h7":"7. Säkerhet","p_sec":"Vi vidtar rimliga tekniska och organisatoriska åtgärder för att skydda information. Ingen app, överföring eller lagringssystem är dock helt säker, och vi kan inte garantera absolut säkerhet.","h8":"8. Barns integritet","p_child":"Appen är inte riktad till barn under 13 år (eller den lägsta ålder som krävs i ditt land), och vi samlar inte medvetet in personlig information från dem. Om du tror att ett barn har lämnat oss information, kontakta oss så raderar vi den.","h9":"9. Dina rättigheter","p_rights":"Beroende på var du bor (till exempel EEA/UK enligt GDPR, eller Kalifornien enligt CCPA/CPRA) kan du ha rättigheter att få tillgång till, korrigera, radera eller begränsa användningen av din personliga information, samt att välja bort viss behandling. Du kan utöva kontroller på enhetsnivå när som helst genom att återkalla Appens behörigheter för plats, kamera, lagring eller aviseringar i din enhets inställningar, och genom att återställa eller välja bort ditt annons-ID. För att göra en integritetsförfrågan, kontakta oss med hjälp av uppgifterna nedan.","h10":"10. Internationella användare","p_intl":"Appen och de tredjepartstjänster den använder kan behandla information i andra länder än ditt eget, där dataskyddslagarna kan skilja sig åt. Genom att använda Appen samtycker du till sådan behandling i enlighet med denna policy.","h11":"11. Ändringar av denna integritetspolicy","p_changes":"Vi kan uppdatera denna integritetspolicy från tid till annan. Eventuella ändringar kommer att publiceras på denna sida med ett reviderat ikraftträdandedatum, så granska den regelbundet. Fortsatt användning av Appen efter att ändringarna träder i kraft innebär att du accepterar den uppdaterade policyn.","h12":"12. Kontakta oss","p_contact":"Om du har frågor, förfrågningar eller feedback om denna integritetspolicy eller din information, kontakta oss på:","footer":"© 2026 GO PRACHI LABS. Alla rättigheter förbehållna."},"ui":{"ui_language":"Språk","ui_note":"Denna översättning tillhandahålls för din bekvämlighet. Vid eventuella avvikelser är den engelska versionen den juridiskt gällande."}},"da":{"privacy":{"title":"Privatlivspolitik","eff":"Ikrafttrædelsesdato: 9 July 2026","intro":"Denne privatlivspolitik forklarer, hvordan GO PRACHI LABS (”vi”, ”os” eller ”vores”) håndterer oplysninger i forbindelse med mobilappen GPS Map Camera & Compass (pakkenavn compass.photo.camera.map.gps.gpsmapcamera_compass) (”Appen”). Dit privatliv betyder noget for os. Læs venligst denne politik omhyggeligt. Ved at bruge Appen accepterer du de praksisser, der er beskrevet her.","note":"Kort sagt: Appen stempler dine billeder med din placering, viser et kompas og kort samt viser detaljer om sol/måne og vejr. Dine billeder og din placering behandles på din enhed og uploades ikke til vores egne servere. Vi bruger betroede Google-tjenester til kort, annoncer, analyser, nedbrudsrapportering, notifikationer og køb, som beskrevet nedenfor.","h1":"1. Oplysninger, vi indsamler, og hvordan vi bruger dem","h_loc":"Placeringsoplysninger (præcise og omtrentlige)","p_loc":"Med din tilladelse får Appen adgang til din enheds GPS- og netværksbaserede placering for at levere sine kernefunktioner: geotagging af dine billeder og videoer (indlejring af koordinater og adresse i billedet), visning af din position på et kort, beregning af kompasretning, magnetisk misvisning samt sol-/måne- og vejrdetaljer for din placering. Placeringen behandles på din enhed og indlejres i det medie, du optager. Den kan sendes til de tredjepartstjenester, der er anført i afsnit 3 (for eksempel for at gengive kort eller hente vejrforhold). Vi gemmer ikke din placering på vores egne servere.","h_cam":"Kamera, billeder og medier","p_cam":"Med din tilladelse bruger Appen dit kamera til at tage billeder og optage videoer, og læser/skriver medier, så den kan gemme dine optagelser i dit galleri og vise dem i albummet i appen. Dine billeder og videoer forbliver på din enhed, medmindre du vælger at dele eller eksportere dem. Vi uploader eller opbevarer ikke dine billeder eller videoer.","h_dev":"Enheds- og brugsoplysninger","p_dev":"Vi bruger Google Analytics for Firebase og Firebase Crashlytics til at forstå, hvordan Appen bruges, og til at diagnosticere nedbrud. Dette kan omfatte apphændelser (såsom åbnede funktioner), enhedsmodel, operativsystemversion, appversion, sprog og generel region/land samt nedbrudsdiagnostik. Dette hjælper os med at rette fejl og forbedre Appen.","h_ad":"Annonceoplysninger","p_ad":"Den gratis version af Appen viser annoncer gennem Google AdMob. AdMob kan få adgang til din enheds annoncerings-id og relaterede data for at vise og måle annoncer, herunder personaliserede annoncer, hvor det er tilladt. Se afsnit 4 for dine annoncevalg.","h_notif":"Notifikationer","p_notif":"Hvis du aktiverer notifikationer, bruger Appen Firebase Cloud Messaging (som genererer et push-token for enheden) til at levere valgfrie påmindelser, såsom advarsler om den gyldne time. Du kan slå notifikationer fra når som helst i din enheds indstillinger.","h_purch":"Køb","p_purch":"Hvis du køber den valgfri engangsopgradering ”Fjern annoncer / Pro”, behandles transaktionen af Google Play Billing. Vi modtager en bekræftelse på, at der er foretaget et køb, så vi kan låse Pro-funktioner op og gendanne dem for dig. Vi ser eller gemmer aldrig dine betalingskort- eller faktureringsoplysninger — disse håndteres udelukkende af Google.","h_provide":"Oplysninger, du vælger at give","p_provide":"Hvis du sender os en e-mail (for support eller feedback), modtager vi den e-mailadresse og det beskedindhold, du sender, og bruger det kun til at svare dig.","h2":"2. Sensorer","p_sensors":"Appen læser enhedens bevægelsessensorer (accelerometer og magnetometer) for at drive kompas-, vaterpas- og hældningsfunktionerne. Disse sensordata bruges på din enhed i realtid og er ikke personlige oplysninger om dig.","h3":"3. Tredjepartstjenester","p_third_intro":"Appen er afhængig af følgende tredjepartstjenester, som hver især er underlagt deres egen privatlivspolitik:","tp_advertising":"(annoncering)","tp_analytics":"Google Analytics for Firebase & Firebase Crashlytics","tp_notifications":"(notifikationer)","tp_purchases":"(køb)","li_weather":"En tredjepartsudbyder af vejrdata kan blive forespurgt ved hjælp af din placering for at vise de aktuelle forhold.","h4":"4. Annoncer og dine valg","p_ads_intro":"Annoncer vises af Google AdMob. Du kan styre personaliseret annoncering på din enhed:","li_android":"Android: Indstillinger → Google → Annoncer → fravælg / nulstil dit annoncerings-id.","li_remove":"Fjern annoncer helt: køb engangsopgraderingen Pro i Appen.","h5":"5. Hvordan vi deler oplysninger","p_share":"Vi sælger ikke dine personlige oplysninger. Oplysninger deles kun med de tjenesteudbydere, der er anført i afsnit 3, så de kan udføre deres funktioner (for eksempel vise kort eller annoncer), og hvor det er påkrævet ved lov, retslig proces, eller for at beskytte vores brugeres, offentlighedens eller vores rettigheder, sikkerhed eller ejendom.","h6":"6. Dataopbevaring","p_ret":"Billeder, videoer og appindstillinger, der er oprettet af Appen, forbliver på din enhed, indtil du sletter dem eller afinstallerer Appen. Data, der håndteres af tredjepartstjenesterne i afsnit 3, opbevares i henhold til deres respektive politikker.","h7":"7. Sikkerhed","p_sec":"Vi træffer rimelige tekniske og organisatoriske foranstaltninger for at beskytte oplysninger. Ingen app, transmission eller lagringssystem er dog fuldstændig sikker, og vi kan ikke garantere absolut sikkerhed.","h8":"8. Børns privatliv","p_child":"Appen er ikke rettet mod børn under 13 år (eller den mindstealder, der kræves i dit land), og vi indsamler ikke bevidst personlige oplysninger fra dem. Hvis du mener, at et barn har givet os oplysninger, bedes du kontakte os, og vi vil slette dem.","h9":"9. Dine rettigheder","p_rights":"Afhængigt af hvor du bor (for eksempel EEA/UK under GDPR eller Californien under CCPA/CPRA), kan du have ret til at få adgang til, rette, slette eller begrænse brugen af dine personlige oplysninger og til at fravælge visse behandlinger. Du kan udøve kontroller på enhedsniveau når som helst ved at tilbagekalde Appens tilladelser til placering, kamera, lagring eller notifikationer i din enheds indstillinger og ved at nulstille eller fravælge dit annoncerings-id. For at fremsætte en anmodning om privatliv, kontakt os ved hjælp af oplysningerne nedenfor.","h10":"10. Internationale brugere","p_intl":"Appen og de tredjepartstjenester, den bruger, kan behandle oplysninger i andre lande end dit eget, hvor databeskyttelseslovene kan være forskellige. Ved at bruge Appen samtykker du til en sådan behandling i overensstemmelse med denne politik.","h11":"11. Ændringer af denne privatlivspolitik","p_changes":"Vi kan opdatere denne privatlivspolitik fra tid til anden. Eventuelle ændringer vil blive offentliggjort på denne side med en revideret ikrafttrædelsesdato, så gennemgå den venligst med jævne mellemrum. Fortsat brug af Appen, efter at ændringerne træder i kraft, betyder, at du accepterer den opdaterede politik.","h12":"12. Kontakt os","p_contact":"Hvis du har spørgsmål, anmodninger eller feedback om denne privatlivspolitik eller dine oplysninger, kan du kontakte os på:","footer":"© 2026 GO PRACHI LABS. Alle rettigheder forbeholdes."},"ui":{"ui_language":"Sprog","ui_note":"Denne oversættelse leveres for din bekvemmeligheds skyld. I tilfælde af enhver uoverensstemmelse er den engelske version den juridisk gældende."}},"tr":{"privacy":{"title":"Gizlilik Politikası","eff":"Yürürlük tarihi: 9 July 2026","intro":"Bu Gizlilik Politikası, GO PRACHI LABS'ın (“biz”, “bize” veya “bizim”) GPS Map Camera & Compass adlı mobil uygulama (paket adı compass.photo.camera.map.gps.gpsmapcamera_compass) (“Uygulama”) ile bağlantılı olarak bilgileri nasıl işlediğini açıklar. Gizliliğiniz bizim için önemlidir. Lütfen bu politikayı dikkatlice okuyun. Uygulamayı kullanarak burada açıklanan uygulamaları kabul etmiş olursunuz.","note":"Basitçe ifade etmek gerekirse: Uygulama fotoğraflarınıza konumunuzu damgalar, bir pusula ve haritalar gösterir ve güneş/ay ile hava durumu ayrıntılarını görüntüler. Fotoğraflarınız ve konumunuz cihazınızda işlenir ve kendi sunucularımıza yüklenmez. Aşağıda açıklandığı gibi haritalar, reklamlar, analiz, çökme raporlama, bildirimler ve satın alımlar için güvenilir Google hizmetlerini kullanırız.","h1":"1. Topladığımız bilgiler ve bunları nasıl kullandığımız","h_loc":"Konum bilgileri (kesin ve yaklaşık)","p_loc":"İzniniz doğrultusunda, Uygulama temel özelliklerini sunmak için cihazınızın GPS ve ağ tabanlı konumuna erişir: fotoğraflarınızı ve videolarınızı coğrafi etiketleme (koordinatları ve adresi görüntüye gömme), konumunuzu bir haritada gösterme, pusula yönünü, manyetik sapmayı ve konumunuz için güneş/ay ile hava durumu ayrıntılarını hesaplama. Konum cihazınızda işlenir ve çektiğiniz medyaya gömülür. Bölüm 3'te listelenen üçüncü taraf hizmetlere gönderilebilir (örneğin, haritaları oluşturmak veya hava durumu koşullarını almak için). Konumunuzu kendi sunucularımızda saklamıyoruz.","h_cam":"Kamera, fotoğraflar ve medya","p_cam":"İzniniz doğrultusunda, Uygulama fotoğraf çekmek ve video kaydetmek için kameranızı kullanır ve çekimlerinizi galerinize kaydedebilmek ve uygulama içi albümde görüntüleyebilmek için medyayı okur/yazar. Fotoğraflarınız ve videolarınız, siz paylaşmayı veya dışa aktarmayı seçmediğiniz sürece cihazınızda kalır. Fotoğraflarınızı veya videolarınızı yüklemiyor veya saklamıyoruz.","h_dev":"Cihaz ve kullanım bilgileri","p_dev":"Uygulamanın nasıl kullanıldığını anlamak ve çökmeleri teşhis etmek için Google Analytics for Firebase ve Firebase Crashlytics kullanırız. Bu, uygulama etkinliklerini (açılan özellikler gibi), cihaz modelini, işletim sistemi sürümünü, uygulama sürümünü, dili ve genel bölge/ülkeyi ve çökme tanılarını içerebilir. Bu, hataları düzeltmemize ve Uygulamayı geliştirmemize yardımcı olur.","h_ad":"Reklam bilgileri","p_ad":"Uygulamanın ücretsiz sürümü Google AdMob aracılığıyla reklam gösterir. AdMob, izin verilen yerlerde kişiselleştirilmiş reklamlar dahil olmak üzere reklamları sunmak ve ölçmek için cihazınızın reklam tanımlayıcısına ve ilgili verilere erişebilir. Reklam seçenekleriniz için Bölüm 4'e bakın.","h_notif":"Bildirimler","p_notif":"Bildirimleri etkinleştirirseniz, Uygulama altın saat uyarıları gibi isteğe bağlı hatırlatıcıları iletmek için Firebase Cloud Messaging'i (bir cihaz push jetonu oluşturur) kullanır. Bildirimleri cihaz ayarlarınızdan istediğiniz zaman kapatabilirsiniz.","h_purch":"Satın alımlar","p_purch":"İsteğe bağlı tek seferlik “Reklamları Kaldır / Pro” yükseltmesini satın alırsanız, işlem Google Play Billing tarafından gerçekleştirilir. Pro özelliklerini açabilmemiz ve sizin için geri yükleyebilmemiz için bir satın alma yapıldığına dair onay alırız. Ödeme kartınızı veya faturalandırma ayrıntılarınızı asla görmez veya saklamayız — bunlar tamamen Google tarafından işlenir.","h_provide":"Sağlamayı seçtiğiniz bilgiler","p_provide":"Bize e-posta gönderirseniz (destek veya geri bildirim için), gönderdiğiniz e-posta adresini ve mesaj içeriğini alırız ve bunu yalnızca size yanıt vermek için kullanırız.","h2":"2. Sensörler","p_sensors":"Uygulama, pusula, seviye ve eğim özelliklerini çalıştırmak için cihaz hareket sensörlerini (ivmeölçer ve manyetometre) okur. Bu sensör verileri cihazınızda gerçek zamanlı olarak kullanılır ve hakkınızdaki kişisel bilgiler değildir.","h3":"3. Üçüncü taraf hizmetleri","p_third_intro":"Uygulama, her biri kendi gizlilik politikasına tabi olan aşağıdaki üçüncü taraf hizmetlerine dayanır:","tp_advertising":"(reklamcılık)","tp_analytics":"Google Analytics for Firebase & Firebase Crashlytics","tp_notifications":"(bildirimler)","tp_purchases":"(satın alımlar)","li_weather":"Mevcut koşulları görüntülemek için konumunuz kullanılarak bir üçüncü taraf hava durumu veri sağlayıcısına sorgu gönderilebilir.","h4":"4. Reklamlar ve seçenekleriniz","p_ads_intro":"Reklamlar Google AdMob tarafından sunulur. Cihazınızda kişiselleştirilmiş reklamları kontrol edebilirsiniz:","li_android":"Android: Ayarlar → Google → Reklamlar → reklam kimliğinizi devre dışı bırakın / sıfırlayın.","li_remove":"Reklamları tamamen kaldırma: Uygulamada tek seferlik Pro yükseltmesini satın alın.","h5":"5. Bilgileri nasıl paylaşırız","p_share":"Kişisel bilgilerinizi satmıyoruz. Bilgiler yalnızca Bölüm 3'te listelenen hizmet sağlayıcılarla işlevlerini yerine getirebilmeleri için (örneğin, harita veya reklam göstermek için) ve yasaların, yasal süreçlerin gerektirdiği durumlarda veya kullanıcılarımızın, kamunun ya da bizim haklarımızı, güvenliğimizi veya mülkiyetimizi korumak için paylaşılır.","h6":"6. Veri saklama","p_ret":"Uygulama tarafından oluşturulan fotoğraflar, videolar ve uygulama ayarları, siz bunları silene veya Uygulamayı kaldırana kadar cihazınızda kalır. Bölüm 3'teki üçüncü taraf hizmetler tarafından işlenen veriler, kendi politikalarına göre saklanır.","h7":"7. Güvenlik","p_sec":"Bilgileri korumak için makul teknik ve organizasyonel önlemler alıyoruz. Ancak hiçbir uygulama, iletim veya depolama sistemi tamamen güvenli değildir ve mutlak güvenliği garanti edemeyiz.","h8":"8. Çocukların gizliliği","p_child":"Uygulama 13 yaşın altındaki (veya ülkenizde gereken asgari yaşın altındaki) çocuklara yönelik değildir ve onlardan bilerek kişisel bilgi toplamıyoruz. Bir çocuğun bize bilgi verdiğine inanıyorsanız, lütfen bizimle iletişime geçin, biz de bunu sileceğiz.","h9":"9. Haklarınız","p_rights":"Yaşadığınız yere bağlı olarak (örneğin, GDPR kapsamında EEA/UK veya CCPA/CPRA kapsamında Kaliforniya), kişisel bilgilerinize erişme, düzeltme, silme veya kullanımını kısıtlama ve belirli işlemleri devre dışı bırakma haklarına sahip olabilirsiniz. Cihaz düzeyindeki kontrolleri, cihaz ayarlarınızdan Uygulamanın konum, kamera, depolama veya bildirim izinlerini iptal ederek ve reklam kimliğinizi sıfırlayarak veya devre dışı bırakarak istediğiniz zaman kullanabilirsiniz. Gizlilik talebinde bulunmak için aşağıdaki bilgileri kullanarak bizimle iletişime geçin.","h10":"10. Uluslararası kullanıcılar","p_intl":"Uygulama ve kullandığı üçüncü taraf hizmetler, veri koruma yasalarının farklı olabileceği kendi ülkeniz dışındaki ülkelerde bilgileri işleyebilir. Uygulamayı kullanarak bu tür bir işlemeyi bu politikayla tutarlı olarak kabul etmiş olursunuz.","h11":"11. Bu Gizlilik Politikasındaki değişiklikler","p_changes":"Bu Gizlilik Politikasını zaman zaman güncelleyebiliriz. Herhangi bir değişiklik, revize edilmiş bir yürürlük tarihiyle bu sayfada yayınlanacaktır, bu nedenle lütfen periyodik olarak gözden geçirin. Değişiklikler yürürlüğe girdikten sonra Uygulamayı kullanmaya devam etmeniz, güncellenmiş politikayı kabul ettiğiniz anlamına gelir.","h12":"12. Bize ulaşın","p_contact":"Bu Gizlilik Politikası veya bilgileriniz hakkında sorularınız, talepleriniz veya geri bildirimleriniz varsa, bizimle şu adresten iletişime geçin:","footer":"© 2026 GO PRACHI LABS. Tüm hakları saklıdır."},"ui":{"ui_language":"Dil","ui_note":"Bu çeviri kolaylık sağlamak amacıyla sunulmuştur. Herhangi bir tutarsızlık durumunda, yasal olarak geçerli olan İngilizce sürümdür."}},"ar":{"privacy":{"title":"سياسة الخصوصية","eff":"تاريخ السريان: 9 July 2026","intro":"توضح سياسة الخصوصية هذه كيفية تعامل GO PRACHI LABS (\"نحن\" أو \"لنا\" أو \"خاصتنا\") مع المعلومات المتعلقة بتطبيق الهاتف المحمول GPS Map Camera & Compass (اسم الحزمة compass.photo.camera.map.gps.gpsmapcamera_compass) (\"التطبيق\"). خصوصيتك تهمنا. يُرجى قراءة هذه السياسة بعناية. باستخدامك للتطبيق، فإنك توافق على الممارسات الموضحة هنا.","note":"بعبارة بسيطة: يقوم التطبيق بختم صورك بموقعك، ويعرض بوصلة وخرائط، ويعرض تفاصيل الشمس/القمر والطقس. تتم معالجة صورك وموقعك على جهازك ولا يتم تحميلها إلى خوادمنا الخاصة. نستخدم خدمات Google الموثوقة للخرائط والإعلانات والتحليلات والإبلاغ عن الأعطال والإشعارات والمشتريات، كما هو موضح أدناه.","h1":"1. المعلومات التي نجمعها وكيفية استخدامنا لها","h_loc":"معلومات الموقع (الدقيقة والتقريبية)","p_loc":"بإذنك، يصل التطبيق إلى موقع جهازك المستند إلى GPS والشبكة لتوفير ميزاته الأساسية: وضع علامة جغرافية على صورك ومقاطع الفيديو الخاصة بك (تضمين الإحداثيات والعنوان في الصورة)، وإظهار موقعك على الخريطة، وحساب اتجاه البوصلة، والانحراف المغناطيسي، وتفاصيل الشمس/القمر والطقس لموقعك. تتم معالجة الموقع على جهازك وتضمينه في الوسائط التي تلتقطها. قد يتم إرساله إلى خدمات الطرف الثالث المدرجة في القسم 3 (على سبيل المثال، لعرض الخرائط أو استرداد ظروف الطقس). نحن لا نخزّن موقعك على خوادمنا الخاصة.","h_cam":"الكاميرا والصور والوسائط","p_cam":"بإذنك، يستخدم التطبيق الكاميرا الخاصة بك لالتقاط الصور وتسجيل مقاطع الفيديو، ويقرأ/يكتب الوسائط حتى يتمكن من حفظ لقطاتك في معرض الصور الخاص بك وعرضها في الألبوم داخل التطبيق. تبقى صورك ومقاطع الفيديو الخاصة بك على جهازك ما لم تختر مشاركتها أو تصديرها. نحن لا نقوم بتحميل أو الاحتفاظ بصورك أو مقاطع الفيديو الخاصة بك.","h_dev":"معلومات الجهاز والاستخدام","p_dev":"نستخدم Google Analytics for Firebase وFirebase Crashlytics لفهم كيفية استخدام التطبيق ولتشخيص الأعطال. قد يشمل ذلك أحداث التطبيق (مثل الميزات التي تم فتحها)، وطراز الجهاز، وإصدار نظام التشغيل، وإصدار التطبيق، واللغة، والمنطقة/الدولة بشكل عام، وتشخيصات الأعطال. يساعدنا هذا في إصلاح الأخطاء وتحسين التطبيق.","h_ad":"معلومات الإعلانات","p_ad":"يعرض الإصدار المجاني من التطبيق إعلانات من خلال Google AdMob. قد يصل AdMob إلى معرّف الإعلان الخاص بجهازك والبيانات ذات الصلة لعرض الإعلانات وقياسها، بما في ذلك الإعلانات المخصصة حيثما يُسمح بذلك. راجع القسم 4 لمعرفة خيارات الإعلانات الخاصة بك.","h_notif":"الإشعارات","p_notif":"إذا قمت بتمكين الإشعارات، فإن التطبيق يستخدم Firebase Cloud Messaging (الذي يُنشئ رمز دفع للجهاز) لتقديم تذكيرات اختيارية مثل تنبيهات الساعة الذهبية. يمكنك إيقاف تشغيل الإشعارات في أي وقت في إعدادات جهازك.","h_purch":"المشتريات","p_purch":"إذا اشتريت الترقية الاختيارية لمرة واحدة \"إزالة الإعلانات / Pro\"، تتم معالجة المعاملة بواسطة Google Play Billing. نتلقى تأكيدًا بأنه تم إجراء عملية شراء حتى نتمكن من إلغاء قفل ميزات Pro واستعادتها لك. نحن لا نرى أو نخزّن أبدًا بطاقة الدفع أو تفاصيل الفوترة الخاصة بك — يتم التعامل مع هذه الأمور بالكامل بواسطة Google.","h_provide":"المعلومات التي تختار تقديمها","p_provide":"إذا راسلتنا عبر البريد الإلكتروني (للدعم أو الملاحظات)، فإننا نتلقى عنوان البريد الإلكتروني ومحتوى الرسالة الذي ترسله، ونستخدمه فقط للرد عليك.","h2":"2. المستشعرات","p_sensors":"يقرأ التطبيق مستشعرات حركة الجهاز (مقياس التسارع والمغناطيسية) لتشغيل ميزات البوصلة والميزان والميل. تُستخدم بيانات المستشعر هذه على جهازك في الوقت الفعلي وليست معلومات شخصية عنك.","h3":"3. خدمات الطرف الثالث","p_third_intro":"يعتمد التطبيق على خدمات الطرف الثالث التالية، وكل منها يخضع لسياسة الخصوصية الخاصة به:","tp_advertising":"(الإعلانات)","tp_analytics":"Google Analytics for Firebase & Firebase Crashlytics","tp_notifications":"(الإشعارات)","tp_purchases":"(المشتريات)","li_weather":"قد يتم الاستعلام من مزوّد بيانات طقس تابع لجهة خارجية باستخدام موقعك لعرض الظروف الحالية.","h4":"4. الإعلانات وخياراتك","p_ads_intro":"يتم عرض الإعلانات بواسطة Google AdMob. يمكنك التحكم في الإعلانات المخصصة على جهازك:","li_android":"Android: الإعدادات ← Google ← الإعلانات ← إلغاء الاشتراك في / إعادة تعيين معرّف الإعلان الخاص بك.","li_remove":"إزالة الإعلانات بالكامل: اشترِ ترقية Pro لمرة واحدة في التطبيق.","h5":"5. كيف نشارك المعلومات","p_share":"نحن لا نبيع معلوماتك الشخصية. تتم مشاركة المعلومات فقط مع مقدّمي الخدمات المدرجين في القسم 3 حتى يتمكنوا من أداء وظائفهم (على سبيل المثال، عرض الخرائط أو الإعلانات)، وحيثما يقتضي القانون أو الإجراءات القانونية، أو لحماية حقوق أو سلامة أو ممتلكات مستخدمينا أو الجمهور أو نحن.","h6":"6. الاحتفاظ بالبيانات","p_ret":"تبقى الصور ومقاطع الفيديو وإعدادات التطبيق التي ينشئها التطبيق على جهازك حتى تحذفها أو تلغي تثبيت التطبيق. يتم الاحتفاظ بالبيانات التي تتعامل معها خدمات الطرف الثالث في القسم 3 وفقًا لسياساتها الخاصة.","h7":"7. الأمان","p_sec":"نتخذ تدابير تقنية وتنظيمية معقولة لحماية المعلومات. ومع ذلك، لا يوجد تطبيق أو نظام إرسال أو تخزين آمن تمامًا، ولا يمكننا ضمان الأمان المطلق.","h8":"8. خصوصية الأطفال","p_child":"التطبيق غير موجّه للأطفال دون سن 13 عامًا (أو الحد الأدنى للسن المطلوب في بلدك)، ونحن لا نجمع عن قصد معلومات شخصية منهم. إذا كنت تعتقد أن طفلاً قد قدّم لنا معلومات، فيُرجى الاتصال بنا وسنقوم بحذفها.","h9":"9. حقوقك","p_rights":"بناءً على مكان إقامتك (على سبيل المثال، EEA/UK بموجب GDPR، أو كاليفورنيا بموجب CCPA/CPRA)، قد تتمتع بحقوق الوصول إلى معلوماتك الشخصية أو تصحيحها أو حذفها أو تقييد استخدامها، وإلغاء الاشتراك في معالجات معينة. يمكنك ممارسة عناصر التحكم على مستوى الجهاز في أي وقت عن طريق إلغاء أذونات الموقع أو الكاميرا أو التخزين أو الإشعارات الخاصة بالتطبيق في إعدادات جهازك، وعن طريق إعادة تعيين معرّف الإعلان الخاص بك أو إلغاء الاشتراك فيه. لتقديم طلب خصوصية، اتصل بنا باستخدام التفاصيل أدناه.","h10":"10. المستخدمون الدوليون","p_intl":"قد يقوم التطبيق وخدمات الطرف الثالث التي يستخدمها بمعالجة المعلومات في بلدان غير بلدك، حيث قد تختلف قوانين حماية البيانات. باستخدامك للتطبيق، فإنك توافق على هذه المعالجة بما يتوافق مع هذه السياسة.","h11":"11. التغييرات على سياسة الخصوصية هذه","p_changes":"قد نقوم بتحديث سياسة الخصوصية هذه من وقت لآخر. سيتم نشر أي تغييرات على هذه الصفحة مع تاريخ سريان منقّح، لذا يُرجى مراجعتها بشكل دوري. يعني استمرار استخدامك للتطبيق بعد سريان التغييرات أنك تقبل السياسة المحدّثة.","h12":"12. اتصل بنا","p_contact":"إذا كانت لديك أسئلة أو طلبات أو ملاحظات حول سياسة الخصوصية هذه أو معلوماتك، فاتصل بنا على:","footer":"© 2026 GO PRACHI LABS. جميع الحقوق محفوظة."},"ui":{"ui_language":"اللغة","ui_note":"تُقدَّم هذه الترجمة لتيسير الأمر عليك. في حالة وجود أي تعارض، تكون النسخة الإنجليزية هي المرجع القانوني المعتمد."}},"fa":{"privacy":{"title":"سیاست حفظ حریم خصوصی","eff":"تاریخ اجرا: 9 July 2026","intro":"این سیاست حفظ حریم خصوصی توضیح می‌دهد که GO PRACHI LABS (\"ما\"، \"به ما\" یا \"مال ما\") چگونه اطلاعات مرتبط با برنامه تلفن همراه GPS Map Camera & Compass (نام بسته compass.photo.camera.map.gps.gpsmapcamera_compass) (\"برنامه\") را مدیریت می‌کند. حریم خصوصی شما برای ما اهمیت دارد. لطفاً این سیاست را با دقت بخوانید. با استفاده از برنامه، شما با روش‌های توضیح‌داده‌شده در اینجا موافقت می‌کنید.","note":"به زبان ساده: برنامه عکس‌های شما را با موقعیت مکانی شما مهر می‌زند، یک قطب‌نما و نقشه‌ها نشان می‌دهد و جزئیات خورشید/ماه و آب‌وهوا را نمایش می‌دهد. عکس‌ها و موقعیت مکانی شما روی دستگاه شما پردازش می‌شوند و در سرورهای خودمان بارگذاری نمی‌شوند. همان‌طور که در ادامه توضیح داده شده، ما از خدمات مورد اعتماد Google برای نقشه‌ها، تبلیغات، تجزیه‌وتحلیل، گزارش خرابی، اعلان‌ها و خریدها استفاده می‌کنیم.","h1":"1. اطلاعاتی که جمع‌آوری می‌کنیم و نحوه استفاده از آن","h_loc":"اطلاعات موقعیت مکانی (دقیق و تقریبی)","p_loc":"با اجازه شما، برنامه به موقعیت مکانی مبتنی بر GPS و شبکه دستگاه شما دسترسی پیدا می‌کند تا ویژگی‌های اصلی خود را ارائه دهد: برچسب‌گذاری جغرافیایی عکس‌ها و ویدیوهای شما (جاسازی مختصات و آدرس در تصویر)، نمایش موقعیت شما روی نقشه، محاسبه جهت قطب‌نما، انحراف مغناطیسی و جزئیات خورشید/ماه و آب‌وهوا برای موقعیت شما. موقعیت مکانی روی دستگاه شما پردازش شده و در رسانه‌ای که ضبط می‌کنید جاسازی می‌شود. ممکن است به خدمات شخص ثالث فهرست‌شده در بخش 3 ارسال شود (برای مثال، برای ترسیم نقشه‌ها یا دریافت شرایط آب‌وهوایی). ما موقعیت مکانی شما را در سرورهای خودمان ذخیره نمی‌کنیم.","h_cam":"دوربین، عکس‌ها و رسانه","p_cam":"با اجازه شما، برنامه از دوربین شما برای گرفتن عکس و ضبط ویدیو استفاده می‌کند و رسانه را می‌خواند/می‌نویسد تا بتواند تصاویر شما را در گالری‌تان ذخیره کرده و در آلبوم درون‌برنامه‌ای نمایش دهد. عکس‌ها و ویدیوهای شما روی دستگاه شما باقی می‌مانند مگر اینکه تصمیم بگیرید آن‌ها را به اشتراک بگذارید یا صادر کنید. ما عکس‌ها یا ویدیوهای شما را بارگذاری یا نگهداری نمی‌کنیم.","h_dev":"اطلاعات دستگاه و استفاده","p_dev":"ما از Google Analytics for Firebase و Firebase Crashlytics برای درک نحوه استفاده از برنامه و تشخیص خرابی‌ها استفاده می‌کنیم. این ممکن است شامل رویدادهای برنامه (مانند ویژگی‌های باز‌شده)، مدل دستگاه، نسخه سیستم‌عامل، نسخه برنامه، زبان و منطقه/کشور کلی و تشخیص‌های خرابی باشد. این به ما کمک می‌کند اشکالات را برطرف کرده و برنامه را بهبود بخشیم.","h_ad":"اطلاعات تبلیغات","p_ad":"نسخه رایگان برنامه از طریق Google AdMob تبلیغات نمایش می‌دهد. AdMob ممکن است به شناسه تبلیغاتی دستگاه شما و داده‌های مرتبط برای ارائه و اندازه‌گیری تبلیغات، از جمله تبلیغات شخصی‌سازی‌شده در جایی که مجاز است، دسترسی داشته باشد. برای گزینه‌های تبلیغاتی خود به بخش 4 مراجعه کنید.","h_notif":"اعلان‌ها","p_notif":"اگر اعلان‌ها را فعال کنید، برنامه از Firebase Cloud Messaging (که یک توکن پوش دستگاه تولید می‌کند) برای ارائه یادآوری‌های اختیاری مانند هشدارهای ساعت طلایی استفاده می‌کند. می‌توانید اعلان‌ها را در هر زمان در تنظیمات دستگاه خود خاموش کنید.","h_purch":"خریدها","p_purch":"اگر ارتقای اختیاری یک‌بار‌مصرف \"حذف تبلیغات / Pro\" را بخرید، تراکنش توسط Google Play Billing پردازش می‌شود. ما تأییدیه‌ای دریافت می‌کنیم که یک خرید انجام شده است تا بتوانیم ویژگی‌های Pro را باز کرده و آن‌ها را برای شما بازیابی کنیم. ما هرگز کارت پرداخت یا جزئیات صورت‌حساب شما را نمی‌بینیم یا ذخیره نمی‌کنیم — این‌ها به‌طور کامل توسط Google مدیریت می‌شوند.","h_provide":"اطلاعاتی که شما انتخاب می‌کنید ارائه دهید","p_provide":"اگر به ما ایمیل بزنید (برای پشتیبانی یا بازخورد)، ما آدرس ایمیل و محتوای پیامی که ارسال می‌کنید را دریافت کرده و فقط برای پاسخ به شما از آن استفاده می‌کنیم.","h2":"2. حسگرها","p_sensors":"برنامه حسگرهای حرکتی دستگاه (شتاب‌سنج و مغناطیس‌سنج) را برای فعال کردن ویژگی‌های قطب‌نما، تراز و شیب می‌خواند. این داده‌های حسگر روی دستگاه شما به‌صورت بی‌درنگ استفاده می‌شوند و اطلاعات شخصی درباره شما نیستند.","h3":"3. خدمات شخص ثالث","p_third_intro":"برنامه به خدمات شخص ثالث زیر متکی است که هر کدام تحت سیاست حفظ حریم خصوصی خود اداره می‌شوند:","tp_advertising":"(تبلیغات)","tp_analytics":"Google Analytics for Firebase & Firebase Crashlytics","tp_notifications":"(اعلان‌ها)","tp_purchases":"(خریدها)","li_weather":"ممکن است با استفاده از موقعیت مکانی شما از یک ارائه‌دهنده داده‌های آب‌وهوایی شخص ثالث برای نمایش شرایط فعلی پرس‌وجو شود.","h4":"4. تبلیغات و گزینه‌های شما","p_ads_intro":"تبلیغات توسط Google AdMob ارائه می‌شوند. می‌توانید تبلیغات شخصی‌سازی‌شده را روی دستگاه خود کنترل کنید:","li_android":"Android: تنظیمات ← Google ← تبلیغات ← انصراف از / بازنشانی شناسه تبلیغاتی خود.","li_remove":"حذف کامل تبلیغات: ارتقای یک‌بار‌مصرف Pro را در برنامه بخرید.","h5":"5. چگونه اطلاعات را به اشتراک می‌گذاریم","p_share":"ما اطلاعات شخصی شما را نمی‌فروشیم. اطلاعات فقط با ارائه‌دهندگان خدمات فهرست‌شده در بخش 3 به اشتراک گذاشته می‌شود تا بتوانند وظایف خود را انجام دهند (برای مثال، نمایش نقشه‌ها یا تبلیغات)، و در مواردی که قانون، فرآیند قانونی الزام می‌کند یا برای محافظت از حقوق، ایمنی یا دارایی کاربران ما، عموم یا خودمان.","h6":"6. نگهداری داده‌ها","p_ret":"عکس‌ها، ویدیوها و تنظیمات برنامه که توسط برنامه ایجاد شده‌اند تا زمانی که آن‌ها را حذف کنید یا برنامه را حذف نصب کنید روی دستگاه شما باقی می‌مانند. داده‌هایی که توسط خدمات شخص ثالث در بخش 3 مدیریت می‌شوند طبق سیاست‌های مربوطه خودشان نگهداری می‌شوند.","h7":"7. امنیت","p_sec":"ما تدابیر فنی و سازمانی معقولی برای محافظت از اطلاعات اتخاذ می‌کنیم. با این حال، هیچ برنامه، انتقال یا سیستم ذخیره‌سازی کاملاً امن نیست و ما نمی‌توانیم امنیت مطلق را تضمین کنیم.","h8":"8. حریم خصوصی کودکان","p_child":"برنامه برای کودکان زیر 13 سال (یا حداقل سن مورد نیاز در کشور شما) در نظر گرفته نشده است و ما آگاهانه اطلاعات شخصی از آن‌ها جمع‌آوری نمی‌کنیم. اگر فکر می‌کنید کودکی به ما اطلاعاتی داده است، لطفاً با ما تماس بگیرید و ما آن را حذف خواهیم کرد.","h9":"9. حقوق شما","p_rights":"بسته به محل زندگی شما (برای مثال، EEA/UK تحت GDPR یا کالیفرنیا تحت CCPA/CPRA)، ممکن است حق دسترسی، تصحیح، حذف یا محدود کردن استفاده از اطلاعات شخصی خود و انصراف از برخی پردازش‌ها را داشته باشید. می‌توانید در هر زمان با لغو مجوزهای موقعیت مکانی، دوربین، ذخیره‌سازی یا اعلان برنامه در تنظیمات دستگاه خود و با بازنشانی یا انصراف از شناسه تبلیغاتی خود، کنترل‌های سطح دستگاه را اعمال کنید. برای ارائه درخواست حریم خصوصی، با استفاده از جزئیات زیر با ما تماس بگیرید.","h10":"10. کاربران بین‌المللی","p_intl":"برنامه و خدمات شخص ثالثی که استفاده می‌کند ممکن است اطلاعات را در کشورهایی غیر از کشور شما پردازش کنند، جایی که قوانین حفاظت از داده‌ها ممکن است متفاوت باشد. با استفاده از برنامه، شما با چنین پردازشی مطابق با این سیاست موافقت می‌کنید.","h11":"11. تغییرات در این سیاست حفظ حریم خصوصی","p_changes":"ما ممکن است این سیاست حفظ حریم خصوصی را هر از گاهی به‌روزرسانی کنیم. هرگونه تغییر با تاریخ اجرای بازنگری‌شده در این صفحه منتشر خواهد شد، بنابراین لطفاً به‌صورت دوره‌ای آن را بررسی کنید. ادامه استفاده از برنامه پس از اعمال تغییرات به معنای پذیرش سیاست به‌روزشده است.","h12":"12. با ما تماس بگیرید","p_contact":"اگر سؤال، درخواست یا بازخوردی درباره این سیاست حفظ حریم خصوصی یا اطلاعات خود دارید، با ما تماس بگیرید:","footer":"© 2026 GO PRACHI LABS. کلیه حقوق محفوظ است."},"ui":{"ui_language":"زبان","ui_note":"این ترجمه برای راحتی شما ارائه شده است. در صورت وجود هرگونه مغایرت، نسخه انگلیسی از نظر قانونی معتبر است."}},"iw":{"privacy":{"title":"מדיניות פרטיות","eff":"תאריך תחילה: 9 July 2026","intro":"מדיניות פרטיות זו מסבירה כיצד GO PRACHI LABS (\"אנחנו\", \"אותנו\" או \"שלנו\") מטפלת במידע בקשר לאפליקציה למכשירים ניידים GPS Map Camera & Compass (שם החבילה compass.photo.camera.map.gps.gpsmapcamera_compass) (\"האפליקציה\"). הפרטיות שלך חשובה לנו. אנא קרא מדיניות זו בעיון. באמצעות השימוש באפליקציה, אתה מסכים לנהלים המתוארים כאן.","note":"במילים פשוטות: האפליקציה מטביעה על התמונות שלך את המיקום שלך, מציגה מצפן ומפות, ומציגה פרטי שמש/ירח ומזג אוויר. התמונות והמיקום שלך מעובדים במכשיר שלך ואינם מועלים לשרתים שלנו. אנו משתמשים בשירותי Google מהימנים עבור מפות, מודעות, ניתוח נתונים, דיווח על קריסות, התראות ורכישות, כמתואר להלן.","h1":"1. מידע שאנו אוספים וכיצד אנו משתמשים בו","h_loc":"מידע מיקום (מדויק ומשוער)","p_loc":"באישורך, האפליקציה ניגשת למיקום מבוסס ה-GPS והרשת של המכשיר שלך כדי לספק את התכונות המרכזיות שלה: תיוג גיאוגרפי של התמונות והסרטונים שלך (הטמעת קואורדינטות וכתובת בתמונה), הצגת מיקומך על מפה, חישוב כיוון המצפן, סטייה מגנטית ופרטי שמש/ירח ומזג אוויר עבור מיקומך. המיקום מעובד במכשיר שלך ומוטמע במדיה שאתה מצלם. ייתכן שהוא יישלח לשירותי הצד השלישי המפורטים בסעיף 3 (לדוגמה, כדי להציג מפות או לאחזר תנאי מזג אוויר). איננו מאחסנים את מיקומך בשרתים שלנו.","h_cam":"מצלמה, תמונות ומדיה","p_cam":"באישורך, האפליקציה משתמשת במצלמה שלך כדי לצלם תמונות ולהקליט סרטונים, וקוראת/כותבת מדיה כדי שתוכל לשמור את הצילומים שלך בגלריה שלך ולהציג אותם באלבום שבתוך האפליקציה. התמונות והסרטונים שלך נשארים במכשיר שלך אלא אם כן תבחר לשתף או לייצא אותם. איננו מעלים או שומרים את התמונות או הסרטונים שלך.","h_dev":"מידע על המכשיר והשימוש","p_dev":"אנו משתמשים ב-Google Analytics for Firebase וב-Firebase Crashlytics כדי להבין כיצד נעשה שימוש באפליקציה וכדי לאבחן קריסות. זה עשוי לכלול אירועי אפליקציה (כגון תכונות שנפתחו), דגם המכשיר, גרסת מערכת ההפעלה, גרסת האפליקציה, השפה, האזור/המדינה הכללית, ואבחון קריסות. זה עוזר לנו לתקן באגים ולשפר את האפליקציה.","h_ad":"מידע על פרסום","p_ad":"הגרסה החינמית של האפליקציה מציגה מודעות באמצעות Google AdMob. AdMob עשויה לגשת למזהה הפרסום של המכשיר שלך ולנתונים קשורים כדי להציג ולמדוד מודעות, כולל מודעות מותאמות אישית במקומות שבהם הדבר מותר. עיין בסעיף 4 לגבי אפשרויות המודעות שלך.","h_notif":"התראות","p_notif":"אם תפעיל התראות, האפליקציה משתמשת ב-Firebase Cloud Messaging (המייצר אסימון דחיפה למכשיר) כדי לספק תזכורות אופציונליות כגון התראות שעת הזהב. תוכל לכבות התראות בכל עת בהגדרות המכשיר שלך.","h_purch":"רכישות","p_purch":"אם תרכוש את שדרוג \"הסרת מודעות / Pro\" האופציונלי החד-פעמי, העסקה מעובדת על ידי Google Play Billing. אנו מקבלים אישור שבוצעה רכישה כדי שנוכל לפתוח את תכונות ה-Pro ולשחזר אותן עבורך. לעולם איננו רואים או מאחסנים את כרטיס התשלום או פרטי החיוב שלך — אלה מטופלים כולם על ידי Google.","h_provide":"מידע שאתה בוחר לספק","p_provide":"אם תשלח לנו דוא\"ל (לתמיכה או משוב), אנו מקבלים את כתובת הדוא\"ל ותוכן ההודעה שאתה שולח, ומשתמשים בהם רק כדי להשיב לך.","h2":"2. חיישנים","p_sensors":"האפליקציה קוראת את חיישני התנועה של המכשיר (מד תאוצה ומגנטומטר) כדי להפעיל את תכונות המצפן, הפלס והנטייה. נתוני חיישן אלה משמשים במכשיר שלך בזמן אמת ואינם מידע אישי עליך.","h3":"3. שירותי צד שלישי","p_third_intro":"האפליקציה מסתמכת על שירותי הצד השלישי הבאים, שכל אחד מהם כפוף למדיניות הפרטיות שלו:","tp_advertising":"(פרסום)","tp_analytics":"Google Analytics for Firebase & Firebase Crashlytics","tp_notifications":"(התראות)","tp_purchases":"(רכישות)","li_weather":"ייתכן שתישלח שאילתה לספק נתוני מזג אוויר של צד שלישי באמצעות מיקומך כדי להציג את התנאים הנוכחיים.","h4":"4. מודעות והאפשרויות שלך","p_ads_intro":"המודעות מוצגות על ידי Google AdMob. תוכל לשלוט בפרסום המותאם אישית במכשיר שלך:","li_android":"Android: הגדרות ← Google ← מודעות ← ביטול הסכמה / איפוס מזהה הפרסום שלך.","li_remove":"הסרת מודעות לחלוטין: רכוש את שדרוג ה-Pro החד-פעמי באפליקציה.","h5":"5. כיצד אנו משתפים מידע","p_share":"איננו מוכרים את המידע האישי שלך. מידע משותף רק עם ספקי השירות המפורטים בסעיף 3 כדי שיוכלו לבצע את תפקידיהם (לדוגמה, הצגת מפות או מודעות), ובמקום שבו הדבר נדרש על פי חוק, הליך משפטי, או כדי להגן על הזכויות, הבטיחות או הרכוש של המשתמשים שלנו, הציבור או אנו.","h6":"6. שמירת נתונים","p_ret":"תמונות, סרטונים והגדרות אפליקציה שנוצרו על ידי האפליקציה נשארים במכשיר שלך עד שתמחק אותם או תסיר את התקנת האפליקציה. נתונים המטופלים על ידי שירותי הצד השלישי בסעיף 3 נשמרים בהתאם למדיניות שלהם בהתאמה.","h7":"7. אבטחה","p_sec":"אנו נוקטים באמצעים טכניים וארגוניים סבירים כדי להגן על מידע. עם זאת, אף אפליקציה, שידור או מערכת אחסון אינם מאובטחים לחלוטין, ואיננו יכולים להבטיח אבטחה מוחלטת.","h8":"8. פרטיות ילדים","p_child":"האפליקציה אינה מיועדת לילדים מתחת לגיל 13 (או גיל המינימום הנדרש במדינתך), ואיננו אוספים ביודעין מידע אישי מהם. אם אתה סבור שילד סיפק לנו מידע, אנא צור איתנו קשר ואנו נמחק אותו.","h9":"9. הזכויות שלך","p_rights":"בהתאם למקום מגוריך (לדוגמה, EEA/UK תחת GDPR, או קליפורניה תחת CCPA/CPRA), ייתכן שיהיו לך זכויות לגשת למידע האישי שלך, לתקן, למחוק או להגביל את השימוש בו, ולבטל את ההסכמה לעיבודים מסוימים. תוכל להפעיל בקרות ברמת המכשיר בכל עת על ידי ביטול הרשאות המיקום, המצלמה, האחסון או ההתראות של האפליקציה בהגדרות המכשיר שלך, ועל ידי איפוס או ביטול ההסכמה למזהה הפרסום שלך. כדי להגיש בקשת פרטיות, צור איתנו קשר באמצעות הפרטים שלהלן.","h10":"10. משתמשים בינלאומיים","p_intl":"האפליקציה ושירותי הצד השלישי שבהם היא משתמשת עשויים לעבד מידע במדינות שאינן מדינתך, שבהן חוקי הגנת הנתונים עשויים להיות שונים. באמצעות השימוש באפליקציה אתה מסכים לעיבוד כזה בהתאם למדיניות זו.","h11":"11. שינויים במדיניות פרטיות זו","p_changes":"אנו עשויים לעדכן מדיניות פרטיות זו מעת לעת. כל שינוי יפורסם בדף זה עם תאריך תחילה מעודכן, לכן אנא עיין בה מעת לעת. המשך השימוש באפליקציה לאחר שהשינויים נכנסים לתוקף פירושו שאתה מקבל את המדיניות המעודכנת.","h12":"12. צור קשר","p_contact":"אם יש לך שאלות, בקשות או משוב לגבי מדיניות פרטיות זו או המידע שלך, צור איתנו קשר בכתובת:","footer":"© 2026 GO PRACHI LABS. כל הזכויות שמורות."},"ui":{"ui_language":"שפה","ui_note":"תרגום זה מסופק לנוחותך. במקרה של אי-התאמה כלשהי, הגרסה האנגלית היא הקובעת מבחינה משפטית."}},"id":{"privacy":{"title":"Kebijakan Privasi","eff":"Tanggal berlaku: 9 July 2026","intro":"Kebijakan Privasi ini menjelaskan bagaimana GO PRACHI LABS (\"kami\", \"kita\", atau \"milik kami\") menangani informasi sehubungan dengan aplikasi seluler GPS Map Camera & Compass (nama paket compass.photo.camera.map.gps.gpsmapcamera_compass) (\"Aplikasi\"). Privasi Anda penting bagi kami. Harap baca kebijakan ini dengan saksama. Dengan menggunakan Aplikasi, Anda menyetujui praktik yang dijelaskan di sini.","note":"Secara sederhana: Aplikasi menyematkan lokasi Anda pada foto, menampilkan kompas dan peta, serta menampilkan detail matahari/bulan dan cuaca. Foto dan lokasi Anda diproses di perangkat Anda dan tidak diunggah ke server kami sendiri. Kami menggunakan layanan Google tepercaya untuk peta, iklan, analitik, pelaporan kerusakan, notifikasi, dan pembelian, seperti yang dijelaskan di bawah ini.","h1":"1. Informasi yang kami kumpulkan dan cara kami menggunakannya","h_loc":"Informasi lokasi (tepat dan perkiraan)","p_loc":"Dengan izin Anda, Aplikasi mengakses lokasi berbasis GPS dan jaringan perangkat Anda untuk menyediakan fitur intinya: memberi tag geografis pada foto dan video Anda (menyematkan koordinat dan alamat ke dalam gambar), menampilkan posisi Anda di peta, menghitung arah kompas, deklinasi magnetik, serta detail matahari/bulan dan cuaca untuk lokasi Anda. Lokasi diproses di perangkat Anda dan disematkan ke media yang Anda ambil. Lokasi dapat dikirim ke layanan pihak ketiga yang tercantum dalam Bagian 3 (misalnya, untuk menampilkan peta atau mengambil kondisi cuaca). Kami tidak menyimpan lokasi Anda di server kami sendiri.","h_cam":"Kamera, foto, dan media","p_cam":"Dengan izin Anda, Aplikasi menggunakan kamera Anda untuk mengambil foto dan merekam video, serta membaca/menulis media agar dapat menyimpan hasil tangkapan Anda ke galeri dan menampilkannya di album dalam aplikasi. Foto dan video Anda tetap berada di perangkat Anda kecuali Anda memilih untuk membagikan atau mengekspornya. Kami tidak mengunggah atau menyimpan foto atau video Anda.","h_dev":"Informasi perangkat dan penggunaan","p_dev":"Kami menggunakan Google Analytics for Firebase dan Firebase Crashlytics untuk memahami cara Aplikasi digunakan dan untuk mendiagnosis kerusakan. Ini dapat mencakup peristiwa aplikasi (seperti fitur yang dibuka), model perangkat, versi sistem operasi, versi aplikasi, bahasa, dan wilayah/negara secara umum, serta diagnostik kerusakan. Ini membantu kami memperbaiki bug dan meningkatkan Aplikasi.","h_ad":"Informasi periklanan","p_ad":"Versi gratis Aplikasi menampilkan iklan melalui Google AdMob. AdMob dapat mengakses pengidentifikasi iklan perangkat Anda dan data terkait untuk menayangkan dan mengukur iklan, termasuk iklan yang dipersonalisasi jika diizinkan. Lihat Bagian 4 untuk pilihan iklan Anda.","h_notif":"Notifikasi","p_notif":"Jika Anda mengaktifkan notifikasi, Aplikasi menggunakan Firebase Cloud Messaging (yang menghasilkan token push perangkat) untuk mengirimkan pengingat opsional seperti peringatan golden hour. Anda dapat menonaktifkan notifikasi kapan saja di pengaturan perangkat Anda.","h_purch":"Pembelian","p_purch":"Jika Anda membeli peningkatan sekali bayar \"Hapus Iklan / Pro\" yang opsional, transaksi diproses oleh Google Play Billing. Kami menerima konfirmasi bahwa pembelian telah dilakukan sehingga kami dapat membuka fitur Pro dan memulihkannya untuk Anda. Kami tidak pernah melihat atau menyimpan kartu pembayaran atau detail penagihan Anda — semua itu ditangani sepenuhnya oleh Google.","h_provide":"Informasi yang Anda pilih untuk berikan","p_provide":"Jika Anda mengirim email kepada kami (untuk dukungan atau masukan), kami menerima alamat email dan isi pesan yang Anda kirim, dan menggunakannya hanya untuk menanggapi Anda.","h2":"2. Sensor","p_sensors":"Aplikasi membaca sensor gerakan perangkat (akselerometer dan magnetometer) untuk menjalankan fitur kompas, level, dan kemiringan. Data sensor ini digunakan di perangkat Anda secara real-time dan bukan merupakan informasi pribadi tentang Anda.","h3":"3. Layanan pihak ketiga","p_third_intro":"Aplikasi bergantung pada layanan pihak ketiga berikut, yang masing-masing diatur oleh kebijakan privasinya sendiri:","tp_advertising":"(periklanan)","tp_analytics":"Google Analytics for Firebase & Firebase Crashlytics","tp_notifications":"(notifikasi)","tp_purchases":"(pembelian)","li_weather":"Penyedia data cuaca pihak ketiga dapat dikueri menggunakan lokasi Anda untuk menampilkan kondisi saat ini.","h4":"4. Iklan dan pilihan Anda","p_ads_intro":"Iklan ditayangkan oleh Google AdMob. Anda dapat mengontrol iklan yang dipersonalisasi di perangkat Anda:","li_android":"Android: Setelan → Google → Iklan → menyisih dari / setel ulang ID iklan Anda.","li_remove":"Menghapus iklan sepenuhnya: beli peningkatan Pro sekali bayar di Aplikasi.","h5":"5. Bagaimana kami membagikan informasi","p_share":"Kami tidak menjual informasi pribadi Anda. Informasi hanya dibagikan dengan penyedia layanan yang tercantum dalam Bagian 3 agar mereka dapat menjalankan fungsinya (misalnya, menampilkan peta atau iklan), dan jika diwajibkan oleh hukum, proses hukum, atau untuk melindungi hak, keselamatan, atau properti pengguna kami, masyarakat, atau kami.","h6":"6. Penyimpanan data","p_ret":"Foto, video, dan pengaturan aplikasi yang dibuat oleh Aplikasi tetap berada di perangkat Anda hingga Anda menghapusnya atau mencopot pemasangan Aplikasi. Data yang ditangani oleh layanan pihak ketiga di Bagian 3 disimpan sesuai dengan kebijakan masing-masing.","h7":"7. Keamanan","p_sec":"Kami mengambil langkah-langkah teknis dan organisasi yang wajar untuk melindungi informasi. Namun, tidak ada aplikasi, transmisi, atau sistem penyimpanan yang sepenuhnya aman, dan kami tidak dapat menjamin keamanan mutlak.","h8":"8. Privasi anak-anak","p_child":"Aplikasi tidak ditujukan untuk anak-anak di bawah usia 13 tahun (atau usia minimum yang disyaratkan di negara Anda), dan kami tidak dengan sengaja mengumpulkan informasi pribadi dari mereka. Jika Anda yakin seorang anak telah memberikan informasi kepada kami, harap hubungi kami dan kami akan menghapusnya.","h9":"9. Hak Anda","p_rights":"Bergantung pada tempat tinggal Anda (misalnya, EEA/UK di bawah GDPR, atau California di bawah CCPA/CPRA), Anda mungkin memiliki hak untuk mengakses, memperbaiki, menghapus, atau membatasi penggunaan informasi pribadi Anda, dan untuk menyisih dari pemrosesan tertentu. Anda dapat menjalankan kontrol tingkat perangkat kapan saja dengan mencabut izin lokasi, kamera, penyimpanan, atau notifikasi Aplikasi di pengaturan perangkat Anda, dan dengan menyetel ulang atau menyisih dari ID iklan Anda. Untuk mengajukan permintaan privasi, hubungi kami menggunakan detail di bawah ini.","h10":"10. Pengguna internasional","p_intl":"Aplikasi dan layanan pi
