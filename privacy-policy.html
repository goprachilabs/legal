।","h_dev":"यन्त्र र प्रयोग जानकारी","p_dev":"एप कसरी प्रयोग हुन्छ भनेर बुझ्न र क्र्यासहरूको निदान गर्न हामी Google Analytics for Firebase र Firebase Crashlytics प्रयोग गर्छौं। यसमा एप घटनाहरू (जस्तै खोलिएका सुविधाहरू), यन्त्र मोडेल, अपरेटिङ-सिस्टम संस्करण, एप संस्करण, भाषा, र सामान्य क्षेत्र/देश, तथा क्र्यास निदान समावेश हुन सक्छ। यसले हामीलाई बगहरू सच्याउन र एप सुधार्न मद्दत गर्छ।","h_ad":"विज्ञापन जानकारी","p_ad":"एपको निःशुल्क संस्करणले Google AdMob मार्फत विज्ञापनहरू देखाउँछ। AdMob ले विज्ञापन देखाउन र मापन गर्न तपाईंको यन्त्रको विज्ञापन पहिचानकर्ता र सम्बन्धित डेटामा पहुँच गर्न सक्छ, जसमा अनुमति भएको ठाउँमा व्यक्तिगत विज्ञापनहरू पनि समावेश छन्। तपाईंका विज्ञापन विकल्पहरूका लागि खण्ड ४ हेर्नुहोस्।","h_notif":"सूचनाहरू","p_notif":"तपाईंले सूचनाहरू सक्षम गर्नुभएमा, एपले गोल्डेन-आवर सतर्कता जस्ता वैकल्पिक रिमाइन्डरहरू पठाउन Firebase Cloud Messaging (जसले यन्त्र पुश टोकन उत्पन्न गर्छ) प्रयोग गर्छ। तपाईं आफ्नो यन्त्र सेटिङमा जुनसुकै बेला सूचनाहरू बन्द गर्न सक्नुहुन्छ।","h_purch":"किनमेल","p_purch":"तपाईंले वैकल्पिक एक-पटकको “Remove Ads / Pro” अपग्रेड किन्नुभएमा, कारोबार Google Play Billing द्वारा प्रशोधन गरिन्छ। किनमेल भएको पुष्टि हामीले प्राप्त गर्छौं ताकि हामी Pro सुविधाहरू अनलक गरी तपाईंका लागि पुनर्स्थापना गर्न सकौं। हामीले तपाईंको भुक्तानी कार्ड वा बिलिङ विवरण कहिल्यै देख्दैनौं वा भण्डारण गर्दैनौं — ती पूर्ण रूपमा Google द्वारा नै व्यवस्थापन गरिन्छन्।","h_provide":"तपाईंले प्रदान गर्न रोज्ने जानकारी","p_provide":"तपाईंले हामीलाई (सहयोग वा प्रतिक्रियाका लागि) इमेल गर्नुभएमा, तपाईंले पठाउनुभएको इमेल ठेगाना र सन्देश सामग्री हामी प्राप्त गर्छौं, र यसलाई तपाईंलाई जवाफ दिन मात्र प्रयोग गर्छौं।","h2":"2. सेन्सरहरू","p_sensors":"एपले कम्पास, लेभल र झुकाव सुविधाहरू सञ्चालन गर्न यन्त्रका गति सेन्सरहरू (एक्सेलेरोमिटर र म्याग्नेटोमिटर) पढ्छ। यो सेन्सर डेटा तपाईंकै यन्त्रमा वास्तविक समयमा प्रयोग हुन्छ र तपाईंको बारेमा व्यक्तिगत जानकारी होइन।","h3":"3. तेस्रो-पक्ष सेवाहरू","p_third_intro":"एप निम्न तेस्रो-पक्ष सेवाहरूमा निर्भर छ, प्रत्येक आ-आफ्नै गोपनीयता नीतिद्वारा सञ्चालित:","tp_advertising":"(विज्ञापन)","tp_analytics":"Google Analytics for Firebase & Firebase Crashlytics","tp_notifications":"(सूचनाहरू)","tp_purchases":"(किनमेल)","li_weather":"वर्तमान अवस्था देखाउन तपाईंको स्थान प्रयोग गरी तेस्रो-पक्ष मौसम डेटा प्रदायकलाई सोधपुछ गर्न सकिन्छ।","h4":"4. विज्ञापन र तपाईंका विकल्पहरू","p_ads_intro":"विज्ञापनहरू Google AdMob द्वारा देखाइन्छन्। तपाईं आफ्नो यन्त्रमा व्यक्तिगत विज्ञापन नियन्त्रण गर्न सक्नुहुन्छ:","li_android":"Android: Settings → Google → Ads → आफ्नो विज्ञापन ID बाट बाहिरिनुहोस् / रिसेट गर्नुहोस्।","li_remove":"विज्ञापनहरू पूर्ण रूपमा हटाउन: एपमा एक-पटकको Pro अपग्रेड किन्नुहोस्।","h5":"5. हामी जानकारी कसरी साझेदारी गर्छौं","p_share":"हामी तपाईंको व्यक्तिगत जानकारी बेच्दैनौं। जानकारी खण्ड ३ मा सूचीबद्ध सेवा प्रदायकहरूसँग मात्र साझेदारी गरिन्छ ताकि तिनीहरूले आफ्ना कार्यहरू सम्पन्न गर्न सकून् (उदाहरणका लागि, नक्सा वा विज्ञापन देखाउन), र जहाँ कानून, कानुनी प्रक्रियाद्वारा आवश्यक हुन्छ, वा हाम्रा प्रयोगकर्ता, जनता वा हाम्रा अधिकार, सुरक्षा वा सम्पत्तिको रक्षा गर्न।","h6":"6. डेटा भण्डारण","p_ret":"एपले सिर्जना गरेका फोटो, भिडियो र एप सेटिङहरू तपाईंले मेटाउनु वा एप अनइन्स्टल नगरेसम्म तपाईंकै यन्त्रमा रहन्छन्। खण्ड ३ मा भएका तेस्रो-पक्ष सेवाहरूद्वारा व्यवस्थापन गरिएको डेटा तिनीहरूका सम्बन्धित नीतिअनुसार राखिन्छ।","h7":"7. सुरक्षा","p_sec":"हामी जानकारीको सुरक्षा गर्न उचित प्राविधिक र सांगठनिक उपायहरू अपनाउँछौं। तथापि, कुनै पनि एप, प्रसारण वा भण्डारण प्रणाली पूर्ण रूपमा सुरक्षित हुँदैन, र हामी पूर्ण सुरक्षाको ग्यारेन्टी गर्न सक्दैनौं।","h8":"8. बालबालिकाको गोपनीयता","p_child":"एप १३ वर्ष (वा तपाईंको देशमा आवश्यक न्यूनतम उमेर) मुनिका बालबालिकाका लागि लक्षित छैन, र हामी जानीजानी तिनीहरूबाट व्यक्तिगत जानकारी सङ्कलन गर्दैनौं। कुनै बालबालिकाले हामीलाई जानकारी दिएको तपाईंलाई लाग्छ भने, कृपया हामीलाई सम्पर्क गर्नुहोस् र हामी त्यसलाई मेटाउनेछौं।","h9":"9. तपाईंका अधिकारहरू","p_rights":"तपाईं कहाँ बस्नुहुन्छ भन्ने आधारमा (उदाहरणका लागि, GDPR अन्तर्गत EEA/UK, वा CCPA/CPRA अन्तर्गत California), तपाईंसँग आफ्नो व्यक्तिगत जानकारीमा पहुँच, सुधार, मेटाउने वा प्रयोग सीमित गर्ने, र केही प्रशोधनबाट बाहिरिने अधिकार हुन सक्छन्। तपाईं आफ्नो यन्त्र सेटिङमा एपको स्थान, क्यामेरा, भण्डारण वा सूचना अनुमतिहरू रद्द गरेर, र आफ्नो विज्ञापन ID रिसेट वा त्यसबाट बाहिरिएर जुनसुकै बेला यन्त्र-स्तरका नियन्त्रणहरू प्रयोग गर्न सक्नुहुन्छ। गोपनीयता अनुरोध गर्न, तलका विवरणहरू प्रयोग गरी हामीलाई सम्पर्क गर्नुहोस्।","h10":"10. अन्तर्राष्ट्रिय प्रयोगकर्ताहरू","p_intl":"एप र यसले प्रयोग गर्ने तेस्रो-पक्ष सेवाहरूले तपाईंको आफ्नो देश बाहेकका देशहरूमा जानकारी प्रशोधन गर्न सक्छन्, जहाँ डेटा-संरक्षण कानूनहरू फरक हुन सक्छन्। एप प्रयोग गरेर तपाईं यो नीतिसँग सङ्गत त्यस्तो प्रशोधनमा सहमति दिनुहुन्छ।","h11":"11. यस गोपनीयता नीतिमा परिवर्तनहरू","p_changes":"हामी यो गोपनीयता नीति समय-समयमा अद्यावधिक गर्न सक्छौं। कुनै पनि परिवर्तन संशोधित प्रभावकारी मितिसहित यस पृष्ठमा राखिनेछ, त्यसैले कृपया यसलाई समय-समयमा समीक्षा गर्नुहोस्। परिवर्तनहरू लागू भएपछि एपको निरन्तर प्रयोगको अर्थ तपाईंले अद्यावधिक नीति स्वीकार गर्नुभएको हो।","h12":"12. हामीलाई सम्पर्क गर्नुहोस्","p_contact":"यस गोपनीयता नीति वा तपाईंको जानकारीबारे कुनै प्रश्न, अनुरोध वा प्रतिक्रिया छ भने, हामीलाई यहाँ सम्पर्क गर्नुहोस्:","footer":"© 2026 GO PRACHI LABS. सर्वाधिकार सुरक्षित।"},"ui":{"ui_language":"भाषा","ui_note":"यो अनुवाद तपाईंको सुविधाका लागि प्रदान गरिएको हो। कुनै असमानता भएमा, अङ्ग्रेजी संस्करण नै कानुनी रूपमा आधिकारिक हुनेछ।"}},"es":{"privacy":{"title":"Política de Privacidad","eff":"Fecha de entrada en vigor: 9 July 2026","intro":"Esta Política de Privacidad explica cómo GO PRACHI LABS (“nosotros” o “nuestro”) gestiona la información en relación con la aplicación móvil GPS Map Camera & Compass (nombre del paquete compass.photo.camera.map.gps.gpsmapcamera_compass) (la “App”). Su privacidad nos importa. Lea esta política detenidamente. Al usar la App, usted acepta las prácticas descritas aquí.","note":"En términos sencillos: la App estampa sus fotos con su ubicación, muestra una brújula y mapas, y presenta detalles del sol/la luna y del clima. Sus fotos y su ubicación se procesan en su dispositivo y no se cargan en nuestros propios servidores. Utilizamos servicios de confianza de Google para mapas, anuncios, análisis, informes de fallos, notificaciones y compras, tal como se describe a continuación.","h1":"1. Información que recopilamos y cómo la usamos","h_loc":"Información de ubicación (precisa y aproximada)","p_loc":"Con su permiso, la App accede a la ubicación de su dispositivo basada en GPS y en la red para ofrecer sus funciones principales: geoetiquetar sus fotos y vídeos (incorporando coordenadas y dirección en la imagen), mostrar su posición en un mapa, calcular el rumbo de la brújula, la declinación magnética y los detalles del sol/la luna y del clima para su ubicación. La ubicación se procesa en su dispositivo y se incorpora al contenido que captura. Puede enviarse a los servicios de terceros indicados en la Sección 3 (por ejemplo, para representar mapas u obtener las condiciones meteorológicas). No almacenamos su ubicación en nuestros propios servidores.","h_cam":"Cámara, fotos y contenido multimedia","p_cam":"Con su permiso, la App usa su cámara para tomar fotos y grabar vídeos, y lee/escribe contenido multimedia para poder guardar sus capturas en su galería y mostrarlas en el álbum de la app. Sus fotos y vídeos permanecen en su dispositivo a menos que decida compartirlos o exportarlos. No cargamos ni conservamos sus fotos o vídeos.","h_dev":"Información del dispositivo y de uso","p_dev":"Utilizamos Google Analytics for Firebase y Firebase Crashlytics para comprender cómo se usa la App y para diagnosticar fallos. Esto puede incluir eventos de la app (como las funciones abiertas), el modelo del dispositivo, la versión del sistema operativo, la versión de la app, el idioma y la región/el país general, así como diagnósticos de fallos. Esto nos ayuda a corregir errores y mejorar la App.","h_ad":"Información publicitaria","p_ad":"La versión gratuita de la App muestra anuncios a través de Google AdMob. AdMob puede acceder al identificador publicitario de su dispositivo y a datos relacionados para publicar y medir anuncios, incluidos anuncios personalizados cuando esté permitido. Consulte la Sección 4 para conocer sus opciones publicitarias.","h_notif":"Notificaciones","p_notif":"Si activa las notificaciones, la App usa Firebase Cloud Messaging (que genera un token de inserción del dispositivo) para enviar recordatorios opcionales, como alertas de la hora dorada. Puede desactivar las notificaciones en cualquier momento en la configuración de su dispositivo.","h_purch":"Compras","p_purch":"Si compra la mejora opcional de pago único “Eliminar anuncios / Pro”, la transacción es procesada por Google Play Billing. Recibimos la confirmación de que se realizó una compra para poder desbloquear las funciones Pro y restaurarlas para usted. Nunca vemos ni almacenamos los datos de su tarjeta de pago o de facturación: estos son gestionados íntegramente por Google.","h_provide":"Información que usted decide proporcionar","p_provide":"Si nos envía un correo electrónico (para soporte o comentarios), recibimos la dirección de correo electrónico y el contenido del mensaje que nos envía, y los usamos únicamente para responderle.","h2":"2. Sensores","p_sensors":"La App lee los sensores de movimiento del dispositivo (acelerómetro y magnetómetro) para las funciones de brújula, nivel e inclinación. Estos datos de los sensores se usan en su dispositivo en tiempo real y no constituyen información personal sobre usted.","h3":"3. Servicios de terceros","p_third_intro":"La App se apoya en los siguientes servicios de terceros, cada uno regido por su propia política de privacidad:","tp_advertising":"(publicidad)","tp_analytics":"Google Analytics for Firebase & Firebase Crashlytics","tp_notifications":"(notificaciones)","tp_purchases":"(compras)","li_weather":"Se puede consultar a un proveedor externo de datos meteorológicos utilizando su ubicación para mostrar las condiciones actuales.","h4":"4. Anuncios y sus opciones","p_ads_intro":"Los anuncios son publicados por Google AdMob. Puede controlar la publicidad personalizada en su dispositivo:","li_android":"Android: Configuración → Google → Anuncios → excluir o restablecer su ID de publicidad.","li_remove":"Eliminar los anuncios por completo: compre la mejora Pro de pago único en la App.","h5":"5. Cómo compartimos la información","p_share":"No vendemos su información personal. La información solo se comparte con los proveedores de servicios indicados en la Sección 3 para que puedan realizar sus funciones (por ejemplo, mostrar mapas o anuncios), y cuando lo exija la ley, un proceso legal, o para proteger los derechos, la seguridad o la propiedad de nuestros usuarios, del público o nuestros.","h6":"6. Conservación de datos","p_ret":"Las fotos, los vídeos y los ajustes de la app creados por la App permanecen en su dispositivo hasta que los elimine o desinstale la App. Los datos gestionados por los servicios de terceros de la Sección 3 se conservan según sus respectivas políticas.","h7":"7. Seguridad","p_sec":"Adoptamos medidas técnicas y organizativas razonables para proteger la información. Sin embargo, ninguna app, transmisión o sistema de almacenamiento es completamente seguro, y no podemos garantizar una seguridad absoluta.","h8":"8. Privacidad de los menores","p_child":"La App no está dirigida a menores de 13 años (o la edad mínima requerida en su país), y no recopilamos deliberadamente información personal de ellos. Si cree que un menor nos ha proporcionado información, contáctenos y la eliminaremos.","h9":"9. Sus derechos","p_rights":"Según el lugar donde viva (por ejemplo, el EEA/UK bajo el GDPR, o California bajo la CCPA/CPRA), puede tener derechos para acceder, corregir, eliminar o restringir el uso de su información personal, y para excluirse de determinados tratamientos. Puede ejercer controles a nivel del dispositivo en cualquier momento revocando los permisos de ubicación, cámara, almacenamiento o notificaciones de la App en la configuración de su dispositivo, y restableciendo o excluyéndose de su ID de publicidad. Para realizar una solicitud de privacidad, contáctenos usando los datos que figuran a continuación.","h10":"10. Usuarios internacionales","p_intl":"La App y los servicios de terceros que utiliza pueden procesar información en países distintos al suyo, donde las leyes de protección de datos pueden diferir. Al usar la App, usted consiente dicho tratamiento conforme a esta política.","h11":"11. Cambios en esta Política de Privacidad","p_changes":"Podemos actualizar esta Política de Privacidad de vez en cuando. Cualquier cambio se publicará en esta página con una fecha de entrada en vigor revisada, así que revísela periódicamente. El uso continuado de la App después de que los cambios entren en vigor significa que acepta la política actualizada.","h12":"12. Contáctenos","p_contact":"Si tiene preguntas, solicitudes o comentarios sobre esta Política de Privacidad o su información, contáctenos en:","footer":"© 2026 GO PRACHI LABS. Todos los derechos reservados."},"ui":{"ui_language":"Idioma","ui_note":"Esta traducción se proporciona para su comodidad. En caso de cualquier discrepancia, la versión en inglés es la legalmente vinculante."}},"pt-BR":{"privacy":{"title":"Política de Privacidade","eff":"Data de vigência: 9 July 2026","intro":"Esta Política de Privacidade explica como a GO PRACHI LABS (“nós”, “nos” ou “nosso”) trata as informações relacionadas ao aplicativo móvel GPS Map Camera & Compass (nome do pacote compass.photo.camera.map.gps.gpsmapcamera_compass) (o “App”). Sua privacidade é importante para nós. Leia esta política com atenção. Ao usar o App, você concorda com as práticas aqui descritas.","note":"Em termos simples: o App carimba suas fotos com sua localização, mostra uma bússola e mapas, e exibe detalhes de sol/lua e clima. Suas fotos e sua localização são processadas no seu dispositivo e não são enviadas aos nossos próprios servidores. Usamos serviços confiáveis do Google para mapas, anúncios, análises, relatórios de falhas, notificações e compras, conforme descrito abaixo.","h1":"1. Informações que coletamos e como as usamos","h_loc":"Informações de localização (precisa e aproximada)","p_loc":"Com a sua permissão, o App acessa a localização do seu dispositivo baseada em GPS e em rede para fornecer seus recursos principais: geolocalizar suas fotos e vídeos (incorporando coordenadas e endereço na imagem), mostrar sua posição em um mapa, calcular a direção da bússola, a declinação magnética e os detalhes de sol/lua e clima da sua localização. A localização é processada no seu dispositivo e incorporada à mídia que você captura. Ela pode ser enviada aos serviços de terceiros listados na Seção 3 (por exemplo, para renderizar mapas ou obter condições climáticas). Não armazenamos sua localização em nossos próprios servidores.","h_cam":"Câmera, fotos e mídia","p_cam":"Com a sua permissão, o App usa sua câmera para tirar fotos e gravar vídeos, e lê/grava mídia para salvar suas capturas na sua galeria e exibi-las no álbum interno do App. Suas fotos e vídeos permanecem no seu dispositivo, a menos que você opte por compartilhá-los ou exportá-los. Não enviamos nem retemos suas fotos ou vídeos.","h_dev":"Informações do dispositivo e de uso","p_dev":"Usamos o Google Analytics for Firebase e o Firebase Crashlytics para entender como o App é usado e para diagnosticar falhas. Isso pode incluir eventos do app (como recursos abertos), modelo do dispositivo, versão do sistema operacional, versão do app, idioma e região/país geral, além de diagnósticos de falhas. Isso nos ajuda a corrigir erros e melhorar o App.","h_ad":"Informações de publicidade","p_ad":"A versão gratuita do App exibe anúncios por meio do Google AdMob. O AdMob pode acessar o identificador de publicidade do seu dispositivo e dados relacionados para veicular e medir anúncios, incluindo anúncios personalizados quando permitido. Consulte a Seção 4 para saber suas opções de anúncios.","h_notif":"Notificações","p_notif":"Se você ativar as notificações, o App usa o Firebase Cloud Messaging (que gera um token de push do dispositivo) para entregar lembretes opcionais, como alertas de hora dourada. Você pode desativar as notificações a qualquer momento nas configurações do seu dispositivo.","h_purch":"Compras","p_purch":"Se você comprar o upgrade opcional único “Remover Anúncios / Pro”, a transação é processada pelo Google Play Billing. Recebemos a confirmação de que uma compra foi feita para que possamos desbloquear os recursos Pro e restaurá-los para você. Nunca vemos nem armazenamos os dados do seu cartão de pagamento ou de faturamento — esses são tratados inteiramente pelo Google.","h_provide":"Informações que você opta por fornecer","p_provide":"Se você nos enviar um e-mail (para suporte ou feedback), recebemos o endereço de e-mail e o conteúdo da mensagem que você envia, e os usamos apenas para responder a você.","h2":"2. Sensores","p_sensors":"O App lê os sensores de movimento do dispositivo (acelerômetro e magnetômetro) para viabilizar os recursos de bússola, nível e inclinação. Esses dados de sensor são usados no seu dispositivo em tempo real e não são informações pessoais sobre você.","h3":"3. Serviços de terceiros","p_third_intro":"O App depende dos seguintes serviços de terceiros, cada um regido por sua própria política de privacidade:","tp_advertising":"(publicidade)","tp_analytics":"Google Analytics for Firebase & Firebase Crashlytics","tp_notifications":"(notificações)","tp_purchases":"(compras)","li_weather":"Um provedor terceirizado de dados meteorológicos pode ser consultado usando sua localização para exibir as condições atuais.","h4":"4. Anúncios e suas opções","p_ads_intro":"Os anúncios são veiculados pelo Google AdMob. Você pode controlar a publicidade personalizada no seu dispositivo:","li_android":"Android: Configurações → Google → Anúncios → cancelar / redefinir seu ID de publicidade.","li_remove":"Remover anúncios totalmente: adquira o upgrade Pro único no App.","h5":"5. Como compartilhamos informações","p_share":"Não vendemos suas informações pessoais. As informações são compartilhadas apenas com os prestadores de serviços listados na Seção 3 para que eles possam desempenhar suas funções (por exemplo, exibir mapas ou anúncios) e quando exigido por lei, processo legal, ou para proteger os direitos, a segurança ou a propriedade de nossos usuários, do público ou de nós mesmos.","h6":"6. Retenção de dados","p_ret":"Fotos, vídeos e configurações do app criados pelo App permanecem no seu dispositivo até que você os exclua ou desinstale o App. Os dados tratados pelos serviços de terceiros na Seção 3 são retidos de acordo com suas respectivas políticas.","h7":"7. Segurança","p_sec":"Adotamos medidas técnicas e organizacionais razoáveis para proteger as informações. No entanto, nenhum app, transmissão ou sistema de armazenamento é completamente seguro, e não podemos garantir segurança absoluta.","h8":"8. Privacidade das crianças","p_child":"O App não é direcionado a crianças menores de 13 anos (ou a idade mínima exigida no seu país), e não coletamos intencionalmente informações pessoais delas. Se você acredita que uma criança nos forneceu informações, entre em contato conosco e as excluiremos.","h9":"9. Seus direitos","p_rights":"Dependendo de onde você mora (por exemplo, no EEA/UK sob o GDPR, ou na Califórnia sob o CCPA/CPRA), você pode ter direitos de acessar, corrigir, excluir ou restringir o uso de suas informações pessoais, e de cancelar determinados tipos de processamento. Você pode exercer controles no nível do dispositivo a qualquer momento revogando as permissões de localização, câmera, armazenamento ou notificação do App nas configurações do seu dispositivo, e redefinindo ou cancelando seu ID de publicidade. Para fazer uma solicitação de privacidade, entre em contato conosco usando os detalhes abaixo.","h10":"10. Usuários internacionais","p_intl":"O App e os serviços de terceiros que ele utiliza podem processar informações em países diferentes do seu, onde as leis de proteção de dados podem ser diferentes. Ao usar o App, você consente com tal processamento de forma consistente com esta política.","h11":"11. Alterações a esta Política de Privacidade","p_changes":"Podemos atualizar esta Política de Privacidade periodicamente. Quaisquer alterações serão publicadas nesta página com uma data de vigência revisada, portanto, revise-a periodicamente. O uso continuado do App após a entrada em vigor das alterações significa que você aceita a política atualizada.","h12":"12. Fale conosco","p_contact":"Se você tiver dúvidas, solicitações ou feedback sobre esta Política de Privacidade ou sobre suas informações, entre em contato conosco em:","footer":"© 2026 GO PRACHI LABS. Todos os direitos reservados."},"ui":{"ui_language":"Idioma","ui_note":"Esta tradução é fornecida para sua conveniência. Em caso de qualquer discrepância, a versão em inglês é a legalmente autoritativa."}},"fr":{"privacy":{"title":"Politique de confidentialité","eff":"Date d’entrée en vigueur : 9 July 2026","intro":"La présente Politique de confidentialité explique comment GO PRACHI LABS (« nous », « notre » ou « nos ») traite les informations en lien avec l’application mobile GPS Map Camera & Compass (nom du package compass.photo.camera.map.gps.gpsmapcamera_compass) (l’« Application »). Votre vie privée nous importe. Veuillez lire attentivement cette politique. En utilisant l’Application, vous acceptez les pratiques décrites ici.","note":"En termes simples : l’Application appose votre localisation sur vos photos, affiche une boussole et des cartes, et présente des informations sur le soleil/la lune et la météo. Vos photos et votre localisation sont traitées sur votre appareil et ne sont pas transférées vers nos propres serveurs. Nous utilisons des services Google de confiance pour les cartes, les publicités, les analyses, les rapports de plantage, les notifications et les achats, comme décrit ci-dessous.","h1":"1. Informations que nous collectons et comment nous les utilisons","h_loc":"Informations de localisation (précise et approximative)","p_loc":"Avec votre autorisation, l’Application accède à la localisation de votre appareil basée sur le GPS et le réseau pour fournir ses fonctionnalités principales : géolocaliser vos photos et vidéos (en intégrant les coordonnées et l’adresse dans l’image), afficher votre position sur une carte, calculer le cap de la boussole, la déclinaison magnétique et les informations sur le soleil/la lune et la météo de votre localisation. La localisation est traitée sur votre appareil et intégrée aux médias que vous capturez. Elle peut être envoyée aux services tiers énumérés à la Section 3 (par exemple, pour afficher des cartes ou obtenir les conditions météorologiques). Nous ne stockons pas votre localisation sur nos propres serveurs.","h_cam":"Appareil photo, photos et médias","p_cam":"Avec votre autorisation, l’Application utilise votre appareil photo pour prendre des photos et enregistrer des vidéos, et lit/écrit des médias afin d’enregistrer vos captures dans votre galerie et de les afficher dans l’album intégré à l’application. Vos photos et vidéos restent sur votre appareil sauf si vous choisissez de les partager ou de les exporter. Nous ne téléversons ni ne conservons vos photos ou vidéos.","h_dev":"Informations sur l’appareil et l’utilisation","p_dev":"Nous utilisons Google Analytics for Firebase et Firebase Crashlytics pour comprendre comment l’Application est utilisée et pour diagnostiquer les plantages. Cela peut inclure des événements de l’application (comme les fonctionnalités ouvertes), le modèle de l’appareil, la version du système d’exploitation, la version de l’application, la langue et la région/le pays général, ainsi que des diagnostics de plantage. Cela nous aide à corriger les bugs et à améliorer l’Application.","h_ad":"Informations publicitaires","p_ad":"La version gratuite de l’Application affiche des publicités via Google AdMob. AdMob peut accéder à l’identifiant publicitaire de votre appareil et aux données associées pour diffuser et mesurer les publicités, y compris des publicités personnalisées lorsque cela est autorisé. Consultez la Section 4 pour vos choix en matière de publicité.","h_notif":"Notifications","p_notif":"Si vous activez les notifications, l’Application utilise Firebase Cloud Messaging (qui génère un jeton push d’appareil) pour délivrer des rappels facultatifs tels que les alertes d’heure dorée. Vous pouvez désactiver les notifications à tout moment dans les paramètres de votre appareil.","h_purch":"Achats","p_purch":"Si vous achetez la mise à niveau facultative unique « Supprimer les publicités / Pro », la transaction est traitée par Google Play Billing. Nous recevons la confirmation qu’un achat a été effectué afin de pouvoir débloquer les fonctionnalités Pro et les restaurer pour vous. Nous ne voyons ni ne stockons jamais les informations de votre carte de paiement ou de facturation — celles-ci sont entièrement gérées par Google.","h_provide":"Informations que vous choisissez de fournir","p_provide":"Si vous nous envoyez un e-mail (pour une assistance ou un retour), nous recevons l’adresse e-mail et le contenu du message que vous envoyez, et nous les utilisons uniquement pour vous répondre.","h2":"2. Capteurs","p_sensors":"L’Application lit les capteurs de mouvement de l’appareil (accéléromètre et magnétomètre) pour alimenter les fonctionnalités de boussole, de niveau et d’inclinaison. Ces données de capteur sont utilisées sur votre appareil en temps réel et ne constituent pas des informations personnelles vous concernant.","h3":"3. Services tiers","p_third_intro":"L’Application repose sur les services tiers suivants, chacun régi par sa propre politique de confidentialité :","tp_advertising":"(publicité)","tp_analytics":"Google Analytics for Firebase & Firebase Crashlytics","tp_notifications":"(notifications)","tp_purchases":"(achats)","li_weather":"Un fournisseur tiers de données météorologiques peut être interrogé à l’aide de votre localisation pour afficher les conditions actuelles.","h4":"4. Publicités et vos choix","p_ads_intro":"Les publicités sont diffusées par Google AdMob. Vous pouvez contrôler la publicité personnalisée sur votre appareil :","li_android":"Android : Paramètres → Google → Annonces → désactiver / réinitialiser votre identifiant publicitaire.","li_remove":"Supprimer entièrement les publicités : achetez la mise à niveau Pro unique dans l’Application.","h5":"5. Comment nous partageons les informations","p_share":"Nous ne vendons pas vos informations personnelles. Les informations ne sont partagées qu’avec les prestataires de services énumérés à la Section 3 afin qu’ils puissent exercer leurs fonctions (par exemple, afficher des cartes ou des publicités), et lorsque la loi, une procédure légale l’exige, ou pour protéger les droits, la sécurité ou les biens de nos utilisateurs, du public ou de nous-mêmes.","h6":"6. Conservation des données","p_ret":"Les photos, vidéos et paramètres de l’application créés par l’Application restent sur votre appareil jusqu’à ce que vous les supprimiez ou désinstalliez l’Application. Les données traitées par les services tiers de la Section 3 sont conservées conformément à leurs politiques respectives.","h7":"7. Sécurité","p_sec":"Nous prenons des mesures techniques et organisationnelles raisonnables pour protéger les informations. Cependant, aucune application, transmission ou système de stockage n’est totalement sécurisé, et nous ne pouvons pas garantir une sécurité absolue.","h8":"8. Confidentialité des enfants","p_child":"L’Application ne s’adresse pas aux enfants de moins de 13 ans (ou l’âge minimum requis dans votre pays), et nous ne collectons pas sciemment d’informations personnelles les concernant. Si vous pensez qu’un enfant nous a fourni des informations, veuillez nous contacter et nous les supprimerons.","h9":"9. Vos droits","p_rights":"Selon votre lieu de résidence (par exemple, l’EEA/UK sous le GDPR, ou la Californie sous le CCPA/CPRA), vous pouvez disposer de droits pour accéder à vos informations personnelles, les corriger, les supprimer ou en restreindre l’utilisation, et pour vous opposer à certains traitements. Vous pouvez exercer des contrôles au niveau de l’appareil à tout moment en révoquant les autorisations de localisation, d’appareil photo, de stockage ou de notification de l’Application dans les paramètres de votre appareil, et en réinitialisant votre identifiant publicitaire ou en le désactivant. Pour effectuer une demande de confidentialité, contactez-nous en utilisant les coordonnées ci-dessous.","h10":"10. Utilisateurs internationaux","p_intl":"L’Application et les services tiers qu’elle utilise peuvent traiter des informations dans des pays autres que le vôtre, où les lois sur la protection des données peuvent différer. En utilisant l’Application, vous consentez à un tel traitement conformément à cette politique.","h11":"11. Modifications de cette Politique de confidentialité","p_changes":"Nous pouvons mettre à jour cette Politique de confidentialité de temps à autre. Toute modification sera publiée sur cette page avec une date d’entrée en vigueur révisée, veuillez donc la consulter périodiquement. L’utilisation continue de l’Application après l’entrée en vigueur des modifications signifie que vous acceptez la politique mise à jour.","h12":"12. Nous contacter","p_contact":"Si vous avez des questions, des demandes ou des retours concernant cette Politique de confidentialité ou vos informations, contactez-nous à :","footer":"© 2026 GO PRACHI LABS. Tous droits réservés."},"ui":{"ui_language":"Langue","ui_note":"Cette traduction est fournie pour votre commodité. En cas de divergence, la version anglaise fait foi juridiquement."}},"de":{"privacy":{"title":"Datenschutzrichtlinie","eff":"Datum des Inkrafttretens: 9 July 2026","intro":"Diese Datenschutzrichtlinie erläutert, wie GO PRACHI LABS („wir“, „uns“ oder „unser“) Informationen im Zusammenhang mit der mobilen Anwendung GPS Map Camera & Compass (Paketname compass.photo.camera.map.gps.gpsmapcamera_compass) (die „App“) verarbeitet. Ihre Privatsphäre ist uns wichtig. Bitte lesen Sie diese Richtlinie sorgfältig. Durch die Nutzung der App stimmen Sie den hier beschriebenen Praktiken zu.","note":"Vereinfacht gesagt: Die App versieht Ihre Fotos mit Ihrem Standort, zeigt einen Kompass und Karten an und stellt Sonnen-/Mond- und Wetterdetails dar. Ihre Fotos und Ihr Standort werden auf Ihrem Gerät verarbeitet und nicht auf unsere eigenen Server hochgeladen. Wir nutzen vertrauenswürdige Google-Dienste für Karten, Werbung, Analysen, Absturzberichte, Benachrichtigungen und Käufe, wie unten beschrieben.","h1":"1. Informationen, die wir erheben, und wie wir sie verwenden","h_loc":"Standortinformationen (präzise und ungefähr)","p_loc":"Mit Ihrer Erlaubnis greift die App auf den GPS- und netzwerkbasierten Standort Ihres Geräts zu, um ihre Kernfunktionen bereitzustellen: das Geotaggen Ihrer Fotos und Videos (Einbetten von Koordinaten und Adresse in das Bild), das Anzeigen Ihrer Position auf einer Karte, das Berechnen der Kompassrichtung, der magnetischen Deklination sowie der Sonnen-/Mond- und Wetterdetails für Ihren Standort. Der Standort wird auf Ihrem Gerät verarbeitet und in die von Ihnen aufgenommenen Medien eingebettet. Er kann an die in Abschnitt 3 aufgeführten Drittanbieterdienste gesendet werden (zum Beispiel zur Darstellung von Karten oder zum Abrufen von Wetterbedingungen). Wir speichern Ihren Standort nicht auf unseren eigenen Servern.","h_cam":"Kamera, Fotos und Medien","p_cam":"Mit Ihrer Erlaubnis verwendet die App Ihre Kamera, um Fotos aufzunehmen und Videos aufzuzeichnen, und liest/schreibt Medien, damit sie Ihre Aufnahmen in Ihrer Galerie speichern und im In-App-Album anzeigen kann. Ihre Fotos und Videos verbleiben auf Ihrem Gerät, sofern Sie sie nicht teilen oder exportieren. Wir laden Ihre Fotos oder Videos weder hoch noch bewahren wir sie auf.","h_dev":"Geräte- und Nutzungsinformationen","p_dev":"Wir verwenden Google Analytics for Firebase und Firebase Crashlytics, um zu verstehen, wie die App genutzt wird, und um Abstürze zu diagnostizieren. Dies kann App-Ereignisse (wie geöffnete Funktionen), Gerätemodell, Betriebssystemversion, App-Version, Sprache und allgemeine Region/Land sowie Absturzdiagnosen umfassen. Dies hilft uns, Fehler zu beheben und die App zu verbessern.","h_ad":"Werbeinformationen","p_ad":"Die kostenlose Version der App zeigt Werbung über Google AdMob an. AdMob kann auf die Werbe-ID Ihres Geräts und zugehörige Daten zugreifen, um Anzeigen auszuliefern und zu messen, einschließlich personalisierter Anzeigen, sofern zulässig. Siehe Abschnitt 4 für Ihre Werbeoptionen.","h_notif":"Benachrichtigungen","p_notif":"Wenn Sie Benachrichtigungen aktivieren, verwendet die App Firebase Cloud Messaging (das ein Geräte-Push-Token generiert), um optionale Erinnerungen wie Warnungen zur goldenen Stunde zu übermitteln. Sie können Benachrichtigungen jederzeit in den Einstellungen Ihres Geräts deaktivieren.","h_purch":"Käufe","p_purch":"Wenn Sie das optionale einmalige Upgrade „Werbung entfernen / Pro“ kaufen, wird die Transaktion über Google Play Billing abgewickelt. Wir erhalten die Bestätigung, dass ein Kauf getätigt wurde, damit wir die Pro-Funktionen freischalten und für Sie wiederherstellen können. Wir sehen oder speichern niemals Ihre Zahlungskarten- oder Abrechnungsdaten — diese werden ausschließlich von Google verarbeitet.","h_provide":"Informationen, die Sie freiwillig bereitstellen","p_provide":"Wenn Sie uns eine E-Mail schreiben (für Support oder Feedback), erhalten wir die E-Mail-Adresse und den Nachrichteninhalt, den Sie senden, und verwenden diese nur, um Ihnen zu antworten.","h2":"2. Sensoren","p_sensors":"Die App liest die Bewegungssensoren des Geräts (Beschleunigungsmesser und Magnetometer) aus, um die Kompass-, Wasserwaagen- und Neigungsfunktionen zu betreiben. Diese Sensordaten werden auf Ihrem Gerät in Echtzeit verwendet und sind keine personenbezogenen Informationen über Sie.","h3":"3. Drittanbieterdienste","p_third_intro":"Die App stützt sich auf die folgenden Drittanbieterdienste, die jeweils ihrer eigenen Datenschutzrichtlinie unterliegen:","tp_advertising":"(Werbung)","tp_analytics":"Google Analytics for Firebase & Firebase Crashlytics","tp_notifications":"(Benachrichtigungen)","tp_purchases":"(Käufe)","li_weather":"Ein Drittanbieter von Wetterdaten kann unter Verwendung Ihres Standorts abgefragt werden, um die aktuellen Bedingungen anzuzeigen.","h4":"4. Werbung und Ihre Auswahlmöglichkeiten","p_ads_intro":"Anzeigen werden von Google AdMob ausgeliefert. Sie können personalisierte Werbung auf Ihrem Gerät steuern:","li_android":"Android: Einstellungen → Google → Anzeigen → Werbe-ID deaktivieren / zurücksetzen.","li_remove":"Werbung vollständig entfernen: Kaufen Sie das einmalige Pro-Upgrade in der App.","h5":"5. Wie wir Informationen weitergeben","p_share":"Wir verkaufen Ihre personenbezogenen Informationen nicht. Informationen werden nur mit den in Abschnitt 3 aufgeführten Dienstanbietern geteilt, damit diese ihre Funktionen erfüllen können (zum Beispiel das Anzeigen von Karten oder Anzeigen), sowie soweit gesetzlich, durch ein rechtliches Verfahren erforderlich oder zum Schutz der Rechte, der Sicherheit oder des Eigentums unserer Nutzer, der Öffentlichkeit oder von uns.","h6":"6. Datenaufbewahrung","p_ret":"Von der App erstellte Fotos, Videos und App-Einstellungen verbleiben auf Ihrem Gerät, bis Sie sie löschen oder die App deinstallieren. Von den Drittanbieterdiensten in Abschnitt 3 verarbeitete Daten werden gemäß deren jeweiligen Richtlinien aufbewahrt.","h7":"7. Sicherheit","p_sec":"Wir treffen angemessene technische und organisatorische Maßnahmen zum Schutz von Informationen. Allerdings ist keine App, Übertragung oder kein Speichersystem vollkommen sicher, und wir können keine absolute Sicherheit garantieren.","h8":"8. Datenschutz von Kindern","p_child":"Die App richtet sich nicht an Kinder unter 13 Jahren (oder das in Ihrem Land erforderliche Mindestalter), und wir erheben wissentlich keine personenbezogenen Informationen von ihnen. Wenn Sie glauben, dass ein Kind uns Informationen bereitgestellt hat, kontaktieren Sie uns bitte, und wir werden diese löschen.","h9":"9. Ihre Rechte","p_rights":"Abhängig von Ihrem Wohnort (zum Beispiel im EEA/UK gemäß GDPR oder in Kalifornien gemäß CCPA/CPRA) haben Sie möglicherweise das Recht, auf Ihre personenbezogenen Informationen zuzugreifen, sie zu korrigieren, zu löschen oder deren Nutzung einzuschränken sowie bestimmten Verarbeitungen zu widersprechen. Sie können jederzeit Kontrollen auf Geräteebene ausüben, indem Sie die Standort-, Kamera-, Speicher- oder Benachrichtigungsberechtigungen der App in den Einstellungen Ihres Geräts widerrufen und indem Sie Ihre Werbe-ID zurücksetzen oder deaktivieren. Um eine Datenschutzanfrage zu stellen, kontaktieren Sie uns über die unten stehenden Angaben.","h10":"10. Internationale Nutzer","p_intl":"Die App und die von ihr genutzten Drittanbieterdienste können Informationen in anderen Ländern als Ihrem eigenen verarbeiten, in denen die Datenschutzgesetze abweichen können. Durch die Nutzung der App stimmen Sie einer solchen Verarbeitung im Einklang mit dieser Richtlinie zu.","h11":"11. Änderungen dieser Datenschutzrichtlinie","p_changes":"Wir können diese Datenschutzrichtlinie von Zeit zu Zeit aktualisieren. Alle Änderungen werden auf dieser Seite mit einem überarbeiteten Datum des Inkrafttretens veröffentlicht, daher überprüfen Sie sie bitte regelmäßig. Die fortgesetzte Nutzung der App nach Inkrafttreten der Änderungen bedeutet, dass Sie die aktualisierte Richtlinie akzeptieren.","h12":"12. Kontaktieren Sie uns","p_contact":"Wenn Sie Fragen, Anfragen oder Feedback zu dieser Datenschutzrichtlinie oder zu Ihren Informationen haben, kontaktieren Sie uns unter:","footer":"© 2026 GO PRACHI LABS. Alle Rechte vorbehalten."},"ui":{"ui_language":"Sprache","ui_note":"Diese Übersetzung wird zu Ihrer Bequemlichkeit bereitgestellt. Im Falle von Abweichungen ist die englische Fassung rechtlich maßgeblich."}},"it":{"privacy":{"title":"Informativa sulla privacy","eff":"Data di entrata in vigore: 9 July 2026","intro":"La presente Informativa sulla privacy spiega come GO PRACHI LABS (“noi”, “ci” o “nostro”) tratta le informazioni relative all’applicazione mobile GPS Map Camera & Compass (nome del pacchetto compass.photo.camera.map.gps.gpsmapcamera_compass) (l’“App”). La tua privacy è importante per noi. Ti preghiamo di leggere attentamente questa informativa. Utilizzando l’App, accetti le pratiche qui descritte.","note":"In parole semplici: l’App appone la tua posizione sulle tue foto, mostra una bussola e mappe e visualizza dettagli su sole/luna e meteo. Le tue foto e la tua posizione vengono elaborate sul tuo dispositivo e non vengono caricate sui nostri server. Utilizziamo servizi Google affidabili per mappe, annunci, analisi, segnalazioni di arresti anomali, notifiche e acquisti, come descritto di seguito.","h1":"1. Informazioni che raccogliamo e come le utilizziamo","h_loc":"Informazioni sulla posizione (precisa e approssimativa)","p_loc":"Con il tuo permesso, l’App accede alla posizione del tuo dispositivo basata su GPS e rete per fornire le sue funzioni principali: geolocalizzare le tue foto e i tuoi video (incorporando coordinate e indirizzo nell’immagine), mostrare la tua posizione su una mappa, calcolare la direzione della bussola, la declinazione magnetica e i dettagli su sole/luna e meteo per la tua posizione. La posizione viene elaborata sul tuo dispositivo e incorporata nei contenuti multimediali che acquisisci. Può essere inviata ai servizi di terze parti elencati nella Sezione 3 (ad esempio, per visualizzare le mappe o recuperare le condizioni meteorologiche). Non memorizziamo la tua posizione sui nostri server.","h_cam":"Fotocamera, foto e contenuti multimediali","p_cam":"Con il tuo permesso, l’App utilizza la tua fotocamera per scattare foto e registrare video e legge/scrive contenuti multimediali per salvare le tue acquisizioni nella tua galleria e mostrarle nell’album interno all’app. Le tue foto e i tuoi video rimangono sul tuo dispositivo a meno che tu non scelga di condividerli o esportarli. Non carichiamo né conserviamo le tue foto o i tuoi video.","h_dev":"Informazioni sul dispositivo e sull’utilizzo","p_dev":"Utilizziamo Google Analytics for Firebase e Firebase Crashlytics per capire come viene utilizzata l’App e per diagnosticare gli arresti anomali. Questo può includere eventi dell’app (come le funzioni aperte), modello del dispositivo, versione del sistema operativo, versione dell’app, lingua e regione/paese generale, oltre alle diagnostiche degli arresti anomali. Questo ci aiuta a correggere i bug e a migliorare l’App.","h_ad":"Informazioni pubblicitarie","p_ad":"La versione gratuita dell’App mostra annunci tramite Google AdMob. AdMob può accedere all’identificativo pubblicitario del tuo dispositivo e ai dati correlati per pubblicare e misurare gli annunci, inclusi annunci personalizzati ove consentito. Consulta la Sezione 4 per le tue opzioni pubblicitarie.","h_notif":"Notifiche","p_notif":"Se abiliti le notifiche, l’App utilizza Firebase Cloud Messaging (che genera un token push del dispositivo) per fornire promemoria facoltativi come gli avvisi dell’ora d’oro. Puoi disattivare le notifiche in qualsiasi momento nelle impostazioni del tuo dispositivo.","h_purch":"Acquisti","p_purch":"Se acquisti l’aggiornamento facoltativo una tantum “Rimuovi annunci / Pro”, la transazione viene elaborata da Google Play Billing. Riceviamo la conferma che è stato effettuato un acquisto in modo da poter sbloccare le funzioni Pro e ripristinarle per te. Non vediamo né memorizziamo mai i dati della tua carta di pagamento o di fatturazione — questi sono gestiti interamente da Google.","h_provide":"Informazioni che scegli di fornire","p_provide":"Se ci invii un’e-mail (per assistenza o feedback), riceviamo l’indirizzo e-mail e il contenuto del messaggio che invii, e li utilizziamo solo per risponderti.","h2":"2. Sensori","p_sensors":"L’App legge i sensori di movimento del dispositivo (accelerometro e magnetometro) per alimentare le funzioni di bussola, livella e inclinazione. Questi dati dei sensori vengono utilizzati sul tuo dispositivo in tempo reale e non costituiscono informazioni personali su di te.","h3":"3. Servizi di terze parti","p_third_intro":"L’App si basa sui seguenti servizi di terze parti, ciascuno regolato dalla propria informativa sulla privacy:","tp_advertising":"(pubblicità)","tp_analytics":"Google Analytics for Firebase & Firebase Crashlytics","tp_notifications":"(notifiche)","tp_purchases":"(acquisti)","li_weather":"Un fornitore terzo di dati meteorologici può essere interrogato utilizzando la tua posizione per mostrare le condizioni attuali.","h4":"4. Annunci e le tue scelte","p_ads_intro":"Gli annunci sono pubblicati da Google AdMob. Puoi controllare la pubblicità personalizzata sul tuo dispositivo:","li_android":"Android: Impostazioni → Google → Annunci → disattiva / reimposta il tuo ID pubblicità.","li_remove":"Rimuovere completamente gli annunci: acquista l’aggiornamento Pro una tantum nell’App.","h5":"5. Come condividiamo le informazioni","p_share":"Non vendiamo le tue informazioni personali. Le informazioni sono condivise solo con i fornitori di servizi elencati nella Sezione 3 affinché possano svolgere le loro funzioni (ad esempio, mostrare mappe o annunci) e ove richiesto dalla legge, da un procedimento legale, o per proteggere i diritti, la sicurezza o la proprietà dei nostri utenti, del pubblico o di noi stessi.","h6":"6. Conservazione dei dati","p_ret":"Foto, video e impostazioni dell’app create dall’App rimangono sul tuo dispositivo finché non le elimini o disinstalli l’App. I dati gestiti dai servizi di terze parti nella Sezione 3 sono conservati secondo le rispettive politiche.","h7":"7. Sicurezza","p_sec":"Adottiamo misure tecniche e organizzative ragionevoli per proteggere le informazioni. Tuttavia, nessuna app, trasmissione o sistema di archiviazione è completamente sicuro, e non possiamo garantire una sicurezza assoluta.","h8":"8. Privacy dei minori","p_child":"L’App non è rivolta ai minori di 13 anni (o all’età minima richiesta nel tuo paese), e non raccogliamo consapevolmente informazioni personali da loro. Se ritieni che un minore ci abbia fornito informazioni, ti preghiamo di contattarci e le elimineremo.","h9":"9. I tuoi diritti","p_rights":"A seconda di dove vivi (ad esempio, l’EEA/UK ai sensi del GDPR, o la California ai sensi del CCPA/CPRA), potresti avere il diritto di accedere, correggere, eliminare o limitare l’uso delle tue informazioni personali, e di rinunciare a determinati trattamenti. Puoi esercitare i controlli a livello di dispositivo in qualsiasi momento revocando le autorizzazioni di posizione, fotocamera, archiviazione o notifica dell’App nelle impostazioni del tuo dispositivo, e reimpostando o rinunciando al tuo ID pubblicità. Per effettuare una richiesta relativa alla privacy, contattaci utilizzando i recapiti indicati di seguito.","h10":"10. Utenti internazionali","p_intl":"L’App e i servizi di terze parti che utilizza possono elaborare informazioni in paesi diversi dal tuo, dove le leggi sulla protezione dei dati possono differire. Utilizzando l’App acconsenti a tale trattamento in conformità con la presente informativa.","h11":"11. Modifiche alla presente Informativa sulla privacy","p_changes":"Potremmo aggiornare di tanto in tanto la presente Informativa sulla privacy. Eventuali modifiche saranno pubblicate su questa pagina con una data di entrata in vigore aggiornata, quindi ti preghiamo di consultarla periodicamente. L’uso continuato dell’App dopo l’entrata in vigore delle modifiche significa che accetti l’informativa aggiornata.","h12":"12. Contattaci","p_contact":"Se hai domande, richieste o feedback riguardo alla presente Informativa sulla privacy o alle tue informazioni, contattaci all’indirizzo:","footer":"© 2026 GO PRACHI LABS. Tutti i diritti riservati."},"ui":{"ui_language":"Lingua","ui_note":"Questa traduzione è fornita per tua comodità. In caso di eventuali discrepanze, la versione inglese è quella giuridicamente autorevole."}},"ru":{"privacy":{"title":"Политика конфиденциальности","eff":"Дата вступления в силу: 9 July 2026","intro":"Настоящая Политика конфиденциальности объясняет, как GO PRACHI LABS («мы», «нас» или «наш») обрабатывает информацию в связи с мобильным приложением GPS Map Camera & Compass (имя пакета compass.photo.camera.map.gps.gpsmapcamera_compass) («Приложение»). Ваша конфиденциальность важна для нас. Пожалуйста, внимательно прочитайте эту политику. Используя Приложение, вы соглашаетесь с описанными здесь практиками.","note":"Проще говоря: Приложение наносит на ваши фотографии ваше местоположение, показывает компас и карты, а также отображает сведения о солнце/луне и погоде. Ваши фотографии и местоположение обрабатываются на вашем устройстве и не загружаются на наши собственные серверы. Мы используем надёжные сервисы Google для карт, рекламы, аналитики, отчётов о сбоях, уведомлений и покупок, как описано ниже.","h1":"1. Информация, которую мы собираем, и как мы её используем","h_loc":"Информация о местоположении (точная и приблизительная)","p_loc":"С вашего разрешения Приложение получает доступ к местоположению вашего устройства на основе GPS и сети для предоставления своих основных функций: геотегирования ваших фотографий и видео (встраивания координат и адреса в изображение), отображения вашей позиции на карте, вычисления курса компаса, магнитного склонения и сведений о солнце/луне и погоде для вашего местоположения. Местоположение обрабатывается на вашем устройстве и встраивается в захватываемые вами медиафайлы. Оно может быть отправлено сторонним сервисам, перечисленным в Разделе 3 (например, для отображения карт или получения погодных условий). Мы не храним ваше местоположение на наших собственных серверах.","h_cam":"Камера, фотографии и медиафайлы","p_cam":"С вашего разрешения Приложение использует вашу камеру для съёмки фотографий и записи видео, а также читает/записывает медиафайлы, чтобы сохранять ваши снимки в галерею и отображать их во встроенном альбоме приложения. Ваши фотографии и видео остаются на вашем устройстве, если только вы не решите поделиться ими или экспортировать их. Мы не загружаем и не сохраняем ваши фотографии или видео.","h_dev":"Информация об устройстве и использовании","p_dev":"Мы используем Google Analytics for Firebase и Firebase Crashlytics, чтобы понимать, как используется Приложение, и диагностировать сбои. Это может включать события приложения (например, открытые функции), модель устройства, версию операционной системы, версию приложения, язык и общий регион/страну, а также диагностику сбоев. Это помогает нам исправлять ошибки и улучшать Приложение.","h_ad":"Рекламная информация","p_ad":"Бесплатная версия Приложения показывает рекламу через Google AdMob. AdMob может получать доступ к рекламному идентификатору вашего устройства и связанным данным для показа и измерения рекламы, включая персонализированную рекламу, где это разрешено. См. Раздел 4 для ваших вариантов выбора рекламы.","h_notif":"Уведомления","p_notif":"Если вы включите уведомления, Приложение использует Firebase Cloud Messaging (который создаёт push-токен устройства) для доставки необязательных напоминаний, таких как оповещения о золотом часе. Вы можете отключить уведомления в любое время в настройках вашего устройства.","h_purch":"Покупки","p_purch":"Если вы приобретаете необязательное единоразовое обновление «Убрать рекламу / Pro», транзакция обрабатывается Google Play Billing. Мы получаем подтверждение того, что покупка была совершена, чтобы разблокировать функции Pro и восстановить их для вас. Мы никогда не видим и не храним данные вашей платёжной карты или платёжные реквизиты — они полностью обрабатываются Google.","h_provide":"Информация, которую вы предоставляете по своему выбору","p_provide":"Если вы пишете нам по электронной почте (для поддержки или обратной связи), мы получаем адрес электронной почты и содержание отправленного вами сообщения и используем их только для того, чтобы ответить вам.","h2":"2. Датчики","p_sensors":"Приложение считывает датчики движения устройства (акселерометр и магнитометр) для работы функций компаса, уровня и наклона. Эти данные датчиков используются на вашем устройстве в реальном времени и не являются личной информацией о вас.","h3":"3. Сторонние сервисы","p_third_intro":"Приложение опирается на следующие сторонние сервисы, каждый из которых регулируется собственной политикой конфиденциальности:","tp_advertising":"(реклама)","tp_analytics":"Google Analytics for Firebase & Firebase Crashlytics","tp_notifications":"(уведомления)","tp_purchases":"(покупки)","li_weather":"Сторонний поставщик данных о погоде может запрашиваться с использованием вашего местоположения для отображения текущих условий.","h4":"4. Реклама и ваш выбор","p_ads_intro":"Реклама предоставляется Google AdMob. Вы можете управлять персонализированной рекламой на вашем устройстве:","li_android":"Android: Настройки → Google → Реклама → отказаться от / сбросить ваш рекламный идентификатор.","li_remove":"Полное удаление рекламы: приобретите единоразовое обновление Pro в Приложении.","h5":"5. Как мы передаём информацию","p_share":"Мы не продаём вашу личную информацию. Информация передаётся только поставщикам услуг, перечисленным в Разделе 3, чтобы они могли выполнять свои функции (например, показывать карты или рекламу), а также когда это требуется по закону, в рамках юридической процедуры или для защиты прав, безопасности или собственности наших пользователей, общества или нас самих.","h6":"6. Хранение данных","p_ret":"Фотографии, видео и настройки приложения, созданные Приложением, остаются на вашем устройстве, пока вы не удалите их или не удалите Приложение. Данные, обрабатываемые сторонними сервисами в Разделе 3, хранятся в соответствии с их соответствующими политиками.","h7":"7. Безопасность","p_sec":"Мы принимаем разумные технические и организационные меры для защиты информации. Однако ни одно приложение, передача или система хранения не являются полностью безопасными, и мы не можем гарантировать абсолютную безопасность.","h8":"8. Конфиденциальность детей","p_child":"Приложение не предназначено для детей младше 13 лет (или минимального возраста, требуемого в вашей стране), и мы сознательно не собираем личную информацию от них. Если вы считаете, что ребёнок предоставил нам информацию, пожалуйста, свяжитесь с нами, и мы её удалим.","h9":"9. Ваши права","p_rights":"В зависимости от того, где вы проживаете (например, в EEA/UK согласно GDPR или в Калифорнии согласно CCPA/CPRA), вы можете иметь права на доступ, исправление, удаление или ограничение использования вашей личной информации, а также на отказ от определённой обработки. Вы можете в любое время воспользоваться средствами управления на уровне устройства, отозвав разрешения Приложения на местоположение, камеру, хранилище или уведомления в настройках вашего устройства, а также сбросив рекламный идентификатор или отказавшись от него. Чтобы подать запрос, связанный с конфиденциальностью, свяжитесь с нами, используя приведённые ниже данные.","h10":"10. Международные пользователи","p_intl":"Приложение и используемые им сторонние сервисы могут обрабатывать информацию в странах, отличных от вашей, где законы о защите данных могут отличаться. Используя Приложение, вы соглашаетесь на такую обработку в соответствии с настоящей политикой.","h11":"11. Изменения в настоящей Политике конфиденциальности","p_changes":"Мы можем время от времени обновлять настоящую Политику конфиденциальности. Любые изменения будут размещены на этой странице с обновлённой датой вступления в силу, поэтому, пожалуйста, периодически просматривайте её. Продолжение использования Приложения после вступления изменений в силу означает, что вы принимаете обновлённую политику.","h12":"12. Свяжитесь с нами","p_contact":"Если у вас есть вопросы, запросы или отзывы о настоящей Политике конфиденциальности или о вашей информации, свяжитесь с нами по адресу:","footer":"© 2026 GO PRACHI LABS. Все права защищены."},"ui":{"ui_language":"Язык","ui_note":"Этот перевод предоставлен для вашего удобства. В случае каких-либо расхождений юридически действительной является английская версия."}},"uk":{"privacy":{"title":"Політика конфіденційності","eff":"Дата набрання чинності: 9 July 2026","intro":"Ця Політика конфіденційності пояснює, як GO PRACHI LABS («ми», «нас» або «наш») обробляє інформацію у зв’язку з мобільним застосунком GPS Map Camera & Compass (назва пакета compass.photo.camera.map.gps.gpsmapcamera_compass) («Застосунок»). Ваша конфіденційність важлива для нас. Будь ласка, уважно прочитайте цю політику. Використовуючи Застосунок, ви погоджуєтеся з описаними тут практиками.","note":"Простіше кажучи: Застосунок наносить на ваші фотографії ваше місцезнаходження, показує компас і карти та відображає відомості про сонце/місяць і погоду. Ваші фотографії та місцезнаходження обробляються на вашому пристрої й не завантажуються на наші власні сервери. Ми використовуємо надійні сервіси Google для карт, реклами, аналітики, звітів про збої, сповіщень і покупок, як описано нижче.","h1":"1. Інформація, яку ми збираємо, і як ми її використовуємо","h_loc":"Інформація про місцезнаходження (точне та приблизне)","p_loc":"З вашого дозволу Застосунок отримує доступ до місцезнаходження вашого пристрою на основі GPS і мережі, щоб надавати свої основні функції: геотегування ваших фотографій і відео (вбудовування координат та адреси в зображення), відображення вашого положення на карті, обчислення курсу компаса, магнітного схилення та відомостей про сонце/місяць і погоду для вашого місцезнаходження. Місцезнаходження обробляється на вашому пристрої й вбудовується в медіафайли, які ви знімаєте. Воно може надсилатися стороннім сервісам, переліченим у Розділі 3 (наприклад, для відображення карт або отримання погодних умов). Ми не зберігаємо ваше місцезнаходження на наших власних серверах.","h_cam":"Камера, фотографії та медіафайли","p_cam":"З вашого дозволу Застосунок використовує вашу камеру для зйомки фотографій і запису відео, а також читає/записує медіафайли, щоб зберігати ваші знімки у вашій галереї та відображати їх у вбудованому альбомі застосунку. Ваші фотографії та відео залишаються на вашому пристрої, якщо ви не вирішите поділитися ними або експортувати їх. Ми не завантажуємо і не зберігаємо ваші фотографії чи відео.","h_dev":"Інформація про пристрій та використання","p_dev":"Ми використовуємо Google Analytics for Firebase і Firebase Crashlytics, щоб розуміти, як використовується Застосунок, і діагностувати збої. Це може включати події застосунку (наприклад, відкриті функції), модель пристрою, версію операційної системи, версію застосунку, мову та загальний регіон/країну, а також діагностику збоїв. Це допомагає нам виправляти помилки та вдосконалювати Застосунок.","h_ad":"Рекламна інформація","p_ad":"Безкоштовна версія Застосунку показує рекламу через Google AdMob. AdMob може отримувати доступ до рекламного ідентифікатора вашого пристрою та пов’язаних даних для показу та вимірювання реклами, включно з персоналізованою рекламою, де це дозволено. Див. Розділ 4 для ваших варіантів вибору реклами.","h_notif":"Сповіщення","p_notif":"Якщо ви ввімкнете сповіщення, Застосунок використовує Firebase Cloud Messaging (який генерує push-токен пристрою) для доставки необов’язкових нагадувань, таких як сповіщення про золоту годину. Ви можете вимкнути сповіщення будь-коли в налаштуваннях вашого пристрою.","h_purch":"Покупки","p_purch":"Якщо ви купуєте необов’язкове одноразове оновлення «Прибрати рекламу / Pro», транзакцію обробляє Google Play Billing. Ми отримуємо підтвердження того, що покупку було здійснено, щоб розблокувати функції Pro та відновити їх для вас. Ми ніколи не бачимо й не зберігаємо дані вашої платіжної картки чи платіжні реквізити — вони повністю обробляються Google.","h_provide":"Інформація, яку ви надаєте на власний розсуд","p_provide":"Якщо ви пишете нам електронною поштою (для підтримки або відгуку), ми отримуємо адресу електронної пошти та зміст надісланого вами повідомлення й використовуємо їх лише для того, щоб відповісти вам.","h2":"2. Датчики","p_sensors":"Застосунок зчитує датчики руху пристрою (акселерометр і магнітометр) для роботи функцій компаса, рівня та нахилу. Ці дані датчиків використовуються на вашому пристрої в реальному часі й не є особистою інформацією про вас.","h3":"3. Сторонні сервіси","p_third_intro":"Застосунок покладається на такі сторонні сервіси, кожен з яких регулюється власною політикою конфіденційності:","tp_advertising":"(реклама)","tp_analytics":"Google Analytics for Firebase & Firebase Crashlytics","tp_notifications":"(сповіщення)","tp_purchases":"(покупки)","li_weather":"Сторонній постачальник даних про погоду може бути запитаний з використанням вашого місцезнаходження для відображення поточних умов.","h4":"4. Реклама та ваш вибір","p_ads_intro":"Рекламу надає Google AdMob. Ви можете керувати персоналізованою рекламою на вашому пристрої:","li_android":"Android: Налаштування → Google → Оголошення → відмовитися від / скинути ваш рекламний ідентифікатор.","li_remove":"Повне видалення реклами: придбайте одноразове оновлення Pro у Застосунку.","h5":"5. Як ми ділимося інформацією","p_share":"Ми не продаємо вашу особисту інформацію. Інформація передається лише постачальникам послуг, переліченим у Розділі 3, щоб вони могли виконувати свої функції (наприклад, показувати карти чи рекламу), а також коли це вимагається законом, юридичним процесом, або для захисту прав, безпеки чи власності наших користувачів, громадськості або нас самих.","h6":"6. Зберігання даних","p_ret":"Фотографії, відео та налаштування застосунку, створені Застосунком, залишаються на вашому пристрої, доки ви їх не видалите або не видалите Застосунок. Дані, які обробляються сторонніми сервісами в Розділі 3, зберігаються відповідно до їхніх відповідних політик.","h7":"7. Безпека","p_sec":"Ми вживаємо розумних технічних та організаційних заходів для захисту інформації. Однак жоден застосунок, передача чи система зберігання не є повністю безпечними, і ми не можемо гарантувати абсолютну безпеку.","h8":"8. Конфіденційність дітей","p_child":"Застосунок не призначений для дітей віком до 13 років (або мінімального віку, що вимагається у вашій країні), і ми свідомо не збираємо особисту інформацію від них. Якщо ви вважаєте, що дитина надала нам інформацію, будь ласка, зв’яжіться з нами, і ми її видалимо.","h9":"9. Ваші права","p_rights":"Залежно від того, де ви проживаєте (наприклад, у EEA/UK згідно з GDPR або в Каліфорнії згідно з CCPA/CPRA), ви можете мати права на доступ, виправлення, видалення або обмеження використання вашої особистої інформації, а також на відмову від певної обробки. Ви можете будь-коли скористатися засобами керування на рівні пристрою, відкликавши дозволи Застосунку на місцезнаходження, камеру, сховище чи сповіщення в налаштуваннях вашого пристрою, а також скинувши рекламний ідентифікатор або відмовившись від нього. Щоб подати запит щодо конфіденційності, зв’яжіться з нами, використовуючи наведені нижче дані.","h10":"10. Міжнародні користувачі","p_intl":"Застосунок і сторонні сервіси, які він використовує, можуть обробляти інформацію в країнах, відмінних від вашої, де закони про захист даних можуть відрізнятися. Використовуючи Застосунок, ви погоджуєтеся на таку обробку відповідно до цієї політики.","h11":"11. Зміни до цієї Політики конфіденційності","p_changes":"Ми можемо час від часу оновлювати цю Політику конфіденційності. Будь-які зміни будуть опубліковані на цій сторінці з оновленою датою набрання чинності, тому, будь ласка, періодично переглядайте її. Продовження використання Застосунку після набрання змінами чинності означає, що ви приймаєте оновлену політику.","h12":"12. Зв’яжіться з нами","p_contact":"Якщо у вас є запитання, запити або відгуки щодо цієї Політики конфіденційності чи вашої інформації, зв’яжіться з нами за адресою:","footer":"© 2026 GO PRACHI LABS. Усі права захищено."},"ui":{"ui_language":"Мова","ui_note":"Цей переклад надається для вашої зручності. У разі будь-яких розбіжностей юридично автентичною є англійська версія."}},"pl":{"privacy":{"title":"Polityka prywatności","eff":"Data wejścia w życie: 9 July 2026","intro":"Niniejsza Polityka prywatności wyjaśnia, w jaki sposób GO PRACHI LABS („my”, „nas” lub „nasz”) przetwarza informacje w związku z aplikacją mobilną GPS Map Camera & Compass (nazwa pakietu compass.photo.camera.map.gps.gpsmapcamera_compass) („Aplikacja”). Twoja prywatność jest dla nas ważna. Prosimy o uważne zapoznanie się z niniejszą polityką. Korzystając z Aplikacji, wyrażasz zgodę na opisane tutaj praktyki.","note":"Mówiąc prościej: Aplikacja oznacza Twoje zdjęcia Twoją lokalizacją, wyświetla kompas i mapy oraz prezentuje szczegóły dotyczące słońca/księżyca i pogody. Twoje zdjęcia i lokalizacja są przetwarzane na Twoim urządzeniu i nie są przesyłane na nasze własne serwery. Korzystamy z zaufanych usług Google w zakresie map, reklam, analiz, raportów o awariach, powiadomień i zakupów, jak opisano poniżej.","h1":"1. Informacje, które zbieramy, i sposób ich wykorzystania","h_loc":"Informacje o lokalizacji (dokładnej i przybliżonej)","p_loc":"Za Twoją zgodą Aplikacja uzyskuje dostęp do lokalizacji Twojego urządzenia opartej na GPS i sieci, aby zapewnić swoje podstawowe funkcje: geotagowanie Twoich zdjęć i filmów (osadzanie współrzędnych i adresu w obrazie), pokazywanie Twojej pozycji na mapie, obliczanie kursu kompasu, deklinacji magnetycznej oraz szczegółów dotyczących słońca/księżyca i pogody dla Twojej lokalizacji. Lokalizacja jest przetwarzana na Twoim urządzeniu i osadzana w rejestrowanych przez Ciebie multimediach. Może zostać wysłana do usług stron trzecich wymienionych w Sekcji 3 (na przykład w celu wyświetlenia map lub pobrania warunków pogodowych). Nie przechowujemy Twojej lokalizacji na naszych własnych serwerach.","h_cam":"Aparat, zdjęcia i multimedia","p_cam":"Za Twoją zgodą Aplikacja używa Twojego aparatu do robienia zdjęć i nagrywania filmów oraz odczytuje/zapisuje multimedia, aby zapisywać Twoje nagrania w galerii i wyświetlać je w albumie w aplikacji. Twoje zdjęcia i filmy pozostają na Twoim urządzeniu, chyba że zdecydujesz się je udostępnić lub wyeksportować. Nie przesyłamy ani nie przechowujemy Twoich zdjęć lub filmów.","h_dev":"Informacje o urządzeniu i użytkowaniu","p_dev":"Korzystamy z Google Analytics for Firebase i Firebase Crashlytics, aby zrozumieć, w jaki sposób Aplikacja jest używana, oraz aby diagnozować awarie. Może to obejmować zdarzenia aplikacji (takie jak otwarte funkcje), model urządzenia, wersję systemu operacyjnego, wersję aplikacji, język oraz ogólny region/kraj, a także diagnostykę awarii. Pomaga nam to naprawiać błędy i ulepszać Aplikację.","h_ad":"Informacje reklamowe","p_ad":"Bezpłatna wersja Aplikacji wyświetla reklamy za pośrednictwem Google AdMob. AdMob może uzyskiwać dostęp do identyfikatora reklamowego Twojego urządzenia i powiązanych danych w celu wyświetlania i pomiaru reklam, w tym reklam spersonalizowanych, jeśli jest to dozwolone. Zobacz Sekcję 4, aby poznać swoje opcje dotyczące reklam.","h_notif":"Powiadomienia","p_notif":"Jeśli włączysz powiadomienia, Aplikacja korzysta z Firebase Cloud Messaging (który generuje token push urządzenia), aby dostarczać opcjonalne przypomnienia, takie jak alerty o złotej godzinie. Możesz wyłączyć powiadomienia w dowolnym momencie w ustawieniach swojego urządzenia.","h_purch":"Zakupy","p_purch":"Jeśli kupisz opcjonalne jednorazowe ulepszenie „Usuń reklamy / Pro”, transakcja jest przetwarzana przez Google Play Billing. Otrzymujemy potwierdzenie dokonania zakupu, abyśmy mogli odblokować funkcje Pro i przywrócić je dla Ciebie. Nigdy nie widzimy ani nie przechowujemy danych Twojej karty płatniczej lub danych rozliczeniowych — są one obsługiwane w całości przez Google.","h_provide":"Informacje, które zdecydujesz się podać","p_provide":"Jeśli wyślesz do nas wiadomość e-mail (w celu uzyskania wsparcia lub przekazania opinii), otrzymujemy adres e-mail i treść wiadomości, którą wysyłasz, i wykorzystujemy je wyłącznie w celu udzielenia Ci odpowiedzi.","h2":"2. Czujniki","p_sensors":"Aplikacja odczytuje czujniki ruchu urządzenia (akcelerometr i magnetometr), aby obsługiwać funkcje kompasu, poziomicy i nachylenia. Te dane z czujników są wykorzystywane na Twoim urządzeniu w czasie rzeczywistym i nie stanowią informacji osobistych na Twój temat.","h3":"3. Usługi stron trzecich","p_third_intro":"Aplikacja opiera się na następujących usługach stron trzecich, z których każda podlega własnej polityce prywatności:","tp_advertising":"(reklama)","tp_analytics":"Google Analytics for Firebase & Firebase Crashlytics","tp_notifications":"(powiadomienia)","tp_purchases":"(zakupy)","li_weather":"Zewnętrzny dostawca danych pogodowych może być odpytywany z użyciem Twojej lokalizacji w celu wyświetlenia bieżących warunków.","h4":"4. Reklamy i Twoje wybory","p_ads_intro":"Reklamy są wyświetlane przez Google AdMob. Możesz kontrolować reklamy spersonalizowane na swoim urządzeniu:","li_android":"Android: Ustawienia → Google → Reklamy → zrezygnuj z / zresetuj swój identyfikator reklamowy.","li_remove":"Całkowite usunięcie reklam: kup jednorazowe ulepszenie Pro w Aplikacji.","h5":"5. Jak udostępniamy informacje","p_share":"Nie sprzedajemy Twoich danych osobowych. Informacje są udostępniane wyłącznie dostawcom usług wymienionym w Sekcji 3, aby mogli oni pełnić swoje funkcje (na przykład wyświetlać mapy lub reklamy), oraz gdy wymaga tego prawo, procedura prawna, lub w celu ochrony praw, bezpieczeństwa lub własności naszych użytkowników, ogółu społeczeństwa lub nas samych.","h6":"6. Przechowywanie danych","p_ret":"Zdjęcia, filmy i ustawienia aplikacji utworzone przez Aplikację pozostają na Twoim urządzeniu do momentu ich usunięcia lub odinstalowania Aplikacji. Dane obsługiwane przez usługi stron trzecich w Sekcji 3 są przechowywane zgodnie z ich odpowiednimi politykami.","h7":"7. Bezpieczeństwo","p_sec":"Podejmujemy uzasadnione środki techniczne i organizacyjne w celu ochrony informacji. Jednak żadna aplikacja, transmisja ani system przechowywania nie są całkowicie bezpieczne, i nie możemy zagwarantować absolutnego bezpieczeństwa.","h8":"8. Prywatność dzieci","p_child":"Aplikacja nie jest skierowana do dzieci poniżej 13. roku życia (lub minimalnego wieku wymaganego w Twoim kraju), i nie zbieramy świadomie danych osobowych od nich. Jeśli uważasz, że dziecko przekazało nam informacje, prosimy o kontakt, a my je usuniemy.","h9":"9. Twoje prawa","p_rights":"W zależności od miejsca zamieszkania (na przykład w EEA/UK na mocy GDPR lub w Kalifornii na mocy CCPA/CPRA) możesz mieć prawa do dostępu, poprawiania, usuwania lub ograniczania wykorzystania Twoich danych osobowych, a także do sprzeciwu wobec określonego przetwarzania. Możesz w dowolnym momencie skorzystać z kontroli na poziomie urządzenia, cofając uprawnienia Aplikacji do lokalizacji, aparatu, pamięci lub powiadomień w ustawieniach swojego urządzenia, oraz resetując lub rezygnując z identyfikatora reklamowego. Aby złożyć wniosek dotyczący prywatności, skontaktuj się z nami, korzystając z danych podanych poniżej.","h10":"10. Użytkownicy międzynarodowi","p_intl":"Aplikacja i usługi stron trzecich, z których korzysta, mogą przetwarzać informacje w krajach innych niż Twój, gdzie przepisy o ochronie danych mogą się różnić. Korzystając z Aplikacji, wyrażasz zgodę na takie przetwarzanie zgodnie z niniejszą polityką.","h11":"11. Zmiany w niniejszej Polityce prywatności","p_changes":"Możemy od czasu do czasu aktualizować niniejszą Politykę prywatności. Wszelkie zmiany zostaną opublikowane na tej stronie ze zaktualizowaną datą wejścia w życie, dlatego prosimy o okresowe jej przeglądanie. Dalsze korzystanie z Aplikacji po wejściu zmian w życie oznacza akceptację zaktualizowanej polityki.","h12":"12. Skontaktuj się z nami","p_contact":"Jeśli masz pytania, prośby lub opinie dotyczące niniejszej Polityki prywatności lub Twoich informacji, skontaktuj się z nami pod adresem:","footer":"© 2026 GO PRACHI LABS. Wszelkie prawa zastrzeżone."},"ui":{"ui_language":"Język","ui_note":"Niniejsze tłumaczenie jest udostępniane dla Twojej wygody. W przypadku jakichkolwiek rozbieżności wersja angielska jest prawnie wiążąca."}},"ro":{"privacy":{"title":"Politică de confidențialitate","eff":"Data intrării în vigoare: 9 July 2026","intro":"Această Politică de confidențialitate explică modul în care GO PRACHI LABS („noi”, „ne” sau „nostru”) gestionează informațiile în legătură cu aplicația mobilă GPS Map Camera & Compass (numele pachetului compass.photo.camera.map.gps.gpsmapcamera_compass) („Aplicația”). Confidențialitatea dumneavoastră contează pentru noi. Vă rugăm să citiți cu atenție această politică. Prin utilizarea Aplicației, sunteți de acord cu practicile descrise aici.","note":"Pe scurt: Aplicația marchează fotografiile dumneavoastră cu locația, afișează o busolă și hărți și prezintă detalii despre soare/lună și vreme. Fotografiile și locația dumneavoastră sunt procesate pe dispozitivul dumneavoastră și nu sunt încărcate pe serverele noastre. Utilizăm servicii Google de încredere pentru hărți, anunțuri, analiză, raportarea erorilor, notificări și achiziții, așa cum este descris mai jos.","h1":"1. Informațiile pe care le colectăm și modul în care le folosim","h_loc":"Informații despre locație (precise și aproximative)","p_loc":"Cu permisiunea dumneavoastră, Aplicația accesează locația GPS și cea bazată pe rețea a dispozitivului dumneavoastră pentru a-și oferi funcțiile principale: geoetichetarea fotografiilor și videoclipurilor (încorporarea coordonatelor și a adresei în imagine), afișarea poziției dumneavoastră pe o hartă, calcularea direcției busolei, a declinației magnetice și a detaliilor despre soare/lună și vreme pentru locația dumneavoastră. Locația este procesată pe dispozitivul dumneavoastră și încorporată în conținutul media pe care îl capturați. Aceasta poate fi trimisă serviciilor terțe enumerate în Secțiunea 3 (de exemplu, pentru a afișa hărți sau a obține condițiile meteorologice). Nu stocăm locația dumneavoastră pe serverele noastre.","h_cam":"Cameră, fotografii și conținut media","p_cam":"Cu permisiunea dumneavoastră, Aplicația folosește camera pentru a face fotografii și a înregistra videoclipuri și citește/scrie conținut media pentru a putea salva capturile în galerie și a le afișa în albumul din aplicație. Fotografiile și videoclipurile dumneavoastră rămân pe dispozitiv, cu excepția cazului în care alegeți să le partajați sau să le exportați. Nu încărcăm și nu păstrăm fotografiile sau videoclipurile dumneavoastră.","h_dev":"Informații despre dispozitiv și utilizare","p_dev":"Utilizăm Google Analytics for Firebase și Firebase Crashlytics pentru a înțelege cum este utilizată Aplicația și pentru a diagnostica erorile. Acest lucru poate include evenimente din aplicație (cum ar fi funcțiile deschise), modelul dispozitivului, versiunea sistemului de operare, versiunea aplicației, limba și regiunea/țara generală, precum și diagnosticarea erorilor. Acest lucru ne ajută să reparăm erorile și să îmbunătățim Aplicația.","h_ad":"Informații publicitare","p_ad":"Versiunea gratuită a Aplicației afișează anunțuri prin Google AdMob. AdMob poate accesa identificatorul de publicitate al dispozitivului dumneavoastră și datele conexe pentru a difuza și măsura anunțuri, inclusiv anunțuri personalizate, acolo unde este permis. Consultați Secțiunea 4 pentru opțiunile dumneavoastră privind anunțurile.","h_notif":"Notificări","p_notif":"Dacă activați notificările, Aplicația folosește Firebase Cloud Messaging (care generează un token push al dispozitivului) pentru a livra mementouri opționale, cum ar fi alertele privind ora de aur. Puteți dezactiva notificările oricând din setările dispozitivului dumneavoastră.","h_purch":"Achiziții","p_purch":"Dacă achiziționați upgrade-ul opțional unic „Elimină anunțurile / Pro”, tranzacția este procesată de Google Play Billing. Primim confirmarea că a fost efectuată o achiziție pentru a putea debloca funcțiile Pro și a le restaura pentru dumneavoastră. Nu vedem și nu stocăm niciodată detaliile cardului de plată sau ale facturării — acestea sunt gestionate integral de Google.","h_provide":"Informații pe care alegeți să le furnizați","p_provide":"Dacă ne trimiteți un e-mail (pentru asistență sau feedback), primim adresa de e-mail și conținutul mesajului pe care le trimiteți și le folosim doar pentru a vă răspunde.","h2":"2. Senzori","p_sensors":"Aplicația citește senzorii de mișcare ai dispozitivului (accelerometru și magnetometru) pentru a alimenta funcțiile de busolă, nivel și înclinare. Aceste date de la senzori sunt utilizate pe dispozitivul dumneavoastră în timp real și nu reprezintă informații personale despre dumneavoastră.","h3":"3. Servicii terțe","p_third_intro":"Aplicația se bazează pe următoarele servicii terțe, fiecare guvernat de propria politică de confidențialitate:","tp_advertising":"(publicitate)","tp_analytics":"Google Analytics for Firebase & Firebase Crashlytics","tp_notifications":"(notificări)","tp_purchases":"(achiziții)","li_weather":"Un furnizor terț de date meteorologice poate fi interogat folosind locația dumneavoastră pentru a afișa condițiile curente.","h4":"4. Anunțuri și opțiunile dumneavoastră","p_ads_intro":"Anunțurile sunt difuzate de Google AdMob. Puteți controla publicitatea personalizată pe dispozitivul dumneavoastră:","li_android":"Android: Setări → Google → Anunțuri → renunțați la / resetați ID-ul de publicitate.","li_remove":"Eliminarea completă a anunțurilor: achiziționați upgrade-ul unic Pro din Aplicație.","h5":"5. Cum partajăm informațiile","p_share":"Nu vindem informațiile dumneavoastră personale. Informațiile sunt partajate doar cu furnizorii de servicii enumerați în Secțiunea 3 pentru ca aceștia să își poată îndeplini funcțiile (de exemplu, afișarea hărților sau a anunțurilor) și acolo unde este cerut de lege, de procese juridice sau pentru a proteja drepturile, siguranța sau proprietatea utilizatorilor noștri, a publicului sau a noastră.","h6":"6. Păstrarea datelor","p_ret":"Fotografiile, videoclipurile și setările aplicației create de Aplicație rămân pe dispozitivul dumneavoastră până când le ștergeți sau dezinstalați Aplicația. Datele gestionate de serviciile terțe din Secțiunea 3 sunt păstrate conform politicilor lor respective.","h7":"7. Securitate","p_sec":"Luăm măsuri tehnice și organizatorice rezonabile pentru a proteja informațiile. Cu toate acestea, nicio aplicație, transmisie sau sistem de stocare nu este complet sigur și nu putem garanta o securitate absolută.","h8":"8. Confidențialitatea copiilor","p_child":"Aplicația nu se adresează copiilor sub 13 ani (sau vârsta minimă cerută în țara dumneavoastră) și nu colectăm cu bună știință informații personale de la aceștia. Dacă credeți că un copil ne-a furnizat informații, vă rugăm să ne contactați și le vom șterge.","h9":"9. Drepturile dumneavoastră","p_rights":"În funcție de locul unde locuiți (de exemplu, EEA/UK conform GDPR sau California conform CCPA/CPRA), puteți avea drepturi de acces, corectare, ștergere sau restricționare a utilizării informațiilor dumneavoastră personale și de a renunța la anumite prelucrări. Puteți exercita controale la nivelul dispozitivului oricând, revocând permisiunile Aplicației privind locația, camera, stocarea sau notificările din setările dispozitivului și resetând sau renunțând la ID-ul dumneavoastră de publicitate. Pentru a face o solicitare de confidențialitate, contactați-ne folosind detaliile de mai jos.","h10":"10. Utilizatori internaționali","p_intl":"Aplicația și serviciile terțe pe care le folosește pot procesa informații în alte țări decât a dumneavoastră, unde legile privind protecția datelor pot fi diferite. Prin utilizarea Aplicației, sunteți de acord cu o astfel de prelucrare, în conformitate cu această politică.","h11":"11. Modificări ale acestei Politici de confidențialitate","p_changes":"Este posibil să actualizăm această Politică de confidențialitate din când în când. Orice modificare va fi publicată pe această pagină cu o dată de intrare în vigoare revizuită, așa că vă rugăm să o revizuiți periodic. Utilizarea în continuare a Aplicației după intrarea în vigoare a modificărilor înseamnă că acceptați politica actualizată.","h12":"12. Contactați-ne","p_contact":"Dacă aveți întrebări, solicitări sau feedback despre această Politică de confidențialitate sau despre informațiile dumneavoastră, contactați-ne la:","footer":"© 2026 GO PRACHI LABS. Toate drepturile rezervate."},"ui":{"ui_language":"Limbă","ui_note":"Această traducere este furnizată pentru comoditatea dumneavoastră. În caz de orice discrepanță, versiunea în limba engleză este cea autoritativă din punct de vedere juridic."}},"nl":{"privacy":{"title":"Privacybeleid","eff":"Ingangsdatum: 9 July 2026","intro":"Dit Privacybeleid legt uit hoe GO PRACHI LABS („wij”, „ons” of „onze”) omgaat met informatie in verband met de mobiele applicatie GPS Map Camera & Compass (pakketnaam compass.photo.camera.map.gps.gpsmapcamera_compass) (de „App”). Uw privacy is belangrijk voor ons. Lees dit beleid zorgvuldig door. Door de App te gebruiken, gaat u akkoord met de hier beschreven praktijken.","note":"In gewone taal: de App voorziet uw foto's van uw locatie, toont een kompas en kaarten en geeft details over zon/maan en weer weer. Uw foto's en locatie worden op uw apparaat verwerkt en worden niet naar onze eigen servers geüpload. Wij gebruiken vertrouwde Google-diensten voor kaarten, advertenties, analyses, crashrapportage, meldingen en aankopen, zoals hieronder beschreven.","h1":"1. Informatie die wij verzamelen en hoe wij deze gebruiken","h_loc":"
