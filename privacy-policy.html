<title>Privacy Policy — GPS Map Camera &amp; Compass</title>
<style>
  :root{ --bg:#ffffff; --fg:#1c2530; --muted:#5c6773; --accent:#2563eb; --line:#e6eaf0; --card:#f7f9fc; }
  @media (prefers-color-scheme:dark){ :root{ --bg:#0f141a; --fg:#e6edf3; --muted:#9aa7b4; --accent:#5b93f5; --line:#242c36; --card:#151b22; } }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.7; font-size:16px; }
  .bar{ position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:1px solid var(--line);
    display:flex; justify-content:flex-end; align-items:center; gap:8px; padding:10px 22px; }
  .bar label{ color:var(--muted); font-size:13px; }
  .bar select{ font-size:14px; padding:6px 10px; border-radius:8px; border:1px solid var(--line);
    background:var(--card); color:var(--fg); max-width:60vw; }
  .wrap{ max-width:760px; margin:0 auto; padding:28px 22px 72px; }
  header{ border-bottom:1px solid var(--line); padding-bottom:20px; margin-bottom:8px; }
  h1{ font-size:28px; line-height:1.25; margin:0 0 6px; }
  .eff{ color:var(--muted); font-size:14px; }
  h2{ font-size:20px; margin:34px 0 10px; }
  h3{ font-size:16px; margin:20px 0 6px; }
  p,li{ color:var(--fg); }
  a{ color:var(--accent); text-decoration:none; word-break:break-word; }
  a:hover{ text-decoration:underline; }
  ul{ padding-left:22px; }
  li{ margin:5px 0; }
  .note{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; font-size:15px; color:var(--muted); margin:16px 0; }
  .langnote{ background:var(--card); border:1px dashed var(--line); border-radius:10px; padding:10px 14px; font-size:13px; color:var(--muted); margin:14px 0; }
  footer{ margin-top:44px; padding-top:18px; border-top:1px solid var(--line); color:var(--muted); font-size:14px; }
  [dir="rtl"] ul{ padding-left:0; padding-right:22px; }
</style>

<script>
var DOC = "privacy";
var I18N = {"en":{"privacy":{"title":"Privacy Policy","eff":"Effective date: 9 July 2026","intro":"This Privacy Policy explains how GO PRACHI LABS (“we”, “us”, or “our”) handles information in connection with the mobile application GPS Map Camera & Compass (package name compass.photo.camera.map.gps.gpsmapcamera_compass) (the “App”). Your privacy matters to us. Please read this policy carefully. By using the App, you agree to the practices described here.","note":"In plain terms: the App stamps your photos with your location, shows a compass and maps, and displays sun/moon and weather details. Your photos and location are processed on your device and are not uploaded to our own servers. We use trusted Google services for maps, ads, analytics, crash reporting, notifications, and purchases, as described below.","h1":"1. Information we collect and how we use it","h_loc":"Location information (precise and approximate)","p_loc":"With your permission, the App accesses your device’s GPS and network-based location to provide its core features: geotagging your photos and videos (embedding coordinates and address into the image), showing your position on a map, calculating compass heading, magnetic declination, and sun/moon and weather details for your location. Location is processed on your device and embedded into the media you capture. It may be sent to the third-party services listed in Section 3 (for example, to render maps or retrieve weather conditions). We do not store your location on our own servers.","h_cam":"Camera, photos, and media","p_cam":"With your permission, the App uses your camera to take photos and record videos, and reads/writes media so it can save your captures to your gallery and display them in the in-app album. Your photos and videos remain on your device unless you choose to share or export them. We do not upload or retain your photos or videos.","h_dev":"Device and usage information","p_dev":"We use Google Analytics for Firebase and Firebase Crashlytics to understand how the App is used and to diagnose crashes. This may include app events (such as features opened), device model, operating-system version, app version, language, and general region/country, and crash diagnostics. This helps us fix bugs and improve the App.","h_ad":"Advertising information","p_ad":"The free version of the App shows ads through Google AdMob. AdMob may access your device’s advertising identifier and related data to serve and measure ads, including personalized ads where permitted. See Section 4 for your ad choices.","h_notif":"Notifications","p_notif":"If you enable notifications, the App uses Firebase Cloud Messaging (which generates a device push token) to deliver optional reminders such as golden-hour alerts. You can turn notifications off at any time in your device settings.","h_purch":"Purchases","p_purch":"If you buy the optional one-time “Remove Ads / Pro” upgrade, the transaction is processed by Google Play Billing. We receive confirmation that a purchase was made so we can unlock Pro features and restore them for you. We never see or store your payment card or billing details — those are handled entirely by Google.","h_provide":"Information you choose to provide","p_provide":"If you email us (for support or feedback), we receive the email address and message content you send, and use it only to respond to you.","h2":"2. Sensors","p_sensors":"The App reads device motion sensors (accelerometer and magnetometer) to power the compass, level, and tilt features. This sensor data is used on your device in real time and is not personal information about you.","h3":"3. Third-party services","p_third_intro":"The App relies on the following third-party services, each governed by its own privacy policy:","tp_advertising":"(advertising)","tp_analytics":"Google Analytics for Firebase & Firebase Crashlytics","tp_notifications":"(notifications)","tp_purchases":"(purchases)","li_weather":"A third-party weather data provider may be queried using your location to display current conditions.","h4":"4. Ads and your choices","p_ads_intro":"Ads are served by Google AdMob. You can control personalized advertising on your device:","li_android":"Android: Settings → Google → Ads → opt out of / reset your advertising ID.","li_remove":"Removing ads entirely: purchase the one-time Pro upgrade in the App.","h5":"5. How we share information","p_share":"We do not sell your personal information. Information is shared only with the service providers listed in Section 3 so they can perform their functions (for example, showing maps or ads), and where required by law, legal process, or to protect the rights, safety, or property of our users, the public, or us.","h6":"6. Data retention","p_ret":"Photos, videos, and app settings created by the App stay on your device until you delete them or uninstall the App. Data handled by the third-party services in Section 3 is retained according to their respective policies.","h7":"7. Security","p_sec":"We take reasonable technical and organizational measures to protect information. However, no app, transmission, or storage system is completely secure, and we cannot guarantee absolute security.","h8":"8. Children’s privacy","p_child":"The App is not directed to children under 13 (or the minimum age required in your country), and we do not knowingly collect personal information from them. If you believe a child has provided us information, please contact us and we will delete it.","h9":"9. Your rights","p_rights":"Depending on where you live (for example, the EEA/UK under GDPR, or California under the CCPA/CPRA), you may have rights to access, correct, delete, or restrict the use of your personal information, and to opt out of certain processing. You can exercise device-level controls at any time by revoking the App’s location, camera, storage, or notification permissions in your device settings, and by resetting or opting out of your advertising ID. To make a privacy request, contact us using the details below.","h10":"10. International users","p_intl":"The App and the third-party services it uses may process information in countries other than your own, where data-protection laws may differ. By using the App you consent to such processing consistent with this policy.","h11":"11. Changes to this Privacy Policy","p_changes":"We may update this Privacy Policy from time to time. Any changes will be posted on this page with a revised effective date, so please review it periodically. Continued use of the App after changes take effect means you accept the updated policy.","h12":"12. Contact us","p_contact":"If you have questions, requests, or feedback about this Privacy Policy or your information, contact us at:","footer":"© 2026 GO PRACHI LABS. All rights reserved."},"ui":{"ui_language":"Language","ui_note":"This translation is provided for your convenience. In case of any discrepancy, the English version is the legally authoritative one."}},"hi":{"privacy":{"title":"गोपनीयता नीति","eff":"प्रभावी तिथि: 9 July 2026","intro":"यह गोपनीयता नीति बताती है कि GO PRACHI LABS (\"हम\", \"हमें\", या \"हमारा\") मोबाइल एप्लिकेशन GPS Map Camera & Compass (पैकेज नाम compass.photo.camera.map.gps.gpsmapcamera_compass) (\"App\") के संबंध में जानकारी को कैसे संभालती है। आपकी गोपनीयता हमारे लिए महत्वपूर्ण है। कृपया इस नीति को ध्यानपूर्वक पढ़ें। App का उपयोग करके, आप यहाँ वर्णित प्रथाओं से सहमत होते हैं।","note":"सरल शब्दों में: App आपकी तस्वीरों पर आपके स्थान की मुहर लगाता है, कम्पास और मानचित्र दिखाता है, और सूर्य/चंद्रमा तथा मौसम का विवरण प्रदर्शित करता है। आपकी तस्वीरें और स्थान आपके डिवाइस पर ही संसाधित होते हैं और हमारे अपने सर्वर पर अपलोड नहीं किए जाते। हम मानचित्र, विज्ञापन, विश्लेषण, क्रैश रिपोर्टिंग, सूचनाओं और खरीदारी के लिए विश्वसनीय Google सेवाओं का उपयोग करते हैं, जैसा कि नीचे वर्णित है।","h1":"1. हम कौन-सी जानकारी एकत्र करते हैं और उसका उपयोग कैसे करते हैं","h_loc":"स्थान की जानकारी (सटीक और अनुमानित)","p_loc":"आपकी अनुमति से, App अपनी मुख्य सुविधाएँ प्रदान करने के लिए आपके डिवाइस के GPS और नेटवर्क-आधारित स्थान तक पहुँचता है: आपकी तस्वीरों और वीडियो को जियोटैग करना (छवि में निर्देशांक और पता एम्बेड करना), मानचित्र पर आपकी स्थिति दिखाना, कम्पास दिशा, चुंबकीय विचलन, और आपके स्थान के लिए सूर्य/चंद्रमा तथा मौसम का विवरण गणना करना। स्थान आपके डिवाइस पर संसाधित होता है और आपके द्वारा कैप्चर किए गए मीडिया में एम्बेड किया जाता है। इसे धारा 3 में सूचीबद्ध तृतीय-पक्ष सेवाओं को भेजा जा सकता है (उदाहरण के लिए, मानचित्र प्रस्तुत करने या मौसम की स्थिति प्राप्त करने के लिए)। हम आपके स्थान को अपने सर्वर पर संग्रहीत नहीं करते।","h_cam":"कैमरा, तस्वीरें और मीडिया","p_cam":"आपकी अनुमति से, App आपके कैमरे का उपयोग तस्वीरें लेने और वीडियो रिकॉर्ड करने के लिए करता है, और मीडिया को पढ़ता/लिखता है ताकि वह आपके कैप्चर को आपकी गैलरी में सहेज सके और उन्हें ऐप के भीतर एल्बम में प्रदर्शित कर सके। जब तक आप उन्हें साझा या निर्यात करना न चुनें, आपकी तस्वीरें और वीडियो आपके डिवाइस पर ही रहते हैं। हम आपकी तस्वीरें या वीडियो अपलोड या संग्रहीत नहीं करते।","h_dev":"डिवाइस और उपयोग की जानकारी","p_dev":"हम यह समझने के लिए कि App का उपयोग कैसे किया जाता है और क्रैश का निदान करने के लिए Google Analytics for Firebase और Firebase Crashlytics का उपयोग करते हैं। इसमें ऐप इवेंट (जैसे खोली गई सुविधाएँ), डिवाइस मॉडल, ऑपरेटिंग-सिस्टम संस्करण, ऐप संस्करण, भाषा, और सामान्य क्षेत्र/देश, तथा क्रैश निदान शामिल हो सकते हैं। यह हमें बग ठीक करने और App को बेहतर बनाने में मदद करता है।","h_ad":"विज्ञापन संबंधी जानकारी","p_ad":"App का निःशुल्क संस्करण Google AdMob के माध्यम से विज्ञापन दिखाता है। AdMob विज्ञापन प्रस्तुत करने और मापने के लिए आपके डिवाइस के विज्ञापन पहचानकर्ता और संबंधित डेटा तक पहुँच सकता है, जिसमें अनुमति प्राप्त होने पर व्यक्तिगत विज्ञापन भी शामिल हैं। अपने विज्ञापन विकल्पों के लिए धारा 4 देखें।","h_notif":"सूचनाएँ","p_notif":"यदि आप सूचनाएँ सक्षम करते हैं, तो App वैकल्पिक अनुस्मारक जैसे गोल्डन-आवर अलर्ट देने के लिए Firebase Cloud Messaging (जो एक डिवाइस पुश टोकन उत्पन्न करता है) का उपयोग करता है। आप किसी भी समय अपनी डिवाइस सेटिंग्स में सूचनाएँ बंद कर सकते हैं।","h_purch":"खरीदारी","p_purch":"यदि आप वैकल्पिक एक-बार वाला \"Remove Ads / Pro\" अपग्रेड खरीदते हैं, तो लेनदेन Google Play Billing द्वारा संसाधित किया जाता है। हमें पुष्टि प्राप्त होती है कि खरीदारी की गई ताकि हम Pro सुविधाएँ अनलॉक कर सकें और उन्हें आपके लिए पुनर्स्थापित कर सकें। हम आपके भुगतान कार्ड या बिलिंग विवरण कभी नहीं देखते या संग्रहीत नहीं करते — उन्हें पूरी तरह से Google द्वारा संभाला जाता है।","h_provide":"जानकारी जो आप स्वयं प्रदान करना चुनते हैं","p_provide":"यदि आप हमें ईमेल करते हैं (समर्थन या प्रतिक्रिया के लिए), तो हमें आपके द्वारा भेजा गया ईमेल पता और संदेश सामग्री प्राप्त होती है, और हम इसका उपयोग केवल आपको उत्तर देने के लिए करते हैं।","h2":"2. सेंसर","p_sensors":"App कम्पास, लेवल, और झुकाव सुविधाओं को सक्षम करने के लिए डिवाइस मोशन सेंसर (एक्सेलेरोमीटर और मैग्नेटोमीटर) पढ़ता है। यह सेंसर डेटा आपके डिवाइस पर वास्तविक समय में उपयोग किया जाता है और आपके बारे में व्यक्तिगत जानकारी नहीं है।","h3":"3. तृतीय-पक्ष सेवाएँ","p_third_intro":"App निम्नलिखित तृतीय-पक्ष सेवाओं पर निर्भर करता है, जिनमें से प्रत्येक अपनी स्वयं की गोपनीयता नीति द्वारा शासित है:","tp_advertising":"(विज्ञापन)","tp_analytics":"Google Analytics for Firebase & Firebase Crashlytics","tp_notifications":"(सूचनाएँ)","tp_purchases":"(खरीदारी)","li_weather":"वर्तमान स्थितियाँ प्रदर्शित करने के लिए आपके स्थान का उपयोग करके किसी तृतीय-पक्ष मौसम डेटा प्रदाता से पूछताछ की जा सकती है।","h4":"4. विज्ञापन और आपके विकल्प","p_ads_intro":"विज्ञापन Google AdMob द्वारा प्रस्तुत किए जाते हैं। आप अपने डिवाइस पर व्यक्तिगत विज्ञापन को नियंत्रित कर सकते हैं:","li_android":"Android: Settings → Google → Ads → अपनी विज्ञापन ID से ऑप्ट आउट करें / रीसेट करें।","li_remove":"विज्ञापन पूरी तरह हटाना: App में एक-बार वाला Pro अपग्रेड खरीदें।","h5":"5. हम जानकारी कैसे साझा करते हैं","p_share":"हम आपकी व्यक्तिगत जानकारी नहीं बेचते। जानकारी केवल धारा 3 में सूचीबद्ध सेवा प्रदाताओं के साथ साझा की जाती है ताकि वे अपने कार्य कर सकें (उदाहरण के लिए, मानचित्र या विज्ञापन दिखाना), और जहाँ कानून, कानूनी प्रक्रिया द्वारा आवश्यक हो, या हमारे उपयोगकर्ताओं, जनता, या हमारे अधिकारों, सुरक्षा, या संपत्ति की रक्षा के लिए।","h6":"6. डेटा प्रतिधारण","p_ret":"App द्वारा बनाई गई तस्वीरें, वीडियो, और ऐप सेटिंग्स आपके डिवाइस पर तब तक रहती हैं जब तक आप उन्हें हटा नहीं देते या App को अनइंस्टॉल नहीं कर देते। धारा 3 में तृतीय-पक्ष सेवाओं द्वारा संभाला गया डेटा उनकी संबंधित नीतियों के अनुसार बनाए रखा जाता है।","h7":"7. सुरक्षा","p_sec":"हम जानकारी की सुरक्षा के लिए उचित तकनीकी और संगठनात्मक उपाय करते हैं। हालाँकि, कोई भी ऐप, ट्रांसमिशन, या भंडारण प्रणाली पूरी तरह सुरक्षित नहीं है, और हम पूर्ण सुरक्षा की गारंटी नहीं दे सकते।","h8":"8. बच्चों की गोपनीयता","p_child":"App 13 वर्ष से कम आयु के बच्चों (या आपके देश में आवश्यक न्यूनतम आयु) के लिए निर्देशित नहीं है, और हम जानबूझकर उनसे व्यक्तिगत जानकारी एकत्र नहीं करते। यदि आपको लगता है कि किसी बच्चे ने हमें जानकारी प्रदान की है, तो कृपया हमसे संपर्क करें और हम इसे हटा देंगे।","h9":"9. आपके अधिकार","p_rights":"आप जहाँ रहते हैं उसके आधार पर (उदाहरण के लिए, GDPR के तहत EEA/UK, या CCPA/CPRA के तहत California), आपके पास अपनी व्यक्तिगत जानकारी तक पहुँचने, सुधारने, हटाने, या उसके उपयोग को प्रतिबंधित करने, और कुछ प्रसंस्करण से ऑप्ट आउट करने के अधिकार हो सकते हैं। आप किसी भी समय अपनी डिवाइस सेटिंग्स में App की स्थान, कैमरा, भंडारण, या सूचना अनुमतियों को रद्द करके, और अपनी विज्ञापन ID को रीसेट या ऑप्ट आउट करके डिवाइस-स्तरीय नियंत्रण का प्रयोग कर सकते हैं। गोपनीयता अनुरोध करने के लिए, नीचे दिए गए विवरण का उपयोग करके हमसे संपर्क करें।","h10":"10. अंतर्राष्ट्रीय उपयोगकर्ता","p_intl":"App और इसके द्वारा उपयोग की जाने वाली तृतीय-पक्ष सेवाएँ आपके अपने देश के अलावा अन्य देशों में जानकारी संसाधित कर सकती हैं, जहाँ डेटा-सुरक्षा कानून भिन्न हो सकते हैं। App का उपयोग करके आप इस नीति के अनुरूप ऐसे प्रसंस्करण के लिए सहमति देते हैं।","h11":"11. इस गोपनीयता नीति में परिवर्तन","p_changes":"हम समय-समय पर इस गोपनीयता नीति को अद्यतन कर सकते हैं। कोई भी परिवर्तन इस पृष्ठ पर एक संशोधित प्रभावी तिथि के साथ पोस्ट किए जाएँगे, इसलिए कृपया इसकी समय-समय पर समीक्षा करें। परिवर्तन प्रभावी होने के ब ের নিজস্ব সার্ভারে সংরক্ষণ করি না।","h_cam":"ক্যামেরা, ছবি এবং মিডিয়া","p_cam":"আপনার অনুমতি নিয়ে, App আপনার ক্যামেরা ব্যবহার করে ছবি তোলে ও ভিডিও রেকর্ড করে, এবং মিডিয়া পড়ে/লেখে যাতে এটি আপনার তোলা ছবিগুলি আপনার গ্যালারিতে সংরক্ষণ করতে পারে এবং অ্যাপের মধ্যে অ্যালবামে প্রদর্শন করতে পারে। যতক্ষণ না আপনি সেগুলি শেয়ার বা রপ্তানি করতে চান, আপনার ছবি ও ভিডিও আপনার ডিভাইসেই থাকে। আমরা আপনার ছবি বা ভিডিও আপলোড বা সংরক্ষণ করি না।","h_dev":"ডিভাইস ও ব্যবহার সংক্রান্ত তথ্য","p_dev":"App কীভাবে ব্যবহৃত হয় তা বুঝতে এবং ক্র্যাশ নির্ণয় করতে আমরা Google Analytics for Firebase এবং Firebase Crashlytics ব্যবহার করি। এতে অ্যাপ ইভেন্ট (যেমন খোলা বৈশিষ্ট্য), ডিভাইস মডেল, অপারেটিং-সিস্টেম সংস্করণ, অ্যাপ সংস্করণ, ভাষা, এবং সাধারণ অঞ্চল/দেশ, এবং ক্র্যাশ নির্ণয় অন্তর্ভুক্ত থাকতে পারে। এটি আমাদের বাগ ঠিক করতে এবং App উন্নত করতে সাহায্য করে।","h_ad":"বিজ্ঞাপন সংক্রান্ত তথ্য","p_ad":"App-এর বিনামূল্যের সংস্করণ Google AdMob-এর মাধ্যমে বিজ্ঞাপন দেখায়। AdMob বিজ্ঞাপন পরিবেশন ও পরিমাপ করতে আপনার ডিভাইসের বিজ্ঞাপন শনাক্তকারী ও সম্পর্কিত ডেটা অ্যাক্সেস করতে পারে, যেখানে অনুমোদিত সেখানে ব্যক্তিগতকৃত বিজ্ঞাপন সহ। আপনার বিজ্ঞাপন পছন্দের জন্য ধারা 4 দেখুন।","h_notif":"বিজ্ঞপ্তি","p_notif":"যদি আপনি বিজ্ঞপ্তি সক্ষম করেন, App গোল্ডেন-আওয়ার সতর্কতার মতো ঐচ্ছিক অনুস্মারক প্রদানের জন্য Firebase Cloud Messaging (যা একটি ডিভাইস পুশ টোকেন তৈরি করে) ব্যবহার করে। আপনি যেকোনো সময় আপনার ডিভাইস সেটিংসে বিজ্ঞপ্তি বন্ধ করতে পারেন।","h_purch":"কেনাকাটা","p_purch":"যদি আপনি ঐচ্ছিক একবারের \"Remove Ads / Pro\" আপগ্রেড কেনেন, লেনদেনটি Google Play Billing দ্বারা প্রক্রিয়া করা হয়। আমরা নিশ্চিতকরণ পাই যে একটি কেনাকাটা করা হয়েছে যাতে আমরা Pro বৈশিষ্ট্যগুলি আনলক করতে এবং আপনার জন্য পুনরুদ্ধার করতে পারি। আমরা আপনার পেমেন্ট কার্ড বা বিলিং বিবরণ কখনও দেখি না বা সংরক্ষণ করি না — সেগুলি সম্পূর্ণরূপে Google দ্বারা পরিচালিত হয়।","h_provide":"আপনি যে তথ্য দিতে চান","p_provide":"যদি আপনি আমাদের ইমেল করেন (সহায়তা বা প্রতিক্রিয়ার জন্য), আমরা আপনার পাঠানো ইমেল ঠিকানা ও বার্তার বিষয়বস্তু পাই, এবং কেবল আপনাকে উত্তর দিতে ত ics ఉపయోగిస్తాము. ఇందులో యాప్ ఈవెంట్‌లు (తెరిచిన లక్షణాలు వంటివి), పరికర మోడల్, ఆపరేటింగ్-సిస్టమ్ వెర్షన్, యాప్ వెర్షన్, భాష, మరియు సాధారణ ప్రాంతం/దేశం, మరియు క్రాష్ నిర్ధారణలు ఉండవచ్చు. ఇది బగ్‌లను సరిచేయడానికి మరియు App‌ను మెరుగుపరచడానికి మాకు సహాయపడుతుంది.","h_ad":"ప్రకటన సమాచారం","p_ad":"App యొక్క ఉచిత వెర్షన్ Google AdMob ద్వారా ప్రకటనలను చూపిస్తుంది. AdMob ప్రకటనలను అందించడానికి మరియు కొలవడానికి మీ పరికరం యొక్క ప్రకటన గుర్తింపుదారు మరియు సంబంధిత డేటాను యాక్సెస్ చేయవచ్చు, అనుమతించిన చోట వ్యక్తిగతీకరించిన ప్రకటనలతో సహా. మీ ప్రకటన ఎంపికల కోసం సెక్షన్ 4 చూడండి.","h_notif":"నోటిఫికేషన్‌లు","p_notif":"మీరు నోటిఫికేషన్‌లను ప్రారంభిస్తే, గోల్డెన్-అవర్ హెచ్చరికల వంటి ఐచ్ఛిక రిమైండర్‌లను అందించడానికి App Firebase Cloud Messaging (ఇది పరికర పుష్ టోకెన్‌ను రూపొందిస్తుంది)ను ఉపయోగిస్తుంది. మీరు ఎప్పుడైనా మీ పరికర సెట్టింగ్‌లలో నోటిఫికేషన్‌లను ఆఫ్ చేయవచ్చు.","h_purch":"కొనుగోళ్లు","p_purch":"మీరు ఐచ్ఛిక ఒక-సారి \"Remove Ads / Pro\" అప్‌గ్రేడ్‌ను కొనుగోలు చేస్తే, లావాదేవీ Google Play Billing ద్వారా ప్రాసెస్ చేయబడుతుంది. కొనుగోలు జరిగిందని మేము నిర్ధారణ పొందుతాము తద్వారా మేము Pro లక్షణాలను అన్‌లాక్ చేసి మీ కోసం వాటిని పునరుద్ధరించగలము. మేము మీ చెల్లింపు కార్డ్ లేదా బిల్లింగ్ వివరాలను ఎప్పుడూ చూడము లేదా నిల్వ చేయము — వాటిని పూర్తిగా Google నిర్వహిస్తుంది.","h_provide":"మీరు అందించడానికి ఎంచుకున్న సమాచారం","p_provide":"మీరు మాకు ఇమెయిల్ చేస్తే (మద్దతు లేదా అభిప్రాయం కోసం), మీరు పంపిన ఇమెయిల్ చిరునామా మరియు సందేశ కంటెంట్‌ను మేము స్వీకరిస్తాము, మరియు దాన్ని మీకు ప్రత్యుత్తరం ఇవ్వడానికి మాత్రమే ఉపయోగిస్తాము.","h2":"2. సెన్సార్‌లు","p_sensors":"App దిక్సూచి, లెవెల్, మరియు వంపు లక్షణాలను శక్తివంతం చేయడానికి పరికర చలన సెన్సార్‌లను (యాక్సిలరోమీటర్ మరియు మాగ్నెటోమీటర్) చదువుతుంది. ఈ సెన్సార్ డేటా మీ పరికరంలో నిజ సమయంలో ఉపయోగించబడుతుంది మరియు అది మీ గురించి వ్యక్తిగత సమాచారం కాదు.","h3":"3. మూడవ-పక్ష సేవలు","p_third_intro":"App కింది మూడవ-పక్ష సేవలపై ఆధారపడుతుంది, ప్రతి ఒక్కటి దాని స్వంత గోప్యతా విధానం ద్వారా నిర్వహించబడుతుంది:","tp_advertising":"(ప్రకటనలు)","tp_analytics":"Google Analytics for Firebase & Firebase Crashlytics","tp_notifications":"(నోటిఫికేషన్‌లు)","tp_purchases":"(కొనుగోళ్లు)","li_weather":"ప్రస్తుత పరిస్థితులను ప్రదర్శించడానికి మీ స్థానాన్ని ఉపయోగించి మూడవ-పక్ష వాతావరణ డేటా ప్రొవైడర్‌ను ప్రశ్నించవచ్చు.","h4":"4. ప్రకటనలు మరియు మీ ఎంపికలు","p_ads_intro":"ప్రకటనలను Google AdMob అందిస్తుంది. మీరు మీ పరికరంలో వ్యక్తిగతీకరించిన ప్రకటనలను నియంత్రించవచ్చు:","li_android":"Android: Settings → Google → Ads → మీ ప్రకటన IDని ఆప్ట్ అవుట్ / రీసెట్ చేయండి.","li_remove":"ప్రకటనలను పూర్తిగా తొలగించడం: App‌లో ఒక-సారి Pro అప్‌గ్రేడ్‌ను కొనుగోలు చేయండి.","h5":"5. మేము సమాచారాన్ని ఎలా భాగస్వామ్యం చేస్తాము","p_share":"మేము మీ వ్యక్తిగత సమాచారాన్ని అమ్మము. సెక్షన్ 3లో జాబితా చేయబడిన సేవా ప్రొవైడర్‌లు తమ విధులను నిర్వహించడానికి (ఉదాహరణకు, మ్యాప్‌లు లేదా ప్రకటనలను చూపడం) మాత్రమే సమాచారం భాగస్వామ్యం చేయబడుతుంది, మరియు చట్టం, న్యాయ ప్రక్రియ ద్వారా అవసరమైన చోట, లేదా మా వినియోగదారులు, ప్రజలు, లేదా మా హక్కులు, భద్రత, లేదా ఆస్తిని రక్షించడానికి.","h6":"6. డేటా నిలుపుదల","p_ret":"App ద్వారా సృష్టించబడిన ఫోటోలు, వీడియోలు, మరియు యాప్ సెట్టింగ్‌లు మీరు వాటిని తొలగించే వరకు లేదా App‌ను అన్‌ఇన్‌స్టాల్ చేసే వరకు మీ పరికరంలో ఉంటాయి. సెక్షన్ 3లోని మూడవ-పక్ష సేవలు నిర్వహించే డేటా వాటి సంబంధిత విధానాల ప్రకారం నిలుపుకోబడుతుంది.","h7":"7. భద్రత","p_sec":"మేము సమాచారాన్ని రక్షించడానికి సహేతుకమైన సాంకేతిక మరియు సంస్థాగత చర్యలు తీసుకుంటాము. అయితే, ఏ యాప్, ప్రసారం, లేదా నిల్వ వ్యవస్థ పూర్తిగా సురక్షితం కాదు, మరియు మేము సంపూర్ణ భద్రతకు హామీ ఇవ్వలేము.","h8":"8. పిల్లల గోప్యత","p_child":"App 13 సంవత్సరాల కంటే తక్కువ వయస్సు గల పిల్లలకు (లేదా మీ దేశంలో అవసరమైన కనీస వయస్సు) ఉద్దేశించబడలేదు, మరియు మేము వారి నుండి వ్యక్తిగత సమాచారాన్ని తెలిసి సేకరించము. ఒక పిల్లవాడు మాకు సమాచారం అందించాడని మీరు నమ్మితే, దయచేసి మమ్మల్ని సంప్రదించండి మరియు మేము దాన్ని తొలగిస్తాము.","h9":"9. మీ హక్కులు","p_rights":"మీరు నివసించే చోటును బట్టి (ఉదాహరణకు, GDPR కింద EEA/UK, లేదా CCPA/CPRA కింద California), మీ వ్యక్తిగత సమాచారాన్ని యాక్సెస్ చేయడానికి, సరిచేయడానికి, తొలగించడానికి, లేదా దాని వినియోగాన్ని పరిమితం చేయడానికి, మరియు కొన్ని ప్రాసెసింగ్ నుండి ఆప్ట్ అవుట్ చేయడానికి మీకు హక్కులు ఉండవచ్చు. మీరు ఎప్పుడైనా మీ పరికర సెట్టింగ్‌లలో App యొక్క స్థానం, కెమెరా, నిల్వ, లేదా నోటిఫికేషన్ అనుమతులను ఉపసంహరించడం ద్వారా, మరియు మీ ప్రకటన IDని రీసెట్ చేయడం లేదా ఆప్ట్ అవుట్ చేయడం ద్వారా పరికర-స్థాయి నియంత్రణలను వినియోగించవచ్చు. గోప్యతా అభ్యర్థన చేయడానికి, కింది వివరాలను ఉపయోగించి మమ్మల్ని సంప్రదించండి.","h10":"10. అంతర్జాతీయ వినియోగదారులు","p_intl":"App మరియు అది ఉపయోగించే మూడవ-పక్ష సేవలు మీ స్వంత దేశం కాకుండా ఇతర దేశాలలో సమాచారాన్ని ప్రాసెస్ చేయవచ్చు, అక్కడ డేటా-రక్షణ చట్టాలు భిన్నంగా ఉండవచ్చు. App ఉపయోగించడం ద్వారా మీరు ఈ విధానానికి అనుగుణంగా అటువంటి ప్రాసెసింగ్‌కు సమ్మతిస్తారు.","h11":"11. ఈ గోప్యతా విధానంలో మార్పులు","p_changes":"మేము ఈ గోప్యతా విధానాన్ని ఎప్పటికప్పుడు నవీకరించవచ్చు. ఏవైనా మార్పులు సవరించిన అమలు తేదీతో ఈ పేజీలో పోస్ట్ చేయబడతాయి, కాబట్టి దయచేసి దాన్ని కాలానుగుణంగా సమీక్షించండి. మార్పులు అమలులోకి వచ్చిన తర్వాత App‌ను కొనసాగించి ఉపయోగించడం అంటే మీరు నవీకరించిన విధానాన్ని అంగీకరిస్తారని అర్థం.","h12":"12. మమ్మల్ని సంప్రదించండి","p_contact":"ఈ గోప్యతా విధానం లేదా మీ సమాచారం గురించి మీకు ప్రశ్నలు, అభ్యర్థనలు, లేదా అభిప్రాయం ఉంటే, మమ్మల్ని ఇక్కడ సంప్రదించండి:","footer":"© 2026 GO PRACHI LABS. All rights reserved."},"ui":{"ui_language":"భాష","ui_note":"ఈ అనువాదం మీ సౌలభ్యం కోసం అందించబడింది. ఏదైనా వ్యత్యాసం ఉన్న సందర్భంలో, ఆంగ్ల వెర్షన్ చట్టపరంగా అధికారికమైనది."}},"mr":{"privacy":{"title":"गोपनीयता धोरण","eff":"प्रभावी तारीख: 9 July 2026","intro":"हे गोपनीयता धोरण स्पष्ट करते की GO PRACHI LABS (\"आम्ही\", \"आमचे\") मोबाइल अ‍ॅप्लिकेशन GPS Map Camera & Compass (पॅकेज नाव compass.photo.camera.map.gps.gpsmapcamera_compass) (\"App\") संदर्भात माहिती कशी हाताळते. तुमची गोपनीयता आमच्यासाठी महत्त्वाची आहे. कृपया हे धोरण काळजीपूर्वक वाचा. App वापरून, तुम्ही येथे वर्णन केलेल्या पद्धतींशी सहमत होता.","note":"सोप्या भाषेत: App तुमच्या फोटोंवर तुमच्या स्थानाचा शिक्का मारते, होकायंत्र आणि नकाशे दाखवते, आणि सूर्य/चंद्र आणि हवामान तपशील प्रदर्शित करते. तुमचे फोटो आणि स्थान तुमच्या डिव्हाइसवरच प्रक्रिया केले जातात आणि आमच्या स्वतःच्या सर्व्हरवर अपलोड केले जात नाहीत. खाली वर्णन केल्याप्रमाणे, नकाशे, जाहिराती, विश्लेषण, क्रॅश रिपोर्टिंग, सूचना आणि खरेदीसाठी आम्ही विश्वासार्ह Google सेवा वापरतो.","h1":"1. आम्ही कोणती माहिती गोळा करतो आणि ती कशी वापरतो","h_loc":"स्थान माहिती (अचूक आणि अंदाजे)","p_loc":"तुमच्या परवानगीने, App त्याची मुख्य वैशिष्ट्ये प्रदान करण्यासाठी तुमच्या डिव्हाइसच्या GPS आणि नेटवर्क-आधारित स्थानात प्रवेश करते: तुमच्या फोटो आणि व्हिडिओंना जिओटॅग करणे (प्रतिमेत निर्देशांक आणि पत्ता एम्बेड करणे), नकाशावर तुमची स्थिती दाखवणे, होकायंत्र दिशा, चुंबकीय विचलन, आणि तुमच्या स्थानासाठी सूर्य/चंद्र आणि हवामान तपशीलांची गणना करणे. स्थान तुमच्या डिव्हाइसवर प्रक्रिया केले जाते आणि तुम्ही कॅप्चर केलेल्या मीडियामध्ये एम्बेड केले जाते. ते कलम 3 मध्ये सूचीबद्ध केलेल्या तृतीय-पक्ष सेवांना पाठवले जाऊ शकते (उदाहरणार्थ, नकाशे रेंडर करण्यासाठी किंवा हवामान परिस्थिती मिळवण्यासाठी). आम्ही तुमचे स्थान आमच्या स्वतःच्या सर्व्हरवर संग्रहित करत नाही.","h_cam":"कॅमेरा, फोटो आणि मीडिया","p_cam":"तुमच्या परवानगीने, App तुमचा कॅमेरा वापरून फोटो घेते आणि व्हिडिओ रेकॉर्ड करते, आणि मीडिया वाचते/लिहिते जेणेकरून ती तुमचे कॅप्चर तुमच्या गॅलरीत जतन करू शकेल आणि अ‍ॅपमधील अल्बममध्ये प्रदर्शित करू शकेल. तुम्ही ते शेअर किंवा निर्यात करणे निवडत नाही तोपर्यंत तुमचे फोटो आणि व्हिडिओ तुमच्या डिव्हाइसवरच राहतात. आम्ही तुमचे फोटो किंवा व्हिडिओ अपलोड किंवा राखून ठेवत नाही.","h_dev":"डिव्हाइस आणि वापर माहिती","p_dev":"App कसे वापरले जाते हे समजून घेण्यासाठी आणि क्रॅशचे निदान करण्यासाठी आम्ही Google Analytics for Firebase आणि Firebase Crashlytics वापरतो. यामध्ये अ‍ॅप इव्हेंट्स (जसे उघडलेली वैशिष्ट्ये), डिव्हाइस मॉडेल, ऑपरेटिंग-सिस्टम आवृत्ती, अ‍ॅप आवृत्ती, भाषा, आणि सामान्य प्रदेश/देश, आणि क्रॅश निदान यांचा समावेश असू शकतो. हे आम्हाला बग्स दुरुस्त करण्यास आणि App सुधारण्यास मदत करते.","h_ad":"जाहिरात माहिती","p_ad":"App ची मोफत आवृत्ती Google AdMob द्वारे जाहिराती दाखवते. AdMob जाहिराती देण्यासाठी आणि मोजण्यासाठी तुमच्या डिव्हाइसचा जाहिरात ओळखकर्ता आणि संबंधित डेटामध्ये प्रवेश करू शकते, परवानगी असलेल्या ठिकाणी वैयक्तिकृत जाहिरातींसह. तुमच्या जाहिरात पर्यायांसाठी कलम 4 पहा.","h_notif":"सूचना","p_notif":"तुम्ही सूचना सक्षम केल्यास, App गोल्डन-अवर अलर्टसारखे पर्यायी स्मरणपत्रे देण्यासाठी Firebase Cloud Messaging (जे डिव्हाइस पुश टोकन तयार करते) वापरते. तुम्ही कधीही तुमच्या डिव्हाइस सेटिंग्जमध्ये सूचना बंद करू शकता.","h_purch":"खरेदी","p_purch":"तुम्ही पर्यायी एक-वेळचे \"Remove Ads / Pro\" अपग्रेड खरेदी केल्यास, व्यवहार Google Play Billing द्वारे प्रक्रिया केला जातो. खरेदी झाल्याची पुष्टी आम्हाला मिळते जेणेकरून आम्ही Pro वैशिष्ट्ये अनलॉक करू शकू आणि तुमच्यासाठी ती पुनर्संचयित करू शकू. आम्ही तुमचे पेमेंट कार्ड किंवा बिलिंग तपशील कधीही पाहत नाही किंवा संग्रहित करत नाही — ते पूर्णपणे Google द्वारे हाताळले जातात.","h_provide":"तुम्ही देण्यासाठी निवडलेली माहिती","p_provide":"तुम्ही आम्हाला ईमेल केल्यास (समर्थन किंवा अभिप्रायासाठी), तुम्ही पाठवलेला ईमेल पत्ता आणि संदेश सामग्री आम्हाला मिळते, आणि आम्ही ती फक्त तुम्हाला उत्तर देण्यासाठी वापरतो.","h2":"2. सेन्सर","p_sensors":"App होकायंत्र, लेव्हल, आणि झुकाव वैशिष्ट्ये चालवण्यासाठी डिव्हाइस मोशन सेन्सर (एक्सेलरोमीटर आणि मॅग्नेटोमीटर) वाचते. हा सेन्सर डेटा तुमच्या डिव्हाइसवर रिअल टाइममध्ये वापरला जातो आणि तो तुमच्याबद्दलची वैयक्तिक माहिती नाही.","h3":"3. तृतीय-पक्ष सेवा","p_third_intro":"App खालील तृतीय-पक्ष सेवांवर अवलंबून आहे, त्यातील प्रत्येक त्याच्या स्वतःच्या गोपनीयता धोरणाद्वारे शासित आहे:","tp_advertising":"(जाहिरात)","tp_analytics":"Google Analytics for Firebase & Firebase Crashlytics","tp_notifications":"(सूचना)","tp_purchases":"(खरेदी)","li_weather":"सध्याची परिस्थिती प्रदर्शित करण्यासाठी तुमचे स्थान वापरून तृतीय-पक्ष हवामान डेटा प्रदात्याकडे विचारणा केली जाऊ शकते.","h4":"4. जाहिराती आणि तुमचे पर्याय","p_ads_intro":"जाहिराती Google AdMob द्वारे दिल्या जातात. तुम्ही तुमच्या डिव्हाइसवर वैयक्तिकृत जाहिराती नियंत्रित करू शकता:","li_android":"Android: Settings → Google → Ads → तुमचा जाहिरात ID ऑप्ट आउट / रीसेट करा.","li_remove":"जाहिराती पूर्णपणे काढून टाकणे: App मध्ये एक-वेळचे Pro अपग्रेड खरेदी करा.","h5":"5. आम्ही माहिती कशी सामायिक करतो","p_share":"आम्ही तुमची वैयक्तिक माहिती विकत नाही. माहिती फक्त कलम 3 मध्ये सूचीबद्ध सेवा प्रदात्यांसह सामायिक केली जाते जेणेकरून ते त्यांची कार्ये करू शकतील (उदाहरणार्थ, नकाशे किंवा जाहिराती दाखवणे), आणि जिथे कायदा, कायदेशीर प्रक्रियेद्वारे आवश्यक असेल, किंवा आमच्या वापरकर्त्यांचे, जनतेचे, किंवा आमचे हक्क, सुरक्षा, किंवा मालमत्तेचे संरक्षण करण्यासाठी.","h6":"6. डेटा धारणा","p_ret":"App द्वारे तयार केलेले फोटो, व्हिडिओ, आणि अ‍ॅप सेटिंग्ज तुम्ही ते हटवत नाही किंवा App अनइन्स्टॉल करत नाही तोपर्यंत तुमच्या डिव्हाइसवर राहतात. कलम 3 मधील तृतीय-पक्ष सेवांद्वारे हाताळलेला डेटा त्यांच्या संबंधित धोरणांनुसार राखून ठेवला जातो.","h7":"7. सुरक्षा","p_sec":"आम्ही माहितीचे संरक्षण करण्यासाठी वाजवी तांत्रिक आणि संस्थात्मक उपाय करतो. तथापि, कोणतेही अ‍ॅप, प्रसारण, किंवा संग्रहण प्रणाली पूर्णपणे सुरक्षित नाही, आणि आम्ही पूर्ण सुरक्षिततेची हमी देऊ शकत नाही.","h8":"8. मुलांची गोपनीयता","p_child":"App 13 वर्षांखालील मुलांसाठी (किंवा तुमच्या देशात आवश्यक असलेल्या किमान वयासाठी) निर्देशित नाही, आणि आम्ही जाणूनबुजून त्यांच्याकडून वैयक्तिक माहिती गोळा करत नाही. एखाद्या मुलाने आम्हाला माहिती दिली आहे असे तुम्हाला वाटत असल्यास, कृपया आमच्याशी संपर्क साधा आणि आम्ही ती हटवू.","h9":"9. तुमचे हक्क","p_rights":"तुम्ही कुठे राहता यावर अवलंबून (उदाहरणार्थ, GDPR अंतर्गत EEA/UK, किंवा CCPA/CPRA अंतर्गत California), तुम्हाला तुमच्या वैयक्तिक माहितीमध्ये प्रवेश करण्याचे, दुरुस्त करण्याचे, हटवण्याचे, किंवा तिचा वापर प्रतिबंधित करण्याचे, आणि विशिष्ट प्रक्रियेतून ऑप्ट आउट करण्याचे हक्क असू शकतात. तुम्ही कधीही तुमच्या डिव्हाइस सेटिंग्जमध्ये App च्या स्थान, कॅमेरा, संग्रहण, किंवा सूचना परवानग्या रद्द करून, आणि तुमचा जाहिरात ID रीसेट किंवा ऑप्ट आउट करून डिव्हाइस-स्तरीय नियंत्रणे वापरू शकता. गोपनीयता विनंती करण्यासाठी, खालील तपशील वापरून आमच्याशी संपर्क साधा.","h10":"10. आंतरराष्ट्रीय वापरकर्ते","p_intl":"App आणि ते वापरत असलेल्या तृतीय-पक्ष सेवा तुमच्या स्वतःच्या देशाव्यतिरिक्त इतर देशांमध्ये माहिती प्रक्रिया करू शकतात, जिथे डेटा-संरक्षण कायदे भिन्न असू शकतात. App वापरून तुम्ही या धोरणाशी सुसंगत अशा प्रक्रियेस संमती देता.","h11":"11. या गोपनीयता धोरणातील बदल","p_changes":"आम्ही वेळोवेळी हे गोपनीयता धोरण अद्यतनित करू शकतो. कोणतेही बदल सुधारित प्रभावी तारखेसह या पृष्ठावर पोस्ट केले जातील, म्हणून कृपया त्याचे नियमितपणे पुनरावलोकन करा. बदल प्रभावी झाल्यानंतर App चा सतत वापर म्हणजे तुम्ही अद्यतनित धोरण स्वीकारता.","h12":"12. आमच्याशी संपर्क साधा","p_contact":"या गोपनीयता धोरणाबद्दल किंवा तुमच्या माहितीबद्दल तुम्हाला प्रश्न, विनंत्या, किंवा अभिप्राय असल्यास, आमच्याशी येथे संपर्क साधा:","footer":"© 2026 GO PRACHI LABS. All rights reserved."},"ui":{"ui_language":"भाषा","ui_note":"हे भाषांतर तुमच्या सोयीसाठी प्रदान केले आहे. कोणत्याही विसंगतीच्या बाबतीत, इंग्रजी आवृत्ती कायदेशीरदृष्ट्या अधिकृत आहे."}},"ta":{"privacy":{"title":"தனியுரிமைக் கொள்கை","eff":"அமலுக்கு வரும் தேதி: 9 July 2026","intro":"இந்த தனியுரிமைக் கொள்கை GO PRACHI LABS (\"நாங்கள்\", \"எங்கள்\") மொபைல் பயன்பாடு GPS Map Camera & Compass (தொகுப்புப் பெயர் compass.photo.camera.map.gps.gpsmapcamera_compass) (\"App\") தொடர்பாக தகவலை எவ்வாறு கையாள்கிறது என்பதை விளக்குகிறது. உங்கள் தனியுரிமை எங்களுக்கு முக்கியம். இந்தக் கொள்கையை கவனமாகப் படிக்கவும். App ஐப் பயன்படுத்துவதன் மூலம், இங்கு விவரிக்கப்பட்டுள்ள நடைமுறைகளுக்கு நீங்கள் ஒப்புக்கொள்கிறீர்கள்.","note":"எளிமையாகச் சொன்னால்: App உங்கள் புகைப்படங்களில் உங்கள் இருப்பிடத்தை முத்திரையிடுகிறது, திசைகாட்டி மற்றும் வரைபடங்களைக் காட்டுகிறது, மேலும் சூரியன்/சந்திரன் மற்றும் வானிலை விவரங்களைக் காட்டுகிறது. உங்கள் புகைப்படங்கள் மற்றும் இருப்பிடம் உங்கள் சாதனத்திலேயே செயலாக்கப்படுகின்றன, எங்கள் சொந்த சேவையகங்களுக்கு பதிவேற்றப்படுவதில்லை. கீழே விவரிக்கப்பட்டுள்ளபடி, வரைபடங்கள், விளம்பரங்கள், பகுப்பாய்வு, செயலிழப்பு அறிக்கை, அறிவிப்புகள் மற்றும் கொள்முதல்களுக்கு நாங்கள் நம்பகமான Google சேவைகளைப் பயன்படுத்துகிறோம்.","h1":"1. நாங்கள் சேகரிக்கும் தகவல் மற்றும் அதை எவ்வாறு பயன்படுத்துகிறோம்","h_loc":"இருப்பிடத் தகவல் (துல்லியமான மற்றும் தோராயமான)","p_loc":"உங்கள் அனுமதியுடன், App தனது முக்கிய அம்சங்களை வழங்க உங்கள் சாதனத்தின் GPS மற்றும் நெட்வொர்க் அடிப்படையிலான இருப்பிடத்தை அணுகுகிறது: உங்கள் புகைப்படங்கள் மற்றும் வீடியோக்களை ஜியோடேக் செய்தல் (படத்தில் ஆயங்கள் மற்றும் முகவரியை உட்பொதித்தல்), வரைபடத்தில் உங்கள் நிலையைக் காட்டுதல், திசைகாட்டி திசை, காந்த விலகல், மற்றும் உங்கள் இருப்பிடத்திற்கான சூரியன்/சந்திரன் மற்றும் வானிலை விவரங்களைக் கணக்கிடுதல். இருப்பிடம் உங்கள் சாதனத்தில் செயலாக்கப்பட்டு நீங்கள் படம்பிடிக்கும் ஊடகத்தில் உட்பொதிக்கப்படுகிறது. இது பிரிவு 3 இல் பட்டியலிடப்பட்டுள்ள மூன்றாம் தரப்பு சேவைகளுக்கு அனுப்பப்படலாம் (உதாரணமாக, வரைபடங்களை வழங்குவதற்கு அல்லது வானிலை நிலைமைகளைப் பெறுவதற்கு). நாங்கள் உங்கள் இருப்பிடத்தை எங்கள் சொந்த சேவையகங்களில் சேமிப்பதில்லை.","h_cam":"கேமரா, புகைப்படங்கள் மற்றும் ஊடகம்","p_cam":"உங்கள் அனுமதியுடன், App உங்கள் கேமராவைப் பயன்படுத்தி புகைப்படங்களை எடுக்கிறது மற்றும் வீடியோக்களைப் பதிவு செய்கிறது, மேலும் ஊடகத்தைப் படிக்கிறது/எழுதுகிறது, இதனால் அது உங்கள் படங்களை உங்கள் கேலரியில் சேமித்து பயன்பாட்டிலுள்ள ஆல்பத்தில் காட்ட முடியும். நீங்கள் அவற்றைப் பகிர அல்லது ஏற்றுமதி செய்யத் தேர்ந்தெடுக்கும் வரை உங்கள் புகைப்படங்கள் மற்றும் வீடியோக்கள் உங்கள் சாதனத்திலேயே இருக்கும். நாங்கள் உங்கள் புகைப்படங்கள் அல்லது வீடியோக்களைப் பதிவேற்றுவதில்லை அல்லது தக்கவைப்பதில்லை.","h_dev":"சாதனம் மற்றும் பயன்பாட்டுத் தகவல்","p_dev":"App எவ்வாறு பயன்படுத்தப்படுகிறது என்பதைப் புரிந்துகொள்ளவும் செயலிழப்புகளைக் கண்டறியவும் நாங்கள் Google Analytics for Firebase மற்றும் Firebase Crashlytics ஐப் பயன்படுத்துகிறோம். இதில் பயன்பாட்டு நிகழ்வுகள் (திறக்கப்பட்ட அம்சங்கள் போன்றவை), சாதன மாதிரி, இயக்க-அமைப்பு பதிப்பு, பயன்பாட்டு பதிப்பு, மொழி, மற்றும் பொது பகுதி/நாடு, மற்றும் செயலிழப்பு கண்டறிதல்கள் அடங்கலாம். இது பிழைகளை சரிசெய்யவும் App ஐ மேம்படுத்தவும் எங்களுக்கு உதவுகிறது.","h_ad":"விளம்பரத் தகவல்","p_ad":"App இன் இலவசப் பதிப்பு Google AdMob மூலம் விளம்பரங்களைக் காட்டுகிறது. AdMob விளம்பரங்களை வழங்கவும் அளவிடவும் உங்கள் சாதனத்தின் விளம்பர அடையாளங்காட்டி மற்றும் தொடர்புடைய தரவை அணுகலாம், அனுமதிக்கப்பட்ட இடங்களில் தனிப்பயனாக்கப்பட்ட விளம்பரங்கள் உட்பட. உங்கள் விளம்பர விருப்பங்களுக்கு பிரிவு 4 ஐப் பார்க்கவும்.","h_notif":"அறிவிப்புகள்","p_notif":"நீங்கள் அறிவிப்புகளை இயக்கினால், கோல்டன்-ஹவர் எச்சரிக்கைகள் போன்ற விருப்பமான நினைவூட்டல்களை வழங்க App Firebase Cloud Messaging (இது ஒரு சாதன புஷ் டோக்கனை உருவாக்குகிறது) ஐப் பயன்படுத்துகிறது. நீங்கள் எந்த நேரத்திலும் உங்கள் சாதன அமைப்புகளில் அறிவிப்புகளை அணைக்கலாம்.","h_purch":"கொள்முதல்கள்","p_purch":"நீங்கள் விருப்பமான ஒரு-முறை \"Remove Ads / Pro\" மேம்படுத்தலை வாங்கினால், பரிவர்த்தனை Google Play Billing மூலம் செயலாக்கப்படுகிறது. கொள்முதல் செய்யப்பட்டதற்கான உறுதிப்படுத்தலை நாங்கள் பெறுகிறோம், இதனால் நாங்கள் Pro அம்சங்களைத் திறந்து உங்களுக்காக அவற்றை மீட்டமைக்க முடியும். உங்கள் கட்டண அட்டை அல்லது பில்லிங் விவரங்களை நாங்கள் ஒருபோதும் பார்ப்பதில்லை அல்லது சேமிப்பதில்லை — அவை முழுவதுமாக Google ஆல் கையாளப்படுகின்றன.","h_provide":"நீங்கள் வழங்கத் தேர்ந்தெடுக்கும் தகவல்","p_provide":"நீங்கள் எங்களுக்கு மின்னஞ்சல் அனுப்பினால் (ஆதரவு அல்லது கருத்துக்கு), நீங்கள் அனுப்பும் மின்னஞ்சல் முகவரி மற்றும் செய்தி உள்ளடக்கத்தை நாங்கள் பெறுகிறோம், மேலும் அதை உங்களுக்குப் பதிலளிக்க மட்டுமே பயன்படுத்துகிறோம்.","h2":"2. சென்சார்கள்","p_sensors":"App திசைகாட்டி, லெவல், மற்றும் சாய்வு அம்சங்களை இயக்க சாதன இயக்க சென்சார்களை (அக்செலரோமீட்டர் மற்றும் மேக்னடோமீட்டர்) படிக்கிறது. இந்த சென்சார் தரவு உங்கள் சாதனத்தில் நிகழ் நேரத்தில் பயன்படுத்தப்படுகிறது, மேலும் இது உங்களைப் பற்றிய தனிப்பட்ட தகவல் அல்ல.","h3":"3. மூன்றாம் தரப்பு சேவைகள்","p_third_intro":"App பின்வரும் மூன்றாம் தரப்பு சேவைகளை நம்பியுள்ளது, ஒவ்வொன்றும் அதன் சொந்த தனியுரிமைக் கொள்கையால் நிர்வகிக்கப்படுகிறது:","tp_advertising":"(விளம்பரம்)","tp_analytics":"Google Analytics for Firebase & Firebase Crashlytics","tp_notifications":"(அறிவிப்புகள்)","tp_purchases":"(கொள்முதல்கள்)","li_weather":"தற்போதைய நிலைமைகளைக் காட்ட உங்கள் இருப்பிடத்தைப் பயன்படுத்தி மூன்றாம் தரப்பு வானிலை தரவு வழங்குநரிடம் வினவப்படலாம்.","h4":"4. விளம்பரங்கள் மற்றும் உங்கள் விருப்பங்கள்","p_ads_intro":"விளம்பரங்கள் Google AdMob ஆல் வழங்கப்படுகின்றன. உங்கள் சாதனத்தில் தனிப்பயனாக்கப்பட்ட விளம்பரத்தை நீங்கள் கட்டுப்படுத்தலாம்:","li_android":"Android: Settings → Google → Ads → உங்கள் விளம்பர ID ஐ விலகல் / மீட்டமைக்கவும்.","li_remove":"விளம்பரங்களை முழுவதுமாக அகற்றுதல்: App இல் ஒரு-முறை Pro மேம்படுத்தலை வாங்கவும்.","h5":"5. நாங்கள் தகவலை எவ்வாறு பகிர்கிறோம்","p_share":"நாங்கள் உங்கள் தனிப்பட்ட தகவலை விற்பதில்லை. பிரிவு 3 இல் பட்டியலிடப்பட்டுள்ள சேவை வழங்குநர்கள் தங்கள் செயல்பாடுகளைச் செய்ய (உதாரணமாக, வரைபடங்கள் அல்லது விளம்பரங்களைக் காட்டுதல்) மட்டுமே தகவல் பகிரப்படுகிறது, மேலும் சட்டம், சட்ட நடைமுறை மூலம் தேவைப்படும் இடங்களில், அல்லது எங்கள் பயனர்கள், பொதுமக்கள், அல்லது எங்கள் உரிமைகள், பாதுகாப்பு, அல்லது சொத்தைப் பாதுகாக்க.","h6":"6. தரவு தக்கவைப்பு","p_ret":"App ஆல் உருவாக்கப்பட்ட புகைப்படங்கள், வீடியோக்கள், மற்றும் பயன்பாட்டு அமைப்புகள் நீங்கள் அவற்றை நீக்கும் வரை அல்லது App ஐ நிறுவல் நீக்கும் வரை உங்கள் சாதனத்தில் இருக்கும். பிரிவு 3 இல் உள்ள மூன்றாம் தரப்பு சேவைகளால் கையாளப்படும் தரவு அவற்றின் தொடர்புடைய கொள்கைகளின்படி தக்கவைக்கப்படுகிறது.","h7":"7. பாதுகாப்பு","p_sec":"தகவலைப் பாதுகாக்க நாங்கள் நியாயமான தொழில்நுட்ப மற்றும் நிறுவன நடவடிக்கைகளை எடுக்கிறோம். இருப்பினும், எந்தவொரு பயன்பாடு, பரிமாற்றம், அல்லது சேமிப்பு அமைப்பும் முழுமையாக பாதுகாப்பானது அல்ல, மேலும் நாங்கள் முழுமையான பாதுகாப்பிற்கு உத்தரவாதம் அளிக்க முடியாது.","h8":"8. குழந்தைகளின் தனியுரிமை","p_child":"App 13 வயதிற்குட்பட்ட குழந்தைகளுக்கு (அல்லது உங்கள் நாட்டில் தேவையான குறைந்தபட்ச வயது) இயக்கப்படவில்லை, மேலும் நாங்கள் அறிந்தே அவர்களிடமிருந்து தனிப்பட்ட தகவலைச் சேகரிப்பதில்லை. ஒரு குழந்தை எங்களுக்குத் தகவல் வழங்கியதாக நீங்கள் நம்பினால், தயவுசெய்து எங்களைத் தொடர்பு கொள்ளுங்கள், நாங்கள் அதை நீக்குவோம்.","h9":"9. உங்கள் உரிமைகள்","p_rights":"நீங்கள் வசிக்கும் இடத்தைப் பொறுத்து (உதாரணமாக, GDPR இன் கீழ் EEA/UK, அல்லது CCPA/CPRA இன் கீழ் California), உங்கள் தனிப்பட்ட தகவலை அணுக, திருத்த, நீக்க, அல்லது அதன் பயன்பாட்டைக் கட்டுப்படுத்த, மேலும் சில செயலாக்கத்திலிருந்து விலக உங்களுக்கு உரிமைகள் இருக்கலாம். நீங்கள் எந்த நேரத்திலும் உங்கள் சாதன அமைப்புகளில் App இன் இருப்பிடம், கேமரா, சேமிப்பு, அல்லது அறிவிப்பு அனுமதிகளை ரத்து செய்வதன் மூலமும், உங்கள் விளம்பர ID ஐ மீட்டமைப்பதன் அல்லது விலகுவதன் மூலமும் சாதன-நிலை கட்டுப்பாடுகளைப் பயன்படுத்தலாம். தனியுரிமைக் கோரிக்கையை வைக்க, கீழே உள்ள விவரங்களைப் பயன்படுத்தி எங்களைத் தொடர்பு கொள்ளுங்கள்.","h10":"10. சர்வதேச பயனர்கள்","p_intl":"App மற்றும் அது பயன்படுத்தும் மூன்றாம் தரப்பு சேவைகள் உங்கள் சொந்த நாட்டைத் தவிர மற்ற நாடுகளில் தகவலைச் செயலாக்கலாம், அங்கு தரவு-பாதுகாப்புச் சட்டங்கள் வேறுபடலாம். App ஐப் பயன்படுத்துவதன் மூலம் இந்தக் கொள்கைக்கு இணங்க அத்தகைய செயலாக்கத்திற்கு நீங்கள் ஒப்புதல் அளிக்கிறீர்கள்.","h11":"11. இந்த தனியுரிமைக் கொள்கையில் மாற்றங்கள்","p_changes":"நாங்கள் இந்த தனியுரிமைக் கொள்கையை அவ்வப்போது புதுப்பிக்கலாம். எந்த மாற்றங்களும் திருத்தப்பட்ட அமலுக்கு வரும் தேதியுடன் இந்தப் பக்கத்தில் இடுகையிடப்படும், எனவே தயவுசெய்து அதை அவ்வப்போது மதிப்பாய்வு செய்யவும். மாற்றங்கள் அமலுக்கு வந்த பிறகு App இன் தொடர்ச்சியான பயன்பாடு நீங்கள் புதுப்பிக்கப்பட்ட கொள்கையை ஏற்றுக்கொள்கிறீர்கள் என்பதைக் குறிக்கிறது.","h12":"12. எங்களைத் தொடர்பு கொள்ளுங்கள்","p_contact":"இந்த தனியுரிமைக் கொள்கை அல்லது உங்கள் தகவல் குறித்து உங்களுக்கு கேள்விகள், கோரிக்கைகள், அல்லது கருத்துகள் இருந்தால், எங்களை இங்கே தொடர்பு கொள்ளுங்கள்:","footer":"© 2026 GO PRACHI LABS. All rights reserved."},"ui":{"ui_language":"மொழி","ui_note":"இந்த மொழிபெயர்ப்பு உங்கள் வசதிக்காக வழங்கப்படுகிறது. ஏதேனும் முரண்பாடு ஏற்பட்டால், ஆங்கிலப் பதிப்பே சட்டப்பூர்வமாக அதிகாரப்பூர்வமானது."}},"gu":{"privacy":{"title":"ગોપનીયતા નીતિ","eff":"અમલી તારીખ: 9 July 2026","intro":"આ ગોપનીયતા નીતિ સમજાવે છે કે GO PRACHI LABS (\"અમે\", \"અમારું\") મોબાઇલ એપ્લિકેશન GPS Map Camera & Compass (પેકેજ નામ compass.photo.camera.map.gps.gpsmapcamera_compass) (\"App\") ના સંબંધમાં માહિતી કેવી રીતે સંભાળે છે. તમારી ગોપનીયતા અમારા માટે મહત્વપૂર્ણ છે. કૃપા કરીને આ નીતિ ધ્યાનપૂર્વક વાંચો. App નો ઉપયોગ કરીને, તમે અહીં વર્ણવેલ પદ્ધતિઓ સાથે સંમત થાઓ છો.","note":"સાદી ભાષામાં: App તમારા ફોટા પર તમારા સ્થાનની મુદ્રા લગાવે છે, હોકાયંત્ર અને નકશા બતાવે છે, અને સૂર્ય/ચંદ્ર અને હવામાનની વિગતો દર્શાવે છે. તમારા ફોટા અને સ્થાન તમારા ઉપકરણ પર જ પ્રક્રિયા થાય છે અને અમારા પોતાના સર્વર પર અપલોડ થતા નથી. નીચે વર્ણવ્યા મુજબ, અમે નકશા, જાહેરાતો, વિશ્લેષણ, ક્રેશ રિપોર્ટિંગ, સૂચનાઓ અને ખરીદીઓ માટે વિશ્વસનીય Google સેવાઓનો ઉપયોગ કરીએ છીએ.","h1":"1. અમે કઈ માહિતી એકત્રિત કરીએ છીએ અને તેનો ઉપયોગ કેવી રીતે કરીએ છીએ","h_loc":"સ્થાન માહિતી (ચોક્કસ અને અંદાજિત)","p_loc":"તમારી પરવાનગી સાથે, App તેની મુખ્ય સુવિધાઓ પ્રદાન કરવા માટે તમારા ઉપકરણના GPS અને નેટવર્ક-આધારિત સ્થાનનો ઉપયોગ કરે છે: તમારા ફોટા અને વિડિયોને જિયોટેગ કરવા (છબીમાં કોઓર્ડિનેટ્સ અને સરનામું એમ્બેડ કરવા), નકશા પર તમારી સ્થિતિ બતાવવી, હોકાયંત્રની દિશા, ચુંબકીય વિચલન, અને તમારા સ્થાન માટે સૂર્ય/ચંદ્ર અને હવામાનની વિગતોની ગણતરી કરવી. સ્થાન તમારા ઉપકરણ પર પ્રક્રિયા થાય છે અને તમે કેપ્ચર કરેલા મીડિયામાં એમ્બેડ થાય છે. તે વિભાગ 3 માં સૂચિબદ્ધ તૃતીય-પક્ષ સેવાઓને મોકલવામાં આવી શકે છે (ઉદાહરણ તરીકે, નકશા રેન્ડર કરવા અથવા હવામાનની સ્થિતિ મેળવવા). અમે તમારું સ્થાન અમારા પોતાના સર્વર પર સંગ્રહિત કરતા નથી.","h_cam":"કેમેરા, ફોટા અને મીડિયા","p_cam":"તમારી પરવાનગી સાથે, App તમારા કેમેરાનો ઉપયોગ ફોટા લેવા અને વિડિયો રેકોર્ડ કરવા માટે કરે છે, અને મીડિયા વાંચે/લખે છે જેથી તે તમારા કેપ્ચરને તમારી ગેલેરીમાં સાચવી શકે અને એપની અંદરના આલ્બમમાં પ્રદર્શિત કરી શકે. જ્યાં સુધી તમે તેમને શેર અથવા નિકાસ કરવાનું પસંદ ન કરો ત્યાં સુધી તમારા ફોટા અને વિડિયો તમારા ઉપકરણ પર જ રહે છે. અમે તમારા ફોટા અથવા વિડિયો અપલોડ અથવા જાળવી રાખતા નથી.","h_dev":"ઉપકરણ અને ઉપયોગ માહિતી","p_dev":"App કેવી રીતે ઉપયોગ થાય છે તે સમજવા અને ક્રેશનું નિદાન કરવા માટે અમે Google Analytics for Firebase અને Firebase Crashlytics નો ઉપયોગ કરીએ છીએ. આમાં એપ ઇવેન્ટ્સ (જેમ કે ખોલેલી સુવિધાઓ), ઉપકરણ મોડેલ, ઓપરેટિંગ-સિસ્ટમ સંસ્કરણ, એપ સંસ્કરણ, ભાષા, અને સામાન્ય પ્રદેશ/દેશ, અને ક્રેશ નિદાનનો સમાવેશ થઈ શકે છે. આ અમને બગ્સ ઠીક કરવામાં અને App સુધારવામાં મદદ કરે છે.","h_ad":"જાહેરાત માહિતી","p_ad":"App નું મફત સંસ્કરણ Google AdMob દ્વારા જાહેરાતો બતાવે છે. AdMob જાહેરાતો પ્રદાન કરવા અને માપવા માટે તમારા ઉપકરણના જાહેરાત ઓળખકર્તા અને સંબંધિત ડેટાનો ઉપયોગ કરી શકે છે, જ્યાં પરવાનગી હોય ત્યાં વ્યક્તિગત જાહેરાતો સહિત. તમારા જાહેરાત વિકલ્પો માટે વિભાગ 4 જુઓ.","h_notif":"સૂચનાઓ","p_notif":"જો તમે સૂચનાઓ સક્ષમ કરો, તો App ગોલ્ડન-અવર ચેતવણીઓ જેવા વૈકલ્પિક રિમાઇન્ડર્સ પહોંચાડવા માટે Firebase Cloud Messaging (જે ઉપકરણ પુશ ટોકન બનાવે છે) નો ઉપયોગ કરે છે. તમે કોઈપણ સમયે તમારા ઉપકરણ સેટિંગ્સમાં સૂચનાઓ બંધ કરી શકો છો.","h_purch":"ખરીદીઓ","p_purch":"જો તમે વૈકલ્પિક એક-વખતનું \"Remove Ads / Pro\" અપગ્રેડ ખરીદો, તો વ્યવહાર Google Play Billing દ્વારા પ્રક્રિયા કરવામાં આવે છે. અમને પુષ્ટિ મળે છે કે ખરીદી થઈ છે જેથી અમે Pro સુવિધાઓ અનલોક કરી શકીએ અને તમારા માટે તેને પુનઃસ્થાપિત કરી શકીએ. અમે તમારું પેમેન્ટ કાર્ડ અથવા બિલિંગ વિગતો ક્યારેય જોતા નથી અથવા સંગ્રહિત કરતા નથી — તે સંપૂર્ણપણે Google દ્વારા સંભાળવામાં આવે છે.","h_provide":"તમે પ્રદાન કરવાનું પસંદ કરો છો તે માહિતી","p_provide":"જો તમે અમને ઇમેઇલ કરો (સપોર્ટ અથવા પ્રતિસાદ માટે), તો અમને તમે મોકલેલ ઇમેઇલ સરનામું અને સંદેશ સામગ્રી મળે છે, અને અમે તેનો ઉપયોગ ફક્ત તમને જવાબ આપવા માટે કરીએ છીએ.","h2":"2. સેન્સર્સ","p_sensors":"App હોકાયંત્ર, લેવલ, અને નમેલા સુવિધાઓને શક્તિ આપવા માટે ઉપકરણ ગતિ સેન્સર્સ (એક્સેલેરોમીટર અને મેગ્નેટોમીટર) વાંચે છે. આ સેન્સર ડેટા તમારા ઉપકરણ પર રીઅલ ટાઇમમાં વપરાય છે અને તે તમારા વિશે વ્યક્તિગત માહિતી નથી.","h3":"3. તૃતીય-પક્ષ સેવાઓ","p_third_intro":"App નીચેની તૃતીય-પક્ષ સેવાઓ પર આધાર રાખે છે, જેમાંની દરેક તેની પોતાની ગોપનીયતા નીતિ દ્વારા સંચાલિત છે:","tp_advertising":"(જાહેરાત)","tp_analytics":"Google Analytics for Firebase & Firebase Crashlytics","tp_notifications":"(સૂચનાઓ)","tp_purchases":"(ખરીદીઓ)","li_weather":"વર્તમાન સ્થિતિ પ્રદર્શિત કરવા માટે તમારા સ્થાનનો ઉપયોગ કરીને તૃતીય-પક્ષ હવામાન ડેટા પ્રદાતાને પૂછપરછ કરવામાં આવી શકે છે.","h4":"4. જાહેરાતો અને તમારા વિકલ્પો","p_ads_intro":"જાહેરાતો Google AdMob દ્વારા પ્રદાન કરવામાં આવે છે. તમે તમારા ઉપકરણ પર વ્યક્તિગત જાહેરાત નિયંત્રિત કરી શકો છો:","li_android":"Android: Settings → Google → Ads → તમારું જાહેરાત ID ઑપ્ટ આઉટ / રીસેટ કરો.","li_remove":"જાહેરાતો સંપૂર્ણપણે દૂર કરવી: App માં એક-વખતનું Pro અપગ્રેડ ખરીદો.","h5":"5. અમે માહિતી કેવી રીતે શેર કરીએ છીએ","p_share":"અમે તમારી વ્યક્તિગત માહિતી વેચતા નથી. માહિતી ફક્ત વિભાગ 3 માં સૂચિબદ્ધ સેવા પ્રદાતાઓ સાથે શેર કરવામાં આવે છે જેથી તેઓ તેમના કાર્યો કરી શકે (ઉદાહરણ તરીકે, નકશા અથવા જાહેરાતો બતાવવી), અને જ્યાં કાયદા, કાનૂની પ્રક્રિયા દ્વારા જરૂરી હોય, અથવા અમારા વપરાશકર્તાઓ, જનતા, અથવા અમારા અધિકારો, સલામતી, અથવા મિલકતનું રક્ષણ કરવા માટે.","h6":"6. ડેટા જાળવણી","p_ret":"App દ્વારા બનાવેલા ફોટા, વિડિયો, અને એપ સેટિંગ્સ જ્યાં સુધી તમે તેમને કાઢી ન નાખો અથવા App અનઇન્સ્ટોલ ન કરો ત્યાં સુધી તમારા ઉપકરણ પર રહે છે. વિભાગ 3 માં તૃતીય-પક્ષ સેવાઓ દ્વારા સંભાળવામાં આવેલ ડેટા તેમની સંબંધિત નીતિઓ અનુસાર જાળવી રાખવામાં આવે છે.","h7":"7. સુરક્ષા","p_sec":"અમે માહિતીનું રક્ષણ કરવા માટે વાજબી તકનીકી અને સંગઠનાત્મક પગલાં લઈએ છીએ. જોકે, કોઈપણ એપ, ટ્રાન્સમિશન, અથવા સંગ્રહ સિસ્ટમ સંપૂર્ણપણે સુરક્ષિત નથી, અને અમે સંપૂર્ણ સુરક્ષાની ખાતરી આપી શકતા નથી.","h8":"8. બાળકોની ગોપનીયતા","p_child":"App 13 વર્ષથી નાની ઉંમરના બાળકો (અથવા તમારા દેશમાં જરૂરી લઘુત્તમ ઉંમર) માટે નિર્દેશિત નથી, અને અમે જાણી જોઈને તેમની પાસેથી વ્યક્તિગત માહિતી એકત્રિત કરતા નથી. જો તમને લાગે કે કોઈ બાળકે અમને માહિતી પ્રદાન કરી છે, તો કૃપા કરીને અમારો સંપર્ક કરો અને અમે તેને કાઢી નાખીશું.","h9":"9. તમારા અધિકારો","p_rights":"તમે ક્યાં રહો છો તેના આધારે (ઉદાહરણ તરીકે, GDPR હેઠળ EEA/UK, અથવા CCPA/CPRA હેઠળ California), તમને તમારી વ્યક્તિગત માહિતીને ઍક્સેસ કરવા, સુધારવા, કાઢી નાખવા, અથવા તેના ઉપયોગને પ્રતિબંધિત કરવા, અને અમુક પ્રક્રિયામાંથી ઑપ્ટ આઉટ કરવાના અધિકારો હોઈ શકે છે. તમે કોઈપણ સમયે તમારા ઉપકરણ સેટિંગ્સમાં App ની સ્થાન, કેમેરા, સંગ્રહ, અથવા સૂચના પરવાનગીઓ રદ કરીને, અને તમારું જાહેરાત ID રીસેટ અથવા ઑપ્ટ આઉટ કરીને ઉપકરણ-સ્તરના નિયંત્રણોનો ઉપયોગ કરી શકો છો. ગોપનીયતા વિનંતી કરવા માટે, નીચેની વિગતોનો ઉપયોગ કરીને અમારો સંપર્ક કરો.","h10":"10. આંતરરાષ્ટ્રીય વપરાશકર્તાઓ","p_intl":"App અને તે વાપરતી તૃતીય-પક્ષ સેવાઓ તમારા પોતાના દેશ સિવાયના અન્ય દેશોમાં માહિતી પ્રક્રિયા કરી શકે છે, જ્યાં ડેટા-સુરક્ષા કાયદા અલગ હોઈ શકે છે. App નો ઉપયોગ કરીને તમે આ નીતિને અનુરૂપ આવી પ્રક્રિયા માટે સંમતિ આપો છો.","h11":"11. આ ગોપનીયતા નીતિમાં ફેરફારો","p_changes":"અમે સમય-સમય પર આ ગોપનીયતા નીતિ અપડેટ કરી શકીએ છીએ. કોઈપણ ફેરફારો સુધારેલી અમલી તારીખ સાથે આ પૃષ્ઠ પર પોસ્ટ કરવામાં આવશે, તેથી કૃપા કરીને તેની સમયાંતરે સમીક્ષા કરો. ફેરફારો અમલમાં આવ્યા પછી App નો સતત ઉપયોગ એટલે તમે અપડેટ કરેલી નીતિ સ્વીકારો છો.","h12":"12. અમારો સંપર્ક કરો","p_contact":"જો તમને આ ગોપનીયતા નીતિ અથવા તમારી માહિતી વિશે પ્રશ્નો, વિનંતીઓ, અથવા પ્રતિસાદ હોય, તો અમારો અહીં સંપર્ક કરો:","footer":"© 2026 GO PRACHI LABS. All rights reserved."},"ui":{"ui_language":"ભાષા","ui_note":"આ અનુવાદ તમારી સુવિધા માટે પ્રદાન કરવામાં આવ્યો છે. કોઈપણ વિસંગતતાના કિસ્સામાં, અંગ્રેજી સંસ્કરણ કાયદેસર રીતે અધિકૃત છે."}},"ur":{"privacy":{"title":"پرائیویسی پالیسی","eff":"نافذ العمل تاریخ: 9 July 2026","intro":"یہ پرائیویسی پالیسی وضاحت کرتی ہے کہ GO PRACHI LABS (\"ہم\"، \"ہمارا\") موبائل ایپلیکیشن GPS Map Camera & Compass (پیکج نام compass.photo.camera.map.gps.gpsmapcamera_compass) (\"App\") کے سلسلے میں معلومات کو کیسے سنبھالتی ہے۔ آپ کی پرائیویسی ہمارے لیے اہم ہے۔ براہ کرم اس پالیسی کو غور سے پڑھیں۔ App استعمال کرنے سے، آپ یہاں بیان کردہ طریقوں سے اتفاق کرتے ہیں۔","note":"سادہ الفاظ میں: App آپ کی تصاویر پر آپ کے مقام کی مہر لگاتی ہے، قطب نما اور نقشے دکھاتی ہے، اور سورج/چاند اور موسم کی تفصیلات ظاہر کرتی ہے۔ آپ کی تصاویر اور مقام آپ کے آلے پر ہی پروسیس ہوتے ہیں اور ہمارے اپنے سرورز پر اپ لوڈ نہیں کیے جاتے۔ جیسا کہ ذیل میں بیان کیا گیا ہے، ہم نقشوں، اشتہارات، تجزیات، کریش رپورٹنگ، اطلاعات، اور خریداریوں کے لیے قابل اعتماد Google خدمات استعمال کرتے ہیں۔","h1":"1. ہم کون سی معلومات جمع کرتے ہیں اور اسے کیسے استعمال کرتے ہیں","h_loc":"مقام کی معلومات (درست اور تخمینی)","p_loc":"آپ کی اجازت سے، App اپنی بنیادی خصوصیات فراہم کرنے کے لیے آپ کے آلے کے GPS اور نیٹ ورک پر مبنی مقام تک رسائی حاصل کرتی ہے: آپ کی تصاویر اور ویڈیوز کو جیو ٹیگ کرنا (تصویر میں کوآرڈینیٹس اور پتہ شامل کرنا)، نقشے پر آپ کی پوزیشن دکھانا، قطب نما کی سمت، مقناطیسی انحراف، اور آپ کے مقام کے لیے سورج/چاند اور موسم کی تفصیلات کا حساب لگانا۔ مقام آپ کے آلے پر پروسیس ہوتا ہے اور آپ کے کیپچر کردہ میڈیا میں شامل کیا جاتا ہے۔ اسے  July 2026","intro":"ಈ ಗೌಪ್ಯತಾ ನೀತಿಯು GO PRACHI LABS (“ನಾವು”, “ನಮ್ಮ”) ಮೊಬೈಲ್ ಅಪ್ಲಿಕೇಶನ್ GPS Map Camera & Compass (ಪ್ಯಾಕೇಜ್ ಹೆಸರು compass.photo.camera.map.gps.gpsmapcamera_compass) (“ಆ್ಯಪ್”) ಗೆ ಸಂಬಂಧಿಸಿದ ಮಾಹಿತಿಯನ್ನು ಹೇಗೆ ನಿರ್ವಹಿಸುತ್ತದೆ ಎಂಬುದನ್ನು ವಿವರಿಸುತ್ತದೆ. ನಿಮ್ಮ ಗೌಪ್ಯತೆ ನಮಗೆ ಮುಖ್ಯ. ಈ ನೀತಿಯನ್ನು ದಯವಿಟ್ಟು ಎಚ್ಚರಿಕೆಯಿಂದ ಓದಿ. ಆ್ಯಪ್ ಬಳಸುವ ಮೂಲಕ, ಇಲ್ಲಿ ವಿವರಿಸಿದ ಪದ್ಧತಿಗಳಿಗೆ ನೀವು ಸಮ್ಮತಿಸುತ್ತೀರಿ.","note":"ಸರಳವಾಗಿ ಹೇಳುವುದಾದರೆ: ಆ್ಯಪ್ ನಿಮ್ಮ ಫೋಟೋಗಳ ಮೇಲೆ ನಿಮ್ಮ ಸ್ಥಳವನ್ನು ಮುದ್ರಿಸುತ್ತದೆ, ಕಂಪಾಸ್ ಮತ್ತು ನಕ್ಷೆಗಳನ್ನು ತೋರಿಸುತ್ತದೆ, ಮತ್ತು ಸೂರ್ಯ/ಚಂದ್ರ ಹಾಗೂ ಹವಾಮಾನದ ವಿವರಗಳನ್ನು ಪ್ರದರ್ಶಿಸುತ್ತದೆ. ನಿಮ್ಮ ಫೋಟೋಗಳು ಮತ್ತು ಸ್ಥಳವನ್ನು ನಿಮ್ಮ ಸಾಧನದಲ್ಲೇ ಸಂಸ್ಕರಿಸಲಾಗುತ್ತದೆ ಮತ್ತು ನಮ್ಮ ಸ್ವಂತ ಸರ್ವರ್‌ಗಳಿಗೆ ಅಪ್‌ಲೋಡ್ ಮಾಡಲಾಗುವುದಿಲ್ಲ. ಕೆಳಗೆ ವಿವರಿಸಿದಂತೆ, ನಕ್ಷೆಗಳು, ಜಾಹೀರಾತುಗಳು, ವಿಶ್ಲೇಷಣೆ, ಕ್ರ್ಯಾಶ್ ವರದಿ, ಅಧಿಸೂಚನೆಗಳು ಮತ್ತು ಖರೀದಿಗಳಿಗಾಗಿ ನಾವು ವಿಶ್ವಾಸಾರ್ಹ Google ಸೇವೆಗಳನ್ನು ಬಳಸುತ್ತೇವೆ.","h1":"1. ನಾವು ಸಂಗ್ರಹಿಸುವ ಮಾಹಿತಿ ಮತ್ತು ಅದನ್ನು ನಾವು ಹೇಗೆ ಬಳಸುತ್ತೇವೆ","h_loc":"ಸ್ಥಳ ಮಾಹಿತಿ (ನಿಖರ ಮತ್ತು ಅಂದಾಜು)","p_loc":"ನಿಮ್ಮ ಅನುಮತಿಯೊಂದಿಗೆ, ಆ್ಯಪ್ ತನ್ನ ಮುಖ್ಯ ವೈಶಿಷ್ಟ್ಯಗಳನ್ನು ಒದಗಿಸಲು ನಿಮ್ಮ ಸಾಧನದ GPS ಮತ್ತು ನೆಟ್‌ವರ್ಕ್ ಆಧಾರಿತ ಸ್ಥಳವನ್ನು ಪ್ರವೇಶಿಸುತ್ತದೆ: ನಿಮ್ಮ ಫೋಟೋಗಳು ಮತ್ತು ವೀಡಿಯೊಗಳನ್ನು ಜಿಯೋಟ್ಯಾಗ್ ಮಾಡುವುದು (ಚಿತ್ರದೊಳಗೆ ನಿರ್ದೇಶಾಂಕಗಳು ಮತ್ತು ವಿಳಾಸವನ್ನು ಅಳವಡಿಸುವುದು), ನಕ್ಷೆಯಲ್ಲಿ ನಿಮ್ಮ ಸ್ಥಾನವನ್ನು ತೋರಿಸುವುದು, ಕಂಪಾಸ್ ದಿಕ್ಕು, ಕಾಂತೀಯ ವಿಚಲನೆ, ಮತ್ತು ನಿಮ್ಮ ಸ್ಥಳದ ಸೂರ್ಯ/ಚಂದ್ರ ಹಾಗೂ ಹವಾಮಾನದ ವಿವರಗಳನ್ನು ಲೆಕ್ಕಹಾಕುವುದು. ಸ್ಥಳವನ್ನು ನಿಮ್ಮ ಸಾಧನದಲ್ಲೇ ಸಂಸ್ಕರಿಸಿ ನೀವು ಸೆರೆಹಿಡಿಯುವ ಮಾಧ್ಯಮದೊಳಗೆ ಅಳವಡಿಸಲಾಗುತ್ತದೆ. ಇದನ್ನು ವಿಭಾಗ 3 ರಲ್ಲಿ ಪಟ್ಟಿ ಮಾಡಿದ ಮೂರನೇ ಪಕ್ಷದ ಸೇವೆಗಳಿಗೆ ಕಳುಹಿಸಬಹುದು (ಉದಾಹರಣೆಗೆ, ನಕ್ಷೆಗಳನ್ನು ತೋರಿಸಲು ಅಥವಾ ಹವಾಮಾನ ಸ್ಥಿತಿಗಳನ್ನು ಪಡೆಯಲು). ನಾವು ನಿಮ್ಮ ಸ್ಥಳವನ್ನು ನಮ್ಮ ಸ್ವಂತ ಸರ್ವರ್‌ಗಳಲ್ಲಿ ಸಂಗ್ರಹಿಸುವುದಿಲ್ಲ.","h_cam":"ಕ್ಯಾಮೆರಾ, ಫೋಟೋಗಳು ಮತ್ತು ಮಾಧ್ಯಮ","p_cam":"ನಿಮ್ಮ ಅನುಮತಿಯೊಂದಿಗೆ, ಆ್ಯಪ್ ಫೋಟೋಗಳನ್ನು ತೆಗೆಯಲು ಮತ್ತು ವೀಡಿಯೊಗಳನ್ನು ರೆಕಾರ್ಡ್ ಮಾಡಲು ನಿಮ್ಮ ಕ್ಯಾಮೆರಾವನ್ನು ಬಳಸುತ್ತದೆ, ಮತ್ತು ನಿಮ್ಮ ಸೆರೆಹಿಡಿದವುಗಳನ್ನು ನಿಮ್ಮ ಗ್ಯಾಲರಿಗೆ ಉಳಿಸಿ ಆ್ಯಪ್-ಒಳಗಿನ ಆಲ್ಬಂನಲ್ಲಿ ತೋರಿಸುವಂತೆ ಮಾಧ್ಯಮವನ್ನು ಓದುತ್ತದೆ/ಬರೆಯುತ್ತದೆ. ನೀವು ಹಂಚಿಕೊಳ್ಳಲು ಅಥವಾ ರಫ್ತು ಮಾಡಲು ಆಯ್ಕೆ ಮಾಡಿದ ಹೊರತು ನಿಮ್ಮ ಫೋಟೋಗಳು ಮತ್ತು ವೀಡಿಯೊಗಳು ನಿಮ್ಮ ಸಾಧನದಲ್ಲೇ ಉಳಿಯುತ್ತವೆ. ನಾವು ನಿಮ್ಮ ಫೋಟೋಗಳು ಅಥವಾ ವೀಡಿಯೊಗಳನ್ನು ಅಪ್‌ಲೋಡ್ ಅಥವಾ ಉಳಿಸಿಕೊಳ್ಳುವುದಿಲ್ಲ.","h_dev":"ಸಾಧನ ಮತ್ತು ಬಳಕೆ ಮಾಹಿತಿ","p_dev":"ಆ್ಯಪ್ ಅನ್ನು ಹೇಗೆ ಬಳಸಲಾಗುತ್ತದೆ ಎಂಬುದನ್ನು ಅರ್ಥಮಾಡಿಕೊಳ್ಳಲು ಮತ್ತು ಕ್ರ್ಯಾಶ್‌ಗಳನ್ನು ಪತ್ತೆಹಚ್ಚಲು ನಾವು Google Analytics for Firebase ಮತ್ತು Firebase Crashlytics ಬಳಸುತ್ತೇವೆ. ಇದರಲ್ಲಿ ಆ್ಯಪ್ ಘಟನೆಗಳು (ತೆರೆದ ವೈಶಿಷ್ಟ್ಯಗಳಂತಹವು), ಸಾಧನ ಮಾದರಿ, ಆಪರೇಟಿಂಗ್-ಸಿಸ್ಟಂ ಆವೃತ್ತಿ, ಆ್ಯಪ್ ಆವೃತ್ತಿ, ಭಾಷೆ, ಮತ್ತು ಸಾಮಾನ್ಯ ಪ್ರದೇಶ/ದೇಶ, ಹಾಗೂ ಕ್ರ್ಯಾಶ್ ಪತ್ತೆಹಚ್ಚುವಿಕೆ ಸೇರಿರಬಹುದು. ಇದು ಬಗ್‌ಗಳನ್ನು ಸರಿಪಡಿಸಲು ಮತ್ತು ಆ್ಯಪ್ ಅನ್ನು ಸುಧಾರಿಸಲು ನಮಗೆ ಸಹಾಯ ಮಾಡುತ್ತದೆ.","h_ad":"ಜಾಹೀರಾತು ಮಾಹಿತಿ","p_ad":"ಆ್ಯಪ್‌ನ ಉಚಿತ ಆವೃತ್ತಿಯು Google AdMob ಮೂಲಕ ಜಾಹೀರಾತುಗಳನ್ನು ತೋರಿಸುತ್ತದೆ. AdMob ಜಾಹೀರಾತುಗಳನ್ನು ಒದಗಿಸಲು ಮತ್ತು ಅಳೆಯಲು ನಿಮ್ಮ ಸಾಧನದ ಜಾಹೀರಾತು ಗುರುತಿಸುವಿಕೆ ಮತ್ತು ಸಂಬಂಧಿತ ಡೇಟಾವನ್ನು ಪ್ರವೇಶಿಸಬಹುದು, ಅನುಮತಿಸಿದ ಕಡೆ ವೈಯಕ್ತಿಕಗೊಳಿಸಿದ ಜಾಹೀರಾತುಗಳನ್ನೂ ಒಳಗೊಂಡಂತೆ. ನಿಮ್ಮ ಜಾಹೀರಾತು ಆಯ್ಕೆಗಳಿಗಾಗಿ ವಿಭಾಗ 4 ಅನ್ನು ನೋಡಿ.","h_notif":"ಅಧಿಸೂಚನೆಗಳು","p_notif":"ನೀವು ಅಧಿಸೂಚನೆಗಳನ್ನು ಸಕ್ರಿಯಗೊಳಿಸಿದರೆ, ಗೋಲ್ಡನ್-ಅವರ್ ಎಚ್ಚರಿಕೆಗಳಂತಹ ಐಚ್ಛಿಕ ಜ್ಞಾಪನೆಗಳನ್ನು ತಲುಪಿಸಲು ಆ್ಯಪ್ Firebase Cloud Messaging (ಇದು ಸಾಧನ ಪುಶ್ ಟೋಕನ್ ಅನ್ನು ಉತ್ಪಾದಿಸುತ್ತದೆ) ಬಳಸುತ್ತದೆ. ನೀವು ಯಾವಾಗ ಬೇಕಾದರೂ ನಿಮ್ಮ ಸಾಧನದ ಸೆಟ್ಟಿಂಗ್‌ಗಳಲ್ಲಿ ಅಧಿಸೂಚನೆಗಳನ್ನು ಆಫ್ ಮಾಡಬಹುದು.","h_purch":"ಖರೀದಿಗಳು","p_purch":"ನೀವು ಐಚ್ಛಿಕ ಒಂದು-ಬಾರಿಯ “Remove Ads / Pro” ಅಪ್‌ಗ್ರೇಡ್ ಖರೀದಿಸಿದರೆ, ವಹಿವಾಟನ್ನು Google Play Billing ಸಂಸ್ಕರಿಸುತ್ತದೆ. ಖರೀದಿ ಮಾಡಲಾಗಿದೆ ಎಂಬ ದೃಢೀಕರಣವನ್ನು ನಾವು ಪಡೆಯುತ್ತೇವೆ, ಇದರಿಂದ ನಾವು Pro ವೈಶಿಷ್ಟ್ಯಗಳನ್ನು ಅನ್‌ಲಾಕ್ ಮಾಡಿ ನಿಮಗಾಗಿ ಮರುಸ್ಥಾಪಿಸಬಹುದು. ನಿಮ್ಮ ಪಾವತಿ ಕಾರ್ಡ್ ಅಥವಾ ಬಿಲ್ಲಿಂಗ್ ವಿವರಗಳನ್ನು ನಾವು ಎಂದಿಗೂ ನೋಡುವುದಿಲ್ಲ ಅಥವಾ ಸಂಗ್ರಹಿಸುವುದಿಲ್ಲ — ಅವುಗಳನ್ನು ಸಂಪೂರ್ಣವಾಗಿ Google ನಿರ್ವಹಿಸುತ್ತದೆ.","h_provide":"ನೀವು ಒದಗಿಸಲು ಆಯ್ಕೆ ಮಾಡುವ ಮಾಹಿತಿ","p_provide":"ನೀವು ನಮಗೆ (ಬೆಂಬಲ ಅಥವಾ ಪ್ರತಿಕ್ರಿಯೆಗಾಗಿ) ಇಮೇಲ್ ಮಾಡಿದರೆ, ನೀವು ಕಳುಹಿಸುವ ಇಮೇಲ್ ವಿಳಾಸ ಮತ್ತು ಸಂದೇಶದ ವಿಷಯವನ್ನು ನಾವು ಪಡೆಯುತ್ತೇವೆ, ಮತ್ತು ಅದನ್ನು ನಿಮಗೆ ಪ್ರತಿಕ್ರಿಯಿಸಲು ಮಾತ್ರ ಬಳಸುತ್ತೇವೆ.","h2":"2. ಸಂವೇದಕಗಳು","p_sensors":"ಆ್ಯಪ್ ಕಂಪಾಸ್, ಲೆವೆಲ್ ಮತ್ತು ಟಿಲ್ಟ್ ವೈಶಿಷ್ಟ್ಯಗಳಿಗಾಗಿ ಸಾಧನದ ಚಲನೆ ಸಂವೇದಕಗಳನ್ನು (ಆಕ್ಸೆಲೆರೋಮೀಟರ್ ಮತ್ತು ಮ್ಯಾಗ್ನೆಟೋಮೀಟರ್) ಓದುತ್ತದೆ. ಈ ಸಂವೇದಕ ಡೇಟಾವನ್ನು ನಿಮ್ಮ ಸಾಧನದಲ್ಲೇ ನೈಜ ಸಮಯದಲ್ಲಿ ಬಳಸಲಾಗುತ್ತದೆ ಮತ್ತು ಇದು ನಿಮ್ಮ ಬಗ್ಗೆ ವೈಯಕ್ತಿಕ ಮಾಹಿತಿಯಲ್ಲ.","h3":"3. ಮೂರನೇ ಪಕ್ಷದ ಸೇವೆಗಳು","p_third_intro":"ಆ್ಯಪ್ ಈ ಕೆಳಗಿನ ಮೂರನೇ ಪಕ್ಷದ ಸೇವೆಗಳ ಮೇಲೆ ಅವಲಂಬಿತವಾಗಿದೆ, ಪ್ರತಿಯೊಂದೂ ತನ್ನದೇ ಆದ ಗೌಪ್ಯತಾ ನೀತಿಯಿಂದ ನಿಯಂತ್ರಿಸಲ್ಪಡುತ್ತದೆ:","tp_advertising":"(ಜಾಹೀರಾತು)","tp_analytics":"Google Analytics for Firebase & Firebase Crashlytics","tp_notifications":"(ಅಧಿಸೂಚನೆಗಳು)","tp_purchases":"(ಖರೀದಿಗಳು)","li_weather":"ಪ್ರಸ್ತುತ ಸ್ಥಿತಿಗಳನ್ನು ತೋರಿಸಲು ನಿಮ್ಮ ಸ್ಥಳವನ್ನು ಬಳಸಿ ಮೂರನೇ ಪಕ್ಷದ ಹವಾಮಾನ ಡೇಟಾ ಒದಗಿಸುವವರನ್ನು ವಿಚಾರಿಸಬಹುದು.","h4":"4. ಜಾಹೀರಾತುಗಳು ಮತ್ತು ನಿಮ್ಮ ಆಯ್ಕೆಗಳು","p_ads_intro":"ಜಾಹೀರಾತುಗಳನ್ನು Google AdMob ಒದಗಿಸುತ್ತದೆ. ನಿಮ್ಮ ಸಾಧನದಲ್ಲಿ ವೈಯಕ್ತಿಕಗೊಳಿಸಿದ ಜಾಹೀರಾತನ್ನು ನೀವು ನಿಯಂತ್ರಿಸಬಹುದು:","li_android":"Android: Settings → Google → Ads → ನಿಮ್ಮ ಜಾಹೀರಾತು ID ಯಿಂದ ಹೊರಗುಳಿಯಿರಿ / ಮರುಹೊಂದಿಸಿ.","li_remove":"ಜಾಹೀರಾತುಗಳನ್ನು ಸಂಪೂರ್ಣವಾಗಿ ತೆಗೆದುಹಾಕುವುದು: ಆ್ಯಪ್‌ನಲ್ಲಿ ಒಂದು-ಬಾರಿಯ Pro ಅಪ್‌ಗ್ರೇಡ್ ಖರೀದಿಸಿ.","h5":"5. ನಾವು ಮಾಹಿತಿಯನ್ನು ಹೇಗೆ ಹಂಚಿಕೊಳ್ಳುತ್ತೇವೆ","p_share":"ನಾವು ನಿಮ್ಮ ವೈಯಕ್ತಿಕ ಮಾಹಿತಿಯನ್ನು ಮಾರಾಟ ಮಾಡುವುದಿಲ್ಲ. ವಿಭಾಗ 3 ರಲ್ಲಿ ಪಟ್ಟಿ ಮಾಡಿದ ಸೇವಾ ಒದಗಿಸುವವರೊಂದಿಗೆ ಮಾತ್ರ ಮಾಹಿತಿಯನ್ನು ಹಂಚಿಕೊಳ್ಳಲಾಗುತ್ತದೆ, ಇದರಿಂದ ಅವರು ತಮ್ಮ ಕಾರ್ಯಗಳನ್ನು ನಿರ್ವಹಿಸಬಹುದು (ಉದಾಹರಣೆಗೆ, ನಕ್ಷೆಗಳು ಅಥವಾ ಜಾಹೀರಾತುಗಳನ್ನು ತೋರಿಸುವುದು), ಮತ್ತು ಕಾನೂನು, ಕಾನೂನು ಪ್ರಕ್ರಿಯೆಯಿಂದ ಅಗತ್ಯವಿರುವಲ್ಲಿ, ಅಥವಾ ನಮ್ಮ ಬಳಕೆದಾರರ, ಸಾರ್ವಜನಿಕರ ಅಥವಾ ನಮ್ಮ ಹಕ್ಕುಗಳು, ಸುರಕ್ಷತೆ ಅಥವಾ ಆಸ್ತಿಯನ್ನು ರಕ್ಷಿಸಲು.","h6":"6. ಡೇಟಾ ಉಳಿಸಿಕೊಳ್ಳುವಿಕೆ","p_ret":"ಆ್ಯಪ್ ರಚಿಸಿದ ಫೋಟೋಗಳು, ವೀಡಿಯೊಗಳು ಮತ್ತು ಆ್ಯಪ್ ಸೆಟ್ಟಿಂಗ್‌ಗಳು ನೀವು ಅವುಗಳನ್ನು ಅಳಿಸುವವರೆಗೆ ಅಥವಾ ಆ್ಯಪ್ ಅಸ್ಥಾಪಿಸುವವರೆಗೆ ನಿಮ್ಮ ಸಾಧನದಲ್ಲೇ ಉಳಿಯುತ್ತವೆ. ವಿಭಾಗ 3 ರ ಮೂರನೇ ಪಕ್ಷದ ಸೇವೆಗಳು ನಿರ್ವಹಿಸುವ ಡೇಟಾವನ್ನು ಅವರವರ ನೀತಿಗಳ ಪ್ರಕಾರ ಉಳಿಸಿಕೊಳ್ಳಲಾಗುತ್ತದೆ.","h7":"7. ಭದ್ರತೆ","p_sec":"ಮಾಹಿತಿಯನ್ನು ರಕ್ಷಿಸಲು ನಾವು ಸಮಂಜಸ ತಾಂತ್ರಿಕ ಮತ್ತು ಸಾಂಸ್ಥಿಕ ಕ್ರಮಗಳನ್ನು ಕೈಗೊಳ್ಳುತ್ತೇವೆ. ಆದಾಗ್ಯೂ, ಯಾವುದೇ ಆ್ಯಪ್, ಪ್ರಸರಣ ಅಥವಾ ಸಂಗ್ರಹಣಾ ವ್ಯವಸ್ಥೆಯು ಸಂಪೂರ್ಣವಾಗಿ ಸುರಕ್ಷಿತವಲ್ಲ, ಮತ್ತು ನಾವು ಸಂಪೂರ್ಣ ಭದ್ರತೆಯನ್ನು ಖಾತರಿಪಡಿಸಲಾಗುವುದಿಲ್ಲ.","h8":"8. ಮಕ್ಕಳ ಗೌಪ್ಯತೆ","p_child":"ಆ್ಯಪ್ 13 ವರ್ಷಕ್ಕಿಂತ ಕಡಿಮೆ ವಯಸ್ಸಿನ (ಅಥವಾ ನಿಮ್ಮ ದೇಶದಲ್ಲಿ ಅಗತ್ಯವಿರುವ ಕನಿಷ್ಠ ವಯಸ್ಸಿನ) ಮಕ್ಕಳಿಗೆ ಉದ್ದೇಶಿಸಿಲ್ಲ, ಮತ್ತು ನಾವು ಅವರಿಂದ ವೈಯಕ್ತಿಕ ಮಾಹಿತಿಯನ್ನು ಉದ್ದೇಶಪೂರ್ವಕವಾಗಿ ಸಂಗ್ರಹಿಸುವುದಿಲ್ಲ. ಒಂದು ಮಗು ನಮಗೆ ಮಾಹಿತಿ ನೀಡಿದೆ ಎಂದು ನೀವು ನಂಬಿದರೆ, ದಯವಿಟ್ಟು ನಮ್ಮನ್ನು ಸಂಪರ್ಕಿಸಿ ಮತ್ತು ನಾವು ಅದನ್ನು ಅಳಿಸುತ್ತೇವೆ.","h9":"9. ನಿಮ್ಮ ಹಕ್ಕುಗಳು","p_rights":"ನೀವು ಎಲ್ಲಿ ವಾಸಿಸುತ್ತೀರಿ ಎಂಬುದನ್ನು ಅವಲಂಬಿಸಿ (ಉದಾಹರಣೆಗೆ, GDPR ಅಡಿಯಲ್ಲಿ EEA/UK, ಅಥವಾ CCPA/CPRA ಅಡಿಯಲ್ಲಿ California), ನಿಮ್ಮ ವೈಯಕ್ತಿಕ ಮಾಹಿತಿಯನ್ನು ಪ್ರವೇಶಿಸಲು, ಸರಿಪಡಿಸಲು, ಅಳಿಸಲು ಅಥವಾ ಅದರ ಬಳಕೆಯನ್ನು ನಿರ್ಬಂಧಿಸಲು, ಮತ್ತು ಕೆಲವು ಸಂಸ್ಕರಣೆಯಿಂದ ಹೊರಗುಳಿಯಲು ನಿಮಗೆ ಹಕ್ಕುಗಳಿರಬಹುದು. ನಿಮ್ಮ ಸಾಧನದ ಸೆಟ್ಟಿಂಗ್‌ಗಳಲ್ಲಿ ಆ್ಯಪ್‌ನ ಸ್ಥಳ, ಕ್ಯಾಮೆರಾ, ಸಂಗ್ರಹಣೆ ಅಥವಾ ಅಧಿಸೂಚನೆ ಅನುಮತಿಗಳನ್ನು ಹಿಂಪಡೆಯುವ ಮೂಲಕ, ಮತ್ತು ನಿಮ್ಮ ಜಾಹೀರಾತು ID ಅನ್ನು ಮರುಹೊಂದಿಸುವ ಅಥವಾ ಅದರಿಂದ ಹೊರಗುಳಿಯುವ ಮೂಲಕ ನೀವು ಯಾವಾಗ ಬೇಕಾದರೂ ಸಾಧನ-ಮಟ್ಟದ ನಿಯಂತ್ರಣಗಳನ್ನು ಚಲಾಯಿಸಬಹುದು. ಗೌಪ್ಯತಾ ವಿನಂತಿಯನ್ನು ಮಾಡಲು, ಕೆಳಗಿನ ವಿವರಗಳನ್ನು ಬಳಸಿ ನಮ್ಮನ್ನು ಸಂಪರ್ಕಿಸಿ.","h10":"10. ಅಂತಾರಾಷ್ಟ್ರೀಯ ಬಳಕೆದಾರರು","p_intl":"ಆ್ಯಪ್ ಮತ್ತು ಅದು ಬಳಸುವ ಮೂರನೇ ಪಕ್ಷದ ಸೇವೆಗಳು ನಿಮ್ಮದೇ ಹೊರತಾದ ದೇಶಗಳಲ್ಲಿ ಮಾಹಿತಿಯನ್ನು ಸಂಸ್ಕರಿಸಬಹುದು, ಅಲ್ಲಿ ಡೇಟಾ-ಸಂರಕ್ಷಣಾ ಕಾನೂನುಗಳು ಭಿನ್ನವಾಗಿರಬಹುದು. ಆ್ಯಪ್ ಬಳಸುವ ಮೂಲಕ ನೀವು ಈ ನೀತಿಗೆ ಅನುಗುಣವಾದ ಅಂತಹ ಸಂಸ್ಕರಣೆಗೆ ಸಮ್ಮತಿಸುತ್ತೀರಿ.","h11":"11. ಈ ಗೌಪ್ಯತಾ ನೀತಿಯ ಬದಲಾವಣೆಗಳು","p_changes":"ನಾವು ಈ ಗೌಪ್ಯತಾ ನೀತಿಯನ್ನು ಕಾಲಕಾಲಕ್ಕೆ ನವೀಕರಿಸಬಹುದು. ಯಾವುದೇ ಬದಲಾವಣೆಗಳನ್ನು ಪರಿಷ್ಕೃತ ಜಾರಿ ದಿನಾಂಕದೊಂದಿಗೆ ಈ ಪುಟದಲ್ಲಿ ಪೋಸ್ಟ್ ಮಾಡಲಾಗುತ್ತದೆ, ಆದ್ದರಿಂದ ದಯವಿಟ್ಟು ಅದನ್ನು ನಿಯತಕಾಲಿಕವಾಗಿ ಪರಿಶೀಲಿಸಿ. ಬದಲಾವಣೆಗಳು ಜಾರಿಗೆ ಬಂದ ನಂತರ ಆ್ಯಪ್‌ನ ನಿರಂತರ ಬಳಕೆ ಎಂದರೆ ನೀವು ನವೀಕರಿಸಿದ ನೀತಿಯನ್ನು ಸ್ವೀಕರಿಸುತ್ತೀರಿ ಎಂದರ್ಥ.","h12":"12. ನಮ್ಮನ್ನು ಸಂಪರ್ಕಿಸಿ","p_contact":"ಈ ಗೌಪ್ಯತಾ ನೀತಿ ಅಥವಾ ನಿಮ್ಮ ಮಾಹಿತಿಯ ಬಗ್ಗೆ ನಿಮಗೆ ಪ್ರಶ್ನೆಗಳು, ವಿನಂತಿಗಳು ಅಥವಾ ಪ್ರತಿಕ್ರಿಯೆ ಇದ್ದರೆ, ನಮ್ಮನ್ನು ಇಲ್ಲಿ ಸಂಪರ್ಕಿಸಿ:","footer":"© 2026 GO PRACHI LABS. ಎಲ್ಲಾ ಹಕ್ಕುಗಳನ್ನು ಕಾಯ್ದಿರಿಸಲಾಗಿದೆ."},"ui":{"ui_language":"ಭಾಷೆ","ui_note":"ಈ ಅನುವಾದವನ್ನು ನಿಮ್ಮ ಅನುಕೂಲಕ್ಕಾಗಿ ಒದಗಿಸಲಾಗಿದೆ. ಯಾವುದೇ ವ್ಯತ್ಯಾಸವಿದ್ದಲ್ಲಿ, ಇಂಗ್ಲಿಷ್ ಆವೃತ್ತಿಯೇ ಕಾನೂನುಬದ್ಧವಾಗಿ ಅಧಿಕೃತವಾಗಿದೆ."}},"ml":{"privacy":{"title":"സ്വകാര്യതാ നയം","eff":"പ്രാബല്യത്തിൽ വരുന്ന തീയതി: 9 July 2026","intro":"GPS Map Camera & Compass (പാക്കേജ് നാമം compass.photo.camera.map.gps.gpsmapcamera_compass) (“ആപ്പ്”) എന്ന മൊബൈൽ ആപ്ലിക്കേഷനുമായി ബന്ധപ്പെട്ട വിവരങ്ങൾ GO PRACHI LABS (“ഞങ്ങൾ”, “ഞങ്ങളുടെ”) എങ്ങനെ കൈകാര്യം ചെയ്യുന്നു എന്ന് ഈ സ്വകാര്യതാ നയം വിശദീകരിക്കുന്നു. നിങ്ങളുടെ സ്വകാര്യത ഞങ്ങൾക്ക് പ്രധാനമാണ്. ഈ നയം ദയവായി ശ്രദ്ധയോടെ വായിക്കുക. ആപ്പ് ഉപയോഗിക്കുന്നതിലൂടെ, ഇവിടെ വിവരിച്ചിരിക്കുന്ന രീതികൾക്ക് നിങ്ങൾ സമ്മതിക്കുന്നു.","note":"ലളിതമായി പറഞ്ഞാൽ: ആപ്പ് നിങ്ങളുടെ ഫോട്ടോകളിൽ നിങ്ങളുടെ സ്ഥാനം സ്റ്റാമ്പ് ചെയ്യുന്നു, കോമ്പസും മാപ്പുകളും കാണിക്കുന്നു, കൂടാതെ സൂര്യൻ/ചന്ദ്രൻ, കാലാവസ്ഥ വിശദാംശങ്ങൾ പ്രദർശിപ്പിക്കുന്നു. നിങ്ങളുടെ ഫോട്ടോകളും സ്ഥാനവും നിങ്ങളുടെ ഉപകരണത്തിൽ തന്നെ പ്രോസസ്സ് ചെയ്യപ്പെടുന്നു, ഞങ്ങളുടെ സ്വന്തം സെർവറുകളിലേക്ക് അപ്‌ലോഡ് ചെയ്യുന്നില്ല. താഴെ വിവരിച്ചിരിക്കുന്നതുപോലെ, മാപ്പുകൾ, പരസ്യങ്ങൾ, അനലിറ്റിക്സ്, ക്രാഷ് റിപ്പോർട്ടിംഗ്, അറിയിപ്പുകൾ, വാങ്ങലുകൾ എന്നിവയ്ക്കായി ഞങ്ങൾ വിശ്വസനീയമായ Google സേവനങ്ങൾ ഉപയോഗിക്കുന്നു.","h1":"1. ഞങ്ങൾ ശേഖരിക്കുന്ന വിവരങ്ങളും അവ എങ്ങനെ ഉപയോഗിക്കുന്നു എന്നതും","h_loc":"സ്ഥാന വിവരങ്ങൾ (കൃത്യവും ഏകദേശവും)","p_loc":"നിങ്ങളുടെ അനുമതിയോടെ, ആപ്പ് അതിന്റെ പ്രധാന സവിശേഷതകൾ നൽകാൻ നിങ്ങളുടെ ഉപകരണത്തിന്റെ GPS, നെറ്റ്‌വർക്ക് അധിഷ്ഠിത സ്ഥാനം ആക്‌സസ് ചെയ്യുന്നു: നിങ്ങളുടെ ഫോട്ടോകളും വീഡിയോകളും ജിയോടാഗ് ചെയ്യുക (ചിത്രത്തിനുള്ളിൽ കോർഡിനേറ്റുകളും വിലാസവും ഉൾപ്പെടുത്തുക), മാപ്പിൽ നിങ്ങളുടെ സ്ഥാനം കാണിക്കുക, കോമ്പസ് ദിശ, കാന്തിക വ്യതിയാനം, നിങ്ങളുടെ സ്ഥാനത്തിനായുള്ള സൂര്യൻ/ചന്ദ്രൻ, കാലാവസ്ഥ വിശദാംശങ്ങൾ കണക്കാക്കുക. സ്ഥാനം നിങ്ങളുടെ ഉപകരണത്തിൽ പ്രോസസ്സ് ചെയ്ത് നിങ്ങൾ പകർത്തുന്ന മീഡിയയിൽ ഉൾപ്പെടുത്തുന്നു. ഇത് വിഭാഗം 3-ൽ പട്ടികപ്പെടുത്തിയിരിക്കുന്ന മൂന്നാം കക്ഷി സേവനങ്ങളിലേക്ക് അയച്ചേക്കാം (ഉദാഹരണത്തിന്, മാപ്പുകൾ കാണിക്കാനോ കാലാവസ്ഥ അവസ്ഥകൾ വീണ്ടെടുക്കാനോ). ഞങ്ങൾ നിങ്ങളുടെ സ്ഥാനം ഞങ്ങളുടെ സ്വന്തം സെർവറുകളിൽ സൂക്ഷിക്കുന്നില്ല.","h_cam":"ക്യാമറ, ഫോട്ടോകൾ, മീഡിയ","p_cam":"നിങ്ങളുടെ അനുമതിയോടെ, ആപ്പ് ഫോട്ടോകൾ എടുക്കാനും വീഡിയോകൾ റെക്കോർഡ് ചെയ്യാനും നിങ്ങളുടെ ക്യാമറ ഉപയോഗിക്കുന്നു, കൂടാതെ നിങ്ങളുടെ പകർത്തലുകൾ നിങ്ങളുടെ ഗാലറിയിൽ സംരക്ഷിക്കാനും ആപ്പിനുള്ളിലെ ആൽബത്തിൽ പ്രദർശിപ്പിക്കാനും മീഡിയ വായിക്കുകയും/എഴുതുകയും ചെയ്യുന്നു. നിങ്ങൾ പങ്കിടാനോ കയറ്റുമതി ചെയ്യാനോ തിരഞ്ഞെടുക്കുന്നില്ലെങ്കിൽ നിങ്ങളുടെ ഫോട്ടോകളും വീഡിയോകളും നിങ്ങളുടെ ഉപകരണത്തിൽ തന്നെ തുടരും. ഞങ്ങൾ നിങ്ങളുടെ ഫോട്ടോകളോ വീഡിയോകളോ അപ്‌ലോഡ് ചെയ്യുകയോ നിലനിർത്തുകയോ ചെയ്യുന്നില്ല.","h_dev":"ഉപകരണവും ഉപയോഗ വിവരങ്ങളും","p_dev":"ആപ്പ് എങ്ങനെ ഉപയോഗിക്കുന്നു എന്ന് മനസ്സിലാക്കാനും ക്രാഷുകൾ കണ്ടെത്താനും ഞങ്ങൾ Google Analytics for Firebase, Firebase Crashlytics എന്നിവ ഉപയോഗിക്കുന്നു. ഇതിൽ ആപ്പ് ഇവന്റുകൾ (തുറന്ന സവിശേഷതകൾ പോലുള്ളവ), ഉപകരണ മോഡൽ, ഓപ്പറേറ്റിംഗ്-സിസ്റ്റം പതിപ്പ്, ആപ്പ് പതിപ്പ്, ഭാഷ, പൊതുവായ പ്രദേശം/രാജ്യം, ക്രാഷ് ഡയഗ്നോസ്റ്റിക്സ് എന്നിവ ഉൾപ്പെട്ടേക്കാം. ഇത് ബഗുകൾ പരിഹരിക്കാനും ആപ്പ് മെച്ചപ്പെടുത്താനും ഞങ്ങളെ സഹായിക്കുന്നു.","h_ad":"പരസ്യ വിവരങ്ങൾ","p_ad":"ആപ്പിന്റെ സൗജന്യ പതിപ്പ് Google AdMob വഴി പരസ്യങ്ങൾ കാണിക്കുന്നു. പരസ്യങ്ങൾ നൽകാനും അളക്കാനും, അനുവദനീയമായിടത്ത് വ്യക്തിഗതമാക്കിയ പരസ്യങ്ങൾ ഉൾപ്പെടെ, AdMob നിങ്ങളുടെ ഉപകരണത്തിന്റെ പരസ്യ ഐഡന്റിഫയറും അനുബന്ധ ഡാറ്റയും ആക്‌സസ് ചെയ്തേക്കാം. നിങ്ങളുടെ പരസ്യ ചോയ്‌സുകൾക്കായി വിഭാഗം 4 കാണുക.","h_notif":"അറിയിപ്പുകൾ","p_notif":"നിങ്ങൾ അറിയിപ്പുകൾ പ്രവർത്തനക്ഷമമാക്കിയാൽ, ഗോൾഡൻ-അവർ അലേർട്ടുകൾ പോലുള്ള ഓപ്ഷണൽ ഓർമ്മപ്പെടുത്തലുകൾ എത്തിക്കാൻ ആപ്പ് Firebase Cloud Messaging (ഇത് ഒരു ഉപകരണ പുഷ് ടോക്കൺ സൃഷ്ടിക്കുന്നു) ഉപയോഗിക്കുന്നു. നിങ്ങളുടെ ഉപകരണ ക്രമീകരണങ്ങളിൽ എപ്പോൾ വേണമെങ്കിലും അറിയിപ്പുകൾ ഓഫാക്കാം.","h_purch":"വാങ്ങലുകൾ","p_purch":"നിങ്ങൾ ഓപ്ഷണൽ ഒറ്റത്തവണ “Remove Ads / Pro” അപ്‌ഗ്രേഡ് വാങ്ങിയാൽ, ഇടപാട് Google Play Billing പ്രോസസ്സ് ചെയ്യുന്നു. ഒരു വാങ്ങൽ നടന്നു എന്ന സ്ഥിരീകരണം ഞങ്ങൾക്ക് ലഭിക്കുന്നു, അതുവഴി ഞങ്ങൾക്ക് Pro സവിശേഷതകൾ അൺലോക്ക് ചെയ്യാനും നിങ്ങൾക്കായി അവ പുനഃസ്ഥാപിക്കാനും കഴിയും. നിങ്ങളുടെ പേയ്‌മെന്റ് കാർഡ് അല്ലെങ്കിൽ ബില്ലിംഗ് വിശദാംശങ്ങൾ ഞങ്ങൾ ഒരിക്കലും കാണുകയോ സൂക്ഷിക്കുകയോ ചെയ്യുന്നില്ല — അവ പൂർണ്ണമായും Google കൈകാര്യം ചെയ്യുന്നു.","h_provide":"നിങ്ങൾ നൽകാൻ തിരഞ്ഞെടുക്കുന്ന വിവരങ്ങൾ","p_provide":"നിങ്ങൾ ഞങ്ങൾക്ക് (പിന്തുണയ്‌ക്കോ ഫീഡ്‌ബാക്കിനോ) ഇമെയിൽ ചെയ്‌താൽ, നിങ്ങൾ അയയ്ക്കുന്ന ഇമെയിൽ വിലാസവും സന്ദേശ ഉള്ളടക്കവും ഞങ്ങൾക്ക് ലഭിക്കുന്നു, കൂടാതെ അത് നിങ്ങൾക്ക് മറുപടി നൽകാൻ മാത്രം ഉപയോഗിക്കുന്നു.","h2":"2. സെൻസറുകൾ","p_sensors":"കോമ്പസ്, ലെവൽ, ടിൽറ്റ് സവിശേഷതകൾ പ്രവർത്തിപ്പിക്കാൻ ആപ്പ് ഉപകരണ ചലന സെൻസറുകൾ (ആക്‌സിലറോമീറ്റർ, മാഗ്നറ്റോമീറ്റർ) വായിക്കുന്നു. ഈ സെൻസർ ഡാറ്റ നിങ്ങളുടെ ഉപകരണത്തിൽ തത്സമയം ഉപയോഗിക്കുന്നു, ഇത് നിങ്ങളെക്കുറിച്ചുള്ള വ്യക്തിഗത വിവരമല്ല.","h3":"3. മൂന്നാം കക്ഷി സേവനങ്ങൾ","p_third_intro":"ആപ്പ് ഇനിപ്പറയുന്ന മൂന്നാം കക്ഷി സേവനങ്ങളെ ആശ്രയിക്കുന്നു, ഓരോന്നും അതിന്റേതായ സ്വകാര്യതാ നയത്താൽ നിയന്ത്രിക്കപ്പെടുന്നു:","tp_advertising":"(പരസ്യം)","tp_analytics":"Google Analytics for Firebase & Firebase Crashlytics","tp_notifications":"(അറിയിപ്പുകൾ)","tp_purchases":"(വാങ്ങലുകൾ)","li_weather":"നിലവിലെ അവസ്ഥകൾ പ്രദർശിപ്പിക്കാൻ നിങ്ങളുടെ സ്ഥാനം ഉപയോഗിച്ച് ഒരു മൂന്നാം കക്ഷി കാലാവസ്ഥ ഡാറ്റ ദാതാവിനെ അന്വേഷിച്ചേക്കാം.","h4":"4. പരസ്യങ്ങളും നിങ്ങളുടെ ചോയ്‌സുകളും","p_ads_intro":"പരസ്യങ്ങൾ Google AdMob നൽകുന്നു. നിങ്ങളുടെ ഉപകരണത്തിൽ വ്യക്തിഗതമാക്കിയ പരസ്യം നിയന്ത്രിക്കാം:","li_android":"Android: Settings → Google → Ads → നിങ്ങളുടെ പരസ്യ ID-യിൽ നിന്ന് ഒഴിവാകുക / റീസെറ്റ് ചെയ്യുക.","li_remove":"പരസ്യങ്ങൾ പൂർണ്ണമായി നീക്കം ചെയ്യുന്നു: ആപ്പിൽ ഒറ്റത്തവണ Pro അപ്‌ഗ്രേഡ് വാങ്ങുക.","h5":"5. ഞങ്ങൾ എങ്ങനെ വിവരങ്ങൾ പങ്കിടുന്നു","p_share":"ഞങ്ങൾ നിങ്ങളുടെ വ്യക്തിഗത വിവരങ്ങൾ വിൽക്കുന്നില്ല. വിഭാഗം 3-ൽ പട്ടികപ്പെടുത്തിയിരിക്കുന്ന സേവന ദാതാക്കൾക്ക് അവരുടെ പ്രവർത്തനങ്ങൾ നിർവഹിക്കാൻ വേണ്ടി മാത്രം (ഉദാഹരണത്തിന്, മാപ്പുകളോ പരസ്യങ്ങളോ കാണിക്കാൻ) വിവരങ്ങൾ പങ്കിടുന്നു, കൂടാതെ നിയമം, നിയമ പ്രക്രിയ ആവശ്യപ്പെടുന്നിടത്ത്, അല്ലെങ്കിൽ ഞങ്ങളുടെ ഉപയോക്താക്കളുടെ, പൊതുജനങ്ങളുടെ, അല്ലെങ്കിൽ ഞങ്ങളുടെ അവകാശങ്ങൾ, സുരക്ഷ, സ്വത്ത് എന്നിവ സംരക്ഷിക്കാൻ.","h6":"6. ഡാറ്റ നിലനിർത്തൽ","p_ret":"ആപ്പ് സൃഷ്ടിക്കുന്ന ഫോട്ടോകൾ, വീഡിയോകൾ, ആപ്പ് ക്രമീകരണങ്ങൾ എന്നിവ നിങ്ങൾ അവ ഇല്ലാതാക്കുകയോ ആപ്പ് അൺഇൻസ്റ്റാൾ ചെയ്യുകയോ ചെയ്യുന്നതുവരെ നിങ്ങളുടെ ഉപകരണത്തിൽ തന്നെ തുടരും. വിഭാഗം 3-ലെ മൂന്നാം കക്ഷി സേവനങ്ങൾ കൈകാര്യം ചെയ്യുന്ന ഡാറ്റ അവരവരുടെ നയങ്ങൾക്കനുസരിച്ച് നിലനിർത്തുന്നു.","h7":"7. സുരക്ഷ","p_sec":"വിവരങ്ങൾ സംരക്ഷിക്കാൻ ഞങ്ങൾ ന്യായമായ സാങ്കേതികവും സംഘടനാപരവുമായ നടപടികൾ സ്വീകരിക്കുന്നു. എന്നിരുന്നാലും, ഒരു ആപ്പോ, കൈമാറ്റമോ, സംഭരണ സംവിധാനമോ പൂർണ്ണമായി സുരക്ഷിതമല്ല, കൂടാതെ സമ്പൂർണ്ണ സുരക്ഷ ഞങ്ങൾക്ക് ഉറപ്പുനൽകാൻ കഴിയില്ല.","h8":"8. കുട്ടികളുടെ സ്വകാര്യത","p_child":"ആപ്പ് 13 വയസ്സിന് താഴെയുള്ള (അല്ലെങ്കിൽ നിങ്ങളുടെ രാജ്യത്ത് ആവശ്യമായ കുറഞ്ഞ പ്രായത്തിന് താഴെയുള്ള) കുട്ടികളെ ലക്ഷ്യമിട്ടുള്ളതല്ല, കൂടാതെ അവരിൽ നിന്ന് ഞങ്ങൾ ബോധപൂർവ്വം വ്യക്തിഗത വിവരങ്ങൾ ശേഖരിക്കുന്നില്ല. ഒരു കുട്ടി ഞങ്ങൾക്ക് വിവരങ്ങൾ നൽകിയെന്ന് നിങ്ങൾ വിശ്വസിക്കുന്നുവെങ്കിൽ, ദയവായി ഞങ്ങളെ ബന്ധപ്പെടുക, ഞങ്ങൾ അത് ഇല്ലാതാക്കും.","h9":"9. നിങ്ങളുടെ അവകാശങ്ങൾ","p_rights":"നിങ്ങൾ താമസിക്കുന്ന സ്ഥലത്തെ ആശ്രയിച്ച് (ഉദാഹരണത്തിന്, GDPR പ്രകാരം EEA/UK, അല്ലെങ്കിൽ CCPA/CPRA പ്രകാരം California), നിങ്ങളുടെ വ്യക്തിഗത വിവരങ്ങൾ ആക്‌സസ് ചെയ്യാനും തിരുത്താനും ഇല്ലാതാക്കാനും അതിന്റെ ഉപയോഗം നിയന്ത്രിക്കാനും ചില പ്രോസസ്സിംഗിൽ നിന്ന് ഒഴിവാകാനും നിങ്ങൾക്ക് അവകാശങ്ങൾ ഉണ്ടായേക്കാം. നിങ്ങളുടെ ഉപകരണ ക്രമീകരണങ്ങളിൽ ആപ്പിന്റെ സ്ഥാനം, ക്യാമറ, സംഭരണം, അല്ലെങ്കിൽ അറിയിപ്പ് അനുമതികൾ റദ്ദാക്കുന്നതിലൂടെയും, നിങ്ങളുടെ പരസ്യ ID റീസെറ്റ് ചെയ്യുന്നതിലൂടെയോ അതിൽ നിന്ന് ഒഴിവാകുന്നതിലൂടെയോ എപ്പോൾ വേണമെങ്കിലും ഉപകരണ-തല നിയന്ത്രണങ്ങൾ പ്രയോഗിക്കാം. ഒരു സ്വകാര്യതാ അഭ്യർത്ഥന നടത്താൻ, താഴെയുള്ള വിശദാംശങ്ങൾ ഉപയോഗിച്ച് ഞങ്ങളെ ബന്ധപ്പെടുക.","h10":"10. അന്താരാഷ്ട്ര ഉപയോക്താക്കൾ","p_intl":"ആപ്പും അത് ഉപയോഗിക്കുന്ന മൂന്നാം കക്ഷി സേവനങ്ങളും നിങ്ങളുടേതല്ലാത്ത രാജ്യങ്ങളിൽ വിവരങ്ങൾ പ്രോസസ്സ് ചെയ്‌തേക്കാം, അവിടെ ഡാറ്റ-സംരക്ഷണ നിയമങ്ങൾ വ്യത്യസ്തമായിരിക്കാം. ആപ്പ് ഉപയോഗിക്കുന്നതിലൂടെ ഈ നയത്തിന് അനുസൃതമായ അത്തരം പ്രോസസ്സിംഗിന് നിങ്ങൾ സമ്മതിക്കുന്നു.","h11":"11. ഈ സ്വകാര്യതാ നയത്തിലെ മാറ്റങ്ങൾ","p_changes":"ഞങ്ങൾ ഈ സ്വകാര്യതാ നയം കാലാകാലങ്ങളിൽ അപ്‌ഡേറ്റ് ചെയ്‌തേക്കാം. ഏതെങ്കിലും മാറ്റങ്ങൾ പരിഷ്‌കരിച്ച പ്രാബല്യ തീയതിയോടെ ഈ പേജിൽ പോസ്റ്റ് ചെയ്യും, അതിനാൽ ദയവായി അത് ഇടയ്ക്കിടെ അവലോകനം ചെയ്യുക. മാറ്റങ്ങൾ പ്രാബല്യത്തിൽ വന്നതിന് ശേഷം ആപ്പിന്റെ തുടർച്ചയായ ഉപയോഗം അപ്‌ഡേറ്റ് ചെയ്ത നയം നിങ്ങൾ അംഗീകരിക്കുന്നു എന്നാണ് അർത്ഥമാക്കുന്നത്.","h12":"12. ഞങ്ങളെ ബന്ധപ്പെടുക","p_contact":"ഈ സ്വകാര്യതാ നയത്തെക്കുറിച്ചോ നിങ്ങളുടെ വിവരങ്ങളെക്കുറിച്ചോ ചോദ്യങ്ങളോ അഭ്യർത്ഥനകളോ ഫീഡ്‌ബാക്കോ ഉണ്ടെങ്കിൽ, ഇവിടെ ഞങ്ങളെ ബന്ധപ്പെടുക:","footer":"© 2026 GO PRACHI LABS. എല്ലാ അവകാശങ്ങളും നിക്ഷിപ്തം."},"ui":{"ui_language":"ഭാഷ","ui_note":"ഈ വിവർത്തനം നിങ്ങളുടെ സൗകര്യത്തിനായി നൽകുന്നതാണ്. എന്തെങ്കിലും പൊരുത്തക്കേട് ഉണ്ടായാൽ, ഇംഗ്ലീഷ് പതിപ്പാണ് നിയമപരമായി ആധികാരികം."}},"or":{"privacy":{"title":"ଗୋପନୀୟତା ନୀତି","eff":"ପ୍ରଭାବୀ ତାରିଖ: 9 July 2026","intro":"ଏହି ଗୋପନୀୟତା ନୀତି ବ୍ୟାଖ୍ୟା କରେ ଯେ GO PRACHI LABS (“ଆମେ”, “ଆମର”) ମୋବାଇଲ୍ ଆପ୍ଲିକେସନ୍ GPS Map Camera & Compass (ପ୍ୟାକେଜ୍ ନାମ compass.photo.camera.map.gps.gpsmapcamera_compass) (“ଆପ୍”) ସହିତ ସମ୍ପର୍କିତ ସୂଚନାକୁ କିପରି ପରିଚାଳନା କରେ। ଆପଣଙ୍କ ଗୋପନୀୟତା ଆମ ପାଇଁ ଗୁରୁତ୍ୱପୂର୍ଣ୍ଣ। ଦୟାକରି ଏହି ନୀତିକୁ ଯତ୍ନର ସହ ପଢ଼ନ୍ତୁ। ଆପ୍ ବ୍ୟବହାର କରି, ଆପଣ ଏଠାରେ ବର୍ଣ୍ଣିତ ଅଭ୍ୟାସଗୁଡ଼ିକ ସହିତ ସହମତ ହୁଅନ୍ତି।","note":"ସରଳ ଭାଷାରେ: ଆପ୍ ଆପଣଙ୍କ ଫଟୋଗୁଡ଼ିକ ଉପରେ ଆପଣଙ୍କ ଅବସ୍ଥାନ ଷ୍ଟାମ୍ପ କରେ, କମ୍ପାସ୍ ଓ ମାନଚିତ୍ର ଦେଖାଏ, ଏବଂ ସୂର୍ଯ୍ୟ/ଚନ୍ଦ୍ର ଓ ପାଣିପାଗ ବିବରଣୀ ପ୍ରଦର୍ଶନ କରେ। ଆପଣଙ୍କ ଫଟୋ ଓ ଅବସ୍ଥାନ ଆପଣଙ୍କ ଡିଭାଇସ୍‌ରେ ପ୍ରକ୍ରିୟାକରଣ ହୁଏ ଏବଂ ଆମର ନିଜସ୍ୱ ସର୍ଭରକୁ ଅପଲୋଡ୍ କରାଯାଏ ନାହିଁ। ତଳେ ବର୍ଣ୍ଣିତ ଅନୁସାରେ, ଆମେ ମାନଚିତ୍ର, ବିଜ୍ଞାପନ, ଆନାଲିଟିକ୍ସ, କ୍ରାସ୍ ରିପୋର୍ଟିଂ, ବିଜ୍ଞପ୍ତି ଏବଂ କ୍ରୟ ପାଇଁ ବିଶ୍ୱସନୀୟ Google ସେବା ବ୍ୟବହାର କରୁ।","h1":"1. ଆମେ ସଂଗ୍ରହ କରୁଥିବା ସୂଚନା ଏବଂ ଆମେ ଏହାକୁ କିପରି ବ୍ୟବହାର କରୁ","h_loc":"ଅବସ୍ଥାନ ସୂଚନା (ସଠିକ୍ ଏବଂ ଆନୁମାନିକ)","p_loc":"ଆପଣଙ୍କ ଅନୁମତି ସହିତ, ଆପ୍ ଏହାର ମୁଖ୍ୟ ବୈଶିଷ୍ଟ୍ୟ ପ୍ରଦାନ କରିବା ପାଇଁ ଆପଣଙ୍କ ଡିଭାଇସ୍‌ର GPS ଏବଂ ନେଟୱର୍କ-ଆଧାରିତ ଅବସ୍ଥାନକୁ ପ୍ରବେଶ କରେ: ଆପଣଙ୍କ ଫଟୋ ଓ ଭିଡିଓକୁ ଜିଓଟ୍ୟାଗ୍ କରିବା (ଛବି ଭିତରେ ସ୍ଥାନାଙ୍କ ଏବଂ ଠିକଣା ସନ୍ନିବେଶ କରିବା), ମାନଚିତ୍ରରେ ଆପଣଙ୍କ ସ୍ଥିତି ଦେଖାଇବା, କମ୍ପାସ୍ ଦିଗ, ଚୁମ୍ବକୀୟ ବିଚ୍ୟୁତି, ଏବଂ ଆପଣଙ୍କ ଅବସ୍ଥାନ ପାଇଁ ସୂର୍ଯ୍ୟ/ଚନ୍ଦ୍ର ଓ ପାଣିପାଗ ବିବରଣୀ ଗଣନା କରିବା। ଅବସ୍ଥାନ ଆପଣଙ୍କ ଡିଭାଇସ୍‌ରେ ପ୍ରକ୍ରିୟାକରଣ ହୋଇ ଆପଣ କ୍ୟାପଚର କରୁଥିବା ମିଡିଆ ଭିତରେ ସନ୍ନିବେଶିତ ହୁଏ। ଏହା ବିଭାଗ 3 ରେ ତାଲିକାଭୁକ୍ତ ତୃତୀୟ-ପକ୍ଷ ସେବାଗୁଡ଼ିକୁ ପଠାଯାଇପାରେ (ଉଦାହରଣ ସ୍ୱରୂପ, ମାନଚିତ୍ର ରେଣ୍ଡର୍ କରିବା କିମ୍ବା ପାଣିପାଗ ଅବସ୍ଥା ପ୍ରାପ୍ତ କରିବା ପାଇଁ)। ଆମେ ଆପଣଙ୍କ ଅବସ୍ଥାନ ଆମର ନିଜସ୍ୱ ସର୍ଭରରେ ସଂରକ୍ଷଣ କରୁ ନାହିଁ।","h_cam":"କ୍ୟାମେରା, ଫଟୋ, ଏବଂ ମିଡିଆ","p_cam":"ଆପଣଙ୍କ ଅନୁମତି ସହିତ, ଆପ୍ ଫଟୋ ଉଠାଇବା ଏବଂ ଭିଡିଓ ରେକର୍ଡ କରିବା ପାଇଁ ଆପଣଙ୍କ କ୍ୟାମେରା ବ୍ୟବହାର କରେ, ଏବଂ ଆପଣଙ୍କ କ୍ୟାପଚରଗୁଡ଼ିକୁ ଆପଣଙ୍କ ଗ୍ୟାଲେରୀରେ ସେଭ୍ କରି ଆପ୍-ଭିତର ଆଲବମ୍‌ରେ ଦେଖାଇବା ପାଇଁ ମିଡିଆ ପଢ଼େ/ଲେଖେ। ଆପଣ ଅଂଶୀଦାର କିମ୍ବା ରପ୍ତାନି କରିବାକୁ ମନୋନୀତ ନ କଲେ ଆପଣଙ୍କ ଫଟୋ ଓ ଭିଡିଓ ଆପଣଙ୍କ ଡିଭାଇସ୍‌ରେ ରହିଥାଏ। ଆମେ ଆପଣଙ୍କ ଫଟୋ କିମ୍ବା ଭିଡିଓ ଅପଲୋଡ୍ କିମ୍ବା ସଂରକ୍ଷଣ କରୁ ନାହିଁ।","h_dev":"ଡିଭାଇସ୍ ଏବଂ ବ୍ୟବହାର ସୂଚନା","p_dev":"ଆପ୍ କିପରି ବ୍ୟବହୃତ ହେଉଛି ତାହା ବୁଝିବା ଏବଂ କ୍ରାସ୍ ନିର୍ଣ୍ଣୟ କରିବା ପାଇଁ ଆମେ Google Analytics for Firebase ଏବଂ Firebase Crashlytics ବ୍ୟବହାର କରୁ। ଏଥିରେ ଆପ୍ ଇଭେଣ୍ଟ (ଯେପରି ଖୋଲାଯାଇଥିବା ବୈଶିଷ୍ଟ୍ୟ), ଡିଭାଇସ୍ ମଡେଲ୍, ଅପରେଟିଂ-ସିଷ୍ଟମ୍ ସଂସ୍କରଣ, ଆପ୍ ସଂସ୍କରଣ, ଭାଷା, ଏବଂ ସାଧାରଣ ଅଞ୍ଚଳ/ଦେଶ, ତଥା କ୍ରାସ୍ ନିର୍ଣ୍ଣୟ ଅନ୍ତର୍ଭୁକ୍ତ ହୋଇପାରେ। ଏହା ଆମକୁ ବଗ୍ ଠିକ୍ କରିବା ଏବଂ ଆପ୍‌କୁ ଉନ୍ନତ କରିବାରେ ସାହାଯ୍ୟ କରେ।","h_ad":"ବିଜ୍ଞାପନ ସୂଚନା","p_ad":"ଆପ୍‌ର ମାଗଣା ସଂସ୍କରଣ Google AdMob ମାଧ୍ୟମରେ ବିଜ୍ଞାପନ ଦେଖାଏ। ବିଜ୍ଞାପନ ପରିବେଷଣ ଓ ମାପିବା ପାଇଁ, ଅନୁମତି ଥିବା ସ୍ଥାନରେ ବ୍ୟକ୍ତିଗତକୃତ ବିଜ୍ଞାପନ ସମେତ, AdMob ଆପଣଙ୍କ ଡିଭାଇସ୍‌ର ବିଜ୍ଞାପନ ପରିଚୟକର୍ତ୍ତା ଏବଂ ସମ୍ପର୍କିତ ଡାଟାକୁ ପ୍ରବେଶ କରିପାରେ। ଆପଣଙ୍କ ବିଜ୍ଞାପନ ପସନ୍ଦ ପାଇଁ ବିଭାଗ 4 ଦେଖନ୍ତୁ।","h_notif":"ବିଜ୍ଞପ୍ତି","p_notif":"ଯଦି ଆପଣ ବିଜ୍ଞପ୍ତି ସକ୍ଷମ କରନ୍ତି, ଆପ୍ ଗୋଲଡେନ୍-ଆୱାର୍ ସତର୍କତା ପରି ବୈକଳ୍ପିକ ସ୍ମାରକ ପ୍ରଦାନ କରିବା ପାଇଁ Firebase Cloud Messaging (ଯାହା ଏକ ଡିଭାଇସ୍ ପୁସ୍ ଟୋକେନ୍ ସୃଷ୍ଟି କରେ) ବ୍ୟବହାର କରେ। ଆପଣ ଯେକୌଣସି ସମୟରେ ଆପଣଙ୍କ ଡିଭାଇସ୍ ସେଟିଂସ୍‌ରେ ବିଜ୍ଞପ୍ତି ବନ୍ଦ କରିପାରିବେ।","h_purch":"କ୍ରୟ","p_purch":"ଯଦି ଆପଣ ବୈକଳ୍ପିକ ଏକ-ଥର “Remove Ads / Pro” ଅପଗ୍ରେଡ୍ କିଣନ୍ତି, ଲେଣଦେଣ Google Play Billing ଦ୍ୱାରା ପ୍ରକ୍ରିୟାକରଣ ହୁଏ। ଏକ କ୍ରୟ ହୋଇଛି ବୋଲି ଆମେ ନିଶ୍ଚିତତା ପାଉ ଯାହା ଦ୍ୱାରା ଆମେ Pro ବୈଶିଷ୍ଟ୍ୟ ଅନଲକ୍ କରି ଆପଣଙ୍କ ପାଇଁ ପୁନଃସ୍ଥାପନ କରିପାରୁ। ଆମେ କେବେହେଲେ ଆପଣଙ୍କ ପେମେଣ୍ଟ କାର୍ଡ କିମ୍ବା ବିଲିଂ ବିବରଣୀ ଦେଖୁ ନାହିଁ କିମ୍ବା ସଂରକ୍ଷଣ କରୁ ନାହିଁ — ସେଗୁଡ଼ିକ ସମ୍ପୂର୍ଣ୍ଣ ଭାବରେ Google ଦ୍ୱାରା ପରିଚାଳିତ।","h_provide":"ଆପଣ ପ୍ରଦାନ କରିବାକୁ ମନୋନୀତ କରୁଥିବା ସୂଚନା","p_provide":"ଯଦି ଆପଣ ଆମକୁ (ସହାୟତା କିମ୍ବା ମତାମତ ପାଇଁ) ଇମେଲ୍ କରନ୍ତି, ଆପଣ ପଠାଉଥିବା ଇମେଲ୍ ଠିକଣା ଏବଂ ବାର୍ତ୍ତା ବିଷୟବସ୍ତୁ ଆମେ ପାଉ, ଏବଂ ଏହାକୁ କେବଳ ଆପଣଙ୍କୁ ଉତ୍ତର ଦେବା ପାଇଁ ବ୍ୟବହାର କରୁ।","h2":"2. ସେନ୍ସର୍","p_sensors":"ଆପ୍ କମ୍ପାସ୍, ଲେଭେଲ୍, ଏବଂ ଟିଲ୍ଟ ବୈଶିଷ୍ଟ୍ୟକୁ ଚଳାଇବା ପାଇଁ ଡିଭାଇସ୍ ମୋସନ୍ ସେନ୍ସର୍ (ଆକ୍ସେଲେରୋମିଟର ଏବଂ ମ୍ୟାଗ୍ନେଟୋମିଟର) ପଢ଼େ। ଏହି ସେନ୍ସର୍ ଡାଟା ଆପଣଙ୍କ ଡିଭାଇସ୍‌ରେ ରିଅଲ୍-ଟାଇମ୍‌ରେ ବ୍ୟବହୃତ ହୁଏ ଏବଂ ଏହା ଆପଣଙ୍କ ବିଷୟରେ ବ୍ୟକ୍ତିଗତ ସୂଚନା ନୁ ିବୁ।","h9":"9. ଆପଣଙ୍କ ଅଧିକାର","p_rights":"ଆପଣ କେଉଁଠାରେ ରୁହନ୍ତି ତାହା ଉପରେ ନିର୍ଭର କରି (ଉଦାହରଣ ସ୍ୱରୂପ, GDPR ଅଧୀନରେ EEA/UK, କିମ୍ବା CCPA/CPRA ଅଧୀନରେ California), ଆପଣଙ୍କ ବ୍ୟକ୍ତିଗତ ସୂଚନାକୁ ପ୍ରବେଶ, ସଂଶୋଧନ, ଡିଲିଟ୍ କିମ୍ବା ଏହାର ବ୍ୟବହାର ସୀମିତ କରିବା, ଏବଂ କିଛି ପ୍ରକ୍ରିୟାକରଣରୁ ବାହାରିବା ପାଇଁ ଆପଣଙ୍କ ଅଧିକାର ଥାଇପାରେ। ଆପଣ ଆପଣଙ୍କ ଡିଭାଇସ୍ ସେଟିଂସ୍‌ରେ ଆପ୍‌ର ଅବସ୍ଥାନ, କ୍ୟାମେରା, ସଂରକ୍ଷଣ କିମ୍ବା ବିଜ୍ଞପ୍ତି ଅନୁମତିକୁ ପ୍ରତ୍ୟାହାର କରି, ଏବଂ ଆପଣଙ୍କ ବିଜ୍ଞାପନ ID କୁ ରିସେଟ୍ କିମ୍ବା ଏଥିରୁ ବାହାରି ଯେକୌଣସି ସମୟରେ ଡିଭାଇସ୍-ସ୍ତରୀୟ ନିୟନ୍ତ୍ରଣ କାର୍ଯ୍ୟକାରୀ କରିପାରିବେ। ଏକ ଗୋପନୀୟତା ଅନୁରୋଧ କରିବା ପାଇଁ, ତଳେ ଥିବା ବିବରଣୀ ବ୍ୟବହାର କରି ଆମ ସହିତ ଯୋଗାଯୋଗ କରନ୍ତୁ।","h10":"10. ଆନ୍ତର୍ଜାତୀୟ ବ୍ୟବହାରକାରୀ","p_intl":"ଆପ୍ ଏବଂ ଏହା ବ୍ୟବହାର କରୁଥିବା ତୃତୀୟ-ପକ୍ଷ ସେବା ଆପଣଙ୍କ ନିଜ ଦେଶ ବ୍ୟତୀତ ଅନ୍ୟ ଦେଶରେ ସୂଚନା ପ୍ରକ୍ରିୟାକରଣ କରିପାରନ୍ତି, ଯେଉଁଠାରେ ଡାଟା-ସୁରକ୍ଷା ଆଇନ ଭିନ୍ନ ହୋଇପାରେ। ଆପ୍ ବ୍ୟବହାର କରି ଆପଣ ଏହି ନୀତି ସହିତ ସଙ୍ଗତ ଏହିପରି ପ୍ରକ୍ରିୟାକରଣ ପାଇଁ ସମ୍ମତି ଦିଅନ୍ତି।","h11":"11. ଏହି ଗୋପନୀୟତା ନୀତିରେ ପରିବର୍ତ୍ତନ","p_changes":"ଆମେ ସମୟ ସମୟରେ ଏହି ଗୋପନୀୟତା ନୀତି ଅଦ୍ୟତନ କରିପାରୁ। କୌଣସି ପରିବର୍ତ୍ତନ ଏକ ସଂଶୋଧିତ ପ୍ରଭାବୀ ତାରିଖ ସହିତ ଏହି ପୃଷ୍ଠାରେ ପୋଷ୍ଟ କରାଯିବ, ତେଣୁ ଦୟାକରି ଏହାକୁ ମଝିରେ ମଝିରେ ସମୀକ୍ଷା କରନ୍ତୁ। ପରିବର୍ତ୍ତନ ପ୍ରଭାବୀ ହେବା ପରେ ଆପ୍‌ର ନିରନ୍ତର ବ୍ୟବହାରର ଅର୍ଥ ଆପଣ ଅଦ୍ୟତନ ନୀତି ଗ୍ରହଣ କରୁଛନ୍ତି।","h12":"12. ଆମ ସହିତ ଯୋଗାଯୋଗ କରନ୍ତୁ","p_contact":"ଏହି ଗୋପନୀୟତା ନୀତି କିମ୍ବା ଆପଣଙ୍କ ସୂଚନା ବିଷୟରେ ଯଦି ଆପଣଙ୍କର ପ୍ରଶ୍ନ, ଅନୁରୋଧ କିମ୍ବା ମତାମତ ଅଛି, ଆମ ସହିତ ଏଠାରେ ଯୋଗାଯୋଗ କରନ୍ତୁ:","footer":"© 2026 GO PRACHI LABS. ସମସ୍ତ ଅଧିକାର ସଂରକ୍ଷିତ।"},"ui":{"ui_language":"ଭାଷା","ui_note":"ଏହି ଅନୁବାଦ ଆପଣଙ୍କ ସୁବିଧା ପାଇଁ ପ୍ରଦାନ କରାଯାଇଛି। କୌଣସି ଅସଙ୍ଗତି କ୍ଷେତ୍ରରେ, ଇଂରାଜୀ ସଂସ୍କରଣ ଆଇନଗତ ଭାବରେ ଅଧିକୃତ।"}},"pa":{"privacy":{"title":"ਪਰਾਈਵੇਸੀ ਨੀਤੀ","eff":"ਲਾਗੂ ਹੋਣ ਦੀ ਮਿਤੀ: 9 July 2026","intro":"ਇਹ ਪਰਾਈਵੇਸੀ ਨੀਤੀ ਦੱਸਦੀ ਹੈ ਕਿ GO PRACHI LABS (“ਅਸੀਂ”, “ਸਾਡਾ”) ਮੋਬਾਈਲ ਐਪਲੀਕੇਸ਼ਨ GPS Map Camera & Compass (ਪੈਕੇਜ ਨਾਮ compass.photo.camera.map.gps.gpsmapcamera_compass) (“ਐਪ”) ਨਾਲ ਸਬੰਧਤ ਜਾਣਕਾਰੀ ਨੂੰ ਕਿਵੇਂ ਸੰਭਾਲਦੇ ਹਾਂ। ਤੁਹਾਡੀ ਪਰਾਈਵੇਸੀ ਸਾਡੇ ਲਈ ਮਹੱਤਵਪੂਰਨ ਹੈ। ਕਿਰਪਾ ਕਰਕੇ ਇਸ ਨੀਤੀ ਨੂੰ ਧਿਆਨ ਨਾਲ ਪੜ੍ਹੋ। ਐਪ ਵਰਤ ਕੇ, ਤੁਸੀਂ ਇੱਥੇ ਵਰਣਿਤ ਅਭਿਆਸਾਂ ਨਾਲ ਸਹਿਮਤ ਹੁੰਦੇ ਹੋ।","note":"ਸਧਾਰਨ ਸ਼ਬਦਾਂ ਵਿੱਚ: ਐਪ ਤੁਹਾਡੀਆਂ ਫੋਟੋਆਂ ਉੱਤੇ ਤੁਹਾਡਾ ਟਿਕਾਣਾ ਛਾਪਦੀ ਹੈ, ਕੰਪਾਸ ਅਤੇ ਨਕਸ਼ੇ ਦਿਖਾਉਂਦੀ ਹੈ, ਅਤੇ ਸੂਰਜ/ਚੰਦ ਤੇ ਮੌਸਮ ਦੇ ਵੇਰਵੇ ਪ੍ਰਦਰਸ਼ਿਤ ਕਰਦੀ ਹੈ। ਤੁਹਾਡੀਆਂ ਫੋਟੋਆਂ ਅਤੇ ਟਿਕਾਣਾ ਤੁਹਾਡੇ ਡਿਵਾਈਸ ਉੱਤੇ ਹੀ ਪ੍ਰੋਸੈੱਸ ਕੀਤੇ ਜਾਂਦੇ ਹਨ ਅਤੇ ਸਾਡੇ ਆਪਣੇ ਸਰਵਰਾਂ ਉੱਤੇ ਅੱਪਲੋਡ ਨਹੀਂ ਕੀਤੇ ਜਾਂਦੇ। ਹੇਠਾਂ ਦੱਸੇ ਅਨੁਸਾਰ, ਅਸੀਂ ਨਕਸ਼ੇ, ਇਸ਼ਤਿਹਾਰ, ਵਿਸ਼ਲੇਸ਼ਣ, ਕ੍ਰੈਸ਼ ਰਿਪੋਰਟਿੰਗ, ਸੂਚਨਾਵਾਂ ਅਤੇ ਖਰੀਦਾਂ ਲਈ ਭਰੋਸੇਯੋਗ Google ਸੇਵਾਵਾਂ ਵਰਤਦੇ ਹਾਂ।","h1":"1. ਅਸੀਂ ਜੋ ਜਾਣਕਾਰੀ ਇਕੱਠੀ ਕਰਦੇ ਹਾਂ ਅਤੇ ਇਸ ਨੂੰ ਕਿਵੇਂ ਵਰਤਦੇ ਹਾਂ","h_loc":"ਟਿਕਾਣਾ ਜਾਣਕਾਰੀ (ਸਟੀਕ ਅਤੇ ਅਨੁਮਾਨਿਤ)","p_loc":"ਤੁਹਾਡੀ ਇਜਾਜ਼ਤ ਨਾਲ, ਐਪ ਆਪਣੀਆਂ ਮੁੱਖ ਵਿਸ਼ੇਸ਼ਤਾਵਾਂ ਪ੍ਰਦਾਨ ਕਰਨ ਲਈ ਤੁਹਾਡੇ ਡਿਵਾਈਸ ਦੇ GPS ਅਤੇ ਨੈੱਟਵਰਕ-ਅਧਾਰਿਤ ਟਿਕਾਣੇ ਤੱਕ ਪਹੁੰਚ ਕਰਦੀ ਹੈ: ਤੁਹਾਡੀਆਂ ਫੋਟੋਆਂ ਅਤੇ ਵੀਡੀਓ ਨੂੰ ਜੀਓਟੈਗ ਕਰਨਾ (ਤਸਵੀਰ ਵਿੱਚ ਧੁਰੇ ਅਤੇ ਪਤਾ ਸ਼ਾਮਲ ਕਰਨਾ), ਨਕਸ਼ੇ ਉੱਤੇ ਤੁਹਾਡੀ ਸਥਿਤੀ ਦਿਖਾਉਣਾ, ਕੰਪਾਸ ਦਿਸ਼ਾ, ਚੁੰਬਕੀ ਵਿਚਲਨ, ਅਤੇ ਤੁਹਾਡੇ ਟਿਕਾਣੇ ਲਈ ਸੂਰਜ/ਚੰਦ ਤੇ ਮੌਸਮ ਦੇ ਵੇਰਵੇ ਗਿਣਨਾ। ਟਿਕਾਣਾ ਤੁਹਾਡੇ ਡਿਵਾਈਸ ਉੱਤੇ ਪ੍ਰੋਸੈੱਸ ਹੋ ਕੇ ਤੁਹਾਡੇ ਦੁਆਰਾ ਕੈਪਚਰ ਕੀਤੇ ਮੀਡੀਆ ਵਿੱਚ ਸ਼ਾਮਲ ਕੀਤਾ ਜਾਂਦਾ ਹੈ। ਇਸ ਨੂੰ ਸੈਕਸ਼ਨ 3 ਵਿੱਚ ਸੂਚੀਬੱਧ ਤੀਜੀ-ਧਿਰ ਸੇਵਾਵਾਂ ਨੂੰ ਭੇਜਿਆ ਜਾ ਸਕਦਾ ਹੈ (ਉਦਾਹਰਨ ਲਈ, ਨਕਸ਼ੇ ਰੈਂਡਰ ਕਰਨ ਜਾਂ ਮੌਸਮ ਦੀਆਂ ਹਾਲਤਾਂ ਪ੍ਰਾਪਤ ਕਰਨ ਲਈ)। ਅਸੀਂ ਤੁਹਾਡਾ ਟਿਕਾਣਾ ਆਪਣੇ ਸਰਵਰਾਂ ਉੱਤੇ ਸਟੋਰ ਨਹੀਂ ਕਰਦੇ।","h_cam":"ਕੈਮਰਾ, ਫੋਟੋਆਂ, ਅਤੇ ਮੀਡੀਆ","p_cam":"ਤੁਹਾਡੀ ਇਜਾਜ਼ਤ ਨਾਲ, ਐਪ ਫੋਟੋਆਂ ਲੈਣ ਅਤੇ ਵੀਡੀਓ ਰਿਕਾਰਡ ਕਰਨ ਲਈ ਤੁਹਾਡੇ ਕੈਮਰੇ ਦੀ ਵਰਤੋਂ ਕਰਦੀ ਹੈ, ਅਤੇ ਤੁਹਾਡੇ ਕੈਪਚਰਾਂ ਨੂੰ ਤੁਹਾਡੀ ਗੈਲਰੀ ਵਿੱਚ ਸੇਵ ਕਰਨ ਅਤੇ ਐਪ-ਅੰਦਰਲੇ ਐਲਬਮ ਵਿੱਚ ਦਿਖਾਉਣ ਲਈ ਮੀਡੀਆ ਪੜ੍ਹਦੀ/ਲਿਖਦੀ ਹੈ। ਜਦੋਂ ਤੱਕ ਤੁਸੀਂ ਸਾਂਝਾ ਕਰਨ ਜਾਂ ਐਕਸਪੋਰਟ ਕਰਨ ਦੀ ਚੋਣ ਨਹੀਂ ਕਰਦੇ, ਤੁਹਾਡੀਆਂ ਫੋਟੋਆਂ ਅਤੇ ਵੀਡੀਓ ਤੁਹਾਡੇ ਡਿਵਾਈਸ ਉੱਤੇ ਹੀ ਰਹਿੰਦੇ ਹਨ। ਅਸੀਂ ਤੁਹਾਡੀਆਂ ਫੋਟੋਆਂ ਜਾਂ ਵੀਡੀਓ ਨੂੰ ਅੱਪਲੋਡ ਜਾਂ ਸੰਭਾਲ ਕੇ ਨਹੀਂ ਰੱਖਦੇ।","h_dev":"ਡਿਵਾਈਸ ਅਤੇ ਵਰਤੋਂ ਜਾਣਕਾਰੀ","p_dev":"ਐਪ ਕਿਵੇਂ ਵਰਤੀ ਜਾਂਦੀ ਹੈ ਇਹ ਸਮਝਣ ਅਤੇ ਕ੍ਰੈਸ਼ਾਂ ਦਾ ਨਿਦਾਨ ਕਰਨ ਲਈ ਅਸੀਂ Google Analytics for Firebase ਅਤੇ Firebase Crashlytics ਵਰਤਦੇ ਹਾਂ। ਇਸ ਵਿੱਚ ਐਪ ਘਟਨਾਵਾਂ (ਜਿਵੇਂ ਖੋਲ੍ਹੀਆਂ ਗਈਆਂ ਵਿਸ਼ੇਸ਼ਤਾਵਾਂ), ਡਿਵਾਈਸ ਮਾਡਲ, ਓਪਰੇਟਿੰਗ-ਸਿਸਟਮ ਵਰਜਨ, ਐਪ ਵਰਜਨ, ਭਾਸ਼ਾ, ਅਤੇ ਆਮ ਖੇਤਰ/ਦੇਸ਼, ਅਤੇ ਕ੍ਰੈਸ਼ ਨਿਦਾਨ ਸ਼ਾਮਲ ਹੋ ਸਕਦੇ ਹਨ। ਇਹ ਸਾਨੂੰ ਬੱਗ ਠੀਕ ਕਰਨ ਅਤੇ ਐਪ ਨੂੰ ਬਿਹਤਰ ਬਣਾਉਣ ਵਿੱਚ ਮਦਦ ਕਰਦਾ ਹੈ।","h_ad":"ਇਸ਼ਤਿਹਾਰ ਜਾਣਕਾਰੀ","p_ad":"ਐਪ ਦਾ ਮੁਫ਼ਤ ਵਰ roid: Settings → Google → Ads → ਆਪਣੀ ਇਸ਼ਤਿਹਾਰ ID ਤੋਂ ਬਾਹਰ ਹੋਵੋ / ਰੀਸੈੱਟ ਕਰੋ।","li_remove":"ਇਸ਼ਤਿਹਾਰ ਪੂਰੀ ਤਰ੍ਹਾਂ ਹਟਾਉਣਾ: ਐਪ ਵਿੱਚ ਇੱਕ-ਵਾਰੀ Pro ਅੱਪਗ੍ਰੇਡ ਖਰੀਦੋ।","h5":"5. ਅਸੀਂ ਜਾਣਕਾਰੀ ਕਿਵੇਂ ਸਾਂਝੀ ਕਰਦੇ ਹਾਂ","p_share":"ਅਸੀਂ ਤੁਹਾਡੀ ਵਿਅਕਤੀਗਤ ਜਾਣਕਾਰੀ ਨਹੀਂ ਵੇਚਦੇ। ਜਾਣਕਾਰੀ ਸਿਰਫ਼ ਸੈਕਸ਼ਨ 3 ਵਿੱਚ ਸੂਚੀਬੱਧ ਸੇਵਾ ਪ੍ਰਦਾਤਿਆਂ ਨਾਲ ਸਾਂਝੀ ਕੀਤੀ ਜਾਂਦੀ ਹੈ ਤਾਂ ਜੋ ਉਹ ਆਪਣੇ ਕਾਰਜ ਕਰ ਸਕਣ (ਉਦਾਹਰਨ ਲਈ, ਨਕਸ਼ੇ ਜਾਂ ਇਸ਼ਤਿਹਾਰ ਦਿਖਾਉਣਾ), ਅਤੇ ਜਿੱਥੇ ਕਾਨੂੰਨ, ਕਾਨੂੰਨੀ ਪ੍ਰਕਿਰਿਆ ਦੁਆਰਾ ਲੋੜੀਂਦਾ ਹੋਵੇ, ਜਾਂ ਸਾਡੇ ਵਰਤੋਂਕਾਰਾਂ, ਜਨਤਾ, ਜਾਂ ਸਾਡੇ ਅਧਿਕਾਰਾਂ, ਸੁਰੱਖਿਆ, ਜਾਂ ਜਾਇਦਾਦ ਦੀ ਰੱਖਿਆ ਲਈ।","h6":"6. ਡਾਟਾ ਧਾਰਨ","p_ret":"ਐਪ ਦੁਆਰਾ ਬਣਾਈਆਂ ਫੋਟੋਆਂ, ਵੀਡੀਓ, ਅਤੇ ਐਪ ਸੈਟਿੰਗਜ਼ ਤੁਹਾਡੇ ਡਿਵਾਈਸ ਉੱਤੇ ਉਦੋਂ ਤੱਕ ਰਹਿੰਦੀਆਂ ਹਨ ਜਦੋਂ ਤੱਕ ਤੁਸੀਂ ਉਨ੍ਹਾਂ ਨੂੰ ਮਿਟਾ ਨਹੀਂ ਦਿੰਦੇ ਜਾਂ ਐਪ ਅਨਇੰਸਟਾਲ ਨਹੀਂ ਕਰਦੇ। ਸੈਕਸ਼ਨ 3 ਦੀਆਂ ਤੀਜੀ-ਧਿਰ ਸੇਵਾਵਾਂ ਦੁਆਰਾ ਸੰਭਾਲਿਆ ਗਿਆ ਡਾਟਾ ਉਨ੍ਹਾਂ ਦੀਆਂ ਆਪਣੀਆਂ ਨੀਤੀਆਂ ਅਨੁਸਾਰ ਰੱਖਿਆ ਜਾਂਦਾ ਹੈ।","h7":"7. ਸੁਰੱਖਿਆ","p_sec":"ਅਸੀਂ ਜਾਣਕਾਰੀ ਦੀ ਰੱਖਿਆ ਲਈ ਵਾਜਬ ਤਕਨੀਕੀ ਅਤੇ ਸੰਗਠਨਾਤਮਕ ਉਪਾਅ ਕਰਦੇ ਹਾਂ। ਹਾਲਾਂਕਿ, ਕੋਈ ਵੀ ਐਪ, ਪ੍ਰਸਾਰਣ, ਜਾਂ ਸਟੋਰੇਜ ਪ੍ਰਣਾਲੀ ਪੂਰੀ ਤਰ੍ਹਾਂ ਸੁਰੱਖਿਅਤ ਨਹੀਂ ਹੈ, ਅਤੇ ਅਸੀਂ ਸੰਪੂਰਨ ਸੁਰੱਖਿਆ ਦੀ ਗਾਰੰਟੀ ਨਹੀਂ ਦੇ ਸਕਦੇ।","h8":"8. ਬੱਚਿਆਂ ਦੀ ਪਰਾਈਵੇਸੀ","p_child":"ਐਪ 13 ਸਾਲ ਤੋਂ ਘੱਟ (ਜਾਂ ਤੁਹਾਡੇ ਦੇਸ਼ ਵਿੱਚ ਲੋੜੀਂਦੀ ਘੱਟੋ-ਘੱਟ ਉਮਰ ਤੋਂ ਘੱਟ) ਦੇ ਬੱਚਿਆਂ ਲਈ ਨਹੀਂ ਹੈ, ਅਤੇ ਅਸੀਂ ਜਾਣ-ਬੁੱਝ ਕੇ ਉਨ੍ਹਾਂ ਤੋਂ ਵਿਅਕਤੀਗਤ ਜਾਣਕਾਰੀ ਇਕੱਠੀ ਨਹੀਂ ਕਰਦੇ। ਜੇ ਤੁਹਾਨੂੰ ਲੱਗਦਾ ਹੈ ਕਿ ਕਿਸੇ ਬੱਚੇ ਨੇ ਸਾਨੂੰ ਜਾਣਕਾਰੀ ਦਿੱਤੀ ਹੈ, ਤਾਂ ਕਿਰਪਾ ਕਰਕੇ ਸਾਡੇ ਨਾਲ ਸੰਪਰਕ ਕਰੋ ਅਤੇ ਅਸੀਂ ਇਸ ਨੂੰ ਮਿਟਾ ਦੇਵਾਂਗੇ।","h9":"9. ਤੁਹਾਡੇ ਅਧਿਕਾਰ","p_rights":"ਤੁਸੀਂ ਕਿੱਥੇ ਰਹਿੰਦੇ ਹੋ ਇਸ ਦੇ ਆਧਾਰ ਉੱਤੇ (ਉਦਾਹਰਨ ਲਈ, GDPR ਅਧੀਨ EEA/UK, ਜਾਂ CCPA/CPRA ਅਧੀਨ California), ਤੁਹਾਨੂੰ ਆਪਣੀ ਵਿਅਕਤੀਗਤ ਜਾਣਕਾਰੀ ਤੱਕ ਪਹੁੰਚ ਕਰਨ, ਠੀਕ ਕਰਨ, ਮਿਟਾਉਣ, ਜਾਂ ਇਸ ਦੀ ਵਰਤੋਂ ਸੀਮਤ ਕਰਨ, ਅਤੇ ਕੁਝ ਪ੍ਰੋਸੈੱਸਿੰਗ ਤੋਂ ਬਾਹਰ ਹੋਣ ਦੇ ਅਧਿਕਾਰ ਹੋ ਸਕਦੇ ਹਨ। ਤੁਸੀਂ ਆਪਣੀ ਡਿਵਾਈਸ ਸੈਟਿੰਗਜ਼ ਵਿੱਚ ਐਪ ਦੇ ਟਿਕਾਣਾ, ਕੈਮਰਾ, ਸਟੋਰੇਜ, ਜਾਂ ਸੂਚਨਾ ਇਜਾਜ਼ਤਾਂ ਨੂੰ ਰੱਦ ਕਰਕੇ, ਅਤੇ ਆਪਣੀ ਇਸ਼ਤਿਹਾਰ ID ਨੂੰ ਰੀਸੈੱਟ ਜਾਂ ਇਸ ਤੋਂ ਬਾਹਰ ਹੋ ਕੇ ਕਿਸੇ ਵੀ ਸਮੇਂ ਡਿਵਾਈਸ-ਪੱਧਰੀ ਕੰਟਰੋਲ ਲਾਗੂ ਕਰ ਸਕਦੇ ਹੋ। ਪਰਾਈਵੇਸੀ ਬੇਨਤੀ ਕਰਨ ਲਈ, ਹੇਠਾਂ ਦਿੱਤੇ ਵੇਰਵੇ ਵਰਤ ਕੇ ਸਾਡੇ ਨਾਲ ਸੰਪਰਕ ਕਰੋ।","h10":"10. ਅੰਤਰਰਾਸ਼ਟਰੀ ਵਰਤੋਂਕਾਰ","p_intl":"ਐਪ ਅਤੇ ਇਸ ਦੁਆਰਾ ਵਰਤੀਆਂ ਜਾਂਦੀਆਂ ਤੀਜੀ-ਧਿਰ ਸੇਵਾਵਾਂ ਤੁਹਾਡੇ ਆਪਣੇ ਤੋਂ ਇਲਾਵਾ ਹੋਰ ਦੇਸ਼ਾਂ ਵਿੱਚ ਜਾਣਕਾਰੀ ਪ੍ਰੋਸੈੱਸ ਕਰ ਸਕਦੀਆਂ ਹਨ, ਜਿੱਥੇ ਡਾਟਾ-ਸੁਰੱਖਿਆ ਕਾਨੂੰਨ ਵੱਖਰੇ ਹੋ ਸਕਦੇ ਹਨ। ਐਪ ਵਰਤ ਕੇ ਤੁਸੀਂ ਇਸ ਨੀਤੀ ਦੇ ਅਨੁਕੂਲ ਅਜਿਹੀ ਪ੍ਰੋਸੈੱਸਿੰਗ ਲਈ ਸਹਿਮਤੀ ਦਿੰਦੇ ਹੋ।","h11":"11. ਇਸ ਪਰਾਈਵੇਸੀ ਨੀਤੀ ਵਿੱਚ ਤਬਦੀਲੀਆਂ","p_changes":"ਅਸੀਂ ਸਮੇਂ-ਸਮੇਂ ਉੱਤੇ ਇਸ ਪਰਾਈਵੇਸੀ ਨੀਤੀ ਨੂੰ ਅੱਪਡੇਟ ਕਰ ਸਕਦੇ ਹਾਂ। ਕੋਈ ਵੀ ਤਬਦੀਲੀ ਇੱਕ ਸੋਧੀ ਹੋਈ ਲਾਗੂ ਹੋਣ ਦੀ ਮਿਤੀ ਨਾਲ ਇਸ ਪੰਨੇ ਉੱਤੇ ਪੋਸਟ ਕੀਤੀ ਜਾਵੇਗੀ, ਇਸ ਲਈ ਕਿਰਪਾ ਕਰਕੇ ਇਸ ਨੂੰ ਸਮੇਂ-ਸਮੇਂ ਉੱਤੇ ਸਮੀਖਿਆ ਕਰੋ। ਤਬਦੀਲੀਆਂ ਲਾਗੂ ਹੋਣ ਤੋਂ ਬਾਅਦ ਐਪ ਦੀ ਲਗਾਤਾਰ ਵਰਤੋਂ ਦਾ ਮਤਲਬ ਹੈ ਕਿ ਤੁਸੀਂ ਅੱਪਡੇਟ ਕੀਤੀ ਨੀਤੀ ਨੂੰ ਸਵੀਕਾਰ ਕਰਦੇ ਹੋ।","h12":"12. ਸਾਡੇ ਨਾਲ ਸੰਪਰਕ ਕਰੋ","p_contact":"ਜੇ ਤੁਹਾਡੇ ਕੋਲ ਇਸ ਪਰਾਈਵੇਸੀ ਨੀਤੀ ਜਾਂ ਤੁਹਾਡੀ ਜਾਣਕਾਰੀ ਬਾਰੇ ਸਵਾਲ, ਬੇਨਤੀਆਂ, ਜਾਂ ਫੀਡਬੈਕ ਹੈ, ਤਾਂ ਸਾਡੇ ਨਾਲ ਇੱਥੇ ਸੰਪਰਕ ਕਰੋ:","footer":"© 2026 GO PRACHI LABS. ਸਾਰੇ ਹੱਕ ਰਾਖਵੇਂ ਹਨ।"},"ui":{"ui_language":"ਭਾਸ਼ਾ","ui_note":"ਇਹ ਅਨੁਵਾਦ ਤੁਹਾਡੀ ਸਹੂਲਤ ਲਈ ਪ੍ਰਦਾਨ ਕੀਤਾ ਗਿਆ ਹੈ। ਕਿਸੇ ਵੀ ਅੰਤਰ ਦੀ ਸੂਰਤ ਵਿੱਚ, ਅੰਗਰੇਜ਼ੀ ਵਰਜਨ ਕਾਨੂੰਨੀ ਤੌਰ ਉੱਤੇ ਅਧਿਕਾਰਤ ਹੈ।"}},"as":{"privacy":{"title":"গোপনীয়তা নীতি","eff":"কাৰ্যকৰী তাৰিখ: 9 July 2026","intro":"এই গোপনীয়তা নীতিয়ে ব্যাখ্যা কৰে যে GO PRACHI LABS (“আমি”, “আমাৰ”) মোবাইল এপ্লিকেচন GPS Map Camera & Compass (পেকেজ নাম compass.photo.camera.map.gps.gpsmapcamera_compass) (“এপ”)ৰ সৈতে সম্পৰ্কিত তথ্য কেনেকৈ পৰিচালনা কৰে। আপোনাৰ গোপনীয়তা আমাৰ বাবে গুৰুত্বপূৰ্ণ। অনুগ্ৰহ কৰি এই নীতিটো মনোযোগেৰে পঢ়ক। এপ ব্যৱহাৰ কৰি, আপুনি ইয়াত বৰ্ণিত পদ্ধতিসমূহৰ সৈতে সন্মত হয়।","note":"সহজ ভাষাত: এপে আপোনাৰ ফটোবোৰত আপোনাৰ অৱস্থান ছাপ মাৰে, কম্পাছ আৰু মানচিত্ৰ দেখুৱায়, আৰু সূৰ্য/চন্দ্ৰ আৰু বতৰৰ বিৱৰণ প্ৰদৰ্শন কৰে। আপোনাৰ ফটো আৰু অৱস্থান আপোনাৰ ডিভাইচতেই প্ৰক্ৰিয়াকৰণ কৰা হয় আৰু আমাৰ নিজৰ ছাৰ্ভাৰত আপলোড কৰা নহয়। তলত বৰ্ণনা কৰা অনুসৰি, আমি মানচিত্ৰ, বিজ্ঞাপন, বিশ্লেষণ, ক্ৰেশ ৰিপৰ্টিং, জাননী আৰু ক্ৰয়ৰ বাবে বিশ্বাসযোগ্য Google সেৱা ব্যৱহাৰ কৰোঁ।","h1":"1. আমি সংগ্ৰহ কৰা তথ্য আৰু আমি ইয়াক কেনেকৈ ব্যৱহাৰ কৰোঁ","h_loc":"অৱস্থান তথ্য (সঠিক আৰু আনুমানিক)","p_loc":"আপোনাৰ অনুমতিৰে, এপে ইয়াৰ মুখ্য বৈশিষ্ট্যসমূহ প্ৰদান কৰিবলৈ আপোনাৰ ডিভাইচৰ GPS আৰু নেটৱৰ্ক-আধাৰিত অৱস্থান এক্সেছ কৰে: আপোনাৰ ফটো আৰু ভিডিঅ' জিঅ'টেগ েত্ৰত, ইংৰাজী সংস্কৰণটোৱেই আইনীভাৱে আধিকাৰিক।"}},"ne":{"privacy":{"title":"गोपनीयता नीति","eff":"प्रभावकारी मिति: 9 July 2026","intro":"यो गोपनीयता नीतिले GO PRACHI LABS (“हामी”, “हाम्रो”) ले मोबाइल एप्लिकेसन GPS Map Camera & Compass (प्याकेज नाम compass.photo.camera.map.gps.gpsmapcamera_compass) (“एप”) सँग सम्बन्धित जानकारीलाई कसरी व्यवस्थापन गर्छ भन्ने कुरा व्याख्या गर्दछ। तपाईंको गोपनीयता हाम्रा लागि महत्त्वपूर्ण छ। कृपया यो नीति ध्यानपूर्वक पढ्नुहोस्। एप प्रयोग गरेर, तपाईं यहाँ वर्णन गरिएका अभ्यासहरूमा सहमत हुनुहुन्छ।","note":"सरल भाषामा: एपले तपाईंका फोटोहरूमा तपाईंको स्थान छाप लगाउँछ, कम्पास र नक्सा देखाउँछ, र सूर्य/चन्द्र तथा मौसमका विवरणहरू प्रदर्शन गर्छ। तपाईंका फोटो र स्थान तपाईंकै यन्त्रमा प्रशोधन हुन्छन् र हाम्रा आफ्नै सर्भरहरूमा अपलोड गरिँदैनन्। तल वर्णन गरिएअनुसार, हामी नक्सा, विज्ञापन, विश्लेषण, क्र्यास रिपोर्टिङ, सूचना र किनमेलका लागि भरपर्दो Google सेवाहरू प्रयोग गर्छौं।","h1":"1. हामीले सङ्कलन गर्ने जानकारी र यसको प्रयोग","h_loc":"स्थान जानकारी (सटीक र अनुमानित)","p_loc":"तपाईंको अनुमतिसहित, एपले आफ्ना मुख्य सुविधाहरू प्रदान गर्न तपाईंको यन्त्रको GPS र नेटवर्क-आधारित स्थानमा पहुँच गर्छ: तपाईंका फोटो र भिडियोहरूलाई जियोट्याग गर्ने (छविमा निर्देशांक र ठेगाना समावेश गर्ने), नक्सामा तपाईंको स्थिति देखाउने, कम्पास दिशा, चुम्बकीय विचलन र तपाईंको स्थानका लागि सूर्य/चन्द्र तथा मौसमका विवरणहरू गणना गर्ने। स्थान तपाईंकै यन्त्रमा प्रशोधन भई तपाईंले खिच्नुभएको मिडियामा समावेश गरिन्छ। यो खण्ड ३ मा सूचीबद्ध तेस्रो-पक्ष सेवाहरूमा पठाइन सक्छ (उदाहरणका लागि, नक्सा देखाउन वा मौसम अवस्था प्राप्त गर्न)। हामी तपाईंको स्थान हाम्रा आफ्नै सर्भरहरूमा भण्डारण गर्दैनौं।","h_cam":"क्यामेरा, फोटो र मिडिया","p_cam":"तपाईंको अनुमतिसहित, एपले फोटो खिच्न र भिडियो रेकर्ड गर्न तपाईंको क्यामेरा प्रयोग गर्छ, र तपाईंका खिचिएका सामग्री तपाईंको ग्यालरीमा सुरक्षित गरी एप-भित्रको एल्बममा देखाउन सकियोस् भनेर मिडिया पढ्छ/लेख्छ। तपाईंले साझेदारी वा निर्यात गर्न रोज्नुभएको अवस्थामा बाहेक तपाईंका फोटो र भिडियोहरू तपाईंकै यन्त्रमा रहन्छन्। हामी तपाईंका फोटो वा भिडियोहरू अपलोड वा भण्डारण गर्दैनौं
