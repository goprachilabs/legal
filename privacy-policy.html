hak ketiga yang digunakannya dapat memproses informasi di negara selain negara Anda, di mana undang-undang perlindungan data mungkin berbeda. Dengan menggunakan Aplikasi, Anda menyetujui pemrosesan tersebut sesuai dengan kebijakan ini.","h11":"11. Perubahan pada Kebijakan Privasi ini","p_changes":"Kami dapat memperbarui Kebijakan Privasi ini dari waktu ke waktu. Setiap perubahan akan diposting di halaman ini dengan tanggal berlaku yang direvisi, jadi harap tinjau secara berkala. Penggunaan Aplikasi yang berkelanjutan setelah perubahan berlaku berarti Anda menerima kebijakan yang diperbarui.","h12":"12. Hubungi kami","p_contact":"Jika Anda memiliki pertanyaan, permintaan, atau masukan tentang Kebijakan Privasi ini atau informasi Anda, hubungi kami di:","footer":"© 2026 GO PRACHI LABS. Semua hak dilindungi."},"ui":{"ui_language":"Bahasa","ui_note":"Terjemahan ini disediakan untuk kenyamanan Anda. Jika terjadi perbedaan, versi bahasa Inggris adalah yang berlaku secara hukum."}},"ms":{"privacy":{"title":"Dasar Privasi","eff":"Tarikh berkuat kuasa: 9 July 2026","intro":"Dasar Privasi ini menerangkan cara GO PRACHI LABS (\"kami\", \"kita\", atau \"milik kami\") mengendalikan maklumat berkaitan dengan aplikasi mudah alih GPS Map Camera & Compass (nama pakej compass.photo.camera.map.gps.gpsmapcamera_compass) (\"Aplikasi\"). Privasi anda penting bagi kami. Sila baca dasar ini dengan teliti. Dengan menggunakan Aplikasi, anda bersetuju dengan amalan yang diterangkan di sini.","note":"Secara ringkas: Aplikasi mengecap lokasi anda pada foto anda, memaparkan kompas dan peta, serta memaparkan butiran matahari/bulan dan cuaca. Foto dan lokasi anda diproses pada peranti anda dan tidak dimuat naik ke pelayan kami sendiri. Kami menggunakan perkhidmatan Google yang dipercayai untuk peta, iklan, analitik, pelaporan ranap, pemberitahuan dan pembelian, seperti yang diterangkan di bawah.","h1":"1. Maklumat yang kami kumpulkan dan cara kami menggunakannya","h_loc":"Maklumat lokasi (tepat dan anggaran)","p_loc":"Dengan kebenaran anda, Aplikasi mengakses lokasi berasaskan GPS dan rangkaian peranti anda untuk menyediakan ciri terasnya: menandai geografi foto dan video anda (membenamkan koordinat dan alamat ke dalam imej), menunjukkan kedudukan anda pada peta, mengira arah kompas, sisihan magnet, serta butiran matahari/bulan dan cuaca untuk lokasi anda. Lokasi diproses pada peranti anda dan dibenamkan ke dalam media yang anda tangkap. Ia mungkin dihantar kepada perkhidmatan pihak ketiga yang disenaraikan dalam Bahagian 3 (contohnya, untuk memaparkan peta atau mendapatkan keadaan cuaca). Kami tidak menyimpan lokasi anda pada pelayan kami sendiri.","h_cam":"Kamera, foto dan media","p_cam":"Dengan kebenaran anda, Aplikasi menggunakan kamera anda untuk mengambil foto dan merakam video, serta membaca/menulis media supaya ia boleh menyimpan tangkapan anda ke galeri anda dan memaparkannya dalam album dalam aplikasi. Foto dan video anda kekal pada peranti anda melainkan anda memilih untuk berkongsi atau mengeksportnya. Kami tidak memuat naik atau menyimpan foto atau video anda.","h_dev":"Maklumat peranti dan penggunaan","p_dev":"Kami menggunakan Google Analytics for Firebase dan Firebase Crashlytics untuk memahami cara Aplikasi digunakan dan untuk mendiagnosis ranap. Ini mungkin termasuk peristiwa aplikasi (seperti ciri yang dibuka), model peranti, versi sistem pengendalian, versi aplikasi, bahasa, dan wilayah/negara secara umum, serta diagnostik ranap. Ini membantu kami membetulkan pepijat dan menambah baik Aplikasi.","h_ad":"Maklumat pengiklanan","p_ad":"Versi percuma Aplikasi memaparkan iklan melalui Google AdMob. AdMob mungkin mengakses pengecam pengiklanan peranti anda dan data berkaitan untuk menyampaikan dan mengukur iklan, termasuk iklan yang diperibadikan di mana dibenarkan. Lihat Bahagian 4 untuk pilihan iklan anda.","h_notif":"Pemberitahuan","p_notif":"Jika anda mendayakan pemberitahuan, Aplikasi menggunakan Firebase Cloud Messaging (yang menjana token tolak peranti) untuk menyampaikan peringatan pilihan seperti amaran waktu emas. Anda boleh mematikan pemberitahuan pada bila-bila masa dalam tetapan peranti anda.","h_purch":"Pembelian","p_purch":"Jika anda membeli naik taraf sekali bayar \"Buang Iklan / Pro\" yang pilihan, transaksi diproses oleh Google Play Billing. Kami menerima pengesahan bahawa pembelian telah dibuat supaya kami boleh membuka kunci ciri Pro dan memulihkannya untuk anda. Kami tidak pernah melihat atau menyimpan kad pembayaran atau butiran pengebilan anda — semuanya dikendalikan sepenuhnya oleh Google.","h_provide":"Maklumat yang anda pilih untuk berikan","p_provide":"Jika anda menghantar e-mel kepada kami (untuk sokongan atau maklum balas), kami menerima alamat e-mel dan kandungan mesej yang anda hantar, dan menggunakannya hanya untuk membalas anda.","h2":"2. Penderia","p_sensors":"Aplikasi membaca penderia gerakan peranti (pecutan meter dan magnetometer) untuk mengendalikan ciri kompas, aras dan kecondongan. Data penderia ini digunakan pada peranti anda dalam masa nyata dan bukan maklumat peribadi tentang anda.","h3":"3. Perkhidmatan pihak ketiga","p_third_intro":"Aplikasi bergantung pada perkhidmatan pihak ketiga berikut, yang setiap satunya ditadbir oleh dasar privasinya sendiri:","tp_advertising":"(pengiklanan)","tp_analytics":"Google Analytics for Firebase & Firebase Crashlytics","tp_notifications":"(pemberitahuan)","tp_purchases":"(pembelian)","li_weather":"Penyedia data cuaca pihak ketiga mungkin ditanya menggunakan lokasi anda untuk memaparkan keadaan semasa.","h4":"4. Iklan dan pilihan anda","p_ads_intro":"Iklan disampaikan oleh Google AdMob. Anda boleh mengawal pengiklanan yang diperibadikan pada peranti anda:","li_android":"Android: Tetapan → Google → Iklan → menarik diri daripada / tetapkan semula ID pengiklanan anda.","li_remove":"Membuang iklan sepenuhnya: beli naik taraf Pro sekali bayar dalam Aplikasi.","h5":"5. Cara kami berkongsi maklumat","p_share":"Kami tidak menjual maklumat peribadi anda. Maklumat dikongsi hanya dengan penyedia perkhidmatan yang disenaraikan dalam Bahagian 3 supaya mereka boleh menjalankan fungsi mereka (contohnya, menunjukkan peta atau iklan), dan apabila dikehendaki oleh undang-undang, proses undang-undang, atau untuk melindungi hak, keselamatan, atau harta pengguna kami, orang awam, atau kami.","h6":"6. Pengekalan data","p_ret":"Foto, video dan tetapan aplikasi yang dicipta oleh Aplikasi kekal pada peranti anda sehingga anda memadamkannya atau menyahpasang Aplikasi. Data yang dikendalikan oleh perkhidmatan pihak ketiga dalam Bahagian 3 dikekalkan mengikut dasar masing-masing.","h7":"7. Keselamatan","p_sec":"Kami mengambil langkah teknikal dan organisasi yang munasabah untuk melindungi maklumat. Walau bagaimanapun, tiada aplikasi, penghantaran atau sistem penyimpanan yang benar-benar selamat, dan kami tidak dapat menjamin keselamatan mutlak.","h8":"8. Privasi kanak-kanak","p_child":"Aplikasi ini tidak ditujukan kepada kanak-kanak di bawah umur 13 tahun (atau umur minimum yang dikehendaki di negara anda), dan kami tidak dengan sengaja mengumpulkan maklumat peribadi daripada mereka. Jika anda percaya seorang kanak-kanak telah memberikan maklumat kepada kami, sila hubungi kami dan kami akan memadamkannya.","h9":"9. Hak anda","p_rights":"Bergantung pada tempat tinggal anda (contohnya, EEA/UK di bawah GDPR, atau California di bawah CCPA/CPRA), anda mungkin mempunyai hak untuk mengakses, membetulkan, memadamkan, atau menyekat penggunaan maklumat peribadi anda, dan untuk menarik diri daripada pemprosesan tertentu. Anda boleh melaksanakan kawalan peringkat peranti pada bila-bila masa dengan membatalkan kebenaran lokasi, kamera, storan, atau pemberitahuan Aplikasi dalam tetapan peranti anda, dan dengan menetapkan semula atau menarik diri daripada ID pengiklanan anda. Untuk membuat permintaan privasi, hubungi kami menggunakan butiran di bawah.","h10":"10. Pengguna antarabangsa","p_intl":"Aplikasi dan perkhidmatan pihak ketiga yang digunakannya mungkin memproses maklumat di negara selain negara anda, di mana undang-undang perlindungan data mungkin berbeza. Dengan menggunakan Aplikasi, anda bersetuju dengan pemprosesan sedemikian selaras dengan dasar ini.","h11":"11. Perubahan kepada Dasar Privasi ini","p_changes":"Kami mungkin mengemas kini Dasar Privasi ini dari semasa ke semasa. Sebarang perubahan akan disiarkan pada halaman ini dengan tarikh berkuat kuasa yang disemak, jadi sila semaknya secara berkala. Penggunaan Aplikasi yang berterusan selepas perubahan berkuat kuasa bermakna anda menerima dasar yang dikemas kini.","h12":"12. Hubungi kami","p_contact":"Jika anda mempunyai soalan, permintaan, atau maklum balas tentang Dasar Privasi ini atau maklumat anda, hubungi kami di:","footer":"© 2026 GO PRACHI LABS. Hak cipta terpelihara."},"ui":{"ui_language":"Bahasa","ui_note":"Terjemahan ini disediakan untuk kemudahan anda. Sekiranya terdapat sebarang percanggahan, versi bahasa Inggeris adalah yang sah dari segi undang-undang."}},"vi":{"privacy":{"title":"Chính sách Quyền riêng tư","eff":"Ngày có hiệu lực: 9 July 2026","intro":"Chính sách Quyền riêng tư này giải thích cách GO PRACHI LABS (\"chúng tôi\" hoặc \"của chúng tôi\") xử lý thông tin liên quan đến ứng dụng di động GPS Map Camera & Compass (tên gói compass.photo.camera.map.gps.gpsmapcamera_compass) (\"Ứng dụng\"). Quyền riêng tư của bạn rất quan trọng đối với chúng tôi. Vui lòng đọc kỹ chính sách này. Bằng cách sử dụng Ứng dụng, bạn đồng ý với các thông lệ được mô tả tại đây.","note":"Nói một cách đơn giản: Ứng dụng đóng dấu vị trí của bạn lên ảnh, hiển thị la bàn và bản đồ, đồng thời hiển thị thông tin chi tiết về mặt trời/mặt trăng và thời tiết. Ảnh và vị trí của bạn được xử lý trên thiết bị của bạn và không được tải lên máy chủ của chúng tôi. Chúng tôi sử dụng các dịch vụ Google đáng tin cậy cho bản đồ, quảng cáo, phân tích, báo cáo sự cố, thông báo và mua hàng, như được mô tả bên dưới.","h1":"1. Thông tin chúng tôi thu thập và cách chúng tôi sử dụng","h_loc":"Thông tin vị trí (chính xác và gần đúng)","p_loc":"Với sự cho phép của bạn, Ứng dụng truy cập vị trí dựa trên GPS và mạng của thiết bị để cung cấp các tính năng cốt lõi: gắn thẻ địa lý cho ảnh và video của bạn (nhúng tọa độ và địa chỉ vào hình ảnh), hiển thị vị trí của bạn trên bản đồ, tính toán hướng la bàn, độ lệch từ, cũng như thông tin chi tiết về mặt trời/mặt trăng và thời tiết cho vị trí của bạn. Vị trí được xử lý trên thiết bị của bạn và được nhúng vào phương tiện bạn chụp. Vị trí có thể được gửi đến các dịch vụ bên thứ ba được liệt kê trong Mục 3 (ví dụ: để hiển thị bản đồ hoặc truy xuất điều kiện thời tiết). Chúng tôi không lưu trữ vị trí của bạn trên máy chủ của mình.","h_cam":"Máy ảnh, ảnh và phương tiện","p_cam":"Với sự cho phép của bạn, Ứng dụng sử dụng máy ảnh của bạn để chụp ảnh và quay video, đồng thời đọc/ghi phương tiện để có thể lưu các ảnh chụp của bạn vào thư viện và hiển thị chúng trong album trong ứng dụng. Ảnh và video của bạn vẫn ở trên thiết bị của bạn trừ khi bạn chọn chia sẻ hoặc xuất chúng. Chúng tôi không tải lên hoặc lưu giữ ảnh hoặc video của bạn.","h_dev":"Thông tin thiết bị và sử dụng","p_dev":"Chúng tôi sử dụng Google Analytics for Firebase và Firebase Crashlytics để hiểu cách Ứng dụng được sử dụng và để chẩn đoán sự cố. Điều này có thể bao gồm các sự kiện ứng dụng (chẳng hạn như các tính năng đã mở), kiểu thiết bị, phiên bản hệ điều hành, phiên bản ứng dụng, ngôn ngữ, khu vực/quốc gia chung, và chẩn đoán sự cố. Điều này giúp chúng tôi sửa lỗi và cải thiện Ứng dụng.","h_ad":"Thông tin quảng cáo","p_ad":"Phiên bản miễn phí của Ứng dụng hiển thị quảng cáo thông qua Google AdMob. AdMob có thể truy cập mã nhận dạng quảng cáo của thiết bị và dữ liệu liên quan để phân phối và đo lường quảng cáo, bao gồm cả quảng cáo được cá nhân hóa khi được phép. Xem Mục 4 để biết các lựa chọn quảng cáo của bạn.","h_notif":"Thông báo","p_notif":"Nếu bạn bật thông báo, Ứng dụng sử dụng Firebase Cloud Messaging (tạo mã thông báo đẩy của thiết bị) để gửi các lời nhắc tùy chọn như cảnh báo giờ vàng. Bạn có thể tắt thông báo bất cứ lúc nào trong cài đặt thiết bị của mình.","h_purch":"Mua hàng","p_purch":"Nếu bạn mua bản nâng cấp một lần \"Xóa quảng cáo / Pro\" tùy chọn, giao dịch được xử lý bởi Google Play Billing. Chúng tôi nhận được xác nhận rằng đã có một giao dịch mua để chúng tôi có thể mở khóa các tính năng Pro và khôi phục chúng cho bạn. Chúng tôi không bao giờ xem hoặc lưu trữ thẻ thanh toán hoặc thông tin thanh toán của bạn — những thông tin đó hoàn toàn do Google xử lý.","h_provide":"Thông tin bạn chọn cung cấp","p_provide":"Nếu bạn gửi email cho chúng tôi (để hỗ trợ hoặc phản hồi), chúng tôi nhận được địa chỉ email và nội dung tin nhắn bạn gửi, và chỉ sử dụng chúng để phản hồi bạn.","h2":"2. Cảm biến","p_sensors":"Ứng dụng đọc các cảm biến chuyển động của thiết bị (gia tốc kế và từ kế) để cung cấp các tính năng la bàn, thăng bằng và độ nghiêng. Dữ liệu cảm biến này được sử dụng trên thiết bị của bạn theo thời gian thực và không phải là thông tin cá nhân về bạn.","h3":"3. Dịch vụ bên thứ ba","p_third_intro":"Ứng dụng dựa vào các dịch vụ bên thứ ba sau đây, mỗi dịch vụ được điều chỉnh bởi chính sách quyền riêng tư riêng của mình:","tp_advertising":"(quảng cáo)","tp_analytics":"Google Analytics for Firebase & Firebase Crashlytics","tp_notifications":"(thông báo)","tp_purchases":"(mua hàng)","li_weather":"Nhà cung cấp dữ liệu thời tiết bên thứ ba có thể được truy vấn bằng vị trí của bạn để hiển thị điều kiện hiện tại.","h4":"4. Quảng cáo và các lựa chọn của bạn","p_ads_intro":"Quảng cáo được phân phối bởi Google AdMob. Bạn có thể kiểm soát quảng cáo được cá nhân hóa trên thiết bị của mình:","li_android":"Android: Cài đặt → Google → Quảng cáo → chọn không tham gia / đặt lại ID quảng cáo của bạn.","li_remove":"Xóa quảng cáo hoàn toàn: mua bản nâng cấp Pro một lần trong Ứng dụng.","h5":"5. Cách chúng tôi chia sẻ thông tin","p_share":"Chúng tôi không bán thông tin cá nhân của bạn. Thông tin chỉ được chia sẻ với các nhà cung cấp dịch vụ được liệt kê trong Mục 3 để họ có thể thực hiện chức năng của mình (ví dụ: hiển thị bản đồ hoặc quảng cáo), và khi được yêu cầu bởi pháp luật, quy trình pháp lý, hoặc để bảo vệ quyền, sự an toàn hoặc tài sản của người dùng, công chúng, hoặc chúng tôi.","h6":"6. Lưu giữ dữ liệu","p_ret":"Ảnh, video và cài đặt ứng dụng do Ứng dụng tạo ra vẫn ở trên thiết bị của bạn cho đến khi bạn xóa chúng hoặc gỡ cài đặt Ứng dụng. Dữ liệu được xử lý bởi các dịch vụ bên thứ ba trong Mục 3 được lưu giữ theo chính sách tương ứng của họ.","h7":"7. Bảo mật","p_sec":"Chúng tôi thực hiện các biện pháp kỹ thuật và tổ chức hợp lý để bảo vệ thông tin. Tuy nhiên, không có ứng dụng, hệ thống truyền tải hoặc lưu trữ nào là hoàn toàn an toàn, và chúng tôi không thể đảm bảo an toàn tuyệt đối.","h8":"8. Quyền riêng tư của trẻ em","p_child":"Ứng dụng không hướng đến trẻ em dưới 13 tuổi (hoặc độ tuổi tối thiểu được yêu cầu ở quốc gia của bạn), và chúng tôi không cố ý thu thập thông tin cá nhân từ họ. Nếu bạn tin rằng một đứa trẻ đã cung cấp cho chúng tôi thông tin, vui lòng liên hệ với chúng tôi và chúng tôi sẽ xóa nó.","h9":"9. Quyền của bạn","p_rights":"Tùy thuộc vào nơi bạn sinh sống (ví dụ: EEA/UK theo GDPR, hoặc California theo CCPA/CPRA), bạn có thể có quyền truy cập, chỉnh sửa, xóa hoặc hạn chế việc sử dụng thông tin cá nhân của mình, và từ chối một số hoạt động xử lý nhất định. Bạn có thể thực hiện các quyền kiểm soát ở cấp thiết bị bất cứ lúc nào bằng cách thu hồi quyền vị trí, máy ảnh, bộ nhớ hoặc thông báo của Ứng dụng trong cài đặt thiết bị của bạn, và bằng cách đặt lại hoặc từ chối ID quảng cáo của bạn. Để đưa ra yêu cầu về quyền riêng tư, hãy liên hệ với chúng tôi bằng cách sử dụng thông tin chi tiết bên dưới.","h10":"10. Người dùng quốc tế","p_intl":"Ứng dụng và các dịch vụ bên thứ ba mà nó sử dụng có thể xử lý thông tin ở các quốc gia khác với quốc gia của bạn, nơi luật bảo vệ dữ liệu có thể khác nhau. Bằng cách sử dụng Ứng dụng, bạn đồng ý với việc xử lý như vậy phù hợp với chính sách này.","h11":"11. Thay đổi đối với Chính sách Quyền riêng tư này","p_changes":"Chúng tôi có thể cập nhật Chính sách Quyền riêng tư này theo thời gian. Mọi thay đổi sẽ được đăng trên trang này với ngày có hiệu lực đã sửa đổi, vì vậy vui lòng xem lại định kỳ. Việc tiếp tục sử dụng Ứng dụng sau khi các thay đổi có hiệu lực có nghĩa là bạn chấp nhận chính sách đã cập nhật.","h12":"12. Liên hệ với chúng tôi","p_contact":"Nếu bạn có câu hỏi, yêu cầu hoặc phản hồi về Chính sách Quyền riêng tư này hoặc thông tin của bạn, hãy liên hệ với chúng tôi tại:","footer":"© 2026 GO PRACHI LABS. Bảo lưu mọi quyền."},"ui":{"ui_language":"Ngôn ngữ","ui_note":"Bản dịch này được cung cấp để thuận tiện cho bạn. Trong trường hợp có bất kỳ sự khác biệt nào, phiên bản tiếng Anh là phiên bản có giá trị pháp lý."}},"th":{"privacy":{"title":"นโยบายความเป็นส่วนตัว","eff":"วันที่มีผลบังคับใช้: 9 July 2026","intro":"นโยบายความเป็นส่วนตัวนี้อธิบายว่า GO PRACHI LABS (“เรา”, “พวกเรา” หรือ “ของเรา”) จัดการข้อมูลอย่างไรที่เกี่ยวข้องกับแอปพลิเคชันบนมือถือ GPS Map Camera & Compass (ชื่อแพ็กเกจ compass.photo.camera.map.gps.gpsmapcamera_compass) (“แอป”) ความเป็นส่วนตัวของคุณมีความสำคัญต่อเรา โปรดอ่านนโยบายนี้อย่างละเอียด การใช้แอปถือว่าคุณยอมรับแนวปฏิบัติที่อธิบายไว้ในที่นี้","note":"กล่าวโดยง่าย: แอปจะประทับตำแหน่งที่ตั้งของคุณลงบนภาพถ่าย แสดงเข็มทิศและแผนที่ และแสดงรายละเอียดดวงอาทิตย์/ดวงจันทร์และสภาพอากาศ ภาพถ่ายและตำแหน่งของคุณจะถูกประมวลผลบนอุปกรณ์ของคุณและไม่ถูกอัปโหลดไปยังเซิร์ฟเวอร์ของเราเอง เราใช้บริการที่เชื่อถือได้ของ Google สำหรับแผนที่ โฆษณา การวิเคราะห์ การรายงานข้อขัดข้อง การแจ้งเตือน และการซื้อ ตามที่อธิบายไว้ด้านล่าง","h1":"1. ข้อมูลที่เราเก็บรวบรวมและวิธีที่เราใช้","h_loc":"ข้อมูลตำแหน่งที่ตั้ง (แม่นยำและโดยประมาณ)","p_loc":"เมื่อได้รับอนุญาตจากคุณ แอปจะเข้าถึง GPS และตำแหน่งที่อิงเครือข่ายของอุปกรณ์ของคุณเพื่อให้บริการฟีเจอร์หลัก ได้แก่ การประทับตำแหน่งทางภูมิศาสตร์ลงบนภาพถ่ายและวิดีโอของคุณ (ฝังพิกัดและที่อยู่ลงในภาพ) แสดงตำแหน่งของคุณบนแผนที่ คำนวณทิศทางเข็มทิศ ค่าเบี่ยงเบนของสนามแม่เหล็ก และรายละเอียดดวงอาทิตย์/ดวงจันทร์และสภาพอากาศสำหรับตำแหน่งของคุณ ตำแหน่งจะถูกประมวลผลบนอุปกรณ์ของคุณและฝังลงในสื่อที่คุณบันทึก อาจถูกส่งไปยังบริการของบุคคลที่สามที่ระบุไว้ในหัวข้อ 3 (ตัวอย่างเช่น เพื่อแสดงแผนที่หรือดึงข้อมูลสภาพอากาศ) เราไม่จัดเก็บตำแหน่งของคุณบนเซิร์ฟเวอร์ของเราเอง","h_cam":"กล้อง ภาพถ่าย และสื่อ","p_cam":"เมื่อได้รับอนุญาตจากคุณ แอปจะใช้กล้องของคุณเพื่อถ่ายภาพและบันทึกวิดีโอ และอ่าน/เขียนสื่อเพื่อให้สามารถบันทึกภาพที่คุณถ่ายลงในแกลเลอรีและแสดงในอัลบั้มภายในแอป ภาพถ่ายและวิดีโอของคุณจะยังคงอยู่บนอุปกรณ์ของคุณเว้นแต่คุณเลือกที่จะแชร์หรือส่งออก เราไม่อัปโหลดหรือเก็บรักษาภาพถ่ายหรือวิดีโอของคุณ","h_dev":"ข้อมูลอุปกรณ์และการใช้งาน","p_dev":"เราใช้ Google Analytics for Firebase และ Firebase Crashlytics เพื่อทำความเข้าใจว่ามีการใช้แอปอย่างไรและเพื่อวิเคราะห์ข้อขัดข้อง ซึ่งอาจรวมถึงเหตุการณ์ในแอป (เช่น ฟีเจอร์ที่เปิดใช้) รุ่นอุปกรณ์ เวอร์ชันระบบปฏิบัติการ เวอร์ชันแอป ภาษา และภูมิภาค/ประเทศโดยทั่วไป และข้อมูลวินิจฉัยข้อขัดข้อง สิ่งนี้ช่วยให้เราแก้ไขข้อบกพร่องและปรับปรุงแอป","h_ad":"ข้อมูลการโฆษณา","p_ad":"แอปเวอร์ชันฟรีจะแสดงโฆษณาผ่าน Google AdMob AdMob อาจเข้าถึงตัวระบุการโฆษณาของอุปกรณ์ของคุณและข้อมูลที่เกี่ยวข้องเพื่อแสดงและวัดผลโฆษณา รวมถึงโฆษณาที่ปรับให้เหมาะกับแต่ละบุคคลในกรณีที่ได้รับอนุญาต ดูหัวข้อ 4 สำหรับตัวเลือกโฆษณาของคุณ","h_notif":"การแจ้งเตือน","p_notif":"หากคุณเปิดใช้การแจ้งเตือน แอปจะใช้ Firebase Cloud Messaging (ซึ่งสร้างโทเค็นการแจ้งเตือนของอุปกรณ์) เพื่อส่งการแจ้งเตือนเสริม เช่น การแจ้งเตือนช่วงเวลาทอง คุณสามารถปิดการแจ้งเตือนได้ตลอดเวลาในการตั้งค่าอุปกรณ์ของคุณ","h_purch":"การซื้อ","p_purch":"หากคุณซื้อการอัปเกรดเสริมแบบครั้งเดียว “นำโฆษณาออก / Pro” ธุรกรรมจะถูกดำเนินการโดย Google Play Billing เราได้รับการยืนยันว่ามีการซื้อเกิดขึ้นเพื่อให้เราสามารถปลดล็อกฟีเจอร์ Pro และกู้คืนให้กับคุณ เราไม่เคยเห็นหรือจัดเก็บบัตรชำระเงินหรือรายละเอียดการเรียกเก็บเงินของคุณ — สิ่งเหล่านั้นได้รับการจัดการทั้งหมดโดย Google","h_provide":"ข้อมูลที่คุณเลือกที่จะให้","p_provide":"หากคุณส่งอีเมลถึงเรา (เพื่อขอความช่วยเหลือหรือให้ข้อเสนอแนะ) เราจะได้รับที่อยู่อีเมลและเนื้อหาข้อความที่คุณส่ง และใช้เพื่อตอบกลับคุณเท่านั้น","h2":"2. เซ็นเซอร์","p_sensors":"แอปอ่านเซ็นเซอร์การเคลื่อนไหวของอุปกรณ์ (มาตรวัดความเร่งและมาตรวัดสนามแม่เหล็ก) เพื่อขับเคลื่อนฟีเจอร์เข็มทิศ ระดับ และการเอียง ข้อมูลเซ็นเซอร์นี้ถูกใช้บนอุปกรณ์ของคุณแบบเรียลไทม์และไม่ใช่ข้อมูลส่วนบุคคลเกี่ยวกับตัวคุณ","h3":"3. บริการของบุคคลที่สาม","p_third_intro":"แอปอาศัยบริการของบุคคลที่สามต่อไปนี้ ซึ่งแต่ละรายอยู่ภายใต้นโยบายความเป็นส่วนตัวของตนเอง:","tp_advertising":"(การโฆษณา)","tp_analytics":"Google Analytics for Firebase & Firebase Crashlytics","tp_notifications":"(การแจ้งเตือน)","tp_purchases":"(การซื้อ)","li_weather":"ผู้ให้บริการข้อมูลสภาพอากาศของบุคคลที่สามอาจถูกสอบถามโดยใช้ตำแหน่งของคุณเพื่อแสดงสภาพอากาศปัจจุบัน","h4":"4. โฆษณาและตัวเลือกของคุณ","p_ads_intro":"โฆษณาแสดงโดย Google AdMob คุณสามารถควบคุมการโฆษณาที่ปรับให้เหมาะกับแต่ละบุคคลบนอุปกรณ์ของคุณได้:","li_android":"Android: การตั้งค่า → Google → โฆษณา → เลือกไม่รับ / รีเซ็ตรหัสการโฆษณาของคุณ","li_remove":"การนำโฆษณาออกทั้งหมด: ซื้อการอัปเกรด Pro แบบครั้งเดียวในแอป","h5":"5. วิธีที่เราแบ่งปันข้อมูล","p_share":"เราไม่ขายข้อมูลส่วนบุคคลของคุณ ข้อมูลจะถูกแบ่งปันเฉพาะกับผู้ให้บริการที่ระบุไว้ในหัวข้อ 3 เพื่อให้พวกเขาสามารถทำหน้าที่ของตน (ตัวอย่างเช่น การแสดงแผนที่หรือโฆษณา) และเมื่อกฎหมายกำหนด กระบวนการทางกฎหมาย หรือเพื่อปกป้องสิทธิ ความปลอดภัย หรือทรัพย์สินของผู้ใช้ของเรา สาธารณะ หรือของเรา","h6":"6. การเก็บรักษาข้อมูล","p_ret":"ภาพถ่าย วิดีโอ และการตั้งค่าแอปที่สร้างโดยแอปจะยังคงอยู่บนอุปกรณ์ของคุณจนกว่าคุณจะลบหรือถอนการติดตั้งแอป ข้อมูลที่จัดการโดยบริการของบุคคลที่สามในหัวข้อ 3 จะถูกเก็บรักษาตามนโยบายของแต่ละราย","h7":"7. ความปลอดภัย","p_sec":"เราใช้มาตรการทางเทคนิคและองค์กรที่สมเหตุสมผลเพื่อปกป้องข้อมูล อย่างไรก็ตาม ไม่มีแอป การส่งข้อมูล หรือระบบจัดเก็บใดที่ปลอดภัยอย่างสมบูรณ์ และเราไม่สามารถรับประกันความปลอดภัยแบบสัมบูรณ์ได้","h8":"8. ความเป็นส่วนตัวของเด็ก","p_child":"แอปนี้ไม่ได้มุ่งเป้าไปที่เด็กอายุต่ำกว่า 13 ปี (หรืออายุขั้นต่ำที่กำหนดในประเทศของคุณ) และเราไม่เก็บรวบรวมข้อมูลส่วนบุคคลจากพวกเขาโดยเจตนา หากคุณเชื่อว่าเด็กได้ให้ข้อมูลแก่เรา โปรดติดต่อเราและเราจะลบข้อมูลนั้น","h9":"9. สิทธิของคุณ","p_rights":"ขึ้นอยู่กับสถานที่ที่คุณอาศัยอยู่ (ตัวอย่างเช่น EEA/UK ภายใต้ GDPR หรือแคลิฟอร์เนียภายใต้ CCPA/CPRA) คุณอาจมีสิทธิในการเข้าถึง แก้ไข ลบ หรือจำกัดการใช้ข้อมูลส่วนบุคคลของคุณ และการเลือกไม่รับการประมวลผลบางอย่าง คุณสามารถใช้การควบคุมระดับอุปกรณ์ได้ตลอดเวลาโดยการเพิกถอนสิทธิ์ตำแหน่ง กล้อง ที่จัดเก็บ หรือการแจ้งเตือนของแอปในการตั้งค่าอุปกรณ์ของคุณ และโดยการรีเซ็ตหรือเลือกไม่รับรหัสการโฆษณาของคุณ หากต้องการยื่นคำขอด้านความเป็นส่วนตัว โปรดติดต่อเราโดยใช้รายละเอียดด้านล่าง","h10":"10. ผู้ใช้ระหว่างประเทศ","p_intl":"แอปและบริการของบุคคลที่สามที่แอปใช้อาจประมวลผลข้อมูลในประเทศอื่นนอกเหนือจากประเทศของคุณ ซึ่งกฎหมายคุ้มครองข้อมูลอาจแตกต่างกัน การใช้แอปถือว่าคุณยินยอมให้มีการประมวลผลดังกล่าวโดยสอดคล้องกับนโยบายนี้","h11":"11. การเปลี่ยนแปลงนโยบายความเป็นส่วนตัวนี้","p_changes":"เราอาจปรับปรุงนโยบายความเป็นส่วนตัวนี้เป็นครั้งคราว การเปลี่ยนแปลงใด ๆ จะถูกโพสต์บนหน้านี้พร้อมวันที่มีผลบังคับใช้ที่ปรับปรุงแล้ว ดังนั้นโปรดตรวจสอบเป็นระยะ การใช้แอปต่อไปหลังจากการเปลี่ยนแปลงมีผลบังคับใช้หมายความว่าคุณยอมรับนโยบายที่ปรับปรุงแล้ว","h12":"12. ติดต่อเรา","p_contact":"หากคุณมีคำถาม คำขอ หรือข้อเสนอแนะเกี่ยวกับนโยบายความเป็นส่วนตัวนี้หรือข้อมูลของคุณ โปรดติดต่อเราที่:","footer":"© 2026 GO PRACHI LABS. สงวนลิขสิทธิ์ทั้งหมด"},"ui":{"ui_language":"ภาษา","ui_note":"คำแปลนี้จัดทำขึ้นเพื่อความสะดวกของคุณ ในกรณีที่มีความคลาดเคลื่อนใด ๆ ฉบับภาษาอังกฤษถือเป็นฉบับที่มีผลผูกพันทางกฎหมาย"}},"fil":{"privacy":{"title":"Patakaran sa Privacy","eff":"Petsa ng pagkakabisa: 9 July 2026","intro":"Ipinapaliwanag ng Patakaran sa Privacy na ito kung paano pinangangasiwaan ng GO PRACHI LABS (“kami”, “namin”, o “amin”) ang impormasyon kaugnay ng mobile application na GPS Map Camera & Compass (pangalan ng package compass.photo.camera.map.gps.gpsmapcamera_compass) (ang “App”). Mahalaga sa amin ang inyong privacy. Mangyaring basahin nang mabuti ang patakarang ito. Sa paggamit ng App, sumasang-ayon kayo sa mga kasanayang inilarawan dito.","note":"Sa simpleng salita: tinatatakan ng App ang inyong mga larawan gamit ang inyong lokasyon, nagpapakita ng compass at mapa, at nagpapakita ng mga detalye ng araw/buwan at panahon. Ang inyong mga larawan at lokasyon ay pinoproseso sa inyong device at hindi ina-upload sa aming sariling mga server. Gumagamit kami ng mga pinagkakatiwalaang serbisyo ng Google para sa mga mapa, ad, analytics, pag-uulat ng crash, mga abiso, at mga pagbili, tulad ng inilarawan sa ibaba.","h1":"1. Impormasyong kinokolekta namin at kung paano namin ito ginagamit","h_loc":"Impormasyon ng lokasyon (tumpak at tinatayang)","p_loc":"Sa inyong pahintulot, ina-access ng App ang GPS at lokasyong batay sa network ng inyong device upang maibigay ang mga pangunahing tampok nito: pag-geotag ng inyong mga larawan at video (pag-embed ng mga coordinate at address sa larawan), pagpapakita ng inyong posisyon sa mapa, pagkalkula ng direksyon ng compass, magnetic declination, at mga detalye ng araw/buwan at panahon para sa inyong lokasyon. Ang lokasyon ay pinoproseso sa inyong device at naka-embed sa media na inyong kinukuha. Maaari itong ipadala sa mga serbisyo ng third party na nakalista sa Seksyon 3 (halimbawa, upang mag-render ng mga mapa o kumuha ng mga kondisyon ng panahon). Hindi namin iniimbak ang inyong lokasyon sa aming sariling mga server.","h_cam":"Camera, mga larawan, at media","p_cam":"Sa inyong pahintulot, ginagamit ng App ang inyong camera upang kumuha ng mga larawan at mag-record ng mga video, at nagbabasa/nagsusulat ng media upang ma-save ang inyong mga kuha sa inyong gallery at maipakita ang mga ito sa in-app album. Ang inyong mga larawan at video ay nananatili sa inyong device maliban kung pipiliin ninyong ibahagi o i-export ang mga ito. Hindi namin ina-upload o pinapanatili ang inyong mga larawan o video.","h_dev":"Impormasyon ng device at paggamit","p_dev":"Gumagamit kami ng Google Analytics for Firebase at Firebase Crashlytics upang maunawaan kung paano ginagamit ang App at upang masuri ang mga crash. Maaaring kabilang dito ang mga kaganapan sa app (tulad ng mga tampok na binuksan), modelo ng device, bersyon ng operating system, bersyon ng app, wika, at pangkalahatang rehiyon/bansa, at mga diagnostic ng crash. Nakakatulong ito sa aming ayusin ang mga bug at pahusayin ang App.","h_ad":"Impormasyon ng advertising","p_ad":"Ang libreng bersyon ng App ay nagpapakita ng mga ad sa pamamagitan ng Google AdMob. Maaaring i-access ng AdMob ang advertising identifier ng inyong device at kaugnay na data upang maghatid at masukat ang mga ad, kabilang ang mga personalized na ad kung saan pinapayagan. Tingnan ang Seksyon 4 para sa inyong mga pagpipilian sa ad.","h_notif":"Mga abiso","p_notif":"Kung ie-enable ninyo ang mga abiso, gumagamit ang App ng Firebase Cloud Messaging (na bumubuo ng device push token) upang maghatid ng mga opsyonal na paalala tulad ng mga alerto sa golden-hour. Maaari ninyong i-off ang mga abiso anumang oras sa mga setting ng inyong device.","h_purch":"Mga pagbili","p_purch":"Kung bibilhin ninyo ang opsyonal na isang beses na “Alisin ang mga Ad / Pro” upgrade, ang transaksyon ay pinoproseso ng Google Play Billing. Tumatanggap kami ng kumpirmasyon na may ginawang pagbili upang ma-unlock namin ang mga tampok na Pro at maibalik ang mga ito para sa inyo. Hindi namin nakikita o iniimbak ang inyong payment card o mga detalye ng pagsingil — ang mga iyon ay ganap na pinangangasiwaan ng Google.","h_provide":"Impormasyong pinili ninyong ibigay","p_provide":"Kung mag-email kayo sa amin (para sa suporta o feedback), tumatanggap kami ng email address at nilalaman ng mensaheng ipinadala ninyo, at ginagamit lamang ito upang tumugon sa inyo.","h2":"2. Mga sensor","p_sensors":"Binabasa ng App ang mga motion sensor ng device (accelerometer at magnetometer) upang paganahin ang mga tampok na compass, level, at tilt. Ang datos ng sensor na ito ay ginagamit sa inyong device nang real-time at hindi personal na impormasyon tungkol sa inyo.","h3":"3. Mga serbisyo ng third party","p_third_intro":"Umaasa ang App sa mga sumusunod na serbisyo ng third party, bawat isa ay pinamamahalaan ng sarili nitong patakaran sa privacy:","tp_advertising":"(advertising)","tp_analytics":"Google Analytics for Firebase & Firebase Crashlytics","tp_notifications":"(mga abiso)","tp_purchases":"(mga pagbili)","li_weather":"Maaaring i-query ang isang third-party na provider ng datos ng panahon gamit ang inyong lokasyon upang ipakita ang kasalukuyang mga kondisyon.","h4":"4. Mga ad at ang inyong mga pagpipilian","p_ads_intro":"Ang mga ad ay inihahatid ng Google AdMob. Maaari ninyong kontrolin ang personalized na advertising sa inyong device:","li_android":"Android: Settings → Google → Ads → mag-opt out ng / i-reset ang inyong advertising ID.","li_remove":"Pag-alis ng mga ad nang buo: bilhin ang isang beses na Pro upgrade sa App.","h5":"5. Kung paano namin ibinabahagi ang impormasyon","p_share":"Hindi namin ibinebenta ang inyong personal na impormasyon. Ang impormasyon ay ibinabahagi lamang sa mga service provider na nakalista sa Seksyon 3 upang magampanan nila ang kanilang mga tungkulin (halimbawa, pagpapakita ng mga mapa o ad), at kung saan hinihingi ng batas, legal na proseso, o upang protektahan ang mga karapatan, kaligtasan, o ari-arian ng aming mga user, ng publiko, o namin.","h6":"6. Pagpapanatili ng datos","p_ret":"Ang mga larawan, video, at mga setting ng app na nilikha ng App ay nananatili sa inyong device hanggang sa tanggalin ninyo ang mga ito o i-uninstall ang App. Ang datos na pinangangasiwaan ng mga serbisyo ng third party sa Seksyon 3 ay pinapanatili ayon sa kani-kanilang mga patakaran.","h7":"7. Seguridad","p_sec":"Nagsasagawa kami ng makatwirang teknikal at organisasyonal na mga hakbang upang protektahan ang impormasyon. Gayunpaman, walang app, paghahatid, o sistema ng imbakan ang ganap na ligtas, at hindi namin magagarantiya ang ganap na seguridad.","h8":"8. Privacy ng mga bata","p_child":"Ang App ay hindi nakatuon sa mga batang wala pang 13 taong gulang (o ang minimum na edad na kinakailangan sa inyong bansa), at hindi kami sinasadyang nangongolekta ng personal na impormasyon mula sa kanila. Kung naniniwala kayong nagbigay ng impormasyon sa amin ang isang bata, mangyaring makipag-ugnayan sa amin at tatanggalin namin ito.","h9":"9. Ang inyong mga karapatan","p_rights":"Depende sa kung saan kayo nakatira (halimbawa, ang EEA/UK sa ilalim ng GDPR, o California sa ilalim ng CCPA/CPRA), maaaring may mga karapatan kayong mag-access, magwasto, magtanggal, o maglimita sa paggamit ng inyong personal na impormasyon, at mag-opt out ng ilang partikular na pagproseso. Maaari ninyong gamitin ang mga kontrol sa antas ng device anumang oras sa pamamagitan ng pagbawi sa mga pahintulot ng App sa lokasyon, camera, storage, o abiso sa mga setting ng inyong device, at sa pamamagitan ng pag-reset o pag-opt out ng inyong advertising ID. Upang gumawa ng kahilingan sa privacy, makipag-ugnayan sa amin gamit ang mga detalye sa ibaba.","h10":"10. Mga internasyonal na user","p_intl":"Ang App at ang mga serbisyo ng third party na ginagamit nito ay maaaring magproseso ng impormasyon sa mga bansa maliban sa sa inyo, kung saan maaaring magkaiba ang mga batas sa proteksyon ng datos. Sa paggamit ng App, pumapayag kayo sa naturang pagproseso na naaayon sa patakarang ito.","h11":"11. Mga pagbabago sa Patakaran sa Privacy na ito","p_changes":"Maaari naming i-update ang Patakaran sa Privacy na ito paminsan-minsan. Ang anumang mga pagbabago ay ipo-post sa pahinang ito na may binagong petsa ng pagkakabisa, kaya mangyaring suriin ito paminsan-minsan. Ang patuloy na paggamit ng App pagkatapos magkabisa ang mga pagbabago ay nangangahulugang tinatanggap ninyo ang na-update na patakaran.","h12":"12. Makipag-ugnayan sa amin","p_contact":"Kung may mga tanong, kahilingan, o feedback kayo tungkol sa Patakaran sa Privacy na ito o sa inyong impormasyon, makipag-ugnayan sa amin sa:","footer":"© 2026 GO PRACHI LABS. Nakalaan ang lahat ng karapatan."},"ui":{"ui_language":"Wika","ui_note":"Ang pagsasaling ito ay ibinigay para sa inyong kaginhawahan. Sa kaso ng anumang pagkakaiba, ang bersyong Ingles ang legal na makapangyarihan."}},"my":{"privacy":{"title":"ကိုယ်ရေးအချက်အလက် မူဝါဒ","eff":"စတင်အကျိုးသက်ရောက်သည့်ရက်စွဲ- 9 July 2026","intro":"ဤကိုယ်ရေးအချက်အလက် မူဝါဒသည် GO PRACHI LABS (“ကျွန်ုပ်တို့”) က မိုဘိုင်းအက်ပလီကေးရှင်း GPS Map Camera & Compass (ပက်ကေ့ဂျ်အမည် compass.photo.camera.map.gps.gpsmapcamera_compass) (“အက်ပ်”) နှင့်ဆက်စပ်၍ အချက်အလက်များကို မည်သို့ကိုင်တွယ်ဆောင်ရွက်သည်ကို ရှင်းပြပါသည်။ သင်၏ ကိုယ်ရေးအချက်အလက်လုံခြုံမှုသည် ကျွန်ုပ်တို့အတွက် အရေးကြီးပါသည်။ ဤမူဝါဒကို ဂရုတစိုက်ဖတ်ပါ။ အက်ပ်ကိုအသုံးပြုခြင်းဖြင့် ဤနေရာတွင်ဖော်ပြထားသော လုပ်ဆောင်ချက်များကို သင်သဘောတူပါသည်။","note":"ရိုးရှင်းစွာဆိုရသော် - အက်ပ်သည် သင်၏ဓာတ်ပုံများပေါ်တွင် သင်၏တည်နေရာကို တံဆိပ်ရိုက်နှိပ်ပေးပြီး၊ ကြယ်ပြွန်နှင့် မြေပုံများကိုပြသကာ၊ နေ/လ နှင့် ရာသီဥတုအသေးစိတ်များကိုပြသပါသည်။ သင်၏ ဓာတ်ပုံများနှင့် တည်နေရာကို သင်၏စက်ပစ္စည်းပေါ်တွင်သာ လုပ်ဆောင်ပြီး ကျွန်ုပ်တို့၏ ဆာဗာများသို့ တင်ခြင်းမပြုပါ။ အောက်တွင်ဖော်ပြထားသည့်အတိုင်း မြေပုံ၊ ကြော်ငြာ၊ ခွဲခြမ်းစိတ်ဖြာမှု၊ ပျက်စီးမှုအစီရင်ခံခြင်း၊ အသိပေးချက်များနှင့် ဝယ်ယူမှုများအတွက် ယုံကြည်စိတ်ချရသော Google ဝန်ဆောင်မှုများကို ကျွန်ုပ်တို့အသုံးပြုပါသည်။","h1":"1. ကျွန်ုပ်တို့စုဆောင်းသည့် အချက်အလက်များနှင့် ၎င်းကို မည်သို့အသုံးပြုသည်","h_loc":"တည်နေရာအချက်အလက် (တိကျသော နှင့် ခန့်မှန်းခြေ)","p_loc":"သင်၏ခွင့်ပြုချက်ဖြင့် အက်ပ်သည် ၎င်း၏အဓိကလုပ်ဆောင်ချက်များကိုပေးရန်အတွက် သင့်စက်ပစ္စည်း၏ GPS နှင့် ကွန်ရက်အခြေခံတည်နေရာကို အသုံးပြုသည်- သင်၏ဓာတ်ပုံနှင့် ဗီဒီယိုများကို ဂျီအိုတဂ်လုပ်ခြင်း (ကိုသြဒိနိတ်များနှင့် လိပ်စာကို ပုံထဲသို့ထည့်သွင်းခြင်း)၊ မြေပုံပေါ်တွင် သင်၏တည်နေရာကိုပြသခြင်း၊ ကြယ်ပြွန်ဦးတည်ရာ၊ သံလိုက်သွေဖည်မှုနှင့် သင်၏တည်နေရာအတွက် နေ/လ နှင့် ရာသီဥတုအသေးစိတ်များကို တွက်ချက်ခြင်း။ တည်နေရာကို သင်၏စက်ပစ္စည်းပေါ်တွင် လုပ်ဆောင်ပြီး သင်ရိုက်ကူးသည့် မီဒီယာထဲသို့ ထည့်သွင်းပါသည်။ ၎င်းကို အပိုဒ် 3 တွင်ဖော်ပြထားသော တတိယအဖွဲ့ဝန်ဆောင်မှုများသို့ ပေးပို့နိုင်ပါသည် (ဥပမာ- မြေပုံများပြသရန် သို့မဟုတ် ရာသီဥတုအခြေအနေများကို ရယူရန်)။ ကျွန်ုပ်တို့သည် သင်၏တည်နေရာကို ကျွန်ုပ်တို့၏ဆာဗာများပေါ်တွင် သိမ်းဆည်းခြင်းမပြုပါ။","h_cam":"ကင်မရာ၊ ဓာတ်ပုံများနှင့် မီဒီယာ","p_cam":"သင်၏ခွင့်ပြုချက်ဖြင့် အက်ပ်သည် ဓာတ်ပုံရိုက်ရန်နှင့် ဗီဒီယိုမှတ်တမ်းတင်ရန် သင်၏ကင်မရာကိုအသုံးပြုပြီး၊ သင်ရိုက်ကူးထားသည်များကို သင်၏ဓာတ်ပုံပြခန်းသို့သိမ်းဆည်းကာ အက်ပ်အတွင်းအယ်လ်ဘမ်တွင်ပြသနိုင်ရန် မီဒီယာကို ဖတ်/ရေးသည်။ သင်ဝေမျှရန် သို့မဟုတ် ပို့ကုန်ထုတ်ရန်ရွေးချယ်ခြင်းမပြုပါက သင်၏ဓာတ်ပုံနှင့် ဗီဒီယိုများသည် သင်၏စက်ပစ္စည်းပေါ်တွင် ဆက်လက်ရှိနေမည်ဖြစ်သည်။ ကျွန်ုပ်တို့သည် သင်၏ဓာတ်ပုံ သို့မဟုတ် ဗီဒီယိုများကို တင်ခြင်း သို့မဟုတ် ထိန်းသိမ်းခြင်းမပြုပါ။","h_dev":"စက်ပစ္စည်းနှင့် အသုံးပြုမှုအချက်အလက်","p_dev":"အက်ပ်ကို မည်သို့အသုံးပြုသည်ကို နားလည်ရန်နှင့် ပျက်စီးမှုများကိုစစ်ဆေးရန် ကျွန်ုပ်တို့သည် Google Analytics for Firebase နှင့် Firebase Crashlytics ကိုအသုံးပြုပါသည်။ ၎င်းတွင် အက်ပ်ဖြစ်ရပ်များ (ဖွင့်ထားသောလုပ်ဆောင်ချက်များကဲ့သို့)၊ စက်ပစ္စည်းမော်ဒယ်၊ လည်ပတ်မှုစနစ်ဗားရှင်း၊ အက်ပ်ဗားရှင်း၊ ဘာသာစကား၊ ယေဘုယျဒေသ/နိုင်ငံနှင့် ပျက်စီးမှုစစ်ဆေးချက်များ ပါဝင်နိုင်သည်။ ၎င်းသည် ချွတ်ယွင်းချက်များကိုပြင်ဆင်ပြီး အက်ပ်ကိုတိုးတက်စေရန် ကူညီပါသည်။","h_ad":"ကြော်ငြာအချက်အလက်","p_ad":"အက်ပ်၏အခမဲ့ဗားရှင်းသည် Google AdMob မှတစ်ဆင့် ကြော်ငြာများပြသသည်။ AdMob သည် ကြော်ငြာများကို ပေးပို့ရန်နှင့် တိုင်းတာရန်အတွက် သင့်စက်ပစ္စည်း၏ ကြော်ငြာအမှတ်အသားနှင့် ဆက်စပ်ဒေတာကို အသုံးပြုနိုင်ပြီး၊ ခွင့်ပြုသည့်နေရာတွင် ကိုယ်ပိုင်ဖြစ်စေသည့်ကြော်ငြာများပါဝင်သည်။ သင်၏ ကြော်ငြာရွေးချယ်စရာများအတွက် အပိုဒ် 4 ကိုကြည့်ပါ။","h_notif":"အသိပေးချက်များ","p_notif":"အသိပေးချက်များကို သင်ဖွင့်ပါက အက်ပ်သည် golden-hour သတိပေးချက်များကဲ့သို့ ရွေးချယ်နိုင်သောသတိပေးချက်များ ပေးပို့ရန် Firebase Cloud Messaging (စက်ပစ္စည်း push token ကိုဖန်တီးသည်) ကိုအသုံးပြုသည်။ သင်၏ စက်ပစ္စည်းဆက်တင်များတွင် အသိပေးချက်များကို အချိန်မရွေးပိတ်နိုင်သည်။","h_purch":"ဝယ်ယူမှုများ","p_purch":"သင်သည် ရွေးချယ်နိုင်သော တစ်ကြိမ်တည်း “ကြော်ငြာများဖယ်ရှားရန် / Pro” အဆင့်မြှင့်တင်မှုကို ဝယ်ယူပါက ငွေပေးချေမှုကို Google Play Billing 为您的照片和视频添加地理标记（将坐标和地址嵌入图像）、在地图上显示您的位置、计算指南针方位、磁偏角以及您所在位置的日月和天气详情。位置在您的设备上处理并嵌入您拍摄的媒体中。它可能会发送给第 3 节列出的第三方服务（例如，用于渲染地图或获取天气状况）。我们不会在自己的服务器上存储您的位置。","h_cam":"相机、照片和媒体","p_cam":"在您授权的情况下，本应用使用您的相机拍摄照片和录制视频，并读取/写入媒体，以便将您的拍摄内容保存到您的图库并在应用内相册中显示。除非您选择分享或导出，否则您的照片和视频将保留在您的设备上。我们不会上传或保留您的照片或视频。","h_dev":"设备和使用信息","p_dev":"我们使用 Google Analytics for Firebase 和 Firebase Crashlytics 来了解本应用的使用情况并诊断崩溃。这可能包括应用事件（例如打开的功能）、设备型号、操作系统版本、应用版本、语言、大致地区/国家以及崩溃诊断信息。这有助于我们修复错误并改进本应用。","h_ad":"广告信息","p_ad":"本应用的免费版本通过 Google AdMob 展示广告。AdMob 可能会访问您设备的广告标识符和相关数据，以投放和衡量广告，包括在允许的情况下投放个性化广告。有关您的广告选择，请参阅第 4 节。","h_notif":"通知","p_notif":"如果您启用通知，本应用会使用 Firebase Cloud Messaging（会生成设备推送令牌）来发送可选提醒，例如黄金时段提示。您可以随时在设备设置中关闭通知。","h_purch":"购买","p_purch":"如果您购买可选的一次性“去除广告 / Pro”升级，交易将由 Google Play Billing 处理。我们会收到已完成购买的确认，以便为您解锁 Pro 功能并为您恢复这些功能。我们绝不会查看或存储您的付款卡或账单详情——这些完全由 Google 处理。","h_provide":"您选择提供的信息","p_provide":"如果您向我们发送电子邮件（以获取支持或提供反馈），我们会收到您发送的电子邮件地址和消息内容，并仅将其用于回复您。","h2":"2. 传感器","p_sensors":"本应用读取设备运动传感器（加速度计和磁力计）以支持指南针、水平仪和倾斜功能。此传感器数据在您的设备上实时使用，不属于关于您的个人信息。","h3":"3. 第三方服务","p_third_intro":"本应用依赖以下第三方服务，每项服务均受其各自的隐私政策约束：","tp_advertising":"（广告）","tp_analytics":"Google Analytics for Firebase & Firebase Crashlytics","tp_notifications":"（通知）","tp_purchases":"（购买）","li_weather":"可能会使用您的位置查询第三方天气数据提供商以显示当前状况。","h4":"4. 广告及您的选择","p_ads_intro":"广告由 Google AdMob 投放。您可以在设备上控制个性化广告：","li_android":"Android：设置 → Google → 广告 → 选择退出 / 重置您的广告 ID。","li_remove":"完全去除广告：在应用内购买一次性 Pro 升级。","h5":"5. 我们如何共享信息","p_share":"我们不会出售您的个人信息。信息仅与第 3 节所列的服务提供商共享，以便他们履行其职能（例如显示地图或广告），以及在法律、法律程序要求的情况下，或为保护我们用户、公众或我们的权利、安全或财产的情况下共享。","h6":"6. 数据保留","p_ret":"本应用创建的照片、视频和应用设置将保留在您的设备上，直到您删除它们或卸载本应用。第 3 节中第三方服务处理的数据将根据其各自的政策保留。","h7":"7. 安全","p_sec":"我们采取合理的技术和组织措施来保护信息。然而，没有任何应用、传输或存储系统是完全安全的，我们无法保证绝对安全。","h8":"8. 儿童隐私","p_child":"本应用并非面向 13 岁以下儿童（或您所在国家/地区所要求的最低年龄），我们不会故意收集他们的个人信息。如果您认为儿童向我们提供了信息，请联系我们，我们将予以删除。","h9":"9. 您的权利","p_rights":"根据您所在的地区（例如，GDPR 下的 EEA/UK，或 CCPA/CPRA 下的加利福尼亚州），您可能拥有访问、更正、删除或限制使用您个人信息的权利，以及选择退出某些处理的权利。您可以随时通过在设备设置中撤销本应用的位置、相机、存储或通知权限，以及通过重置或选择退出您的广告 ID 来行使设备级控制。要提出隐私请求，请使用以下详细信息联系我们。","h10":"10. 国际用户","p_intl":"本应用及其使用的第三方服务可能会在您所在国家/地区以外的国家/地区处理信息，这些国家/地区的数据保护法律可能有所不同。使用本应用即表示您同意根据本政策进行此类处理。","h11":"11. 本隐私政策的变更","p_changes":"我们可能会不时更新本隐私政策。任何变更都将在本页面上发布并附上修订后的生效日期，因此请定期查阅。变更生效后继续使用本应用即表示您接受更新后的政策。","h12":"12. 联系我们","p_contact":"如果您对本隐私政策或您的信息有任何疑问、请求或反馈，请通过以下方式联系我们：","footer":"© 2026 GO PRACHI LABS. 保留所有权利。"},"ui":{"ui_language":"语言","ui_note":"本翻译仅为方便您而提供。如有任何差异，以英文版本为具有法律权威的版本。"}},"zh-TW":{"privacy":{"title":"隱私權政策","eff":"生效日期：9 July 2026","intro":"本隱私權政策說明 GO PRACHI LABS（「我們」）在行動應用程式 GPS Map Camera & Compass（套件名稱 compass.photo.camera.map.gps.gpsmapcamera_compass）（「本應用程式」）方面如何處理資訊。您的隱私對我們很重要。請仔細閱讀本政策。使用本應用程式即表示您同意此處所述的做法。","note":"簡單來說：本應用程式會在您的相片上標註位置、顯示指南針和地圖，並顯示日月及天氣詳情。您的相片和位置在您的裝置上處理，不會上傳至我們自己的伺服器。如下所述，我們使用可信賴的 Google 服務來提供地圖、廣告、分析、當機報告、通知和購買功能。","h1":"1. 我們收集的資訊及使用方式","h_loc":"位置資訊（精確和大致）","p_loc":"在您授權的情況下，本應用程式會存取您裝置的 GPS 和以網路為基礎的位置以提供其核心功能：為您的相片和影片新增地理標記（將座標和地址嵌入影像）、在地圖上顯示您的位置、計算指南針方位、磁偏角以及您所在位置的日月和天氣詳情。位置在您的裝置上處理並嵌入您拍攝的媒體中。它可能會傳送給第 3 節列出的第三方服務（例如，用於算繪地圖或擷取天氣狀況）。我們不會在自己的伺服器上儲存您的位置。","h_cam":"相機、相片和媒體","p_cam":"在您授權的情況下，本應用程式使用您的相機拍攝相片和錄製影片，並讀取/寫入媒體，以便將您的拍攝內容儲存至您的圖庫並在應用程式內相簿中顯示。除非您選擇分享或匯出，否則您的相片和影片將保留在您的裝置上。我們不會上傳或保留您的相片或影片。","h_dev":"裝置和使用資訊","p_dev":"我們使用 Google Analytics for Firebase 和 Firebase Crashlytics 來了解本應用程式的使用情況並診斷當機。這可能包括應用程式事件（例如開啟的功能）、裝置型號、作業系統版本、應用程式版本、語言、大致地區/國家以及當機診斷資訊。這有助於我們修正錯誤並改善本應用程式。","h_ad":"廣告資訊","p_ad":"本應用程式的免費版本透過 Google AdMob 顯示廣告。AdMob 可能會存取您裝置的廣告識別碼和相關資料，以放送和衡量廣告，包括在允許的情況下放送個人化廣告。有關您的廣告選擇，請參閱第 4 節。","h_notif":"通知","p_notif":"如果您啟用通知，本應用程式會使用 Firebase Cloud Messaging（會產生裝置推播權杖）來傳送選用提醒，例如黃金時段提示。您可以隨時在裝置設定中關閉通知。","h_purch":"購買","p_purch":"如果您購買選用的一次性「移除廣告 / Pro」升級，交易將由 Google Play Billing 處理。我們會收到已完成購買的確認，以便為您解鎖 Pro 功能並為您還原這些功能。我們絕不會查看或儲存您的付款卡或帳單詳情——這些完全由 Google 處理。","h_provide":"您選擇提供的資訊","p_provide":"如果您向我們傳送電子郵件（以取得支援或提供意見回饋），我們會收到您傳送的電子郵件地址和訊息內容，並僅將其用於回覆您。","h2":"2. 感應器","p_sensors":"本應用程式讀取裝置運動感應器（加速度計和磁力計）以支援指南針、水平儀和傾斜功能。此感應器資料在您的裝置上即時使用，不屬於關於您的個人資訊。","h3":"3. 第三方服務","p_third_intro":"本應用程式仰賴以下第三方服務，每項服務均受其各自的隱私權政策約束：","tp_advertising":"（廣告）","tp_analytics":"Google Analytics for Firebase & Firebase Crashlytics","tp_notifications":"（通知）","tp_purchases":"（購買）","li_weather":"可能會使用您的位置查詢第三方天氣資料供應商以顯示目前狀況。","h4":"4. 廣告及您的選擇","p_ads_intro":"廣告由 Google AdMob 放送。您可以在裝置上控制個人化廣告：","li_android":"Android：設定 → Google → 廣告 → 選擇退出 / 重設您的廣告 ID。","li_remove":"完全移除廣告：在應用程式內購買一次性 Pro 升級。","h5":"5. 我們如何分享資訊","p_share":"我們不會出售您的個人資訊。資訊僅與第 3 節所列的服務供應商分享，以便他們履行其職能（例如顯示地圖或廣告），以及在法律、法律程序要求的情況下，或為保護我們使用者、大眾或我們的權利、安全或財產的情況下分享。","h6":"6. 資料保留","p_ret":"本應用程式建立的相片、影片和應用程式設定將保留在您的裝置上，直到您刪除它們或解除安裝本應用程式。第 3 節中第三方服務處理的資料將根據其各自的政策保留。","h7":"7. 安全","p_sec":"我們採取合理的技術和組織措施來保護資訊。然而，沒有任何應用程式、傳輸或儲存系統是完全安全的，我們無法保證絕對安全。","h8":"8. 兒童隱私","p_child":"本應用程式並非以 13 歲以下兒童（或您所在國家/地區所要求的最低年齡）為對象，我們不會故意收集他們的個人資訊。如果您認為兒童向我們提供了資訊，請聯絡我們，我們將予以刪除。","h9":"9. 您的權利","p_rights":"根據您所在的地區（例如，GDPR 下的 EEA/UK，或 CCPA/CPRA 下的加利福尼亞州），您可能擁有存取、更正、刪除或限制使用您個人資訊的權利，以及選擇退出某些處理的權利。您可以隨時透過在裝置設定中撤銷本應用程式的位置、相機、儲存空間或通知權限，以及透過重設或選擇退出您的廣告 ID 來行使裝置層級控制。若要提出隱私請求，請使用以下詳細資訊聯絡我們。","h10":"10. 國際使用者","p_intl":"本應用程式及其使用的第三方服務可能會在您所在國家/地區以外的國家/地區處理資訊，這些國家/地區的資料保護法律可能有所不同。使用本應用程式即表示您同意根據本政策進行此類處理。","h11":"11. 本隱私權政策的變更","p_changes":"我們可能會不時更新本隱私權政策。任何變更都將在本頁面上發布並附上修訂後的生效日期，因此請定期查閱。變更生效後繼續使用本應用程式即表示您接受更新後的政策。","h12":"12. 聯絡我們","p_contact":"如果您對本隱私權政策或您的資訊有任何疑問、請求或意見回饋，請透過以下方式聯絡我們：","footer":"© 2026 GO PRACHI LABS. 保留所有權利。"},"ui":{"ui_language":"語言","ui_note":"本翻譯僅為方便您而提供。如有任何差異，以英文版本為具有法律權威的版本。"}},"ja":{"privacy":{"title":"プライバシーポリシー","eff":"発効日: 9 July 2026","intro":"本プライバシーポリシーは、GO PRACHI LABS（以下「当社」）がモバイルアプリケーション GPS Map Camera & Compass（パッケージ名 compass.photo.camera.map.gps.gpsmapcamera_compass）（以下「本アプリ」）に関連して情報をどのように取り扱うかを説明するものです。お客様のプライバシーは当社にとって重要です。本ポリシーを注意深くお読みください。本アプリを使用することにより、お客様はここに記載された取り扱いに同意したものとみなされます。","note":"簡単に言えば、本アプリはお客様の写真に位置情報を刻印し、コンパスと地図を表示し、日の出・日の入り、月、天気の詳細を表示します。お客様の写真と位置情報はお客様の端末上で処理され、当社独自のサーバーにアップロードされることはありません。当社は、以下に説明するとおり、地図、広告、分析、クラッシュレポート、通知、購入のために信頼できる Google のサービスを使用します。","h1":"1. 当社が収集する情報とその利用方法","h_loc":"位置情報（正確なものおよびおおよそのもの）","p_loc":"お客様の許可を得て、本アプリは中核機能を提供するために端末の GPS およびネットワークベースの位置情報にアクセスします。すなわち、写真や動画へのジオタグ付け（座標と住所を画像に埋め込むこと）、地図上への現在地の表示、コンパスの方位、磁気偏角、およびお客様の位置に対応する日の出・日の入り、月、天気の詳細の計算です。位置情報はお客様の端末上で処理され、撮影したメディアに埋め込まれます。位置情報は第3条に記載された第三者サービスに送信される場合があります（例えば、地図を描画したり天気の状況を取得するため）。当社は当社独自のサーバーにお客様の位置情報を保存しません。","h_cam":"カメラ、写真、およびメディア","p_cam":"お客様の許可を得て、本アプリは写真の撮影や動画の録画のためにカメラを使用し、撮影したものをギャラリーに保存してアプリ内アルバムに表示できるようメディアの読み書きを行います。お客様の写真や動画は、お客様が共有またはエクスポートを選択しない限り、お客様の端末上に留まります。当社はお客様の写真や動画をアップロードまたは保持しません。","h_dev":"端末および利用状況に関する情報","p_dev":"当社は、本アプリの使用状況を把握し、クラッシュを診断するために Google Analytics for Firebase および Firebase Crashlytics を使用します。これには、アプリのイベント（開かれた機能など）、端末モデル、オペレーティングシステムのバージョン、アプリのバージョン、言語、およびおおよその地域／国、ならびにクラッシュの診断情報が含まれる場合があります。これは当社がバグを修正し本アプリを改善するのに役立ちます。","h_ad":"広告に関する情報","p_ad":"本アプリの無料版は Google AdMob を通じて広告を表示します。AdMob は、許可される範囲でのパーソナライズド広告を含め、広告を配信・測定するために端末の広告識別子および関連データにアクセスする場合があります。広告に関する選択肢については第4条をご覧ください。","h_notif":"通知","p_notif":"通知を有効にすると、本アプリは Firebase Cloud Messaging（端末プッシュトークンを生成します）を使用して、ゴールデンアワーのアラートなどの任意のリマインダーを配信します。通知は端末の設定でいつでもオフにできます。","h_purch":"購入","p_purch":"任意の一回限りの「広告を削除 / Pro」アップグレードを購入する場合、その取引は Google Play Billing によって処理されます。当社は Pro 機能を解除しお客様のために復元できるよう、購入が行われたことの確認を受け取ります。当社がお客様の支払いカードや請求の詳細を見たり保存したりすることは一切ありません。それらはすべて Google によって処理されます。","h_provide":"お客様が提供を選択する情報","p_provide":"お客様が当社にメールを送信する場合（サポートまたはフィードバックのため）、当社はお客様が送信したメールアドレスとメッセージの内容を受け取り、それをお客様への返信のためだけに使用します。","h2":"2. センサー","p_sensors":"本アプリは、コンパス、水準器、傾き機能を動作させるために端末のモーションセンサー（加速度センサーおよび磁気センサー）を読み取ります。このセンサーデータはお客様の端末上でリアルタイムに使用され、お客様に関する個人情報ではありません。","h3":"3. 第三者サービス","p_third_intro":"本アプリは以下の第三者サービスに依存しており、それぞれが独自のプライバシーポリシーによって規律されています。","tp_advertising":"（広告）","tp_analytics":"Google Analytics for Firebase & Firebase Crashlytics","tp_notifications":"（通知）","tp_purchases":"（購入）","li_weather":"現在の状況を表示するために、第三者の天気データ提供者がお客様の位置情報を用いて照会される場合があります。","h4":"4. 広告とお客様の選択肢","p_ads_intro":"広告は Google AdMob によって配信されます。お客様は端末上でパーソナライズド広告を制御できます。","li_android":"Android: 設定 → Google → 広告 → 広告 ID のオプトアウト／リセット。","li_remove":"広告を完全に削除する: 本アプリ内で一回限りの Pro アップグレードを購入します。","h5":"5. 情報の共有方法","p_share":"当社はお客様の個人情報を販売しません。情報は、第3条に記載されたサービスプロバイダーがその機能を実行できるようにするため（例えば、地図や広告の表示のため）にのみ共有され、また法律、法的手続きにより要求される場合、または当社のユーザー、公衆、もしくは当社の権利、安全、財産を保護するために共有されます。","h6":"6. データの保持","p_ret":"本アプリによって作成された写真、動画、およびアプリの設定は、お客様が削除するか本アプリをアンインストールするまでお客様の端末上に留まります。第3条の第三者サービスによって取り扱われるデータは、それぞれのポリシーに従って保持されます。","h7":"7. セキュリティ","p_sec":"当社は情報を保護するために合理的な技術的・組織的措置を講じます。ただし、完全に安全なアプリ、通信、または保存システムは存在せず、当社は絶対的な安全性を保証することはできません。","h8":"8. 子供のプライバシー","p_child":"本アプリは13歳未満（またはお客様の国で求められる最低年齢未満）の子供を対象としておらず、当社は意図的にそのような子供から個人情報を収集することはありません。子供が当社に情報を提供したと思われる場合は、当社にご連絡ください。当社はそれを削除します。","h9":"9. お客様の権利","p_rights":"お住まいの地域によっては（例えば、GDPR の下での EEA/UK、または CCPA/CPRA の下でのカリフォルニア）、お客様は自身の個人情報へのアクセス、訂正、削除、利用の制限を求める権利、および特定の処理をオプトアウトする権利を有する場合があります。お客様は、端末の設定で本アプリの位置情報、カメラ、ストレージ、または通知の権限を取り消すこと、および広告 ID をリセットまたはオプトアウトすることにより、いつでも端末レベルの制御を行使できます。プライバシーに関する請求を行うには、以下の詳細を用いて当社にご連絡ください。","h10":"10. 国際的なユーザー","p_intl":"本アプリおよびそれが使用する第三者サービスは、データ保護法が異なる可能性のあるお客様の国以外の国で情報を処理する場合があります。本アプリを使用することにより、お客様は本ポリシーに沿ったそのような処理に同意するものとします。","h11":"11. 本プライバシーポリシーの変更","p_changes":"当社は本プライバシーポリシーを随時更新する場合があります。変更があった場合は、改訂された発効日とともにこのページに掲載されますので、定期的にご確認ください。変更が発効した後も本アプリを継続して使用することは、更新されたポリシーへの同意を意味します。","h12":"12. お問い合わせ","p_contact":"本プライバシーポリシーまたはお客様の情報についてご質問、ご請求、またはご意見がある場合は、以下までお問い合わせください。","footer":"© 2026 GO PRACHI LABS. All rights reserved."},"ui":{"ui_language":"言語","ui_note":"この翻訳は便宜のために提供されています。相違がある場合は、英語版が法的に正式なものとなります。"}},"ko":{"privacy":{"title":"개인정보 처리방침","eff":"시행일: 9 July 2026","intro":"본 개인정보 처리방침은 GO PRACHI LABS(\"당사\")가 모바일 애플리케이션 GPS Map Camera & Compass(패키지 이름 compass.photo.camera.map.gps.gpsmapcamera_compass)(\"본 앱\")와 관련하여 정보를 어떻게 처리하는지 설명합니다. 귀하의 개인정보는 당사에 중요합니다. 본 방침을 주의 깊게 읽어 주십시오. 본 앱을 사용함으로써 귀하는 여기에 설명된 관행에 동의하는 것으로 간주됩니다.","note":"간단히 말해, 본 앱은 귀하의 사진에 위치를 각인하고 나침반과 지도를 표시하며 일출·일몰, 달, 날씨 세부정보를 표시합니다. 귀하의 사진과 위치는 귀하의 기기에서 처리되며 당사 자체 서버에 업로드되지 않습니다. 당사는 아래에 설명된 대로 지도, 광고, 분석, 오류 보고, 알림 및 구매를 위해 신뢰할 수 있는 Google 서비스를 사용합니다.","h1":"1. 당사가 수집하는 정보와 사용 방법","h_loc":"위치 정보(정밀 및 대략)","p_loc":"귀하의 허가를 받아, 본 앱은 핵심 기능을 제공하기 위해 기기의 GPS 및 네트워크 기반 위치에 접근합니다. 즉, 사진과 동영상에 지오태그를 추가하고(좌표와 주소를 이미지에 삽입), 지도에 귀하의 위치를 표시하며, 나침반 방위, 자기 편각, 그리고 귀하의 위치에 대한 일출·일몰, 달, 날씨 세부정보를 계산합니다. 위치는 귀하의 기기에서 처리되어 귀하가 촬영한 미디어에 삽입됩니다. 위치는 제3조에 나열된 제3자 서비스로 전송될 수 있습니다(예: 지도를 렌더링하거나 날씨 상태를 가져오기 위해). 당사는 당사 자체 서버에 귀하의 위치를 저장하지 않습니다.","h_cam":"카메라, 사진 및 미디어","p_cam":"귀하의 허가를 받아, 본 앱은 사진을 촬영하고 동영상을 녹화하기 위해 카메라를 사용하며, 촬영물을 갤러리에 저장하고 인앱 앨범에 표시할 수 있도록 미디어를 읽고 씁니다. 귀하의 사진과 동영상은 귀하가 공유하거나 내보내기를 선택하지 않는 한 귀하의 기기에 남아 있습니다. 당사는 귀하의 사진이나 동영상을 업로드하거나 보관하지 않습니다.","h_dev":"기기 및 사용 정보","p_dev":"당사는 본 앱이 어떻게 사용되는지 파악하고 오류를 진단하기 위해 Google Analytics for Firebase 및 Firebase Crashlytics를 사용합니다. 여기에는 앱 이벤트(예: 열린 기능), 기기 모델, 운영체제 버전, 앱 버전, 언어, 일반적인 지역/국가, 오류 진단 정보가 포함될 수 있습니다. 이는 당사가 버그를 수정하고 본 앱을 개선하는 데 도움이 됩니다.","h_ad":"광고 정보","p_ad":"본 앱의 무료 버전은 Google AdMob을 통해 광고를 표시합니다. AdMob은 허용되는 경우 맞춤 광고를 포함하여 광고를 게재하고 측정하기 위해 기기의 광고 식별자 및 관련 데이터에 접근할 수 있습니다. 광고 선택권에 대해서는 제4조를 참조하십시오.","h_notif":"알림","p_notif":"알림을 활성화하면, 본 앱은 Firebase Cloud Messaging(기기 푸시 토큰을 생성함)을 사용하여 골든아워 알림과 같은 선택적 리마인더를 전달합니다. 언제든지 기기 설정에서 알림을 끌 수 있습니다.","h_purch":"구매","p_purch":"선택적 일회성 \"광고 제거 / Pro\" 업그레이드를 구매하면, 해당 거래는 Google Play Billing에 의해 처리됩니다. 당사는 Pro 기능을 잠금 해제하고 귀하를 위해 복원할 수 있도록 구매가 이루어졌다는 확인을 받습니다. 당사는 귀하의 결제 카드나 청구 세부정보를 보거나 저장하지 않으며, 이는 전적으로 Google이 처리합니다.","h_provide":"귀하가 제공하기로 선택한 정보","p_provide":"귀하가 당사에 이메일을 보내는 경우(지원 또는 피드백을 위해), 당사는 귀하가 보낸 이메일 주소와 메시지 내용을 받으며 이를 귀하에게 응답하기 위해서만 사용합니다.","h2":"2. 센서","p_sensors":"본 앱은 나침반, 수평계, 기울기 기능을 구동하기 위해 기기의 모션 센서(가속도계 및 자력계)를 읽습니다. 이 센서 데이터는 귀하의 기기에서 실시간으로 사용되며 귀하에 관한 개인정보가 아닙니다.","h3":"3. 제3자 서비스","p_third_intro":"본 앱은 각각 자체 개인정보 처리방침의 적용을 받는 다음의 제3자 서비스에 의존합니다:","tp_advertising":"(광고)","tp_analytics":"Google Analytics for Firebase & Firebase Crashlytics","tp_notifications":"(알림)","tp_purchases":"(구매)","li_weather":"현재 상태를 표시하기 위해 제3자 날씨 데이터 제공업체가 귀하의 위치를 사용하여 조회될 수 있습니다.","h4":"4. 광고 및 귀하의 선택권","p_ads_intro":"광고는 Google AdMob에 의해 게재됩니다. 귀하는 기기에서 맞춤 광고를 제어할 수 있습니다:","li_android":"Android: 설정 → Google → 광고 → 광고 ID 옵트아웃 / 재설정.","li_remove":"광고 완전 제거: 본 앱에서 일회성 Pro 업그레이드를 구매합니다.","h5":"5. 당사의 정보 공유 방법","p_share":"당사는 귀하의 개인정보를 판매하지 않습니다. 정보는 제3조에 나열된 서비스 제공업체가 그 기능을 수행할 수 있도록(예: 지도 또는 광고 표시) 하기 위해서만, 그리고 법률, 법적 절차에 의해 요구되는 경우 또는 당사 사용자, 대중 또는 당사의 권리, 안전, 재산을 보호하기 위해서만 공유됩니다.","h6":"6. 데이터 보존","p_ret":"본 앱으로 생성된 사진, 동영상 및 앱 설정은 귀하가 삭제하거나 본 앱을 제거할 때까지 귀하의 기기에 남아 있습니다. 제3조의 제3자 서비스가 처리하는 데이터는 각자의 방침에 따라 보존됩니다.","h7":"7. 보안","p_sec":"당사는 정보를 보호하기 위해 합리적인 기술적 및 조직적 조치를 취합니다. 그러나 완전히 안전한 앱, 전송 또는 저장 시스템은 없으며, 당사는 절대적인 보안을 보장할 수 없습니다.","h8":"8. 아동의 개인정보","p_child":"본 앱은 13세 미만(또는 귀하의 국가에서 요구하는 최소 연령 미만)의 아동을 대상으로 하지 않으며, 당사는 그들로부터 고의로 개인정보를 수집하지 않습니다. 아동이 당사에 정보를 제공했다고 생각되는 경우 당사에 연락해 주시면 삭제하겠습니다.","h9":"9. 귀하의 권리","p_rights":"귀하가 거주하는 곳에 따라(예: GDPR 하의 EEA/UK 또는 CCPA/CPRA 하의 캘리포니아), 귀하는 개인정보에 대한 접근, 정정, 삭제 또는 사용 제한을 요구할 권리와 특정 처리를 옵트아웃할 권리를 가질 수 있습니다. 귀하는 기기 설정에서 본 앱의 위치, 카메라, 저장소 또는 알림 권한을 취소하고 광고 ID를 재설정하거나 옵트아웃함으로써 언제든지 기기 수준의 제어를 행사할 수 있습니다. 개인정보 요청을 하려면 아래 세부정보를 사용하여 당사에 연락하십시오.","h10":"10. 국제 사용자","p_intl":"본 앱과 그것이 사용하는 제3자 서비스는 데이터 보호법이 다를 수 있는 귀하의 국가 이외의 국가에서 정보를 처리할 수 있습니다. 본 앱을 사용함으로써 귀하는 본 방침에 부합하는 그러한 처리에 동의합니다.","h11":"11. 본 개인정보 처리방침의 변경","p_changes":"당사는 본 개인정보 처리방침을 수시로 업데이트할 수 있습니다. 변경 사항은 개정된 시행일과 함께 이 페이지에 게시되므로 정기적으로 검토해 주십시오. 변경이 발효된 후 본 앱을 계속 사용하는 것은 업데이트된 방침을 수락함을 의미합니다.","h12":"12. 문의처","p_contact":"본 개인정보 처리방침 또는 귀하의 정보에 관한 질문, 요청 또는 피드백이 있으시면 다음으로 연락해 주십시오:","footer":"© 2026 GO PRACHI LABS. All rights reserved."},"ui":{"ui_language":"언어","ui_note":"이 번역은 귀하의 편의를 위해 제공됩니다. 불일치가 있는 경우 영어 버전이 법적으로 유효한 것입니다."}},"sw":{"privacy":{"title":"Sera ya Faragha","eff":"Tarehe ya kuanza kutumika: 9 July 2026","intro":"Sera hii ya Faragha inaeleza jinsi GO PRACHI LABS (\"sisi\", \"letu\") inavyoshughulikia taarifa kuhusiana na programu ya simu ya GPS Map Camera & Compass (jina la kifurushi compass.photo.camera.map.gps.gpsmapcamera_compass) (\"Programu\"). Faragha yako ni muhimu kwetu. Tafadhali soma sera hii kwa makini. Kwa kutumia Programu, unakubali mazoea yaliyoelezwa hapa.","note":"Kwa maneno rahisi: Programu hutia alama picha zako kwa mahali ulipo, huonyesha dira na ramani, na huonyesha maelezo ya jua/mwezi na hali ya hewa. Picha zako na mahali ulipo huchakatwa kwenye kifaa chako na hazipakiwi kwenye seva zetu wenyewe. Tunatumia huduma za Google zinazoaminika kwa ramani, matangazo, uchanganuzi, ripoti za hitilafu, arifa, na manunuzi, kama ilivyoelezwa hapa chini.","h1":"1. Taarifa tunazokusanya na jinsi tunavyozitumia","h_loc":"Taarifa za mahali (sahihi na za kadirio)","p_loc":"Kwa ruhusa yako, Programu hufikia GPS ya kifaa chako na mahali kulingana na mtandao ili kutoa vipengele vyake vya msingi: kutia alama za kijiografia kwenye picha na video zako (kuingiza kuratibu na anwani kwenye picha), kuonyesha nafasi yako kwenye ramani, kukokotoa mwelekeo wa dira, mkengeuko wa sumaku, na maelezo ya jua/mwezi na hali ya hewa kwa mahali ulipo. Mahali huchakatwa kwenye kifaa chako na kuingizwa kwenye midia unayonasa. Yanaweza kutumwa kwa huduma za wahusika wengine zilizoorodheshwa katika Sehemu ya 3 (kwa mfano, kuonyesha ramani au kupata hali ya hewa). Hatuhifadhi mahali ulipo kwenye seva zetu wenyewe.","h_cam":"Kamera, picha, na midia","p_cam":"Kwa ruhusa yako, Programu hutumia kamera yako kupiga picha na kurekodi video, na husoma/kuandika midia ili iweze kuhifadhi picha ulizonasa kwenye ghala lako na kuzionyesha kwenye albamu ndani ya programu. Picha na video zako hubaki kwenye kifaa chako isipokuwa uchague kuzishiriki au kuzihamisha. Hatupakii wala kuhifadhi picha au video zako.","h_dev":"Taarifa za kifaa na matumizi","p_dev":"Tunatumia Google Analytics for Firebase na Firebase Crashlytics kuelewa jinsi Programu inavyotumika na kutambua hitilafu. Hii inaweza kujumuisha matukio ya programu (kama vile vipengele vilivyofunguliwa), aina ya kifaa, toleo la mfumo wa uendeshaji, toleo la programu, lugha, na eneo/nchi kwa ujumla, na uchunguzi wa hitilafu. Hii hutusaidia kurekebisha hitilafu na kuboresha Programu.","h_ad":"Taarifa za matangazo","p_ad":"Toleo la bure la Programu huonyesha matangazo kupitia Google AdMob. AdMob inaweza kufikia kitambulishi cha matangazo cha kifaa chako na data inayohusiana ili kutoa na kupima matangazo, ikijumuisha matangazo yaliyobinafsishwa pale inaporuhusiwa. Angalia Sehemu ya 4 kwa chaguo zako za matangazo.","h_notif":"Arifa","p_notif":"Ukiwezesha arifa, Programu hutumia Firebase Cloud Messaging (ambayo hutengeneza tokeni ya kusukuma ya kifaa) kutuma vikumbusho vya hiari kama vile arifa za saa ya dhahabu. Unaweza kuzima arifa wakati wowote katika mipangilio ya kifaa chako.","h_purch":"Manunuzi","p_purch":"Ukinunua uboreshaji wa hiari wa mara moja wa \"Ondoa Matangazo / Pro\", muamala huchakatwa na Google Play Billing. Tunapokea uthibitisho kwamba manunuzi yamefanyika ili tuweze kufungua vipengele vya Pro na kukurudishia. Hatuoni wala kuhifadhi kadi yako ya malipo au maelezo ya bili — hizo hushughulikiwa kabisa na Google.","h_provide":"Taarifa unazochagua kutoa","p_provide":"Ukitutumia barua pepe (kwa msaada au maoni), tunapokea anwani ya barua pepe na maudhui ya ujumbe unaotuma, na tunayatumia tu kukujibu.","h2":"2. Vitambuzi","p_sensors":"Programu husoma vitambuzi vya mwendo vya kifaa (kipima-kasi na kipima-sumaku) ili kuendesha vipengele vya dira, usawa, na mwinamo. Data hii ya kitambuzi hutumika kwenye kifaa chako kwa wakati halisi na si taarifa binafsi kukuhusu.","h3":"3. Huduma za wahusika wengine","p_third_intro":"Programu inategemea huduma zifuatazo za wahusika wengine, kila moja ikitawaliwa na sera yake ya faragha:","tp_advertising":"(matangazo)","tp_analytics":"Google Analytics for Firebase & Firebase Crashlytics","tp_notifications":"(arifa)","tp_purchases":"(manunuzi)","li_weather":"Mtoa data wa hali ya hewa wa mhusika mwingine anaweza kuulizwa kwa kutumia mahali ulipo ili kuonyesha hali za sasa.","h4":"4. Matangazo na chaguo zako","p_ads_intro":"Matangazo hutolewa na Google AdMob. Unaweza kudhibiti matangazo yaliyobinafsishwa kwenye kifaa chako:","li_android":"Android: Mipangilio → Google → Matangazo → jiondoe / weka upya kitambulishi chako cha matangazo.","li_remove":"Kuondoa matangazo kabisa: nunua uboreshaji wa Pro wa mara moja ndani ya Programu.","h5":"5. Jinsi tunavyoshiriki taarifa","p_share":"Hatuuzi taarifa zako binafsi. Taarifa hushirikiwa tu na watoa huduma walioorodheshwa katika Sehemu ya 3 ili waweze kutekeleza majukumu yao (kwa mfano, kuonyesha ramani au matangazo), na pale inapohitajika na sheria, mchakato wa kisheria, au kulinda haki, usalama, au mali ya watumiaji wetu, umma, au sisi.","h6":"6. Uhifadhi wa data","p_ret":"Picha, video, na mipangilio ya programu iliyoundwa na Programu hubaki kwenye kifaa chako hadi uifute au uondoe Programu. Data inayoshughulikiwa na huduma za wahusika wengine katika Sehemu ya 3 huhifadhiwa kulingana na sera zao husika.","h7":"7. Usalama","p_sec":"Tunachukua hatua zinazofaa za kiufundi na kishirika kulinda taarifa. Hata hivyo, hakuna programu, upitishaji, au mfumo wa kuhifadhi ulio salama kabisa, na hatuwezi kuhakikisha usalama kamili.","h8":"8. Faragha ya watoto","p_child":"Programu haielekezwi kwa watoto walio chini ya miaka 13 (au umri wa chini unaohitajika nchini kwako), na hatukusanyi kwa makusudi taarifa binafsi kutoka kwao. Ukiamini mtoto ametupatia taarifa, tafadhali wasiliana nasi na tutazifuta.","h9":"9. Haki zako","p_rights":"Kulingana na mahali unapoishi (kwa mfano, EEA/UK chini ya GDPR, au California chini ya CCPA/CPRA), unaweza kuwa na haki za kufikia, kurekebisha, kufuta, au kuzuia matumizi ya taarifa zako binafsi, na kujiondoa katika uchakataji fulani. Unaweza kutumia udhibiti wa kiwango cha kifaa wakati wowote kwa kubatilisha ruhusa za Programu za mahali, kamera, hifadhi, au arifa katika mipangilio ya kifaa chako, na kwa kuweka upya au kujiondoa kwenye kitambulishi chako cha matangazo. Kufanya ombi la faragha, wasiliana nasi kwa kutumia maelezo yaliyo hapa chini.","h10":"10. Watumiaji wa kimataifa","p_intl":"Programu na huduma za wahusika wengine inazotumia zinaweza kuchakata taarifa katika nchi tofauti na yako, ambapo sheria za ulinzi wa data zinaweza kutofautiana. Kwa kutumia Programu unakubali uchakataji kama huo unaolingana na sera hii.","h11":"11. Mabadiliko ya Sera hii ya Faragha","p_changes":"Tunaweza kusasisha Sera hii ya Faragha mara kwa mara. Mabadiliko yoyote yatawekwa kwenye ukurasa huu na tarehe iliyorekebishwa ya kuanza kutumika, kwa hivyo tafadhali iangalie mara kwa mara. Kuendelea kutumia Programu baada ya mabadiliko kuanza kutumika kunamaanisha unakubali sera iliyosasishwa.","h12":"12. Wasiliana nasi","p_contact":"Ikiwa una maswali, maombi, au maoni kuhusu Sera hii ya Faragha au taarifa zako, wasiliana nasi kupitia:","footer":"© 2026 GO PRACHI LABS. All rights reserved."},"ui":{"ui_language":"Lugha","ui_note":"Tafsiri hii inatolewa kwa urahisi wako. Iwapo kutakuwa na tofauti yoyote, toleo la Kiingereza ndilo lenye mamlaka ya kisheria."}},"am":{"privacy":{"title":"የግላዊነት ፖሊሲ","eff":"የሚጸናበት ቀን፦ 9 July 2026","intro":"ይህ የግላዊነት ፖሊሲ GO PRACHI LABS (\"እኛ\"፣ \"የእኛ\") ከሞባይል መተግበሪያው GPS Map Camera & Compass (የጥቅል ስም compass.photo.camera.map.gps.gpsmapcamera_compass) (\"መተግበሪያው\") ጋር በተያያዘ መረጃን እንዴት እንደሚይዝ ያብራራል። ግላዊነትዎ ለእኛ አስፈላጊ ነው። እባክዎ ይህን ፖሊሲ በጥንቃቄ ያንብቡ። መተግበሪያውን በመጠቀም እዚህ የተገለጹትን ልማዶች ተስማምተዋል።","note":"በቀላል አነጋገር፦ መተግበሪያው ፎቶዎችዎን በአካባቢዎ ያትማል፣ ኮምፓስና ካርታዎችን ያሳያል፣ እንዲሁም የፀሐይ/ጨረቃና የአየር ሁኔታ ዝርዝሮችን ያሳያል። ፎቶዎችዎና አካባቢዎ በመሣሪያዎ ላይ ይሠራሉ እንጂ ወደ የራሳችን ሰርቨሮች አይሰቀሉም። ከዚህ በታች እንደተገለጸው ለካርታ፣ ለማስታወቂያ፣ ለትንተና፣ ለብልሽት ሪፖርት፣ ለማሳወቂያዎችና ለግዢዎች የታመኑ የ Google አገልግሎቶችን እንጠቀማለን።","h1":"1. የምንሰበስበው መረጃና እንዴት እንደምንጠቀምበት","h_loc":"የአካባቢ መረጃ (ትክክለኛና ግምታዊ)","p_loc":"በእርስዎ ፈቃድ፣ መተግበሪያው ዋና ተግባራቱን ለማቅረብ የመሣሪያዎን GPS እና በኔትወርክ ላይ የተመሠረተ አካባቢ ይደርሳል፦ ፎቶዎችዎና ቪዲዮዎችዎ ላይ የጂኦ-መለያ ማድረግ (መጋጠሚያዎችንና አድራሻን ወደ ምስሉ ማካተት)፣ አቀማመጥዎን በካርታ
