or Firebase & Firebase Crashlytics","tp_notifications":"(ማሳወቂያዎች)","tp_purchases":"(ግዢዎች)","li_weather":"የአሁኑን ሁኔታ ለማሳየት የሶስተኛ ወገን የአየር ሁኔታ ውሂብ አቅራቢ አካባቢዎን በመጠቀም ሊጠየቅ ይችላል።","h4":"4. ማስታወቂያዎችና ምርጫዎችዎ","p_ads_intro":"ማስታወቂያዎች በ Google AdMob ይቀርባሉ። በመሣሪያዎ ላይ የግል-ተኮር ማስታወቂያዎችን መቆጣጠር ይችላሉ፦","li_android":"Android፦ ቅንብሮች → Google → ማስታወቂያዎች → የማስታወቂያ መለያዎን ያስወግዱ / ዳግም ያስጀምሩ።","li_remove":"ማስታወቂያዎችን ሙሉ በሙሉ ማስወገድ፦ በመተግበሪያው ውስጥ የአንድ-ጊዜ Pro ማሻሻያ ይግዙ።","h5":"5. መረጃን እንዴት እንደምናጋራ","p_share":"የግል መረጃዎን አንሸጥም። መረጃ የሚጋራው በክፍል 3 ውስጥ ከተዘረዘሩ የአገልግሎት አቅራቢዎች ጋር ብቻ ተግባራቸውን እንዲያከናውኑ (ለምሳሌ ካርታዎችን ወይም ማስታወቂያዎችን ማሳየት)፣ እና በሕግ፣ በሕጋዊ ሂደት በሚፈለግበት፣ ወይም የተጠቃሚዎቻችንን፣ የሕዝብን ወይም የእኛን መብቶች፣ ደህንነት ወይም ንብረት ለመጠበቅ ነው።","h6":"6. የውሂብ ማቆያ","p_ret":"በመተግበሪያው የተፈጠሩ ፎቶዎች፣ ቪዲዮዎችና የመተግበሪያ ቅንብሮች እስክትሰርዟቸው ወይም መተግበሪያውን እስከምታስወግዱ ድረስ በመሣሪያዎ ላይ ይቆያሉ። በክፍል 3 ውስጥ ባሉ የሶስተኛ ወገን አገልግሎቶች የሚያዙ ውሂቦች እንደየፖሊሲዎቻቸው ይቆያሉ።","h7":"7. ደህንነት","p_sec":"መረጃን ለመጠበቅ ተገቢ የቴክኒክና የድርጅት እርምጃዎችን እንወስዳለን። ሆኖም፣ ምንም መተግበሪያ፣ ማስተላለፊያ ወይም የማከማቻ ስርዓት ሙሉ በሙሉ ደህንነቱ የተጠበቀ አይደለም፣ እናም ፍጹም ደህንነትን ማረጋገጥ አንችልም።","h8":"8. የልጆች ግላዊነት","p_child":"መተግበሪያው ከ13 ዓመት በታች (ወይም በሀገርዎ የሚፈለገው ዝቅተኛ ዕድሜ) ላሉ ልጆች የተመራ አይደለም፣ እናም ከእነሱ ሆን ብለን የግል መረጃ አንሰበስብም። ልጅ መረጃ ሰጥቶናል ብለው ካመኑ፣ እባክዎ ያግኙን እኛም እንሰርዘዋለን።","h9":"9. መብቶችዎ","p_rights":"በሚኖሩበት ቦታ ላይ በመመስረት (ለምሳሌ EEA/UK በ GDPR ስር፣ ወይም California በ CCPA/CPRA ስር)፣ የግል መረጃዎን የመድረስ፣ የማረም፣ የመሰረዝ ወይም አጠቃቀሙን የመገደብ፣ እና ከተወሰኑ አሠራሮች ራስዎን የማግለል መብቶች ሊኖሩዎት ይችላሉ። በመሣሪያዎ ቅንብሮች ውስጥ የመተግበሪያውን የአካባቢ፣ የካሜራ፣ የማከማቻ ወይም የማሳወቂያ ፈቃዶች በመሻር፣ እና የማስታወቂያ መለያዎን ዳግም በማስጀመር ወይም ራስዎን በማግለል በማንኛውም ጊዜ የመሣሪያ-ደረጃ ቁጥጥሮችን መጠቀም ይችላሉ። የግላዊነት ጥያቄ ለማድረግ፣ ከዚህ በታች ያሉትን ዝርዝሮች በመጠቀም ያግኙን።","h10":"10. ዓለም አቀፍ ተጠቃሚዎች","p_intl":"መተግበሪያውና የሚጠቀማቸው የሶስተኛ ወገን አገልግሎቶች የውሂብ ጥበቃ ሕጎች ሊለያዩ በሚችሉባቸው ከእርስዎ ውጭ ባሉ ሀገራት ውስጥ መረጃን ሊሠሩ ይችላሉ። መተግበሪያውን በመጠቀም ከዚህ ፖሊሲ ጋር የሚስማማ እንዲህ ያለውን አሠራር ተስማምተዋል።","h11":"11. በዚህ የግላዊነት ፖሊሲ ላይ ለውጦች","p_changes":"ይህን የግላዊነት ፖሊሲ ከጊዜ ወደ ጊዜ ልናዘምነው እንችላለን። ማንኛውም ለውጥ በተሻሻለ የሚጸናበት ቀን ጋር በዚህ ገጽ ላይ ይለጠፋል፣ ስለዚህ እባክዎ በየጊዜው ይገምግሙት። ለውጦች ከጸኑ በኋላ መተግበሪያውን መጠቀም መቀጠል የተዘመነውን ፖሊሲ መቀበልዎን ያመለክታል።","h12":"12. ያግኙን","p_contact":"ስለዚህ የግላዊነት ፖሊሲ ወይም ስለ መረጃዎ ጥያቄዎች፣ ጥያቄዎች ወይም አስተያየቶች ካሉዎት፣ በሚከተለው ያግኙን፦","footer":"© 2026 GO PRACHI LABS. All rights reserved."},"ui":{"ui_language":"ቋንቋ","ui_note":"ይህ ትርጉም ለምቾትዎ ተሰጥቷል። ማንኛውም ልዩነት ቢኖር፣ የእንግሊዝኛው ስሪት በሕግ ተቀባይነት ያለው ነው።"}},"ha":{"privacy":{"title":"Manufar Sirri","eff":"Ranar fara aiki: 9 July 2026","intro":"Wannan Manufar Sirri tana bayyana yadda GO PRACHI LABS (\"mu\", \"namu\") ke sarrafa bayanai dangane da manhajar wayar salula ta GPS Map Camera & Compass (sunan fakiti compass.photo.camera.map.gps.gpsmapcamera_compass) (\"Manhajar\"). Sirrinku yana da muhimmanci a gare mu. Da fatan za a karanta wannan manufa a hankali. Ta hanyar amfani da Manhajar, kun yarda da ayyukan da aka bayyana a nan.","note":"A takaice: Manhajar tana buga hoton wurin da kuke a hotunanku, tana nuna kamfas da taswirori, kuma tana nuna bayanan rana/wata da yanayi. Ana sarrafa hotunanku da wurin da kuke a na'urarku kuma ba a ɗora su zuwa sabobinmu ba. Muna amfani da amintattun ayyukan Google don taswirori, tallace-tallace, nazari, rahoton fashewa, sanarwa, da sayayya, kamar yadda aka bayyana a ƙasa.","h1":"1. Bayanan da muke tarawa da yadda muke amfani da su","h_loc":"Bayanan wuri (madaidaici da kusan-kusan)","p_loc":"Da izininku, Manhajar tana samun damar GPS na na'urarku da wurin da ya dogara da hanyar sadarwa don samar da mahimman abubuwanta: yiwa hotunanku da bidiyoyinku alamar wuri (saka masu daidaitawa da adireshi cikin hoton), nuna wurin ku a taswira, ƙididdige alkiblar kamfas, karkatar da maganadisu, da bayanan rana/wata da yanayi don wurin ku. Ana sarrafa wurin a na'urarku kuma a saka shi cikin kafofin da kuke ɗauka. Za a iya aika shi zuwa ayyukan wasu ɓangarori da aka lissafa a Sashe na 3 (misali, don nuna taswirori ko dawo da yanayin sararin sama). Ba ma adana wurin ku a sabobinmu ba.","h_cam":"Kamara, hotuna, da kafofi","p_cam":"Da izininku, Manhajar tana amfani da kamararku don ɗaukar hotuna da yin rikodin bidiyoyi, kuma tana karantawa/rubuta kafofi don ta iya adana abin da kuka ɗauka a cikin hoton ku da nuna su a cikin album ɗin da ke cikin manhajar. Hotunanku da bidiyoyinku suna kasancewa a na'urarku sai dai idan kun zaɓi raba su ko fitar da su. Ba ma ɗorawa ko riƙe hotunanku ko bidiyoyinku ba.","h_dev":"Bayanan na'ura da amfani","p_dev":"Muna amfani da Google Analytics for Firebase da Firebase Crashlytics don fahimtar yadda ake amfani da Manhajar da gano fashewa. Wannan na iya haɗawa da abubuwan da suka faru na manhajar (kamar abubuwan da aka buɗe), samfurin na'ura, sigar tsarin aiki, sigar manhajar, harshe, da yanki/ƙasa gaba ɗaya, da binciken fashewa. Wannan yana taimaka mana gyara kurakurai da inganta Manhajar.","h_ad":"Bayanan talla","p_ad":"Sigar kyauta ta Manhajar tana nuna tallace-tallace ta hanyar Google AdMob. AdMob na iya samun damar mai gano talla na na'urarku da bayanan da suka danganci don gabatarwa da auna tallace-tallace, gami da tallace-tallace na keɓaɓɓu inda aka ba da izini. Duba Sashe na 4 don zaɓinku na talla.","h_notif":"Sanarwa","p_notif":"Idan kun kunna sanarwa, Manhajar tana amfani da Firebase Cloud Messaging (wanda ke samar da alamar tura na na'ura) don isar da tunatarwa na zaɓi kamar faɗakarwar sa'ar zinariya. Kuna iya kashe sanarwa a kowane lokaci a cikin saitunan na'urarku.","h_purch":"Sayayya","p_purch":"Idan kun sayi haɓakawar zaɓi na sau ɗaya na \"Cire Tallace-tallace / Pro\", Google Play Billing ne ke sarrafa ma'amalar. Muna karɓar tabbaci cewa an yi sayayya don mu iya buɗe abubuwan Pro da dawo da su gare ku. Ba mu taɓa ganin ko adana katin biyanku ko bayanan lissafi ba — Google ne ke sarrafa waɗannan gaba ɗaya.","h_provide":"Bayanan da kuka zaɓi bayarwa","p_provide":"Idan kun aiko mana da imel (don tallafi ko ra'ayi), muna karɓar adireshin imel da abin da ke cikin saƙon da kuka aika, kuma muna amfani da shi ne kawai don amsa muku.","h2":"2. Na'urorin gwaji","p_sensors":"Manhajar tana karanta na'urorin gwajin motsi na na'ura (accelerometer da magnetometer) don sarrafa abubuwan kamfas, matakin daidaito, da karkata. Ana amfani da wannan bayanan na'urar gwaji a na'urarku a ainihin lokaci kuma ba bayanan sirri game da ku ba ne.","h3":"3. Ayyukan wasu ɓangarori","p_third_intro":"Manhajar tana dogara ga ayyukan wasu ɓangarori masu zuwa, kowanne yana ƙarƙashin manufar sirrinsa:","tp_advertising":"(talla)","tp_analytics":"Google Analytics for Firebase & Firebase Crashlytics","tp_notifications":"(sanarwa)","tp_purchases":"(sayayya)","li_weather":"Ana iya tambayar mai bayar da bayanan yanayi na wani ɓangare ta amfani da wurin ku don nuna yanayin yanzu.","h4":"4. Tallace-tallace da zaɓinku","p_ads_intro":"Google AdMob ne ke gabatar da tallace-tallace. Kuna iya sarrafa tallace-tallace na keɓaɓɓu a na'urarku:","li_android":"Android: Saituna → Google → Tallace-tallace → cire kai / sake saita ID ɗin tallanku.","li_remove":"Cire tallace-tallace gaba ɗaya: sayi haɓakawar Pro na sau ɗaya a cikin Manhajar.","h5":"5. Yadda muke raba bayanai","p_share":"Ba ma sayar da bayananku na sirri ba. Ana raba bayanai ne kawai da masu ba da sabis da aka lissafa a Sashe na 3 don su iya yin ayyukansu (misali, nuna taswirori ko tallace-tallace), da kuma inda doka, tsarin shari'a suka buƙata, ko don kare haƙƙoƙi, aminci, ko dukiyar masu amfani da mu, jama'a, ko mu.","h6":"6. Riƙe bayanai","p_ret":"Hotuna, bidiyoyi, da saitunan manhajar da Manhajar ta ƙirƙira suna kasancewa a na'urarku har sai kun goge su ko kun cire Manhajar. Ana riƙe bayanan da ayyukan wasu ɓangarori a Sashe na 3 ke sarrafawa bisa ga manufofinsu.","h7":"7. Tsaro","p_sec":"Muna ɗaukar matakan fasaha da na ƙungiya masu ma'ana don kare bayanai. Duk da haka, babu wata manhaja, aikawa, ko tsarin ajiya da ke da cikakken tsaro, kuma ba za mu iya tabbatar da cikakken tsaro ba.","h8":"8. Sirrin yara","p_child":"Ba a shirya Manhajar don yara 'yan ƙasa da shekaru 13 ba (ko mafi ƙarancin shekarun da ake buƙata a ƙasarku), kuma ba ma tara bayanan sirri daga gare su da gangan ba. Idan kun yi imani cewa yaro ya ba mu bayanai, da fatan za a tuntuɓe mu kuma za mu goge shi.","h9":"9. Haƙƙoƙinku","p_rights":"Dangane da inda kuke zaune (misali, EEA/UK ƙarƙashin GDPR, ko California ƙarƙashin CCPA/CPRA), kuna iya samun haƙƙin samun dama, gyara, gogewa, ko taƙaita amfani da bayananku na sirri, da kuma janyewa daga wasu sarrafawa. Kuna iya amfani da sarrafa matakin na'ura a kowane lokaci ta hanyar soke izinin Manhajar na wuri, kamara, ajiya, ko sanarwa a cikin saitunan na'urarku, da kuma ta sake saitawa ko janyewa daga ID ɗin tallanku. Don yin buƙatar sirri, ku tuntuɓe mu ta amfani da bayanan da ke ƙasa.","h10":"10. Masu amfani na duniya","p_intl":"Manhajar da ayyukan wasu ɓangarori da take amfani da su na iya sarrafa bayanai a ƙasashe ban da naku, inda dokokin kare bayanai za su iya bambanta. Ta hanyar amfani da Manhajar kun yarda da irin wannan sarrafawa da ya dace da wannan manufa.","h11":"11. Canje-canje ga wannan Manufar Sirri","p_changes":"Za mu iya sabunta wannan Manufar Sirri lokaci zuwa lokaci. Za a saka duk wani canji a wannan shafin tare da gyararren ranar fara aiki, don haka da fatan za a duba shi lokaci-lokaci. Ci gaba da amfani da Manhajar bayan canje-canje sun fara aiki yana nufin kun yarda da manufar da aka sabunta.","h12":"12. Tuntuɓe mu","p_contact":"Idan kuna da tambayoyi, buƙatu, ko ra'ayi game da wannan Manufar Sirri ko bayananku, ku tuntuɓe mu a:","footer":"© 2026 GO PRACHI LABS. All rights reserved."},"ui":{"ui_language":"Harshe","ui_note":"An bayar da wannan fassara don saukin ku. Idan akwai wani bambanci, sigar Turanci ce mai iko a shari'a."}},"yo":{"privacy":{"title":"Ìlànà Àṣírí","eff":"Ọjọ́ ìbẹ̀rẹ̀ ìṣiṣẹ́: 9 July 2026","intro":"Ìlànà Àṣírí yìí ṣàlàyé bí GO PRACHI LABS (\"àwa\", \"tiwa\") ṣe ń mú àwọn ìsọfúnni ní ìbámu pẹ̀lú ohun-èlò fóònù alágbèéká GPS Map Camera & Compass (orúkọ package compass.photo.camera.map.gps.gpsmapcamera_compass) (\"Ohun-èlò náà\"). Àṣírí rẹ ṣe pàtàkì fún wa. Jọ̀wọ́ ka ìlànà yìí dáradára. Nípa lílo Ohun-èlò náà, o gbà pẹ̀lú àwọn ìwà tí a ṣàlàyé níbí.","note":"Ní ọ̀rọ̀ tí ó rọrùn: Ohun-èlò náà ń tẹ ipò rẹ sí àwọn fọ́tò rẹ, ó ń fi kọmpási àti àwòrán-ilẹ̀ hàn, ó sì ń fi àwọn ẹ̀kúnrẹ́rẹ́ oòrùn/òṣùpá àti ojú-ọjọ́ hàn. A ń ṣàgbéyẹ̀wò àwọn fọ́tò rẹ àti ipò rẹ lórí ẹ̀rọ rẹ, a kò sì gbé wọn sórí àwọn olùpín-ìsọfúnni tiwa fúnra wa. A ń lo àwọn iṣẹ́ Google tí a gbẹ́kẹ̀lé fún àwòrán-ilẹ̀, ìpolówó, àtúpalẹ̀, ìròyìn ìjàǹbá, àwọn ìfìtọ́nilétí, àti àwọn ìrajà, gẹ́gẹ́ bí a ṣe ṣàlàyé nísàlẹ̀.","h1":"1. Àwọn ìsọfúnni tí a ń kójọ àti bí a ṣe ń lò wọ́n","h_loc":"Ìsọfúnni ipò (pípé àti ìsúnmọ́)","p_loc":"Pẹ̀lú ìyọ̀ǹda rẹ, Ohun-èlò náà ń wọ inú GPS ẹ̀rọ rẹ àti ipò tí ó dá lórí nẹ́tíwọ́ọ̀kì láti pèsè àwọn àbùdá pàtàkì rẹ̀: fífi àmì-ilẹ̀ sí àwọn fọ́tò àti fídíò rẹ (fífi àwọn ìṣàkóso àti àdírẹ́sì sínú àwòrán), fífi ipò rẹ hàn lórí àwòrán-ilẹ̀, ṣíṣírò ìtọ́sọ́nà kọmpási, ìyapa oofà, àti àwọn ẹ̀kúnrẹ́rẹ́ oòrùn/òṣùpá àti ojú-ọjọ́ fún ipò rẹ. A ń ṣàgbéyẹ̀wò ipò lórí ẹ̀rọ rẹ, a sì fi í sínú media tí o ń mú. A lè fi í ránṣẹ́ sí àwọn iṣẹ́ ẹnìkẹ́ta tí a tò nínú Apá 3 (fún àpẹẹrẹ, láti fi àwòrán-ilẹ̀ hàn tàbí gba ipò ojú-ọjọ́). A kò ṣàfipamọ́ ipò rẹ sórí àwọn olùpín-ìsọfúnni tiwa fúnra wa.","h_cam":"Kámẹ́rà, àwọn fọ́tò, àti media","p_cam":"Pẹ̀lú ìyọ̀ǹda rẹ, Ohun-èlò náà ń lo kámẹ́rà rẹ láti ya àwọn fọ́tò àti gba àwọn fídíò, ó sì ń ka/kọ media kí ó lè fi àwọn ohun tí o mú pamọ́ sí àkópọ̀-àwòrán rẹ kí ó sì fi wọ́n hàn nínú álbọ́mù inú-ohun-èlò náà. Àwọn fọ́tò àti fídíò rẹ máa ń dúró sórí ẹ̀rọ rẹ àyàfi tí o bá yàn láti pín wọn tàbí kó wọn jáde. A kò gbé àwọn fọ́tò tàbí fídíò rẹ sókè tàbí dá wọn dúró.","h_dev":"Ìsọfúnni ẹ̀rọ àti ìlò","p_dev":"A ń lo Google Analytics for Firebase àti Firebase Crashlytics láti ní òye bí a ṣe ń lo Ohun-èlò náà àti láti ṣàwárí àwọn ìjàǹbá. Èyí lè ní àwọn ìṣẹ̀lẹ̀ ohun-èlò (bíi àwọn àbùdá tí a ṣí), àwòṣe ẹ̀rọ, ẹ̀dà ètò-iṣẹ́, ẹ̀dà ohun-èlò, èdè, àti agbègbè/orílẹ̀-èdè lápapọ̀, àti àwọn àyẹ̀wò ìjàǹbá. Èyí ń ràn wá lọ́wọ́ láti tún àwọn àṣìṣe ṣe àti láti mú Ohun-èlò náà dára sí i.","h_ad":"Ìsọfúnni ìpolówó","p_ad":"Ẹ̀dà ọ̀fẹ́ ti Ohun-èlò náà ń fi àwọn ìpolówó hàn nípasẹ̀ Google AdMob. AdMob lè wọ inú ìdámọ̀ ìpolówó ẹ̀rọ rẹ àti dátà tí ó ní ìbáṣepọ̀ láti sìn àti wọ́n àwọn ìpolówó, pẹ̀lú àwọn ìpolówó tí a ṣe àkànṣe níbi tí a ti yọ̀ǹda. Wo Apá 4 fún àwọn àṣàyàn ìpolówó rẹ.","h_notif":"Àwọn ìfìtọ́nilétí","p_notif":"Tí o bá mú àwọn ìfìtọ́nilétí ṣiṣẹ́, Ohun-èlò náà ń lo Firebase Cloud Messaging (tí ó ń mú àmì-ìtì ẹ̀rọ jáde) láti fi àwọn ìránnilétí àyàn bíi àwọn ìkìlọ̀ wákàtí-wúrà ránṣẹ́. O lè pa àwọn ìfìtọ́nilétí kúrò nígbàkúùgbà nínú àwọn ètò ẹ̀rọ rẹ.","h_purch":"Àwọn ìrajà","p_purch":"Tí o bá ra ìmúgbòòrò ẹ̀ẹ̀kan-ṣoṣo àyàn \"Yọ Àwọn Ìpolówó Kúrò / Pro\", Google Play Billing ni ó ń ṣàkóso ìṣòwò náà. A ń gba ìjẹ́rìí pé a ṣe ìrajà kan kí a lè ṣí àwọn àbùdá Pro kí a sì mú wọn padà fún ọ. A kì í rí tàbí ṣàfipamọ́ káàdì ìsanwó rẹ tàbí àwọn ẹ̀kúnrẹ́rẹ́ ìdíyelé rẹ rárá — Google ni ó ń ṣàkóso ìwọ̀nyí pátápátá.","h_provide":"Ìsọfúnni tí o yàn láti pèsè","p_provide":"Tí o bá fi ímeèlì ránṣẹ́ sí wa (fún àtìlẹ́yìn tàbí èròngbà), a ń gba àdírẹ́sì ímeèlì àti àkóónú ìránṣẹ́ tí o fi ránṣẹ́, a sì ń lò ó nìkan láti dá ọ lóhùn.","h2":"2. Àwọn sẹ́nsọ̀","p_sensors":"Ohun-èlò náà ń ka àwọn sẹ́nsọ̀ ìṣípòpadà ẹ̀rọ (accelerometer àti magnetometer) láti mú kọmpási, ìdọ́gba, àti àwọn àbùdá ìtẹ̀ ṣiṣẹ́. A ń lo dátà sẹ́nsọ̀ yìí lórí ẹ̀rọ rẹ ní àkókò gidi, kì í sì í ṣe ìsọfúnni ara-ẹni nípa rẹ.","h3":"3. Àwọn iṣẹ́ ẹnìkẹ́ta","p_third_intro":"Ohun-èlò náà gbẹ́kẹ̀lé àwọn iṣẹ́ ẹnìkẹ́ta tí ó tẹ̀lé, tí ọ̀kọ̀ọ̀kan wọn ní ìlànà àṣírí tirẹ̀:","tp_advertising":"(ìpolówó)","tp_analytics":"Google Analytics for Firebase & Firebase Crashlytics","tp_notifications":"(àwọn ìfìtọ́nilétí)","tp_purchases":"(àwọn ìrajà)","li_weather":"A lè béèrè lọ́wọ́ olùpèsè dátà ojú-ọjọ́ ẹnìkẹ́ta ní lílo ipò rẹ láti fi àwọn ipò lọ́wọ́lọ́wọ́ hàn.","h4":"4. Àwọn ìpolówó àti àwọn àṣàyàn rẹ","p_ads_intro":"Google AdMob ni ó ń sìn àwọn ìpolówó. O lè ṣàkóso ìpolówó tí a ṣe àkànṣe lórí ẹ̀rọ rẹ:","li_android":"Android: Àwọn Ètò → Google → Àwọn Ìpolówó → yọ kúrò nínú / tún ID ìpolówó rẹ ṣe.","li_remove":"Yíyọ àwọn ìpolówó kúrò pátápátá: ra ìmúgbòòrò Pro ẹ̀ẹ̀kan-ṣoṣo nínú Ohun-èlò náà.","h5":"5. Bí a ṣe ń pín ìsọfúnni","p_share":"A kì í ta ìsọfúnni ara-ẹni rẹ. A ń pín ìsọfúnni nìkan pẹ̀lú àwọn olùpèsè iṣẹ́ tí a tò nínú Apá 3 kí wọn lè ṣe àwọn iṣẹ́ wọn (fún àpẹẹrẹ, fífi àwòrán-ilẹ̀ tàbí àwọn ìpolówó hàn), àti níbi tí òfin, ìlànà òfin bá béèrè, tàbí láti dáàbò bo àwọn ẹ̀tọ́, ààbò, tàbí ohun-ìní àwọn olùmúlò wa, gbogbo ènìyàn, tàbí àwa.","h6":"6. Ìdádúró dátà","p_ret":"Àwọn fọ́tò, fídíò, àti àwọn ètò ohun-èlò tí Ohun-èlò náà dá dúró sórí ẹ̀rọ rẹ títí tí o fi paá rẹ́ tàbí tí o fi yọ Ohun-èlò náà kúrò. A ń dá dátà tí àwọn iṣẹ́ ẹnìkẹ́ta nínú Apá 3 ń ṣàkóso dúró gẹ́gẹ́ bí àwọn ìlànà wọn.","h7":"7. Ààbò","p_sec":"A ń gbé àwọn ìgbésẹ̀ ìmọ̀-ẹ̀rọ àti ti-ìṣètò tí ó bọ́gbọ́n mu láti dáàbò bo ìsọfúnni. Ṣùgbọ́n, kò sí ohun-èlò, ìfiránṣẹ́, tàbí ètò ìfipamọ́ tí ó ní ààbò pátápátá, a kò sì lè ṣe ìdánilójú ààbò pípé.","h8":"8. Àṣírí àwọn ọmọdé","p_child":"A kò darí Ohun-èlò náà sí àwọn ọmọdé tí kò tí ì pé ọdún 13 (tàbí ọjọ́-orí tí ó kéré jùlọ tí a béèrè ní orílẹ̀-èdè rẹ), a kì í sì í kójọ ìsọfúnni ara-ẹni láti ọ̀dọ̀ wọn mọ̀ọ́mọ̀. Tí o bá gbà pé ọmọdé kan ti pèsè ìsọfúnni fún wa, jọ̀wọ́ kàn sí wa, a ó sì paá rẹ́.","h9":"9. Àwọn ẹ̀tọ́ rẹ","p_rights":"Ó dá lórí ibi tí o ń gbé (fún àpẹẹrẹ, EEA/UK lábẹ́ GDPR, tàbí California lábẹ́ CCPA/CPRA), o lè ní àwọn ẹ̀tọ́ láti wọlé, ṣàtúnṣe, paá rẹ́, tàbí dín ìlò ìsọfúnni ara-ẹni rẹ kù, àti láti yọ kúrò nínú àwọn ìṣàgbéyẹ̀wò kan. O lè lo àwọn ìṣàkóso ìpele-ẹ̀rọ nígbàkúùgbà nípa fífagilé àwọn ìyọ̀ǹda ipò, kámẹ́rà, ìfipamọ́, tàbí ìfìtọ́nilétí ti Ohun-èlò náà nínú àwọn ètò ẹ̀rọ rẹ, àti nípa títún ID ìpolówó rẹ ṣe tàbí yíyọ kúrò nínú rẹ̀. Láti ṣe ìbéèrè àṣírí, kàn sí wa ní lílo àwọn ẹ̀kúnrẹ́rẹ́ nísàlẹ̀.","h10":"10. Àwọn olùmúlò káàkiri àgbáyé","p_intl":"Ohun-èlò náà àti àwọn iṣẹ́ ẹnìkẹ́ta tí ó ń lò lè ṣàgbéyẹ̀wò ìsọfúnni ní àwọn orílẹ̀-èdè yàtọ̀ sí tirẹ, níbi tí àwọn òfin ààbò-dátà lè yàtọ̀. Nípa lílo Ohun-èlò náà o gbà pẹ̀lú irú ìṣàgbéyẹ̀wò bẹ́ẹ̀ tí ó bá ìlànà yìí mu.","h11":"11. Àwọn ìyípadà sí Ìlànà Àṣírí yìí","p_changes":"A lè ṣàtúnṣe Ìlànà Àṣírí yìí láti ìgbà dé ìgbà. A ó fi ìyípadà èyíkéyìí sí ojú-ìwé yìí pẹ̀lú ọjọ́ ìbẹ̀rẹ̀ ìṣiṣẹ́ tí a ṣàtúnṣe, nítorí náà jọ̀wọ́ ṣàyẹ̀wò rẹ̀ látìgbàdégbà. Ṣíṣàkúnfún lílo Ohun-èlò náà lẹ́yìn tí àwọn ìyípadà bá ti bẹ̀rẹ̀ sí í ṣiṣẹ́ túmọ̀ sí pé o gbà ìlànà tí a ṣàtúnṣe.","h12":"12. Kàn sí wa","p_contact":"Tí o bá ní àwọn ìbéèrè, àwọn ìbéèrè, tàbí èròngbà nípa Ìlànà Àṣírí yìí tàbí ìsọfúnni rẹ, kàn sí wa ní:","footer":"© 2026 GO PRACHI LABS. All rights reserved."},"ui":{"ui_language":"Èdè","ui_note":"A pèsè ìtumọ̀ yìí fún ìrọ̀rùn rẹ. Tí ìyàtọ̀ èyíkéyìí bá wà, ẹ̀dà Gẹ̀ẹ́sì ni ó ní àṣẹ ní ti òfin."}},"zu":{"privacy":{"title":"Inqubomgomo Yobumfihlo","eff":"Usuku lokuqala ukusebenza: 9 July 2026","intro":"Le Nqubomgomo Yobumfihlo ichaza indlela i-GO PRACHI LABS (\"thina\", \"okwethu\") ephatha ngayo ulwazi mayelana nohlelo lokusebenza lweselula i-GPS Map Camera & Compass (igama lephakethe compass.photo.camera.map.gps.gpsmapcamera_compass) (\"Uhlelo lokusebenza\"). Ubumfihlo bakho bubalulekile kithi. Sicela ufunde le nqubomgomo ngokucophelela. Ngokusebenzisa Uhlelo lokusebenza, uyavuma imikhuba echazwe lapha.","note":"Ngamazwi alula: Uhlelo lokusebenza lubeka uphawu lwendawo yakho ezithombeni zakho, lubonisa ikhompasi namamephu, futhi lubonisa imininingwane yelanga/nyanga nesimo sezulu. Izithombe zakho nendawo yakho kucutshungulwa kudivayisi yakho futhi akulayishwa kumaseva ethu. Sisebenzisa amasevisi e-Google athenjwayo wamamephu, izikhangiso, ukuhlaziya, imibiko yokuphahlazeka, izaziso, nokuthenga, njengoba kuchaziwe ngezansi.","h1":"1. Ulwazi esiluqoqayo nendlela esilusebenzisa ngayo","h_loc":"Ulwazi lwendawo (olunembile nolulinganiselayo)","p_loc":"Ngemvume yakho, Uhlelo lokusebenza lufinyelela i-GPS yedivayisi yakho nendawo esekelwe kunethiwekhi ukuze luhlinzeke ngezici zalo eziyinhloko: ukubeka uphawu lwendawo ezithombeni namavidiyo akho (ukufaka izixhumanisi nekheli esithombeni), ukubonisa isikhundla sakho kumephu, ukubala inkomba yekhompasi, ukuphambuka kukazibuthe, nemininingwane yelanga/nyanga nesimo sezulu sendawo yakho. Indawo icutshungulwa kudivayisi yakho futhi ifakwe kumidiya oyithwebulayo. Ingase ithunyelwe kumasevisi ezinhlangano zangaphandle asohlwini eSigabeni 3 (isibonelo, ukudweba amamephu noma ukuthola izimo zesimo sezulu). Asigcini indawo yakho kumaseva ethu.","h_cam":"Ikhamera, izithombe, nemidiya","p_cam":"Ngemvume yakho, Uhlelo lokusebenza lusebenzisa ikhamera yakho ukuthwebula izithombe nokuqopha amavidiyo, futhi lufunda/lubhala imidiya ukuze lukwazi ukugcina okuthwetshuliwe kwakho egalari yakho nokukubonisa e-albhamu esohlelweni lokusebenza. Izithombe namavidiyo akho ahlala kudivayisi yakho ngaphandle uma ukhetha ukukwabelana noma ukukuthumela ngaphandle. Asilayishi noma sigcine izithombe noma amavidiyo akho.","h_dev":"Ulwazi lwedivayisi nokusetshenziswa","p_dev":"Sisebenzisa i-Google Analytics for Firebase ne-Firebase Crashlytics ukuqonda indlela Uhlelo lokusebenza olusetshenziswa ngayo nokuxilonga ukuphahlazeka. Lokhu kungahlanganisa imicimbi yohlelo lokusebenza (njengezici ezivuliwe), imodeli yedivayisi, inguqulo yesistimu yokusebenza, inguqulo yohlelo lokusebenza, ulimi, nesifunda/izwe ngokuvamile, nokuxilongwa kokuphahlazeka. Lokhu kusisiza silungise amaphutha futhi sithuthukise Uhlelo lokusebenza.","h_ad":"Ulwazi lokukhangisa","p_ad":"Inguqulo yamahhala yoHlelo lokusebenza ibonisa izikhangiso nge-Google AdMob. I-AdMob ingase ifinyelele isihlonzi sokukhangisa sedivayisi yakho nedatha ehlobene ukuze isuse izikhangiso futhi izilinganise, kuhlanganise izikhangiso zomuntu siqu lapho kuvunyelwe khona. Bheka iSigaba 4 ukuthola izinketho zakho zezikhangiso.","h_notif":"Izaziso","p_notif":"Uma unika amandla izaziso, Uhlelo lokusebenza lusebenzisa i-Firebase Cloud Messaging (ekhiqiza ithokheni yokusunduza yedivayisi) ukuletha izikhumbuzi ezikhethekayo njengezexwayiso zehora legolide. Ungakwazi ukuvala izaziso noma nini kuzilungiselelo zedivayisi yakho.","h_purch":"Ukuthenga","p_purch":"Uma uthenga ukuthuthukiswa kwesikhathi esisodwa okuyinketho \"Susa Izikhangiso / Pro\", ukuthengiselana kucutshungulwa i-Google Play Billing. Sithola isiqinisekiso sokuthi kwenziwe ukuthenga ukuze sivule izici ze-Pro futhi sizibuyisele kuwe. Asilokothi sibone noma sigcine ikhadi lakho lokukhokha noma imininingwane yakho yokukhokhelwa — lokho kuphathwa ngokuphelele i-Google.","h_provide":"Ulwazi okhetha ukulunikeza","p_provide":"Uma usithumelela i-imeyili (yokusekela noma ukuphawula), sithola ikheli le-imeyili nokuqukethwe komlayezo okuthumelayo, futhi sikusebenzisa kuphela ukuphendula kuwe.","h2":"2. Izinzwa","p_sensors":"Uhlelo lokusebenza lufunda izinzwa zokunyakaza zedivayisi (i-accelerometer ne-magnetometer) ukusebenzisa ikhompasi, izinga, nezici zokutsheka. Le datha yenzwa isetshenziswa kudivayisi yakho ngesikhathi sangempela futhi akulona ulwazi lomuntu siqu ngawe.","h3":"3. Amasevisi ezinhlangano zangaphandle","p_third_intro":"Uhlelo lokusebenza luncike kumasevisi alandelayo ezinhlangano zangaphandle, ngokunye kulawulwa yinqubomgomo yalo yobumfihlo:","tp_advertising":"(ukukhangisa)","tp_analytics":"Google Analytics for Firebase & Firebase Crashlytics","tp_notifications":"(izaziso)","tp_purchases":"(ukuthenga)","li_weather":"Umhlinzeki wedatha yesimo sezulu wangaphandle angase abuzwe kusetshenziswa indawo yakho ukubonisa izimo zamanje.","h4":"4. Izikhangiso nezinketho zakho","p_ads_intro":"Izikhangiso zisuswa i-Google AdMob. Ungalawula izikhangiso zomuntu siqu kudivayisi yakho:","li_android":"Android: Izilungiselelo → Google → Izikhangiso → phuma / setha kabusha i-ID yakho yezikhangiso.","li_remove":"Ukususa izikhangiso ngokuphelele: thenga ukuthuthukiswa kwe-Pro kwesikhathi esisodwa oHlelweni lokusebenza.","h5":"5. Indlela esabelana ngayo ngolwazi","p_share":"Asidayisi ulwazi lwakho lomuntu siqu. Ulwazi lwabiwa kuphela nabahlinzeki bezinsizakalo abasohlwini eSigabeni 3 ukuze benze imisebenzi yabo (isibonelo, ukubonisa amamephu noma izikhangiso), nalapho kudingeka khona ngomthetho, inqubo yezomthetho, noma ukuvikela amalungelo, ukuphepha, noma impahla yabasebenzisi bethu, umphakathi, noma thina.","h6":"6. Ukugcinwa kwedatha","p_ret":"Izithombe, amavidiyo, nezilungiselelo zohlelo lokusebenza ezenziwe uHlelo lokusebenza zihlala kudivayisi yakho uze uzisuse noma ukhiphe Uhlelo lokusebenza. Idatha ephethwe amasevisi ezinhlangano zangaphandle eSigabeni 3 igcinwa ngokwezinqubomgomo zayo.","h7":"7. Ukuphepha","p_sec":"Sithatha izinyathelo ezinengqondo zezobuchwepheshe nezenhlangano ukuvikela ulwazi. Kodwa-ke, alukho uhlelo lokusebenza, ukudlulisa, noma isistimu yokugcina ephephe ngokuphelele, futhi asikwazi ukuqinisekisa ukuphepha okuphelele.","h8":"8. Ubumfihlo bezingane","p_child":"Uhlelo lokusebenza aluqondiswanga ezinganeni ezingaphansi kweminyaka engu-13 (noma iminyaka encane edingekayo ezweni lakho), futhi asiqoqi ngamabomu ulwazi lomuntu siqu kuzo. Uma ukholelwa ukuthi ingane isinikeze ulwazi, sicela usithinte futhi sizoluhlukanisa.","h9":"9. Amalungelo akho","p_rights":"Kuya ngokuthi uhlala kuphi (isibonelo, i-EEA/UK ngaphansi kwe-GDPR, noma i-California ngaphansi kwe-CCPA/CPRA), ungase ube namalungelo okufinyelela, ukulungisa, ukususa, noma ukukhawulela ukusetshenziswa kolwazi lwakho lomuntu siqu, nokuphuma kokunye ukucutshungulwa. Ungasebenzisa izilawuli zezinga ledivayisi noma nini ngokuhoxisa izimvume zoHlelo lokusebenza zendawo, ikhamera, isitoreji, noma isaziso kuzilungiselelo zedivayisi yakho, nangokusetha kabusha noma ukuphuma ku-ID yakho yezikhangiso. Ukwenza isicelo sobumfihlo, sithinte usebenzisa imininingwane engezansi.","h10":"10. Abasebenzisi bamazwe ngamazwe","p_intl":"Uhlelo lokusebenza namasevisi ezinhlangano zangaphandle olusebenzisayo lungase lucubungule ulwazi emazweni ahlukene nelakho, lapho imithetho yokuvikela idatha ingahluka khona. Ngokusebenzisa Uhlelo lokusebenza uyavuma ukucutshungulwa okunjalo okuhambisana nale nqubomgomo.","h11":"11. Izinguquko kule Nqubomgomo Yobumfihlo","p_changes":"Singase sibuyekeze le Nqubomgomo Yobumfihlo ngezikhathi ezithile. Noma yiziphi izinguquko zizofakwa kuleli khasi ngosuku olubuyekeziwe lokuqala ukusebenza, ngakho-ke sicela uyibuyekeze njalo. Ukuqhubeka nokusebenzisa Uhlelo lokusebenza ngemva kokuba izinguquko ziqale ukusebenza kusho ukuthi uyayamukela inqubomgomo ebuyekeziwe.","h12":"12. Xhumana nathi","p_contact":"Uma unemibuzo, izicelo, noma izimpendulo mayelana nale Nqubomgomo Yobumfihlo noma ulwazi lwakho, xhumana nathi ku-:","footer":"© 2026 GO PRACHI LABS. All rights reserved."},"ui":{"ui_language":"Ulimi","ui_note":"Le nguqulo ihlinzekwa ngenxa yokusizakala kwakho. Uma kukhona umehluko, inguqulo yesiNgisi iyiyo enegunya ngokomthetho."}}};

function match(c){
  if(!c) return null; var lc=c.toLowerCase();
  for(var i=0;i<ORDER.length;i++){ if(ORDER[i].toLowerCase()===lc) return ORDER[i]; }
  if(lc.indexOf("pt")===0) return "pt-BR";
  if(lc.indexOf("zh")===0){ return (lc.indexOf("tw")>=0||lc.indexOf("hant")>=0||lc.indexOf("hk")>=0)?"zh-TW":"zh-CN"; }
  if(lc==="he"||lc==="iw") return "iw";
  if(lc==="in"||lc==="id") return "id";
  var base=lc.split("-")[0];
  for(var j=0;j<ORDER.length;j++){ if(ORDER[j].toLowerCase()===base) return ORDER[j]; }
  if(base==="he") return "iw";
  return null;
}
function pick(){
  var q=new URLSearchParams(location.search).get("lang");
  var cands=[q].concat(navigator.languages||[navigator.language||"en"]);
  for(var i=0;i<cands.length;i++){ var m=match(cands[i]); if(m) return m; }
  return "en";
}

function apply(lang){
  var entry=I18N[lang]||I18N.en; var T=entry[DOC]; var U=entry.ui;
  document.getElementById("content").innerHTML = (DOC==="privacy")?renderPrivacy(T,U,lang):renderTerms(T,U,lang);
  document.documentElement.lang = lang;
  document.documentElement.dir = (RTL.indexOf(lang)>=0)?"rtl":"ltr";
  document.getElementById("langlabel").textContent = U.ui_language || "Language";
  try{ var u=new URL(location); u.searchParams.set("lang",lang); history.replaceState(null,"",u); }catch(e){}
}

(function(){
  var sel=document.getElementById("langsel");
  for(var i=0;i<ORDER.length;i++){ if(!I18N[ORDER[i]]) continue;
    var op=document.createElement("option"); op.value=ORDER[i]; op.textContent=NAMES[ORDER[i]]||ORDER[i]; sel.appendChild(op); }
  var cur=pick(); sel.value=cur; apply(cur);
  sel.addEventListener("change",function(){ apply(sel.value); });
})();
</script>
