o Google AdMob). No somos responsables del contenido de los anuncios ni de los productos o servicios que promocionen.","h6":"6. Uso aceptable","p6_intro":"Usted se compromete a no:","li6_1":"usar la App para cualquier fin ilícito o en violación de cualquier ley o reglamento aplicable;","li6_2":"copiar, modificar, aplicar ingeniería inversa, descompilar o intentar extraer el código fuente de la App, salvo en la medida en que esta restricción esté prohibida por ley;","li6_3":"interferir, interrumpir o intentar obtener acceso no autorizado a la App o a sus sistemas relacionados;","li6_4":"usar la App para infringir los derechos de otros o para capturar contenido que no está autorizado a capturar; o","li6_5":"eliminar, ocultar o alterar cualquier aviso de propiedad en la App.","h7":"7. Propiedad intelectual","p7":"La App, incluidos su software, diseño, logotipos y marcas comerciales (pero excluyendo Su Contenido y los materiales de terceros), es propiedad de GO PRACHI LABS y está protegida por las leyes de propiedad intelectual. Salvo por la licencia otorgada anteriormente, no se le transfiere ningún derecho.","h8":"8. Servicios de terceros","p8":"La App utiliza servicios de terceros como Google Play Services, Google Maps, Google AdMob, Firebase y Google Play Billing. Su uso de esos servicios puede estar sujeto a sus propios términos y políticas de privacidad. No somos responsables de los servicios o el contenido de terceros.","h9":"9. Renuncia de garantías","p9":"La App se proporciona “tal cual” y “según disponibilidad”, sin garantías de ningún tipo, ya sean expresas o implícitas, incluidas las garantías implícitas de comerciabilidad, idoneidad para un fin particular, exactitud y no infracción. No garantizamos que la App sea ininterrumpida, esté libre de errores, sea segura, ni que la información que proporcione sea exacta o fiable.","h10":"10. Limitación de responsabilidad","p10":"En la máxima medida permitida por la ley, GO PRACHI LABS y sus afiliadas no serán responsables de ningún daño indirecto, incidental, especial, consecuente o punitivo, ni de ninguna pérdida de datos, beneficios o fondo de comercio, que surja de o esté relacionada con su uso (o incapacidad de uso) de la App. En la medida en que la responsabilidad no pueda excluirse, nuestra responsabilidad total se limita al importe que nos pagó por la App (si lo hubiera) en los doce meses anteriores a la reclamación.","h11":"11. Indemnización","p11":"Usted se compromete a indemnizar y mantener indemne a GO PRACHI LABS de cualquier reclamación, daño, responsabilidad y gasto que surja de su uso de la App, de Su Contenido o de su incumplimiento de estos Términos.","h12":"12. Terminación","p12":"Puede dejar de usar la App en cualquier momento desinstalándola. Podemos suspender o cancelar su acceso a la App si incumple estos Términos o si descontinuamos la App. Las disposiciones que por su naturaleza deban subsistir tras la terminación (incluidas la propiedad intelectual, las renuncias y la limitación de responsabilidad) subsistirán.","h13":"13. Cambios en la App y en los Términos","p13":"Podemos modificar o descontinuar la App, o actualizar estos Términos, en cualquier momento. Los cambios sustanciales se publicarán en esta página con una fecha de entrada en vigor revisada. Su uso continuado de la App después de que los cambios entren en vigor constituye la aceptación de los Términos actualizados.","h14":"14. Ley aplicable","p14":"Estos Términos se rigen por las leyes de India, sin tener en cuenta los principios de conflicto de leyes. Cualquier disputa estará sujeta a la jurisdicción exclusiva de los tribunales competentes ubicados en India, salvo que le sea aplicable una jurisdicción obligatoria distinta en virtud de la legislación aplicable de protección al consumidor.","h15":"15. Contáctenos","p15":"¿Preguntas sobre estos Términos? Contáctenos en:","footer":"© 2026 GO PRACHI LABS. Todos los derechos reservados."},"ui":{"ui_language":"Idioma","ui_note":"Esta traducción se proporciona para su comodidad. En caso de cualquier discrepancia, la versión en inglés es la legalmente vinculante."}},"pt-BR":{"terms":{"title":"Termos de Serviço","eff":"Data de vigência: 9 July 2026","intro":"Estes Termos de Serviço (“Termos”) regem o seu uso do aplicativo móvel GPS Map Camera & Compass (o “App”), fornecido pela GO PRACHI LABS (“nós”, “nos” ou “nosso”). Ao baixar, instalar ou usar o App, você concorda com estes Termos. Se você não concordar, não use o App.","h1":"1. Licença de uso do App","p1":"Concedemos a você uma licença pessoal, limitada, não exclusiva, intransferível e revogável para instalar e usar o App em dispositivos que você possui ou controla, para seu uso pessoal ou interno de negócios, sujeita a estes Termos e às regras da loja de aplicativos de onde você o baixou.","h2":"2. Seu conteúdo","p2":"Fotos, vídeos e outros conteúdos que você captura ou cria com o App (“Seu Conteúdo”) pertencem a você. O App processa Seu Conteúdo no seu dispositivo para adicionar localização, data/hora, bússola e informações relacionadas. Você é o único responsável por Seu Conteúdo e pela forma como o usa, armazena e compartilha, e você confirma que tem o direito de capturá-lo e usá-lo.","h3":"3. Precisão de localização e bússola — importante","note3":"As informações de localização, coordenadas, endereço, altitude, direção da bússola, declinação magnética e de sol/lua e clima do App são fornecidas apenas para fins informativos gerais e podem ser imprecisas, incompletas ou atrasadas. Não confie no App para fins de navegação, emergência, aviação, náutica, topografia, jurídicos, de segurança crítica ou de risco à vida. Sempre use instrumentos e fontes oficiais para tais decisões. Você usa estas informações por sua própria conta e risco.","h4":"4. Compras","p4":"O App é gratuito para uso e sustentado por publicidade. Você pode, opcionalmente, comprar um upgrade único “Remover Anúncios / Pro” que desbloqueia determinados recursos. Todas as compras são processad mations de l’Application concernant la localisation, les coordonnées, l’adresse, l’altitude, le cap de la boussole, la déclinaison magnétique et le soleil/la lune et la météo sont fournies à titre d’information générale uniquement et peuvent être inexactes, incomplètes ou retardées. Ne vous fiez pas à l’Application pour la navigation, les urgences, l’aviation, la marine, l’arpentage, les usages juridiques, critiques pour la sécurité ou vitaux. Utilisez toujours des instruments et des sources officiels pour de telles décisions. Vous utilisez ces informations à vos propres risques.","h4":"4. Achats","p4":"L’Application est gratuite et financée par la publicité. Vous pouvez éventuellement acheter une mise à niveau unique « Supprimer les publicités / Pro » qui débloque certaines fonctionnalités. Tous les achats sont traités et facturés par Google Play, et sont soumis aux conditions et à la politique de remboursement de Google Play. Nous ne recevons ni ne stockons vos informations de paiement. Comme il s’agit d’un déblocage numérique unique, les achats ne sont généralement pas remboursables, sauf lorsque la loi ou les politiques de Google Play l’exigent. Vous pouvez restaurer un achat antérieur depuis l’Application sur le même compte Google.","h5":"5. Publicités","p5":"Sauf si vous achetez la mise à niveau sans publicité, l’Application affiche des publicités fournies par des tiers (y compris Google AdMob). Nous ne sommes pas responsables du contenu des publicités ni des produits ou services qu’elles promeuvent.","h6":"6. Utilisation acceptable","p6_intro":"Vous acceptez de ne pas :","li6_1":"utiliser l’Application à des fins illégales ou en violation de toute loi ou réglementation applicable ;","li6_2":"copier, modifier, faire de l’ingénierie inverse, décompiler ou tenter d’extraire le code source de l’Application, sauf dans la mesure où cette restriction est interdite par la loi ;","li6_3":"interférer avec, perturber ou tenter d’obtenir un accès non autorisé à l’Application ou à ses systèmes connexes ;","li6_4":"utiliser l’Application pour porter atteinte aux droits d’autrui ou pour capturer du contenu que vous n’êtes pas autorisé à capturer ; ou","li6_5":"supprimer, masquer ou altérer les mentions de propriété dans l’Application.","h7":"7. Propriété intellectuelle","p7":"L’Application, y compris son logiciel, sa conception, ses logos et ses marques (mais à l’exclusion de Votre Contenu et des éléments de tiers), appartient à GO PRACHI LABS et est protégée par les lois sur la propriété intellectuelle. À l’exception de la licence accordée ci-dessus, aucun droit ne vous est transféré.","h8":"8. Services tiers","p8":"L’Application utilise des services tiers tels que Google Play Services, Google Maps, Google AdMob, Firebase et Google Play Billing. Votre utilisation de ces services peut être soumise à leurs propres conditions et politiques de confidentialité. Nous ne sommes pas responsables des services ou contenus tiers.","h9":"9. Exclusion de garanties","p9":"L’Application est fournie « telle quelle » et « selon disponibilité », sans garanties d’aucune sorte, expresses ou implicites, y compris les garanties implicites de qualité marchande, d’adéquation à un usage particulier, d’exactitude et de non-contrefaçon. Nous ne garantissons pas que l’Application sera ininterrompue, sans erreur, sécurisée, ni que les informations qu’elle fournit sont exactes ou fiables.","h10":"10. Limitation de responsabilité","p10":"Dans toute la mesure permise par la loi, GO PRACHI LABS et ses affiliés ne seront pas responsables des dommages indirects, accessoires, spéciaux, consécutifs ou punitifs, ni de toute perte de données, de bénéfices ou de réputation, découlant de ou liés à votre utilisation (ou incapacité d’utiliser) l’Application. Dans la mesure où la responsabilité ne peut être exclue, notre responsabilité totale est limitée au montant que vous nous avez payé pour l’Application (le cas échéant) au cours des douze mois précédant la réclamation.","h11":"11. Indemnisation","p11":"Vous acceptez d’indemniser et de dégager GO PRACHI LABS de toute responsabilité contre toute réclamation, dommage, responsabilité et dépense découlant de votre utilisation de l’Application, de Votre Contenu ou de votre violation des présentes Conditions.","h12":"12. Résiliation","p12":"Vous pouvez cesser d’utiliser l’Application à tout moment en la désinstallant. Nous pouvons suspendre ou résilier votre accès à l’Application si vous violez les présentes Conditions ou si nous cessons l’Application. Les dispositions qui, par leur nature, doivent survivre à la résiliation (y compris la propriété intellectuelle, les exclusions de garantie et la limitation de responsabilité) resteront en vigueur.","h13":"13. Modifications de l’Application et des Conditions","p13":"Nous pouvons modifier ou cesser l’Application, ou mettre à jour les présentes Conditions, à tout moment. Les modifications importantes seront publiées sur cette page avec une date d’entrée en vigueur révisée. Votre utilisation continue de l’Application après l’entrée en vigueur des modifications constitue l’acceptation des Conditions mises à jour.","h14":"14. Droit applicable","p14":"Les présentes Conditions sont régies par les lois de l’Inde, sans égard aux principes de conflit de lois. Tout litige sera soumis à la compétence exclusive des tribunaux compétents situés en Inde, sauf si une juridiction obligatoire différente s’applique à vous en vertu du droit de la protection des consommateurs applicable.","h15":"15. Nous contacter","p15":"Des questions sur ces Conditions ? Contactez-nous à :","footer":"© 2026 GO PRACHI LABS. Tous droits réservés."},"ui":{"ui_language":"Langue","ui_note":"Cette traduction est fournie pour votre commodité. En cas de divergence, la version anglaise fait foi juridiquement."}},"de":{"terms":{"title":"Nutzungsbedingungen","eff":"Datum des Inkrafttretens: 9 July 2026","intro":"Diese Nutzungsbedingungen („Bedingungen“) regeln Ihre Nutzung der mobilen Anwendung GPS Map Camera & Compass (die „App“), bereitgestellt von GO PRACHI LABS („wir“, „uns“ oder „unser“). Durch das Herunterladen, Installieren oder Nutzen der App stimmen Sie diesen Bedingungen zu. Wenn Sie nicht zustimmen, nutzen Sie die App bitte nicht.","h1":"1. Lizenz zur Nutzung der App","p1":"Wir gewähren Ihnen eine persönliche, begrenzte, nicht ausschließliche, nicht übertragbare und widerrufliche Lizenz zur Installation und Nutzung der App auf Geräten, die Sie besitzen oder kontrollieren, für Ihre persönliche oder interne geschäftliche Nutzung, vorbehaltlich dieser Bedingungen und der Regeln des App-Stores, aus dem Sie sie heruntergeladen haben.","h2":"2. Ihre Inhalte","p2":"Fotos, Videos und andere Inhalte, die Sie mit der App aufnehmen oder erstellen („Ihre Inhalte“), gehören Ihnen. Die App verarbeitet Ihre Inhalte auf Ihrem Gerät, um Standort, Datum/Uhrzeit, Kompass und zugehörige Informationen hinzuzufügen. Sie sind allein verantwortlich für Ihre Inhalte und dafür, wie Sie sie verwenden, speichern und teilen, und Sie bestätigen, dass Sie das Recht haben, sie aufzunehmen und zu verwenden.","h3":"3. Genauigkeit von Standort und Kompass — wichtig","note3":"Die Standort-, Koordinaten-, Adress-, Höhen-, Kompassrichtungs-, magnetischen Deklinations- sowie Sonnen-/Mond- und Wetterinformationen der App werden nur zu allgemeinen Informationszwecken bereitgestellt und können ungenau, unvollständig oder verzögert sein. Verlassen Sie sich nicht auf die App für Navigation, Notfälle, Luftfahrt, Seefahrt, Vermessung, rechtliche, sicherheitskritische oder lebenswichtige Zwecke. Verwenden Sie für solche Entscheidungen stets offizielle Instrumente und Quellen. Sie nutzen diese Informationen auf eigenes Risiko.","h4":"4. Käufe","p4":"Die App ist kostenlos nutzbar und wird durch Werbung finanziert. Sie können optional ein einmaliges Upgrade „Werbung entfernen / Pro“ kaufen, das bestimmte Funktionen freischaltet. Alle Käufe werden von Google Play verarbeitet und abgerechnet und unterliegen den Bedingungen und der Rückerstattungsrichtlinie von Google Play. Wir erhalten oder speichern Ihre Zahlungsdaten nicht. Da es sich um eine einmalige digitale Freischaltung handelt, sind Käufe im Allgemeinen nicht erstattungsfähig, außer wo dies gesetzlich oder durch die Richtlinien von Google Play vorgeschrieben ist. Sie können einen früheren Kauf innerhalb der App mit demselben Google-Konto wiederherstellen.","h5":"5. Werbeanzeigen","p5":"Sofern Sie nicht das werbefreie Upgrade erwerben, zeigt die App Werbeanzeigen von Dritten an (einschließlich Google AdMob). Wir sind nicht verantwortlich für den Inhalt der Anzeigen oder für Produkte oder Dienstleistungen, die sie bewerben.","h6":"6. Zulässige Nutzung","p6_intro":"Sie verpflichten sich, Folgendes zu unterlassen:","li6_1":"die App für rechtswidrige Zwecke oder unter Verstoß gegen geltendes Recht oder Vorschriften zu nutzen;","li6_2":"den Quellcode der App zu kopieren, zu modifizieren, zurückzuentwickeln, zu dekompilieren oder zu versuchen, ihn zu extrahieren, außer soweit diese Einschränkung gesetzlich verboten ist;","li6_3":"die App oder ihre zugehörigen Systeme zu stören, zu beeinträchtigen oder zu versuchen, sich unbefugten Zugang zu verschaffen;","li6_4":"die App zu nutzen, um die Rechte anderer zu verletzen oder Inhalte aufzunehmen, zu deren Aufnahme Sie nicht berechtigt sind; oder","li6_5":"Eigentumshinweise in der App zu entfernen, zu verdecken oder zu verändern.","h7":"7. Geistiges Eigentum","p7":"Die App, einschließlich ihrer Software, ihres Designs, ihrer Logos und Marken (jedoch mit Ausnahme Ihrer Inhalte und Materialien Dritter), ist Eigentum von GO PRACHI LABS und durch Gesetze zum Schutz des geistigen Eigentums geschützt. Mit Ausnahme der oben gewährten Lizenz werden Ihnen keine Rechte übertragen.","h8":"8. Drittanbieterdienste","p8":"Die App verwendet Drittanbieterdienste wie Google Play Services, Google Maps, Google AdMob, Firebase und Google Play Billing. Ihre Nutzung dieser Dien uoi Contenuti e del modo in cui li utilizzi, li conservi e li condividi, e confermi di avere il diritto di acquisirli e utilizzarli.","h3":"3. Accuratezza di posizione e bussola — importante","note3":"Le informazioni dell’App relative a posizione, coordinate, indirizzo, altitudine, direzione della bussola, declinazione magnetica e sole/luna e meteo sono fornite solo a scopo informativo generale e possono essere inaccurate, incomplete o in ritardo. Non fare affidamento sull’App per scopi di navigazione, emergenza, aviazione, marittimi, di rilevamento topografico, legali, critici per la sicurezza o vitali. Utilizza sempre strumenti e fonti ufficiali per tali decisioni. Utilizzi queste informazioni a tuo rischio.","h4":"4. Acquisti","p4":"L’App è gratuita e supportata dalla pubblicità. Puoi facoltativamente acquistare un aggiornamento una tantum “Rimuovi annunci / Pro” che sblocca determinate funzioni. Tutti gli acquisti sono elaborati e fatturati da Google Play, e sono soggetti ai termini e alla politica di rimborso di Google Play. Non riceviamo né memorizziamo i dettagli del tuo pagamento. Poiché si tratta di uno sblocco digitale una tantum, gli acquisti generalmente non sono rimborsabili, salvo dove richiesto dalla legge o dalle politiche di Google Play. Puoi ripristinare un acquisto precedente dall’interno dell’App sullo stesso account Google.","h5":"5. Pubblicità","p5":"A meno che tu non acquisti l’aggiornamento senza pubblicità, l’App mostra annunci pubblicitari forniti da terze parti (incluso Google AdMob). Non siamo responsabili del contenuto degli annunci né di eventuali prodotti o servizi che promuovono.","h6":"6. Uso accettabile","p6_intro":"Accetti di non:","li6_1":"utilizzare l’App per qualsiasi scopo illecito o in violazione di qualsiasi legge o regolamento applicabile;","li6_2":"copiare, modificare, decodificare, decompilare o tentare di estrarre il codice sorgente dell’App, salvo nella misura in cui tale restrizione sia vietata dalla legge;","li6_3":"interferire con, interrompere o tentare di ottenere accesso non autorizzato all’App o ai suoi sistemi correlati;","li6_4":"utilizzare l’App per violare i diritti altrui o per acquisire contenuti che non sei autorizzato ad acquisire; oppure","li6_5":"rimuovere, oscurare o alterare eventuali avvisi di proprietà nell’App.","h7":"7. Proprietà intellettuale","p7":"L’App, incluso il suo software, design, loghi e marchi (ma esclusi I Tuoi Contenuti e i materiali di terze parti), è di proprietà di GO PRACHI LABS ed è protetta dalle leggi sulla proprietà intellettuale. Ad eccezione della licenza concessa sopra, nessun diritto ti viene trasferito.","h8":"8. Servizi di terze parti","p8":"L’App utilizza servizi di terze parti come Google Play Services, Google Maps, Google AdMob, Firebase e Google Play Billing. Il tuo utilizzo di tali servizi può essere soggetto ai loro termini e informative sulla privacy. Non siamo responsabili dei servizi o dei contenuti di terze parti.","h9":"9. Esclusione di garanzie","p9":"L’App è fornita “così com’è” e “come disponibile”, senza garanzie di alcun tipo, espresse o implicite, incluse le garanzie implicite di commerciabilità, idoneità a uno scopo particolare, accuratezza e non violazione. Non garantiamo che l’App sarà ininterrotta, priva di errori, sicura, né che le informazioni che fornisce siano accurate o affidabili.","h10":"10. Limitazione di responsabilità","p10":"Nella misura massima consentita dalla legge, GO PRACHI LABS e le sue affiliate non saranno responsabili per eventuali danni indiretti, incidentali, speciali, consequenziali o punitivi, né per qualsiasi perdita di dati, profitti o avviamento, derivanti da o correlati al tuo utilizzo (o incapacità di utilizzare) l’App. Nella misura in cui la responsabilità non può essere esclusa, la nostra responsabilità totale è limitata all’importo che ci hai pagato per l’App (se presente) nei dodici mesi precedenti la richiesta.","h11":"11. Indennizzo","p11":"Accetti di indennizzare e manlevare GO PRACHI LABS da qualsiasi reclamo, danno, responsabilità e spesa derivante dal tuo utilizzo dell’App, da I Tuoi Contenuti o dalla tua violazione dei presenti Termini.","h12":"12. Risoluzione","p12":"Puoi smettere di utilizzare l’App in qualsiasi momento disinstallandola. Possiamo sospendere o interrompere il tuo accesso all’App se violi i presenti Termini o se interrompiamo l’App. Le disposizioni che per loro natura dovrebbero sopravvivere alla risoluzione (incluse la proprietà intellettuale, le esclusioni di garanzia e la limitazione di responsabilità) rimarranno in vigore.","h13":"13. Modifiche all’App e ai Termini","p13":"Possiamo modificare o interrompere l’App, o aggiornare i presenti Termini, in qualsiasi momento. Le modifiche sostanziali saranno pubblicate su questa pagina con una data di entrata in vigore aggiornata. Il tuo utilizzo continuato dell’App dopo l’entrata in vigore delle modifiche costituisce accettazione dei Termini aggiornati.","h14":"14. Legge applicabile","p14":"I presenti Termini sono regolati dalle leggi dell’India, senza riguardo ai principi sui conflitti di legge. Eventuali controversie saranno soggette alla giurisdizione esclusiva dei tribunali competenti situati in India, salvo che a te si applichi una diversa giurisdizione obbligatoria ai sensi della legge sulla protezione dei consumatori applicabile.","h15":"15. Contattaci","p15":"Domande sui presenti Termini? Contattaci all’indirizzo:","footer":"© 2026 GO PRACHI LABS. Tutti i diritti riservati."},"ui":{"ui_language":"Lingua","ui_note":"Questa traduzione è fornita per tua comodità. In caso di eventuali discrepanze, la versione inglese è quella giuridicamente autorevole."}},"ru":{"terms":{"title":"Условия использования","eff":"Дата вступления в силу: 9 July 2026","intro":"Настоящие Условия использования («Условия») регулируют использование вами мобильного приложения GPS Map Camera & Compass («Приложение»), предоставляемого GO PRACHI LABS («мы», «нас» или «наш»). Загружая, устанавливая или используя Приложение, вы соглашаетесь с настоящими Условиями. Если вы не согласны, пожалуйста, не используйте Приложение.","h1":"1. Лицензия на использование Приложения","p1":"Мы предоставляем вам персональную, ограниченную, неисключительную, непередаваемую, отзывную лицензию на установку и использование Приложения на устройствах, которыми вы владеете или которые контролируете, для вашего личного или внутреннего делового использования, при условии соблюдения настоящих Условий и правил магазина приложений, из которого вы его загрузили.","h2":"2. Ваш контент","p2":"Фотографии, видео и другой контент, который вы захватываете или создаёте с помощью Приложения («Ваш Контент»), принадлежат вам. Приложение обрабатывает Ваш Контент на вашем устройстве, чтобы добавить местоположение, дату/время, компас и связанную информацию. Вы несёте единоличную ответственность за Ваш Контент и за то, как вы его используете, храните и передаёте, и вы подтверждаете, что имеете право захватывать и использовать его.","h3":"3. Точность местоположения и компаса — важно","note3":"Информация Приложения о местоположении, координатах, адресе, высоте, курсе компаса, магнитном склонении, а также о солнце/луне и погоде предоставляется только в общих информационных целях и может быть неточной, неполной или запоздалой. Не полагайтесь на Приложение для навигации, чрезвычайных ситуаций, авиации, мореплавания, геодезии, юридических, критически важных для безопасности или жизненно важных целей. Всегда используйте официальные инструменты и источники для таких решений. Вы используете эту информацию на свой собственный риск.","h4":"4. Покупки","p4":"Приложение бесплатно для использования и поддерживается рекламой. Вы можете по желанию приобрести единоразовое обновление «Убрать рекламу / Pro», которое разблокирует определённые функции. Все покупки обрабатываются и выставляются к оплате Google Play и подчиняются условиям и политике возврата средств Google Play. Мы не получаем и не храним данные вашего платежа. Поскольку это единоразовая цифровая разблокировка, покупки, как правило, не подлежат возврату, за исключением случаев, предусмотренных законом или политиками Google Play. Вы можете восстановить предыдущую покупку из самого Приложения на той же учётной записи Google.","h5":"5. Реклама","p5":"Если вы не приобретёте обновление без рекламы, Приложение отображает рекламу, предоставляемую третьими сторонами (включая Google AdMob). Мы не несём ответственности за содержание рекламы или за любые продукты или услуги, которые она рекламирует.","h6":"6. Допустимое использование","p6_intro":"Вы соглашаетесь не:","li6_1":"использовать Приложение в любых незаконных целях или в нарушение любого применимого закона или нормативного акта;","li6_2":"копировать, изменять, подвергать обратной разработке, декомпилировать или пытаться извлечь исходный код Приложения, за исключением случаев, когда такое ограничение запрещено законом;","li6_3":"вмешиваться, нарушать работу или пытаться получить несанкционированный доступ к Приложению или связанным с ним системам;","li6_4":"использовать Приложение для нарушения прав других лиц или для захвата контента, который вам не разрешено захватывать; или","li6_5":"удалять, скрывать или изменять любые уведомления о правах собственности в Приложении.","h7":"7. Интеллектуальная собственность","p7":"Приложение, включая его программное обеспечение, дизайн, логотипы и товарные знаки (но исключая Ваш Контент и материалы третьих сторон), принадлежит GO PRACHI LABS и защищено законами об интеллектуальной собственности. За исключением предоставленной выше лицензии, вам не передаются никакие права.","h8":"8. Сторонние сервисы","p8":"Приложение использует сторонние сервисы, такие как Google Play Services, Google Maps, Google AdMob, Firebase и Google Play Billing. Ваше использование этих сервисов может регулироваться их собственными условиями и политиками конфиденциальности. Мы не несём ответственности за сторонние сервисы или контент.","h9":"9. Отказ от гарантий","p9":"Приложение предоставляется «как есть» и «как доступно», без каких-либо гарантий, явных или подразумеваемых, включая подразумеваемые гарантии товарной пригодности, пригодности для определённой цели, точности и ненарушения прав. Мы не гарантируем, что Приложение будет работать бесперебойно, без ошибок, безопасно, или что любая предоставляемая им информация является точной или надёжной.","h10":"10. Ограничение ответственности","p10":"В максимальной степени, разрешённой законом, GO PRACHI LABS и её аффилированные лица не несут ответственности за любые косвенные, случайные, специальные, вытекающие или штрафные убытки, а также за любую потерю данных, прибыли или деловой репутации, возникающие в связи с вашим использованием (или невозможностью использования) Приложения. В той степени, в которой ответственность не может быть исключена, наша общая ответственность ограничивается суммой, которую вы заплатили нам за Приложение (если таковая имеется) за двенадцать месяцев, предшествующих претензии.","h11":"11. Возмещение ущерба","p11":"Вы соглашаетесь возместить ущерб и оградить GO PRACHI LABS от любых претензий, убытков, обязательств и расходов, возникающих в связи с вашим использованием Приложения, Вашим Контентом или вашим нарушением настоящих Условий.","h12":"12. Прекращение действия","p12":"Вы можете прекратить использование Приложения в любое время, удалив его. Мы можем приостановить или прекратить ваш доступ к Приложению, если вы нарушаете настоящие Условия или если мы прекращаем работу Приложения. Положения, которые по своей природе должны сохранять силу после прекращения действия (включая интеллектуальную собственность, отказы от гарантий и ограничение ответственности), сохранят свою силу.","h13":"13. Изменения в Приложении и Условиях","p13":"Мы можем изменять или прекращать работу Приложения либо обновлять настоящие Условия в любое время. Существенные изменения будут размещены на этой странице с обновлённой датой вступления в силу. Продолжение использования вами Приложения после вступления изменений в силу означает принятие обновлённых Условий.","h14":"14. Применимое право","p14":"Настоящие Условия регулируются законами Индии, без учёта принципов коллизионного права. Любые споры подлежат исключительной юрисдикции компетентных судов, расположенных в Индии, если к вам не применяется иная обязательная юрисдикция согласно применимому законодательству о защите прав потребителей.","h15":"15. Свяжитесь с нами","p15":"Вопросы по настоящим Условиям? Свяжитесь с нами по адресу:","footer":"© 2026 GO PRACHI LABS. Все права защищены."},"ui":{"ui_language":"Язык","ui_note":"Этот перевод предоставлен для вашего удобства. В случае каких-либо расхождений юридически действительной является английская версия."}},"uk":{"terms":{"title":"Умови надання послуг","eff":"Дата набрання чинності: 9 July 2026","intro":"Ці Умови надання послуг («Умови») регулюють використання вами мобільного застосунку GPS Map Camera & Compass («Застосунок»), який надається GO PRACHI LABS («ми», «нас» або «наш»). Завантажуючи, встановлюючи або використовуючи Застосунок, ви погоджуєтеся з цими Умовами. Якщо ви не згодні, будь ласка, не використовуйте Застосунок.","h1":"1. Ліцензія на використання Застосунку","p1":"Ми надаємо вам особисту, обмежену, невиключну, непередавану, відкличну ліцензію на встановлення та використання Застосунку на пристроях, якими ви володієте або які контролюєте, для вашого особистого або внутрішнього ділового використання, за умови дотримання цих Умов і правил магазину застосунків, з якого ви його завантажили.","h2":"2. Ваш контент","p2":"Фотографії, відео та інший контент, який ви знімаєте або створюєте за допомогою Застосунку («Ваш Контент»), належать вам. Застосунок обробляє Ваш Контент на вашому пристрої, щоб додати місцезнаходження, дату/час, компас і пов’язану інформацію. Ви несете одноосібну відповідальність за Ваш Контент і за те, як ви його використовуєте, зберігаєте та передаєте, і ви підтверджуєте, що маєте право знімати та використовувати його.","h3":"3. Точність місцезнаходження та компаса — важливо","note3":"Інформація Застосунку про місцезнаходження, координати, адресу, висоту, курс компаса, магнітне схилення, а також про сонце/місяць і погоду надається лише для загальних інформаційних цілей і може бути неточною, неповною або із затримкою. Не покладайтеся на Застосунок для навігації, надзвичайних ситуацій, авіації, мореплавства, геодезії, юридичних, критично важливих для безпеки або життєво важливих цілей. Завжди використовуйте офіційні інструменти та джерела для таких рішень. Ви використовуєте цю інформацію на власний ризик.","h4":"4. Покупки","p4":"Застосунок безкоштовний для використання та підтримується рекламою. Ви можете за бажанням придбати одноразове оновлення «Прибрати рекламу / Pro», яке розблоковує певні функції. Усі покупки обробляються та виставляються до оплати Google Play і підпадають під умови та політику повернення коштів Google Play. Ми не отримуємо й не зберігаємо дані вашого платежу. Оскільки це одноразове цифрове розблокування, покупки, як правило, не підлягають поверненню, за винятком випадків, передбачених законом або політиками Google Play. Ви можете відновити попередню покупку з самого Застосунку на тому самому обліковому записі Google.","h5":"5. Реклама","p5":"Якщо ви не придбаєте оновлення без реклами, Застосунок відображає рекламу, надану третіми сторонами (включно з Google AdMob). Ми не несемо відповідальності за зміст реклами або за будь-які продукти чи послуги, які вона рекламує.","h6":"6. Прийнятне використання","p6_intro":"Ви погоджуєтеся не:","li6_1":"використовувати Застосунок для будь-яких незаконних цілей або з порушенням будь-якого застосовного закону чи нормативного акта;","li6_2":"копіювати, змінювати, здійснювати зворотну розробку, декомпілювати або намагатися витягти вихідний код Застосунку, за винятком випадків, коли таке обмеження заборонено законом;","li6_3":"втручатися, порушувати роботу або намагатися отримати несанкціонований доступ до Застосунку чи пов’язаних із ним систем;","li6_4":"використовувати Застосунок для порушення прав інших осіб або для зйомки контенту, який вам не дозволено знімати; або","li6_5":"видаляти, приховувати або змінювати будь-які повідомлення про права власності в Застосунку.","h7":"7. Інтелектуальна власність","p7":"Застосунок, включно з його програмним забезпеченням, дизайном, логотипами та торговими марками (але за винятком Вашого Контенту та матеріалів третіх сторін), належить GO PRACHI LABS і захищений законами про інтелектуальну власність. За винятком наданої вище ліцензії, вам не передаються жодні права.","h8":"8. Сторонні сервіси","p8":"Застосунок використовує сторонні сервіси, такі як Google Play Services, Google Maps, Google AdMob, Firebase і Google Play Billing. Ваше використання цих сервісів може підпадати під їхні власні умови та політики конфіденційності. Ми не несемо відповідальності за сторонні сервіси чи контент.","h9":"9. Відмова від гарантій","p9":"Застосунок надається «як є» та «як доступно», без будь-яких гарантій, явних чи неявних, включно з неявними гарантіями придатності для продажу, придатності для певної мети, точності та ненепорушення прав. Ми не гарантуємо, що Застосунок працюватиме безперебійно, без помилок, безпечно, або що будь-яка надана ним інформація є точною чи надійною.","h10":"10. Обмеження відповідальності","p10":"У максимальному обсязі, дозволеному законом, GO PRACHI LABS та її афілійовані особи не нестимуть відповідальності за будь-які непрямі, випадкові, особливі, побічні або штрафні збитки, а також за будь-яку втрату даних, прибутку чи ділової репутації, що виникають унаслідок або у зв’язку з вашим використанням (або неможливістю використання) Застосунку. У тій мірі, в якій відповідальність не може бути виключена, наша загальна відповідальність обмежується сумою, яку ви сплатили нам за Застосунок (якщо така є) протягом дванадцяти місяців до подання претензії.","h11":"11. Відшкодування збитків","p11":"Ви погоджуєтеся відшкодувати збитки та звільнити GO PRACHI LABS від будь-яких претензій, збитків, зобов’язань і витрат, що виникають унаслідок вашого використання Застосунку, Вашого Контенту або вашого порушення цих Умов.","h12":"12. Припинення дії","p12":"Ви можете припинити використання Застосунку будь-коли, видаливши його. Ми можемо призупинити або припинити ваш доступ до Застосунку, якщо ви порушуєте ці Умови або якщо ми припиняємо роботу Застосунку. Положення, які за своєю природою мають зберігати чинність після припинення дії (включно з інтелектуальною власністю, відмовами від гарантій та обмеженням відповідальності), залишатимуться чинними.","h13":"13. Зміни до Застосунку та Умов","p13":"Ми можемо змінювати або припиняти роботу Застосунку чи оновлювати ці Умови будь-коли. Суттєві зміни будуть опубліковані на цій сторінці з оновленою датою набрання чинності. Продовження вами використання Застосунку після набрання змінами чинності означає прийняття оновлених Умов.","h14":"14. Застосовне право","p14":"Ці Умови регулюються законами Індії, без урахування принципів колізійного права. Будь-які спори підлягають виключній юрисдикції компетентних судів, розташованих в Індії, якщо до вас не застосовується інша обов’язкова юрисдикція згідно з застосовним законодавством про захист прав споживачів.","h15":"15. Зв’яжіться з нами","p15":"Запитання щодо цих Умов? Зв’яжіться з нами за адресою:","footer":"© 2026 GO PRACHI LABS. Усі права захищено."},"ui":{"ui_language":"Мова","ui_note":"Цей переклад надається для вашої зручності. У разі будь-яких розбіжностей юридично автентичною є англійська версія."}},"pl":{"terms":{"title":"Warunki korzystania z usługi","eff":"Data wejścia w życie: 9 July 2026","intro":"Niniejsze Warunki korzystania z usługi („Warunki”) regulują korzystanie przez Ciebie z aplikacji mobilnej GPS Map Camera & Compass („Aplikacja”), dostarczanej przez GO PRACHI LABS („my”, „nas” lub „nasz”). Pobierając, instalując lub korzystając z Aplikacji, wyrażasz zgodę na niniejsze Warunki. Jeśli nie wyrażasz zgody, prosimy nie korzystać z Aplikacji.","h1":"1. Licencja na korzystanie z Aplikacji","p1":"Udzielamy Ci osobistej, ograniczonej, niewyłącznej, nieprzenoszalnej, odwołalnej licencji na instalację i korzystanie z Aplikacji na urządzeniach, które posiadasz lub kontrolujesz, do Twojego osobistego lub wewnętrznego użytku biznesowego, z zastrzeżeniem niniejszych Warunków oraz zasad sklepu z aplikacjami, z którego ją pobrałeś.","h2":"2. Twoje treści","p2":"Zdjęcia, filmy i inne treści, które rejestrujesz lub tworzysz za pomocą Aplikacji („Twoje Treści”), należą do Ciebie. Aplikacja przetwarza Twoje Treści na Twoim urządzeniu, aby dodać lokalizację, datę/godzinę, kompas i powiązane informacje. Ponosisz wyłączną odpowiedzialność za Twoje Treści oraz za sposób, w jaki je wykorzystujesz, przechowujesz i udostępniasz, i potwierdzasz, że masz prawo do ich rejestrowania i wykorzystywania.","h3":"3. Dokładność lokalizacji i kompasu — ważne","note3":"Informacje Aplikacji dotyczące lokalizacji, współrzędnych, adresu, wysokości, kursu kompasu, deklinacji magnetycznej oraz słońca/księżyca i pogody są dostarczane wyłącznie w ogólnych celach informacyjnych i mogą być niedokładne, niekompletne lub opóźnione. Nie polegaj na Aplikacji do celów nawigacyjnych, awaryjnych, lotniczych, morskich, geodezyjnych, prawnych, krytycznych dla bezpieczeństwa ani mających znaczenie dla życia. Do takich decyzji zawsze korzystaj z oficjalnych instrumentów i źródeł. Korzystasz z tych informacji na własne ryzyko.","h4":"4. Zakupy","p4":"Aplikacja jest bezpłatna w użyciu i wspierana przez reklamy. Możesz opcjonalnie kupić jednorazowe ulepszenie „Usuń reklamy / Pro”, które odblokowuje określone funkcje. Wszystkie zakupy są przetwarzane i rozliczane przez Google Play oraz podlegają warunkom i polityce zwrotów Google Play. Nie otrzymujemy ani nie przechowujemy danych Twojej płatności. Ponieważ jest to jednorazowe odblokowanie cyfrowe, zakupy zasadniczo nie podlegają zwrotowi, z wyjątkiem przypadków wymaganych przez prawo lub polityki Google Play. Możesz przywrócić poprzedni zakup z poziomu Aplikacji na tym samym koncie Google.","h5":"5. Reklamy","p5":"O ile nie kupisz ulepszenia bez reklam, Aplikacja wyświetla reklamy dostarczane przez strony trzecie (w tym Google AdMob). Nie ponosimy odpowiedzialności za treść reklam ani za jakiekolwiek produkty lub usługi, które promują.","h6":"6. Dopuszczalne użytkowanie","p6_intro":"Zobowiązujesz się nie:","li6_1":"wykorzystywać Aplikacji do jakichkolwiek niezgodnych z prawem celów lub z naruszeniem jakiegokolwiek obowiązującego prawa lub przepisów;","li6_2":"kopiować, modyfikować, poddawać inżynierii wstecznej, dekompilować ani próbować wydobyć kodu źródłowego Aplikacji, z wyjątkiem zakresu, w jakim to ograniczenie jest zabronione przez prawo;","li6_3":"zakłócać, przerywać ani próbować uzyskać nieautoryzowanego dostępu do Aplikacji lub powiązanych z nią systemów;","li6_4":"wykorzystywać Aplikacji do naruszania praw innych osób ani do rejestrowania treści, których rejestrowanie nie jest dozwolone; lub","li6_5":"usuwać, zasłaniać ani zmieniać jakichkolwiek informacji o prawach własności w Aplikacji.","h7":"7. Własność intelektualna","p7":"Aplikacja, w tym jej oprogramowanie, projekt, logo i znaki towarowe (ale z wyłączeniem Twoich Treści i materiałów stron trzecich), jest własnością GO PRACHI LABS i chroniona prawami własności intelektualnej. Z wyjątkiem licencji udzielonej powyżej, żadne prawa nie są na Ciebie przenoszone.","h8":"8. Usługi stron trzecich","p8":"Aplikacja korzysta z usług stron trzecich, takich jak Google Play Services, Google Maps, Google AdMob, Firebase i Google Play Billing. Twoje korzystanie z tych usług może podlegać ich własnym warunkom i politykom prywatności. Nie ponosimy odpowiedzialności za usługi ani treści stron trzecich.","h9":"9. Wyłączenie gwarancji","p9":"Aplikacja jest dostarczana „w stanie, w jakim jest” oraz „w miarę dostępności”, bez jakichkolwiek gwarancji, wyraźnych lub dorozumianych, w tym dorozumianych gwarancji przydatności handlowej, przydatności do określonego celu, dokładności oraz nienaruszania praw. Nie gwarantujemy, że Aplikacja będzie działać nieprzerwanie, bezbłędnie, bezpiecznie ani że jakiekolwiek dostarczane przez nią informacje są dokładne lub wiarygodne.","h10":"10. Ograniczenie odpowiedzialności","p10":"W maksymalnym zakresie dozwolonym przez prawo GO PRACHI LABS i jej podmioty stowarzyszone nie ponoszą odpowiedzialności za jakiekolwiek pośrednie, przypadkowe, szczególne, wtórne lub karne szkody, ani za jakąkolwiek utratę danych, zysków lub renomy, wynikające z lub związane z korzystaniem przez Ciebie (lub niemożnością korzystania) z Aplikacji. W zakresie, w jakim odpowiedzialność nie może zostać wyłączona, nasza całkowita odpowiedzialność jest ograniczona do kwoty, którą nam zapłaciłeś za Aplikację (jeśli dotyczy) w ciągu dwunastu miesięcy poprzedzających roszczenie.","h11":"11. Zwolnienie z odpowiedzialności","p11":"Zobowiązujesz się zabezpieczyć i zwolnić GO PRACHI LABS z odpowiedzialności za wszelkie roszczenia, szkody, zobowiązania i wydatki wynikające z korzystania przez Ciebie z Aplikacji, Twoich Treści lub naruszenia przez Ciebie niniejszych Warunków.","h12":"12. Rozwiązanie","p12":"Możesz zaprzestać korzystania z Aplikacji w dowolnym momencie, odinstalowując ją. Możemy zawiesić lub zakończyć Twój dostęp do Aplikacji, jeśli naruszysz niniejsze Warunki lub jeśli zaprzestaniemy działania Aplikacji. Postanowienia, które ze swej natury powinny obowiązywać po rozwiązaniu (w tym własność intelektualna, wyłączenia gwarancji i ograniczenie odpowiedzialności), pozostaną w mocy.","h13":"13. Zmiany w Aplikacji i Warunkach","p13":"Możemy modyfikować lub zaprzestać działania Aplikacji albo aktualizować niniejsze Warunki w dowolnym momencie. Istotne zmiany zostaną opublikowane na tej stronie ze zaktualizowaną datą wejścia w życie. Dalsze korzystanie przez Ciebie z Aplikacji po wejściu zmian w życie stanowi akceptację zaktualizowanych Warunków.","h14":"14. Prawo właściwe","p14":"Niniejsze Warunki podlegają prawu Indii, bez względu na zasady kolizji przepisów prawnych. Wszelkie spory będą podlegać wyłącznej jurysdykcji właściwych sądów zlokalizowanych w Indiach, chyba że na mocy obowiązującego prawa ochrony konsumentów zastosowanie ma wobec Ciebie inna obowiązkowa jurysdykcja.","h15":"15. Skontaktuj się z nami","p15":"Pytania dotyczące niniejszych Warunków? Skontaktuj się z nami pod adresem:","footer":"© 2026 GO PRACHI LABS. Wszelkie prawa zastrzeżone."},"ui":{"ui_language":"Język","ui_note":"Niniejsze tłumaczenie jest udostępniane dla Twojej wygody. W przypadku jakichkolwiek rozbieżności wersja angielska jest prawnie wiążąca."}},"ro":{"terms":{"title":"Termeni și condiții","eff":"Data intrării în vigoare: 9 July 2026","intro":"Acești Termeni și condiții („Termeni”) reglementează utilizarea de către dumneavoastră a aplicației mobile GPS Map Camera & Compass („Aplicația”), furnizată de GO PRACHI LABS („noi”, „ne” sau „nostru”). Prin descărcarea, instalarea sau utilizarea Aplicației, sunteți de acord cu acești Termeni. Dacă nu sunteți de acord, vă rugăm să nu utilizați Aplicația.","h1":"1. Licența de utilizare a Aplicației","p1":"Vă acordăm o licență personală, limitată, neexclusivă, netransferabilă și revocabilă de a instala și utiliza Aplicația pe dispozitive pe care le dețineți sau le controlați, pentru uzul dumneavoastră personal sau intern de afaceri, sub rezerva acestor Termeni și a regulilor magazinului de aplicații din care ați descărcat-o.","h2":"2. Conținutul dumneavoastră","p2":"Fotografiile, videoclipurile și alt conținut pe care îl capturați sau creați cu Aplicația („Conținutul dumneavoastră”) vă aparțin. Aplicația procesează Conținutul dumneavoastră pe dispozitivul dumneavoastră pentru a adăuga locația, data/ora, busola și informații conexe. Sunteți singurul responsabil pentru Conținutul dumneavoastră și pentru modul în care îl utilizați, stocați și partajați și confirmați că aveți dreptul de a-l captura și utiliza.","h3":"3. Precizia locației și a busolei — important","note3":"Locația, coordonatele, adresa, altitudinea, direcția busolei, declinația magnetică și informațiile despre soare/lună și vreme ale Aplicației sunt furnizate doar în scop informativ general și pot fi inexacte, incomplete sau întârziate. Nu vă bazați pe Aplicație pentru navigație, urgențe, aviație, navigație maritimă, topografie, scopuri juridice, critice pentru siguranță sau vitale. Utilizați întotdeauna instrumente și surse oficiale pentru astfel de decizii. Utilizați aceste informații pe propriul risc.","h4":"4. Achiziții","p4":"Aplicația este gratuită și susținută prin publicitate. Puteți achiziționa opțional un upgrade unic „Elimină anunțurile / Pro” care deblochează anumite funcții. Toate achizițiile sunt procesate și facturate de Google Play și fac obiectul termenilor și politicii de rambursare Google Play. Nu primim și nu stocăm detaliile dumneavoastră de plată. Deoarece este o deblocare digitală unică, achizițiile sunt în general nerambursabile, cu excepția cazului în care legea sau politicile Google Play impun altfel. Puteți restaura o achiziție anterioară din interiorul Aplicației folosind același cont Google.","h5":"5. Anunțuri publicitare","p5":"Cu excepția cazului în care achiziționați upgrade-ul fără anunțuri, Aplicația afișează anunțuri publicitare furnizate de terți (inclusiv Google AdMob). Nu suntem responsabili pentru conținutul anunțurilor sau pentru orice produse sau servicii pe care le promovează.","h6":"6. Utilizare acceptabilă","p6_intro":"Sunteți de acord să nu:","li6_1":"utilizați Aplicația în scopuri ilegale sau cu încălcarea oricărei legi sau reglementări aplicabile;","li6_2":"copiați, modificați, dezasamblați, decompilați sau încercați să extrageți codul sursă al Aplicației, cu excepția cazului în care această restricție este interzisă prin lege;","li6_3":"interferați cu, perturbați sau încercați să obțineți acces neautorizat la Aplicație sau la sistemele  acord să despăgubiți și să exonerați GO PRACHI LABS de orice reclamații, daune, răspunderi și cheltuieli care decurg din utilizarea de către dumneavoastră a Aplicației, din Conținutul dumneavoastră sau din încălcarea de către dumneavoastră a acestor Termeni.","h12":"12. Încetare","p12":"Puteți înceta utilizarea Aplicației oricând prin dezinstalarea acesteia. Putem suspenda sau înceta accesul dumneavoastră la Aplicație dacă încălcați acești Termeni sau dacă întrerupem Aplicația. Prevederile care prin natura lor ar trebui să supraviețuiască încetării (inclusiv proprietatea intelectuală, declinările de responsabilitate și limitarea răspunderii) vor supraviețui.","h13":"13. Modificări ale Aplicației și ale Termenilor","p13":"Este posibil să modificăm sau să întrerupem Aplicația sau să actualizăm acești Termeni în orice moment. Modificările importante vor fi publicate pe această pagină cu o dată de intrare în vigoare revizuită. Utilizarea în continuare a Aplicației după intrarea în vigoare a modificărilor constituie acceptarea Termenilor actualizați.","h14":"14. Legea aplicabilă","p14":"Acești Termeni sunt guvernați de legile Indiei, fără a ține cont de principiile conflictului de legi. Orice litigiu va fi supus jurisdicției exclusive a instanțelor competente situate în India, cu excepția cazului în care o jurisdicție obligatorie diferită vi se aplică conform legislației aplicabile privind protecția consumatorilor.","h15":"15. Contactați-ne","p15":"Aveți întrebări despre acești Termeni? Contactați-ne la:","footer":"© 2026 GO PRACHI LABS. Toate drepturile rezervate."},"ui":{"ui_language":"Limbă","ui_note":"Această traducere este furnizată pentru comoditatea dumneavoastră. În caz de orice discrepanță, versiunea în limba engleză este cea autoritativă din punct de vedere juridic."}},"nl":{"terms":{"title":"Servicevoorwaarden","eff":"Ingangsdatum: 9 July 2026","intro":"Deze Servicevoorwaarden („Voorwaarden”) regelen uw gebruik van de mobiele applicatie GPS Map Camera & Compass (de „App”), aangeboden door GO PRACHI LABS („wij”, „ons” of „onze”). Door de App te downloaden, installeren of gebruiken, gaat u akkoord met deze Voorwaarden. Als u niet akkoord gaat, gebruik de App dan niet.","h1":"1. Licentie om de App te gebruiken","p1":"Wij verlenen u een persoonlijke, beperkte, niet-exclusieve, niet-overdraagbare, herroepbare licentie om de App te installeren en te gebruiken op apparaten die u bezit of beheert, voor uw persoonlijke of interne zakelijke gebruik, onderworpen aan deze Voorwaarden en de regels van de app store waaruit u deze hebt gedownload.","h2":"2. Uw inhoud","p2":"Foto's, video's en andere inhoud die u met de App vastlegt of maakt („Uw inhoud”) behoren u toe. De App verwerkt Uw inhoud op uw apparaat om locatie, datum/tijd, kompas en gerelateerde informatie toe te voegen. U bent als enige verantwoordelijk voor Uw inhoud en voor hoe u deze gebruikt, opslaat en deelt, en u bevestigt dat u het recht hebt om deze vast te leggen en te gebruiken.","h3":"3. Nauwkeurigheid van locatie en kompas — belangrijk","note3":"De locatie, coördinaten, het adres, de hoogte, de kompasrichting, de magnetische declinatie en de zon/maan- en weerinformatie van de App worden uitsluitend voor algemene informatieve doeleinden verstrekt en kunnen onnauwkeurig, onvolledig of vertraagd zijn. Vertrouw niet op de App voor navigatie, noodgevallen, luchtvaart, scheepvaart, landmeting, juridische, veiligheidskritische of levensbedreigende doeleinden. Gebruik altijd officiële instrumenten en bronnen voor dergelijke beslissingen. U gebruikt deze informatie op eigen risico.","h4":"4. Aankopen","p4":"De App is gratis te gebruiken en wordt ondersteund door advertenties. U kunt optioneel een eenmalige upgrade „Advertenties verwijderen / Pro” kopen die bepaalde functies ontgrendelt. Alle aankopen worden verwerkt en gefactureerd door Google Play en zijn onderworpen aan de voorwaarden en het restitutiebeleid van Google Play. Wij ontvangen of bewaren uw betalingsgegevens niet. Omdat het een eenmalige digitale ontgrendeling is, zijn aankopen over het algemeen niet-restitueerbaar, behalve waar dit wettelijk vereist is of door het beleid van Google Play. U kunt een eerdere aankoop herstellen vanuit de App op hetzelfde Google-account.","h5":"5. Advertenties","p5":"Tenzij u de advertentievrije upgrade koopt, toont de App advertenties die door derden worden geleverd (waaronder Google AdMob). Wij zijn niet verantwoordelijk voor de inhoud van advertenties of voor producten of diensten die zij promoten.","h6":"6. Aanvaardbaar gebruik","p6_intro":"U gaat ermee akkoord om niet:","li6_1":"de App te gebruiken voor een onwettig doel of in strijd met een toepasselijke wet of regelgeving;","li6_2":"de broncode van de App te kopiëren, wijzigen, reverse-engineeren, decompileren of proberen te extraheren, behalve voor zover deze beperking wettelijk verboden is;","li6_3":"te interfereren met, te verstoren of te proberen ongeoorloofde toegang te verkrijgen tot de App of de bijbehorende systemen;","li6_4":"de App te gebruiken om de rechten van anderen te schenden of om inhoud vast te leggen die u niet mag vastleggen; of","li6_5":"eigendomsvermeldingen in de App te verwijderen, te verbergen of te wijzigen.","h7":"7. Intellectueel eigendom","p7":"De App, inclusief de software, het ontwerp, de logo's en de handelsmerken (maar met uitzondering van Uw inhoud en materialen van derden), is eigendom van GO PRACHI LABS en wordt beschermd door wetten op het gebied van intellectueel eigendom. Behalve voor de hierboven verleende licentie worden er geen rechten aan u overgedragen.","h8":"8. Diensten van derden","p8":"De App maakt gebruik van diensten van derden zoals Google Play Services, Google Maps, Google AdMob, Firebase en Google Play Billing. Uw gebruik van die diensten kan onderworpen zijn aan hun eigen voorwaarden en privacybeleid. Wij zijn niet verantwoordelijk voor diensten of inhoud van derden.","h9":"9. Afwijzing van garanties","p9":"De App wordt gelever "h14":"14. Toepasselijk recht","p14":"Deze Voorwaarden worden beheerst door de wetten van India, zonder rekening te houden met de beginselen van wetsconflicten. Eventuele geschillen zijn onderworpen aan de exclusieve jurisdictie van de bevoegde rechtbanken in India, tenzij een andere dwingende jurisdictie op u van toepassing is onder de toepasselijke wetgeving inzake consumentenbescherming.","h15":"15. Neem contact met ons op","p15":"Vragen over deze Voorwaarden? Neem contact met ons op via:","footer":"© 2026 GO PRACHI LABS. Alle rechten voorbehouden."},"ui":{"ui_language":"Taal","ui_note":"Deze vertaling wordt aangeboden voor uw gemak. In geval van enige discrepantie is de Engelse versie de juridisch gezaghebbende versie."}},"el":{"terms":{"title":"Όροι Παροχής Υπηρεσιών","eff":"Ημερομηνία έναρξης ισχύος: 9 July 2026","intro":"Αυτοί οι Όροι Παροχής Υπηρεσιών («Όροι») διέπουν τη χρήση από εσάς της εφαρμογής για κινητά GPS Map Camera & Compass (η «Εφαρμογή»), που παρέχεται από την GO PRACHI LABS («εμείς», «εμάς» ή «μας»). Με τη λήψη, την εγκατάσταση ή τη χρήση της Εφαρμογής, συμφωνείτε με αυτούς τους Όρους. Εάν δεν συμφωνείτε, παρακαλούμε μην χρησιμοποιείτε την Εφαρμογή.","h1":"1. Άδεια χρήσης της Εφαρμογής","p1":"Σας παραχωρούμε μια προσωπική, περιορισμένη, μη αποκλειστική, μη μεταβιβάσιμη, ανακλητή άδεια για την εγκατάσταση και χρήση της Εφαρμογής σε συσκευές που κατέχετε ή ελέγχετε, για προσωπική ή εσωτερική επιχειρηματική σας χρήση, με την επιφύλαξη αυτών των Όρων και των κανόνων του καταστήματος εφαρμογών από το οποίο τη λάβατε.","h2":"2. Το περιεχόμενό σας","p2":"Οι φωτογραφίες, τα βίντεο και άλλο περιεχόμενο που καταγράφετε ή δημιουργείτε με την Εφαρμογή («Το Περιεχόμενό σας») ανήκουν σε εσάς. Η Εφαρμογή επεξεργάζεται το Περιεχόμενό σας στη συσκευή σας για να προσθέσει τοποθεσία, ημερομηνία/ώρα, πυξίδα και σχετικές πληροφορίες. Είστε αποκλειστικά υπεύθυνοι για το Περιεχόμενό σας και για τον τρόπο με τον οποίο το χρησιμοποιείτε, το αποθηκεύετε και το κοινοποιείτε, και επιβεβαιώνετε ότι έχετε το δικαίωμα να το καταγράφετε και να το χρησιμοποιείτε.","h3":"3. Ακρίβεια τοποθεσίας και πυξίδας — σημαντικό","note3":"Η τοποθεσία, οι συντεταγμένες, η διεύθυνση, το υψόμετρο, η κατεύθυνση πυξίδας, η μαγνητική απόκλιση και οι πληροφορίες ήλιου/σελήνης και καιρού της Εφαρμογής παρέχονται μόνο για γενικούς ενημερωτικούς σκοπούς και ενδέχεται να είναι ανακριβείς, ελλιπείς ή καθυστερημένες. Μην βασίζεστε στην Εφαρμογή για πλοήγηση, έκτακτες ανάγκες, αεροπορία, ναυτιλία, τοπογραφία, νομικούς, κρίσιμους για την ασφάλεια ή ζωτικής σημασίας σκοπούς. Χρησιμοποιείτε πάντα επίσημα όργανα και πηγές για τέτοιες αποφάσεις. Χρησιμοποιείτε αυτές τις πληροφορίες με δική σας ευθύνη.","h4":"4. Αγορές","p4":"Η Εφαρμογή είναι δωρεάν στη χρήση και υποστηρίζεται από διαφημίσεις. Μπορείτε προαιρετικά να αγοράσετε μια εφάπαξ αναβάθμιση «Κατάργηση διαφημίσεων / Pro» που ξεκλειδώνει ορισμένες λειτουργίες. Όλες οι αγορές επεξεργάζονται και χρεώνονται από το Google Play και υπόκεινται στους όρους και την πολιτική επιστροφής χρημάτων του Google Play. Δεν λαμβάνουμε ούτε αποθηκεύουμε τα στοιχεία πληρωμής σας. Επειδή πρόκειται για εφάπαξ ψηφιακό ξεκλείδωμα, οι αγορές γενικά δεν επιστρέφονται, εκτός εάν απαιτείται από το νόμο ή από τις πολιτικές του Google Play. Μπορείτε να επαναφέρετε μια προηγούμενη αγορά από την Εφαρμογή με τον ίδιο λογαριασμό Google.","h5":"5. Διαφημίσεις","p5":"Εκτός εάν αγοράσετε την αναβάθμιση χωρίς διαφημίσεις, η Εφαρμογή εμφανίζει διαφημίσεις που παρέχονται από τρίτους (συμπεριλαμβανομένου του Google AdMob). Δεν είμαστε υπεύθυνοι για το περιεχόμενο των διαφημίσεων ή για οποιαδήποτε προϊόντα ή υπηρεσίες που προωθούν.","h6":"6. Αποδεκτή χρήση","p6_intro":"Συμφωνείτε να μην:","li6_1":"χρησιμοποιείτε την Εφαρμογή για οποιονδήποτε παράνομο σκοπό ή κατά παράβαση οποιουδήποτε ισχύοντος νόμου ή κανονισμού·","li6_2":"αντιγράφετε, τροποποιείτε, κάνετε αντίστροφη μηχανική, αποσυμπιλάζετε ή επιχειρείτε να εξαγάγετε τον πηγαίο κώδικα της Εφαρμογής, εκτός από την έκταση που αυτός ο περιορισμός απαγορεύεται από το νόμο·","li6_3":"παρεμβαίνετε, διαταράσσετε ή επιχειρείτε να αποκτήσετε μη εξουσιοδοτημένη πρόσβαση στην Εφαρμογή ή στα σχετικά της συστήματα·","li6_4":"χρησιμοποιείτε την Εφαρμογή για να παραβιάσετε τα δικαιώματα άλλων ή για να καταγράψετε περιεχόμενο που δεν σας επιτρέπεται να καταγράψετε· ή","li6_5":"αφαιρείτε, αποκρύπτετε ή τροποποιείτε τυχόν ιδιοκτησιακές σημειώσεις στην Εφαρμογή.","h7":"7. Πνευματική ιδιοκτησία","p7":"Η Εφαρμογή, συμπεριλαμβανομένου του λογισμικού, του σχεδιασμού, των λογοτύπων και των εμπορικών σημάτων της (αλλά εξαιρουμένου του Περιεχομένου σας και υλικού τρίτων), ανήκει στην GO PRACHI LABS και προστατεύεται από τους νόμους περί πνευματικής ιδιοκτησίας. Εκτός από την άδεια που παραχωρήθηκε παραπάνω, δεν σας μεταβιβάζονται δικαιώματα.","h8":"8. Υπηρεσίες τρίτων","p8":"Η Εφαρμογή χρησιμοποιεί υπηρεσίες τρίτων όπως το Google Play Services, το Google Maps, το Google AdMob, το Firebase και το Google Play Billing. Η χρήση από εσάς αυτών των υπηρεσιών ενδέχεται να υπόκειται στους δικούς τους όρους και πολιτικές απορρήτου. Δεν είμαστε υπεύθυνοι για υπηρεσίες ή περιεχόμενο τρίτων.","h9":"9. Αποποίηση εγγυήσεων","p9":"Η Εφαρμογή παρέχεται «ως έχει» και «ως διαθέσιμη», χωρίς εγγυήσεις οποιουδήποτε είδους, ρητές ή σιωπηρές, συμπεριλαμβανομένων των σιωπηρών εγγυήσεων εμπορευσιμότητας, καταλληλότητας για συγκεκριμένο σκοπό, ακρίβειας και μη παραβίασης. Δεν εγγυόμαστε ότι η Εφαρμογή θα είναι αδιάλειπτη, χωρίς σφάλματα, ασφαλής ή ότι οποιαδήποτε πληροφορία παρέχει είναι ακριβής ή αξιόπιστη.","h10":"10. Περιορισμός ευθύνης","p10":"Στο μέγιστο βαθμό που επιτρέπεται από το νόμο, η GO PRACHI LABS και οι θυγατρικές της δεν θα ευθύνονται για οποιεσδήποτε έμμεσες, τυχαίες, ειδικές, επακόλουθες ή ποινικές ζημίες, ή για οποιαδήποτε απώλεια δεδομένων, κερδών ή φήμης, που προκύπτουν από ή σχετίζονται με τη χρήση (ή την αδυναμία χρήσης) της Εφαρμογής. Στο βαθμό που η ευθύνη δεν μπορεί να αποκλειστεί, η συνολική μας ευθύνη περιορίζεται στο ποσό που μας καταβάλατε για την Εφαρμογή (εάν υπάρχει) κατά τους δώδεκα μήνες πριν από την αξίωση.","h11":"11. Αποζημίωση","p11":"Συμφωνείτε να αποζημιώσετε και να απαλλάξετε την GO PRACHI LABS από οποιεσδήποτε αξιώσεις, ζημίες, ευθύνες και έξοδα που προκύπτουν από τη χρήση της Εφαρμογής, το Περιεχόμενό σας ή την παραβίαση αυτών των Όρων από εσάς.","h12":"12. Λήξη","p12":"Μπορείτε να σταματήσετε να χρησιμοποιείτε την Εφαρμογή ανά πάσα στιγμή απεγκαθιστώντας την. Ενδέχεται να αναστείλουμε ή να τερματίσουμε την πρόσβασή σας στην Εφαρμογή εάν παραβιάσετε αυτούς τους Όρους ή εάν διακόψουμε την Εφαρμογή. Οι διατάξεις που από τη φύση τους θα πρέπει να επιβιώνουν του τερματισμού (συμπεριλαμβανομένης της πνευματικής ιδιοκτησίας, των αποποιήσεων και του περιορισμού ευθύνης) θα επιβιώνουν.","h13":"13. Αλλαγές στην Εφαρμογή και τους Όρους","p13":"Ενδέχεται να τροποποιήσουμε ή να διακόψουμε την Εφαρμογή, ή να ενημερώσουμε αυτούς τους Όρους, ανά πάσα στιγμή. Ουσιώδεις αλλαγές θα δημοσιεύονται σε αυτήν τη σελίδα με αναθεωρημένη ημερομηνία έναρξης ισχύος. Η συνεχής χρήση της Εφαρμογής μετά την έναρξη ισχύος των αλλαγών συνιστά αποδοχή των ενημερωμένων Όρων.","h14":"14. Εφαρμοστέο δίκαιο","p14":"Αυτοί οι Όροι διέπονται από τους νόμους της Ινδίας, χωρίς να λαμβάνονται υπόψη οι αρχές σύγκρουσης νόμων. Οποιεσδήποτε διαφορές θα υπόκεινται στην αποκλειστική δικαιοδοσία των αρμόδιων δικαστηρίων που βρίσκονται στην Ινδία, εκτός εάν ισχύει για εσάς διαφορετική υποχρεωτική δικαιοδοσία βάσει της ισχύουσας νομοθεσίας περί προστασίας των καταναλωτών.","h15":"15. Επικοινωνήστε μαζί μας","p15":"Ερωτήσεις σχετικά με αυτούς τους Όρους; Επικοινωνήστε μαζί μας στη διεύθυνση:","footer":"© 2026 GO PRACHI LABS. Με την επιφύλαξη παντός δικαιώματος."},"ui":{"ui_language":"Γλώσσα","ui_note":"Αυτή η μετάφραση παρέχεται για τη διευκόλυνσή σας. Σε περίπτωση οποιασδήποτε ασυμφωνίας, η αγγλική έκδοση είναι η νομικά έγκυρη."}},"cs":{"terms":{"title":"Podmínky služby","eff":"Datum účinnosti: 9 July 2026","intro":"Tyto Podmínky služby („Podmínky“) upravují vaše používání mobilní aplikace GPS Map Camera & Compass („Aplikace“), poskytované společností GO PRACHI LABS („my“, „nás“ nebo „naše“). Stažením, instalací nebo používáním Aplikace souhlasíte s těmito Podmínkami. Pokud nesouhlasíte, Aplikaci prosím nepoužívejte.","h1":"1. Licence k používání Aplikace","p1":"Udělujeme vám osobní, omezenou, nevýhradní, nepřenosnou, odvolatelnou licenci k instalaci a používání Aplikace na zařízeních, která vlastníte nebo ovládáte, pro vaše osobní nebo interní obchodní použití, s výhradou těchto Podmínek a pravidel obchodu s aplikacemi, ze kterého jste ji stáhli.","h2":"2. Váš obsah","p2":"Fotografie, videa a další obsah, který pořídíte nebo vytvoříte pomocí Aplikace („Váš obsah“), patří vám. Aplikace zpracovává Váš obsah ve vašem zařízení, aby přidala polohu, datum/čas, kompas a související informace. Nesete výhradní odpovědnost za Váš obsah a za to, jak jej používáte, ukládáte a sdílíte, a potvrzujete, že máte právo jej pořizovat a používat.","h3":"3. Přesnost polohy a kompasu — důležité","note3":"Poloha, souřadnice, adresa, nadmořská výška, směr kompasu, magnetická deklinace a informace o slunci/měsíci a počasí Aplikace jsou poskytovány pouze pro obecné informační účely a mohou být nepřesné, neúplné nebo opožděné. Nespoléhejte se na Aplikaci pro navigaci, nouzové situace, letectví, námořní plavbu, geodézii, právní, bezpečnostně kritické nebo život ohrožující účely. Pro taková rozhodnutí vždy používejte oficiální nástroje a zdroje. Tyto informace používáte na vlastní riziko.","h4":"4. Nákupy","p4":"Aplikace je zdarma k použití a je podporována reklamou. Volitelně si můžete zakoupit jednorázový upgrade „Odstranit reklamy / Pro“, který odemkne určité funkce. Všechny nákupy jsou zpracovávány a účtovány prostřednictvím Google Play a podléhají podmínkám a zásadám vrácení peněz Google Play. Vaše platební údaje nepřijímáme ani neukládáme. Protože se jedná o jednorázové digitální odemknutí, nákupy jsou obecně nevratné s výjimkou případů vyžadovaných zákonem nebo zásadami Google Play. Předchozí nákup můžete obnovit z Aplikace na stejném účtu Google.","h5":"5. Reklamy","p5":"Pokud si nezakoupíte upgrade bez reklam, Aplikace zobrazuje reklamy poskytované třetími stranami (včetně Google AdMob). Neneseme odpovědnost za obsah reklam ani za produkty nebo služby, které propagují.","h6":"6. Přijatelné použití","p6_intro":"Souhlasíte, že nebudete:","li6_1":"používat Aplikaci k jakémukoli nezákonnému účelu nebo v rozporu s jakýmkoli platným zákonem nebo předpisem;","li6_2":"kopírovat, upravovat, provádět zpětné inženýrství, dekompilovat nebo se pokoušet extrahovat zdrojový kód Aplikace, s výjimkou rozsahu, v jakém je toto omezení zakázáno zákonem;","li6_3":"zasahovat, narušovat nebo se pokoušet získat neoprávněný přístup k Aplikaci nebo jejím souvisejícím systémům;","li6_4":"používat Aplikaci k porušování práv ostatních nebo k pořizování obsahu, který nemáte povoleno pořizovat; nebo","li6_5":"odstraňovat, zakrývat nebo měnit jakákoli vlastnická upozornění v Aplikaci.","h7":"7. Duševní vlastnictví","p7":"Aplikace, včetně jejího softwaru, designu, log a ochranných známek (avšak s výjimkou Vašeho obsahu a materiálů třetích stran), je vlastnictvím společnosti GO PRACHI LABS a je chráněna zákony o duševním vlastnictví. S výjimkou výše udělené licence vám nejsou převedena žádná práva.","h8":"8. Služby třetích stran","p8":"Aplikace využívá služby třetích stran, jako jsou Google Play Services, Google Maps, Google AdMob, Firebase a Google Play Billing. Vaše používání těchto služeb může podléhat jejich vlastním podmínkám a zásadám ochrany osobních údajů. Neneseme odpovědnost za služby ani obsah třetích stran.","h9":"9. Odmítnutí záruk","p9":"Aplikace je poskytována „tak, jak je“ a „jak je k dispozici“, bez záruk jakéhokoli druhu, ať už výslovných nebo předpokládaných, včetně předpokládaných záruk prodejnosti, vhodnosti pro určitý účel, přesnosti a neporušení práv. Nezaručujeme, že Aplikace bude nepřerušená, bezchybná, bezpečná nebo že jakékoli informace, které poskytuje, jsou přesné nebo spolehlivé.","h10":"10. Omezení odpovědnosti","p10":"V maximálním rozsahu povoleném zákonem nebude společnost GO PRACHI LABS a její přidružené společnosti odpovědná za jakékoli nepřímé, náhodné, zvláštní, následné nebo represivní škody ani za jakoukoli ztrátu dat, zisku nebo dobré pověsti vyplývající z vašeho používání (nebo neschopnosti používat) Aplikaci nebo s ním souvisejících. V rozsahu, v jakém odpovědnost nelze vyloučit, je naše celková odpovědnost omezena na částku, kterou jste nám za Aplikaci zaplatili (pokud vůbec) v dvanácti měsících předcházejících nároku.","h11":"11. Odškodnění","p11":"Souhlasíte s tím, že odškodníte a ochráníte společnost GO PRACHI LABS před jakýmikoli nároky, škodami, závazky a výdaji vyplývajícími z vašeho používání Aplikace, Vašeho obsahu nebo vašeho porušení těchto Podmínek.","h12":"12. Ukončení","p12":"Používání Aplikace můžete kdykoli ukončit její odinstalací. Můžeme pozastavit nebo ukončit váš přístup k Aplikaci, pokud porušíte tyto Podmínky nebo pokud Aplikaci ukončíme. Ustanovení, která by svou povahou měla přetrvat po ukončení (včetně duševního vlastnictví, odmítnutí odpovědnosti a omezení odpovědnosti), zůstanou v platnosti.","h13":"13. Změny Aplikace a Podmínek","p13":"Aplikaci můžeme kdykoli upravit nebo ukončit, nebo tyto Podmínky aktualizovat. Podstatné změny budou zveřejněny na této stránce s revidovaným datem účinnosti. Vaše pokračující používání Aplikace poté, co změny nabydou účinnosti, představuje přijetí aktualizovaných Podmínek.","h14":"14. Rozhodné právo","p14":"Tyto Podmínky se řídí zákony Indie, bez ohledu na principy kolizního práva. Jakékoli spory budou podléhat výhradní jurisdikci příslušných soudů nacházejících se v Indii, pokud se na vás nevztahuje jiná závazná jurisdikce podle platných zákonů na ochranu spotřebitele.","h15":"15. Kontaktujte nás","p15":"Máte otázky ohledně těchto Podmínek? Kontaktujte nás na:","footer":"© 2026 GO PRACHI LABS. Všechna práva vyhrazena."},"ui":{"ui_language":"Jazyk","ui_note":"Tento překlad je poskytován pro vaše pohodlí. V případě jakéhokoli rozporu je právně závazná anglická verze."}},"hu":{"terms":{"title":"Szolgáltatási feltételek","eff":"Hatálybalépés dátuma: 9 July 2026","intro":"Ezek a Szolgáltatási feltételek („Feltételek”) szabályozzák a GPS Map Camera & Compass mobilalkalmazás (az „Alkalmazás”) használatát, amelyet a GO PRACHI LABS („mi”, „minket” vagy „miénk”) biztosít. Az Alkalmazás letöltésével, telepítésével vagy használatával elfogadja ezeket a Feltételeket. Ha nem ért egyet, kérjük, ne használja az Alkalmazást.","h1":"1. Az Alkalmazás használatára vonatkozó licenc","p1":"Személyes, korlátozott, nem kizárólagos, nem átruházható, visszavonható licencet biztosítunk Önnek az Alkalmazás telepítésére és használatára az Ön tulajdonában lévő vagy általa ellenőrzött eszközökön, személyes vagy belső üzleti használatra, a jelen Feltételek és annak az alkalmazásáruháznak a szabályai szerint, ahonnan letöltötte.","h2":"2. Az Ön tartalma","p2":"Az Alkalmazással rögzített vagy létrehozott fényképek, videók és egyéb tartalom („Az Ön tartalma”) az Öné. Az Alkalmazás az eszközén dolgozza fel Az Ön tartalmát, hogy hozzáadja a helyet, a dátumot/időt, az iránytűt és a kapcsolódó információkat. Kizárólag Ön felelős Az Ön tartalmáért, valamint annak felhasználásáért, tárolásáért és megosztásáért, és megerősíti, hogy joga van azt rögzíteni és felhasználni.","h3":"3. A helymeghatározás és az iránytű pontossága — fontos","note3":"Az Alkalmazás helyadatai, koordinátái, címe, magassága, iránytű-iránya, mágneses deklinációja, valamint nap-/hold- és időjárási információi kizárólag általános tájékoztató célból szolgálnak, és pontatlanok, hiányosak vagy késleltetettek lehetnek. Ne támaszkodjon az Alkalmazásra navigációs, vészhelyzeti, repülési, tengerhajózási, földmérési, jogi, biztonságkritikus vagy életbe vágó célokra. Az ilyen döntésekhez mindig hivatalos eszközöket és forrásokat használjon. Ezeket az információkat saját felelősségére használja.","h4":"4. Vásárlások","p4":"Az Alkalmazás ingyenesen használható, és hirdetések támogatják. Opcionálisan megvásárolhat egy egyszeri „Hirdetések eltávolítása / Pro” frissítést, amely bizonyos funkciókat felold. Minden vásárlást a Google Play dolgoz fel és számláz ki, és a Google Play feltételeinek és visszatérítési szabályzatának hatálya alá tartozik. Nem kapjuk meg és nem tároljuk fizetési adatait. Mivel ez egyszeri digitális feloldás, a vásárlások általában nem visszatéríthetők, kivéve, ahol azt a törvény vagy a Google Play szabályzatai előírják. Egy korábbi vásárlást visszaállíthat az Alkalmazáson belül ugyanazon a Google-fiókon.","h5":"5. Hirdetések","p5":"Hacsak nem vásárolja meg a hirdetésmentes frissítést, az Alkalmazás harmadik felek (köztük a Google AdMob) által biztosított hirdetéseket jelenít meg. Nem vállalunk felelősséget a hirdetések tartalmáért, sem az általuk népszerűsített termékekért vagy szolgáltatásokért.","h6":"6. Elfogadható használat","p6_intro":"Ön beleegyezik, hogy nem:","li6_1":"használja az Alkalmazást bármilyen jogellenes célra vagy bármely alkalmazandó törvény vagy rendelet megsértésével;","li6_2":"másolja, módosítja, visszafejti, dekompilálja vagy megkísérli kinyerni az Alkalmazás forráskódját, kivéve olyan mértékben, amennyiben ezt a korlátozást a törvény tiltja;","li6_3":"beavatkozik, megzavarja az Alkalmazást vagy annak kapcsolódó rendszereit, vagy megkísérel jogosulatlan hozzáférést szerezni azokhoz;","li6_4":"használja az Alkalmazást mások jogainak megsértésére vagy olyan tartalom rögzítésére, amelynek rögzítésére nincs engedélye; vagy","li6_5":"eltávolítja, elrejti vagy módosítja az Alkalmazásban található tulajdonjogi megjegyzéseket.","h7":"7. Szellemi tulajdon","p7":"Az Alkalmazás, beleértve szoftverét, dizájnját, logóit és védjegyeit (de kizárva Az Ön tartalmát és a harmadik felek anyagait), a GO PRACHI LABS tulajdona, és szellemi tulajdonjogi törvények védik. A fent megadott licenc kivételével semmilyen jog nem száll át Önre.","h8":"8. Harmadik felek szolgáltatásai","p8":"Az Alkalmazás harmadik felek szolgáltatásait használja, mint például a Google Play Services, a Google Maps, a Google AdMob, a Firebase és a Google Play Billing. Ezen szolgáltatások Ön általi használata azok saját feltételeinek és adatvédelmi irányelveinek hatálya alá tartozhat. Nem vállalunk felelősséget a harmadik felek szolgáltatásaiért vagy tartalmáért.","h9":"9. Szavatosság kizárása","p9":"Az Alkalmazást „ahogy van” és „ahogy elérhető” alapon biztosítjuk, bármilyen jellegű, kifejezett vagy hallgatólagos szavatosság nélkül, beleértve az értékesíthetőségre, az adott célra való alkalmasságra, a pontosságra és a jogsértésmentességre vonatkozó hallgatólagos szavatosságokat. Nem szavatoljuk, hogy az Alkalmazás megszakítás nélküli, hibamentes, biztonságos lesz, vagy hogy az általa nyújtott bármely információ pontos vagy megbízható.","h10":"10. Felelősség korlátozása","p10":"A törvény által megengedett legnagyobb mértékben a GO PRACHI LABS és leányvállalatai nem vállalnak felelősséget semmilyen közvetett, véletlen, különleges, következményes vagy büntető jellegű kárért, sem adatvesztésért, nyereségért vagy jó hírnév elvesztéséért, amely az Alkalmazás Ön általi használatából (vagy használatának képtelenségéből) ered vagy azzal kapcsolatos. Amennyiben a felelősség nem zárható ki, teljes felelősségünk arra az összegre korlátozódik, amelyet az Alkalmazásért fizetett nekünk (ha van ilyen) az igényt megelőző tizenkét hónapban.","h11":"11. Kártalanítás","p11":"Ön beleegyezik, hogy kártalanítja és mentesíti a GO PRACHI LABS-t minden olyan igény, kár, felelősség és költség alól, amely az Alkalmazás Ön általi használatából, Az Ön tartalmából vagy a jelen Feltételek Ön általi megsértéséből ered.","h12":"12. Megszűnés","p12":"Bármikor abbahagyhatja az Alkalmazás használatát annak eltávolításával. Fel
