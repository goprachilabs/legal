앱을 다운로드한 앱 스토어의 규칙에 따라, 귀하의 개인적 또는 내부 업무 사용을 위해 귀하가 소유하거나 관리하는 기기에 본 앱을 설치하고 사용할 수 있는 개인적, 제한적, 비독점적, 양도 불가능, 취소 가능한 라이선스를 귀하에게 부여합니다.","h2":"2. 귀하의 콘텐츠","p2":"귀하가 본 앱으로 촬영하거나 생성한 사진, 동영상 및 기타 콘텐츠(\"귀하의 콘텐츠\")는 귀하에게 귀속됩니다. 본 앱은 위치, 날짜/시간, 나침반 및 관련 정보를 추가하기 위해 귀하의 기기에서 귀하의 콘텐츠를 처리합니다. 귀하는 귀하의 콘텐츠와 그것을 사용, 저장 및 공유하는 방식에 대해 전적으로 책임이 있으며, 그것을 촬영하고 사용할 권리가 있음을 확인합니다.","h3":"3. 위치 및 나침반 정확도 — 중요","note3":"본 앱의 위치, 좌표, 주소, 고도, 나침반 방위, 자기 편각, 일출·일몰, 달 및 날씨 정보는 일반적인 정보 제공 목적으로만 제공되며 부정확하거나 불완전하거나 지연될 수 있습니다. 내비게이션, 긴급 상황, 항공, 해양, 측량, 법률, 안전이 중요하거나 생명에 중요한 목적으로 본 앱에 의존하지 마십시오. 그러한 결정에는 항상 공식 기기 및 출처를 사용하십시오. 귀하는 이 정보를 자신의 위험 부담으로 사용합니다.","h4":"4. 구매","p4":"본 앱은 무료로 사용할 수 있으며 광고로 지원됩니다. 귀하는 선택적으로 특정 기능을 잠금 해제하는 일회성 \"광고 제거 / Pro\" 업그레이드를 구매할 수 있습니다. 모든 구매는 Google Play에 의해 처리 및 청구되며 Google Play의 약관 및 환불 정책의 적용을 받습니다. 당사는 귀하의 결제 세부정보를 받거나 저장하지 않습니다. 일회성 디지털 잠금 해제이므로, 구매는 법률 또는 Google Play의 정책에서 요구하는 경우를 제외하고 일반적으로 환불되지 않습니다. 동일한 Google 계정에서 본 앱 내에서 이전 구매를 복원할 수 있습니다.","h5":"5. 광고","p5":"광고 없는 업그레이드를 구매하지 않는 한, 본 앱은 제3자(Google AdMob 포함)가 제공하는 광고를 표시합니다. 당사는 광고 내용이나 그들이 홍보하는 제품 또는 서비스에 대해 책임지지 않습니다.","h6":"6. 허용되는 사용","p6_intro":"귀하는 다음을 하지 않을 것에 동의합니다:","li6_1":"본 앱을 불법적인 목적으로 또는 적용 가능한 법률이나 규정을 위반하여 사용하는 것;","li6_2":"이 제한이 법률에 의해 금지되는 범위를 제외하고, 본 앱의 소스 코드를 복사, 수정, 리버스 엔지니어링, 디컴파일 또는 추출하려고 시도하는 것;","li6_3":"본 앱이나 관련 시스템을 방해, 교란하거나 무단 접근을 시도하는 것;","li6_4":"본 앱을 사용하여 타인의 권리를 침해하거나 촬영이 허용되지 않는 콘텐츠를 촬영하는 것; 또는","li6_5":"본 앱의 소유권 고지를 제거, 가리거나 변경하는 것.","h7":"7. 지적 재산권","p7":"본 앱은 그 소프트웨어, 디자인, 로고 및 상표(단, 귀하의 콘텐츠 및 제3자 자료 제외)를 포함하여 GO PRACHI LABS가 소유하며 지적 재산권 법률에 의해 보호됩니다. 위에서 부여된 라이선스를 제외하고 어떠한 권리도 귀하에게 이전되지 않습니다.","h8":"8. 제3자 서비스","p8":"본 앱은 Google Play Services, Google Maps, Google AdMob, Firebase 및 Google Play Billing과 같은 제3자 서비스를 사용합니다. 귀하의 이러한 서비스 사용은 각자의 약관 및 개인정보 처리방침의 적용을 받을 수 있습니다. 당사는 제3자 서비스나 콘텐츠에 대해 책임지지 않습니다.","h9":"9. 보증의 부인","p9":"본 앱은 \"있는 그대로\" 및 \"이용 가능한 대로\" 제공되며, 상품성, 특정 목적에의 적합성, 정확성 및 비침해에 대한 묵시적 보증을 포함하여 명시적이든 묵시적이든 어떠한 종류의 보증도 없이 제공됩니다. 당사는 본 앱이 중단되지 않거나, 오류가 없거나, 안전하거나, 제공하는 정보가 정확하거나 신뢰할 수 있음을 보증하지 않습니다.","h10":"10. 책임의 제한","p10":"법률이 허용하는 최대 범위 내에서, GO PRACHI LABS와 그 계열사는 귀하의 본 앱 사용(또는 사용 불능)으로 인해 발생하거나 이와 관련된 어떠한 간접적, 부수적, 특별, 결과적 또는 징벌적 손해, 또는 데이터, 이익 또는 영업권의 손실에 대해서도 책임지지 않습니다. 책임을 배제할 수 없는 범위에서, 당사의 총 책임은 청구 이전 12개월 동안 귀하가 본 앱에 대해 당사에 지불한 금액(있는 경우)으로 제한됩니다.","h11":"11. 면책","p11":"귀하는 귀하의 본 앱 사용, 귀하의 콘텐츠, 또는 귀하의 본 약관 위반으로 인해 발생하는 모든 청구, 손해, 책임 및 비용으로부터 GO PRACHI LABS를 면책하고 손해를 입지 않게 할 것에 동의합니다.","h12":"12. 해지","p12":"귀하는 언제든지 본 앱을 제거하여 사용을 중단할 수 있습니다. 귀하가 본 약관을 위반하거나 당사가 본 앱을 중단하는 경우, 당사는 귀하의 본 앱 접근을 정지하거나 종료할 수 있습니다. 그 성질상 해지 후에도 존속해야 하는 조항(지적 재산권, 면책 조항 및 책임의 제한 포함)은 존속합니다.","h13":"13. 본 앱 및 약관의 변경","p13":"당사는 언제든지 본 앱을 수정하거나 중단하거나 본 약관을 업데이트할 수 있습니다. 중요한 변경 사항은 개정된 시행일과 함께 이 페이지에 게시됩니다. 변경이 발효된 후 귀하가 본 앱을 계속 사용하는 것은 업데이트된 약관을 수락하는 것을 구성합니다.","h14":"14. 준거법","p14":"본 약관은 법률 저촉 원칙에 관계없이 인도 법률의 적용을 받습니다. 적용 가능한 소비자 보호법에 따라 귀하에게 다른 강행적 관할권이 적용되지 않는 한, 모든 분쟁은 인도에 소재한 관할 법원의 전속 관할권의 적용을 받습니다.","h15":"15. 문의처","p15":"본 약관에 대한 질문이 있으십니까? 다음으로 연락해 주십시오:","footer":"© 2026 GO PRACHI LABS. All rights reserved."},"ui":{"ui_language":"언어","ui_note":"이 번역은 귀하의 편의를 위해 제공됩니다. 불일치가 있는 경우 영어 버전이 법적으로 유효한 것입니다."}},"sw":{"terms":{"title":"Masharti ya Huduma","eff":"Tarehe ya kuanza kutumika: 9 July 2026","intro":"Masharti haya ya Huduma (\"Masharti\") yanatawala matumizi yako ya programu ya simu ya GPS Map Camera & Compass (\"Programu\"), inayotolewa na GO PRACHI LABS (\"sisi\", \"letu\"). Kwa kupakua, kusakinisha, au kutumia Programu, unakubali Masharti haya. Ikiwa hukubali, tafadhali usitumie Programu.","h1":"1. Leseni ya kutumia Programu","p1":"Tunakupa leseni ya kibinafsi, yenye kikomo, isiyo ya kipekee, isiyohamishika, inayoweza kubatilishwa ya kusakinisha na kutumia Programu kwenye vifaa unavyomiliki au kudhibiti, kwa matumizi yako ya kibinafsi au ya biashara ya ndani, kulingana na Masharti haya na kanuni za duka la programu ulilopakua kutoka.","h2":"2. Maudhui yako","p2":"Picha, video, na maudhui mengine unayonasa au kutengeneza kwa Programu (\"Maudhui Yako\") ni yako. Programu huchakata Maudhui Yako kwenye kifaa chako ili kuongeza mahali, tarehe/saa, dira, na taarifa zinazohusiana. Wewe ndiye unayewajibika pekee kwa Maudhui Yako na jinsi unavyoyatumia, kuyahifadhi, na kuyashiriki, na unathibitisha kuwa una haki ya kuyanasa na kuyatumia.","h3":"3. Usahihi wa mahali na dira — muhimu","note3":"Taarifa za mahali, kuratibu, anwani, mwinuko, mwelekeo wa dira, mkengeuko wa sumaku, na jua/mwezi na hali ya hewa za Programu hutolewa kwa madhumuni ya taarifa ya jumla tu na zinaweza kuwa si sahihi, si kamili, au kuchelewa. Usitegemee Programu kwa madhumuni ya urambazaji, dharura, anga, bahari, upimaji, kisheria, muhimu kwa usalama, au muhimu kwa maisha. Kila mara tumia vyombo na vyanzo rasmi kwa maamuzi kama hayo. Unatumia taarifa hii kwa hatari yako mwenyewe.","h4":"4. Manunuzi","p4":"Programu ni ya bure kutumia na inasaidiwa na matangazo. Unaweza kwa hiari kununua uboreshaji wa mara moja wa \"Ondoa Matangazo / Pro\" unaofungua vipengele fulani. Manunuzi yote huchakatwa na kutozwa na Google Play, na yanategemea masharti na sera ya kurejesha pesa ya Google Play. Hatupokei wala kuhifadhi maelezo yako ya malipo. Kwa sababu ni ufunguaji wa kidijitali wa mara moja, manunuzi kwa ujumla hayarudishwi isipokuwa pale inapohitajika na sheria au sera za Google Play. Unaweza kurejesha manunuzi ya awali kutoka ndani ya Programu kwa akaunti ile ile ya Google.","h5":"5. Matangazo","p5":"Isipokuwa ununue uboreshaji usio na matangazo, Programu huonyesha matangazo yanayotolewa na wahusika wengine (ikiwemo Google AdMob). Hatuwajibiki kwa maudhui ya matangazo au kwa bidhaa au huduma zozote wanazotangaza.","h6":"6. Matumizi yanayokubalika","p6_intro":"Unakubali kutofanya:","li6_1":"kutumia Programu kwa madhumuni yoyote haramu au kwa ukiukaji wa sheria au kanuni yoyote inayotumika;","li6_2":"kunakili, kurekebisha, kufanya uhandisi kinyume, kufungua msimbo, au kujaribu kutoa msimbo chanzo wa Programu, isipokuwa kwa kiwango ambacho kizuizi hiki kimekatazwa na sheria;","li6_3":"kuingilia, kuvuruga, au kujaribu kupata ufikiaji usioidhinishwa wa Programu au mifumo yake inayohusiana;","li6_4":"kutumia Programu kukiuka haki za wengine au kunasa maudhui usioruhusiwa kunasa; au","li6_5":"kuondoa, kuficha, au kubadilisha ilani zozote za umiliki katika Programu.","h7":"7. Miliki ya kiakili","p7":"Programu, ikijumuisha programu yake, muundo, nembo, na alama za biashara (lakini bila kujumuisha Maudhui Yako na vifaa vya wahusika wengine), inamilikiwa na GO PRACHI LABS na inalindwa na sheria za miliki ya kiakili. Isipokuwa leseni iliyotolewa hapo juu, hakuna haki zinazohamishwa kwako.","h8":"8. Huduma za wahusika wengine","p8":"Programu hutumia huduma za wahusika wengine kama vile Google Play Services, Google Maps, Google AdMob, Firebase, na Google Play Billing. Matumizi yako ya huduma hizo yanaweza kuwa chini ya masharti na sera zao za faragha. Hatuwajibiki kwa huduma au maudhui ya wahusika wengine.","h9":"9. Kanusho la dhamana","p9":"Programu hutolewa kwa msingi wa \"kama ilivyo\" na \"kama inavyopatikana\", bila dhamana za aina yoyote, ziwe za wazi au za dhahiri, ikijumuisha dhamana za dhahiri za uuzaji, ufaafu kwa kusudi maalum, usahihi, na kutokiuka. Hatudhamini kwamba Programu itakuwa bila kukatizwa, bila hitilafu, salama, au kwamba taarifa yoyote inayotoa ni sahihi au ya kuaminika.","h10":"10. Kikomo cha dhima","p10":"Kwa kiwango cha juu kinachoruhusiwa na sheria, GO PRACHI LABS na washirika wake hawatawajibika kwa uharibifu wowote usio wa moja kwa moja, wa bahati mbaya, maalum, wa matokeo, au wa adhabu, au kwa upotevu wowote wa data, faida, au sifa njema, unaotokana na au unaohusiana na matumizi yako ya (au kutoweza kutumia) Programu. Kwa kiwango ambacho dhima haiwezi kuondolewa, dhima yetu ya jumla imefungwa kwa kiasi ulichotulipa kwa Programu (kama kipo) katika miezi kumi na miwili kabla ya dai.","h11":"11. Fidia","p11":"Unakubali kufidia na kulinda GO PRACHI LABS dhidi ya madai, uharibifu, dhima, na gharama zozote zinazotokana na matumizi yako ya Programu, Maudhui Yako, au ukiukaji wako wa Masharti haya.","h12":"12. Kusitisha","p12":"Unaweza kusimamisha kutumia Programu wakati wowote kwa kuiondoa. Tunaweza kusimamisha au kukomesha ufikiaji wako wa Programu ukikiuka Masharti haya au tukikatiza Programu. Vifungu ambavyo kwa asili yake vinapaswa kubaki baada ya kusitisha (ikiwemo miliki ya kiakili, makanusho, na kikomo cha dhima) vitabaki.","h13":"13. Mabadiliko ya Programu na Masharti","p13":"Tunaweza kurekebisha au kukatiza Programu, au kusasisha Masharti haya, wakati wowote. Mabadiliko muhimu yatawekwa kwenye ukurasa huu na tarehe iliyorekebishwa ya kuanza kutumika. Kuendelea kwako kutumia Programu baada ya mabadiliko kuanza kutumika kunaunda kukubali Masharti yaliyosasishwa.","h14":"14. Sheria inayoongoza","p14":"Masharti haya yanaongozwa na sheria za India, bila kujali kanuni za mgongano wa sheria. Migogoro yoyote itakuwa chini ya mamlaka ya kipekee ya mahakama zenye uwezo zilizoko India, isipokuwa mamlaka tofauti ya lazima inakuhusu chini ya sheria inayotumika ya ulinzi wa mtumiaji.","h15":"15. Wasiliana nasi","p15":"Maswali kuhusu Masharti haya? Wasiliana nasi kupitia:","footer":"© 2026 GO PRACHI LABS. All rights reserved."},"ui":{"ui_language":"Lugha","ui_note":"Tafsiri hii inatolewa kwa urahisi wako. Iwapo kutakuwa na tofauti yoyote, toleo la Kiingereza ndilo lenye mamlaka ya kisheria."}},"am":{"terms":{"title":"የአገልግሎት ውል","eff":"የሚጸናበት ቀን፦ 9 July 2026","intro":"እነዚህ የአገልግሎት ውሎች (\"ውሎች\") በ GO PRACHI LABS (\"እኛ\"፣ \"የእኛ\") የቀረበውን የሞባይል መተግበሪያ GPS Map Camera & Compass (\"መተግበሪያው\") አጠቃቀምዎን ይቆጣጠራሉ። መተግበሪያውን በማውረድ፣ በመጫን ወይም በመጠቀም እነዚህን ውሎች ተስማምተዋል። ካልተስማሙ፣ እባክዎ መተግበሪያውን አይጠቀሙ።","h1":"1. መተግበሪያውን የመጠቀም ፈቃድ","p1":"እነዚህን ውሎችና ካወረዱበት የመተግበሪያ መደብር ደንቦች ተገዢ በመሆን፣ ለግል ወይም ለውስጥ የንግድ አጠቃቀምዎ በሚይዟቸው ወይም በሚቆጣጠሯቸው መሣሪያዎች ላይ መተግበሪያውን ለመጫንና ለመጠቀም የግል፣ ውሱን፣ ብቸኛ ያልሆነ፣ የማይተላለፍ፣ ሊሻር የሚችል ፈቃድ እንሰጥዎታለን።","h2":"2. የእርስዎ ይዘት","p2":"በመተግበሪያው የሚቀርጹት ወይም የሚፈጥሩት ፎቶዎች፣ ቪዲዮዎችና ሌሎች ይዘቶች (\"የእርስዎ ይዘት\") የእርስዎ ናቸው። መተግበሪያው አካባቢን፣ ቀን/ሰዓትን፣ ኮምፓስን እና ተዛማጅ መረጃን ለማከል የእርስዎን ይዘት በመሣሪያዎ ላይ ይሠራል። ለእርስዎ ይዘትና እንዴት እንደሚጠቀሙበት፣ እንደሚያከማቹትና እንደሚያጋሩት ብቸኛ ኃላፊነት አለብዎ፣ እና እሱን የመቅረጽና የመጠቀም መብት እንዳለዎት ያረጋግጣሉ።","h3":"3. የአካባቢና የኮምፓስ ትክክለኛነት — አስፈላጊ","note3":"የመተግበሪያው አካባቢ፣ መጋጠሚያዎች፣ አድራሻ፣ ከፍታ፣ የኮምፓስ አቅጣጫ፣ የመግነጢሳዊ መዛነፍ፣ እና የፀሐይ/ጨረቃና የአየር ሁኔታ መረጃ ለአጠቃላይ የመረጃ ዓላማ ብቻ የሚቀርቡ ናቸው እና ትክክለኛ ያልሆኑ፣ ያልተሟሉ ወይም የዘገዩ ሊሆኑ ይችላሉ። ለአሰሳ፣ ለአስቸኳይ ጊዜ፣ ለአቪዬሽን፣ ለባህር፣ ለቅየሳ፣ ለሕጋዊ፣ ለደህንነት-ወሳኝ ወይም ለሕይወት-ወሳኝ ዓላማዎች በመተግበሪያው ላይ አይመኩ። ለእንደዚህ ያሉ ውሳኔዎች ሁልጊዜ ኦፊሴላዊ መሣሪያዎችንና ምንጮችን ይጠቀሙ። ይህን መረጃ በራስዎ አደጋ ይጠቀማሉ።","h4":"4. ግዢዎች","p4":"መተግበሪያው ለመጠቀም ነፃ ነው እና በማስታወቂያ ይደገፋል። አንዳንድ ባህሪያትን የሚከፍት የአንድ-ጊዜ \"ማስታወቂያ አስወግድ / Pro\" ማሻሻያ በአማራጭ መግዛት ይችላሉ። ሁሉም ግዢዎች በ Google Play ይሠራሉና ይከፈላሉ፣ እና በ Google Play ውሎችና የተመላሽ ገንዘብ ፖሊሲ ተገዢ ናቸው። የክፍያ ዝርዝሮችዎን አንቀበልም ወይም አናከማችም። የአንድ-ጊዜ የዲጂታል መክፈቻ በመሆኑ፣ ግዢዎች በሕግ ወይም በ Google Play ፖሊሲዎች ካልተፈለገ በስተቀር በአጠቃላይ ተመላሽ አይደረጉም። ቀደም ሲል የተደረገ ግዢን በተመሳሳይ Google መለያ ከመተግበሪያው ውስጥ መመለስ ይችላሉ።","h5":"5. ማስታወቂያዎች","p5":"ማስታወቂያ-አልባ ማሻሻያ ካልገዙ በስተቀር፣ መተግበሪያው በሶስተኛ ወገኖች (Google AdMob ን ጨምሮ) የቀረቡ ማስታወቂያዎችን ያሳያል። ለማስታወቂያዎች ይዘት ወይም ለሚያስተዋውቋቸው ማናቸውም ምርቶች ወይም አገልግሎቶች ኃላፊነት የለብንም።","h6":"6. ተቀባይነት ያለው አጠቃቀም","p6_intro":"የሚከተሉትን ላለማድረግ ተስማምተዋል፦","li6_1":"መተግበሪያውን ለማንኛውም ሕገ-ወጥ ዓላማ ወይም ማንኛውንም ተፈጻሚ ሕግ ወይም ደንብ በመጣስ መጠቀም፤","li6_2":"ይህ ገደብ በሕግ ከተከለከለበት መጠን በስተቀር የመተግበሪያውን ምንጭ ኮድ መቅዳት፣ ማሻሻል፣ በተገላቢጦሽ ማምረት፣ ማፍታት ወይም ለማውጣት መሞከር፤","li6_3":"መተግበሪያውን ወይም ተዛማጅ ስርዓቶቹን ማወክ፣ ማስተጓጎል ወይም ያልተፈቀደ መዳረሻ ለማግኘት መሞከር፤","li6_4":"የሌሎችን መብቶች ለመጣስ ወይም ለመቅረጽ ያልተፈቀደልዎትን ይዘት ለመቅረጽ መተግበሪያውን መጠቀም፤ ወይም","li6_5":"በመተግበሪያው ውስጥ ማንኛውንም የባለቤትነት ማስታወቂያዎች ማስወገድ፣ መደበቅ ወይም መለወጥ።","h7":"7. የአእምሮ ንብረት","p7":"መተግበሪያው፣ ሶፍትዌሩን፣ ንድፉን፣ አርማዎቹንና የንግድ ምልክቶቹን ጨምሮ (ነገር ግን የእርስዎን ይዘትና የሶስተኛ ወገን ቁሳቁሶችን ሳይጨምር)፣ በ GO PRACHI LABS የተያዘ ሲሆን በአእምሮ ንብረት ሕጎች የተጠበቀ ነው። ከላይ ከተሰጠው ፈቃድ በስተቀር፣ ምንም መብቶች ወደ እርስዎ አይተላለፉም።","h8":"8. የሶስተኛ ወገን አገልግሎቶች","p8":"መተግበሪያው እንደ Google Play Services፣ Google Maps፣ Google AdMob፣ Firebase እና Google Play Billing ያሉ የሶስተኛ ወገን አገልግሎቶችን ይጠቀማል። እነዚያን አገልግሎቶች መጠቀምዎ በራሳቸው ውሎችና የግላዊነት ፖሊሲዎች ተገዢ ሊሆን ይችላል። ለሶስተኛ ወገን አገልግሎቶች ወይም ይዘት ኃላፊነት የለብንም።","h9":"9. የዋስትና ማስተባበያ","p9":"መተግበሪያው በ\"እንዳለ\" እና \"እንደሚገኝ\" መሠረት ይቀርባል፣ ምንም ዓይነት ዋስትና ሳይኖረው፣ ግልጽም ሆነ ተዘዋዋሪ፣ የንግድ ተስማሚነት፣ ለተወሰነ ዓላማ ተስማሚነት፣ ትክክለኛነት እና አለመጣስ ተዘዋዋሪ ዋስትናዎችን ጨምሮ። መተግበሪያው ሳይቋረጥ፣ ስህተት-አልባ፣ ደህንነቱ የተጠበቀ እንደሚሆን ወይም የሚያቀርበው ማንኛውም መረጃ ትክክለኛ ወይም አስተማማኝ እንደሆነ ዋስትና አንሰጥም።","h10":"10. የተጠያቂነት ገደብ","p10":"በሕግ በሚፈቀደው ከፍተኛ መጠን፣ GO PRACHI LABS እና ተባባሪዎቹ የመተግበሪያውን መጠቀም (ወይም መጠቀም አለመቻል) ከመጠቀም ከሚነሱ ወይም ከሚዛመዱ ማንኛውም ተዘዋዋሪ፣ አጋጣሚያዊ፣ ልዩ፣ ተከታይ ወይም የቅጣት ጉዳቶች፣ ወይም ለማንኛውም የውሂብ፣ የትርፍ ወይም የመልካም ስም ኪሳራ ተጠያቂ አይሆኑም። ተጠያቂነት ሊገለል በማይችልበት መጠን፣ አጠቃላይ ተጠያቂነታችን ከክሱ በፊት ባሉት አስራ ሁለት ወራት ውስጥ ለመተግበሪያው የከፈሉን መጠን (ካለ) ተወስኗል።","h11":"11. ካሳ","p11":"ከመተግበሪያው አጠቃቀምዎ፣ ከእርስዎ ይዘት ወይም እነዚህን ውሎች ከመጣስዎ ከሚነሱ ማንኛውም የይገባኛል ጥያቄዎች፣ ጉዳቶች፣ ተጠያቂነቶችና ወጪዎች GO PRACHI LABS ን ለመካስና ከጉዳት ለመጠበቅ ተስማምተዋል።","h12":"12. ማቋረጥ","p12":"በማንኛውም ጊዜ መተግበሪያውን በማራገፍ መጠቀም ማቆም ይችላሉ። እነዚህን ውሎች ከጣሱ ወይም መተግበሪያውን ካቋረጥን የመተግበሪያውን መዳረሻዎን ልናግድ ወይም ልናቋርጥ እንችላለን። በተፈጥሯቸው ከማቋረጥ በኋላ ሊቆዩ የሚገባቸው ድንጋጌዎች (የአእምሮ ንብረትን፣ ማስተባበያዎችንና የተጠያቂነት ገደብን ጨምሮ) ይቆያሉ።","h13":"13. በመተግበሪያውና በውሎች ላይ ለውጦች","p13":"በማንኛውም ጊዜ መተግበሪያውን ልናሻሽል ወይም ልናቋርጥ ወይም እነዚህን ውሎች ልናዘምን እንችላለን። ጉልህ ለውጦች በተሻሻለ የሚጸናበት ቀን ጋር በዚህ ገጽ ላይ ይለጠፋሉ። ለውጦች ከጸኑ በኋላ መተግበሪያውን መጠቀም መቀጠልዎ የተዘመኑትን ውሎች መቀበልን ያመለክታል።","h14":"14. የበላይ ሕግ","p14":"እነዚህ ውሎች የሕግ ግጭት መርሆችን ከግምት ውስጥ ሳያስገቡ በ India ሕጎች ይተዳደራሉ። ተፈጻሚ በሆነ የሸማች-ጥበቃ ሕግ ስር የተለየ የግዴታ ስልጣን በእርስዎ ላይ ተፈጻሚ ካልሆነ በስተቀር፣ ማንኛውም ክርክር India ውስጥ ባሉ ብቁ ፍርድ ቤቶች ብቸኛ ስልጣን ስር ይሆናል።","h15":"15. ያግኙን","p15":"ስለ እነዚህ ውሎች ጥያቄዎች? በሚከተለው ያግኙን፦","footer":"© 2026 GO PRACHI LABS. All rights reserved."},"ui":{"ui_language":"ቋንቋ","ui_note":"ይህ ትርጉም ለምቾትዎ ተሰጥቷል። ማንኛውም ልዩነት ቢኖር፣ የእንግሊዝኛው ስሪት በሕግ ተቀባይነት ያለው ነው።"}},"ha":{"terms":{"title":"Sharuɗɗan Sabis","eff":"Ranar fara aiki: 9 July 2026","intro":"Waɗannan Sharuɗɗan Sabis (\"Sharuɗɗa\") suna tafiyar da amfaninku da manhajar wayar salula ta GPS Map Camera & Compass (\"Manhajar\"), wadda GO PRACHI LABS (\"mu\", \"namu\") ke bayarwa. Ta hanyar sauke, girka, ko amfani da Manhajar, kun yarda da waɗannan Sharuɗɗa. Idan ba ku yarda ba, da fatan kada ku yi amfani da Manhajar.","h1":"1. Lasisin amfani da Manhajar","p1":"Muna ba ku lasisi na sirri, mai iyaka, wanda ba na keɓancewa ba, wanda ba a iya canja shi ba, wanda ana iya sokewa don girka da amfani da Manhajar a na'urorin da kuke mallaka ko sarrafa, don amfaninku na sirri ko na kasuwanci na ciki, bisa ga waɗannan Sharuɗɗa da ƙa'idodin kantin manhaja da kuka sauke ta daga.","h2":"2. Abubuwanku","p2":"Hotuna, bidiyoyi, da sauran abubuwan da kuke ɗauka ko ƙirƙira da Manhajar (\"Abubuwanku\") naku ne. Manhajar tana sarrafa Abubuwanku a na'urarku don ƙara wuri, kwanan wata/lokaci, kamfas, da bayanan da suka danganci. Ku kaɗai ke da alhakin Abubuwanku da yadda kuke amfani da su, adana su, da raba su, kuma kun tabbatar cewa kuna da haƙƙin ɗaukar su da amfani da su.","h3":"3. Daidaiton wuri da kamfas — muhimmi","note3":"Bayanan wuri, daidaitawa, adireshi, tsayi, alkiblar kamfas, karkatar da maganadisu, da rana/wata da yanayi na Manhajar ana bayar da su ne don manufofin bayani gaba ɗaya kawai kuma za su iya zama ba daidai ba, ba cikakke ba, ko jinkiri. Kada ku dogara ga Manhajar don manufofin kewayawa, gaggawa, jiragen sama, teku, aunawa, shari'a, masu muhimmanci ga aminci, ko masu muhimmanci ga rayuwa. Kullum ku yi amfani da kayan aiki da tushe na hukuma don irin waɗannan yanke shawara. Kuna amfani da wannan bayanin ne bisa haɗarin kanku.","h4":"4. Sayayya","p4":"Manhajar kyauta ce don amfani kuma tallace-tallace ke tallafa mata. Kuna iya zaɓen sayen haɓakawar sau ɗaya ta \"Cire Tallace-tallace / Pro\" wadda ke buɗe wasu abubuwa. Google Play ne ke sarrafa da lissafa duk sayayya, kuma suna ƙarƙashin sharuɗɗa da manufar mayar da kuɗi na Google Play. Ba ma karɓa ko adana bayanan biyanku ba. Saboda buɗe dijital ne na sau ɗaya, gabaɗaya ba a mayar da kuɗin sayayya sai dai inda doka ko manufofin Google Play suka buƙata. Kuna iya dawo da sayayyar da ta gabata daga cikin Manhajar a wannan asusun Google.","h5":"5. Tallace-tallace","p5":"Sai dai idan kun sayi haɓakawar rashin talla, Manhajar tana nuna tallace-tallace da wasu ɓangarori ke bayarwa (gami da Google AdMob). Ba mu da alhakin abin da ke cikin tallace-tallace ko duk wani samfuri ko sabis da suke haɓakawa.","h6":"6. Amfani da aka yarda da shi","p6_intro":"Kun yarda cewa ba za ku:","li6_1":"yi amfani da Manhajar don kowace manufa ta haramtacciya ko cin karo da kowace doka ko ƙa'ida da ta dace;","li6_2":"kwafa, gyara, sake gina injiniya, wargaza, ko yunƙurin fitar da lambar tushe ta Manhajar, sai dai gwargwadon abin da doka ta haramta wannan taƙaitawa;","li6_3":"tsoma baki, tarwatsa, ko yunƙurin samun damar da ba a ba da izini ba ga Manhajar ko tsarinta masu alaƙa;","li6_4":"yi amfani da Manhajar don keta haƙƙin wasu ko ɗaukar abin da ba a ba ku izinin ɗauka ba; ko","li6_5":"cire, ɓoye, ko canza duk wata sanarwar mallaka a cikin Manhajar.","h7":"7. Haƙƙin mallakar hankali","p7":"Manhajar, gami da software ɗinta, ƙira, tambura, da alamomin kasuwanci (amma ban da Abubuwanku da kayan wasu ɓangarori), mallakar GO PRACHI LABS ce kuma dokokin mallakar hankali ke kāre ta. Sai dai lasisin da aka bayar a sama, babu haƙƙin da ake canjawa gare ku.","h8":"8. Ayyukan wasu ɓangarori","p8":"Manhajar tana amfani da ayyukan wasu ɓangarori kamar Google Play Services, Google Maps, Google AdMob, Firebase, da Google Play Billing. Amfaninku da waɗannan ayyuka na iya kasancewa ƙarƙashin sharuɗɗa da manufofin sirrinsu. Ba mu da alhakin ayyuka ko abubuwan wasu ɓangarori.","h9":"9. Ƙin lamunin garanti","p9":"Ana bayar da Manhajar bisa tushen \"kamar yadda take\" da \"kamar yadda ake samu\", ba tare da garanti na kowane iri ba, ko a bayyane ko a ɓoye, gami da garanti na ɓoye na cinikayya, dacewa da wata manufa ta musamman, daidaito, da rashin keta. Ba ma ba da garantin cewa Manhajar za ta kasance ba tare da katsewa ba, mara kuskure, mai tsaro, ko cewa duk wani bayanin da take bayarwa daidai ne ko abin dogaro.","h10":"10. Iyakance alhaki","p10":"Gwargwadon iyakar da doka ta ba da izini, GO PRACHI LABS da abokan huldarta ba za su ɗauki alhakin kowace illa ta kai-tsaye ba, ta bazata, ta musamman, ta sakamako, ko ta hukunci, ko kowace asarar bayanai, riba, ko martaba, da ta taso daga ko ta danganci amfaninku da (ko rashin iya amfani da) Manhajar. Gwargwadon abin da ba a iya cire alhaki, jimlar alhakinmu ya iyakance ga adadin da kuka biya mu don Manhajar (idan akwai) a cikin watanni goma sha biyu kafin da'awar.","h11":"11. Rama diyya","p11":"Kun yarda ku rama diyya da kiyaye GO PRACHI LABS daga duk wani da'awa, illa, alhaki, da kashe kuɗi da ke tasowa daga amfaninku da Manhajar, Abubuwanku, ko ketarku ga waɗannan Sharuɗɗa.","h12":"12. Ƙarewa","p12":"Kuna iya dakatar da amfani da Manhajar a kowane lokaci ta hanyar cire ta. Za mu iya dakatarwa ko kawo ƙarshen damar ku ga Manhajar idan kun keta waɗannan Sharuɗɗa ko idan mun daina Manhajar. Tanade-tanaden da bisa yanayinsu ya kamata su tsira daga ƙarewa (gami da mallakar hankali, ƙin lamuni, da iyakance alhaki) za su tsira.","h13":"13. Canje-canje ga Manhajar da Sharuɗɗa","p13":"Za mu iya gyara ko dakatar da Manhajar, ko sabunta waɗannan Sharuɗɗa, a kowane lokaci. Za a saka manyan canje-canje a wannan shafin tare da gyararren ranar fara aiki. Ci gaba da amfaninku da Manhajar bayan canje-canje sun fara aiki yana nufin karɓar Sharuɗɗan da aka sabunta.","h14":"14. Dokar da ke jagoranta","p14":"Dokokin India ne ke tafiyar da waɗannan Sharuɗɗa, ba tare da la'akari da ƙa'idodin cin karo na doka ba. Kowane rikici zai kasance ƙarƙashin ikon musamman na kotunan da suka cancanta a India, sai dai idan wani ikon tilas na daban ya shafe ku ƙarƙashin dokar kariyar mabukaci da ta dace.","h15":"15. Tuntuɓe mu","p15":"Tambayoyi game da waɗannan Sharuɗɗa? Ku tuntuɓe mu a:","footer":"© 2026 GO PRACHI LABS. All rights reserved."},"ui":{"ui_language":"Harshe","ui_note":"An bayar da wannan fassara don saukin ku. Idan akwai wani bambanci, sigar Turanci ce mai iko a shari'a."}},"yo":{"terms":{"title":"Àwọn Òfin Iṣẹ́","eff":"Ọjọ́ ìbẹ̀rẹ̀ ìṣiṣẹ́: 9 July 2026","intro":"Àwọn Òfin Iṣẹ́ wọ̀nyí (\"Àwọn Òfin\") ń ṣàkóso lílo rẹ ti ohun-èlò fóònù alágbèéká GPS Map Camera & Compass (\"Ohun-èlò náà\"), tí GO PRACHI LABS (\"àwa\", \"tiwa\") pèsè. Nípa gbígbà sílẹ̀, fífi sórí ẹ̀rọ, tàbí lílo Ohun-èlò náà, o gbà pẹ̀lú Àwọn Òfin wọ̀nyí. Tí o kò bá gbà, jọ̀wọ́ má ṣe lo Ohun-èlò náà.","h1":"1. Ìwé-àṣẹ láti lo Ohun-èlò náà","p1":"A fún ọ ní ìwé-àṣẹ ara-ẹni, tí ó ní ààlà, tí kì í ṣe ti-àdámọ́, tí a kò lè gbé lọ, tí a lè fagilé láti fi sórí ẹ̀rọ àti lo Ohun-èlò náà lórí àwọn ẹ̀rọ tí o ní tàbí ṣàkóso, fún ìlò ara-ẹni tàbí ìlò iṣẹ́-òwò inú, ní ìbámu pẹ̀lú Àwọn Òfin wọ̀nyí àti àwọn òfin ilé-ìtajà ohun-èlò tí o ti gbà á sílẹ̀ láti ọ̀dọ̀ rẹ̀.","h2":"2. Àkóónú rẹ","p2":"Àwọn fọ́tò, fídíò, àti àkóónú mìíràn tí o mú tàbí dá pẹ̀lú Ohun-èlò náà (\"Àkóónú Rẹ\") jẹ́ tirẹ. Ohun-èlò náà ń ṣàgbéyẹ̀wò Àkóónú Rẹ lórí ẹ̀rọ rẹ láti fi ipò, ọjọ́/àkókò, kọmpási, àti ìsọfúnni tí ó ní ìbáṣepọ̀ kún un. Ìwọ nìkan ni ó ní ẹrù-iṣẹ́ fún Àkóónú Rẹ àti fún bí o ṣe ń lò ó, ṣàfipamọ́ rẹ̀, àti pín in, o sì fìdí rẹ̀ múlẹ̀ pé o ní ẹ̀tọ́ láti mú un àti lò ó.","h3":"3. Pípé ipò àti kọmpási — pàtàkì","note3":"Ipò, àwọn ìṣàkóso, àdírẹ́sì, gíga, ìtọ́sọ́nà kọmpási, ìyapa oofà, àti ìsọfúnni oòrùn/òṣùpá àti ojú-ọjọ́ ti Ohun-èlò náà ni a pèsè fún àwọn ète ìsọfúnni gbogbogbòò nìkan, wọ́n sì lè jẹ́ àìpé, àìkún, tàbí ẹni tí ó dádúró. Má ṣe gbẹ́kẹ̀lé Ohun-èlò náà fún ìtọ́sọ́nà, pàjáwírì, ọkọ̀-òfuurufú, ojú-omi, ìwọ̀n-ilẹ̀, òfin, àwọn ète tí ó ṣe pàtàkì-fún-ààbò, tàbí àwọn ète tí ó ṣe pàtàkì-fún-ẹ̀mí. Nígbà gbogbo lo àwọn ohun-èlò àti orísun ìjọba fún irú àwọn ìpinnu bẹ́ẹ̀. O ń lo ìsọfúnni yìí lórí ewu ara rẹ.","h4":"4. Àwọn ìrajà","p4":"Ohun-èlò náà jẹ́ ọ̀fẹ́ láti lò, àwọn ìpolówó sì ń ṣe àtìlẹ́yìn fún un. O lè yàn láti ra ìmúgbòòrò ẹ̀ẹ̀kan-ṣoṣo \"Yọ Àwọn Ìpolówó Kúrò / Pro\" tí ó ń ṣí àwọn àbùdá kan. Google Play ni ó ń ṣàkóso àti gba owó fún gbogbo àwọn ìrajà, wọ́n sì wà lábẹ́ àwọn òfin àti ìlànà ìpadàsanwó ti Google Play. A kì í gba tàbí ṣàfipamọ́ àwọn ẹ̀kúnrẹ́rẹ́ ìsanwó rẹ. Nítorí pé ó jẹ́ ìṣíṣílẹ̀ díjítà ẹ̀ẹ̀kan-ṣoṣo, ní gbogbogbòò a kì í dá owó àwọn ìrajà padà àyàfi níbi tí òfin tàbí àwọn ìlànà Google Play bá béèrè. O lè mú ìrajà tí ó ti kọjá padà láti inú Ohun-èlò náà lórí àkàǹtì Google kan náà.","h5":"5. Àwọn ìpolówó","p5":"Àyàfi tí o bá ra ìmúgbòòrò aláìní-ìpolówó, Ohun-èlò náà ń fi àwọn ìpolówó tí àwọn ẹnìkẹ́ta pèsè hàn (pẹ̀lú Google AdMob). A kì í ní ẹrù-iṣẹ́ fún àkóónú àwọn ìpolówó tàbí fún èyíkéyìí àwọn ọjà tàbí iṣẹ́ tí wọn ń polówó.","h6":"6. Ìlò tí a gbà","p6_intro":"O gbà láti má ṣe:","li6_1":"lo Ohun-èlò náà fún ète àìlófin èyíkéyìí tàbí ní ìrélànàkọjá òfin tàbí ìlànà èyíkéyìí tí ó bá wúlò;","li6_2":"ṣàdàkọ, ṣàtúnṣe, ṣe àyẹ̀wò-ẹ̀rọ padà, tú-kalẹ̀, tàbí gbìyànjú láti fa kóòdù orísun Ohun-èlò náà jáde, àyàfi níwọ̀n bí òfin bá ti fòfin de ìdíwọ́ yìí;","li6_3":"dá sí, dàrú, tàbí gbìyànjú láti ní ìwọlé tí a kò yọ̀ǹda sí Ohun-èlò náà tàbí àwọn ètò tí ó ní ìbáṣepọ̀;","li6_4":"lo Ohun-èlò náà láti tẹ àwọn ẹ̀tọ́ àwọn ẹlòmíràn lóréfèé tàbí láti mú àkóónú tí a kò yọ̀ǹda fún ọ láti mú; tàbí","li6_5":"yọ kúrò, bò, tàbí yí àwọn ìkéde ohun-ìní èyíkéyìí padà nínú Ohun-èlò náà.","h7":"7. Ohun-ìní ọgbọ́n","p7":"Ohun-èlò náà, pẹ̀lú sọ́fítíwérì rẹ̀, àpẹẹrẹ, àwọn àmì-àpẹẹrẹ, àti àwọn àmì-òwò (ṣùgbọ́n láì kún Àkóónú Rẹ àti àwọn ohun-èlò ẹnìkẹ́ta), jẹ́ ohun-ìní GO PRACHI LABS, àwọn òfin ohun-ìní-ọgbọ́n sì dáàbò bò ó. Àyàfi ìwé-àṣẹ tí a fún ọ lókè, kò sí àwọn ẹ̀tọ́ tí a gbé lọ sí ọ̀dọ̀ rẹ.","h8":"8. Àwọn iṣẹ́ ẹnìkẹ́ta","p8":"Ohun-èlò náà ń lo àwọn iṣẹ́ ẹnìkẹ́ta bíi Google Play Services, Google Maps, Google AdMob, Firebase, àti Google Play Billing. Lílo rẹ ti àwọn iṣẹ́ yẹn lè wà lábẹ́ àwọn òfin àti ìlànà àṣírí tiwọn. A kì í ní ẹrù-iṣẹ́ fún àwọn iṣẹ́ tàbí àkóónú ẹnìkẹ́ta.","h9":"9. Àìgbà ẹrù ìdánilójú","p9":"A pèsè Ohun-èlò náà lórí ìpìlẹ̀ \"gẹ́gẹ́ bí ó ṣe wà\" àti \"gẹ́gẹ́ bí ó ṣe wà ní àrọ́wọ́tó\", láìsí àwọn ìdánilójú irú èyíkéyìí, yálà tí a sọ ní gbangba tàbí tí ó fara sin, pẹ̀lú àwọn ìdánilójú tí ó fara sin ti ìtajà, ìbámu fún ète pàtó kan, pípé, àti àìtẹ̀-lóréfèé. A kì í ṣe ìdánilójú pé Ohun-èlò náà yóò jẹ́ aláìdádúró, aláìní-àṣìṣe, aláàbò, tàbí pé ìsọfúnni èyíkéyìí tí ó pèsè jẹ́ pípé tàbí ẹni tí a lè gbẹ́kẹ̀lé.","h10":"10. Ààlà ẹrù-iṣẹ́","p10":"Níwọ̀n bí òfin bá ti yọ̀ǹda jùlọ, GO PRACHI LABS àti àwọn alábàáṣiṣẹ́pọ̀ rẹ̀ kò ní jẹ́ olùdẹ́rù fún èyíkéyìí ìbàjẹ́ tí kì í ṣe tààrà, èyí tí ó ṣẹlẹ̀ láìròtẹ́lẹ̀, pàtàkì, àbájáde, tàbí ìjìyà, tàbí fún èyíkéyìí àdánù dátà, èrè, tàbí orúkọ rere, tí ó bẹ̀rẹ̀ láti tàbí tí ó ní ìbáṣepọ̀ pẹ̀lú lílo rẹ ti (tàbí àìlè lo) Ohun-èlò náà. Níwọ̀n bí a kò ti lè yọ ẹrù-iṣẹ́ kúrò, àpapọ̀ ẹrù-iṣẹ́ wa ní ààlà sí iye tí o san fún wa fún Ohun-èlò náà (tí ó bá wà) ní oṣù méjìlá ṣáájú ẹjọ́ náà.","h11":"11. Ìsanpadà","p11":"O gbà láti sanpadà kí o sì dáàbò bo GO PRACHI LABS kúrò nínú èyíkéyìí àwọn ẹjọ́, ìbàjẹ́, ẹrù-iṣẹ́, àti àwọn ìnáwó tí ó bẹ̀rẹ̀ láti lílo rẹ ti Ohun-èlò náà, Àkóónú Rẹ, tàbí ìrélànàkọjá rẹ ti Àwọn Òfin wọ̀nyí.","h12":"12. Ìparí","p12":"O lè dá lílo Ohun-èlò náà dúró nígbàkúùgbà nípa yíyọ kúrò. A lè dá ìwọlé rẹ sí Ohun-èlò náà dúró tàbí parí i tí o bá tẹ Àwọn Òfin wọ̀nyí lóréfèé tàbí tí a bá dá Ohun-èlò náà dúró. Àwọn ìpèsè tí ó yẹ kí ó là á já nípasẹ̀ ìwà-ẹ̀dá wọn lẹ́yìn ìparí (pẹ̀lú ohun-ìní-ọgbọ́n, àwọn àìgbà-ẹrù, àti ààlà ẹrù-iṣẹ́) yóò là á já.","h13":"13. Àwọn ìyípadà sí Ohun-èlò náà àti Àwọn Òfin","p13":"A lè ṣàtúnṣe tàbí dá Ohun-èlò náà dúró, tàbí ṣàtúnṣe Àwọn Òfin wọ̀nyí, nígbàkúùgbà. A ó fi àwọn ìyípadà pàtàkì sí ojú-ìwé yìí pẹ̀lú ọjọ́ ìbẹ̀rẹ̀ ìṣiṣẹ́ tí a ṣàtúnṣe. Ṣíṣàkúnfún lílo rẹ ti Ohun-èlò náà lẹ́yìn tí àwọn ìyípadà bá ti bẹ̀rẹ̀ sí í ṣiṣẹ́ dúró fún gbígbà Àwọn Òfin tí a ṣàtúnṣe.","h14":"14. Òfin tí ó ń ṣàkóso","p14":"Àwọn òfin India ni ó ń ṣàkóso Àwọn Òfin wọ̀nyí, láìka àwọn ìlànà ìforígbárí-òfin sí. Èyíkéyìí àríyànjiyàn yóò wà lábẹ́ ẹjọ́-agbára àdámọ́ ti àwọn kóòtù tí ó tóótun tí ó wà ní India, àyàfi tí ẹjọ́-agbára dandan mìíràn bá wúlò fún ọ lábẹ́ òfin ìdáàbòbò-oníbàárà tí ó bá wúlò.","h15":"15. Kàn sí wa","p15":"Àwọn ìbéèrè nípa Àwọn Òfin wọ̀nyí? Kàn sí wa ní:","footer":"© 2026 GO PRACHI LABS. All rights reserved."},"ui":{"ui_language":"Èdè","ui_note":"A pèsè ìtumọ̀ yìí fún ìrọ̀rùn rẹ. Tí ìyàtọ̀ èyíkéyìí bá wà, ẹ̀dà Gẹ̀ẹ́sì ni ó ní àṣẹ ní ti òfin."}},"zu":{"terms":{"title":"Imigomo Yesevisi","eff":"Usuku lokuqala ukusebenza: 9 July 2026","intro":"Le Migomo Yesevisi (\"Imigomo\") ilawula ukusebenzisa kwakho uhlelo lokusebenza lweselula i-GPS Map Camera & Compass (\"Uhlelo lokusebenza\"), oluhlinzekwa i-GO PRACHI LABS (\"thina\", \"okwethu\"). Ngokulanda, ukufaka, noma ukusebenzisa Uhlelo lokusebenza, uyavuma le Migomo. Uma ungavumi, sicela ungalisebenzisi Uhlelo lokusebenza.","h1":"1. Ilayisensi yokusebenzisa Uhlelo lokusebenza","p1":"Sikunika ilayisensi yomuntu siqu, elinganiselwe, engelona elikhethekile, engedluliseleki, ekwazi ukuhoxiswa yokufaka nokusebenzisa Uhlelo lokusebenza kumadivayisi owaphethe noma owalawulayo, ngokusebenzisa kwakho komuntu siqu noma ngokwebhizinisi langaphakathi, ngaphansi kwale Migomo nemithetho yesitolo sohlelo lokusebenza owalanda kuso.","h2":"2. Okuqukethwe kwakho","p2":"Izithombe, amavidiyo, nokunye okuqukethwe okuthwebulayo noma okudalayo ngoHlelo lokusebenza (\"Okuqukethwe Kwakho\") kungokwakho. Uhlelo lokusebenza lucubungula Okuqukethwe Kwakho kudivayisi yakho ukungeza indawo, usuku/isikhathi, ikhompasi, nolwazi oluhlobene. Nguwe wedwa onesibopho ngoKuqukethwe Kwakho nangendlela okusebenzisa, okugcina, nokwabelana ngayo ngakho, futhi uqinisekisa ukuthi unelungelo lokukuthwebula nokukusebenzisa.","h3":"3. Ukunemba kwendawo nekhompasi — kubalulekile","note3":"Indawo, izixhumanisi, ikheli, ukuphakama, inkomba yekhompasi, ukuphambuka kukazibuthe, nolwazi lwelanga/nyanga nesimo sezulu zoHlelo lokusebenza kuhlinzekwa ngezinjongo zolwazi olujwayelekile kuphela futhi kungase kungabi nembe, kungaphelele, noma kubambezeleke. Ungathembeli kuHlelo lokusebenza ngezinjongo zokuzula, ezimo eziphuthumayo, ezomkhathi, ezolwandle, ezokulinganisa umhlaba, ezomthetho, ezibalulekile ekuphepheni, noma ezibalulekile ekuphileni. Njalo sebenzisa amathuluzi nemithombo esemthethweni ngezinqumo ezinjalo. Usebenzisa lolu lwazi ngengozi yakho.","h4":"4. Ukuthenga","p4":"Uhlelo lokusebenza lumahhala ukulusebenzisa futhi lusekelwa izikhangiso. Ungase ukhethe ukuthenga ukuthuthukiswa kwesikhathi esisodwa \"Susa Izikhangiso / Pro\" okuvula izici ezithile. Konke ukuthenga kucutshungulwa futhi kukhokhiswa i-Google Play, futhi kungaphansi kwemigomo nenqubomgomo yokukhokha kabusha ye-Google Play. Asitholi noma sigcine imininingwane yakho yokukhokha. Ngoba kuwukuvulwa kwedijithali kwesikhathi esisodwa, ukuthenga ngokuvamile akukhokhelwa kabusha ngaphandle lapho kudingeka khona ngomthetho noma ngezinqubomgomo ze-Google Play. Ungabuyisela ukuthenga kwangaphambili ungaphakathi koHlelo lokusebenza nge-akhawunti efanayo ye-Google.","h5":"5. Izikhangiso","p5":"Ngaphandle uma uthenga ukuthuthukiswa okungenazikhangiso, Uhlelo lokusebenza lubonisa izikhangiso ezihlinzekwa izinhlangano zangaphandle (kuhlanganise i-Google AdMob). Asinasibopho ngokuqukethwe kwezikhangiso noma nganoma yimiphi imikhiqizo noma amasevisi abawakhangisayo.","h6":"6. Ukusetshenziswa okwamukelekayo","p6_intro":"Uyavuma ukuthi ngeke:","li6_1":"usebenzise Uhlelo lokusebenza ngenjongo engekho emthethweni noma ngokwephula noma yimuphi umthetho noma isimiso esisebenzayo;","li6_2":"ukopishe, uguqule, wenze ubunjiniyela obuphambene, uhlukanise, noma uzame ukukhipha ikhodi yomthombo yoHlelo lokusebenza, ngaphandle kwezinga lapho lo mkhawulo unqatshelwe khona ngumthetho;","li6_3":"uphazamise, uphule, noma uzame ukuthola ukufinyelela okungagunyaziwe kuHlelo lokusebenza noma izinhlelo zalo ezihlobene;","li6_4":"usebenzise Uhlelo lokusebenza ukwephula amalungelo abanye noma ukuthwebula okuqukethwe ongavunyelwe ukukuthwebula; noma","li6_5":"ukhiphe, ufihle, noma uguqule noma yiziphi izaziso zobunikazi kuHlelo lokusebenza.","h7":"7. Impahla yobuhlakani","p7":"Uhlelo lokusebenza, kuhlanganise isofthiwe yalo, idizayini, amalogo, nezimpawu zohwebo (kodwa kungahlanganisi Okuqukethwe Kwakho nezinto zezinhlangano zangaphandle), lungokwe-GO PRACHI LABS futhi luvikelwe imithetho yempahla yobuhlakani. Ngaphandle kwelayisensi enikeziwe ngenhla, awekho amalungelo adluliselwa kuwe.","h8":"8. Amasevisi ezinhlangano zangaphandle","p8":"Uhlelo lokusebenza lusebenzisa amasevisi ezinhlangano zangaphandle afana ne-Google Play Services, i-Google Maps, i-Google AdMob, i-Firebase, ne-Google Play Billing. Ukusebenzisa kwakho lawo masevisi kungase kube ngaphansi kwemigomo nezinqubomgomo zawo zobumfihlo. Asinasibopho ngamasevisi noma okuqukethwe kwezinhlangano zangaphandle.","h9":"9. Ukuphika iziqinisekiso","p9":"Uhlelo lokusebenza luhlinzekwa ngesisekelo \"njengoba linjalo\" nangesisekelo \"njengoba litholakala\", ngaphandle kweziqinisekiso zanoma yiluphi uhlobo, kungaba ezisobala noma ezifihliwe, kuhlanganise iziqinisekiso ezifihliwe zokuthengiswa, ukufaneleka kwenjongo ethile, ukunemba, nokungephuli. Asiqinisekisi ukuthi Uhlelo lokusebenza ngeke luphazamiseke, ngeke lube namaphutha, luzophepha, noma ukuthi noma yiluphi ulwazi olulinikezayo lunembile noma luthembekile.","h10":"10. Umkhawulo wesibopho","p10":"Ngezinga eliphakeme elivunyelwe ngumthetho, i-GO PRACHI LABS nezinkampani zayo ezihlobene ngeke zibe nesibopho nganoma yikuphi ukulimala okungaqondile, okungozi, okukhethekile, okulandelayo, noma okujezisayo, noma nganoma yikuphi ukulahleka kwedatha, inzuzo, noma isithunzi, okuvela noma okuhlobene nokusebenzisa kwakho (noma ukungakwazi ukusebenzisa) Uhlelo lokusebenza. Ngezinga lapho isibopho singeke sikhishwe khona, isibopho sethu sisonke silinganiselwe enanini owasikhokhela lona ngoHlelo lokusebenza (uma sikhona) ezinyangeni eziyishumi nambili ngaphambi kwesimangalo.","h11":"11. Ukukhokhela isinxephezelo","p11":"Uyavuma ukukhokhela isinxephezelo nokugcina i-GO PRACHI LABS ingalimali kunoma yiziphi izimangalo, ukulimala, izibopho, nezindleko ezivela ekusebenziseni kwakho Uhlelo lokusebenza, Okuqukethwe Kwakho, noma ukwephula kwakho le Migomo.","h12":"12. Ukuqedwa","p12":"Ungakuyeka ukusebenzisa Uhlelo lokusebenza noma nini ngokulususa. Singase silengise noma siqede ukufinyelela kwakho kuHlelo lokusebenza uma wephula le Migomo noma uma sinqamula Uhlelo lokusebenza. Izinhlinzeko ezifanele ukuqhubeka ngemva kokuqedwa ngokwemvelo yazo (kuhlanganise impahla yobuhlakani, ukuphika, nomkhawulo wesibopho) zizoqhubeka.","h13":"13. Izinguquko koHlelo lokusebenza neMigomo","p13":"Singase siguqule noma sinqamule Uhlelo lokusebenza, noma sibuyekeze le Migomo, noma nini. Izinguquko ezibalulekile zizofakwa kuleli khasi ngosuku olubuyekeziwe lokuqala ukusebenza. Ukuqhubeka kwakho nokusebenzisa Uhlelo lokusebenza ngemva kokuba izinguquko ziqale ukusebenza kwakha ukwamukelwa kweMigomo ebuyekeziwe.","h14":"14. Umthetho olawulayo","p14":"Le Migomo ilawulwa imithetho yase-India, ngaphandle kokunaka izimiso zokungqubuzana kwemithetho. Noma yikuphi ukungqubuzana kuzoba ngaphansi kwegunya elikhethekile lezinkantolo ezinekhono ezitholakala e-India, ngaphandle uma igunya elihlukile eliphoqelelekayo lisebenza kuwe ngaphansi komthetho wokuvikela abathengi osebenzayo.","h15":"15. Xhumana nathi","p15":"Imibuzo mayelana nale Migomo? Xhumana nathi ku-:","footer":"© 2026 GO PRACHI LABS. All rights reserved."},"ui":{"ui_language":"Ulimi","ui_note":"Le nguqulo ihlinzekwa ngenxa yokusizakala kwakho. Uma kukhona umehluko, inguqulo yesiNgisi iyiyo enegunya ngokomthetho."}}};

function match(c){
  if(!c) return null; var lc=c.toLowerCase();
  for(var i=0;i<ORDER.length;i++){ if(ORDER[i].toLowerCase()===lc) return ORDER[i]; }
  if(lc.indexOf("pt")===0) return "pt-BR";
  if(lc.indexOf("zh")===0){ return (lc.indexOf("tw")>=0||lc.indexOf("hant")>=0||lc.indexOf("hk")>=0)?"zh-TW":"zh-CN"; }
  if(lc==="he"||lc==="iw") return "iw";
  if(lc==="in"||lc==="id") return "id";
  var base=lc.split("-")[0];
  for(var j=0;j<ORDER.length;j++){ if(ORDER[j].toLowerCase()===base) return ORDER[j]; }
  if(base==="he") return "iw";
  return null;
}
function pick(){
  var q=new URLSearchParams(location.search).get("lang");
  var cands=[q].concat(navigator.languages||[navigator.language||"en"]);
  for(var i=0;i<cands.length;i++){ var m=match(cands[i]); if(m) return m; }
  return "en";
}
