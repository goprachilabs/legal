male omfang loven tillader, vil GO PRACHI LABS og dets tilknyttede selskaber ikke være ansvarlige for nogen indirekte, hændelige, særlige, følgeskader eller pønalt begrundede skader, eller for tab af data, fortjeneste eller goodwill, der opstår som følge af eller relateret til din brug af (eller manglende evne til at bruge) Appen. I det omfang ansvar ikke kan udelukkes, er vores samlede ansvar begrænset til det beløb, du har betalt os for Appen (hvis noget) i de tolv måneder før kravet.","h11":"11. Skadesløsholdelse","p11":"Du accepterer at holde GO PRACHI LABS skadesløs for ethvert krav, skader, forpligtelser og udgifter, der opstår som følge af din brug af Appen, Dit indhold eller din overtrædelse af disse Vilkår.","h12":"12. Ophør","p12":"Du kan holde op med at bruge Appen når som helst ved at afinstallere den. Vi kan suspendere eller opsige din adgang til Appen, hvis du overtræder disse Vilkår, eller hvis vi indstiller Appen. Bestemmelser, der efter deres natur bør overleve ophør (herunder immaterielle rettigheder, ansvarsfraskrivelser og ansvarsbegrænsning), vil fortsætte med at gælde.","h13":"13. Ændringer af Appen og Vilkårene","p13":"Vi kan ændre eller indstille Appen eller opdatere disse Vilkår når som helst. Væsentlige ændringer vil blive offentliggjort på denne side med en revideret ikrafttrædelsesdato. Din fortsatte brug af Appen, efter at ændringerne træder i kraft, udgør accept af de opdaterede Vilkår.","h14":"14. Gældende lov","p14":"Disse Vilkår er underlagt Indiens love, uden hensyn til principper om lovkonflikt. Enhver tvist vil være underlagt de kompetente domstoles enekompetence i Indien, medmindre en anden ufravigelig jurisdiktion gælder for dig i henhold til gældende forbrugerbeskyttelseslovgivning.","h15":"15. Kontakt os","p15":"Spørgsmål om disse Vilkår? Kontakt os på:","footer":"© 2026 GO PRACHI LABS. Alle rettigheder forbeholdes."},"ui":{"ui_language":"Sprog","ui_note":"Denne oversættelse leveres for din bekvemmeligheds skyld. I tilfælde af enhver uoverensstemmelse er den engelske version den juridisk gældende."}},"tr":{"terms":{"title":"Hizmet Şartları","eff":"Yürürlük tarihi: 9 July 2026","intro":"Bu Hizmet Şartları (“Şartlar”), GO PRACHI LABS (“biz”, “bize” veya “bizim”) tarafından sağlanan GPS Map Camera & Compass adlı mobil uygulamayı (“Uygulama”) kullanımınızı düzenler. Uygulamayı indirerek, kurarak veya kullanarak bu Şartları kabul etmiş olursunuz. Kabul etmiyorsanız, lütfen Uygulamayı kullanmayın.","h1":"1. Uygulamayı kullanma lisansı","p1":"Size, sahip olduğunuz veya kontrol ettiğiniz cihazlara Uygulamayı kurmanız ve kullanmanız için, kişisel veya kurum içi iş kullanımınız amacıyla, bu Şartlara ve indirdiğiniz uygulama mağazasının kurallarına tabi olmak üzere kişisel, sınırlı, münhasır olmayan, devredilemez, geri alınabilir bir lisans veriyoruz.","h2":"2. İçeriğiniz","p2":"Uygulama ile yakaladığınız veya oluşturduğunuz fotoğraflar, videolar ve diğer içerikler (“İçeriğiniz”) size aittir. Uygulama, konum, tarih/saat, pusula ve ilgili bilgileri eklemek için İçeriğinizi cihazınızda işler. İçeriğinizden ve onu nasıl kullandığınızdan, sakladığınızdan ve paylaştığınızdan yalnızca siz sorumlusunuz ve onu yakalama ve kullanma hakkına sahip olduğunuzu onaylarsınız.","h3":"3. Konum ve pusula doğruluğu — önemli","note3":"Uygulamanın konum, koordinat, adres, rakım, pusula yönü, manyetik sapma ve güneş/ay ile hava durumu bilgileri yalnızca genel bilgilendirme amaçlıdır ve yanlış, eksik veya gecikmeli olabilir. Navigasyon, acil durum, havacılık, denizcilik, arazi ölçümü, hukuki, güvenlik açısından kritik veya hayati öneme sahip amaçlar için Uygulamaya güvenmeyin. Bu tür kararlar için her zaman resmi araçları ve kaynakları kullanın. Bu bilgileri kendi sorumluluğunuzda kullanırsınız.","h4":"4. Satın alımlar","p4":"Uygulama ücretsiz olarak kullanılır ve reklamlarla desteklenir. İsteğe bağlı olarak belirli özellikleri açan tek seferlik “Reklamları Kaldır / Pro” yükseltmesini satın alabilirsiniz. Tüm satın alımlar Google Play tarafından işlenir ve faturalandırılır ve Google Play'in şartlarına ve iade politikasına tabidir. Ödeme ayrıntılarınızı almaz veya saklamayız. Tek seferlik bir dijital kilit açma olduğu için, satın alımlar yasaların veya Google Play politikalarının gerektirdiği durumlar dışında genellikle iade edilemez. Önceki bir satın alımı aynı Google hesabıyla Uygulama içinden geri yükleyebilirsiniz.","h5":"5. Reklamlar","p5":"Reklamsız yükseltmeyi satın almadığınız sürece, Uygulama üçüncü taraflarca (Google AdMob dahil) sağlanan reklamları görüntüler. Reklamların içeriğinden veya tanıttıkları herhangi bir üründen ya da hizmetten sorumlu değiliz.","h6":"6. Kabul edilebilir kullanım","p6_intro":"Şunları yapmamayı kabul edersiniz:","li6_1":"Uygulamayı herhangi bir yasa dışı amaç için veya geçerli herhangi bir yasa ya da yönetmeliği ihlal ederek kullanmak;","li6_2":"bu kısıtlamanın yasalarca yasaklandığı durumlar dışında, Uygulamanın kaynak kodunu kopyalamak, değiştirmek, tersine mühendislik yapmak, kaynak koda dönüştürmek veya çıkarmaya çalışmak;","li6_3":"Uygulamaya veya ilgili sistemlerine müdahale etmek, aksatmak veya yetkisiz erişim elde etmeye çalışmak;","li6_4":"Uygulamayı başkalarının haklarını ihlal etmek veya yakalamanıza izin verilmeyen içeriği yakalamak için kullanmak; veya","li6_5":"Uygulamadaki herhangi bir mülkiyet bildirimini kaldırmak, gizlemek veya değiştirmek.","h7":"7. Fikri mülkiyet","p7":"Yazılımı, tasarımı, logoları ve ticari markaları (ancak İçeriğiniz ve üçüncü taraf materyalleri hariç) dahil olmak üzere Uygulama, GO PRACHI LABS'a aittir ve fikri mülkiyet yasalarıyla korunmaktadır. Yukarıda verilen lisans dışında, size herhangi bir hak devredilmez.","h8":"8. Üçüncü taraf hizmetleri","p8":"Uygulama, Google Play Services, Google Maps, Google AdMob, Firebase ve Google Play Billing gibi üçüncü taraf hizmetlerini kullanır. Bu hizmetleri kullanımınız kendi şartlarına ve gizlilik politikalarına tabi olabilir. Üçüncü taraf hizmetlerinden veya içeriğinden sorumlu değiliz.","h9":"9. Garantilerin reddi","p9":"Uygulama, satılabilirlik, belirli bir amaca uygunluk, doğruluk ve ihlal etmeme konusundaki zımni garantiler dahil olmak üzere, açık veya zımni herhangi bir garanti olmaksızın, “olduğu gibi” ve “mevcut olduğu şekilde” esasına göre sağlanır. Uygulamanın kesintisiz, hatasız, güvenli olacağını veya sağladığı herhangi bir bilginin doğru veya güvenilir olacağını garanti etmeyiz.","h10":"10. Sorumluluğun sınırlandırılması","p10":"Yasaların izin verdiği azami ölçüde, GO PRACHI LABS ve bağlı kuruluşları, Uygulamayı kullanmanızdan (veya kullanamamanızdan) kaynaklanan ya da bununla ilgili herhangi bir dolaylı, arızi, özel, sonuç olarak ortaya çıkan veya cezai zararlardan ya da herhangi bir veri, kâr veya itibar kaybından sorumlu olmayacaktır. Sorumluluğun hariç tutulamadığı ölçüde, toplam sorumluluğumuz, talepten önceki on iki ay içinde Uygulama için bize ödediğiniz tutarla (varsa) sınırlıdır.","h11":"11. Tazminat","p11":"Uygulamayı kullanmanızdan, İçeriğinizden veya bu Şartları ihlal etmenizden kaynaklanan herhangi bir talep, zarar, yükümlülük ve masraflara karşı GO PRACHI LABS'ı tazmin etmeyi ve zarar görmesini önlemeyi kabul edersiniz.","h12":"12. Fesih","p12":"Uygulamayı istediğiniz zaman kaldırarak kullanmayı bırakabilirsiniz. Bu Şartları ihlal etmeniz veya Uygulamayı durdurmamız durumunda Uygulamaya erişiminizi askıya alabilir veya sonlandırabiliriz. Nitelikleri gereği fesihten sonra da geçerliliğini koruması gereken hükümler (fikri mülkiyet, feragatnameler ve sorumluluğun sınırlandırılması dahil) geçerliliğini koruyacaktır.","h13":"13. Uygulama ve Şartlardaki değişiklikler","p13":"Uygulamayı istediğimiz zaman değiştirebilir veya durdurabilir ya da bu Şartları güncelleyebiliriz. Önemli değişiklikler, revize edilmiş bir yürürlük tarihiyle bu sayfada yayınlanacaktır. Değişiklikler yürürlüğe girdikten sonra Uygulamayı kullanmaya devam etmeniz, güncellenmiş Şartları kabul ettiğiniz anlamına gelir.","h14":"14. Geçerli hukuk","p14":"Bu Şartlar, kanunlar ihtilafı ilkeleri dikkate alınmaksızın Hindistan yasalarına tabidir. Herhangi bir anlaşmazlık, geçerli tüketici koruma yasası kapsamında size farklı bir zorunlu yargı yetkisi uygulanmadığı sürece, Hindistan'da bulunan yetkili mahkemelerin münhasır yargı yetkisine tabi olacaktır.","h15":"15. Bize ulaşın","p15":"Bu Şartlar hakkında sorularınız mı var? Bizimle şu adresten iletişime geçin:","footer":"© 2026 GO PRACHI LABS. Tüm hakları saklıdır."},"ui":{"ui_language":"Dil","ui_note":"Bu çeviri kolaylık sağlamak amacıyla sunulmuştur. Herhangi bir tutarsızlık durumunda, yasal olarak geçerli olan İngilizce sürümdür."}},"ar":{"terms":{"title":"شروط الخدمة","eff":"تاريخ السريان: 9 July 2026","intro":"تحكم شروط الخدمة هذه (\"الشروط\") استخدامك لتطبيق الهاتف المحمول GPS Map Camera & Compass (\"التطبيق\")، المقدّم من GO PRACHI LABS (\"نحن\" أو \"لنا\" أو \"خاصتنا\"). بتنزيل التطبيق أو تثبيته أو استخدامه، فإنك توافق على هذه الشروط. إذا كنت لا توافق، فيُرجى عدم استخدام التطبيق.","h1":"1. ترخيص استخدام التطبيق","p1":"نمنحك ترخيصًا شخصيًا محدودًا وغير حصري وغير قابل للتحويل وقابلاً للإلغاء لتثبيت التطبيق واستخدامه على الأجهزة التي تملكها أو تتحكم فيها، لاستخدامك الشخصي أو التجاري الداخلي، مع مراعاة هذه الشروط وقواعد متجر التطبيقات الذي قمت بالتنزيل منه.","h2":"2. محتواك","p2":"الصور ومقاطع الفيديو والمحتوى الآخر الذي تلتقطه أو تنشئه باستخدام التطبيق (\"محتواك\") ملك لك. يعالج التطبيق محتواك على جهازك لإضافة الموقع والتاريخ/الوقت والبوصلة والمعلومات ذات الصلة. أنت وحدك المسؤول عن محتواك وعن كيفية استخدامه وتخزينه ومشاركته، وتؤكد أن لديك الحق في التقاطه واستخدامه.","h3":"3. دقة الموقع والبوصلة — مهم","note3":"تُقدّم معلومات الموقع والإحداثيات والعنوان والارتفاع واتجاه البوصلة والانحراف المغناطيسي وتفاصيل الشمس/القمر والطقس في التطبيق لأغراض إعلامية عامة فقط وقد تكون غير دقيقة أو غير كاملة أو متأخرة. لا تعتمد على التطبيق لأغراض الملاحة أو الطوارئ أو الطيران أو الملاحة البحرية أو المساحة أو الأغراض القانونية أو الحرجة من حيث السلامة أو الحرجة للحياة. استخدم دائمًا الأدوات والمصادر الرسمية لمثل هذه القرارات. أنت تستخدم هذه المعلومات على مسؤوليتك الخاصة.","h4":"4. المشتريات","p4":"التطبيق مجاني الاستخدام ومدعوم بالإعلانات. يمكنك اختياريًا شراء ترقية لمرة واحدة \"إزالة الإعلانات / Pro\" تفتح ميزات معينة. تتم معالجة جميع المشتريات وفوترتها بواسطة Google Play، وتخضع لشروط Google Play وسياسة الاسترداد. نحن لا نتلقى أو نخزّن تفاصيل الدفع الخاصة بك. نظرًا لأنها عملية فتح رقمية لمرة واحدة، فإن المشتريات غير قابلة للاسترداد عمومًا إلا حيثما يقتضي القانون أو سياسات Google Play ذلك. يمكنك استعادة عملية شراء سابقة من داخل التطبيق على نفس حساب Google.","h5":"5. الإعلانات","p5":"ما لم تشترِ الترقية الخالية من الإعلانات، يعرض التطبيق إعلانات مقدّمة من أطراف ثالثة (بما في ذلك Google AdMob). نحن لسنا مسؤولين عن محتوى الإعلانات أو عن أي منتجات أو خدمات تروّج لها.","h6":"6. الاستخدام المقبول","p6_intro":"أنت توافق على عدم:","li6_1":"استخدام التطبيق لأي غرض غير قانوني أو بما ينتهك أي قانون أو لائحة معمول بها؛","li6_2":"نسخ التطبيق أو تعديله أو إجراء هندسة عكسية له أو فك تجميعه أو محاولة استخراج شفرة المصدر الخاصة به، إلا بالقدر الذي يكون فيه هذا القيد محظورًا بموجب القانون؛","li6_3":"التدخل في التطبيق أو الأنظمة المرتبطة به أو تعطيلها أو محاولة الوصول غير المصرّح به إليها؛","li6_4":"استخدام التطبيق لانتهاك حقوق الآخرين أو لالتقاط محتوى غير مسموح لك بالتقاطه؛ أو","li6_5":"إزالة أي إشعارات ملكية في التطبيق أو حجبها أو تغييرها.","h7":"7. الملكية الفكرية","p7":"التطبيق، بما في ذلك برامجه وتصميمه وشعاراته وعلاماته التجارية (باستثناء محتواك ومواد الطرف الثالث)، مملوك لـ GO PRACHI LABS ومحمي بموجب قوانين الملكية الفكرية. باستثناء الترخيص الممنوح أعلاه، لا يتم نقل أي حقوق إليك.","h8":"8. خدمات الطرف الثالث","p8":"يستخدم التطبيق خدمات طرف ثالث مثل Google Play Services وGoogle Maps وGoogle AdMob وFirebase وGoogle Play Billing. قد يخضع استخدامك لتلك الخدمات لشروطها وسياسات الخصوصية الخاصة بها. نحن لسنا مسؤولين عن خدمات أو محتوى الطرف الثالث.","h9":"9. إخلاء المسؤولية عن الضمانات","p9":"يُقدّم التطبيق على أساس \"كما هو\" و\"كما هو متاح\"، دون أي ضمانات من أي نوع، سواء كانت صريحة أو ضمنية، بما في ذلك الضمانات الضمنية للقابلية للتسويق والملاءمة لغرض معين والدقة وعدم الانتهاك. نحن لا نضمن أن يكون التطبيق دون انقطاع أو خاليًا من الأخطاء أو آمنًا، أو أن تكون أي معلومات يقدّمها دقيقة أو موثوقة.","h10":"10. تحديد المسؤولية","p10":"إلى الحد الأقصى الذي يسمح به القانون، لن تكون GO PRACHI LABS والشركات التابعة لها مسؤولة عن أي أضرار غير مباشرة أو عرضية أو خاصة أو تبعية أو عقابية، أو عن أي فقدان للبيانات أو الأرباح أو السمعة التجارية، تنشأ عن استخدامك للتطبيق (أو عدم قدرتك على استخدامه) أو تتعلق به. إلى الحد الذي لا يمكن فيه استبعاد المسؤولية، تقتصر مسؤوليتنا الإجمالية على المبلغ الذي دفعته لنا مقابل التطبيق (إن وجد) في الاثني عشر شهرًا السابقة للمطالبة.","h11":"11. التعويض","p11":"أنت توافق على تعويض GO PRACHI LABS وإبراء ذمتها من أي مطالبات أو أضرار أو مسؤوليات ونفقات تنشأ عن استخدامك للتطبيق أو محتواك أو انتهاكك لهذه الشروط.","h12":"12. الإنهاء","p12":"يمكنك التوقف عن استخدام التطبيق في أي وقت عن طريق إلغاء تثبيته. يجوز لنا تعليق أو إنهاء وصولك إلى التطبيق إذا انتهكت هذه الشروط أو إذا أوقفنا التطبيق. الأحكام التي ينبغي بطبيعتها أن تظل سارية بعد الإنهاء (بما في ذلك الملكية الفكرية وإخلاء المسؤولية وتحديد المسؤولية) ستظل سارية.","h13":"13. التغييرات على التطبيق والشروط","p13":"يجوز لنا تعديل التطبيق أو إيقافه، أو تحديث هذه الشروط، في أي وقت. سيتم نشر التغييرات الجوهرية على هذه الصفحة مع تاريخ سريان منقّح. يشكّل استمرار استخدامك للتطبيق بعد سريان التغييرات قبولاً للشروط المحدّثة.","h14":"14. القانون الحاكم","p14":"تخضع هذه الشروط لقوانين الهند، بغض النظر عن مبادئ تنازع القوانين. تخضع أي نزاعات للاختصاص القضائي الحصري للمحاكم المختصة الموجودة في الهند، ما لم يكن هناك اختصاص قضائي إلزامي مختلف ينطبق عليك بموجب قانون حماية المستهلك المعمول به.","h15":"15. اتصل بنا","p15":"هل لديك أسئلة حول هذه الشروط؟ اتصل بنا على:","footer":"© 2026 GO PRACHI LABS. جميع الحقوق محفوظة."},"ui":{"ui_language":"اللغة","ui_note":"تُقدَّم هذه الترجمة لتيسير الأمر عليك. في حالة وجود أي تعارض، تكون النسخة الإنجليزية هي المرجع القانوني المعتمد."}},"fa":{"terms":{"title":"شرایط خدمات","eff":"تاریخ اجرا: 9 July 2026","intro":"این شرایط خدمات (\"شرایط\") استفاده شما از برنامه تلفن همراه GPS Map Camera & Compass (\"برنامه\") که توسط GO PRACHI LABS (\"ما\"، \"به ما\" یا \"مال ما\") ارائه می‌شود را اداره می‌کند. با دانلود، نصب یا استفاده از برنامه، شما با این شرایط موافقت می‌کنید. اگر موافق نیستید، لطفاً از برنامه استفاده نکنید.","h1":"1. مجوز استفاده از برنامه","p1":"ما به شما یک مجوز شخصی، محدود، غیرانحصاری، غیرقابل‌انتقال و قابل‌فسخ برای نصب و استفاده از برنامه روی دستگاه‌هایی که مالک آن‌ها هستید یا کنترل می‌کنید، برای استفاده شخصی یا تجاری داخلی، با رعایت این شرایط و قوانین فروشگاه برنامه‌ای که از آن دانلود کرده‌اید، اعطا می‌کنیم.","h2":"2. محتوای شما","p2":"عکس‌ها، ویدیوها و سایر محتوایی که با برنامه ضبط یا ایجاد می‌کنید (\"محتوای شما\") متعلق به شماست. برنامه محتوای شما را روی دستگاه شما پردازش می‌کند تا موقعیت مکانی، تاریخ/زمان، قطب‌نما و اطلاعات مرتبط را اضافه کند. شما به‌تنهایی مسئول محتوای خود و نحوه استفاده، ذخیره و اشتراک‌گذاری آن هستید و تأیید می‌کنید که حق ضبط و استفاده از آن را دارید.","h3":"3. دقت موقعیت مکانی و قطب‌نما — مهم","note3":"موقعیت مکانی، مختصات، آدرس، ارتفاع، جهت قطب‌نما، انحراف مغناطیسی و اطلاعات خورشید/ماه و آب‌وهوای برنامه فقط برای اهداف اطلاع‌رسانی عمومی ارائه می‌شوند و ممکن است نادرست، ناقص یا با تأخیر باشند. برای اهداف ناوبری، اضطراری، هوانوردی، دریایی، نقشه‌برداری، حقوقی، حیاتی از نظر ایمنی یا حیاتی برای زندگی به برنامه اتکا نکنید. همیشه برای چنین تصمیماتی از ابزارها و منابع رسمی استفاده کنید. شما از این اطلاعات با مسئولیت خودتان استفاده می‌کنید.","h4":"4. خریدها","p4":"برنامه رایگان است و توسط تبلیغات پشتیبانی می‌شود. می‌توانید به‌صورت اختیاری یک ارتقای یک‌بار‌مصرف \"حذف تبلیغات / Pro\" بخرید که ویژگی‌های خاصی را باز می‌کند. همه خریدها توسط Google Play پردازش و صورت‌حساب می‌شوند و مشمول شرایط و سیاست بازپرداخت Google Play هستند. ما جزئیات پرداخت شما را دریافت یا ذخیره نمی‌کنیم. از آنجا که این یک باز کردن دیجیتالی یک‌بار‌مصرف است، خریدها معمولاً غیرقابل‌بازپرداخت هستند مگر در جایی که قانون یا سیاست‌های Google Play الزام کند. می‌توانید یک خرید قبلی را از درون برنامه با همان حساب Google بازیابی کنید.","h5":"5. تبلیغات","p5":"مگر اینکه ارتقای بدون تبلیغات را بخرید، برنامه تبلیغات ارائه‌شده توسط اشخاص ثالث (از جمله Google AdMob) را نمایش می‌دهد. ما مسئول محتوای تبلیغات یا هرگونه محصول یا خدماتی که تبلیغ می‌کنند نیستیم.","h6":"6. استفاده قابل‌قبول","p6_intro":"شما موافقت می‌کنید که:","li6_1":"از برنامه برای هیچ هدف غیرقانونی یا در نقض هرگونه قانون یا مقررات قابل‌اجرا استفاده نکنید؛","li6_2":"کد منبع برنامه را کپی، اصلاح، مهندسی معکوس، دی‌کامپایل یا تلاش برای استخراج آن نکنید، مگر تا حدی که این محدودیت توسط قانون ممنوع باشد؛","li6_3":"در برنامه یا سیستم‌های مرتبط با آن اختلال ایجاد نکنید، آن را مختل نکنید یا تلاش برای دسترسی غیرمجاز به آن نکنید؛","li6_4":"از برنامه برای نقض حقوق دیگران یا برای ضبط محتوایی که مجاز به ضبط آن نیستید استفاده نکنید؛ یا","li6_5":"هیچ اعلان مالکیتی در برنامه را حذف، پنهان یا تغییر ندهید.","h7":"7. مالکیت معنوی","p7":"برنامه، از جمله نرم‌افزار، طراحی، لوگوها و علائم تجاری آن (اما به‌استثنای محتوای شما و مواد اشخاص ثالث)، متعلق به GO PRACHI LABS است و توسط قوانین مالکیت معنوی محافظت می‌شود. به‌جز مجوز اعطاشده در بالا، هیچ حقی به شما منتقل نمی‌شود.","h8":"8. خدمات شخص ثالث","p8":"برنامه از خدمات شخص ثالث مانند Google Play Services، Google Maps، Google AdMob، Firebase و Google Play Billing استفاده می‌کند. استفاده شما از آن خدمات ممکن است مشمول شرایط و سیاست‌های حفظ حریم خصوصی خودشان باشد. ما مسئول خدمات یا محتوای اشخاص ثالث نیستیم.","h9":"9. سلب مسئولیت از ضمانت‌ها","p9":"برنامه بر مبنای \"همان‌طور که هست\" و \"همان‌طور که در دسترس است\"، بدون هیچ‌گونه ضمانتی، اعم از صریح یا ضمنی، از جمله ضمانت‌های ضمنی قابلیت فروش، تناسب برای هدفی خاص، دقت و عدم نقض، ارائه می‌شود. ما تضمین نمی‌کنیم که برنامه بدون وقفه، بدون خطا، امن باشد یا اینکه هر اطلاعاتی که ارائه می‌دهد دقیق یا قابل‌اعتماد باشد.","h10":"10. محدودیت مسئولیت","p10":"تا حداکثر حدی که قانون اجازه می‌دهد، GO PRACHI LABS و شرکت‌های وابسته به آن مسئول هیچ‌گونه خسارت غیرمستقیم، اتفاقی، خاص، تبعی یا تنبیهی، یا هرگونه از دست دادن داده‌ها، سود یا حسن نیت که ناشی از استفاده شما (یا ناتوانی در استفاده) از برنامه یا مرتبط با آن باشد، نخواهند بود. تا حدی که مسئولیت قابل استثنا نباشد، مسئولیت کل ما به مبلغی که در دوازده ماه قبل از ادعا برای برنامه به ما پرداخت کرده‌اید (در صورت وجود) محدود می‌شود.","h11":"11. جبران خسارت","p11":"شما موافقت می‌کنید که GO PRACHI LABS را در برابر هرگونه ادعا، خسارت، مسئولیت و هزینه‌های ناشی از استفاده شما از برنامه، محتوای شما یا نقض این شرایط توسط شما، جبران خسارت کرده و مصون نگه دارید.","h12":"12. خاتمه","p12":"می‌توانید در هر زمان با حذف نصب برنامه، استفاده از آن را متوقف کنید. اگر این شرایط را نقض کنید یا اگر برنامه را متوقف کنیم، ممکن است دسترسی شما به برنامه را معلق یا خاتمه دهیم. مقرراتی که به‌طور طبیعی باید پس از خاتمه باقی بمانند (از جمله مالکیت معنوی، سلب مسئولیت‌ها و محدودیت مسئولیت) باقی خواهند ماند.","h13":"13. تغییرات در برنامه و شرایط","p13":"ما ممکن است برنامه را در هر زمان اصلاح یا متوقف کنیم، یا این شرایط را به‌روزرسانی کنیم. تغییرات اساسی با تاریخ اجرای بازنگری‌شده در این صفحه منتشر خواهند شد. ادامه استفاده شما از برنامه پس از اعمال تغییرات به‌منزله پذیرش شرایط به‌روزشده است.","h14":"14. قانون حاکم","p14":"این شرایط تابع قوانین هند است، بدون توجه به اصول تعارض قوانین. هرگونه اختلاف مشمول صلاحیت انحصاری دادگاه‌های صالح واقع در هند خواهد بود، مگر اینکه صلاحیت الزامی متفاوتی تحت قانون حمایت از مصرف‌کننده قابل‌اجرا برای شما اعمال شود.","h15":"15. با ما تماس بگیرید","p15":"سؤالی درباره این شرایط دارید؟ با ما تماس بگیرید:","footer":"© 2026 GO PRACHI LABS. کلیه حقوق محفوظ است."},"ui":{"ui_language":"زبان","ui_note":"این ترجمه برای راحتی شما ارائه شده است. در صورت وجود هرگونه مغایرت، نسخه انگلیسی از نظر قانونی معتبر است."}},"iw":{"terms":{"title":"תנאי שירות","eff":"תאריך תחילה: 9 July 2026","intro":"תנאי שירות אלה (\"התנאים\") מסדירים את השימוש שלך באפליקציה למכשירים ניידים GPS Map Camera & Compass (\"האפליקציה\"), המסופקת על ידי GO PRACHI LABS (\"אנחנו\", \"אותנו\" או \"שלנו\"). באמצעות הורדה, התקנה או שימוש באפליקציה, אתה מסכים לתנאים אלה. אם אינך מסכים, אנא אל תשתמש באפליקציה.","h1":"1. רישיון לשימוש באפליקציה","p1":"אנו מעניקים לך רישיון אישי, מוגבל, לא-בלעדי, לא-ניתן-להעברה ובר-ביטול להתקין ולהשתמש באפליקציה במכשירים שבבעלותך או בשליטתך, לשימושך האישי או העסקי הפנימי, בכפוף לתנאים אלה ולכללי חנות האפליקציות שממנה הורדת אותה.","h2":"2. התוכן שלך","p2":"תמונות, סרטונים ותוכן אחר שאתה מצלם או יוצר באמצעות האפליקציה (\"התוכן שלך\") שייכים לך. האפליקציה מעבדת את התוכן שלך במכשיר שלך כדי להוסיף מיקום, תאריך/שעה, מצפן ומידע קשור. אתה האחראי הבלעדי לתוכן שלך ולאופן שבו אתה משתמש בו, מאחסן אותו ומשתף אותו, ואתה מאשר שיש לך את הזכות לצלם ולהשתמש בו.","h3":"3. דיוק המיקום והמצפן — חשוב","note3":"המיקום, הקואורדינטות, הכתובת, הגובה, כיוון המצפן, הסטייה המגנטית ומידע השמש/ירח ומזג האוויר של האפליקציה מסופקים למטרות מידע כלליות בלבד ועשויים להיות לא מדויקים, לא שלמים או מושהים. אל תסתמך על האפליקציה למטרות ניווט, חירום, תעופה, ימי, מדידה, משפטי, קריטי לבטיחות או קריטי לחיים. השתמש תמיד במכשירים ובמקורות רשמיים להחלטות מסוג זה. אתה משתמש במידע זה על אחריותך בלבד.","h4":"4. רכישות","p4":"האפליקציה חינמית לשימוש ונתמכת על ידי פרסום. באפשרותך לרכוש באופן אופציונלי שדרוג חד-פעמי \"הסרת מודעות / Pro\" הפותח תכונות מסוימות. כל הרכישות מעובדות ומחויבות על ידי Google Play, וכפופות לתנאים ולמדיניות ההחזרים של Google Play. איננו מקבלים או מאחסנים את פרטי התשלום שלך. מכיוון שמדובר בפתיחה דיגיטלית חד-פעמית, רכישות אינן ניתנות להחזר באופן כללי אלא במקום שבו הדבר נדרש על פי חוק או על פי מדיניות Google Play. באפשרותך לשחזר רכישה קודמת מתוך האפליקציה באותו חשבון Google.","h5":"5. פרסומות","p5":"אלא אם כן תרכוש את השדרוג נטול המודעות, האפליקציה מציגה פרסומות המסופקות על ידי צדדים שלישיים (כולל Google AdMob). איננו אחראים לתוכן המודעות או לכל מוצר או שירות שהן מקדמות.","h6":"6. שימוש מקובל","p6_intro":"אתה מסכים שלא:","li6_1":"להשתמש באפליקציה לכל מטרה בלתי חוקית או תוך הפרת כל חוק או תקנה חלים;","li6_2":"להעתיק, לשנות, לבצע הנדסה לאחור, לפרק או לנסות לחלץ את קוד המקור של האפליקציה, למעט במידה שהגבלה זו אסורה על פי חוק;","li6_3":"להפריע, לשבש או לנסות לקבל גישה בלתי מורשית לאפליקציה או למערכות הקשורות אליה;","li6_4":"להשתמש באפליקציה כדי להפר את זכויותיהם של אחרים או כדי לצלם תוכן שאינך רשאי לצלם; או","li6_5":"להסיר, להסתיר או לשנות כל הודעת קניין באפליקציה.","h7":"7. קניין רוחני","p7":"האפליקציה, כולל התוכנה, העיצוב, הלוגואים והסימנים המסחריים שלה (אך למעט התוכן שלך וחומרי צד שלישי), היא בבעלות GO PRACHI LABS ומוגנת על ידי חוקי קניין רוחני. למעט הרישיון שהוענק לעיל, לא מועברות אליך כל זכויות.","h8":"8. שירותי צד שלישי","p8":"האפליקציה משתמשת בשירותי צד שלישי כגון Google Play Services, Google Maps, Google AdMob, Firebase ו-Google Play Billing. השימוש שלך בשירותים אלה עשוי להיות כפוף לתנאים ולמדיניות הפרטיות שלהם. איננו אחראים לשירותים או לתוכן של צד שלישי.","h9":"9. כתב ויתור על אחריות","p9":"האפליקציה מסופקת על בסיס \"כפי שהיא\" ו\"כפי שהיא זמינה\", ללא אחריות מכל סוג, בין מפורשת ובין משתמעת, כולל אחריות משתמעת לסחירות, התאמה למטרה מסוימת, דיוק ואי-הפרה. איננו מתחייבים שהאפליקציה תהיה ללא הפרעה, נטולת שגיאות, מאובטחת, או שכל מידע שהיא מספקת יהיה מדויק או אמין.","h10":"10. הגבלת אחריות","p10":"במידה המרבית המותרת על פי חוק, GO PRACHI LABS והחברות הקשורות אליה לא יהיו אחראיות לכל נזק עקיף, מקרי, מיוחד, תוצאתי או עונשי, או לכל אובדן נתונים, רווחים או מוניטין, הנובעים או קשורים לשימוש שלך (או לחוסר היכולת שלך להשתמש) באפליקציה. במידה שלא ניתן לשלול אחריות, האחריות הכוללת שלנו מוגבלת לסכום ששילמת לנו עבור האפליקציה (אם בכלל) בשנים-עשר החודשים שקדמו לתביעה.","h11":"11. שיפוי","p11":"אתה מסכים לשפות ולשמור על GO PRACHI LABS מפני כל תביעה, נזק, חבות והוצאה הנובעים מהשימוש שלך באפליקציה, מהתוכן שלך, או מהפרת התנאים האלה על ידך.","h12":"12. סיום","p12":"באפשרותך להפסיק להשתמש באפליקציה בכל עת על ידי הסרת ההתקנה שלה. אנו רשאים להשעות או לסיים את הגישה שלך לאפליקציה אם תפר תנאים אלה או אם נפסיק את האפליקציה. הוראות שמטבען אמורות לשרוד סיום (כולל קניין רוחני, כתבי ויתור והגבלת אחריות) ישרדו.","h13":"13. שינויים באפליקציה ובתנאים","p13":"אנו רשאים לשנות או להפסיק את האפליקציה, או לעדכן תנאים אלה, בכל עת. שינויים מהותיים יפורסמו בדף זה עם תאריך תחילה מעודכן. המשך השימוש שלך באפליקציה לאחר שהשינויים נכנסים לתוקף מהווה קבלה של התנאים המעודכנים.","h14":"14. הדין החל","p14":"תנאים אלה כפופים לחוקי הודו, ללא התחשבות בעקרונות ברירת הדין. כל מחלוקת תהיה כפופה לסמכות השיפוט הבלעדית של בתי המשפט המוסמכים הממוקמים בהודו, אלא אם כן חלה עליך סמכות שיפוט מחייבת שונה על פי דיני הגנת הצרכן החלים.","h15":"15. צור קשר","p15":"שאלות לגבי תנאים אלה? צור איתנו קשר בכתובת:","footer":"© 2026 GO PRACHI LABS. כל הזכויות שמורות."},"ui":{"ui_language":"שפה","ui_note":"תרגום זה מסופק לנוחותך. במקרה של אי-התאמה כלשהי, הגרסה האנגלית היא הקובעת מבחינה משפטית."}},"id":{"terms":{"title":"Ketentuan Layanan","eff":"Tanggal berlaku: 9 July 2026","intro":"Ketentuan Layanan ini (\"Ketentuan\") mengatur penggunaan Anda atas aplikasi seluler GPS Map Camera & Compass (\"Aplikasi\"), yang disediakan oleh GO PRACHI LABS (\"kami\", \"kita\", atau \"milik kami\"). Dengan mengunduh, memasang, atau menggunakan Aplikasi, Anda menyetujui Ketentuan ini. Jika Anda tidak setuju, harap jangan gunakan Aplikasi.","h1":"1. Lisensi untuk menggunakan Aplikasi","p1":"Kami memberi Anda lisensi pribadi, terbatas, non-eksklusif, tidak dapat dipindahtangankan, dan dapat dicabut untuk memasang dan menggunakan Aplikasi pada perangkat yang Anda miliki atau kendalikan, untuk penggunaan pribadi atau bisnis internal Anda, tunduk pada Ketentuan ini dan aturan toko aplikasi tempat Anda mengunduhnya.","h2":"2. Konten Anda","p2":"Foto, video, dan konten lain yang Anda ambil atau buat dengan Aplikasi (\"Konten Anda\") adalah milik Anda. Aplikasi memproses Konten Anda di perangkat Anda untuk menambahkan lokasi, tanggal/waktu, kompas, dan informasi terkait. Anda sepenuhnya bertanggung jawab atas Konten Anda dan atas cara Anda menggunakan, menyimpan, dan membagikannya, dan Anda memastikan bahwa Anda memiliki hak untuk mengambil dan menggunakannya.","h3":"3. Akurasi lokasi dan kompas — penting","note3":"Lokasi, koordinat, alamat, ketinggian, arah kompas, deklinasi magnetik, serta informasi matahari/bulan dan cuaca dari Aplikasi disediakan hanya untuk tujuan informasi umum dan mungkin tidak akurat, tidak lengkap, atau tertunda. Jangan mengandalkan Aplikasi untuk tujuan navigasi, darurat, penerbangan, kelautan, survei, hukum, kritis-keselamatan, atau kritis-kehidupan. Selalu gunakan instrumen dan sumber resmi untuk keputusan semacam itu. Anda menggunakan informasi ini atas risiko Anda sendiri.","h4":"4. Pembelian","p4":"Aplikasi ini gratis digunakan dan didukung oleh iklan. Anda dapat secara opsional membeli peningkatan sekali bayar \"Hapus Iklan / Pro\" yang membuka fitur tertentu. Semua pembelian diproses dan ditagih oleh Google Play, dan tunduk pada ketentuan serta kebijakan pengembalian dana Google Play. Kami tidak menerima atau menyimpan detail pembayaran Anda. Karena ini adalah pembukaan digital sekali bayar, pembelian umumnya tidak dapat dikembalikan kecuali jika diwajibkan oleh hukum atau oleh kebijakan Google Play. Anda dapat memulihkan pembelian sebelumnya dari dalam Aplikasi pada akun Google yang sama.","h5":"5. Iklan","p5":"Kecuali Anda membeli peningkatan bebas iklan, Aplikasi menampilkan iklan yang disediakan oleh pihak ketiga (termasuk Google AdMob). Kami tidak bertanggung jawab atas konten iklan atau atas produk atau layanan apa pun yang dipromosikannya.","h6":"6. Penggunaan yang dapat diterima","p6_intro":"Anda setuju untuk tidak:","li6_1":"menggunakan Aplikasi untuk tujuan yang melanggar hukum atau melanggar hukum atau peraturan yang berlaku;","li6_2":"menyalin, memodifikasi, merekayasa balik, mendekompilasi, atau mencoba mengekstrak kode sumber Aplikasi, kecuali sejauh pembatasan ini dilarang oleh hukum;","li6_3":"mengganggu, menghambat, atau mencoba mendapatkan akses tidak sah ke Aplikasi atau sistem terkaitnya;","li6_4":"menggunakan Aplikasi untuk melanggar hak orang lain atau untuk mengambil konten yang tidak diizinkan untuk Anda ambil; atau","li6_5":"menghapus, mengaburkan, atau mengubah pemberitahuan kepemilikan apa pun dalam Aplikasi.","h7":"7. Kekayaan intelektual","p7":"Aplikasi, termasuk perangkat lunak, desain, logo, dan mereknya (tetapi tidak termasuk Konten Anda dan materi pihak ketiga), dimiliki oleh GO PRACHI LABS dan dilindungi oleh undang-undang kekayaan intelektual. Kecuali untuk lisensi yang diberikan di atas, tidak ada hak yang dialihkan kepada Anda.","h8":"8. Layanan pihak ketiga","p8":"Aplikasi menggunakan layanan pihak ketiga seperti Google Play Services, Google Maps, Google AdMob, Firebase, dan Google Play Billing. Penggunaan Anda atas layanan tersebut dapat tunduk pada ketentuan dan kebijakan privasi mereka sendiri. Kami tidak bertanggung jawab atas layanan atau konten pihak ketiga.","h9":"9. Penafian jaminan","p9":"Aplikasi disediakan atas dasar \"sebagaimana adanya\" dan \"sebagaimana tersedia\", tanpa jaminan apa pun, baik tersurat maupun tersirat, termasuk jaminan tersirat atas kelayakan jual, kesesuaian untuk tujuan tertentu, akurasi, dan tanpa pelanggaran. Kami tidak menjamin bahwa Aplikasi akan bebas gangguan, bebas kesalahan, aman, atau bahwa informasi apa pun yang diberikannya akurat atau dapat diandalkan.","h10":"10. Batasan tanggung jawab","p10":"Sejauh diizinkan oleh hukum, GO PRACHI LABS dan afiliasinya tidak akan bertanggung jawab atas segala kerusakan tidak langsung, insidental, khusus, konsekuensial, atau punitif, atau atas segala kehilangan data, keuntungan, atau itikad baik, yang timbul dari atau terkait dengan penggunaan Anda (atau ketidakmampuan Anda untuk menggunakan) Aplikasi. Sejauh tanggung jawab tidak dapat dikecualikan, total tanggung jawab kami dibatasi pada jumlah yang Anda bayarkan kepada kami untuk Aplikasi (jika ada) dalam dua belas bulan sebelum klaim.","h11":"11. Ganti rugi","p11":"Anda setuju untuk mengganti rugi dan membebaskan GO PRACHI LABS dari segala klaim, kerusakan, kewajiban, dan biaya yang timbul dari penggunaan Anda atas Aplikasi, Konten Anda, atau pelanggaran Anda atas Ketentuan ini.","h12":"12. Penghentian","p12":"Anda dapat berhenti menggunakan Aplikasi kapan saja dengan mencopot pemasangannya. Kami dapat menangguhkan atau menghentikan akses Anda ke Aplikasi jika Anda melanggar Ketentuan ini atau jika kami menghentikan Aplikasi. Ketentuan yang secara sifatnya harus tetap berlaku setelah penghentian (termasuk kekayaan intelektual, penafian, dan batasan tanggung jawab) akan tetap berlaku.","h13":"13. Perubahan pada Aplikasi dan Ketentuan","p13":"Kami dapat memodifikasi atau menghentikan Aplikasi, atau memperbarui Ketentuan ini, kapan saja. Perubahan material akan diposting di halaman ini dengan tanggal berlaku yang direvisi. Penggunaan Aplikasi yang berkelanjutan setelah perubahan berlaku merupakan penerimaan atas Ketentuan yang diperbarui.","h14":"14. Hukum yang mengatur","p14":"Ketentuan ini diatur oleh hukum India, tanpa memperhatikan prinsip-prinsip pertentangan hukum. Setiap sengketa akan tunduk pada yurisdiksi eksklusif pengadilan yang berwenang yang berlokasi di India, kecuali yurisdiksi wajib yang berbeda berlaku bagi Anda berdasarkan undang-undang perlindungan konsumen yang berlaku.","h15":"15. Hubungi kami","p15":"Pertanyaan tentang Ketentuan ini? Hubungi kami di:","footer":"© 2026 GO PRACHI LABS. Semua hak dilindungi."},"ui":{"ui_language":"Bahasa","ui_note":"Terjemahan ini disediakan untuk kenyamanan Anda. Jika terjadi perbedaan, versi bahasa Inggris adalah yang berlaku secara hukum."}},"ms":{"terms":{"title":"Terma Perkhidmatan","eff":"Tarikh berkuat kuasa: 9 July 2026","intro":"Terma Perkhidmatan ini (\"Terma\") mengawal penggunaan anda terhadap aplikasi mudah alih GPS Map Camera & Compass (\"Aplikasi\"), yang disediakan oleh GO PRACHI LABS (\"kami\", \"kita\", atau \"milik kami\"). Dengan memuat turun, memasang, atau menggunakan Aplikasi, anda bersetuju dengan Terma ini. Jika anda tidak bersetuju, sila jangan gunakan Aplikasi.","h1":"1. Lesen untuk menggunakan Aplikasi","p1":"Kami memberikan anda lesen peribadi, terhad, bukan eksklusif, tidak boleh dipindah milik, dan boleh dibatalkan untuk memasang dan menggunakan Aplikasi pada peranti yang anda miliki atau kawal, untuk kegunaan peribadi atau perniagaan dalaman anda, tertakluk kepada Terma ini dan peraturan gedung aplikasi tempat anda memuat turunnya.","h2":"2. Kandungan anda","p2":"Foto, video, dan kandungan lain yang anda tangkap atau cipta dengan Aplikasi (\"Kandungan Anda\") adalah milik anda. Aplikasi memproses Kandungan Anda pada peranti anda untuk menambah lokasi, tarikh/masa, kompas, dan maklumat berkaitan. Anda bertanggungjawab sepenuhnya terhadap Kandungan Anda dan cara anda menggunakan, menyimpan, dan berkongsinya, dan anda mengesahkan bahawa anda mempunyai hak untuk menangkap dan menggunakannya.","h3":"3. Ketepatan lokasi dan kompas — penting","note3":"Lokasi, koordinat, alamat, altitud, arah kompas, sisihan magnet, serta maklumat matahari/bulan dan cuaca Aplikasi disediakan untuk tujuan maklumat umum sahaja dan mungkin tidak tepat, tidak lengkap, atau tertunda. Jangan bergantung pada Aplikasi untuk tujuan navigasi, kecemasan, penerbangan, maritim, ukur, undang-undang, kritikal keselamatan, atau kritikal nyawa. Sentiasa gunakan instrumen dan sumber rasmi untuk keputusan sedemikian. Anda menggunakan maklumat ini atas risiko anda sendiri.","h4":"4. Pembelian","p4":"Aplikasi ini percuma untuk digunakan dan disokong oleh pengiklanan. Anda boleh secara pilihan membeli naik taraf sekali bayar \"Buang Iklan / Pro\" yang membuka kunci ciri tertentu. Semua pembelian diproses dan dibilkan oleh Google Play, dan tertakluk kepada terma dan dasar bayaran balik Google Play. Kami tidak menerima atau menyimpan butiran pembayaran anda. Oleh kerana ia adalah pembukaan kunci digital sekali bayar, pembelian secara amnya tidak boleh dikembalikan kecuali di mana dikehendaki oleh undang-undang atau oleh dasar Google Play. Anda boleh memulihkan pembelian terdahulu dari dalam Aplikasi pada akaun Google yang an tidak melanggar. Kami tidak menjamin bahawa Aplikasi akan tanpa gangguan, bebas ralat, selamat, atau bahawa sebarang maklumat yang diberikannya tepat atau boleh dipercayai.","h10":"10. Batasan liabiliti","p10":"Setakat maksimum yang dibenarkan oleh undang-undang, GO PRACHI LABS dan sekutunya tidak akan bertanggungjawab untuk sebarang kerosakan tidak langsung, sampingan, khas, berbangkit, atau punitif, atau untuk sebarang kehilangan data, keuntungan, atau muhibah, yang timbul daripada atau berkaitan dengan penggunaan anda (atau ketidakupayaan anda untuk menggunakan) Aplikasi. Setakat liabiliti tidak boleh dikecualikan, jumlah liabiliti kami terhad kepada amaun yang anda bayar kepada kami untuk Aplikasi (jika ada) dalam tempoh dua belas bulan sebelum tuntutan.","h11":"11. Tanggung rugi","p11":"Anda bersetuju untuk menanggung rugi dan melindungi GO PRACHI LABS daripada sebarang tuntutan, kerosakan, liabiliti, dan perbelanjaan yang timbul daripada penggunaan anda terhadap Aplikasi, Kandungan Anda, atau pelanggaran anda terhadap Terma ini.","h12":"12. Penamatan","p12":"Anda boleh berhenti menggunakan Aplikasi pada bila-bila masa dengan menyahpasangnya. Kami boleh menggantung atau menamatkan akses anda ke Aplikasi jika anda melanggar Terma ini atau jika kami menghentikan Aplikasi. Peruntukan yang menurut sifatnya harus kekal selepas penamatan (termasuk harta intelek, penafian, dan batasan liabiliti) akan kekal.","h13":"13. Perubahan kepada Aplikasi dan Terma","p13":"Kami boleh mengubah suai atau menghentikan Aplikasi, atau mengemas kini Terma ini, pada bila-bila masa. Perubahan material akan disiarkan pada halaman ini dengan tarikh berkuat kuasa yang disemak. Penggunaan Aplikasi yang berterusan selepas perubahan berkuat kuasa merupakan penerimaan terhadap Terma yang dikemas kini.","h14":"14. Undang-undang yang mengawal","p14":"Terma ini dikawal oleh undang-undang India, tanpa mengambil kira prinsip percanggahan undang-undang. Sebarang pertikaian akan tertakluk kepada bidang kuasa eksklusif mahkamah berwibawa yang terletak di India, melainkan bidang kuasa mandatori yang berbeza terpakai kepada anda di bawah undang-undang perlindungan pengguna yang berkenaan.","h15":"15. Hubungi kami","p15":"Soalan tentang Terma ini? Hubungi kami di:","footer":"© 2026 GO PRACHI LABS. Hak cipta terpelihara."},"ui":{"ui_language":"Bahasa","ui_note":"Terjemahan ini disediakan untuk kemudahan anda. Sekiranya terdapat sebarang percanggahan, versi bahasa Inggeris adalah yang sah dari segi undang-undang."}},"vi":{"terms":{"title":"Điều khoản Dịch vụ","eff":"Ngày có hiệu lực: 9 July 2026","intro":"Các Điều khoản Dịch vụ này (\"Điều khoản\") điều chỉnh việc bạn sử dụng ứng dụng di động GPS Map Camera & Compass (\"Ứng dụng\"), được cung cấp bởi GO PRACHI LABS (\"chúng tôi\" hoặc \"của chúng tôi\"). Bằng cách tải xuống, cài đặt hoặc sử dụng Ứng dụng, bạn đồng ý với các Điều khoản này. Nếu bạn không đồng ý, vui lòng không sử dụng Ứng dụng.","h1":"1. Giấy phép sử dụng Ứng dụng","p1":"Chúng tôi cấp cho bạn một giấy phép cá nhân, giới hạn, không độc quyền, không thể chuyển nhượng, có thể thu hồi để cài đặt và sử dụng Ứng dụng trên các thiết bị mà bạn sở hữu hoặc kiểm soát, cho mục đích sử dụng cá nhân hoặc kinh doanh nội bộ của bạn, tùy thuộc vào các Điều khoản này và các quy tắc của cửa hàng ứng dụng mà bạn đã tải xuống.","h2":"2. Nội dung của bạn","p2":"Ảnh, video và nội dung khác mà bạn chụp hoặc tạo bằng Ứng dụng (\"Nội dung của Bạn\") thuộc về bạn. Ứng dụng xử lý Nội dung của Bạn trên thiết bị của bạn để thêm vị trí, ngày/giờ, la bàn và thông tin liên quan. Bạn hoàn toàn chịu trách nhiệm về Nội dung của Bạn và về cách bạn sử dụng, lưu trữ và chia sẻ nó, và bạn xác nhận rằng bạn có quyền chụp và sử dụng nó.","h3":"3. Độ chính xác của vị trí và la bàn — quan trọng","note3":"Vị trí, tọa độ, địa chỉ, độ cao, hướng la bàn, độ lệch từ, cũng như thông tin về mặt trời/mặt trăng và thời tiết của Ứng dụng chỉ được cung cấp cho mục đích thông tin chung và có thể không chính xác, không đầy đủ hoặc bị trễ. Không dựa vào Ứng dụng cho các mục đích điều hướng, khẩn cấp, hàng không, hàng hải, khảo sát, pháp lý, quan trọng đối với an toàn hoặc quan trọng đối với tính mạng. Luôn sử dụng các thiết bị và nguồn chính thức cho những quyết định như vậy. Bạn sử dụng thông tin này với rủi ro của riêng mình.","h4":"4. Mua hàng","p4":"Ứng dụng miễn phí sử dụng và được hỗ trợ bởi quảng cáo. Bạn có thể tùy chọn mua bản nâng cấp một lần \"Xóa quảng cáo / Pro\" để mở khóa một số tính năng nhất định. Tất cả các giao dịch mua được xử lý và tính phí bởi Google Play, và tuân theo các điều khoản cũng như chính sách hoàn tiền của Google Play. Chúng tôi không nhận hoặc lưu trữ thông tin thanh toán của bạn. Vì đây là hình thức mở khóa kỹ thuật số một lần, các giao dịch mua thường không được hoàn tiền trừ khi được yêu cầu bởi pháp luật hoặc theo chính sách của Google Play. Bạn có thể khôi phục giao dịch mua trước đó từ trong Ứng dụng trên cùng một tài khoản Google.","h5":"5. Quảng cáo","p5":"Trừ khi bạn mua bản nâng cấp không quảng cáo, Ứng dụng hiển thị quảng cáo do các bên thứ ba cung cấp (bao gồm Google AdMob). Chúng tôi không chịu trách nhiệm về nội dung của quảng cáo hoặc về bất kỳ sản phẩm hoặc dịch vụ nào mà chúng quảng bá.","h6":"6. Sử dụng được chấp nhận","p6_intro":"Bạn đồng ý không:","li6_1":"sử dụng Ứng dụng cho bất kỳ mục đích bất hợp pháp nào hoặc vi phạm bất kỳ luật hoặc quy định hiện hành nào;","li6_2":"sao chép, sửa đổi, dịch ngược, dịch mã, hoặc cố gắng trích xuất mã nguồn của Ứng dụng, trừ trường hợp hạn chế này bị pháp luật cấm;","li6_3":"can thiệp, làm gián đoạn, hoặc cố gắng truy cập trái phép vào Ứng dụng hoặc các hệ thống liên quan của nó;","li6_4":"sử dụng Ứng dụng để xâm phạm quyền của người khác hoặc để chụp nội dung mà bạn không được phép chụp; hoặc","li6_5":"gỡ bỏ, che khuất, hoặc thay đổi bất kỳ thông báo độc quyền nào trong Ứng dụng.","h7":"7. Sở hữu trí tuệ","p7":"Ứng dụng, bao gồm phần mềm, thiết kế, logo và nhãn hiệu của nó (nhưng không bao gồm Nội dung của Bạn và tài liệu của bên thứ ba), thuộc sở hữu của GO PRACHI LABS và được bảo vệ bởi luật sở hữu trí tuệ. Ngoại trừ giấy phép được cấp ở trên, không có quyền nào được chuyển giao cho bạn.","h8":"8. Dịch vụ bên thứ ba","p8":"Ứng dụng sử dụng các dịch vụ bên thứ ba như Google Play Services, Google Maps, Google AdMob, Firebase và Google Play Billing. Việc bạn sử dụng các dịch vụ đó có thể tuân theo các điều khoản và chính sách quyền riêng tư riêng của họ. Chúng tôi không chịu trách nhiệm về các dịch vụ hoặc nội dung của bên thứ ba.","h9":"9. Tuyên bố miễn trừ bảo đảm","p9":"Ứng dụng được cung cấp trên cơ sở \"nguyên trạng\" và \"khi có sẵn\", không có bảo đảm dưới bất kỳ hình thức nào, dù rõ ràng hay ngụ ý, bao gồm các bảo đảm ngụ ý về khả năng bán được, tính phù hợp cho một mục đích cụ thể, độ chính xác và không vi phạm. Chúng tôi không bảo đảm rằng Ứng dụng sẽ không bị gián đoạn, không có lỗi, an toàn, hoặc bất kỳ thông tin nào mà nó cung cấp là chính xác hoặc đáng tin cậy.","h10":"10. Giới hạn trách nhiệm","p10":"Trong phạm vi tối đa được pháp luật cho phép, GO PRACHI LABS và các chi nhánh của mình sẽ không chịu trách nhiệm về bất kỳ thiệt hại gián tiếp, ngẫu nhiên, đặc biệt, do hậu quả hoặc mang tính trừng phạt nào, hoặc về bất kỳ mất mát dữ liệu, lợi nhuận hoặc uy tín nào, phát sinh từ hoặc liên quan đến việc bạn sử dụng (hoặc không thể sử dụng) Ứng dụng. Trong phạm vi trách nhiệm không thể loại trừ, tổng trách nhiệm của chúng tôi được giới hạn ở số tiền bạn đã trả cho chúng tôi cho Ứng dụng (nếu có) trong mười hai tháng trước khi khiếu nại.","h11":"11. Bồi thường","p11":"Bạn đồng ý bồi thường và giữ cho GO PRACHI LABS không bị tổn hại khỏi bất kỳ khiếu nại, thiệt hại, trách nhiệm pháp lý và chi phí nào phát sinh từ việc bạn sử dụng Ứng dụng, Nội dung của Bạn, hoặc việc bạn vi phạm các Điều khoản này.","h12":"12. Chấm dứt","p12":"Bạn có thể ngừng sử dụng Ứng dụng bất cứ lúc nào bằng cách gỡ cài đặt nó. Chúng tôi có thể tạm ngừng hoặc chấm dứt quyền truy cập của bạn vào Ứng dụng nếu bạn vi phạm các Điều khoản này hoặc nếu chúng tôi ngừng Ứng dụng. Các điều khoản mà theo bản chất của chúng cần tồn tại sau khi chấm dứt (bao gồm sở hữu trí tuệ, tuyên bố miễn trừ và giới hạn trách nhiệm) sẽ vẫn tồn tại.","h13":"13. Thay đổi đối với Ứng dụng và Điều khoản","p13":"Chúng tôi có thể sửa đổi hoặc ngừng Ứng dụng, hoặc cập nhật các Điều khoản này, bất cứ lúc nào. Các thay đổi quan trọng sẽ được đăng trên trang này với ngày có hiệu lực đã sửa đổi. Việc bạn tiếp tục sử dụng Ứng dụng sau khi các thay đổi có hiệu lực cấu thành sự chấp nhận các Điều khoản đã cập nhật.","h14":"14. Luật điều chỉnh","p14":"Các Điều khoản này được điều chỉnh bởi luật pháp Ấn Độ, không tính đến các nguyên tắc xung đột pháp luật. Mọi tranh chấp sẽ thuộc thẩm quyền tài phán độc quyền của các tòa án có thẩm quyền tọa lạc tại Ấn Độ, trừ khi một thẩm quyền tài phán bắt buộc khác áp dụng cho bạn theo luật bảo vệ người tiêu dùng hiện hành.","h15":"15. Liên hệ với chúng tôi","p15":"Có câu hỏi về các Điều khoản này? Hãy liên hệ với chúng tôi tại:","footer":"© 2026 GO PRACHI LABS. Bảo lưu mọi quyền."},"ui":{"ui_language":"Ngôn ngữ","ui_note":"Bản dịch này được cung cấp để thuận tiện cho bạn. Trong trường hợp có bất kỳ sự khác biệt nào, phiên bản tiếng Anh là phiên bản có giá trị pháp lý."}},"th":{"terms":{"title":"ข้อกำหนดในการให้บริการ","eff":"วันที่มีผลบังคับใช้: 9 July 2026","intro":"ข้อกำหนดในการให้บริการนี้ (“ข้อกำหนด”) ควบคุมการใช้แอปพลิเคชันบนมือถือ GPS Map Camera & Compass (“แอป”) ของคุณ ซึ่งจัดหาโดย GO PRACHI LABS (“เรา”, “พวกเรา” หรือ “ของเรา”) การดาวน์โหลด ติดตั้ง หรือใช้แอปถือว่าคุณยอมรับข้อกำหนดเหล่านี้ หากคุณไม่ยอมรับ โปรดอย่าใช้แอป","h1":"1. สิทธิ์การใช้งานแอป","p1":"เรามอบสิทธิ์การใช้งานส่วนบุคคล จำกัด ไม่ผูกขาด ไม่สามารถโอนได้ และเพิกถอนได้ให้คุณในการติดตั้งและใช้แอปบนอุปกรณ์ที่คุณเป็นเจ้าของหรือควบคุม เพื่อการใช้งานส่วนบุคคลหรือการใช้งานทางธุรกิจภายในของคุณ ภายใต้ข้อกำหนดเหล่านี้และกฎของร้านแอปที่คุณดาวน์โหลดมา","h2":"2. เนื้อหาของคุณ","p2":"ภาพถ่าย วิดีโอ และเนื้อหาอื่น ๆ ที่คุณถ่ายหรือสร้างด้วยแอป (“เนื้อหาของคุณ”) เป็นของคุณ แอปจะประมวลผลเนื้อหาของคุณบนอุปกรณ์ของคุณเพื่อเพิ่มตำแหน่ง วันที่/เวลา เข็มทิศ และข้อมูลที่เกี่ยวข้อง คุณเป็นผู้รับผิดชอบแต่เพียงผู้เดียวสำหรับเนื้อหาของคุณและสำหรับวิธีที่คุณใช้ จัดเก็บ และแชร์ และคุณยืนยันว่าคุณมีสิทธิ์ในการถ่ายและใช้เนื้อหานั้น","h3":"3. ความแม่นยำของตำแหน่งและเข็มทิศ — สำคัญ","note3":"ข้อมูลตำแหน่ง พิกัด ที่อยู่ ระดับความสูง ทิศทางเข็มทิศ ค่าเบี่ยงเบนของสนามแม่เหล็ก และข้อมูลดวงอาทิตย์/ดวงจันทร์และสภาพอากาศของแอปมีไว้เพื่อวัตถุประสงค์ในการให้ข้อมูลทั่วไปเท่านั้น และอาจไม่ถูกต้อง ไม่สมบูรณ์ หรือล่าช้า อย่าพึ่งพาแอปสำหรับการนำทาง เหตุฉุกเฉิน การบิน การเดินเรือ การสำรวจ กฎหมาย วัตถุประสงค์ที่สำคัญต่อความปลอดภัย หรือวัตถุประสงค์ที่สำคัญต่อชีวิต ใช้เครื่องมือและแหล่งข้อมูลอย่างเป็นทางการเสมอสำหรับการตัดสินใจดังกล่าว คุณใช้ข้อมูลนี้ด้วยความเสี่ยงของคุณเอง","h4":"4. การซื้อ","p4":"แอปใช้งานได้ฟรีและได้รับการสนับสนุนโดยการโฆษณา คุณสามารถเลือกซื้อการอัปเกรดแบบครั้งเดียว “นำโฆษณาออก / Pro” ที่ปลดล็อกฟีเจอร์บางอย่างได้ การซื้อทั้งหมดได้รับการดำเนินการและเรียกเก็บเงินโดย Google Play และอยู่ภายใต้ข้อกำหนดและนโยบายการคืนเงินของ Google Play เราไม่ได้รับหรือจัดเก็บรายละเอียดการชำระเงินของคุณ เนื่องจากเป็นการปลดล็อกดิจิทัลแบบครั้งเดียว การซื้อโดยทั่วไปจะไม่สามารถขอคืนเงินได้ เว้นแต่กฎหมายหรือนโยบายของ Google Play กำหนดไว้ คุณสามารถกู้คืนการซื้อก่อนหน้านี้จากภายในแอปบนบัญชี Google เดียวกันได้","h5":"5. โฆษณา","p5":"เว้นแต่คุณจะซื้อการอัปเกรดปลอดโฆษณา แอปจะแสดงโฆษณาที่จัดหาโดยบุคคลที่สาม (รวมถึง Google AdMob) เราไม่รับผิดชอบต่อเนื้อหาของโฆษณาหรือสำหรับผลิตภัณฑ์หรือบริการใด ๆ ที่พวกเขาโปรโมต","h6":"6. การใช้งานที่ยอมรับได้","p6_intro":"คุณตกลงที่จะไม่:","li6_1":"ใช้แอปเพื่อวัตถุประสงค์ที่ผิดกฎหมายหรือฝ่าฝืนกฎหมายหรือข้อบังคับที่บังคับใช้ใด ๆ","li6_2":"คัดลอก ดัดแปลง ทำวิศวกรรมย้อนกลับ ถอดรหัส หรือพยายามดึงซอร์สโค้ดของแอป ยกเว้นในขอบเขตที่ข้อจำกัดนี้ถูกห้ามโดยกฎหมาย","li6_3":"แทรกแซง ขัดขวาง หรือพยายามเข้าถึงแอปหรือระบบที่เกี่ยวข้องโดยไม่ได้รับอนุญาต","li6_4":"ใช้แอปเพื่อละเมิดสิทธิของผู้อื่นหรือเพื่อถ่ายเนื้อหาที่คุณไม่ได้รับอนุญาตให้ถ่าย หรือ","li6_5":"ลบ ปิดบัง หรือแก้ไขประกาศกรรมสิทธิ์ใด ๆ ในแอป","h7":"7. ทรัพย์สินทางปัญญา","p7":"แอป รวมถึงซอฟต์แวร์ การออกแบบ โลโก้ และเครื่องหมายการค้า (แต่ไม่รวมเนื้อหาของคุณและสื่อของบุคคลที่สาม) เป็นของ GO PRACHI LABS และได้รับการคุ้มครองโดยกฎหมายทรัพย์สินทางปัญญา ยกเว้นสิทธิ์การใช้งานที่มอบให้ข้างต้น ไม่มีการโอนสิทธิใด ๆ ให้แก่คุณ","h8":"8. บริการของบุคคลที่สาม","p8":"แอปใช้บริการของบุคคลที่สาม เช่น Google Play Services, Google Maps, Google AdMob, Firebase และ Google Play Billing การใช้บริการเหล่านั้นของคุณอาจอยู่ภายใต้ข้อกำหนดและนโยบายความเป็นส่วนตัวของตนเอง เราไม่รับผิดชอบต่อบริการหรือเนื้อหาของบุคคลที่สาม","h9":"9. การปฏิเสธการรับประกัน","p9":"แอปมีให้ตามสภาพ “ตามที่เป็น” และ “ตามที่มี” โดยไม่มีการรับประกันใด ๆ ไม่ว่าจะโดยชัดแจ้งหรือโดยนัย รวมถึงการรับประกันโดยนัยเกี่ยวกับความสามารถในการซื้อขายได้ ความเหมาะสมสำหรับวัตถุประสงค์เฉพาะ ความถูกต้อง และการไม่ละเมิดสิทธิ เราไม่รับประกันว่าแอปจะทำงานโดยไม่หยุดชะงัก ปราศจากข้อผิดพลาด ปลอดภัย หรือว่าข้อมูลใด ๆ ที่แอปให้จะถูกต้องหรือเชื่อถือได้","h10":"10. การจำกัดความรับผิด","p10":"ในขอบเขตสูงสุดที่กฎหมายอนุญาต GO PRACHI LABS และบริษัทในเครือจะไม่รับผิดต่อความเสียหายทางอ้อม โดยบังเอิญ พิเศษ อันเป็นผลสืบเนื่อง หรือเชิงลงโทษใด ๆ หรือต่อการสูญเสียข้อมูล ผลกำไร หรือชื่อเสียง ที่เกิดขึ้นจากหรือเกี่ยวข้องกับการใช้ (หรือการไม่สามารถใช้) แอปของคุณ ในขอบเขตที่ไม่สามารถยกเว้นความรับผิดได้ ความรับผิดทั้งหมดของเราจำกัดอยู่ที่จำนวนเงินที่คุณจ่ายให้เราสำหรับแอป (ถ้ามี) ในสิบสองเดือนก่อนการเรียกร้อง","h11":"11. การชดใช้ค่าเสียหาย","p11":"คุณตกลงที่จะชดใช้ค่าเสียหายและปกป้อง GO PRACHI LABS จากการเรียกร้อง ความเสียหาย ความรับผิด และค่าใช้จ่ายใด ๆ ที่เกิดจากการใช้แอปของคุณ เนื้อหาของคุณ หรือการฝ่าฝืนข้อกำหนดเหล่านี้ของคุณ","h12":"12. การยกเลิก","p12":"คุณสามารถหยุดใช้แอปได้ตลอดเวลาโดยการถอนการติดตั้ง เราอาจระงับหรือยกเลิกการเข้าถึงแอปของคุณหากคุณฝ่าฝืนข้อกำหนดเหล่านี้หรือหากเรายุติการให้บริการแอป ข้อกำหนดที่โดยธรรมชาติควรคงอยู่หลังการยกเลิก (รวมถึงทรัพย์สินทางปัญญา การปฏิเสธการรับประกัน และการจำกัดความรับผิด) จะยังคงมีผลบังคับใช้","h13":"13. การเปลี่ยนแปลงแอปและข้อกำหนด","p13":"เราอาจแก้ไขหรือยุติแอป หรือปรับปรุงข้อกำหนดเหล่านี้ได้ตลอดเวลา การเปลี่ยนแปลงที่สำคัญจะถูกโพสต์บนหน้านี้พร้อมวันที่มีผลบังคับใช้ที่ปรับปรุงแล้ว การใช้แอปต่อไปของคุณหลังจากการเปลี่ยนแปลงมีผลบังคับใช้ถือเป็นการยอมรับข้อกำหนดที่ปรับปรุงแล้ว","h14":"14. กฎหมายที่ใช้บังคับ","p14":"ข้อกำหนดเหล่านี้อยู่ภายใต้กฎหมายของอินเดีย โดยไม่คำนึงถึงหลักการขัดกันแห่งกฎหมาย ข้อพิพาทใด ๆ จะอยู่ภายใต้เขตอำนาจศาลเฉพาะของศาลที่มีอำนาจซึ่งตั้งอยู่ในอินเดีย เว้นแต่จะมีเขตอำนาจศาลบังคับที่แตกต่างกันซึ่งใช้กับคุณภายใต้กฎหมายคุ้มครองผู้บริโภคที่บังคับใช้","h15":"15. ติดต่อเรา","p15":"มีคำถามเกี่ยวกับข้อกำหนดเหล่านี้? ติดต่อเราที่:","footer":"© 2026 GO PRACHI LABS. สงวนลิขสิทธิ์ทั้งหมด"},"ui":{"ui_language":"ภาษา","ui_note":"คำแปลนี้จัดทำขึ้นเพื่อความสะดวกของคุณ ในกรณีที่มีความคลาดเคลื่อนใด ๆ ฉบับภาษาอังกฤษถือเป็นฉบับที่มีผลผูกพันทางกฎหมาย"}},"fil":{"terms":{"title":"Mga Tuntunin ng Serbisyo","eff":"Petsa ng pagkakabisa: 9 July 2026","intro":"Ang Mga Tuntunin ng Serbisyo na ito (“Mga Tuntunin”) ay namamahala sa inyong paggamit ng mobile application na GPS Map Camera & Compass (ang “App”), na ibinigay ng GO PRACHI LABS (“kami”, “namin”, o “amin”). Sa pag-download, pag-install, o paggamit ng App, sumasang-ayon kayo sa Mga Tuntuning ito. Kung hindi kayo sumasang-ayon, mangyaring huwag gamitin ang App.","h1":"1. Lisensya sa paggamit ng App","p1":"Binibigyan namin kayo ng personal, limitado, hindi eksklusibo, hindi naililipat, at maaaring bawiing lisensya upang i-install at gamitin ang App sa mga device na inyong pag-aari o kinokontrol, para sa inyong personal o panloob na paggamit sa negosyo, na napapailalim sa Mga Tuntuning ito at sa mga panuntunan ng app store kung saan ninyo ito na-download.","h2":"2. Ang inyong nilalaman","p2":"Ang mga larawan, video, at iba pang nilalaman na inyong kinukuha o nililikha gamit ang App (“Inyong Nilalaman”) ay pag-aari ninyo. Pinoproseso ng ng consumer.","h15":"15. Makipag-ugnayan sa amin","p15":"May mga tanong tungkol sa Mga Tuntuning ito? Makipag-ugnayan sa amin sa:","footer":"© 2026 GO PRACHI LABS. Nakalaan ang lahat ng karapatan."},"ui":{"ui_language":"Wika","ui_note":"Ang pagsasaling ito ay ibinigay para sa inyong kaginhawahan. Sa kaso ng anumang pagkakaiba, ang bersyong Ingles ang legal na makapangyarihan."}},"my":{"terms":{"title":"ဝန်ဆောင်မှု စည်းမျဉ်းများ","eff":"စတင်အကျိုးသက်ရောက်သည့်ရက်စွဲ- 9 July 2026","intro":"ဤဝန်ဆောင်မှုစည်းမျဉ်းများ (“စည်းမျဉ်းများ”) သည် GO PRACHI LABS (“ကျွန်ုပ်တို့”) မှ ပံ့ပိုးပေးသော မိုဘိုင်းအက်ပလီကေးရှင်း GPS Map Camera & Compass (“အက်ပ်”) ကို သင်အသုံးပြုမှုကို ထိန်းချုပ်သည်။ အက်ပ်ကို ဒေါင်းလုဒ်လုပ်ခြင်း၊ ထည့်သွင်းခြင်း သို့မဟုတ် အသုံးပြုခြင်းဖြင့် ဤစည်းမျဉ်းများကို သင်သဘောတူပါသည်။ သင်သဘောမတူပါက အက်ပ်ကို အသုံးမပြုပါနှင့်။","h1":"1. အက်ပ်ကိုအသုံးပြုရန် လိုင်စင်","p1":"ဤစည်းမျဉ်းများနှင့် သင်ဒေါင်းလုဒ်လုပ်ခဲ့သည့် အက်ပ်စတိုး၏စည်းမျဉ်းများအောက်တွင် သင်ပိုင်ဆိုင်သည့် သို့မဟုတ် ထိန်းချုပ်သည့် စက်ပစ္စည်းများပေါ်တွင် သင်၏ ကိုယ်ပိုင် သို့မဟုတ် အတွင်းစီးပွားရေးအသုံးပြုမှုအတွက် အက်ပ်ကို ထည့်သွင်းအသုံးပြုရန် ကိုယ်ပိုင်၊ ကန့်သတ်၊ သီးသန့်မဟုတ်၊ လွှဲပြောင်း၍မရ၊ ရုပ်သိမ်းနိုင်သော လိုင်စင်ကို ကျွန်ုပ်တို့က သင့်အား ပေးအပ်ပါသည်။","h2":"2. သင်၏ အကြောင်းအရာ","p2":"အက်ပ်ဖြင့် သင်ရိုက်ကူး သို့မဟုတ် ဖန်တီးသည့် ဓာတ်ပုံများ၊ ဗီဒီယိုများနှင့် အခြားအကြောင်းအရာ (“သင်၏အကြောင်းအရာ”) သည် သင့်ပိုင်ဆိုင်မှုဖြစ်သည်။ အက်ပ်သည် တည်နေရာ၊ ရက်စွဲ/အချိန်၊ ကြယ်ပြွန်နှင့် ဆက်စပ်အချက်အလက်ထည့်ရန် သင်၏အကြောင်းအရာကို သင်၏စက်ပစ္စည်းပေါ်တွင် လုပ်ဆောင်သည်။ သင်၏အကြောင်းအရာအတွက်နှင့် ၎င်းကို သင်မည်သို့အသုံးပြု၊ သိမ်းဆည်း၊ မျှဝေသည်အတွက် သင်တစ်ဦးတည်းသာ တာဝန်ရှိပြီး၊ ၎င်းကိုရိုက်ကူးအသုံးပြုရန် အခွင့်အရေးရှိကြောင်း သင်အတည်ပြုပါသည်။","h3":"3. တည်နေရာနှင့် ကြယ်ပြွန်တိကျမှု — အရေးကြီး","note3":"အက်ပ်၏ တည်နေရာ၊ ကိုသြဒိနိတ်များ၊ လိပ်စာ၊ အမြင့်၊ ကြယ်ပြွန်ဦးတည်ရာ၊ သံလိုက်သွေဖည်မှုနှင့် နေ/လ နှင့် ရာသီဥတုအချက်အလက်များကို ယေဘုယျအချက်အလက်ရည်ရွယ်ချက်များအတွက်သာ ပေးထားပြီး မတိကျ၊ မပြည့်စုံ သို့မဟုတ် နှောင့်နှေးနိုင်သည်။ လမ်းညွှန်ခြင်း၊ အရေးပေါ်၊ လေကြောင်း၊ ရေကြောင်း၊ တိုင်းတာခြင်း၊ ဥပဒေ၊ လုံခြုံရေးအရေးကြီးသော သို့မဟုတ် အသက်အရေးကြီးသော ရည်ရွယ်ချက်များအတွက် အက်ပ်ကို အားမကိုးပါနှင့်။ ထိုသို့သောဆုံးဖြတ်ချက်များအတွက် တရားဝင်ကိရိယာများနှင့် အရင်းအမြစ်များကို အမြဲအသုံးပြုပါ။ ဤအချက်အလက်ကို သင်၏ကိုယ်ပိုင်တာဝန်ဖြင့် အသုံးပြုပါသည်။","h4":"4. ဝယ်ယူမှုများ","p4":"အက်ပ်သည် အသုံးပြုရန်အခမဲ့ ဖြစ်ပြီး ကြော်ငြာဖြင့် ပံ့ပိုးထားသည်။ အချို့သောလုပ်ဆောင်ချက်များကို လော့ခ်ဖွင့်ပေးသည့် တစ်ကြိမ်တည်း “ကြော်ငြာများဖယ်ရှားရန် / Pro” အဆင့်မြှင့်တင်မှုကို ရွေးချယ်ဝယ်ယူနိုင်သည်။ ဝယ်ယူမှုအားလုံးကို Google Play က လုပ်ဆောင်ငွေတောင်းခံပြီး Google Play ၏စည်းမျဉ်းများနှင့် ပြန်အမ်းငွေမူဝါဒအောက်တွင်ရှိသည်။ ကျွန်ုပ်တို့သည် သင်၏ငွေပေးချေမှုအသေးစိတ်များကို လက်ခံခြင်း သို့မဟုတ် သိမ်းဆည်းခြင်းမပြုပါ။ တစ်ကြိမ်တည်း ဒစ်ဂျစ်တယ်လော့ခ်ဖွင့်မှုဖြစ်သောကြောင့် ဥပဒေ သို့မဟုတ် Google Play ၏မူဝါဒများက လိုအပ်သည့်နေရာမှလွဲ၍ ဝယ်ယူမှုများကို ယေဘုယျအားဖြင့် ပြန်အမ်း၍မရပါ။ တူညီသော Google အကောင့်တွင် အက်ပ်အတွင်းမှ ယခင်ဝယ်ယူမှုကို ပြန်လည်ရယူနိုင်သည်။","h5":"5. ကြော်ငြာများ","p5":"ကြော်ငြာကင်းစင်သောအဆင့်မြှင့်တင်မှုကို သင်ဝယ်ယူခြင်းမပြုပါက အက်ပ်သည် တတိယအဖွဲ့များ (Google AdMob အပါအဝင်) ပေးသည့် ကြော်ငြာများကို ပြသသည်။ ကျွန်ုပ်တို့သည် ကြော်ငြာများ၏အကြောင်းအရာ သို့မဟုတ် ၎င်းတို့ကြော်ငြာသည့် မည်သည့်ကုန်ပစ္စည်း သို့မဟုတ် ဝန်ဆောင်မှုအတွက်မျှ တာဝန်မရှိပါ။","h6":"6. လက်ခံနိုင်သော အသုံးပြုမှု","p6_intro":"သင်သည် အောက်ပါတို့ကို မပြုလုပ်ရန် သဘောတူသည်-","li6_1":"အက်ပ်ကို တရားမဝင်သောရည်ရွယ်ချက်အတွက် သို့မဟုတ် သက်ဆိုင်ရာဥပဒေ သို့မဟုတ် စည်းမျဉ်းကိုချိုးဖောက်၍ အသုံးပြုခြင်း;","li6_2":"ဤကန့်သတ်ချက်ကို ဥပဒေက တားမြစ်သည့်အတိုင်းအတာမှလွဲ၍ အက်ပ်၏ source code ကို ကူးယူခြင်း၊ ပြင်ဆင်ခြင်း၊ reverse-engineer လုပ်ခြင်း၊ decompile လုပ်ခြင်း သို့မဟုတ် ထုတ်ယူရန်ကြိုးစားခြင်း;","li6_3":"အက်ပ် သို့မဟုတ် ၎င်း၏ဆက်စပ်စနစ်များကို ဝင်ရောက်စွက်ဖက်ခြင်း၊ အနှောင့်အယှက်ပြုခြင်း သို့မဟုတ် ခွင့်ပြုချက်မရှိဘဲ ဝင်ရောက်ရန်ကြိုးစားခြင်း;","li6_4":"အက်ပ်ကို အခြားသူများ၏အခွင့်အရေးကိုချိုးဖောက်ရန် သို့မဟုတ် သင်ရိုက်ကူးခွင့်မရှိသောအကြောင်းအရာကို ရိုက်ကူးရန်အသုံးပြုခြင်း; သို့မဟုတ်","li6_5":"အက်ပ်ရှိ မည်သည့်ပိုင်ဆိုင်မှုအသိပေးချက်များကိုမဆို ဖယ်ရှားခြင်း၊ ဖုံးကွယ်ခြင်း သို့မဟုတ် ပြောင်းလဲခြင်း။","h7":"7. ဉာဏပစ္စည်းပိုင်ဆိုင်မှု","p7":"အက်ပ်၏ ဆော့ဖ်ဝဲ၊ ဒီဇိုင်း၊ လိုဂိုများနှင့် ကုန်အမှတ်တံဆိပ်များအပါအဝင် အက်ပ် (သို့သော် သင်၏အကြောင်းအရာနှင့် တတိယအဖွဲ့ပစ္စည်းများကိုချန်လှပ်၍) သည် GO PRACHI LABS ပိုင်ဆိုင်ပြီး ဉာဏပစ္စည်းဆိုင်ရာဥပဒေများဖြင့် ကာကွယ်ထားသည်။ အထက်တွင်ပေးအပ်ထားသောလိုင်စင်မှလွဲ၍ သင့်ထံသို့ မည်သည့်အခွင့်အရေးမျှ လွှဲပြောင်းခြင်းမရှိပါ။","h8":"8. တတိယအဖွဲ့ ဝန်ဆောင်မှုများ","p8":"အက်ပ်သည် Google Play Services, Google Maps, Google AdMob, Firebase နှင့် Google Play Billing ကဲ့သို့သော တတိယအဖွဲ့ဝန်ဆောင်မှုများကို အသုံးပြုသည်။ ထိုဝန်ဆောင်မှုများကို သင်အသုံးပြုမှုသည် ၎င်းတို့၏ကိုယ်ပိုင်စည်းမျဉ်းများနှင့် ကိုယ်ရေးအချက်အလက်မူဝါဒများအောက်တွင်ရှိနိုင်သည်။ ကျွန်ုပ်တို့သည် တတိယအဖွဲ့ဝန်ဆောင်မှုများ သို့မဟုတ် အကြောင်းအရာအတွက် တာဝန်မရှိပါ။","h9":"9. အာမခံချက်များ ငြင်းဆိုခြင်း","p9":"အက်ပ်ကို “ရှိသည့်အတိုင်း” နှင့် “ရရှိနိုင်သည့်အတိုင်း” အခြေခံဖြင့် ပေးအပ်ထားပြီး၊ ရောင်းဝယ်နိုင်စွမ်း၊ သီးခြားရည်ရွယ်ချက်အတွက်သင့်လျော်မှု၊ တိကျမှုနှင့် မချိုးဖောက်မှုဆိုင်ရာ သွယ်ဝိုက်အာမခံချက်များအပါအဝင် တိုက်ရိုက်ဖြစ်စေ သွယ်ဝိုက်ဖြစ်စေ မည်သည့်အမျိုးအစားအာမခံချက်မျှမပါဝင်ပါ။ အက်ပ်သည် အနှောင့်အယှက်ကင်းမည်၊ အမှားကင်းမည်၊ လုံခြုံမည် သို့မဟုတ် ၎င်းပေးသည့်မည်သည့်အချက်အလက်မဆို တိကျ သို့မဟုတ် ယုံကြည်စိတ်ချရမည်ဟု ကျွန်ုပ်တို့ အာမမခံပါ။","h10":"10. တာဝန်ရှိမှု ကန့်သတ်ခြင်း","p10":"ဥပဒေခွင့်ပြုသည့် အမြင့်ဆုံးအတိုင်းအတာအထိ GO PRACHI LABS နှင့် ၎င်း၏ ဆက်စပ်ကုမ္ပဏီများသည် အက်ပ်ကို သင်အသုံးပြုမှု (သို့မဟုတ် အသုံးမပြုနိုင်မှု) မှ ဖြစ်ပေါ် သို့မဟုတ် ဆက်စပ်သည့် မည်သည့် သွယ်ဝိုက်၊ မတော်တဆ၊ အထူး၊ အကျိုးဆက် သို့မဟုတ် ဒဏ်ခတ်ပြစ်ဒဏ်ဆိုင်ရာ ပျက်စီးဆုံးရှုံးမှုများအတွက်ဖြစ်စေ၊ မည်သည့်ဒေတာ၊ အမြတ်အစွန်း သို့မဟုတ် ဂုဏ်သိက္ခာဆုံးရှုံးမှုအတွက်ဖြစ်စေ တာဝန်မရှိပါ။ တာဝန်ကို ဖယ်ထုတ်၍မရသည့်အတိုင်းအတာအထိ ကျွန်ုပ်တို့၏ စုစုပေါင်းတာဝန်သည် တောင်းဆိုမှုမပြုမီ တစ်ဆယ့်နှစ်လအတွင်း အက်ပ်အတွက် သင်ကျွန်ုပ်တို့အား ပေးချေခဲ့သည့် ပမာဏ (ရှိလျှင်) အထိ ကန့်သတ်ထားသည်။","h11":"11. လျော်ကြေးပေးခြင်း","p11":"အက်ပ်ကို သင်အသုံးပြုမှု၊ သင်၏အကြောင်းအရာ သို့မဟုတ် ဤစည်းမျဉ်းများကို သင်ချိုးဖောက်မှုမှ ဖြစ်ပေါ်လာသော မည်သည့် တောင်းဆိုမှုများ၊ ပျက်စီးမှုများ၊ တာဝန်ရှိမှုများနှင့် စရိတ်များမှ GO PRACHI LABS ကို လျော်ကြေးပေးရန်နှင့် ကာကွယ်ရန် သင်သဘောတူသည်။","h12":"12. ရပ်စဲခြင်း","p12":"အက်ပ်ကို ဖြုတ်ခြင်းဖြင့် အချိန်မရွေး ရပ်တန့်နိုင်သည်။ ဤစည်းမျဉ်းများကို သင်ချိုးဖောက်ပါက သို့မဟုတ် အက်ပ်ကို ကျွန်ုပ်တို့ ရပ်ဆိုင်းပါက အက်ပ်သို့ သင်ဝင်ရောက်ခွင့်ကို ဆိုင်းငံ့ သို့မဟုတ် ရပ်စဲနိုင်သည်။ ၎င်းတို့၏သဘောသဘာဝအရ ရပ်စဲပြီးနောက် ဆက်လက်တည်ရှိသင့်သည့် ပြဋ္ဌာန်းချက်များ (ဉာဏပစ္စည်းပိုင်ဆိုင်မှု၊ ငြင်းဆိုချက်များနှင့် တာဝန်ရှိမှုကန့်သတ်ခြင်းအပါအဝင်) သည် ဆက်လက်တည်ရှိမည်ဖြစ်သည်။","h13":"13. အက်ပ်နှင့် စည်းမျဉ်းများ အပြောင်းအလဲများ","p13":"ကျွန်ုပ်တို့သည် အက်ပ်ကို ပြင်ဆင် သို့မဟုတ် ရပ်ဆိုင်းနိုင်သည် သို့မဟုတ် ဤစည်းမျဉ်းများကို အချိန်မရွေး အပ်ဒိတ်လုပ်နိုင်သည်။ အရေးကြီးသောအပြောင်းအလဲများကို ပြန်လည်ပြင်ဆင်ထားသောစတင်အကျိုးသက်ရောက်သည့်ရက်စွဲဖြင့် ဤစာမျက်နှာတွင် တင်ပြမည်ဖြစ်သည်။ အပြောင်းအလဲများအကျိုးသက်ရောက်ပြီးနောက် အက်ပ်ကို သင်ဆက်လက်အသုံးပြုခြင်းသည် အပ်ဒိတ်လုပ်ထားသောစည်းမျဉ်းများကို လက်ခံခြင်းဖြစ်သည်။","h14":"14. အုပ်ချုပ်သည့် ဥပဒေ","p14":"ဤစည်းမျဉ်းများကို ဥပဒေပဋိပက္ခမူများကို ထည့်သွင်းစဉ်းစားခြင်းမရှိဘဲ အိန္ဒိယ၏ဥပဒေများဖြင့် အုပ်ချုပ်သည်။ သက်ဆိုင်ရာ စားသုံးသူကာကွယ်ရေးဥပဒေအောက်တွင် သင့်အပေါ် အခြားမဖြစ်မနေတရားစီရင်ပိုင်ခွင့်တစ်ခု သက်ရောက်သည်မှလွဲ၍ မည်သည့်အငြင်းပွားမှုများမဆို အိန္ဒိယတွင်တည်ရှိသော အခွင့်အာဏာရှိတရားရုံးများ၏ သီးသန့်တရားစီရင်ပိုင်ခွင့်အောက်တွင်ရှိမည်ဖြစ်သည်။","h15":"15. ကျွန်ုပ်တို့ကို ဆက်သွယ်ပါ","p15":"ဤစည်းမျဉ်းများနှင့်ပတ်သက်၍ မေးခွန်းများရှိပါသလား? ကျွန်ုပ်တို့ကို အောက်ပါလိပ်စာတွင် ဆက်သွယ်ပါ-","footer":"© 2026 GO PRACHI LABS. မူပိုင်ခွင့်အားလုံး ရယူထားသည်။"},"ui":{"ui_language":"ဘာသာစကား","ui_note":"ဤဘာသာပြန်ဆိုချက်ကို သင်၏အဆင်ပြေမှုအတွက် ပေးထားခြင်းဖြစ်သည်။ ကွဲလွဲမှုတစ်စုံတစ်ရာရှိပါက အင်္ဂလိပ်ဗားရှင်းသည် ဥပဒေအရ တရားဝင်အတည်ဖြစ်သည်။"}},"km":{"terms":{"title":"លក្ខខណ្ឌនៃសេវាកម្ម","eff":"កាលបរិច្ឆេទចូលជាធរមាន៖ 9 July 2026","intro":"លក្ខខណ្ឌនៃសេវាកម្មនេះ (“លក្ខខណ្ឌ”) គ្រប់គ្រងការប្រើប្រាស់កម្មវិធីទូរស័ព្ទ GPS Map Camera & Compass (“កម្មវិធី”) របស់អ្នក ដែលផ្តល់ដោយ GO PRACHI LABS (“យើង”)។ តាមរយៈការទាញយក ការដំឡើង ឬការប្រើប្រាស់កម្មវិធីនេះ អ្នកយល់ព្រមចំពោះលក្ខខណ្ឌទាំងនេះ។ ប្រសិនបើអ្នកមិនយល់ព្រម សូមកុំប្រើកម្មវិធីនេះ។","h1":"1. អាជ្ញាបណ្ណប្រើប្រាស់កម្មវិធី","p1":"យើងផ្តល់ឱ្យអ្នកនូវអាជ្ញាបណ្ណផ្ទាល់ខ្លួន មានកម្រិត មិនផ្តាច់មុខ មិនអាចផ្ទេរបាន និងអាចដកហូតបាន ដើម្បីដំឡើង និងប្រើកម្មវិធីនេះនៅលើឧបករណ៍ដែលអ្នកជាម្ចាស់ ឬគ្រប់គ្រង សម្រាប់ការប្រើប្រាស់ផ្ទាល់ខ្លួន ឬអាជីវកម្មផ្ទៃក្នុងរបស់អ្នក ក្រោមលក្ខខណ្ឌទាំងនេះ និងច្បាប់នៃហាងកម្មវិធីដែលអ្នកបានទាញយកវា។","h2":"2. ខ្លឹមសាររបស់អ្នក","p2":"រូបថត វីដេអូ និងខ្លឹមសារផ្សេងទៀតដែលអ្នកថត ឬបង្កើតជាមួយកម្មវិធីនេះ (“ខ្លឹមសាររបស់អ្នក”) ជាកម្មសិទ្ធិរបស់អ្នក។ កម្មវិធីនេះដំណើរការខ្លឹមសាររបស់អ្នកនៅលើឧបករណ៍របស់អ្នក ដើម្បីបន្ថែមទីតាំង កាលបរិច្ឆេទ/ពេលវេលា ត្រីវិស័យ និងព័ត៌មានពាក់ព័ន្ធ។ អ្នកទទួលខុសត្រូវតែម្នាក់ឯងចំពោះខ្លឹមសាររបស់អ្នក និងចំពោះរបៀបដែលអ្នកប្រើ រក្សាទុក និងចែករំលែកវា ហើយអ្នកបញ្ជាក់ថាអ្នកមានសិទ្ធិថត និងប្រើវា។","h3":"3. ភាពត្រឹមត្រូវនៃទីតាំង និងត្រីវិស័យ — សំខាន់","note3":"ទីតាំង កូអរដោនេ អាសយដ្ឋាន កម្ពស់ ទិសដៅត្រីវិស័យ ការងាកឃ្លាតម៉ាញេទិច និងព័ត៌មានព្រះអាទិត្យ/ព្រះចន្ទ និងអាកាសធាតុរបស់កម្មវិធីនេះ ត្រូវបានផ្តល់ជូនសម្រាប់គោលបំណងផ្តល់ព័ត៌មានទូទៅតែប៉ុណ្ណោះ ហើយអាចមិនត្រឹមត្រូវ មិនពេញលេញ ឬយឺតយ៉ាវ។ សូមកុំពឹងផ្អែកលើកម្មវិធីនេះសម្រាប់ការធ្វើដំណើរ ការសង្គ្រោះបន្ទាន់ អាកាសចរណ៍ សមុទ្រ ការស្ទង់ ច្បាប់ គោលបំណងសំខាន់ចំពោះសុវត្ថិភាព ឬសំខាន់ចំពោះជីវិត។ សូមប្រើឧបករណ៍ និងប្រភពផ្លូវការជានិច្ចសម្រាប់ការសម្រេចចិត្តបែបនេះ។ អ្នកប្រើព័ត៌មាននេះក្រោមហានិភ័យផ្ទាល់ខ្លួនរបស់អ្នក។","h4":"4. ការទិញ","p4":"កម្មវិធីនេះឥតគិតថ្លៃប្រើប្រាស់ ហើយគាំទ្រដោយការផ្សាយពាណិជ្ជកម្ម។ អ្នកអាចទិញការធ្វើឱ្យប្រសើរឡើងតែម្តងជាជម្រើស “លុបការផ្សាយពាណិជ្ជកម្ម / Pro” ដែលដោះសោមុខងារមួយចំនួន។ ការទិញទាំងអស់ត្រូវបានដំណើរការ និងចេញវិក្កយបត្រដោយ Google Play ហើយស្ថិតក្រោមលក្ខខណ្ឌ និងគោលការណ៍សងប្រាក់វិញរបស់ Google Play។ យើងមិនទទួល ឬរក្សាទុកព័ត៌មានលម្អិតការទូទាត់របស់អ្នកទេ។ ដោយសារវាជាការដោះសោឌីជីថលតែម្តង ការទិញជាទូទៅមិនអាចសងប្រាក់វិញបានទេ លើកលែងតែច្បាប់ ឬគោលការណ៍របស់ Google Play តម្រូវ។ អ្នកអាចស្តារការទិញពីមុនពីក្នុងកម្មវិធីនៅលើគណនី Google ដូចគ្នា។","h5":"5. ការផ្សាយពាណិជ្ជកម្ម","p5":"លុះត្រាតែអ្នកទិញការធ្វើឱ្យប្រសើរឡើងគ្មានការផ្សាយពាណិជ្ជកម្ម កម្មវិធីនេះបង្ហាញការផ្សាយពាណិជ្ជកម្មដែលផ្តល់ដោយភាគីទីបី (រួមទាំង Google AdMob)។ យើងមិនទទួលខុសត្រូវចំពោះខ្លឹមសារនៃការផ្សាយពាណិជ្ជកម្ម ឬចំពោះផលិតផល ឬសេវាកម្មណាមួយដែលពួកគេផ្សព្វផ្សាយទេ។","h6":"6. ការប្រើប្រាស់ដែលអាចទទួលយកបាន","p6_intro":"អ្នកយល់ព្រមមិន៖","li6_1":"ប្រើកម្មវិធីនេះសម្រាប់គោលបំណងខុសច្បាប់ណាមួយ ឬក្នុងការបំពានច្បាប់ ឬបទប្បញ្ញត្តិដែលអនុវត្តណាមួយ;","li6_2":"ចម្លង កែប្រែ ធ្វើវិស្វកម្មបញ្ច្រាស បំបែក ឬព្យាយាមស្រង់កូដប្រភពនៃកម្មវិធីនេះ លើកលែងតែក្នុងកម្រិតដែលការរឹតបន្តឹងនេះត្រូវបានហាមឃាត់ដោយច្បាប់;","li6_3":"ជ្រៀតជ្រែក រំខាន ឬព្យាយាមចូលប្រើកម្មវិធីនេះ ឬប្រព័ន្ធពាក់ព័ន្ធរបស់វាដោយគ្មានការអនុញ្ញាត;","li6_4":"ប្រើកម្មវិធីនេះដើម្បីបំពានសិទ្ធិអ្នកដទៃ ឬថតខ្លឹមសារដែលអ្នកមិនត្រូវបានអនុញ្ញាតឱ្យថត; ឬ","li6_5":"លុប បិទបាំង ឬកែប្រែសេចក្តីជូនដំណឹងកម្មសិទ្ធិណាមួយនៅក្នុងកម្មវិធីនេះ។","h7":"7. កម្មសិទ្ធិបញ្ញា","p7":"កម្មវិធីនេះ រួមទាំងកម្មវិធីកុំព្យូទ័រ ការរចនា ឡូហ្គោ និងពាណិជ្ជសញ្ញារបស់វា (ប៉ុន្តែមិនរាប់បញ្ចូលខ្លឹមសាររបស់អ្នក និងសម្ភារៈភាគីទីបី) ជាកម្មសិទ្ធិរបស់ GO PRACHI LABS និងត្រូវបានការពារដោយច្បាប់កម្មសិទ្ធិបញ្ញា។ លើកលែងតែអាជ្ញាបណ្ណដែលបានផ្តល់ខាងលើ គ្មានសិទ្ធិណាមួយត្រូវបានផ្ទេរឱ្យអ្នកទេ។","h8":"8. សេវាកម្មភាគីទីបី","p8":"កម្មវិធីនេះប្រើសេវាកម្មភាគីទីបីដូចជា Google Play Services, Google Maps, Google AdMob, Firebase និង Google Play Billing។ ការប្រើប្រាស់សេវាកម្មទាំងនោះរបស់អ្នកអាចស្ថិតក្រោមលក្ខខណ្ឌ និងគោលការណ៍ឯកជនភាពរៀងៗខ្លួន។ យើងមិនទទួលខុសត្រូវចំពោះសេវាកម្ម ឬខ្លឹមសារភាគីទីបីទេ។","h9":"9. ការបដិសេធការធានា","p9":"កម្មវិធីនេះត្រូវបានផ្តល់ជូនលើមូលដ្ឋាន “ដូចដែលមាន” និង “តាមដែលអាចរកបាន” ដោយគ្មានការធានាណាមួយ មិនថាបញ្ជាក់ ឬបង្កប់ន័យ រួមទាំងការធានាបង្កប់ន័យនៃលទ្ធភាពជួញដូរ ភាពសមស្របសម្រាប់គោលបំណងជាក់លាក់ ភាពត្រឹមត្រូវ និងការមិនរំលោភបំពាន។ យើងមិនធានាថាកម្មវិធីនេះនឹងមិនមានការរំខាន គ្មានកំហុស មានសុវត្ថិភាព ឬថាព័ត៌មានណាមួយដែលវាផ្តល់គឺត្រឹមត្រូវ ឬអាចទុកចិត្តបានទេ។","h10":"10. ការកំណត់ការទទួលខុសត្រូវ","p10":"ក្នុងកម្រិតអតិបរមាដែលច្បាប់អនុញ្ញាត GO PRACHI LABS និងសាខារបស់ខ្លួននឹងមិនទទួលខុសត្រូវ  නියමයන් (“නියමයන්”) GO PRACHI LABS (“අපි”, “අප”) විසින් සපයනු ලබන GPS Map Camera & Compass ජංගම යෙදුම (“යෙදුම”) ඔබ භාවිතා කිරීම පාලනය කරයි. යෙදුම බාගත කිරීම, ස්ථාපනය කිරීම හෝ භාවිතා කිරීම මගින්, ඔබ මෙම නියමයන්ට එකඟ වේ. ඔබ එකඟ නොවන්නේ නම්, කරුණාකර යෙදුම භාවිතා නොකරන්න.","h1":"1. යෙදුම භාවිතා කිරීමේ බලපත්‍රය","p1":"මෙම නියමයන්ට සහ ඔබ එය බාගත කළ යෙදුම් වෙළඳසැලේ නීතිවලට යටත්ව, ඔබගේ පුද්ගලික හෝ අභ්‍යන්තර ව්‍යාපාරික භාවිතය සඳහා ඔබ අයිති හෝ පාලනය කරන උපාංගවල යෙදුම ස්ථාපනය කර භාවිතා කිරීමට අපි ඔබට පුද්ගලික, සීමිත, නොවිශේෂිත, මාරු කළ නොහැකි, අවලංගු කළ හැකි බලපත්‍රයක් ලබා දෙමු.","h2":"2. ඔබගේ අන්තර්ගතය","p2":"යෙදුම සමඟ ඔබ ග්‍රහණය කරන හෝ නිර්මාණය කරන ඡායාරූප, වීඩියෝ සහ අනෙකුත් අන්තර්ගතය (“ඔබගේ අන්තර්ගතය”) ඔබට අයත් වේ. යෙදුම ස්ථානය, දිනය/වේලාව, මාලිමාව සහ අදාළ තොරතුරු එක් කිරීමට ඔබගේ උපාංගයෙහි ඔබගේ අන්තර්ගතය සකසයි. ඔබගේ අන්තර්ගතය සඳහා සහ ඔබ එය භාවිතා කරන, ගබඩා කරන සහ බෙදා ගන්නා ආකාරය සඳහා ඔබ තනිවම වගකිව යුතු අතර, එය ග්‍රහණය කිරීමට සහ භාවිතා කිරීමට ඔබට අයිතිය ඇති බව ඔබ සනාථ කරයි.","h3":"3. ස්ථානය සහ මාලිමා නිරවද්‍යතාව — වැදගත්","note3":"යෙදුමේ ස්ථානය, ඛණ්ඩාංක, ලිපිනය, උන්නතාංශය, මාලිමා දිශානතිය, චුම්භක අපගමනය සහ හිරු/සඳ සහ කාලගුණ තොරතුරු සාමාන්‍ය තොරතුරු අරමුණු සඳහා පමණක් සපයනු ලබන අතර නිරවද්‍ය නොවන, අසම්පූර්ණ හෝ ප්‍රමාද විය හැක. නාවික මං සලකුණු කිරීම, හදිසි අවස්ථා, ගුවන්, සමුද්‍ර, මිනුම්, නෛතික, ආරක්ෂක-තීරණාත්මක හෝ ජීවිත-තීරණාත්මක අරමුණු සඳහා යෙදුම මත රඳා නොසිටින්න. එවැනි තීරණ සඳහා සැමවිටම නිල උපකරණ සහ මූලාශ්‍ර භාවිතා කරන්න. ඔබ මෙම තොරතුරු ඔබගේම අවදානමින් භාවිතා කරයි.","h4":"4. මිලදී ගැනීම්","p4":"යෙදුම භාවිතා කිරීමට නොමිලේ වන අතර දැන්වීම් මගින් සහාය දක්වයි. ඇතැම් විශේෂාංග අගුළු හරින විකල්ප එක්-වර “දැන්වීම් ඉවත් කරන්න / Pro” යාවත්කාලීන කිරීමක් ඔබට මිලදී ගත හැක. සියලුම මිලදී ගැනීම් Google Play විසින් සකසා බිල් කරනු ලබන අතර Google Play හි නියමයන් සහ ආපසු ගෙවීමේ ප්‍රතිපත්තියට යටත් වේ. අපි ඔබගේ ගෙවීම් විස්තර ලබා නොගනිමු හෝ ගබඩා නොකරමු. එය එක්-වර ඩිජිටල් අගුළු හැරීමක් වන බැවින්, නීතිය හෝ Google Play හි ප්‍රතිපත්ති මගින් අවශ්‍ය වන විට හැර මිලදී ගැනීම් සාමාන්‍යයෙන් ආපසු ගෙවිය නොහැක. එම Google ගිණුමෙහි යෙදුම තුළ සිට ඔබට පෙර මිලදී ගැනීමක් ප්‍රතිසාධනය කළ හැක.","h5":"5. දැන්වීම්","p5":"ඔබ දැන්වීම්-රහිත යාවත්කාලීන කිරීම මිලදී නොගන්නේ නම්, යෙදුම තෙවන පාර්ශ්ව (Google AdMob ඇතුළුව) විසින් සපයන දැන්වීම් පෙන්වයි. දැන්වීම්වල අන්තර්ගතය සඳහා හෝ ඒවා ප්‍රවර්ධනය කරන කිසිදු නිෂ්පාදනයක් හෝ සේවාවක් සඳහා අපි වගකිව යුතු නොවේ.","h6":"6. පිළිගත හැකි භාවිතය","p6_intro":"ඔබ පහත සඳහන් දේ නොකිරීමට එකඟ වේ:","li6_1":"යෙදුම කිසියම් නීති විරෝධී අරමුණක් සඳහා හෝ අදාළ නීතියක් හෝ රෙගුලාසියක් උල්ලංඝනය කරමින් භාවිතා කිරීම;","li6_2":"මෙම සීමාව නීතියෙන් තහනම් කර ඇති තරමට හැර, යෙදුමේ මූලාශ්‍ර කේතය පිටපත් කිරීම, වෙනස් කිරීම, ප්‍රතිලෝම-ඉංජිනේරු කිරීම, විසංයෝජනය කිරීම හෝ ලබා ගැනීමට උත්සාහ කිරීම;","li6_3":"යෙදුම හෝ එහි අදාළ පද්ධතිවලට බාධා කිරීම, කඩාකප්පල් කිරීම හෝ අනවසර ප්‍රවේශයක් ලබා ගැනීමට උත්සාහ කිරීම;","li6_4":"අන් අයගේ අයිතිවාසිකම් උල්ලංඝනය කිරීමට හෝ ඔබට ග්‍රහණය කිරීමට අවසර නැති අන්තර්ගතය ග්‍රහණය කිරීමට යෙදුම භාවිතා කිරීම; හෝ","li6_5":"යෙදුමේ කිසියම් හිමිකාරී දැන්වීම් ඉවත් කිරීම, අපැහැදිලි කිරීම හෝ වෙනස් කිරීම.","h7":"7. බුද්ධිමය දේපළ","p7":"යෙදුම, එහි මෘදුකාංගය, සැලසුම, ලාංඡන සහ වෙළඳ ලකුණු ඇතුළුව (නමුත් ඔබගේ අන්තර්ගතය සහ තෙවන පාර්ශ්ව ද්‍රව්‍ය හැර), GO PRACHI LABS සතු වන අතර බුද්ධිමය දේපළ නීතිවලින් ආරක්ෂා කර ඇත. ඉහත ලබා දුන් බලපත්‍රය හැර, කිසිදු අයිතියක් ඔබට මාරු නොකෙරේ.","h8":"8. තෙවන පාර්ශ්ව සේවා","p8":"යෙදුම Google Play Services, Google Maps, Google AdMob, Firebase සහ Google Play Billing වැනි තෙවන පාර්ශ්ව සේවා භාවිතා කරයි. එම සේවා ඔබ භාවිතා කිරීම ඒවායේම නියමයන් සහ පෞද්ගලිකත්ව ප්‍රතිපත්තිවලට යටත් විය හැක. තෙවන පාර්ශ්ව සේවා හෝ අන්තර්ගතය සඳහා අපි වගකිව යුතු නොවේ.","h9":"9. වගකීම් ප්‍රතික්ෂේප කිරීම","p9":"යෙදුම “පවතින පරිදි” සහ “ලබා ගත හැකි පරිදි” පදනම මත සපයනු ලබන අතර, වෙළඳ හැකියාව, විශේෂිත අරමුණක් සඳහා සුදුසුකම, නිරවද්‍යතාව සහ නොකඩකිරීම පිළිබඳ ව්‍යංග වගකීම් ඇතුළුව, ප්‍රකාශිත හෝ ව්‍යංග කිසිදු ආකාරයක වගකීම් නොමැතිව සපයයි. යෙදුම බාධාවකින් තොර, දෝෂ රහිත, ආරක්ෂිත වනු ඇති බවට හෝ එය සපයන කිසියම් තොරතුරක් නිරවද්‍ය හෝ විශ්වසනීය බවට අපි වගකීමක් නොදෙමු.","h10":"10. වගකීම් සීමා කිරීම","p10":"නීතිය මගින් අවසර දෙන උපරිම ප්‍රමාණයට, GO PRACHI LABS සහ එහි අනුබද්ධ ආයතන යෙදුම ඔබ භාවිතා කිරීමෙන් (හෝ භාවිතා කිරීමට නොහැකි වීමෙන්) පැන නගින හෝ ඊට සම්බන්ධ කිසියම් වක්‍ර, අහම්බෙන් සිදුවන, විශේෂ, ප්‍රතිඵලාත්මක හෝ දඬුවම් හානි සඳහා, හෝ දත්ත, ලාභ හෝ සද්භාවය අහිමි වීම සඳහා වගකිව යුතු නොවේ. වගකීම බැහැර කළ නොහැකි ප්‍රමාණයට, අපගේ සම්පූර්ණ වගකීම හිමිකම් පෑමට පෙර මාස දොළහ තුළ යෙදුම සඳහා ඔබ අපට ගෙවූ මුදලට (ඇත්නම්) සීමා වේ.","h11":"11. හානිපූරණය","p11":"යෙදුම ඔබ භාවිතා කිරීමෙන්, ඔබගේ අන්තර්ගතයෙන් හෝ මෙම නියමයන් ඔබ උල්ලංඝනය කිරීමෙන් පැන නගින කිසියම් හිමිකම් පෑම්, හානි, වගකීම් සහ වියදම්වලින් GO PRACHI LABS හානිපූරණය කර හානියෙන් ආරක්ෂා කිරීමට ඔබ එකඟ වේ.","h12":"12. අවසන් කිරීම","p12":"ඔබට යෙදුම අස්ථාපනය කිරීමෙන් ඕනෑම වේලාවක එය භාවිතා කිරීම නැවැත්විය හැක. ඔබ මෙම නියමයන් උල්ලංඝනය කරන්නේ නම් හෝ අපි යෙදුම නවත්වන්නේ නම් යෙදුමට ඔබගේ ප්‍රවේශය අපට අත්හිටුවීමට හෝ අවසන් කිරීමට හැක. ස්වභාවයෙන්ම අවසන් කිරීමෙන් පසු පැවතිය යුතු විධිවිධාන (බුද්ධිමය දේපළ, ප්‍රතික්ෂේප කිරීම් සහ වගකීම් සීමා කිරීම ඇතුළුව) දිගටම පවතී.","h13":"13. යෙදුම සහ නියමයන් වෙනස් කිරීම","p13":"අපි ඕනෑම වේලාවක යෙදුම වෙනස් කිරීමට හෝ නැවැත්වීමට, හෝ මෙම නියමයන් යාවත්කාලීන කිරීමට හැක. ද්‍රව්‍යමය වෙනස්කම් සංශෝධිත බලාත්මක වන දිනයක් සමඟ මෙම පිටුවේ පළ කරනු ලැබේ. වෙනස්කම් බලාත්මක වූ පසු යෙදුම ඔබ දිගටම භාවිතා කිරීම යාවත්කාලීන කළ නියමයන් පිළිගැනීමක් වේ.","h14":"14. පාලක නීතිය","p14":"මෙම නියමයන් නීති ගැටුම් මූලධර්ම නොසලකා ඉන්දියාවේ නීතිවලින් පාලනය වේ. අදාළ පාරිභෝගික ආරක්ෂණ නීතිය යටතේ ඔබට වෙනස් අනිවාර්ය අධිකරණ බලයක් අදාළ නොවන්නේ නම් හැර, ඕනෑම ආරවුලක් ඉන්දියාවේ පිහිටි නිසි අධිකරණවල සුවිශේෂී අධිකරණ බලයට යටත් වේ.","h15":"15. අප හා සම්බන්ධ වන්න","p15":"මෙම නියමයන් පිළිබඳ ප්‍රශ්න? පහත ලිපිනයෙන් අප හා සම්බන්ධ වන්න:","footer":"© 2026 GO PRACHI LABS. සියලුම හිමිකම් ඇවිරිණි."},"ui":{"ui_language":"භාෂාව","ui_note":"මෙම පරිවර්තනය ඔබගේ පහසුව සඳහා සපයනු ලැබේ. කිසියම් නොගැලපීමක් ඇති වුවහොත්, ඉංග්‍රීසි අනුවාදය නෛතිකව බලය ලත් අනුවාදය වේ."}},"zh-CN":{"terms":{"title":"服务条款","eff":"生效日期：9 July 2026","intro":"本服务条款（“条款”）管辖您对由 GO PRACHI LABS（“我们”）提供的移动应用 GPS Map
