sion is the legally authoritative one."}},"hi":{"terms":{"title":"सेवा की शर्तें","eff":"प्रभावी तिथि: 9 July 2026","intro":"ये सेवा की शर्तें (\"Terms\") मोबाइल एप्लिकेशन GPS Map Camera & Compass (\"App\") के आपके उपयोग को नियंत्रित करती हैं, जो GO PRACHI LABS (\"हम\", \"हमें\", या \"हमारा\") द्वारा प्रदान किया गया है। App को डाउनलोड, इंस्टॉल, या उपयोग करके, आप इन Terms से सहमत होते हैं। यदि आप सहमत नहीं हैं, तो कृपया App का उपयोग न करें।","h1":"1. App के उपयोग का लाइसेंस","p1":"हम आपको इन Terms और जिस ऐप स्टोर से आपने इसे डाउनलोड किया है उसके नियमों के अधीन, आपके स्वामित्व या नियंत्रण वाले डिवाइस पर App को इंस्टॉल और उपयोग करने के लिए आपके व्यक्तिगत या आंतरिक व्यावसायिक उपयोग हेतु एक व्यक्तिगत, सीमित, गैर-अनन्य, गैर-हस्तांतरणीय, प्रतिसंहरणीय लाइसेंस प्रदान करते हैं।","h2":"2. आपकी सामग्री","p2":"App के साथ आपके द्वारा कैप्चर या निर्मित तस्वीरें, वीडियो, और अन्य सामग्री (\"आपकी सामग्री\") आपकी हैं। App स्थान, दिनांक/समय, कम्पास, और संबंधित जानकारी जोड़ने के लिए आपके डिवाइस पर आपकी सामग्री को संसाधित करता है। आप अपनी सामग्री के लिए और इसका उपयोग, भंडारण, और साझा करने के तरीके के लिए पूरी तरह जिम्मेदार हैं, और आप पुष्टि करते हैं कि आपके पास इसे कैप्चर करने और उपयोग करने का अधिकार है।","h3":"3. स्थान और कम्पास सटीकता — महत्वपूर्ण","note3":"App की स्थान, निर्देशांक, पता, ऊँचाई, कम्पास दिशा, चुंबकीय विचलन, और सूर्य/चंद्रमा तथा मौसम की जानकारी केवल सामान्य सूचना उद्देश्यों के लिए प्रदान की जाती है और यह गलत, अपूर्ण, या विलंबित हो सकती है। नेविगेशन, आपातकाल, विमानन, समुद्री, सर्वेक्षण, कानूनी, सुरक्षा-महत्वपूर्ण, या जीवन-महत्वपूर्ण उद्देश्यों के लिए App पर निर्भर न रहें। ऐसे निर्णयों के लिए हमेशा आधिकारिक उपकरणों और स्रोतों का उपयोग करें। आप इस जानकारी का उपयोग अपने जोखिम पर करते हैं।","h4":"4. खरीदारी","p4":"App उपयोग करने के लिए निःशुल्क है और विज्ञापन द्वारा समर्थित है। आप वैकल्पिक रूप से एक-बार वाला \"Remove Ads / Pro\" अपग्रेड खरीद सकते हैं जो कुछ सुविधाओं को अनलॉक करता है। सभी खरीदारी Google Play द्वारा संसाधित और बिल की जाती है, और Google Play की शर्तों और धनवापसी क्त हो या निहित, जिसमें व्यापारिकता, किसी विशेष उद्देश्य के लिए उपयुक्तता, सटीकता, और गैर-उल्लंघन की निहित वारंटी शामिल हैं। हम गारंटी नहीं देते कि App निर्बाध, त्रुटि-मुक्त, सुरक्षित होगा, या यह कि इसके द्वारा प्रदान की गई कोई भी जानकारी सटीक या विश्वसनीय है।","h10":"10. दायित्व की सीमा","p10":"कानून द्वारा अनुमत अधिकतम सीमा तक, GO PRACHI LABS और इसके सहयोगी किसी भी अप्रत्यक्ष, आकस्मिक, विशेष, परिणामी, या दंडात्मक क्षति के लिए, या डेटा, लाभ, या सद्भावना के किसी भी नुकसान के लिए उत्तरदायी नहीं होंगे, जो App के आपके उपयोग (या उपयोग करने में असमर्थता) से उत्पन्न या उससे संबंधित हो। जिस सीमा तक दायित्व को बाहर नहीं किया जा सकता, हमारा कुल दायित्व दावे से पहले बारह महीनों में App के लिए आपके द्वारा हमें भुगतान की गई राशि (यदि कोई हो) तक सीमित है।","h11":"11. क्षतिपूर्ति","p11":"आप App के आपके उपयोग, आपकी सामग्री, या इन Terms के आपके उल्लंघन से उत्पन्न किसी भी दावे, क्षति, देयता, और व्यय से GO PRACHI LABS को क्षतिपूर्ति देने और हानिरहित रखने के लिए सहमत होते हैं।","h12":"12. समाप्ति","p12":"आप किसी भी समय App को अनइंस्टॉल करके इसका उपयोग बंद कर सकते हैं। यदि आप इन Terms का उल्लंघन करते हैं या यदि हम App को बंद कर देते हैं तो हम App तक आपकी पहुँच को निलंबित या समाप्त कर सकते हैं। ऐसे प्रावधान जो अपनी प्रकृति से समाप्ति के बाद भी बने रहने चाहिए (बौद्धिक संपदा, अस्वीकरण, और दायित्व की सीमा सहित) बने रहेंगे।","h13":"13. App और Terms में परिवर्तन","p13":"हम किसी भी समय App को संशोधित या बंद कर सकते हैं, या इन Terms को अद्यतन कर सकते हैं। महत्वपूर्ण परिवर्तन इस पृष्ठ पर एक संशोधित प्रभावी तिथि के साथ पोस्ट किए जाएँगे। परिवर्तन प्रभावी होने के बाद App का आपका निरंतर उपयोग अद्यतन Terms की स्वीकृति का गठन करता है।","h14":"14. शासी कानून","p14":"ये Terms भारत के कानूनों द्वारा शासित हैं, कानून-संघर्ष सिद्धांतों की परवाह किए बिना। किसी भी विवाद भारत में स्थित सक्षम न्यायालयों के अनन्य क्षेत्राधिकार के अधीन होंगे, जब तक कि लागू उपभोक्ता-संरक्षण कानून के तहत आप पर कोई भिन्न अनिवार्य क्षेत्राधिकार लागू न हो।","h15":"15. हमसे संपर्क करें","p15":"इन Terms के बारे में प्रश्न? हमसे यहाँ संपर्क करें:","footer":"© 2026 GO PRACHI LABS. All rights reserved."},"ui":{"ui_language":"भाषा","ui_note":"यह अनुवाद आपकी सुविधा के लिए प्रदान किया गया है। किसी भी विसंगति की स्थिति में, अंग्रेज़ी संस्करण ही कानूनी रूप से आधिकारिक है।"}},"bn":{"terms":{"title":"পরিষেবার শর্তাবলী","eff":"কার্যকর তারিখ: 9 July 2026","intro":"এই পরিষেবার শর্তাবলী (\"Terms\") মোবাইল অ্যাপ্লিকেশন GPS Map Camera & Compass (\"App\") আপনার ব্যবহার নিয়ন্ত্রণ করে, যা GO PRACHI LABS (\"আমরা\", \"আমাদের\") দ্বারা প্রদান করা হয়। App ডাউনলোড, ইনস্টল, বা ব্যবহার করে, আপনি এই Terms-এর সাথে সম্মত হন। যদি আপনি সম্মত না হন, অনুগ্রহ করে App ব্যবহার করবেন না।","h1":"1. App ব্যবহারের লাইসেন্স","p1":"আমরা আপনাকে এই Terms এবং আপনি যে অ্যাপ স্টোর থেকে এটি ডাউনলোড করেছেন তার নিয়ম সাপেক্ষে, আপনার মালিকানাধীন বা নিয়ন্ত্রিত ডিভাইসে App ইনস্টল ও ব্যবহারের জন্য আপনার ব্যক্তিগত বা অভ্যন্তরীণ ব্যবসায়িক ব্যবহারের জন্য একটি ব্যক্তিগত, সীমিত, অ-এক্সক্লুসিভ, অ-হস্তান্তরযোগ্য, প্রত্যাহারযোগ্য লাইসেন্স প্রদান করি।","h2":"2. আপনার বিষয়বস্তু","p2":"App দিয়ে আপনার তোলা বা তৈরি করা ছবি, ভিডিও, এবং অন্যান্য বিষয়বস্তু (\"আপনার বিষয়বস্তু\") আপনার। App অবস্থান, তারিখ/সময়, কম্পাস, এবং সম্পর্কিত তথ্য যোগ করতে আপনার ডিভাইসে আপনার বিষয়বস্তু প্রক্রিয়া করে। আপনি আপনার বিষয়বস্তুর জন্য এবং কীভাবে আপনি এটি ব্যবহার, সংরক্ষণ, ও শেয়ার করেন তার জন্য সম্পূর্ণরূপে দায়ী, এবং আপনি নিশ্চিত করেন যে এটি তোলা ও ব্যবহার করার অধিকার আপনার আছে।","h3":"3. অবস্থান ও কম্পাস নির্ভুলতা — গুরুত্বপূর্ণ","note3":"App-এর অবস্থান, স্থানাঙ্ক, ঠিকানা, উচ্চতা, কম্পাস দিক, চৌম্বকীয় বিচ্যুতি, এবং সূর্য/চাঁদ ও আবহাওয়ার তথ্য কেবল সাধারণ তথ্যগত উদ্দেশ্যে প্রদান করা হয় এবং তা ভুল, অসম্পূর্ণ, বা বিলম্বিত হতে পারে। নেভিগেশন, জরুরি, বিমান চলাচল, সামুদ্রিক, জরিপ, আইনি, নিরাপত্তা-সংকটপূর্ণ, বা জীবন-সংকটপূর্ণ উদ্দেশ্যে App-এর উপর নির্ভর করবেন না। এমন সিদ্ধান্তের জন্য সর্বদা অফিসিয়াল যন্ত্র ও উৎস ব্যবহার করুন। আপনি নিজের ঝুঁকিতে এই তথ্য ব্যবহার করেন।","h4":"4. কেনাকাটা","p4":"App ব্যবহার করা বিনামূল্যে এবং বিজ্ঞাপন দ্বারা সমর্থিত। আপনি ঐচ্ছিকভাবে একবারের \"Remove Ads / Pro\" আপগ্রেড কিনতে পারেন যা নির্দিষ্ট বৈশিষ্ট্য আনলক করে। সমস্ত কেনাকাটা Google Play দ্বারা প্রক্রিয়া ও বিল করা হয়, এবং Google Play-এর শর্তাবলী ও ফেরত নীতির অধীন। আমরা আপনার পেমেন্ট বিবরণ পাই না বা সংরক্ষণ করি না। যেহেতু এটি একবারের ডিজিটাল আনলক, কেনাকাটা সাধারণত ফেরতযোগ্য নয়, আইন বা Google Play-এর নীতি দ্বারা প্রয়োজন হলে ছাড়া। আপনি একই Google অ্যাকাউন্টে App-এর মধ্যে থেকে পূর্ববর্তী কেনাকাটা পুনরুদ্ধার করতে পারেন।","h5":"5. বিজ্ঞাপন","p5":"আপনি বিজ্ঞাপন-মুক্ত আপগ্রেড না কেনা পর্যন্ত, App তৃতীয় পক্ষ (Google AdMob সহ) দ্বারা প্রদত্ত বিজ্ঞাপন প্রদর্শন করে। আমরা বিজ্ঞাপনের বিষয়বস্তু বা তারা যে কোনো পণ্য বা পরিষেবা প্রচার করে তার জন্য দায়ী নই।","h6":"6. গ্রহণযোগ্য ব্যবহার","p6_intro":"আপনি সম্মত হন যে আপনি করবেন না:","li6_1":"App কোনো বেআইনি উদ্দেশ্যে বা কোনো প্রযোজ্য আইন বা প্রবিধানের লঙ্ঘনে ব্যবহার করা;","li6_2":"App-এর সোর্স কোড কপি, পরিবর্তন, রিভার্স-ইঞ্জিনিয়ার, ডিকম্পাইল, বা বের করার চেষ্টা করা, যে পরিমাণে এই বিধিনিষেধ আইন দ্বারা নিষিদ্ধ তা ছাড়া;","li6_3":"App বা এর সম্পর্কিত সিস্টেমে হস্তক্ষেপ, ব্যাহত, বা অননুমোদিত অ্যাক্সেস পাওয়ার চেষ্টা করা;","li6_4":"অন্যদের অধিকার লঙ্ঘন করতে বা যে বিষয়বস্তু তোলার অনুমতি আপনার নেই তা তুলতে App ব্যবহার করা; অথবা","li6_5":"App-এর কোনো মালিকানা বিজ্ঞপ্তি সরানো, অস্পষ্ট করা, বা পরিবর্তন করা।","h7":"7. মেধাস্বত্ব","p7":"App, এর সফটওয়্যার, ডিজাইন, লোগো, ও ট্রেডমার্ক সহ (কিন্তু আপনার বিষয়বস্তু ও তৃতীয়-পক্ষ উপাদান বাদে), GO PRACHI LABS-এর মালিকানাধীন এবং মেধাস্বত্ব আইন দ্বারা সুরক্ষিত। উপরে প্রদত্ত লাইসেন্স ছাড়া, কোনো অধিকার আপনাকে হস্তান্তর করা হয় না।","h8":"8. তৃতীয়-পক্ষ পরিষেবা","p8":"App Google Play Services, Google Maps, Google AdMob, Firebase, এবং Google Play Billing-এর মতো তৃতীয়-পক্ষ পরিষেবা ব্যবহার করে। সেই পরিষেবাগুলির আপনার ব্যবহার তাদের নিজস্ব শর্তাবলী ও গোপনীয়তা নীতির অধীন হতে পারে। আমরা তৃতীয়-পক্ষ পরিষেবা বা বিষয়বস্তুর জন্য দায়ী নই।","h9":"9. ওয়ারেন্টি অস্বীকৃতি","p9":"App \"যেমন আছে\" এবং \"যেমন উপলব্ধ\" ভিত্তিতে প্রদান করা হয়, কোনো ধরনের ওয়ারেন্টি ছাড়া, তা প্রকাশ্য বা অন্তর্নিহিত হোক, বাণিজ্যযোগ্যতা, নির্দিষ্ট উদ্দেশ্যে উপযুক্ততা, নির্ভুলতা, ও অ-লঙ্ঘনের অন্তর্নিহিত ওয়ারেন্টি সহ। আমরা নিশ্চয়তা দিই না যে App নিরবচ্ছিন্ন, ত্রুটিমুক্ত, নিরাপদ হবে, বা এটি প্রদত্ত কোনো তথ্য নির্ভুল বা নির্ভরযোগ্য।","h10":"10. দায়বদ্ধতার সীমা","p10":"আইন দ্বারা অনুমোদিত সর্বাধিক পরিমাণে, GO PRACHI LABS ও এর সহযোগীরা কোনো পরোক্ষ, আনুষঙ্গিক, বিশেষ, ফলস্বরূপ, বা শাস্তিমূলক ক্ষতির জন্য, বা ডেটা, মুনাফা, বা সুনামের কোনো ক্ষতির জন্য দায়ী থাকবে না, যা App-এর আপনার ব্যবহার (বা ব্যবহারে অক্ষমতা) থেকে উদ্ভূত বা সম্পর্কিত। যে পরিমাণে দায় বাদ দেওয়া যায় না, আমাদের মোট দায় দাবির আগে বারো মাসে App-এর জন্য আপনার আমাদের প্রদত্ত পরিমাণে (যদি থাকে) সীমাবদ্ধ।","h11":"11. ক্ষতিপূরণ","p11":"আপনি App-এর আপনার ব্যবহার, আপনার বিষয়বস্তু, বা এই Terms-এর আপনার লঙ্ঘন থেকে উদ্ভূত কোনো দাবি, ক্ষতি, দায়, ও ব্যয় থেকে GO PRACHI LABS-কে ক্ষতিপূরণ দিতে ও ক্ষতিহীন রাখতে সম্মত হন।","h12":"12. সমাপ্তি","p12":"আপনি যেকোনো সময় App আনইনস্টল করে এর ব্যবহার বন্ধ করতে পারেন। যদি আপনি এই Terms লঙ্ঘন করেন বা যদি আমরা App বন্ধ করি তবে আমরা App-এ আপনার অ্যাক্সেস স্থগিত বা সমাপ্ত করতে পারি। যে বিধানগুলি তাদের প্রকৃতি অনুসারে সমাপ্তির পরেও টিকে থাকা উচিত (মেধাস্বত্ব, অস্বীকৃতি, ও দায়বদ্ধতার সীমা সহ) টিকে থাকবে।","h13":"13. App ও Terms-এ পরিবর্তন","p13":"আমরা যেকোনো সময় App পরিবর্তন বা বন্ধ করতে পারি, বা এই Terms আপডেট করতে পারি। উপাদানগত পরিবর্তন এই পৃষ্ঠায় একটি সংশোধিত কার্যকর তারিখ সহ পোস্ট করা হবে। পরিবর্তন কার্যকর হওয়ার পরে App-এর আপনার ক্রমাগত ব্যবহার আপডেট করা Terms গ্রহণের গঠন করে।","h14":"14. প্রযোজ্য আইন","p14":"এই Terms ভারতের আইন দ্বারা নিয়ন্ত্রিত, আইন-দ্বন্দ্ব নীতি নির্বিশেষে। কোনো বিরোধ ভারতে অবস্থিত উপযুক্ত আদালতের একচেটিয়া এখতিয়ারের অধীন হবে, যদি না প্রযোজ্য ভোক্তা-সুরক্ষা আইনের অধীনে আপনার উপর ভিন্ন বাধ্যতামূলক এখতিয়ার প্রযোজ্য হয়।","h15":"15. আমাদের সাথে যোগাযোগ করুন","p15":"এই Terms সম্পর্কে প্রশ্ন? আমাদের সাথে যোগাযোগ করুন:","footer":"© 2026 GO PRACHI LABS. All rights reserved."},"ui":{"ui_language":"ভাষা","ui_note":"এই অনুবাদটি আপনার সুবিধার জন্য প্রদান করা হয়েছে। কোনো অসঙ্গতির ক্ষেত্রে, ইংরেজি সংস্করণটি আইনগতভাবে প্রামাণিক।"}},"te":{"terms":{"title":"సేవా నిబంధనలు","eff":"అమలు తేదీ: 9 July 2026","intro":"ఈ సేవా నిబంధనలు (\"Terms\") GO PRACHI LABS (\"మేము\", \"మా\") అందించే మొబైల్ అప్లికేషన్ GPS Map Camera & Compass (\"App\") మీ వినియోగాన్ని నియంత్రిస్తాయి. App‌ను డౌన్‌లోడ్, ఇన్‌స్టాల్, లేదా ఉపయోగించడం ద్వారా, మీరు ఈ Terms‌కు అంగీకరిస్తారు. మీరు అంగీకరించకపోతే, దయచేసి App‌ను ఉపయోగించవద్దు.","h1":"1. App ఉపయోగించడానికి లైసెన్స్","p1":"ఈ Terms మరియు మీరు దాన్ని డౌన్‌లోడ్ చేసిన యాప్ స్టోర్ నిబంధనలకు లోబడి, మీ స్వంత లేదా నియంత్రణలో ఉన్న పరికరాలలో App‌ను ఇన్‌స్టాల్ చేసి ఉపయోగించడానికి, మీ వ్యక్తిగత లేదా అంతర్గత వ్యాపార వినియోగం కోసం మేము మీకు వ్యక్తిగత, పరిమిత, ప్రత్యేకం కాని, బదిలీ చేయలేని, ఉపసంహరించదగిన లైసెన్స్‌ను మంజూరు చేస్తాము.","h2":"2. మీ కంటెంట్","p2":"App‌తో మీరు తీసిన లేదా సృష్టించిన ఫోటోలు, వీడియోలు, మరియు ఇతర కంటెంట్ (\"మీ కంటెంట్\") మీకు చెందుతాయి. App స్థానం, తేదీ/సమయం, దిక్సూచి, మరియు సంబంధిత సమాచారాన్ని జోడించడానికి మీ పరికరంలో మీ కంటెంట్‌ను ప్రాసెస్ చేస్తుంది. మీ కంటెంట్‌కు మరియు మీరు దాన్ని ఎలా ఉపయోగిస్తారు, నిల్వ చేస్తారు, మరియు భాగస్వామ్యం చేస్తారు అనే దానికి మీరు మాత్రమే బాధ్యులు, మరియు దాన్ని తీయడానికి మరియు ఉపయోగించడానికి మీకు హక్కు ఉందని మీరు నిర్ధారిస్తారు.","h3":"3. స్థానం మరియు దిక్సూచి ఖచ్చితత్వం — ముఖ్యమైనది","note3":"App యొక్క స్థానం, నిర్దేశాంకాలు, చిరునామా, ఎత్తు, దిక్సూచి దిశ, అయస్కాంత విచలనం, మరియు సూర్యుడు/చంద్రుడు మరియు వాతావరణ సమాచారం సాధారణ సమాచార ప్రయోజనాల కోసం మాత్రమే అందించబడతాయి మరియు అవి తప్పుగా, అసంపూర్ణంగా, లేదా ఆలస్యంగా ఉండవచ్చు. నావిగేషన్, అత్యవసర, విమానయాన, సముద్ర, సర్వేయింగ్, న్యాయ, భద్రత-కీలక, లేదా జీవన-కీలక ప్రయోజనాల కోసం App‌పై ఆధారపడవద్దు. అటువంటి నిర్ణయాల కోసం ఎల్లప్పుడూ అధికారిక పరికరాలు మరియు మూలాలను ఉపయోగించండి. మీరు ఈ సమాచారాన్ని మీ స్వంత రిస్క్‌పై ఉపయోగిస్తారు.","h4":"4. కొనుగోళ్లు","p4":"App ఉపయోగించడానికి ఉచితం మరియు ప్రకటనల ద్వారా మద్దతు ఇవ్వబడుతుంది. మీరు ఐచ్ఛికంగా కొన్ని లక్షణాలను అన్‌లాక్ చేసే ఒక-సారి \"Remove Ads / Pro\" అప్‌గ్రేడ్‌ను కొనుగోలు చేయవచ్చు. అన్ని కొనుగోళ్లు Google Play ద్వారా ప్రాసెస్ చేయబడతాయి మరియు బిల్ చేయబడతాయి, మరియు Google Play నిబంధనలు మరియు రీఫండ్ విధానానికి లోబడి ఉంటాయి. మేము మీ చెల్లింపు వివరాలను స్వీకరించము లేదా నిల్వ చేయము. ఇది ఒక-సారి డిజిటల్ అన్‌లాక్ కాబట్టి, చట్టం లేదా Google Play విధానాల ద్వారా అవసరమైన చోట తప్ప కొనుగోళ్లు సాధారణంగా రీఫండ్ చేయబడవు. మీరు అదే Google ఖాతాలో App లోపల నుండి మునుపటి కొనుగోలును పునరుద్ధరించవచ్చు.","h5":"5. ప్రకటనలు","p5":"మీరు ప్రకటన-రహిత అప్‌గ్రేడ్‌ను కొనుగోలు చేయకపోతే, App మూడవ పక్షాలు (Google AdMob సహా) అందించే ప్రకటనలను ప్రదర్శిస్తుంది. ప్రకటనల కంటెంట్‌కు లేదా అవి ప్రచారం చేసే ఏవైనా ఉత్పత్తులు లేదా సేవలకు మేము బాధ్యులం కాదు.","h6":"6. ఆమోదయోగ్యమైన వినియోగం","p6_intro":"మీరు కింది వాటిని చేయకూడదని అంగీకరిస్తారు:","li6_1":"App‌ను ఏదైనా చట్టవిరుద్ధ ప్రయోజనం కోసం లేదా ఏదైనా వర్తించే చట్టం లేదా నియంత్రణ ఉల్లంఘనలో ఉపయోగించడం;","li6_2":"App యొక్క సోర్స్ కోడ్‌ను కాపీ చేయడం, సవరించడం, రివర్స్-ఇంజనీర్ చేయడం, డీకంపైల్ చేయడం, లేదా సంగ్రహించడానికి ప్రయత్నించడం, ఈ నిబంధన చట్టం ద్వారా నిషేధించబడిన మేరకు తప్ప;","li6_3":"App లేదా దాని సంబంధిత వ్యవస్థలలో జోక్యం చేసుకోవడం, అంతరాయం కలిగించడం, లేదా అనధికారిక ప్రాప్యతను పొందడానికి ప్రయత్నించడం;","li6_4":"ఇతరుల హక్కులను ఉల్లంఘించడానికి లేదా మీకు తీయడానికి అనుమతి లేని కంటెంట్‌ను తీయడానికి App‌ను ఉపయోగించడం; లేదా","li6_5":"App‌లో ఏవైనా యాజమాన్య నోటీసులను తొలగించడం, అస్పష్టం చేయడం, లేదా మార్చడం.","h7":"7. మేధో సంపత్తి","p7":"App, దాని సాఫ్ట్‌వేర్, డిజైన్, లోగోలు, మరియు ట్రేడ్‌మార్క్‌లతో సహా (కానీ మీ కంటెంట్ మరియు మూడవ-పక్ష సామగ్రిని మినహాయించి), GO PRACHI LABS యాజమాన్యంలో ఉంది మరియు మేధో-సంపత్తి చట్టాల ద్వారా రక్షించబడింది. పైన మంజూరు చేసిన లైసెన్స్ మినహా, మీకు ఎటువంటి హక్కులు బదిలీ చేయబడవు.","h8":"8. మూడవ-పక్ష సేవలు","p8":"App Google Play Services, Google Maps, Google AdMob, Firebase, మరియు Google Play Billing వంటి మూడవ-పక్ష సేవలను ఉపయోగిస్తుంది. ఆ సేవల మీ వినియోగం వాటి స్వంత నిబంధనలు మరియు గోప్యతా విధానాలకు లోబడి ఉండవచ్చు. మేము మూడవ-పక్ష సేవలు లేదా కంటెంట్‌కు బాధ్యులం కాదు.","h9":"9. వారంటీల నిరాకరణ","p9":"App \"ఉన్నది ఉన్నట్లు\" మరియు \"అందుబాటులో ఉన్నట్లు\" ప్రాతిపదికన అందించబడుతుంది, వ్యాపారయోగ్యత, ఒక నిర్దిష్ట ప్రయోజనం కోసం సముచితత, ఖచ్చితత్వం, మరియు ఉల్లంఘన-రహితత యొక్క అంతర్లీన వారంటీలతో సహా, స్పష్టమైనవి లేదా అంతర్లీనమైనవి ఏ రకమైన వారంటీలు లేకుండా. App నిరంతరాయంగా, లోపరహితంగా, సురక్షితంగా ఉంటుందని, లేదా అది అందించే ఏదైనా సమాచారం ఖచ్చితమైనది లేదా నమ్మదగినదని మేము హామీ ఇవ్వము.","h10":"10. బాధ్యత పరిమితి","p10":"చట్టం అనుమతించిన గరిష్ట మేరకు, GO PRACHI LABS మరియు దాని అనుబంధ సంస్థలు App మీ వినియోగం (లేదా ఉపయోగించలేకపోవడం) నుండి ఉత్పన్నమయ్యే లేదా దానికి సంబంధించిన ఏదైనా పరోక్ష, యాదృచ్ఛిక, ప్రత్యేక, పర్యవసాన, లేదా శిక్షాత్మక నష్టాలకు, లేదా డేటా, లాభాలు, లేదా గుడ్‌విల్ యొక్క ఏదైనా నష్టానికి బాధ్యులు కారు. బాధ్యతను మినహాయించలేని మేరకు, మా మొత్తం బాధ్యత దావాకు ముందు పన్నెండు నెలలలో App కోసం మీరు మాకు చెల్లించిన మొత్తానికి (ఏదైనా ఉంటే) పరిమితం.","h11":"11. నష్టపరిహారం","p11":"App మీ వినియోగం, మీ కంటెంట్, లేదా ఈ Terms మీ ఉల్లంఘన నుండి ఉత్పన్నమయ్యే ఏవైనా దావాలు, నష్టాలు, బాధ్యతలు, మరియు ఖర్చుల నుండి GO PRACHI LABS‌ను నష్టపరిహారం చేయడానికి మరియు హానిరహితంగా ఉంచడానికి మీరు అంగీకరిస్తారు.","h12":"12. రద్దు","p12":"మీరు ఎప్పుడైనా App‌ను అన్‌ఇన్‌స్టాల్ చేయడం ద్వారా దాన్ని ఉపయోగించడం ఆపవచ్చు. మీరు ఈ Terms‌ను ఉల్లంఘిస్తే లేదా మేము App‌ను నిలిపివేస్తే App‌కు మీ ప్రాప్యతను మేము నిలిపివేయవచ్చు లేదా రద్దు చేయవచ్చు. వాటి స్వభావం ప్రకారం రద్దు తర్వాత కూడా కొనసాగవలసిన నిబంధనలు (మేధో సంపత్తి, నిరాకరణలు, మరియు బాధ్యత పరిమితితో సహా) కొనసాగుతాయి.","h13":"13. App మరియు Terms‌లో మార్పులు","p13":"మేము ఎప్పుడైనా App‌ను సవరించవచ్చు లేదా నిలిపివేయవచ్చు, లేదా ఈ Terms‌ను నవీకరించవచ్చు. ముఖ్యమైన మార్పులు సవరించిన అమలు తేదీతో ఈ పేజీలో పోస్ట్ చేయబడతాయి. మార్పులు అమలులోకి వచ్చిన తర్వాత App మీ కొనసాగింపు వినియోగం నవీకరించిన Terms అంగీకారాన్ని కలిగి ఉంటుంది.","h14":"14. పాలక చట్టం","p14":"ఈ Terms భారతదేశ చట్టాల ద్వారా నిర్వహించబడతాయి, చట్ట-వైరుధ్య సూత్రాలతో సంబంధం లేకుండా. వర్తించే వినియోగదారు-రక్షణ చట్టం కింద మీకు వేరే తప్పనిసరి అధికార పరిధి వర్తించకపోతే, ఏవైనా వివాదాలు భారతదేశంలో ఉన్న సమర్థ న్యాయస్థానాల ప్రత్యేక అధికార పరిధికి లోబడి ఉంటాయి.","h15":"15. మమ్మల్ని సంప్రదించండి","p15":"ఈ Terms గురించి ప్రశ్నలా? మమ్మల్ని ఇక్కడ సంప్రదించండి:","footer":"© 2026 GO PRACHI LABS. All rights reserved."},"ui":{"ui_language":"భాష","ui_note":"ఈ అనువాదం మీ సౌలభ్యం కోసం అందించబడింది. ఏదైనా వ్యత్యాసం ఉన్న సందర్భంలో, ఆంగ్ల వెర్షన్ చట్టపరంగా అధికారికమైనది."}},"mr":{"terms":{"title":"सेवा अटी","eff":"प्रभावी तारीख: 9 July 2026","intro":"या सेवा अटी (\"Terms\") GO PRACHI LABS (\"आम्ही\", \"आमचे\") द्वारे प्रदान केलेल्या मोबाइल अ‍ॅप्लिकेशन GPS Map Camera & Compass (\"App\") च्या तुमच्या वापरावर नियंत्रण ठेवतात. App डाउनलोड, इन्स्टॉल, किंवा वापरून, तुम्ही या Terms शी सहमत होता. तुम्ही सहमत नसल्यास, कृपया App वापरू नका.","h1":"1. App वापरण्याचा परवाना","p1":"आम्ही तुम्हाला या Terms आणि तुम्ही जिथून ते डाउनलोड केले त्या अ‍ॅप स्टोअरच्या नियमांच्या अधीन राहून, तुमच्या मालकीच्या किंवा नियंत्रणातील डिव्हाइसवर App इन्स्टॉल आणि वापरण्यासाठी, तुमच्या वैयक्तिक किंवा अंतर्गत व्यावसायिक वापरासाठी वैयक्तिक, मर्यादित, गैर-अनन्य, गैर-हस्तांतरणीय, रद्द करण्यायोग्य परवाना देतो.","h2":"2. तुमची सामग्री","p2":"App सह तुम्ही कॅप्चर केलेले किंवा तयार केलेले फोटो, व्हिडिओ, आणि इतर सामग्री (\"तुमची सामग्री\") तुमच्या मालकीची आहे. App स्थान, तारीख/वेळ, होकायंत्र, आणि संबंधित माहिती जोडण्यासाठी तुमच्या डिव्हाइसवर तुमची सामग्री प्रक्रिया करते. तुमच्या सामग्रीसाठी आणि तुम्ही ती कशी वापरता, संग्रहित करता, आणि सामायिक करता यासाठी तुम्ही एकटेच जबाबदार आहात, आणि ती कॅप्चर करण्याचा आणि वापरण्याचा तुम्हाला हक्क आहे याची तुम्ही पुष्टी करता.","h3":"3. स्थान आणि होकायंत्र अचूकता — महत्त्वाचे","note3":"App चे स्थान, निर्देशांक, पत्ता, उंची, होकायंत्र दिशा, चुंबकीय विचलन, आणि सूर्य/चंद्र आणि हवामान माहिती केवळ सामान्य माहितीच्या उद्देशाने प्रदान केली जाते आणि ती चुकीची, अपूर्ण, किंवा विलंबित असू शकते. नेव्हिगेशन, आणीबाणी, विमानचालन, सागरी, सर्वेक्षण, कायदेशीर, सुरक्षा-गंभीर, किंवा जीवन-गंभीर उद्देशांसाठी App वर अवलंबून राहू नका. अशा निर्णयांसाठी नेहमी अधिकृत साधने आणि स्रोत वापरा. तुम्ही ही माहिती तुमच्या स्वतःच्या जोखमीवर वापरता.","h4":"4. खरेदी","p4":"App वापरण्यास मोफत आहे आणि जाहिरातींद्वारे समर्थित आहे. तुम्ही पर्यायाने काही वैशिष्ट्ये अनलॉक करणारे एक-वेळचे \"Remove Ads / Pro\" अपग्रेड खरेदी करू शकता. सर्व खरेदी Google Play द्वारे प्रक्रिया आणि बिल केली जातात, आणि Google Play च्या अटी आणि परतावा धोरणाच्या अधीन आहेत. आम्ही तुमचे पेमेंट तपशील प्राप्त किंवा संग्रहित करत नाही. हे एक-वेळचे डिजिटल अनलॉक असल्यामुळे, कायद्याने किंवा Google Play च्या धोरणांनुसार आवश्यक असेल तेथे वगळता खरेदी सामान्यतः परतावा न मिळणारी असते. तुम्ही त्याच Google खात्यावर App मधून मागील खरेदी पुनर्संचयित करू शकता.","h5":"5. जाहिराती","p5":"तुम्ही जाहिरात-मुक्त अपग्रेड खरेदी करत नाही तोपर्यंत, App तृतीय पक्षांद्वारे (Google AdMob सह) प्रदान केलेल्या जाहिराती प्रदर्शित करते. आम्ही जाहिरातींच्या सामग्रीसाठी किंवा त्या प्रचारित करत असलेल्या कोणत्याही उत्पादनांसाठी किंवा सेवांसाठी जबाबदार नाही.","h6":"6. स्वीकार्य वापर","p6_intro":"तुम्ही खालील गोष्टी न करण्यास सहमत होता:","li6_1":"App चा कोणत्याही बेकायदेशीर हेतूसाठी किंवा कोणत्याही लागू कायद्याच्या किंवा नियमनाच्या उल्लंघनात वापर करणे;","li6_2":"App चा स्रोत कोड कॉपी करणे, सुधारित करणे, रिव्हर्स-इंजिनिअर करणे, डीकंपाइल करणे, किंवा काढण्याचा प्रयत्न करणे, हे निर्बंध कायद्याने प्रतिबंधित असेल त्या मर्यादेपर्यंत वगळता;","li6_3":"App किंवा त्याच्या संबंधित प्रणालींमध्ये हस्तक्षेप करणे, व्यत्यय आणणे, किंवा अनधिकृत प्रवेश मिळवण्याचा प्रयत्न करणे;","li6_4":"इतरांच्या हक्कांचे उल्लंघन करण्यासाठी किंवा कॅप्चर करण्याची तुम्हाला परवानगी नसलेली सामग्री कॅप्चर करण्यासाठी App चा वापर करणे; किंवा","li6_5":"App मधील कोणत्याही मालकी सूचना काढून टाकणे, अस्पष्ट करणे, किंवा बदलणे.","h7":"7. बौद्धिक संपदा","p7":"App, त्याचे सॉफ्टवेअर, डिझाइन, लोगो, आणि ट्रेडमार्कसह (परंतु तुमची सामग्री आणि तृतीय-पक्ष साहित्य वगळून), GO PRACHI LABS च्या मालकीचे आहे आणि बौद्धिक-संपदा कायद्यांद्वारे संरक्षित आहे. वर दिलेल्या परवान्याव्यतिरिक्त, तुम्हाला कोणतेही हक्क हस्तांतरित केले जात नाहीत.","h8":"8. तृतीय-पक्ष सेवा","p8":"App Google Play Services, Google Maps, Google AdMob, Firebase, आणि Google Play Billing सारख्या तृतीय-पक्ष सेवा वापरते. त्या सेवांचा तुमचा वापर त्यांच्या स्वतःच्या अटी आणि गोपनीयता धोरणांच्या अधीन असू शकतो. आम्ही तृतीय-पक्ष सेवा किंवा सामग्रीसाठी जबाबदार नाही.","h9":"9. हमींचा अस्वीकार","p9":"App \"जसे आहे तसे\" आणि \"जसे उपलब्ध आहे\" आधारावर प्रदान केले जाते, कोणत्याही प्रकारच्या हमीशिवाय, मग ती स्पष्ट असो किंवा निहित, व्यापारक्षमता, विशिष्ट हेतूसाठी योग्यता, अचूकता, आणि गैर-उल्लंघन यांच्या निहित हमींसह. App अखंडित, त्रुटी-मुक्त, सुरक्षित असेल, किंवा ते प्रदान करत असलेली कोणतीही माहिती अचूक किंवा विश्वासार्ह आहे याची आम्ही हमी देत नाही.","h10":"10. दायित्वाची मर्यादा","p10":"कायद्याने परवानगी असलेल्या कमाल मर्यादेपर्यंत, GO PRACHI LABS आणि त्याचे सहयोगी App च्या तुमच्या वापरातून (किंवा वापर करण्यास असमर्थतेतून) उद्भवणाऱ्या किंवा संबंधित कोणत्याही अप्रत्यक्ष, आनुषंगिक, विशेष, परिणामी, किंवा दंडात्मक नुकसानीसाठी, किंवा डेटा, नफा, किंवा सद्भावनेच्या कोणत्याही नुकसानीसाठी जबाबदार राहणार नाहीत. दायित्व वगळता येत नाही त्या मर्यादेपर्यंत, आमचे एकूण दायित्व दाव्याच्या आधीच्या बारा महिन्यांत App साठी तुम्ही आम्हाला दिलेल्या रकमेपर्यंत (जर असेल तर) मर्यादित आहे.","h11":"11. नुकसानभरपाई","p11":"App च्या तुमच्या वापरातून, तुमच्या सामग्रीतून, किंवा या Terms च्या तुमच्या उल्लंघनातून उद्भवणाऱ्या कोणत्याही दाव्यांपासून, नुकसानीपासून, दायित्वांपासून, आणि खर्चांपासून GO PRACHI LABS ला नुकसानभरपाई देण्यास आणि निर्दोष ठेवण्यास तुम्ही सहमत होता.","h12":"12. समाप्ती","p12":"तुम्ही कधीही App अनइन्स्टॉल करून त्याचा वापर थांबवू शकता. तुम्ही या Terms चे उल्लंघन केल्यास किंवा आम्ही App बंद केल्यास आम्ही App मधील तुमचा प्रवेश निलंबित किंवा समाप्त करू शकतो. ज्या तरतुदी त्यांच्या स्वभावानुसार समाप्तीनंतरही टिकल्या पाहिजेत (बौद्धिक संपदा, अस्वीकार, आणि दायित्वाची मर्यादा यांसह) त्या टिकतील.","h13":"13. App आणि Terms मधील बदल","p13":"आम्ही कधीही App सुधारित किंवा बंद करू शकतो, किंवा या Terms अद्यतनित करू शकतो. भौतिक बदल सुधारित प्रभावी तारखेसह या पृष्ठावर पोस्ट केले जातील. बदल प्रभावी झाल्यानंतर App चा तुमचा सतत वापर अद्यतनित Terms च्या स्वीकृतीचे गठन करतो.","h14":"14. शासकीय कायदा","p14":"या Terms भारताच्या कायद्यांद्वारे शासित आहेत, कायदा-संघर्ष तत्त्वांचा विचार न करता. लागू ग्राहक-संरक्षण कायद्यांतर्गत तुमच्यावर वेगळे अनिवार्य अधिकारक्षेत्र लागू होत नसल्यास, कोणतेही विवाद भारतात असलेल्या सक्षम न्यायालयांच्या अनन्य अधिकारक्षेत्राच्या अधीन असतील.","h15":"15. आमच्याशी संपर्क साधा","p15":"या Terms बद्दल प्रश्न? आमच्याशी येथे संपर्क साधा:","footer":"© 2026 GO PRACHI LABS. All rights reserved."},"ui":{"ui_language":"भाषा","ui_note":"हे भाषांतर तुमच्या सोयीसाठी प्रदान केले आहे. कोणत्याही विसंगतीच्या बाबतीत, इंग्रजी आवृत्ती कायदेशीरदृष्ट्या अधिकृत आहे."}},"ta":{"terms":{"title":"சேவை விதிமுறைகள்","eff":"அமலுக்கு வரும் தேதி: 9 July 2026","intro":"இந்த சேவை விதிமுறைகள் (\"Terms\") GO PRACHI LABS (\"நாங்கள்\", \"எங்கள்\") வழங்கும் மொபைல் பயன்பாடு GPS Map Camera & Compass (\"App\") இன் உங்கள் பயன்பாட்டை நிர்வகிக்கின்றன. App ஐப் பதிவிறக்கம், நிறுவல், அல்லது பயன்படுத்துவதன் மூலம், நீங்கள் இந்த Terms க்கு ஒப்புக்கொள்கிறீர்கள். நீங்கள் ஒப்புக்கொள்ளவில்லை என்றால், தயவுசெய்து App ஐப் பயன்படுத்த வேண்டாம்.","h1":"1. App ஐப் பயன்படுத்துவதற்கான உரிமம்","p1":"இந்த Terms மற்றும் நீங்கள் அதைப் பதிவிறக்கிய பயன்பாட்டு கடையின் விதிகளுக்கு உட்பட்டு, உங்கள் சொந்த அல்லது கட்டுப்பாட்டில் உள்ள சாதனங்களில் App ஐ நிறுவி பயன்படுத்த, உங்கள் தனிப்பட்ட அல்லது உள் வணிகப் பயன்பாட்டிற்காக, நாங்கள் உங்களுக்கு தனிப்பட்ட, வரையறுக்கப்பட்ட, தனிச்சிறப்பற்ற, மாற்றத்தக்கதல்லாத, ரத்து செய்யக்கூடிய உரிமத்தை வழங்குகிறோம்.","h2":"2. உங்கள் உள்ளடக்கம்","p2":"App உடன் நீங்கள் படம்பிடிக்கும் அல்லது உருவாக்கும் புகைப்படங்கள், வீடியோக்கள், மற்றும் பிற உள்ளடக்கம் (\"உங்கள் உள்ளடக்கம்\") உங்களுக்குச் சொந்தமானது. App இருப்பிடம், தேதி/நேரம், திசைகாட்டி, மற்றும் தொடர்புடைய தகவலைச் சேர்க்க உங்கள் சாதனத்தில் உங்கள் உள்ளடக்கத்தைச் செயலாக்குகிறது. உங்கள் உள்ளடக்கத்திற்கும், நீங்கள் அதை எவ்வாறு பயன்படுத்துகிறீர்கள், சேமிக்கிறீர்கள், மற்றும் பகிர்கிறீர்கள் என்பதற்கும் நீங்கள் மட்டுமே பொறுப்பு, மேலும் அதைப் படம்பிடிக்கவும் பயன்படுத்தவும் உங்களுக்கு உரிமை உள்ளது என்பதை நீங்கள் உறுதிப்படுத்துகிறீர்கள்.","h3":"3. இருப்பிடம் மற்றும் திசைகாட்டி துல்லியம் — முக்கியம்","note3":"App இன் இருப்பிடம், ஆயங்கள், முகவரி, உயரம், திசைகாட்டி திசை, காந்த விலகல், மற்றும் சூரியன்/சந்திரன் மற்றும் வானிலைத் தகவல் பொது தகவல் நோக்கங்களுக்காக மட்டுமே வழங்கப்படுகின்றன, மேலும் அவை தவறானதாக, முழுமையற்றதாக, அல்லது தாமதமானதாக இருக்கலாம். வழிசெலுத்தல், அவசர, விமானப் போக்குவரத்து, கடல்சார், நில அளவீடு, சட்ட, பாதுகாப்பு-முக்கியமான, அல்லது உயிர்-முக்கியமான நோக்கங்களுக்கு App ஐ நம்ப வேண்டாம். அத்தகைய முடிவுகளுக்கு எப்போதும் அதிகாரப்பூர்வ கருவிகள் மற்றும் ஆதாரங்களைப் பயன்படுத்தவும். இந்தத் தகவலை உங்கள் சொந்த ஆபத்தில் நீங்கள் பயன்படுத்துகிறீர்கள்.","h4":"4. கொள்முதல்கள்","p4":"App பயன்படுத்த இலவசம் மற்றும் விளம்பரங்களால் ஆதரிக்கப்படுகிறது. சில அம்சங்களைத் திறக்கும் ஒரு-முறை \"Remove Ads / Pro\" மேம்படுத்தலை நீங்கள் விருப்பமாக வாங்கலாம். அனைத்து கொள்முதல்களும் Google Play ஆல் செயலாக்கப்பட்டு பில் செய்யப்படுகின்றன, மேலும் Google Play இன் விதிமுறைகள் மற்றும் பணத்திரும்பக் கொள்கைக்கு உட்பட்டவை. உங்கள் கட்டண விவரங்களை நாங்கள் பெறுவதில்லை அல்லது சேமிப்பதில்லை. இது ஒரு-முறை டிஜிட்டல் திறப்பு என்பதால், சட்டத்தால் அல்லது Google Play இன் கொள்கைகளால் தேவைப்படும் இடங்களைத் தவிர கொள்முதல்கள் பொதுவாக பணத்திரும்பப் பெற முடியாதவை. அதே Google கணக்கில் App இனுள்ளிருந்து முந்தைய கொள்முதலை நீங்கள் மீட்டமைக்கலாம்.","h5":"5. விளம்பரங்கள்","p5":"நீங்கள் விளம்பர-இல்லா மேம்படுத்தலை வாங்காத வரை, App மூன்றாம் தரப்பினரால் (Google AdMob உட்பட) வழங்கப்படும் விளம்பரங்களைக் காட்டுகிறது. விளம்பரங்களின் உள்ளடக்கத்திற்கு அல்லது அவை விளம்பரப்படுத்தும் எந்தவொரு தயாரிப்புகள் அல்லது சேவைகளுக்கும் நாங்கள் பொறுப்பல்ல.","h6":"6. ஏற்றுக்கொள்ளக்கூடிய பயன்பாடு","p6_intro":"நீங்கள் பின்வருவனவற்றைச் செய்யக்கூடாது என்று ஒப்புக்கொள்கிறீர்கள்:","li6_1":"App ஐ எந்தவொரு சட்டவிரோத நோக்கத்திற்காகவோ அல்லது பொருந்தக்கூடிய எந்தச் சட்டம் அல்லது ஒழுங்குமுறையை மீறியோ பயன்படுத்துதல்;","li6_2":"App இன் மூலக் குறியீட்டை நகலெடுத்தல், மாற்றுதல், தலைகீழ்-பொறியியல் செய்தல், டிகம்பைல் செய்தல், அல்லது பிரித்தெடுக்க முயற்சித்தல், இந்தக் கட்டுப்பாடு சட்டத்தால் தடைசெய்யப்பட்ட அளவிற்குத் தவிர;","li6_3":"App அல்லது அதன் தொடர்புடைய அமைப்புகளில் தலையிடுதல், சீர்குலைத்தல், அல்லது அங்கீகரிக்கப்படாத அணுகலைப் பெற முயற்சித்தல்;","li6_4":"மற்றவர்களின் உரிமைகளை மீறுவதற்கு அல்லது நீங்கள் படம்பிடிக்க அனுமதிக்கப்படாத உள்ளடக்கத்தைப் படம்பிடிக்க App ஐப் பயன்படுத்துதல்; அல்லது","li6_5":"App இல் உள்ள எந்தவொரு உரிமையுடைய அறிவிப்புகளையும் அகற்றுதல், மறைத்தல், அல்லது மாற்றுதல்.","h7":"7. அறிவுசார் சொத்து","p7":"App, அதன் மென்பொருள், வடிவமைப்பு, லோகோக்கள், மற்றும் வர்த்தக முத்திரைகள் உட்பட (ஆனால் உங்கள் உள்ளடக்கம் மற்றும் மூன்றாம் தரப்பு பொருட்களைத் தவிர்த்து), GO PRACHI LABS இன் உரிமையானது மற்றும் அறிவுசார்-சொத்துச் சட்டங்களால் பாதுகாக்கப்படுகிறது. மேலே வழங்கப்பட்ட உரிமத்தைத் தவிர, எந்த உரிமைகளும் உங்களுக்கு மாற்றப்படவில்லை.","h8":"8. மூன்றாம் தரப்பு சேவைகள்","p8":"App Google Play Services, Google Maps, Google AdMob, Firebase, மற்றும் Google Play Billing போன்ற மூன்றாம் தரப்பு சேவைகளைப் பயன்படுத்துகிறது. அந்த சேவைகளின் உங்கள் பயன்பாடு அவற்றின் சொந்த விதிமுறைகள் மற்றும் தனியுரிமைக் கொள்கைகளுக்கு உட்பட்டதாக இருக்கலாம். மூன்றாம் தரப்பு சேவைகள் அல்லது உள்ளடக்கத்திற்கு நாங்கள் பொறுப்பல்ல.","h9":"9. உத்தரவாதங்களின் மறுப்பு","p9":"App \"உள்ளது உள்ளபடி\" மற்றும் \"கிடைக்கும் வகையில்\" அடிப்படையில் வழங்கப்படுகிறது, வணிகத்தகுதி, ஒரு குறிப்பிட்ட நோக்கத்திற்கான பொருத்தம், துல்லியம், மற்றும் மீறாமை ஆகியவற்றின் மறைமுக உத்தரவாதங்கள் உட்பட, வெளிப்படையானதோ அல்லது மறைமுகமானதோ எந்தவிதமான உத்தரவாதங்களும் இல்லாமல். App தடையின்றி, பிழையின்றி, பாதுகாப்பாக இருக்கும் என்றோ, அல்லது அது வழங்கும் எந்தத் தகவலும் துல்லியமானது அல்லது நம்பகமானது என்றோ நாங்கள் உத்தரவாதம் அளிக்கவில்லை.","h10":"10. பொறுப்பின் வரம்பு","p10":"சட்டத்தால் அனுமதிக்கப்பட்ட அதிகபட்ச அளவிற்கு, GO PRACHI LABS மற்றும் அதன் துணை நிறுவனங்கள் App இன் உங்கள் பயன்பாட்டிலிருந்து (அல்லது பயன்படுத்த இயலாமையிலிருந்து) எழும் அல்லது தொடர்புடைய எந்தவொரு மறைமுக, தற்செயலான, சிறப்பு, விளைவான, அல்லது தண்டனைக்குரிய சேதங்களுக்கும், அல்லது தரவு, லாபம், அல்லது நல்லெண்ணத்தின் எந்த இழப்பிற்கும் பொறுப்பாகாது. பொறுப்பை விலக்க முடியாத அளவிற்கு, எங்கள் மொத்த பொறுப்பு உரிமைகோரலுக்கு முந்தைய பன்னிரண்டு மாதங்களில் App க்காக நீங்கள் எங்களுக்குச் செலுத்திய தொகைக்கு (ஏதேனும் இருந்தால்) வரம்பிடப்பட்டுள்ளது.","h11":"11. இழப்பீடு","p11":"App இன் உங்கள் பயன்பாடு, உங்கள் உள்ளடக்கம், அல்லது இந்த Terms இன் உங்கள் மீறல் ஆகியவற்றிலிருந்து எழும் எந்தவொரு உரிமைகோரல்கள், சேதங்கள், பொறுப்புகள், மற்றும் செலவுகளிலிருந்து GO PRACHI LABS ஐ இழப்பீடு செய்யவும் பாதிப்பில்லாமல் வைத்திருக்கவும் நீங்கள் ஒப்புக்கொள்கிறீர்கள்.","h12":"12. முடிவுறுத்தல்","p12":"நீங்கள் எந்த நேரத்திலும் App ஐ நிறுவல் நீக்குவதன் மூலம் அதன் பயன்பாட்டை நிறுத்தலாம். நீங்கள் இந்த Terms ஐ மீறினால் அல்லது நாங்கள் App ஐ நிறுத்தினால் App க்கான உங்கள் அணுகலை நாங்கள் இடைநிறுத்தலாம் அல்லது முடிவுறுத்தலாம். அவற்றின் தன்மையால் முடிவுறுத்தலுக்குப் பிறகும் நீடிக்க வேண்டிய விதிகள் (அறிவுசார் சொத்து, மறுப்புகள், மற்றும் பொறுப்பின் வரம்பு உட்பட) நீடிக்கும்.","h13":"13. App மற்றும் Terms இல் மாற்றங்கள்","p13":"நாங்கள் எந்த நேரத்திலும் App ஐ மாற்றலாம் அல்லது நிறுத்தலாம், அல்லது இந்த Terms ஐப் புதுப்பிக்கலாம். முக்கியமான மாற்றங்கள் திருத்தப்பட்ட அமலுக்கு வரும் தேதியுடன் இந்தப் பக்கத்தில் இடுகையிடப்படும். மாற்றங்கள் அமலுக்கு வந்த பிறகு App இன் உங்கள் தொடர்ச்சியான பயன்பாடு புதுப்பிக்கப்பட்ட Terms இன் ஏற்பை உருவாக்குகிறது.","h14":"14. ஆளும் சட்டம்","p14":"இந்த Terms இந்தியாவின் சட்டங்களால் நிர்வகிக்கப்படுகின்றன, சட்ட-முரண்பாட்டுக் கோட்பாடுகளைப் பொருட்படுத்தாமல். பொருந்தக்கூடிய நுகர்வோர்-பாதுகாப்புச் சட்டத்தின் கீழ் உங்களுக்கு வேறு கட்டாய அதிகார வரம்பு பொருந்தாவிட்டால், எந்தவொரு தகராறுகளும் இந்தியாவில் அமைந்துள்ள தகுதிவாய்ந்த நீதிமன்றங்களின் பிரத்தியேக அதிகார வரம்பிற்கு உட்பட்டதாக இருக்கும்.","h15":"15. எங்களைத் தொடர்பு கொள்ளுங்கள்","p15":"இந்த Terms பற்றிய கேள்விகளா? எங்களை இங்கே தொடர்பு கொள்ளுங்கள்:","footer":"© 2026 GO PRACHI LABS. All rights reserved."},"ui":{"ui_language":"மொழி","ui_note":"இந்த மொழிபெயர்ப்பு உங்கள் வசதிக்காக வழங்கப்படுகிறது. ஏதேனும் முரண்பாடு ஏற்பட்டால், ஆங்கிலப் பதிப்பே சட்டப்பூர்வமாக அதிகாரப்பூர்வமானது."}},"gu":{"terms":{"title":"સેવાની શરતો","eff":"અમલી તારીખ: 9 July 2026","intro":"આ સેવાની શરતો (\"Terms\") GO PRACHI LABS (\"અમે\", \"અમારું\") દ્વારા પ્રદાન કરવામાં આવેલ મોબાઇલ એપ્લિકેશન GPS Map Camera & Compass (\"App\") ના તમારા ઉપયોગને નિયંત્રિત કરે છે. App ડાઉનલોડ, ઇન્સ્ટોલ, અથવા ઉપયોગ કરીને, તમે આ Terms સાથે સંમત થાઓ છો. જો તમે સંમત ન હો, તો કૃપા કરીને App નો ઉપયોગ ન કરો.","h1":"1. App વાપરવાનું લાઇસન્સ","p1":"અમે તમને આ Terms અને તમે જ્યાંથી તેને ડાઉનલોડ કર્યું તે એપ સ્ટોરના નિયમોને આધીન, તમારી માલિકીના અથવા નિયંત્રણ હેઠળના ઉપકરણો પર App ઇન્સ્ટોલ અને ઉપયોગ કરવા માટે, તમારા વ્યક્તિગત અથવા આંતરિક વ્યવસાયિક ઉપયોગ માટે વ્યક્તિગત, મર્યાદિત, બિન-વિશિષ્ટ, બિન-તબદીલી, રદ કરી શકાય તેવું લાઇસન્સ આપીએ છીએ.","h2":"2. તમારી સામગ્રી","p2":"App સાથે તમે કેપ્ચર અથવા બનાવેલા ફોટા, વિડિયો, અને અન્ય સામગ્રી (\"તમારી સામગ્રી\") તમારી છે. App સ્થાન, તારીખ/સમય, હોકાયંત્ર, અને સંબંધિત માહિતી ઉમેરવા માટે તમારા ઉપકરણ પર તમારી સામગ્રી પ્રક્રિયા કરે છે. તમે તમારી સામગ્રી માટે અને તમે તેનો ઉપયોગ, સંગ્રહ, અને શેર કેવી રીતે કરો છો તેના માટે એકલા જવાબદાર છો, અને તમે પુષ્ટિ કરો છો કે તમને તેને કેપ્ચર અને ઉપયોગ કરવાનો અધિકાર છે.","h3":"3. સ્થાન અને હોકાયંત્રની ચોકસાઈ — મહત્વપૂર્ણ","note3":"App ની સ્થાન, કોઓર્ડિનેટ્સ, સરનામું, ઊંચાઈ, હોકાયંત્રની દિશા, ચુંબકીય વિચલન, અને સૂર્ય/ચંદ્ર અને હવામાનની માહિતી ફક્ત સામાન્ય માહિતીના હેતુઓ માટે પ્રદાન કરવામાં આવે છે અને તે ખોટી, અધૂરી, અથવા વિલંબિત હોઈ શકે છે. નેવિગેશન, કટોકટી, ઉડ્ડયન, દરિયાઈ, સર્વેક્ષણ, કાનૂની, સલામતી-જટિલ, અથવા જીવન-જટિલ હેતુઓ માટે App પર આધાર રાખશો નહીં. આવા નિર્ણયો માટે હંમેશા સત્તાવાર સાધનો અને સ્રોતોનો ઉપયોગ કરો. તમે આ માહિતીનો ઉપયોગ તમારા પોતાના જોખમે કરો છો.","h4":"4. ખરીદીઓ","p4":"App વાપરવા માટે મફત છે અને જાહેરાત દ્વારા સમર્થિત છે. તમે વૈકલ્પિક રીતે અમુક સુવિધાઓને અનલોક કરતું એક-વખતનું \"Remove Ads / Pro\" અપગ્રેડ ખરીદી શકો છો. બધી ખરીદીઓ Google Play દ્વારા પ્રક્રિયા અને બિલ કરવામાં આવે છે, અને Google Play ની શરતો અને રિફંડ નીતિને આધીન છે. અમે તમારી પેમેન્ટ વિગતો પ્રાપ્ત અથવા સંગ્રહિત કરતા નથી. કારણ કે તે એક-વખતનું ડિજિટલ અનલોક છે, કાયદા દ્વારા અથવા Google Play ની નીતિઓ દ્વારા જરૂરી હોય ત્યાં સિવાય ખરીદીઓ સામાન્ય રીતે રિફંડ યોગ્ય નથી. તમે તે જ Google એકાઉન્ટ પર App ની અંદરથી અગાઉની ખરીદી પુનઃસ્થાપિત કરી શકો છો.","h5":"5. જાહેરાતો","p5":"જ્યાં સુધી તમે જાહેરાત-મુક્ત અપગ્રેડ ન ખરીદો, ત્યાં સુધી App તૃતીય પક્ષો (Google AdMob સહિત) દ્વારા પ્રદાન કરવામાં આવેલ જાહેરાતો પ્રદર્શિત કરે છે. અમે જાહેરાતોની સામગ્રી અથવા તેઓ પ્રમોટ કરતા કોઈપણ ઉત્પાદનો અથવા સેવાઓ માટે જવાબદાર નથી.","h6":"6. સ્વીકાર્ય ઉપયોગ","p6_intro":"તમે નીચે મુજબ ન કરવા સંમત થાઓ છો:","li6_1":"App નો ઉપયોગ કોઈપણ ગેરકાયદેસર હેતુ માટે અથવા કોઈપણ લાગુ કાયદા અથવા નિયમનના ઉલ્લંઘનમાં કરવો;","li6_2":"App ના સ્રોત કોડની નકલ કરવી, સંશોધિત કરવી, રિવર્સ-એન્જિનિયર કરવી, ડિકમ્પાઇલ કરવી, અથવા કાઢવાનો પ્રયાસ કરવો, આ પ્રતિબંધ કાયદા દ્વારા પ્રતિબંધિત હોય તે હદ સિવાય;","li6_3":"App અથવા તેની સંબંધિત સિસ્ટમોમાં દખલ કરવી, વિક્ષેપ પાડવો, અથવા અનધિકૃત ઍક્સેસ મેળવવાનો પ્રયાસ કરવો;","li6_4":"અન્યના અધિકારોનું ઉલ્લંઘન કરવા અથવા તમને કેપ્ચર કરવાની પરવાનગી ન હોય તેવી સામગ્રી કેપ્ચર કરવા App નો ઉપયોગ કરવો; અથવા","li6_5":"App માં કોઈપણ માલિકીની સૂચનાઓ દૂર કરવી, અસ્પષ્ટ કરવી, અથવા બદલવી.","h7":"7. બૌદ્ધિક સંપત્તિ","p7":"App, તેના સોફ્ટવેર, ડિઝાઇન, લોગો, અને ટ્રેડમાર્ક્સ સહિત (પરંતુ તમારી સામગ્રી અને તૃતીય-પક્ષ સામગ્રી સિવાય), GO PRACHI LABS ની માલિકીની છે અને બૌદ્ધિક-સંપત્તિ કાયદાઓ દ્વારા સુરક્ષિત છે. ઉપર આપેલા લાઇસન્સ સિવાય, તમને કોઈ અધિકારો તબદીલ કરવામાં આવતા નથી.","h8":"8. તૃતીય-પક્ષ સેવાઓ","p8":"App Google Play Services, Google Maps, Google AdMob, Firebase, અને Google Play Billing જેવી તૃતીય-પક્ષ સેવાઓનો ઉપયોગ કરે છે. તે સેવાઓનો તમારો ઉપયોગ તેમની પોતાની શરતો અને ગોપનીયતા નીતિઓને આધીન હોઈ શકે છે. અમે તૃતીય-પક્ષ સેવાઓ અથવા સામગ્રી માટે જવાબદાર નથી.","h9":"9. વોરંટીનો અસ્વીકાર","p9":"App \"જેમ છે તેમ\" અને \"જેમ ઉપલબ્ધ છે\" ધોરણે પ્રદાન કરવામાં આવે છે, કોઈપણ પ્રકારની વોરંટી વિના, પછી ભલે તે સ્પષ્ટ હોય કે ગર્ભિત, જેમાં વેપારક્ષમતા, ચોક્કસ હેતુ માટે યોગ્યતા, ચોકસાઈ, અને બિન-ઉલ્લંઘનની ગર્ભિત વોરંટીઓનો સમાવેશ થાય છે. અમે ખાતરી આપતા નથી કે App અવિરત, ભૂલ-મુક્ત, સુરક્ષિત હશે, અથવા તે પ્રદાન કરતી કોઈપણ માહિતી સચોટ અથવા વિશ્વસનીય છે.","h10":"10. જવાબદારીની મર્યાદા","p10":"કાયદા દ્વારા મંજૂર મહત્તમ હદ સુધી, GO PRACHI LABS અને તેના સહયોગીઓ App ના તમારા ઉપયોગ (અથવા ઉપયોગ કરવામાં અસમર્થતા) થી ઉદ્ભવતા અથવા સંબંધિત કોઈપણ પરોક્ષ, આકસ્મિક, વિશેષ, પરિણામી, અથવા શિક્ષાત્મક નુકસાન માટે, અથવા ડેટા, નફો, અથવા સદ્ભાવનાના કોઈપણ નુકસાન માટે જવાબદાર રહેશે નહીં. જ્યાં સુધી જવાબદારીને બાકાત કરી શકાતી નથી, ત્યાં સુધી અમારી કુલ જવાબદારી દાવા પહેલાંના બાર મહિનામાં App માટે તમે અમને ચૂકવેલી રકમ (જો કોઈ હોય તો) સુધી મર્યાદિત છે.","h11":"11. વળતર","p11":"તમે App ના તમારા ઉપયોગ, તમારી સામગ્રી, અથવા આ Terms ના તમારા ઉલ્લંઘનથી ઉદ્ભવતા કોઈપણ દાવાઓ, નુકસાન, જવાબદારીઓ, અને ખર્ચથી GO PRACHI LABS ને વળતર આપવા અને હાનિરહિત રાખવા સંમત થાઓ છો.","h12":"12. સમાપ્તિ","p12":"તમે કોઈપણ સમયે App અનઇન્સ્ટોલ કરીને તેનો ઉપયોગ બંધ કરી શકો છો. જો તમે આ Terms નું ઉલ્લંઘન કરો અથવા જો અમે App બંધ કરીએ તો અમે App પર તમારી ઍક્સેસ સ્થગિત અથવા સમાપ્ત કરી શકીએ છીએ. જે જોગવાઈઓ તેમના સ્વભાવ દ્વારા સમાપ્તિ પછી પણ ટકી રહેવી જોઈએ (બૌદ્ધિક સંપત્તિ, અસ્વીકાર, અને જવાબદારીની મર્યાદા સહિત) તે ટકી રહેશે.","h13":"13. App અને Terms માં ફેરફારો","p13":"અમે કોઈપણ સમયે App સંશોધિત અથવા બંધ કરી શકીએ છીએ, અથવા આ Terms અપડેટ કરી શકીએ છીએ. ભૌતિક ફેરફારો સુધારેલી અમલી તારીખ સાથે આ પૃષ્ઠ પર પોસ્ટ કરવામાં આવશે. ફેરફારો અમલમાં આવ્યા પછી App નો તમારો સતત ઉપયોગ અપડેટ કરેલી Terms ની સ્વીકૃતિ ગણાય છે.","h14":"14. શાસક કાયદો","p14":"આ Terms ભારતના કાયદાઓ દ્વારા સંચાલિત છે, કાયદા-સંઘર્ષના સિદ્ધાંતોને ધ્યાનમાં લીધા વિના. જ્યાં સુધી લાગુ ગ્રાહક-સુરક્ષા કાયદા હેઠળ તમારા પર અલગ ફરજિયાત અધિકારક્ષેત્ર લાગુ ન થાય, ત્યાં સુધી કોઈપણ વિવાદો ભારતમાં સ્થિત સક્ષમ અદાલતોના વિશિષ્ટ અધિકારક્ષેત્રને આધીન રહેશે.","h15":"15. અમારો સંપર્ક કરો","p15":"આ Terms વિશે પ્રશ્નો? અમારો અહીં સંપર્ક કરો:","footer":"© 2026 GO PRACHI LABS. All rights reserved."},"ui":{"ui_language":"ભાષા","ui_note":"આ અનુવાદ તમારી સુવિધા માટે પ્રદાન કરવામાં આવ્યો છે. કોઈપણ વિસંગતતાના કિસ્સામાં, અંગ્રેજી સંસ્કરણ કાયદેસર રીતે અધિકૃત છે."}},"ur":{"terms":{"title":"سروس کی شرائط","eff":"نافذ العمل تاریخ: 9 July 2026","intro":"یہ سروس کی شرائط (\"Terms\") GO PRACHI LABS (\"ہم\"، \"ہمارا\") کی فراہم کردہ موبائل ایپلیکیشن GPS Map Camera & Compass (\"App\") کے آپ کے استعمال کو کنٹرول کرتی ہیں۔ App ڈاؤن لوڈ، انسٹال، یا استعمال کر کے، آپ ان Terms سے اتفاق کرتے ہیں۔ اگر آپ متفق نہیں ہیں، تو براہ کرم App استعمال نہ کریں۔","h1":"1. App استعمال کرنے کا لائسنس","p1":"ہم آپ کو ان Terms اور جس ایپ اسٹور سے آپ نے اسے ڈاؤن لوڈ کیا اس کے قواعد کے تابع، آپ کی ملکیت یا کنٹرول والے آلات پر App انسٹال اور استعمال کرنے کے لیے، آپ کے ذاتی یا داخلی کاروباری استعمال کے لیے ایک ذاتی، محدود، غیر خصوصی، ناقابل منتقلی، قابل تنسیخ لائسنس دیتے ہیں۔","h2":"2. آپ کا مواد","p2":"App کے ساتھ آپ کی کیپچر یا تخلیق کردہ تصاویر، ویڈیوز، اور دیگر مواد (\"آپ کا مواد\") آپ کا ہے۔ App مقام، تاریخ/وقت، قطب نما، اور متعلقہ معلومات شامل کرنے کے لیے آپ کے آلے پر آپ کا مواد پروسیس کرتی ہے۔ آپ اپنے مواد کے لیے اور آپ اسے کیسے استعمال، محفوظ، اور شیئر کرتے ہیں اس کے لیے مکمل طور پر ذمہ دار ہیں، اور آپ تصدیق کرتے ہیں کہ آپ کو اسے کیپچر اور استعمال کرنے کا حق حاصل ہے۔","h3":"3. مقام اور قطب نما کی درستگی — اہم","note3":"App کی مقام، کوآرڈینیٹس، پتہ، بلندی، قطب نما کی سمت، مقناطیسی انحراف، اور سورج/چاند اور موسم کی معلومات صرف عمومی معلوماتی مقاصد کے لیے فراہم کی جاتی ہیں اور یہ غلط، نامکمل، یا تاخیر شدہ ہو سکتی ہیں۔ نیویگیشن، ہنگامی، ہوابازی، سمندری، سروے، قانونی، تحفظ کے لحاظ سے اہم، یا زندگی کے لحاظ سے اہم مقاصد کے لیے App پر انحصار نہ کریں۔ ایسے فیصلوں کے لیے ہمیشہ سرکاری آلات اور ذرائع استعمال کریں۔ آپ یہ معلومات اپنے خطرے پر استعمال کرتے ہیں۔","h4":"4. خریداریاں","p4":"App استعمال کے لیے مفت ہے اور اشتہارات سے معاون ہے۔ آپ اختیاری طور پر ایک بار کا \"Remove Ads / Pro\" اپ گریڈ خرید سکتے ہیں جو بعض خصوصیات کھولتا ہے۔ تمام خریداریاں Google Play کے ذریعے پروسیس اور بل کی جاتی ہیں، اور Google Play کی شرائط اور رقم کی واپسی کی پالیسی کے تابع ہیں۔ ہم آپ کی ادائیگی کی تفصیلات موصول یا محفوظ نہیں کرتے۔ چونکہ یہ ایک بار کا ڈیجیٹل انلاک ہے، خریداریاں عام طور پر ناقابل واپسی ہیں سوائے جہاں قانون یا Google Play کی پالیسیوں کے ذریعے ضروری ہو۔ آپ اسی Google اکاؤنٹ پر App کے اندر سے پچھلی خریداری بحال کر سکتے ہیں۔","h5":"5. اشتہارات","p5":"جب تک آپ اشتہار سے پاک اپ گریڈ نہ خریدیں، App فریق ثالث (بشمول Google AdMob) کی فراہم کردہ اشتہارات دکھاتی ہے۔ ہم اشتہارات کے مواد یا ان کی پیش کردہ کسی بھی مصنوعات یا خدمات کے لیے ذمہ دار نہیں ہیں۔","h6":"6. قابل قبول استعمال","p6_intro":"آپ اتفاق کرتے ہیں کہ آپ یہ نہیں کریں گے:","li6_1":"App کو کسی غیر قانونی مقصد کے لیے یا کسی قابل اطلاق قانون یا ضابطے کی خلاف ورزی میں استعمال کرنا؛","li6_2":"App کے سورس کوڈ کو کاپی کرنا، ترمیم کرنا، ریورس انجینیئر کرنا، ڈی کمپائل کرنا، یا نکالنے کی کوشش کرنا، سوائے اس حد تک جہاں یہ پابندی قانون کے ذریعے ممنوع ہو؛","li6_3":"App یا اس کے متعلقہ نظاموں میں مداخلت کرنا، خلل ڈالنا، یا غیر مجاز رسائی حاصل کرنے کی کوشش کرنا؛","li6_4":"دوسروں کے حقوق کی خلاف ورزی کرنے یا ایسا مواد کیپچر کرنے کے لیے App استعمال کرنا جسے کیپچر کرنے کی آپ کو اجازت نہیں؛ یا","li6_5":"App میں کسی بھی ملکیتی اطلاعات کو ہٹانا، مبہم کرنا، یا تبدیل کرنا۔","h7":"7. دانشورانہ املاک","p7":"App، بشمول اس کا سافٹ ویئر، ڈیزائن، لوگو، اور ٹریڈ مارکس (لیکن آپ کے مواد اور فریق ثالث کے مواد کو چھوڑ کر)، GO PRACHI LABS کی ملکیت ہے اور دانشورانہ املاک کے قوانین کے ذریعے محفوظ ہے۔ اوپر دیے گئے لائسنس کے علاوہ، آپ کو کوئی حقوق منتقل نہیں کیے جاتے۔","h8":"8. فریق ثالث کی خدمات","p8":"App فریق ثالث کی خدمات جیسے Google Play Services، Google Maps، Google AdMob، Firebase، اور Google Play Billing استعمال کرتی ہے۔ ان خدمات کا آپ کا استعمال ان کی اپنی شرائط اور پرائیویسی پالیسیوں کے تابع ہو سکتا ہے۔ ہم فریق ثالث کی خدمات یا مواد کے لیے ذمہ دار نہیں ہیں۔","h9":"9. وارنٹیوں کا انکار","p9":"App \"جیسا ہے\" اور \"جیسا دستیاب ہے\" کی بنیاد پر فراہم کی جاتی ہے، کسی بھی قسم کی وارنٹی کے بغیر، خواہ صریح ہو یا ضمنی، بشمول تجارتی اہلیت، کسی خاص مقصد کے لیے موزونیت، درستگی، اور عدم خلاف ورزی کی ضمنی وارنٹیاں۔ ہم ضمانت نہیں دیتے کہ App بلا تعطل، خرابی سے پاک، محفوظ ہوگی، یا یہ کہ اس کی فراہم کردہ کوئی بھی معلومات درست یا قابل اعتماد ہے۔","h10":"10. ذمہ داری کی حد","p10":"قانون کی اجازت کے مطابق زیادہ سے زیادہ حد تک، GO PRACHI LABS اور اس کے ملحقہ ادارے App کے آپ کے استعمال (یا استعمال کرنے میں ناکامی) سے پیدا ہونے والے یا متعلقہ کسی بھی بالواسطہ، حادثاتی، خصوصی، نتیجہ خیز، یا تعزیری نقصانات کے لیے، یا ڈیٹا، منافع، یا خیر سگالی کے کسی بھی نقصان کے لیے ذمہ دار نہیں ہوں گے۔ جس حد تک ذمہ داری کو خارج نہیں کیا جا سکتا، ہماری کل ذمہ داری دعوے سے پہلے بارہ مہینوں میں App کے لیے آپ کی ہمیں ادا کردہ رقم (اگر کوئی ہو) تک محدود ہے۔","h11":"11. تلافی","p11":"آپ App کے آپ کے استعمال، آپ کے مواد، یا ان Terms کی آپ کی خلاف ورزی سے پیدا ہونے والے کسی بھی دعووں، نقصانات، ذمہ داریوں، اور اخراجات سے GO PRACHI LABS کو تلافی دینے اور بے ضرر رکھنے سے اتفاق کرتے ہیں۔","h12":"12. اختتام","p12":"آپ کسی بھی وقت App کو ان انسٹال کر کے اس کا استعمال بند کر سکتے ہیں۔ اگر آپ ان Terms کی خلاف ورزی کرتے ہیں یا اگر ہم App بند کر دیتے ہیں تو ہم App تک آپ کی رسائی معطل یا ختم کر سکتے ہیں۔ وہ دفعات جو اپنی نوعیت کے لحاظ سے اختتام کے بعد بھی برقرار رہنی چاہئیں (بشمول دانشورانہ املاک، انکار، اور ذمہ داری کی حد) برقرار رہیں گی۔","h13":"13. App اور Terms میں تبدیلیاں","p13":"ہم کسی بھی وقت App میں ترمیم یا اسے بند کر سکتے ہیں، یا ان Terms کو اپ ڈیٹ کر سکتے ہیں۔ اہم تبدیلیاں نظر ثانی شدہ نافذ العمل تاریخ کے ساتھ اس صفحے پر پوسٹ کی جائیں گی۔ تبدیلیوں کے نافذ ہونے کے بعد App کا آپ کا مسلسل استعمال اپ ڈیٹ شدہ Terms کی قبولیت تصور کیا جاتا ہے۔","h14":"14. حاکم قانون","p14":"یہ Terms بھارت کے قوانین کے تحت چلتی ہیں، قانون کے تصادم کے اصولوں سے قطع نظر۔ کوئی بھی تنازعات بھارت میں واقع مجاز عدالتوں کے خصوصی دائرہ اختیار کے تابع ہوں گے، جب تک کہ قابل اطلاق صارف تحفظ قانون کے تحت آپ پر کوئی مختلف لازمی دائرہ اختیار لاگو نہ ہو۔","h15":"15. ہم سے رابطہ کریں","p15":"ان Terms کے بارے میں سوالات؟ ہم سے یہاں رابطہ کریں:","footer":"© 2026 GO PRACHI LABS. All rights reserved."},"ui":{"ui_language":"زبان","ui_note":"یہ ترجمہ آپ کی سہولت کے لیے فراہم کیا گیا ہے۔ کسی بھی تضاد کی صورت میں، انگریزی ورژن قانونی طور پر مستند ہے۔"}},"kn":{"terms":{"title":"ಸೇವಾ ನಿಯಮಗಳು","eff":"ಜಾರಿ ದಿನಾಂಕ: 9 July 2026","intro":"ಈ ಸೇವಾ ನಿಯಮಗಳು (“ನಿಯಮಗಳು”) GO PRACHI LABS (“ನಾವು”, “ನಮ್ಮ”) ಒದಗಿಸಿದ ಮೊಬೈಲ್ ಅಪ್ಲಿಕೇಶನ್ GPS Map Camera & Compass (“ಆ್ಯಪ್”) ನ ನಿಮ್ಮ ಬಳಕೆಯನ್ನು ನಿಯಂತ್ರಿಸುತ್ತವೆ. ಆ್ಯಪ್ ಡೌನ್‌ಲೋಡ್, ಸ್ಥಾಪನೆ ಅಥವಾ ಬಳಕೆ ಮಾಡುವ ಮೂಲಕ, ನೀವು ಈ ನಿಯಮಗಳಿಗೆ ಸಮ್ಮತಿಸುತ್ತೀರಿ. ನೀವು ಒಪ್ಪದಿದ್ದರೆ, ದಯವಿಟ್ಟು ಆ್ಯಪ್ ಬಳಸಬೇಡಿ.","h1":"1. ಆ್ಯಪ್ ಬಳಸಲು ಪರವಾನಗಿ","p1":"ಈ ನಿಯಮಗಳು ಮತ್ತು ನೀವು ಡೌನ್‌ಲೋಡ್ ಮಾಡಿದ ಆ್ಯಪ್ ಸ್ಟೋರ್‌ನ ನಿಯಮಗಳಿಗೆ ಒಳಪಟ್ಟು, ನಿಮ್ಮ ವೈಯಕ್ತಿಕ ಅಥವಾ ಆಂತರಿಕ ವ್ಯಾಪಾರ ಬಳಕೆಗಾಗಿ, ನೀವು ಹೊಂದಿರುವ ಅಥವಾ ನಿಯಂತ್ರಿಸುವ ಸಾಧನಗಳಲ್ಲಿ ಆ್ಯಪ್ ಅನ್ನು ಸ್ಥಾಪಿಸಲು ಮತ್ತು ಬಳಸಲು ನಾವು ನಿಮಗೆ ವೈಯಕ್ತಿಕ, ಸೀಮಿತ, ಅನನ್ಯವಲ್ಲದ, ವರ್ಗಾಯಿಸಲಾಗದ, ರದ್ದುಗೊಳಿಸಬಹುದಾದ ಪರವಾನಗಿಯನ್ನು ನೀಡುತ್ತೇವೆ.","h2":"2. ನಿಮ್ಮ ವಿಷಯ","p2":"ನೀವು ಆ್ಯಪ್‌ನೊಂದಿಗೆ ಸೆರೆಹಿಡಿದ ಅಥವಾ ರಚಿಸಿದ ಫೋಟೋಗಳು, ವೀಡಿಯೊಗಳು ಮತ್ತು ಇತರ ವಿಷಯ (“ನಿಮ್ಮ ವಿಷಯ”) ನಿಮಗೆ ಸೇರಿದೆ. ಆ್ಯಪ್ ಸ್ಥಳ, ದಿನಾಂಕ/ಸಮಯ, ಕಂಪಾಸ್ ಮತ್ತು ಸಂಬಂಧಿತ ಮಾಹಿತಿಯನ್ನು ಸೇರಿಸಲು ನಿಮ್ಮ ಸಾಧನದಲ್ಲೇ ನಿಮ್ಮ ವಿಷಯವನ್ನು ಸಂಸ್ಕರಿಸುತ್ತದೆ. ನಿಮ್ಮ ವಿಷಯಕ್ಕೆ ಮತ್ತು ಅದನ್ನು ನೀವು ಹೇಗೆ ಬಳಸುತ್ತೀರಿ, ಸಂಗ್ರಹಿಸುತ್ತೀರಿ ಮತ್ತು ಹಂಚಿಕೊಳ್ಳುತ್ತೀರಿ ಎಂಬುದಕ್ಕೆ ನೀವೇ ಸಂಪೂರ್ಣ ಜವಾಬ್ದಾರರು, ಮತ್ತು ಅದನ್ನು ಸೆರೆಹಿಡಿಯುವ ಮತ್ತು ಬಳಸುವ ಹಕ್ಕು ನಿಮಗಿದೆ ಎಂದು ನೀವು ದೃಢೀಕರಿಸುತ್ತೀರಿ.","h3":"3. ಸ್ಥಳ ಮತ್ತು ಕಂಪಾಸ್ ನಿಖರತೆ — ಮುಖ್ಯ","note3":"ಆ್ಯಪ್‌ನ ಸ್ಥಳ, ನಿರ್ದೇಶಾಂಕಗಳು, ವಿಳಾಸ, ಎತ್ತರ, ಕಂಪಾಸ್ ದಿಕ್ಕು, ಕಾಂತೀಯ ವಿಚಲನೆ, ಮತ್ತು ಸೂರ್ಯ/ಚಂದ್ರ ಹಾಗೂ ಹವಾಮಾನ ಮಾಹಿತಿಯನ್ನು ಸಾಮಾನ್ಯ ಮಾಹಿತಿ ಉದ್ದೇಶಗಳಿಗಾಗಿ ಮಾತ್ರ ಒದಗಿಸಲಾಗಿದೆ ಮತ್ತು ಅವು ತಪ್ಪಾಗಿರಬಹುದು, ಅಪೂರ್ಣವಾಗಿರಬಹುದು ಅಥವಾ ವಿಳಂಬವಾಗಿರಬಹುದು. ನ್ಯಾವಿಗೇಶನ್, ತುರ್ತು, ವಾಯುಯಾನ, ಸಾಗರ, ಸರ್ವೇಕ್ಷಣೆ, ಕಾನೂನು, ಸುರಕ್ಷತೆ-ನಿರ್ಣಾಯಕ ಅಥವಾ ಜೀವನ-ನಿರ್ಣಾಯಕ ಉದ್ದೇಶಗಳಿಗಾಗಿ ಆ್ಯಪ್ ಮೇಲೆ ಅವಲಂಬಿಸಬೇಡಿ. ಅಂತಹ ನಿರ್ಧಾರಗಳಿಗೆ ಯಾವಾಗಲೂ ಅಧಿಕೃತ ಉಪಕರಣಗಳು ಮತ್ತು ಮೂಲಗಳನ್ನು ಬಳಸಿ. ನೀವು ಈ ಮಾಹಿತಿಯನ್ನು ನಿಮ್ಮ ಸ್ವಂತ ಅಪಾಯದಲ್ಲಿ ಬಳಸುತ್ತೀರಿ.","h4":"4. ಖರೀದಿಗಳು","p4":"ಆ್ಯಪ್ ಬಳಸಲು ಉಚಿತ ಮತ್ತು ಜಾಹೀರಾತಿನಿಂದ ಬೆಂಬಲಿತವಾಗಿದೆ. ಕೆಲವು ವೈಶಿಷ್ಟ್ಯಗಳನ್ನು ಅನ್‌ಲಾಕ್ ಮಾಡುವ ಒಂದು-ಬಾರಿಯ “Remove Ads / Pro” ಅಪ್‌ಗ್ರೇಡ್ ಅನ್ನು ನೀವು ಐಚ್ಛಿಕವಾಗಿ ಖರೀದಿಸಬಹುದು. ಎಲ್ಲಾ ಖರೀದಿಗಳನ್ನು Google Play ಸಂಸ್ಕರಿಸಿ ಬಿಲ್ ಮಾಡುತ್ತದೆ, ಮತ್ತು ಅವು Google Play ನ ನಿಯಮಗಳು ಮತ್ತು ಮರುಪಾವತಿ ನೀತಿಗೆ ಒಳಪಟ್ಟಿವೆ. ನಾವು ನಿಮ್ಮ ಪಾವತಿ ವಿವರಗಳನ್ನು ಪಡೆಯುವುದಿಲ್ಲ ಅಥವಾ ಸಂಗ್ರಹಿಸುವುದಿಲ್ಲ. ಇದು ಒಂದು-ಬಾರಿಯ ಡಿಜಿಟಲ್ ಅನ್‌ಲಾಕ್ ಆಗಿರುವುದರಿಂದ, ಕಾನೂನಿನಿಂದ ಅಥವಾ Google Play ನ ನೀತಿಗಳಿಂದ ಅಗತ್ಯವಿರುವ ಹೊರತು ಖರೀದಿಗಳು ಸಾಮಾನ್ಯವಾಗಿ ಮರುಪಾವತಿಸಲಾಗುವುದಿಲ್ಲ. ನೀವು ಅದೇ Google ಖಾತೆಯಲ್ಲಿ ಆ್ಯಪ್‌ನ ಒಳಗಿನಿಂದ ಹಿಂದಿನ ಖರೀದಿಯನ್ನು ಮರುಸ್ಥಾಪಿಸಬಹುದು.","h5":"5. ಜಾಹೀರಾತುಗಳು","p5":"ನೀವು ಜಾಹೀರಾತು-ರಹಿತ ಅಪ್‌ಗ್ರೇಡ್ ಅನ್ನು ಖರೀದಿಸದ ಹೊರತು, ಆ್ಯಪ್ ಮೂರನೇ ಪಕ್ಷಗಳು (Google AdMob ಸೇರಿದಂತೆ) ಒದಗಿಸುವ ಜಾಹೀರಾತುಗಳನ್ನು ಪ್ರದರ್ಶಿಸುತ್ತದೆ. ಜಾಹೀರಾತುಗಳ ವಿಷಯಕ್ಕೆ ಅಥವಾ ಅವು ಪ್ರಚಾರ ಮಾಡುವ ಯಾವುದೇ ಉತ್ಪನ್ನಗಳು ಅಥವಾ ಸೇವೆಗಳಿಗೆ ನಾವು ಜವಾಬ್ದಾರರಲ್ಲ.","h6":"6. ಸ್ವೀಕಾರಾರ್ಹ ಬಳಕೆ","p6_intro":"ನೀವು ಈ ಕೆಳಗಿನವುಗಳನ್ನು ಮಾಡದಿರಲು ಒಪ್ಪುತ್ತೀರಿ:","li6_1":"ಯಾವುದೇ ಕಾನೂನುಬಾಹಿರ ಉದ್ದೇಶಕ್ಕಾಗಿ ಅಥವಾ ಯಾವುದೇ ಅನ್ವಯವಾಗುವ ಕಾನೂನು ಅಥವಾ ನಿಯಂತ್ರಣದ ಉಲ್ಲಂಘನೆಯಲ್ಲಿ ಆ್ಯಪ್ ಅನ್ನು ಬಳಸುವುದು;","li6_2":"ಈ ನಿರ್ಬಂಧವನ್ನು ಕಾನೂನಿನಿಂದ ನಿಷೇಧಿಸಿದ ಮಟ್ಟದ ಹೊರತು, ಆ್ಯಪ್‌ನ ಸೋರ್ಸ್ ಕೋಡ್ ಅನ್ನು ನಕಲಿಸುವುದು, ಮಾರ್ಪಡಿಸುವುದು, ರಿವರ್ಸ್-ಇಂಜಿನಿಯರ್ ಮಾಡುವುದು, ಡಿಕಂಪೈಲ್ ಮಾಡುವುದು ಅಥವಾ ಹೊರತೆಗೆಯಲು ಪ್ರಯತ್ನಿಸುವುದು;","li6_3":"ಆ್ಯಪ್ ಅಥವಾ ಅದರ ಸಂಬಂಧಿತ ವ್ಯವಸ್ಥೆಗಳಿಗೆ ಅಡ್ಡಿಪಡಿಸುವುದು, ಅಡಚಣೆ ಮಾಡುವುದು ಅಥವಾ ಅನಧಿಕೃತ ಪ್ರವೇಶವನ್ನು ಪಡೆಯಲು ಪ್ರಯತ್ನಿಸುವುದು;","li6_4":"ಇತರರ ಹಕ್ಕುಗಳನ್ನು ಉಲ್ಲಂಘಿಸಲು ಅಥವಾ ನೀವು ಸೆರೆಹಿಡಿಯಲು ಅನುಮತಿಸದ ವಿಷಯವನ್ನು ಸೆರೆಹಿಡಿಯಲು ಆ್ಯಪ್ ಅನ್ನು ಬಳಸುವುದು; ಅಥವಾ","li6_5":"ಆ್ಯಪ್‌ನಲ್ಲಿನ ಯಾವುದೇ ಸ್ವಾಮ್ಯದ ಸೂಚನೆಗಳನ್ನು ತೆಗೆದುಹಾಕುವುದು, ಮರೆಮಾಚುವುದು ಅಥವಾ ಬದಲಾಯಿಸುವುದು.","h7":"7. ಬೌದ್ಧಿಕ ಆಸ್ತಿ","p7":"ಆ್ಯಪ್, ಅದರ ಸಾಫ್ಟ್‌ವೇರ್, ವಿನ್ಯಾಸ, ಲೋಗೊಗಳು ಮತ್ತು ಟ್ರೇಡ್‌ಮಾರ್ಕ್‌ಗಳು ಸೇರಿದಂತೆ (ಆದರೆ ನಿಮ್ಮ ವಿಷಯ ಮತ್ತು ಮೂರನೇ ಪಕ್ಷದ ಸಾಮಗ್ರಿಗಳನ್ನು ಹೊರತುಪಡಿಸಿ), GO PRACHI LABS ನ ಸ್ವಾಮ್ಯದಲ್ಲಿದೆ ಮತ್ತು ಬೌದ್ಧಿಕ-ಆಸ್ತಿ ಕಾನೂನುಗಳಿಂದ ರಕ್ಷಿಸಲಾಗಿದೆ. ಮೇಲೆ ನೀಡಲಾದ ಪರವಾನಗಿಯನ್ನು ಹೊರತುಪಡಿಸಿ, ನಿಮಗೆ ಯಾವುದೇ ಹಕ್ಕುಗಳನ್ನು ವರ್ಗಾಯಿಸಲಾಗುವುದಿಲ್ಲ.","h8":"8. ಮೂರನೇ ಪಕ್ಷದ ಸೇವೆಗಳು","p8":"ಆ್ಯಪ್ Google Play Services, Google Maps, Google AdMob, Firebase ಮತ್ತು Google Play Billing ನಂತಹ ಮೂರನೇ ಪಕ್ಷದ ಸೇವೆಗಳನ್ನು ಬಳಸುತ್ತದೆ. ಆ ಸೇವೆಗಳ ನಿಮ್ಮ ಬಳಕೆ ಅವರವರ ಸ್ವಂತ ನಿಯಮಗಳು ಮತ್ತು ಗೌಪ್ಯತಾ ನೀತಿಗಳಿಗೆ ಒಳಪಟ್ಟಿರಬಹುದು. ಮೂರನೇ ಪಕ್ಷದ ಸೇವೆಗಳು ಅಥವಾ ವಿಷಯಕ್ಕೆ ನಾವು ಜವಾಬ್ದಾರರಲ್ಲ.","h9":"9. ಖಾತರಿಗಳ ನಿರಾಕರಣೆ","p9":"ಆ್ಯಪ್ ಅನ್ನು “ಇರುವಂತೆ” ಮತ್ತು “ಲಭ್ಯವಿರುವಂತೆ” ಆಧಾರದ ಮೇಲೆ, ವ್ಯಕ್ತ ಅಥವಾ ಸೂಚ್ಯ ಯಾವುದೇ ರೀತಿಯ ಖಾತರಿಗಳಿಲ್ಲದೆ, ವ್ಯಾಪಾರಯೋಗ್ಯತೆ, ನಿರ್ದಿಷ್ಟ ಉದ್ದೇಶಕ್ಕೆ ಸೂಕ್ತತೆ, ನಿಖರತೆ ಮತ್ತು ಉಲ್ಲಂಘನೆ-ರಹಿತದ ಸೂಚ್ಯ ಖಾತರಿಗಳು ಸೇರಿದಂತೆ, ಒದಗಿಸಲಾಗಿದೆ. ಆ್ಯಪ್ ಅಡೆತಡೆಯಿಲ್ಲದ, ದೋಷರಹಿತ, ಸುರಕ್ಷಿತವಾಗಿರುತ್ತದೆ ಅಥವಾ ಅದು ಒದಗಿಸುವ ಯಾವುದೇ ಮಾಹಿತಿ ನಿಖರ ಅಥವಾ ವಿಶ್ವಾಸಾರ್ಹವಾಗಿದೆ ಎಂದು ನಾವು ಖಾತರಿಪಡಿಸುವುದಿಲ್ಲ.","h10":"10. ಹೊಣೆಗಾರಿಕೆಯ ಮಿತಿ","p10":"ಕಾನೂನಿನಿಂದ ಅನುಮತಿಸಲಾದ ಗರಿಷ್ಠ ಮಟ್ಟಕ್ಕೆ, GO PRACHI LABS ಮತ್ತು ಅದರ ಅಂಗಸಂಸ್ಥೆಗಳು ಆ್ಯಪ್‌ನ ನಿಮ್ಮ ಬಳಕೆ (ಅಥವಾ ಬಳಸಲು ಅಸಮರ್ಥತೆ) ಯಿಂದ ಉಂಟಾಗುವ ಅಥವಾ ಸಂಬಂಧಿಸಿದ ಯಾವುದೇ ಪರೋಕ್ಷ, ಆಕಸ್ಮಿಕ, ವಿಶೇಷ, ಪರಿಣಾಮಕಾರಿ ಅಥವಾ ದಂಡನಾತ್ಮಕ ಹಾನಿಗಳಿಗೆ, ಅಥವಾ ಯಾವುದೇ ಡೇಟಾ, ಲಾಭ ಅಥವಾ ಸದ್ಭಾವನೆಯ ನಷ್ಟಕ್ಕೆ ಜವಾಬ್ದಾರರಾಗುವುದಿಲ್ಲ. ಹೊಣೆಗಾರಿಕೆಯನ್ನು ಹೊರಗಿಡಲಾಗದ ಮಟ್ಟಕ್ಕೆ, ನಮ್ಮ ಒಟ್ಟು ಹೊಣೆಗಾರಿಕೆಯು ಕ್ಲೈಮ್‌ಗೆ ಮೊದಲಿನ ಹನ್ನೆರಡು ತಿಂಗಳಲ್ಲಿ ಆ್ಯಪ್‌ಗಾಗಿ ನೀವು ನಮಗೆ ಪಾವತಿಸಿದ ಮೊತ್ತಕ್ಕೆ (ಇದ್ದರೆ) ಸೀಮಿತವಾಗಿದೆ.","h11":"11. ನಷ್ಟ ಭರ್ತಿ","p11":"ಆ್ಯಪ್‌ನ ನಿಮ್ಮ ಬಳಕೆ, ನಿಮ್ಮ ವಿಷಯ, ಅಥವಾ ಈ ನಿಯಮಗಳ ನಿಮ್ಮ ಉಲ್ಲಂಘನೆಯಿಂದ ಉಂಟಾಗುವ ಯಾವುದೇ ಕ್ಲೈಮ್‌ಗಳು, ಹಾನಿಗಳು, ಹೊಣೆಗಾರಿಕೆಗಳು ಮತ್ತು ವೆಚ್ಚಗಳಿಂದ GO PRACHI LABS ಅನ್ನು ನಷ್ಟ ಭರ್ತಿ ಮಾಡಲು ಮತ್ತು ಹಾನಿರಹಿತವಾಗಿ ಇರಿಸಲು ನೀವು ಒಪ್ಪುತ್ತೀರಿ.","h12":"12. ಮುಕ್ತಾಯ","p12":"ನೀವು ಆ್ಯಪ್ ಅನ್ನು ಅಸ್ಥಾಪಿಸುವ ಮೂಲಕ ಯಾವಾಗ ಬೇಕಾದರೂ ಅದರ ಬಳಕೆಯನ್ನು ನಿಲ್ಲಿಸಬಹುದು. ನೀವು ಈ ನಿಯಮಗಳನ್ನು ಉಲ್ಲಂಘಿಸಿದರೆ ಅಥವಾ ನಾವು ಆ್ಯಪ್ ಅನ್ನು ಸ್ಥಗಿತಗೊಳಿಸಿದರೆ ನಾವು ಆ್ಯಪ್‌ಗೆ ನಿಮ್ಮ ಪ್ರವೇಶವನ್ನು ಅಮಾನತುಗೊಳಿಸಬಹುದು ಅಥವಾ ಕೊನೆಗೊಳಿಸಬಹುದು. ತಮ್ಮ ಸ್ವಭಾವದಿಂದ ಮುಕ್ತಾಯದ ನಂತರವೂ ಉಳಿಯಬೇಕಾದ ನಿಬಂಧನೆಗಳು (ಬೌದ್ಧಿಕ ಆಸ್ತಿ, ನಿರಾಕರಣೆಗಳು ಮತ್ತು ಹೊಣೆಗಾರಿಕೆಯ ಮಿತಿ ಸೇರಿದಂತೆ) ಉಳಿಯುತ್ತವೆ.","h13":"13. ಆ್ಯಪ್ ಮತ್ತು ನಿಯಮಗಳ ಬದಲಾವಣೆಗಳು","p13":"ನಾವು ಆ್ಯಪ್ ಅನ್ನು ಮಾರ್ಪಡಿಸಬಹುದು ಅಥವಾ ಸ್ಥಗಿತಗೊಳಿಸಬಹುದು, ಅಥವಾ ಈ ನಿಯಮಗಳನ್ನು ಯಾವಾಗ ಬೇಕಾದರೂ ನವೀಕರಿಸಬಹುದು. ಗಣನೀಯ ಬದಲಾವಣೆಗಳನ್ನು ಪರಿಷ್ಕೃತ ಜಾರಿ ದಿನಾಂಕದೊಂದಿಗೆ ಈ ಪುಟದಲ್ಲಿ ಪೋಸ್ಟ್ ಮಾಡಲಾಗುತ್ತದೆ. ಬದಲಾವಣೆಗಳು ಜಾರಿಗೆ ಬಂದ ನಂತರ ಆ್ಯಪ್‌ನ ನಿಮ್ಮ ನಿರಂತರ ಬಳಕೆಯು ನವೀಕರಿಸಿದ ನಿಯಮಗಳ ಸ್ವೀಕಾರವನ್ನು ಸೂಚಿಸುತ್ತದೆ.","h14":"14. ಆಡಳಿತ ಕಾನೂನು","p14":"ಈ ನಿಯಮಗಳು ಕಾನೂನು-ಸಂಘರ್ಷದ ತತ್ವಗಳನ್ನು ಪರಿಗಣಿಸದೆ ಭಾರತದ ಕಾನೂನುಗಳಿಂದ ನಿಯಂತ್ರಿಸಲ್ಪಡುತ್ತವೆ. ಅನ್ವಯವಾಗುವ ಗ್ರಾಹಕ-ಸಂರಕ್ಷಣಾ ಕಾನೂನಿನಡಿಯಲ್ಲಿ ನಿಮಗೆ ಬೇರೆ ಕಡ್ಡಾಯ ನ್ಯಾಯವ್ಯಾಪ್ತಿ ಅನ್ವಯಿಸದ ಹೊರತು, ಯಾವುದೇ ವಿವಾದಗಳು ಭಾರತದಲ್ಲಿರುವ ಸಮರ್ಥ ನ್ಯಾಯಾಲಯಗಳ ವಿಶೇಷ ನ್ಯಾಯವ್ಯಾಪ್ತಿಗೆ ಒಳಪಟ್ಟಿರುತ್ತವೆ.","h15":"15. ನಮ್ಮನ್ನು ಸಂಪರ್ಕಿಸಿ","p15":"ಈ ನಿಯಮಗಳ ಬಗ್ಗೆ ಪ್ರಶ್ನೆಗಳಿವೆಯೇ? ನಮ್ಮನ್ನು ಇಲ್ಲಿ ಸಂಪರ್ಕಿಸಿ:","footer":"© 2026 GO PRACHI LABS. ಎಲ್ಲಾ ಹಕ್ಕುಗಳನ್ನು ಕಾಯ್ದಿರಿಸಲಾಗಿದೆ."},"ui":{"ui_language":"ಭಾಷೆ","ui_note":"ಈ ಅನುವಾದವನ್ನು ನಿಮ್ಮ ಅನುಕೂಲಕ್ಕಾಗಿ ಒದಗಿಸಲಾಗಿದೆ. ಯಾವುದೇ ವ್ಯತ್ಯಾಸವಿದ್ದಲ್ಲಿ, ಇಂಗ್ಲಿಷ್ ಆವೃತ್ತಿಯೇ ಕಾನೂನುಬದ್ಧವಾಗಿ ಅಧಿಕೃತವಾಗಿದೆ."}},"ml":{"terms":{"title":"സേവന നിബന്ധനകൾ","eff":"പ്രാബല്യത്തിൽ വരുന്ന തീയതി: 9 July 2026","intro":"ഈ സേവന നിബന്ധനകൾ (“നിബന്ധനകൾ”) GO PRACHI LABS (“ഞങ്ങൾ”, “ഞങ്ങളുടെ”) നൽകുന്ന GPS Map Camera & Compass (“ആപ്പ്”) എന്ന മൊബൈൽ ആപ്ലിക്കേഷന്റെ നിങ്ങളുടെ ഉപയോഗത്തെ നിയന്ത്രിക്കുന്നു. ആപ്പ് ഡൗൺലോഡ് ചെയ്യുകയോ ഇൻസ്റ്റാൾ ചെയ്യുകയോ ഉപയോഗിക്കുകയോ ചെയ്യുന്നതിലൂടെ, നിങ്ങൾ ഈ നിബന്ധനകൾക്ക് സമ്മതിക്കുന്നു. നിങ്ങൾ സമ്മതിക്കുന്നില്ലെങ്കിൽ, ദയവായി ആപ്പ് ഉപയോഗിക്കരുത്.","h1":"1. ആപ്പ് ഉപയോഗിക്കാനുള്ള ലൈസൻസ്","p1":"ഈ നിബന്ധനകൾക്കും നിങ്ങൾ ആപ്പ് ഡൗൺലോഡ് ചെയ്ത ആപ്പ് സ്റ്റോറിന്റെ നിയമങ്ങൾക്കും വിധേയമായി, നിങ്ങളുടെ വ്യക്തിഗതമോ ആന്തരിക ബിസിനസ്സ് ഉപയോഗത്തിനോ വേണ്ടി, നിങ്ങൾ സ്വന്തമാക്കുകയോ നിയന്ത്രിക്കുകയോ ചെയ്യുന്ന ഉപകരണങ്ങളിൽ ആപ്പ് ഇൻസ്റ്റാൾ ചെയ്യാനും ഉപയോഗിക്കാനും ഞങ്ങൾ നിങ്ങൾക്ക് വ്യക്തിഗതവും പരിമിതവും അനന്യമല്ലാത്തതും കൈമാറ്റം ചെയ്യാനാവാത്തതും റദ്ദാക്കാവുന്നതുമായ ലൈസൻസ് അനുവദിക്കുന്നു.","h2":"2. നിങ്ങളുടെ ഉള്ളടക്കം","p2":"നിങ്ങൾ ആപ്പ് ഉപയോഗിച്ച് പകർത്തുകയോ സൃഷ്ടിക്കുകയോ ചെയ്യുന്ന ഫോട്ടോകൾ, വീഡിയോകൾ, മറ്റ് ഉള്ളടക്കം (“നിങ്ങളുടെ ഉള്ളടക്കം”) നിങ്ങൾക്ക് സ്വന്തമാണ്. സ്ഥാനം, തീയതി/സമയം, കോമ്പസ്, അനുബന്ധ വിവരങ്ങൾ എന്നിവ ചേർക്കാൻ ആപ്പ് നിങ്ങളുടെ ഉപകരണത്തിൽ നിങ്ങളുടെ ഉള്ളടക്കം പ്രോസസ്സ് ചെയ്യുന്നു. നിങ്ങളുടെ ഉള്ളടക്കത്തിനും അത് നിങ്ങൾ എങ്ങനെ ഉപയോഗിക്കുന്നു, സംഭരിക്കുന്നു, പങ്കിടുന്നു എന്നതിനും നിങ്ങൾ മാത്രമാണ് ഉത്തരവാദി, കൂടാതെ അത് പകർത്താനും ഉപയോഗിക്കാനുമുള്ള അവകാശം നിങ്ങൾക്കുണ്ടെന്ന് നിങ്ങൾ സ്ഥിരീകരിക്കുന്നു.","h3":"3. സ്ഥാനവും കോമ്പസ് കൃത്യതയും — പ്രധാനം","note3":"ആപ്പിന്റെ സ്ഥാനം, കോർഡിനേറ്റുകൾ, വിലാസം, ഉയരം, കോമ്പസ് ദിശ, കാന്തിക വ്യതിയാനം, സൂര്യൻ/ചന്ദ്രൻ, കാലാവസ്ഥ വിവരങ്ങൾ എന്നിവ പൊതുവായ വിവരദായക ആവശ്യങ്ങൾക്ക് മാത്രം നൽകുന്നതാണ്, അവ കൃത്യമല്ലാത്തതോ അപൂർണ്ണമോ വൈകിയതോ ആയിരിക്കാം. നാവിഗേഷൻ, അടിയന്തിര, വ്യോമയാന, സമുദ്ര, സർവേ, നിയമ, സുരക്ഷാ-നിർണ്ണായക അല്ലെങ്കിൽ ജീവൻ-നിർണ്ണായക ആവശ്യങ്ങൾക്കായി ആപ്പിനെ ആശ്രയിക്കരുത്. അത്തരം തീരുമാനങ്ങൾക്ക് എപ്പോഴും ഔദ്യോഗിക ഉപകരണങ്ങളും ഉറവിടങ്ങളും ഉപയോഗിക്കുക. നിങ്ങൾ ഈ വിവരങ്ങൾ നിങ്ങളുടെ സ്വന്തം ഉത്തരവാദിത്തത്തിൽ ഉപയോഗിക്കുന്നു.","h4":"4. വാങ്ങലുകൾ","p4":"ആപ്പ് ഉപയോഗിക്കാൻ സൗജന്യമാണ്, പരസ്യത്താൽ പിന്തുണയ്ക്കുന്നു. ചില സവിശേഷതകൾ അൺലോക്ക് ചെയ്യുന്ന ഒറ്റത്തവണ “Remove Ads / Pro” അപ്‌ഗ്രേഡ് നിങ്ങൾക്ക് ഓപ്ഷണലായി വാങ്ങാം. എല്ലാ വാങ്ങലുകളും Google Play പ്രോസസ്സ് ചെയ്യുകയും ബിൽ ചെയ്യുകയും ചെയ്യുന്നു, കൂടാതെ അവ Google Play-യുടെ നിബന്ധനകൾക്കും റീഫണ്ട് നയത്തിനും വിധേയമാണ്. ഞങ്ങൾ നിങ്ങളുടെ പേയ്‌മെന്റ് വിശദാംശങ്ങൾ സ്വീകരിക്കുകയോ സൂക്ഷിക്കുകയോ ചെയ്യുന്നില്ല. ഇത് ഒറ്റത്തവണ ഡിജിറ്റൽ അൺലോക്ക് ആയതിനാൽ, നിയമപ്രകാരമോ Google Play-യുടെ നയങ്ങൾ പ്രകാരമോ ആവശ്യമുള്ളിടത്ത് ഒഴികെ വാങ്ങലുകൾ പൊതുവെ റീഫണ്ട് ചെയ്യാനാവില്ല. അതേ Google അക്കൗണ്ടിൽ ആപ്പിനുള്ളിൽ നിന്ന് നിങ്ങൾക്ക് മുൻ വാങ്ങൽ പുനഃസ്ഥാപിക്കാം.","h5":"5. പരസ്യങ്ങൾ","p5":"നിങ്ങൾ പരസ്യ-രഹിത അപ്‌ഗ്രേഡ് വാങ്ങുന്നില്ലെങ്കിൽ, ആപ്പ് മൂന്നാം കക്ഷികൾ (Google AdMob ഉൾപ്പെടെ) നൽകുന്ന പരസ്യങ്ങൾ പ്രദർശിപ്പിക്കുന്നു. പരസ്യങ്ങളുടെ ഉള്ളടക്കത്തിനോ അവ പ്രോത്സാഹിപ്പിക്കുന്ന ഏതെങ്കിലും ഉൽപ്പന്നങ്ങൾക്കോ സേവനങ്ങൾക്കോ ഞങ്ങൾ ഉത്തരവാദികളല്ല.","h6":"6. സ്വീകാര്യമായ ഉപയോഗം","p6_intro":"നിങ്ങൾ ഇനിപ്പറയുന്നവ ചെയ്യില്ലെന്ന് സമ്മതിക്കുന്നു:","li6_1":"ഏതെങ്കിലും നിയമവിരുദ്ധമായ ആവശ്യത്തിനോ ബാധകമായ ഏതെങ്കിലും നിയമത്തിന്റെയോ ചട്ടത്തിന്റെയോ ലംഘനത്തിലോ ആപ്പ് ഉപയോഗിക്കുക;","li6_2":"ഈ നിയന്ത്രണം നിയമപ്രകാരം നിരോധിച്ചിരിക്കുന്ന പരിധി വരെ ഒഴികെ, ആപ്പിന്റെ സോഴ്‌സ് കോഡ് പകർത്തുകയോ പരിഷ്‌കരിക്കുകയോ റിവേഴ്‌സ്-എൻജിനീയർ ചെയ്യുകയോ ഡീകമ്പൈൽ ചെയ്യുകയോ വേർതിരിച്ചെടുക്കാൻ ശ്രമിക്കുകയോ ചെയ്യുക;","li6_3":"ആപ്പിലോ അതിന്റെ അനുബന്ധ സിസ്റ്റങ്ങളിലോ ഇടപെടുകയോ തടസ്സപ്പെടുത്തുകയോ അനധികൃത ആക്‌സസ് നേടാൻ ശ്രമിക്കുകയോ ചെയ്യുക;","li6_4":"മറ്റുള്ളവരുടെ അവകാശങ്ങൾ ലംഘിക്കാനോ നിങ്ങൾക്ക് പകർത്താൻ അനുവാദമില്ലാത്ത ഉള്ളടക്കം പകർത്താനോ ആപ്പ് ഉപയോഗിക്കുക; അല്ലെങ്കിൽ","li6_5":"ആപ്പിലെ ഏതെങ്കിലും ഉടമസ്ഥാവകാശ അറിയിപ്പുകൾ നീക്കം ചെയ്യുകയോ മറയ്ക്കുകയോ മാറ്റുകയോ ചെയ്യുക.","h7":"7. ബൗദ്ധിക സ്വത്ത്","p7":"ആപ്പ്, അതിന്റെ സോഫ്റ്റ്‌വെയർ, ഡിസൈൻ, ലോഗോകൾ, ട്രേഡ്‌മാർക്കുകൾ ഉൾപ്പെടെ (എന്നാൽ നിങ്ങളുടെ ഉള്ളടക്കവും മൂന്നാം കക്ഷി മെറ്റീരിയലുകളും ഒഴികെ), GO PRACHI LABS-ന്റെ ഉടമസ്ഥതയിലുള്ളതും ബൗദ്ധിക-സ്വത്ത് നിയമങ്ങളാൽ സംരക്ഷിക്കപ്പെട്ടതുമാണ്. മുകളിൽ അനുവദിച്ച ലൈസൻസ് ഒഴികെ, നിങ്ങൾക്ക് അവകാശങ്ങളൊന്നും കൈമാറ്റം ചെയ്യപ്പെടുന്നില്ല.","h8":"8. മൂന്നാം കക്ഷി സേവനങ്ങൾ","p8":"ആപ്പ് Google Play Services, Google Maps, Google AdMob, Firebase, Google Play Billing എന്നിവ പോലുള്ള മൂന്നാം കക്ഷി സേവനങ്ങൾ ഉപയോഗിക്കുന്നു. ആ സേവനങ്ങളുടെ നിങ്ങളുടെ ഉപയോഗം അവരുടെ സ്വന്തം നിബന്ധനകൾക്കും സ്വകാര്യതാ നയങ്ങൾക്കും വിധേയമായേക്കാം. മൂന്നാം കക്ഷി സേവനങ്ങൾക്കോ ഉള്ളടക്കത്തിനോ ഞങ്ങൾ ഉത്തരവാദികളല്ല.","h9":"9. വാറന്റികളുടെ നിരാകരണം","p9":"ആപ്പ് “ഉള്ളതുപോലെ”, “ലഭ്യമായതുപോലെ” അടിസ്ഥാനത്തിൽ, വ്യാപാരയോഗ്യത, ഒരു പ്രത്യേക ആവശ്യത്തിനുള്ള അനുയോജ്യത, കൃത്യത, ലംഘനമില്ലായ്‌മ എന്നിവയുടെ പരോക്ഷ വാറന്റികൾ ഉൾപ്പെടെ, വ്യക്തമോ പരോക്ഷമോ ആയ ഏതെങ്കിലും തരത്തിലുള്ള വാറന്റികളില്ലാതെ നൽകുന്നു. ആപ്പ് തടസ്സമില്ലാത്തതോ പിശകുകളില്ലാത്തതോ സുരക്ഷിതമോ ആയിരിക്കുമെന്നോ അത് നൽകുന്ന ഏതെങ്കിലും വിവരം കൃത്യമോ വിശ്വസനീയമോ ആണെന്നോ ഞങ്ങൾ ഉറപ്പുനൽകുന്നില്ല.","h10":"10. ബാധ്യതയുടെ പരിമിതി","p10":"നിയമം അനുവദിക്കുന്ന പരമാവധി പരിധി വരെ, GO PRACHI LABS-ഉം അതിന്റെ അഫിലിയേറ്റുകളും ആപ്പിന്റെ നിങ്ങളുടെ ഉപയോഗത്തിൽ നിന്നോ (അല്ലെങ്കിൽ ഉപയോഗിക്കാനുള്ള കഴിവില്ലായ്‌മയിൽ നിന്നോ) ഉണ്ടാകുന്നതോ അതുമായി ബന്ധപ്പെട്ടതോ ആയ ഏതെങ്കിലും പരോക്ഷ, ആകസ്മിക, പ്രത്യേക, അനന്തരഫലമായ അല്ലെങ്കിൽ ശിക്ഷാപരമായ നാശനഷ്ടങ്ങൾക്കോ, ഏതെങ്കിലും ഡാറ്റ, ലാഭം, അല്ലെങ്കിൽ സൽപ്പേരിന്റെ നഷ്ടത്തിനോ ഉത്തരവാദികളായിരിക്കില്ല. ബാധ്യത ഒഴിവാക്കാൻ കഴിയാത്ത പരിധി വരെ, ഞങ്ങളുടെ മൊത്തം ബാധ്യത, ക്ലെയിമിന് മുമ്പുള്ള പന്ത്രണ്ട് മാസങ്ങളിൽ ആപ്പിനായി നിങ്ങൾ ഞങ്ങൾക്ക് നൽകിയ തുകയിൽ (ഉണ്ടെങ്കിൽ) പരിമിതപ്പെടുത്തിയിരിക്കുന്നു.","h11":"11. നഷ്ടപരിഹാരം","p11":"ആപ്പിന്റെ നിങ്ങളുടെ ഉപയോഗം, നിങ്ങളുടെ ഉള്ളടക്കം, അല്ലെങ്കിൽ ഈ നിബന്ധനകളുടെ നിങ്ങളുടെ ലംഘനം എന്നിവയിൽ നിന്ന് ഉണ്ടാകുന്ന ഏതെങ്കിലും ക്ലെയിമുകൾ, നാശനഷ്ടങ്ങൾ, ബാധ്യതകൾ, ചെലവുകൾ എന്നിവയിൽ നിന്ന് GO PRACHI LABS-നെ നഷ്ടപരിഹാരം നൽകാനും ഹാനിരഹിതമായി സൂക്ഷിക്കാനും നിങ്ങൾ സമ്മതിക്കുന്നു.","h12":"12. അവസാനിപ്പിക്കൽ","p12":"ആപ്പ് അൺഇൻസ്റ്റാൾ ചെയ്ത് നിങ്ങൾക്ക് എപ്പോൾ വേണമെങ്കിലും അതിന്റെ ഉപയോഗം നിർത്താം. നിങ്ങൾ ഈ നിബന്ധനകൾ ലംഘിക്കുകയോ ഞങ്ങൾ ആപ്പ് നിർത്തലാക്കുകയോ ചെയ്താൽ ആപ്പിലേക്കുള്ള നിങ്ങളുടെ ആക്‌സസ് ഞങ്ങൾ താൽക്കാലികമായി നിർത്തുകയോ അവസാനിപ്പിക്കുകയോ ചെയ്‌തേക്കാം. അവയുടെ സ്വഭാവം കൊണ്ട് അവസാനിപ്പിക്കലിനുശേഷവും നിലനിൽക്കേണ്ട വ്യവസ്ഥകൾ (ബൗദ്ധിക സ്വത്ത്, നിരാകരണങ്ങൾ, ബാധ്യതയുടെ പരിമിതി എന്നിവ ഉൾപ്പെടെ) നിലനിൽക്കും.","h13":"13. ആപ്പിലും നിബന്ധനകളിലുമുള്ള മാറ്റങ്ങൾ","p13":"ഞങ്ങൾ ആപ്പ് പരിഷ്‌കരിക്കുകയോ നിർത്തലാക്കുകയോ ഈ നിബന്ധനകൾ അപ്‌ഡേറ്റ് ചെയ്യുകയോ എപ്പോൾ വേണമെങ്കിലും ചെയ്‌തേക്കാം. കാര്യമായ മാറ്റങ്ങൾ പരിഷ്‌കരിച്ച പ്രാബല്യ തീയതിയോടെ ഈ പേജിൽ പോസ്റ്റ് ചെയ്യും. മാറ്റങ്ങൾ പ്രാബല്യത്തിൽ വന്നതിന് ശേഷം ആപ്പിന്റെ നിങ്ങളുടെ തുടർച്ചയായ ഉപയോഗം അപ്‌ഡേറ്റ് ചെയ്ത നിബന്ധനകളുടെ സ്വീകാര്യതയാണ്.","h14":"14. ഭരണ നിയമം","p14":"ഈ നിബന്ധനകൾ നിയമ-വൈരുദ്ധ്യ തത്വങ്ങൾ പരിഗണിക്കാതെ ഇന്ത്യയുടെ നിയമങ്ങളാൽ നിയന്ത്രിക്കപ്പെടുന്നു. ബാധകമായ ഉപഭോക്തൃ-സംരക്ഷണ നിയമപ്രകാരം നിങ്ങൾക്ക് വ്യത്യസ്തമായ നിർബന്ധിത അധികാരപരിധി ബാധകമല്ലെങ്കിൽ, ഏതെങ്കിലും തർക്കങ്ങൾ ഇന്ത്യയിൽ സ്ഥിതി ചെയ്യുന്ന യോഗ്യതയുള്ള കോടതികളുടെ പ്രത്യേക അധികാരപരിധിക്ക് വിധേയമായിരിക്കും.","h15":"15. ഞങ്ങളെ ബന്ധപ്പെടുക","p15":"ഈ നിബന്ധനകളെക്കുറിച്ച് ചോദ്യങ്ങളുണ്ടോ? ഇവിടെ ഞങ്ങളെ ബന്ധപ്പെടുക:","footer":"© 2026 GO PRACHI LABS. എല്ലാ അവകാശങ്ങളും നിക്ഷിപ്തം."},"ui":{"ui_language":"ഭാഷ","ui_note":"ഈ വിവർത്തനം നിങ്ങളുടെ സൗകര്യത്തിനായി നൽകുന്നതാണ്. എന്തെങ്കിലും പൊരുത്തക്കേട് ഉണ്ടായാൽ, ഇംഗ്ലീഷ് പതിപ്പാണ് നിയമപരമായി ആധികാരികം."}},"or":{"terms":{"title":"ସେବା ସର୍ତ୍ତାବଳୀ","eff":"ପ୍ରଭାବୀ ତାରିଖ: 9 July 2026","intro":"ଏହି ସେବା ସର୍ତ୍ତାବଳୀ (“ସର୍ତ୍ତାବଳୀ”) GO PRACHI LABS (“ଆମେ”, “ଆମର”) ଦ୍ୱାରା ପ୍ରଦତ୍ତ ମୋବାଇଲ୍ ଆପ୍ଲିକେସନ୍ GPS Map Camera & Compass (“ଆପ୍”) ର ଆପଣଙ୍କ ବ୍ୟବହାରକୁ ପରିଚାଳନା କରେ। ଆପ୍ ଡାଉନଲୋଡ୍, ଇନଷ୍ଟଲ୍ କିମ୍ବା ବ୍ୟବହାର କରି, ଆପଣ ଏହି ସର୍ତ୍ତାବଳୀ ସହିତ ସହମତ ହୁଅନ୍ତି। ଯଦି ଆପଣ ସହମତ ନୁହଁନ୍ତି, ଦୟାକରି ଆପ୍ ବ୍ୟବହାର କରନ୍ତୁ ନାହିଁ।","h1":"1. ଆପ୍ ବ୍ୟବହାର କରିବାର ଲାଇସେନ୍ସ","p1":"ଆମେ ଆପଣଙ୍କୁ ଏହି ସର୍ତ୍ତାବଳୀ ଏବଂ ଆପଣ ଡାଉନଲୋଡ୍ କରିଥିବା ଆପ୍ ଷ୍ଟୋର୍‌ର ନିୟମ ଅଧୀନରେ, ଆପଣଙ୍କ ବ୍ୟକ୍ତିଗତ କିମ୍ବା ଆଭ୍ୟନ୍ତରୀଣ ବ୍ୟବସାୟ ବ୍ୟବହାର ପାଇଁ, ଆପଣ ମାଲିକାନା କିମ୍ବା ନିୟନ୍ତ୍ରଣ କରୁଥିବା ଡିଭାଇସରେ ଆପ୍ ଇନଷ୍ଟଲ୍ ଓ ବ୍ୟବହାର କରିବା ପାଇଁ ଏକ ବ୍ୟକ୍ତିଗତ, ସୀମିତ, ଅଣ-ବିଶେଷ, ଅଣ-ହସ୍ତାନ୍ତରଣୀୟ, ପ୍ରତ୍ୟାହାରଯୋଗ୍ୟ ଲାଇସେନ୍ସ ପ୍ରଦାନ କରୁ।","h2":"2. ଆପଣଙ୍କ ବିଷୟବସ୍ତୁ","p2":"ଆପଣ ଆପ୍‌ରେ କ୍ୟାପଚର କିମ୍ବା ସୃଷ୍ଟି କରୁଥିବା ଫଟୋ, ଭିଡିଓ, ଏବଂ ଅନ୍ୟ ବିଷୟବସ୍ତୁ (“ଆପଣଙ୍କ ବିଷୟବସ୍ତୁ”) ଆପଣଙ୍କର। ଅବସ୍ଥାନ, ତାରିଖ/ସମୟ, କମ୍ପାସ୍, ଏବଂ ସମ୍ପର୍କିତ ସୂଚନା ଯୋଡ଼ିବା ପାଇଁ ଆପ୍ ଆପଣଙ୍କ ଡିଭାଇସ୍‌ରେ ଆପଣଙ୍କ ବିଷୟବସ୍ତୁ ପ୍ରକ୍ରିୟାକରଣ କରେ। ଆପଣଙ୍କ ବିଷୟବସ୍ତୁ ପାଇଁ ଏବଂ ଆପଣ ଏହାକୁ କିପରି ବ୍ୟବହାର, ସଂରକ୍ଷଣ, ଏବଂ ଅଂଶୀଦାର କରନ୍ତି ସେଥିପାଇଁ ଆପଣ ଏକମାତ୍ର ଦାୟୀ, ଏବଂ ଆପଣ ନିଶ୍ଚିତ କରନ୍ତି ଯେ ଏହାକୁ କ୍ୟାପଚର ଓ ବ୍ୟବହାର କରିବାର ଅଧିକାର ଆପଣଙ୍କର ଅଛି।","h3":"3. ଅବସ୍ଥାନ ଏବଂ କମ୍ପାସ୍ ସଠିକତା — ଗୁରୁତ୍ୱପୂର୍ଣ୍ଣ","note3":"ଆପ୍‌ର ଅବସ୍ଥାନ, ସ୍ଥାନାଙ୍କ, ଠିକଣା, ଉଚ୍ଚତା, କମ୍ପାସ୍ ଦିଗ, ଚୁମ୍ବକୀୟ ବିଚ୍ୟୁତି, ଏବଂ ସୂର୍ଯ୍ୟ/ଚନ୍ଦ୍ର ଓ ପାଣିପାଗ ସୂଚନା କେବଳ ସାଧାରଣ ସୂଚନାତ୍ମକ ଉଦ୍ଦେଶ୍ୟ ପାଇଁ ପ୍ରଦାନ କରାଯାଇଛି ଏବଂ ଅସଠିକ, ଅସମ୍ପୂର୍ଣ୍ଣ, କିମ୍ବା ବିଳମ୍ବିତ ହୋଇପାରେ। ନେଭିଗେସନ୍, ଜରୁରୀକାଳୀନ, ବିମାନ ଚଳାଚଳ, ସାମୁଦ୍ରିକ, ସର୍ଭେ, ଆଇନଗତ, ସୁରକ୍ଷା-ଗୁରୁତ୍ୱପୂର୍ଣ୍ଣ କିମ୍ବା ଜୀବନ-ଗୁରୁତ୍ୱପୂର୍ଣ୍ଣ ଉଦ୍ଦେଶ୍ୟ ପାଇଁ ଆପ୍ ଉପରେ ନିର୍ଭର କରନ୍ତୁ ନାହିଁ। ଏହିପରି ନିଷ୍ପତ୍ତି ପାଇଁ ସର୍ବଦା ଅଧିକୃତ ଉପକରଣ ଏବଂ ଉତ୍ସ ବ୍ୟବହାର କରନ୍ତୁ। ଆପଣ ଏହି ସୂଚନା ଆପଣଙ୍କ ନିଜ ଝୁଙ୍କରେ ବ୍ୟବହାର କରନ୍ତି।","h4":"4. କ୍ରୟ","p4":"ଆପ୍ ବ୍ୟବହାର କରିବା ମାଗଣା ଏବଂ ବିଜ୍ଞାପନ ଦ୍ୱାରା ସମର୍ଥିତ। ଆପଣ ବୈକଳ୍ପିକ ଭାବରେ କିଛି ବୈଶିଷ୍ଟ୍ୟ ଅନଲକ୍ କରୁଥିବା ଏକ-ଥର “Remove Ads / Pro” ଅପଗ୍ରେଡ୍ କିଣିପାରିବେ। ସମସ୍ତ କ୍ରୟ Google Play ଦ୍ୱାରା ପ୍ରକ୍ରିୟାକରଣ ଏବଂ ବିଲ୍ କରାଯାଏ, ଏବଂ Google Play ର ସର୍ତ୍ତାବଳୀ ଓ ଫେରସ୍ତ ନୀତି ଅଧୀନରେ ଅଛି। ଆମେ ଆପଣଙ୍କ ପେମେଣ୍ଟ ବିବରଣୀ ଗ୍ରହଣ କିମ୍ବା ସଂରକ୍ଷଣ କରୁ ନାହିଁ। ଯେହେତୁ ଏହା ଏକ ଏକ-ଥର ଡିଜିଟାଲ୍ ଅନଲକ୍, ଆଇନ କିମ୍ବା Google Play ର ନୀତି ଦ୍ୱାରା ଆବଶ୍ୟକ ହେଲେ ବ୍ୟତୀତ କ୍ରୟ ସାଧାରଣତଃ ଫେରସ୍ତଯୋଗ୍ୟ ନୁହେଁ। ଆପଣ ସମାନ Google ଆକାଉଣ୍ଟରେ ଆପ୍ ଭିତରୁ ଏକ ପୂର୍ବ କ୍ରୟ ପୁନଃସ୍ଥାପନ କରିପାରିବେ।","h5":"5. ବିଜ୍ଞାପନ","p5":"ଆପଣ ବିଜ୍ଞାପନ-ମୁକ୍ତ ଅପଗ୍ରେଡ୍ ନ କିଣିଲେ, ଆପ୍ ତୃତୀୟ-ପକ୍ଷ (Google AdMob ସମେତ) ଦ୍ୱାରା ପ୍ରଦତ୍ତ ବିଜ୍ଞାପନ ପ୍ରଦର୍ଶନ କରେ। ବିଜ୍ଞାପନର ବିଷୟବସ୍ତୁ କିମ୍ବା ସେମାନେ ପ୍ରୋତ୍ସାହିତ କରୁଥିବା କୌଣସି ଉତ୍ପାଦ କିମ୍ବା ସେବା ପାଇଁ ଆମେ ଦାୟୀ ନୁହଁ।","h6":"6. ଗ୍ରହଣୀୟ ବ୍ୟବହାର","p6_intro":"ଆପଣ ନିମ୍ନଲିଖିତ କରିବେ ନାହିଁ ବୋଲି ସହମତ ହୁଅନ୍ତି:","li6_1":"କୌଣସି ବେଆଇନ ଉଦ୍ଦେଶ୍ୟ ପାଇଁ କିମ୍ବା କୌଣସି ପ୍ରଯୁଜ୍ୟ ଆଇନ କିମ୍ବା ନିୟମର ଉଲ୍ଲଙ୍ଘନରେ ଆପ୍ ବ୍ୟବହାର କରିବା;","li6_2":"ଏହି ପ୍ରତିବନ୍ଧ ଆଇନ ଦ୍ୱାରା ନିଷେଧ ଥିବା ପରିମାଣ ବ୍ୟତୀତ, ଆପ୍‌ର ସୋର୍ସ କୋଡ୍ କପି, ପରିବର୍ତ୍ତନ, ରିଭର୍ସ-ଇଞ୍ଜିନିୟର, ଡିକମ୍ପାଇଲ୍ କିମ୍ବା ବାହାର କରିବାକୁ ଚେଷ୍ଟା କରିବା;","li6_3":"ଆପ୍ କିମ୍ବା ଏହାର ସମ୍ପର୍କିତ ପ୍ରଣାଳୀରେ ହସ୍ତକ୍ଷେପ, ବ୍ୟାଘାତ କିମ୍ବା ଅନଧିକୃତ ପ୍ରବେଶ ପାଇବାକୁ ଚେଷ୍ଟା କରିବା;","li6_4":"ଅନ୍ୟମାନଙ୍କ ଅଧିକାର ଉଲ୍ଲଙ୍ଘନ କରିବାକୁ କିମ୍ବା ଆପଣଙ୍କୁ କ୍ୟାପଚର କରିବାକୁ ଅନୁମତି ନ ଥିବା ବିଷୟବସ୍ତୁ କ୍ୟାପଚର କରିବାକୁ ଆପ୍ ବ୍ୟବହାର କରିବା; କିମ୍ବା","li6_5":"ଆପ୍‌ରେ ଥିବା କୌଣସି ମାଲିକାନା ବିଜ୍ଞପ୍ତି ହଟାଇବା, ଲୁଚାଇବା କିମ୍ବା ପରିବର୍ତ୍ତନ କରିବା।","h7":"7. ବୌଦ୍ଧିକ ସମ୍ପତ୍ତି","p7":"ଆପ୍, ଏହାର ସଫ୍ଟୱେର, ଡିଜାଇନ୍, ଲୋଗୋ, ଏବଂ ଟ୍ରେଡମାର୍କ ସମେତ (କିନ୍ତୁ ଆପଣଙ୍କ ବିଷୟବସ୍ତୁ ଏବଂ ତୃତୀୟ-ପକ୍ଷ ସାମଗ୍ରୀ ବ୍ୟତୀତ), GO PRACHI LABS ର ମାଲିକାନାରେ ଅଛି ଏବଂ ବୌଦ୍ଧିକ-ସମ୍ପତ୍ତି ଆଇନ ଦ୍ୱାରା ସୁରକ୍ଷିତ। ଉପରେ ପ୍ରଦତ୍ତ ଲାଇସେନ୍ସ ବ୍ୟତୀତ, ଆପଣଙ୍କୁ କୌଣସି ଅଧିକାର ହସ୍ତାନ୍ତର କରାଯାଏ ନାହିଁ।","h8":"8. ତୃତୀୟ-ପକ୍ଷ ସେବା","p8":"ଆପ୍ Google Play Services, Google Maps, Google AdMob, Firebase, ଏବଂ Google Play Billing ପରି ତୃତୀୟ-ପକ୍ଷ ସେବା ବ୍ୟବହାର କରେ। ସେହି ସେବାଗୁଡ଼ିକର ଆପଣଙ୍କ ବ୍ୟବହାର ସେମାନଙ୍କ ନିଜ ସର୍ତ୍ତାବଳୀ ଏବଂ ଗୋପନୀୟତା ନୀତି ଅଧୀନରେ ହୋଇପାରେ। ତୃତୀୟ-ପକ୍ଷ ସେବା କିମ୍ବା ବିଷୟବସ୍ତୁ ପାଇଁ ଆମେ ଦାୟୀ ନୁହଁ।","h9":"9. ୱାରେଣ୍ଟିର ଅସ୍ୱୀକୃତି","p9":"ଆପ୍ “ଯେପରି ଅଛି” ଏବଂ “ଯେପରି ଉପଲବ୍ଧ” ଆଧାରରେ, ବ୍ୟକ୍ତ କିମ୍ବା ଅନ୍ତର୍ନିହିତ, ବ୍ୟବସାୟଯୋଗ୍ୟତା, ଏକ ନିର୍ଦ୍ଦିଷ୍ଟ ଉଦ୍ଦେଶ୍ୟ ପାଇଁ ଉପଯୁକ୍ତତା, ସଠିକତା, ଏବଂ ଅଣ-ଉଲ୍ଲଙ୍ଘନର ଅନ୍ତର୍ନିହିତ ୱାରେଣ୍ଟି ସମେତ, କୌଣସି ପ୍ରକାର ୱାରେଣ୍ଟି ବିନା ପ୍ରଦାନ କରାଯାଏ। ଆପ୍ ନିରବଚ୍ଛିନ୍ନ, ତ୍ରୁଟିମୁକ୍ତ, ସୁରକ୍ଷିତ ହେବ, କିମ୍ବା ଏହା ପ୍ରଦାନ କରୁଥିବା କୌଣସି ସୂଚନା ସଠିକ କିମ୍ବା ନିର୍ଭରଯୋଗ୍ୟ ବୋଲି ଆମେ ୱାରେଣ୍ଟି ଦେଉ ନାହିଁ।","h10":"10. ଦାୟିତ୍ୱର ସୀମା","p10":"ଆଇନ ଦ୍ୱାରା ଅନୁମତିପ୍ରାପ୍ତ ସର୍ବାଧିକ ପରିମାଣ ପର୍ଯ୍ୟନ୍ତ, GO PRACHI LABS ଏବଂ ଏହାର ସହଯୋଗୀମାନେ ଆପ୍‌ର ଆପଣଙ୍କ ବ୍ୟବହାର (କିମ୍ବା ବ୍ୟବହାର କରିବାରେ ଅକ୍ଷମତା) ରୁ ଉତ୍ପନ୍ନ କିମ୍ବା ଏଥିସହ ସମ୍ପର୍କିତ କୌଣସି ପରୋକ୍ଷ, ଆନୁଷଙ୍ଗିକ, ବିଶେଷ, ପରିଣାମସ୍ୱରୂପ କିମ୍ବା ଦଣ୍ଡାତ୍ମକ କ୍ଷତି, କିମ୍ବା କୌଣସି ଡାଟା, ଲାଭ କିମ୍ବା ସଦଭାବନାର କ୍ଷତି ପାଇଁ ଦାୟୀ ରହିବେ ନାହିଁ। ଦାୟିତ୍ୱ ବାଦ୍ ଦିଆଯାଇ ନ ପାରିବା ପରିମାଣ ପର୍ଯ୍ୟନ୍ତ, ଆମର ମୋଟ ଦାୟିତ୍ୱ ଦାବି ପୂର୍ବର ବାର ମାସ ମଧ୍ୟରେ ଆପ୍ ପାଇଁ ଆପଣ ଆମକୁ ଦେଇଥିବା ରାଶି (ଯଦି କିଛି ଥାଏ) ରେ ସୀମିତ।","h11":"11. କ୍ଷତିପୂରଣ","p11":"ଆପଣ ଆପ୍‌ର ଆପଣଙ୍କ ବ୍ୟବହାର, ଆପଣଙ୍କ ବିଷୟବସ୍ତୁ, କିମ୍ବା ଏହି ସର୍ତ୍ତାବଳୀର ଆପଣଙ୍କ ଉଲ୍ଲଙ୍ଘନରୁ ଉତ୍ପନ୍ନ କୌଣସି ଦାବି, କ୍ଷତି, ଦାୟିତ୍ୱ, ଏବଂ ଖର୍ଚ୍ଚରୁ GO PRACHI LABS କୁ କ୍ଷତିପୂରଣ ଦେବାକୁ ଏବଂ କ୍ଷତିମୁକ୍ତ ରଖିବାକୁ ସହମତ ହୁଅନ୍ତି।","h12":"12. ସମାପ୍ତି","p12":"ଆପଣ ଆପ୍ ଅନଇନଷ୍ଟଲ୍ କରି ଯେକୌଣସି ସମୟରେ ଏହାର ବ୍ୟବହାର ବନ୍ଦ କରିପାରିବେ। ଯଦି ଆପଣ ଏହି ସର୍ତ୍ତାବଳୀ ଉଲ୍ଲଙ୍ଘନ କରନ୍ତି କିମ୍ବା ଆମେ ଆପ୍ ବନ୍ଦ କରୁ, ଆମେ ଆପ୍‌କୁ ଆପଣଙ୍କ ପ୍ରବେଶ ସ୍ଥଗିତ କିମ୍ବା ସମାପ୍ତ କରିପାରୁ। ଯେଉଁ ବ୍ୟବସ୍ଥାଗୁଡ଼ିକ ସେମାନଙ୍କ ପ୍ରକୃତି ଅନୁସାରେ ସମାପ୍ତି ପରେ ମଧ୍ୟ ବଞ୍ଚି ରହିବା ଉଚିତ (ବୌଦ୍ଧିକ ସମ୍ପତ୍ତି, ଅସ୍ୱୀକୃତି, ଏବଂ ଦାୟିତ୍ୱର ସୀମା ସମେତ) ସେଗୁଡ଼ିକ ବଞ୍ଚି ରହିବ।","h13":"13. ଆପ୍ ଏବଂ ସର୍ତ୍ତାବଳୀରେ ପରିବର୍ତ୍ତନ","p13":"ଆମେ ଆପ୍ ପରିବର୍ତ୍ତନ କିମ୍ବା ବନ୍ଦ କରିପାରୁ, କିମ୍ବା ଏହି ସର୍ତ୍ତାବଳୀ ଅଦ୍ୟତନ କରିପାରୁ, ଯେକୌଣସି ସମୟରେ। ଗୁରୁତ୍ୱପୂର୍ଣ୍ଣ ପରିବର୍ତ୍ତନ ଏକ ସଂଶୋଧିତ ପ୍ରଭାବୀ ତାରିଖ ସହିତ ଏହି ପୃଷ୍ଠାରେ ପୋଷ୍ଟ କରାଯିବ। ପରିବର୍ତ୍ତନ ପ୍ରଭାବୀ ହେବା ପରେ ଆପ୍‌ର ଆପଣଙ୍କ ନିରନ୍ତର ବ୍ୟବହାର ଅଦ୍ୟତନ ସର୍ତ୍ତାବଳୀର ଗ୍ରହଣକୁ ଗଠନ କରେ।","h14":"14. ପରିଚାଳନା ଆଇନ","p14":"ଏହି ସର୍ତ୍ତାବଳୀ ଆଇନ-ବିରୋଧ ନୀତିକୁ ବିଚାର ନ କରି ଭାରତର ଆଇନ ଦ୍ୱାରା ପରିଚାଳିତ। ପ୍ରଯୁଜ୍ୟ ଉପଭୋକ୍ତା-ସୁରକ୍ଷା ଆଇନ ଅଧୀନରେ ଆପଣଙ୍କ ପାଇଁ ଏକ ଭିନ୍ନ ବାଧ୍ୟତାମୂଳକ ଅଧିକାରକ୍ଷେତ୍ର ପ୍ରଯୁଜ୍ୟ ନ ହେଲେ, କୌଣସି ବିବାଦ ଭାରତରେ ଅବସ୍ଥିତ ସକ୍ଷମ ଅଦାଲତର ବିଶେଷ ଅଧିକାରକ୍ଷେତ୍ର ଅଧୀନରେ ରହିବ।","h15":"15. ଆମ ସହିତ ଯୋଗାଯୋଗ କରନ୍ତୁ","p15":"ଏହି ସର୍ତ୍ତାବଳୀ ବିଷୟରେ ପ୍ରଶ୍ନ? ଆମ ସହିତ ଏଠାରେ ଯୋଗାଯୋଗ କରନ୍ତୁ:","footer":"© 2026 GO PRACHI LABS. ସମସ୍ତ ଅଧିକାର ସଂରକ୍ଷିତ।"},"ui":{"ui_language":"ଭାଷା","ui_note":"ଏହି ଅନୁବାଦ ଆପଣଙ୍କ ସୁବିଧା ପାଇଁ ପ୍ରଦାନ କରାଯାଇଛି। କୌଣସି ଅସଙ୍ଗତି କ୍ଷେତ୍ରରେ, ଇଂରାଜୀ ସଂସ୍କରଣ ଆଇନଗତ ଭାବରେ ଅଧିକୃତ।"}},"pa":{"terms":{"title":"ਸੇਵਾ ਦੀਆਂ ਸ਼ਰਤਾਂ","eff":"ਲਾਗੂ ਹੋਣ ਦੀ ਮਿਤੀ: 9 July 2026","intro":"ਇਹ ਸੇਵਾ ਦੀਆਂ ਸ਼ਰਤਾਂ (“ਸ਼ਰਤਾਂ”) GO PRACHI LABS (“ਅਸੀਂ”, “ਸਾਡਾ”) ਦੁਆਰਾ ਪ੍ਰਦਾਨ ਕੀਤੀ ਮੋਬਾਈਲ ਐਪਲੀਕੇਸ਼ਨ GPS Map Camera & Compass (“ਐਪ”) ਦੀ ਤੁਹਾਡੀ ਵਰਤੋਂ ਨੂੰ ਨਿਯੰਤ੍ਰਿਤ ਕਰਦੀਆਂ ਹਨ। ਐਪ ਨੂੰ ਡਾਊਨਲੋਡ, ਇੰਸਟਾਲ, ਜਾਂ ਵਰਤ ਕੇ, ਤੁਸੀਂ ਇਨ੍ਹਾਂ ਸ਼ਰਤਾਂ ਨਾਲ ਸਹਿਮਤ ਹੁੰਦੇ ਹੋ। ਜੇ ਤੁਸੀਂ ਸਹਿਮਤ ਨਹੀਂ ਹੋ, ਤਾਂ ਕਿਰਪਾ ਕਰਕੇ ਐਪ ਨਾ ਵਰਤੋ।","h1":"1. ਐਪ ਵਰਤਣ ਦਾ ਲਾਇਸੈਂਸ","p1":"ਅਸੀਂ ਤੁਹਾਨੂੰ ਇਨ੍ਹਾਂ ਸ਼ਰਤਾਂ ਅਤੇ ਜਿਸ ਐਪ ਸਟੋਰ ਤੋਂ ਤੁਸੀਂ ਇਸ ਨੂੰ ਡਾਊਨਲੋਡ ਕੀਤਾ ਹੈ ਉਸ ਦੇ ਨਿਯਮਾਂ ਦੇ ਅਧੀਨ, ਤੁਹਾਡੀ ਵਿਅਕਤੀਗਤ ਜਾਂ ਅੰਦਰੂਨੀ ਕਾਰੋਬਾਰੀ ਵਰਤੋਂ ਲਈ, ਤੁਹਾਡੇ ਮਾਲਕੀ ਜਾਂ ਨਿਯੰਤਰਣ ਵਾਲੇ ਡਿਵਾਈਸਾਂ ਉੱਤੇ ਐਪ ਇੰਸਟਾਲ ਅਤੇ ਵਰਤਣ ਲਈ ਇੱਕ ਵਿਅਕਤੀਗਤ, ਸੀਮਤ, ਗੈਰ-ਵਿਸ਼ੇਸ਼, ਗੈਰ-ਤਬਾਦਲੇਯੋਗ, ਰੱਦ ਕਰਨ ਯੋਗ ਲਾਇਸੈਂਸ ਦਿੰਦੇ ਹਾਂ।","h2":"2. ਤੁਹਾਡੀ ਸਮੱਗਰੀ","p2":"ਤੁਹਾਡੇ ਦੁਆਰਾ ਐਪ ਨਾਲ ਕੈਪਚਰ ਜਾਂ ਬਣਾਈਆਂ ਫੋਟੋਆਂ, ਵੀਡੀਓ, ਅਤੇ ਹੋਰ ਸਮੱਗਰੀ (“ਤੁਹਾਡੀ ਸਮੱਗਰੀ”) ਤੁਹਾਡੀ ਹੈ। ਐਪ ਟਿਕਾਣਾ, ਮਿਤੀ/ਸਮਾਂ, ਕੰਪਾਸ, ਅਤੇ ਸਬੰਧਤ ਜਾਣਕਾਰੀ ਸ਼ਾਮਲ ਕਰਨ ਲਈ ਤੁਹਾਡੇ ਡਿਵਾਈਸ ਉੱਤੇ ਤੁਹਾਡੀ ਸਮੱਗਰੀ ਪ੍ਰੋਸੈੱਸ ਕਰਦੀ ਹੈ। ਤੁਸੀਂ ਆਪਣੀ ਸਮੱਗਰੀ ਲਈ ਅਤੇ ਤੁਸੀਂ ਇਸ ਨੂੰ ਕਿਵੇਂ ਵਰਤਦੇ, ਸਟੋਰ ਕਰਦੇ, ਅਤੇ ਸਾਂਝਾ ਕਰਦੇ ਹੋ ਇਸ ਲਈ ਪੂਰੀ ਤਰ੍ਹਾਂ ਜ਼ਿੰਮੇਵਾਰ ਹੋ, ਅਤੇ ਤੁਸੀਂ ਪੁਸ਼ਟੀ ਕਰਦੇ ਹੋ ਕਿ ਤੁਹਾਨੂੰ ਇਸ ਨੂੰ ਕੈਪਚਰ ਅਤੇ ਵਰਤਣ ਦਾ ਅਧਿਕਾਰ ਹੈ।","h3":"3. ਟਿਕਾਣਾ ਅਤੇ ਕੰਪਾਸ ਸਟੀਕਤਾ — ਮਹੱਤਵਪੂਰਨ","note3":"ਐਪ ਦੀ ਟਿਕਾਣਾ, ਧੁਰੇ, ਪਤਾ, ਉਚਾਈ, ਕੰਪਾਸ ਦਿਸ਼ਾ, ਚੁੰਬਕੀ ਵਿਚਲਨ, ਅਤੇ ਸੂਰਜ/ਚੰਦ ਤੇ ਮੌਸਮ ਜਾਣਕਾਰੀ ਸਿਰਫ਼ ਆਮ ਜਾਣਕਾਰੀ ਦੇ ਉਦੇਸ਼ਾਂ ਲਈ ਪ੍ਰਦਾਨ ਕੀਤੀ ਜਾਂਦੀ ਹੈ ਅਤੇ ਗਲਤ, ਅਧੂਰੀ, ਜਾਂ ਦੇਰੀ ਵਾਲੀ ਹੋ ਸਕਦੀ ਹੈ। ਨੈਵੀਗੇਸ਼ਨ, ਐਮਰਜੈਂਸੀ, ਹਵਾਬਾਜ਼ੀ, ਸਮੁੰਦਰੀ, ਸਰਵੇਖਣ, ਕਾਨੂੰਨੀ, ਸੁਰੱਖਿਆ-ਨਾਜ਼ੁਕ, ਜਾਂ ਜੀਵਨ-ਨਾਜ਼ੁਕ ਉਦੇਸ਼ਾਂ ਲਈ ਐਪ ਉੱਤੇ ਭਰੋਸਾ ਨਾ ਕਰੋ। ਅਜਿਹੇ ਫੈਸਲਿਆਂ ਲਈ ਹਮੇਸ਼ਾ ਅਧਿਕਾਰਤ ਯੰਤਰ ਅਤੇ ਸਰੋਤ ਵਰਤੋ। ਤੁਸੀਂ ਇਹ ਜਾਣਕਾਰੀ ਆਪਣੇ ਖ਼ਤਰੇ ਉੱਤੇ ਵਰਤਦੇ ਹੋ।","h4":"4. ਖਰੀਦਾਂ","p4":"ਐਪ ਵਰਤਣ ਲਈ ਮੁਫ਼ਤ ਹੈ ਅਤੇ ਇਸ਼ਤਿਹਾਰਾਂ ਦੁਆਰਾ ਸਮਰਥਿਤ ਹੈ। ਤੁਸੀਂ ਵਿਕਲਪਿਕ ਤੌਰ ਉੱਤੇ ਕੁਝ ਵਿਸ਼ੇਸ਼ਤਾਵਾਂ ਅਨਲੌਕ ਕਰਨ ਵਾਲਾ ਇੱਕ-ਵਾਰੀ “Remove Ads / Pro” ਅੱਪਗ੍ਰੇਡ ਖਰੀਦ ਸਕਦੇ ਹੋ। ਸਾਰੀਆਂ ਖਰੀਦਾਂ Google Play ਦੁਆਰਾ ਪ੍ਰੋਸੈੱਸ ਅਤੇ ਬਿੱਲ ਕੀਤੀਆਂ ਜਾਂਦੀਆਂ ਹਨ, ਅਤੇ Google Play ਦੀਆਂ ਸ਼ਰਤਾਂ ਅਤੇ ਵਾਪਸੀ ਨੀਤੀ ਦੇ ਅਧੀਨ ਹਨ। ਅਸੀਂ ਤੁਹਾਡੇ ਭੁਗਤਾਨ ਵੇਰਵੇ ਪ੍ਰਾਪਤ ਜਾਂ ਸਟੋਰ ਨਹੀਂ ਕਰਦੇ। ਕਿਉਂਕਿ ਇਹ ਇੱਕ-ਵਾਰੀ ਡਿਜੀਟਲ ਅਨਲੌਕ ਹੈ, ਖਰੀਦਾਂ ਆਮ ਤੌਰ ਉੱਤੇ ਵਾਪਸੀਯੋਗ ਨਹੀਂ ਹਨ ਸਿਵਾਏ ਜਿੱਥੇ ਕਾਨੂੰਨ ਜਾਂ Google Play ਦੀਆਂ ਨੀਤੀਆਂ ਦੁਆਰਾ ਲੋੜੀਂਦਾ ਹੋਵੇ। ਤੁਸੀਂ ਉਸੇ Google ਖਾਤੇ ਉੱਤੇ ਐਪ ਦੇ ਅੰਦਰੋਂ ਪਿਛਲੀ ਖਰੀਦ ਬਹਾਲ ਕਰ ਸਕਦੇ ਹੋ।","h5":"5. ਇਸ਼ਤਿਹਾਰ","p5":"ਜਦੋਂ ਤੱਕ ਤੁਸੀਂ ਇਸ਼ਤਿਹਾਰ-ਮੁਕਤ ਅੱਪਗ੍ਰੇਡ ਨਹੀਂ ਖਰੀਦਦੇ, ਐਪ ਤੀਜੀਆਂ ਧਿਰਾਂ (Google AdMob ਸਮੇਤ) ਦੁਆਰਾ ਪ੍ਰਦਾਨ ਕੀਤੇ ਇਸ਼ਤਿਹਾਰ ਪ੍ਰਦਰਸ਼ਿਤ ਕਰਦੀ ਹੈ। ਅਸੀਂ ਇਸ਼ਤਿਹਾਰਾਂ ਦੀ ਸਮੱਗਰੀ ਜਾਂ ਉਨ੍ਹਾਂ ਦੁਆਰਾ ਪ੍ਰਚਾਰਿਤ ਕਿਸੇ ਵੀ ਉਤਪਾਦ ਜਾਂ ਸੇਵਾਵਾਂ ਲਈ ਜ਼ਿੰਮੇਵਾਰ ਨਹੀਂ ਹਾਂ।","h6":"6. ਸਵੀਕਾਰਯੋਗ ਵਰਤੋਂ","p6_intro":"ਤੁਸੀਂ ਸਹਿਮਤ ਹੁੰਦੇ ਹੋ ਕਿ ਤੁਸੀਂ ਹੇਠ ਲਿਖਿਆਂ ਵਿੱਚੋਂ ਕੁਝ ਨਹੀਂ ਕਰੋਗੇ:","li6_1":"ਕਿਸੇ ਵੀ ਗੈਰ-ਕਾਨੂੰਨੀ ਉਦੇਸ਼ ਲਈ ਜਾਂ ਕਿਸੇ ਲਾਗੂ ਕਾਨੂੰਨ ਜਾਂ ਨਿਯਮ ਦੀ ਉਲੰਘਣਾ ਵਿੱਚ ਐਪ ਵਰਤਣਾ;","li6_2":"ਇਸ ਪਾਬੰਦੀ ਨੂੰ ਜਿੱਥੇ ਤੱਕ ਕਾਨੂੰਨ ਦੁਆਰਾ ਵਰਜਿਤ ਹੈ ਉਸ ਹੱਦ ਨੂੰ ਛੱਡ ਕੇ, ਐਪ ਦਾ ਸੋਰਸ ਕੋਡ ਕਾਪੀ, ਸੋਧ, ਰਿਵਰਸ-ਇੰਜੀਨੀਅਰ, ਡੀਕੰਪਾਈਲ, ਜਾਂ ਕੱਢਣ ਦੀ ਕੋਸ਼ਿਸ਼ ਕਰਨਾ;","li6_3":"ਐਪ ਜਾਂ ਇਸ ਦੇ ਸਬੰਧਤ ਸਿਸਟਮਾਂ ਵਿੱਚ ਦਖਲ, ਵਿਘਨ, ਜਾਂ ਅਣਅਧਿਕਾਰਤ ਪਹੁੰਚ ਪ੍ਰਾਪਤ ਕਰਨ ਦੀ ਕੋਸ਼ਿਸ਼ ਕਰਨਾ;","li6_4":"ਦੂਜਿਆਂ ਦੇ ਅਧਿਕਾਰਾਂ ਦੀ ਉਲੰਘਣਾ ਕਰਨ ਜਾਂ ਅਜਿਹੀ ਸਮੱਗਰੀ ਕੈਪਚਰ ਕਰਨ ਲਈ ਐਪ ਵਰਤਣਾ ਜਿਸ ਨੂੰ ਕੈਪਚਰ ਕਰਨ ਦੀ ਤੁਹਾਨੂੰ ਇਜਾਜ਼ਤ ਨਹੀਂ ਹੈ; ਜਾਂ","li6_5":"ਐਪ ਵਿੱਚ ਕਿਸੇ ਵੀ ਮਲਕੀਅਤੀ ਨੋਟਿਸ ਨੂੰ ਹਟਾਉਣਾ, ਢੱਕਣਾ, ਜਾਂ ਬਦਲਣਾ।","h7":"7. ਬੌਧਿਕ ਜਾਇਦਾਦ","p7":"ਐਪ, ਇਸ ਦੇ ਸੌਫਟਵੇਅਰ, ਡਿਜ਼ਾਈਨ, ਲੋਗੋ, ਅਤੇ ਟ੍ਰੇਡਮਾਰਕ ਸਮੇਤ (ਪਰ ਤੁਹਾਡੀ ਸਮੱਗਰੀ ਅਤੇ ਤੀਜੀ-ਧਿਰ ਸਮੱਗਰੀ ਨੂੰ ਛੱਡ ਕੇ), GO PRACHI LABS ਦੀ ਮਲਕੀਅਤ ਹੈ ਅਤੇ ਬੌਧਿਕ-ਜਾਇਦਾਦ ਕਾਨੂੰਨਾਂ ਦੁਆਰਾ ਸੁਰੱਖਿਅਤ ਹੈ। ਉੱਪਰ ਦਿੱਤੇ ਲਾਇਸੈਂਸ ਨੂੰ ਛੱਡ ਕੇ, ਤੁਹਾਨੂੰ ਕੋਈ ਅਧਿਕਾਰ ਤਬਾਦਲੇ ਨਹੀਂ ਕੀਤੇ ਜਾਂਦੇ।","h8":"8. ਤੀਜੀ-ਧਿਰ ਸੇਵਾਵਾਂ","p8":"ਐਪ Google Play Services, Google Maps, Google AdMob, Firebase, ਅਤੇ Google Play Billing ਵਰਗੀਆਂ ਤੀਜੀ-ਧਿਰ ਸੇਵਾਵਾਂ ਵਰਤਦੀ ਹੈ। ਉਨ੍ਹਾਂ ਸੇਵਾਵਾਂ ਦੀ ਤੁਹਾਡੀ ਵਰਤੋਂ ਉਨ੍ਹਾਂ ਦੀਆਂ ਆਪਣੀਆਂ ਸ਼ਰਤਾਂ ਅਤੇ ਪਰਾਈਵੇਸੀ ਨੀਤੀਆਂ ਦੇ ਅਧੀਨ ਹੋ ਸਕਦੀ ਹੈ। ਅਸੀਂ ਤੀਜੀ-ਧਿਰ ਸੇਵਾਵਾਂ ਜਾਂ ਸਮੱਗਰੀ ਲਈ ਜ਼ਿੰਮੇਵਾਰ ਨਹੀਂ ਹਾਂ।","h9":"9. ਵਾਰੰਟੀਆਂ ਦਾ ਖੰਡਨ","p9":"ਐਪ ਨੂੰ “ਜਿਵੇਂ ਹੈ” ਅਤੇ “ਜਿਵੇਂ ਉਪਲਬਧ ਹੈ” ਆਧਾਰ ਉੱਤੇ, ਕਿਸੇ ਵੀ ਕਿਸਮ ਦੀ ਵਾਰੰਟੀ ਤੋਂ ਬਿਨਾਂ, ਭਾਵੇਂ ਸਪੱਸ਼ਟ ਹੋਵੇ ਜਾਂ ਅਪ੍ਰਤੱਖ, ਵਪਾਰਯੋਗਤਾ, ਕਿਸੇ ਖਾਸ ਉਦੇਸ਼ ਲਈ ਯੋਗਤਾ, ਸਟੀਕਤਾ, ਅਤੇ ਗੈਰ-ਉਲੰਘਣਾ ਦੀਆਂ ਅਪ੍ਰਤੱਖ ਵਾਰੰਟੀਆਂ ਸਮੇਤ, ਪ੍ਰਦਾਨ ਕੀਤਾ ਜਾਂਦਾ ਹੈ। ਅਸੀਂ ਗਾਰੰਟੀ ਨਹੀਂ ਦਿੰਦੇ ਕਿ ਐਪ ਨਿਰਵਿਘਨ, ਗਲਤੀ-ਮੁਕਤ, ਸੁਰੱਖਿਅਤ ਹੋਵੇਗੀ, ਜਾਂ ਇਸ ਦੁਆਰਾ ਪ੍ਰਦਾਨ ਕੀਤੀ ਕੋਈ ਵੀ ਜਾਣਕਾਰੀ ਸਟੀਕ ਜਾਂ ਭਰੋਸੇਯੋਗ ਹੈ।","h10":"10. ਦੇਣਦਾਰੀ ਦੀ ਸੀਮਾ","p10":"ਕਾਨੂੰਨ ਦੁਆਰਾ ਵੱਧ ਤੋਂ ਵੱਧ ਮਨਜ਼ੂਰ ਹੱਦ ਤੱਕ, GO PRACHI LABS ਅਤੇ ਇਸ ਦੀਆਂ ਸਹਿਯੋਗੀ ਕੰਪਨੀਆਂ ਐਪ ਦੀ ਤੁਹਾਡੀ ਵਰਤੋਂ (ਜਾਂ ਵਰਤਣ ਦੀ ਅਯੋਗਤਾ) ਤੋਂ ਪੈਦਾ ਹੋਣ ਵਾਲੇ ਜਾਂ ਇਸ ਨਾਲ ਸਬੰਧਤ ਕਿਸੇ ਵੀ ਅਪ੍ਰਤੱਖ, ਇਤਫਾਕੀ, ਵਿਸ਼ੇਸ਼, ਨਤੀਜਤਨ, ਜਾਂ ਦੰਡਾਤਮਕ ਨੁਕਸਾਨ, ਜਾਂ ਕਿਸੇ ਡਾਟਾ, ਮੁਨਾਫ਼ੇ, ਜਾਂ ਸਾਖ ਦੇ ਨੁਕਸਾਨ ਲਈ ਜ਼ਿੰਮੇਵਾਰ ਨਹੀਂ ਹੋਣਗੀਆਂ। ਜਿਸ ਹੱਦ ਤੱਕ ਦੇਣਦਾਰੀ ਨੂੰ ਬਾਹਰ ਨਹੀਂ ਕੀਤਾ ਜਾ ਸਕਦਾ, ਸਾਡੀ ਕੁੱਲ ਦੇਣਦਾਰੀ ਦਾਅਵੇ ਤੋਂ ਪਹਿਲੇ ਬਾਰਾਂ ਮਹੀਨਿਆਂ ਵਿੱਚ ਐਪ ਲਈ ਤੁਹਾਡੇ ਦੁਆਰਾ ਸਾਨੂੰ ਭੁਗਤਾਨ ਕੀਤੀ ਰਕਮ (ਜੇ ਕੋਈ ਹੋਵੇ) ਤੱਕ ਸੀਮਤ ਹੈ।","h11":"11. ਹਰਜਾਨਾ ਪੂਰਤੀ","p11":"ਤੁਸੀਂ ਐਪ ਦੀ ਤੁਹਾਡੀ ਵਰਤੋਂ, ਤੁਹਾਡੀ ਸਮੱਗਰੀ, ਜਾਂ ਇਨ੍ਹਾਂ ਸ਼ਰਤਾਂ ਦੀ ਤੁਹਾਡੀ ਉਲੰਘਣਾ ਤੋਂ ਪੈਦਾ ਹੋਣ ਵਾਲੇ ਕਿਸੇ ਵੀ ਦਾਅਵੇ, ਨੁਕਸਾਨ, ਦੇਣਦਾਰੀਆਂ, ਅਤੇ ਖਰਚਿਆਂ ਤੋਂ GO PRACHI LABS ਨੂੰ ਹਰਜਾਨਾ ਪੂਰਤੀ ਦੇਣ ਅਤੇ ਨੁਕਸਾਨ-ਮੁਕਤ ਰੱਖਣ ਲਈ ਸਹਿਮਤ ਹੁੰਦੇ ਹੋ।","h12":"12. ਸਮਾਪਤੀ","p12":"ਤੁਸੀਂ ਐਪ ਅਨਇੰਸਟਾਲ ਕਰਕੇ ਕਿਸੇ ਵੀ ਸਮੇਂ ਇਸ ਦੀ ਵਰਤੋਂ ਬੰਦ ਕਰ ਸਕਦੇ ਹੋ। ਜੇ ਤੁਸੀਂ ਇਨ੍ਹਾਂ ਸ਼ਰਤਾਂ ਦੀ ਉਲੰਘਣਾ ਕਰਦੇ ਹੋ ਜਾਂ ਜੇ ਅਸੀਂ ਐਪ ਬੰਦ ਕਰਦੇ ਹਾਂ ਤਾਂ ਅਸੀਂ ਐਪ ਤੱਕ ਤੁਹਾਡੀ ਪਹੁੰਚ ਨੂੰ ਮੁਅੱਤਲ ਜਾਂ ਸਮਾਪਤ ਕਰ ਸਕਦੇ ਹਾਂ। ਉਹ ਵਿਵਸਥਾਵਾਂ ਜੋ ਆਪਣੇ ਸੁਭਾਅ ਕਾਰਨ ਸਮਾਪਤੀ ਤੋਂ ਬਾਅਦ ਵੀ ਬਚੀਆਂ ਰਹਿਣੀਆਂ ਚਾਹੀਦੀਆਂ ਹਨ (ਬੌਧਿਕ ਜਾਇਦਾਦ, ਖੰਡਨ, ਅਤੇ ਦੇਣਦਾਰੀ ਦੀ ਸੀਮਾ ਸਮੇਤ) ਬਚੀਆਂ ਰਹਿਣਗੀਆਂ।","h13":"13. ਐਪ ਅਤੇ ਸ਼ਰਤਾਂ ਵਿੱਚ ਤਬਦੀਲੀਆਂ","p13":"ਅਸੀਂ ਕਿਸੇ ਵੀ ਸਮੇਂ ਐਪ ਨੂੰ ਸੋਧ ਜਾਂ ਬੰਦ ਕਰ ਸਕਦੇ ਹਾਂ, ਜਾਂ ਇਨ੍ਹਾਂ ਸ਼ਰਤਾਂ ਨੂੰ ਅੱਪਡੇਟ ਕਰ ਸਕਦੇ ਹਾਂ। ਮਹੱਤਵਪੂਰਨ ਤਬਦੀਲੀਆਂ ਇੱਕ ਸੋਧੀ ਹੋਈ ਲਾਗੂ ਹੋਣ ਦੀ ਮਿਤੀ ਨਾਲ ਇਸ ਪੰਨੇ ਉੱਤੇ ਪੋਸਟ ਕੀਤੀਆਂ ਜਾਣਗੀਆਂ। ਤਬਦੀਲੀਆਂ ਲਾਗੂ ਹੋਣ ਤੋਂ ਬਾਅਦ ਐਪ ਦੀ ਤੁਹਾਡੀ ਲਗਾਤਾਰ ਵਰਤੋਂ ਅੱਪਡੇਟ ਕੀਤੀਆਂ ਸ਼ਰਤਾਂ ਦੀ ਸਵੀਕ੍ਰਿਤੀ ਦਾ ਗਠਨ ਕਰਦੀ ਹੈ।","h14":"14. ਸ਼ਾਸਕੀ ਕਾਨੂੰਨ","p14":"ਇਹ ਸ਼ਰਤਾਂ ਕਾਨੂੰਨ-ਟਕਰਾਅ ਸਿਧਾਂਤਾਂ ਦੀ ਪਰਵਾਹ ਕੀਤੇ ਬਿਨਾਂ ਭਾਰਤ ਦੇ ਕਾਨੂੰਨਾਂ ਦੁਆਰਾ ਨਿਯੰਤ੍ਰਿਤ ਹਨ। ਜਦੋਂ ਤੱਕ ਲਾਗੂ ਖਪਤਕਾਰ-ਸੁਰੱਖਿਆ ਕਾਨੂੰਨ ਅਧੀਨ ਤੁਹਾਡੇ ਉੱਤੇ ਕੋਈ ਵੱਖਰਾ ਲਾਜ਼ਮੀ ਅਧਿਕਾਰ-ਖੇਤਰ ਲਾਗੂ ਨਹੀਂ ਹੁੰਦਾ, ਕੋਈ ਵੀ ਵਿਵਾਦ ਭਾਰਤ ਵਿੱਚ ਸਥਿਤ ਸਮਰੱਥ ਅਦਾਲਤਾਂ ਦੇ ਵਿਸ਼ੇਸ਼ ਅਧਿਕਾਰ-ਖੇਤਰ ਦੇ ਅਧੀਨ ਹੋਵੇਗਾ।","h15":"15. ਸਾਡੇ ਨਾਲ ਸੰਪਰਕ ਕਰੋ","p15":"ਇਨ੍ਹਾਂ ਸ਼ਰਤਾਂ ਬਾਰੇ ਸਵਾਲ? ਸਾਡੇ ਨਾਲ ਇੱਥੇ ਸੰਪਰਕ ਕਰੋ:","footer":"© 2026 GO PRACHI LABS. ਸਾਰੇ ਹੱਕ ਰਾਖਵੇਂ ਹਨ।"},"ui":{"ui_language":"ਭਾਸ਼ਾ","ui_note":"ਇਹ ਅਨੁਵਾਦ ਤੁਹਾਡੀ ਸਹੂਲਤ ਲਈ ਪ੍ਰਦਾਨ ਕੀਤਾ ਗਿਆ ਹੈ। ਕਿਸੇ ਵੀ ਅੰਤਰ ਦੀ ਸੂਰਤ ਵਿੱਚ, ਅੰਗਰੇਜ਼ੀ ਵਰਜਨ ਕਾਨੂੰਨੀ ਤੌਰ ਉੱਤੇ ਅਧਿਕਾਰਤ ਹੈ।"}},"as":{"terms":{"title":"সেৱাৰ চৰ্তাৱলী","eff":"কাৰ্যকৰী তাৰিখ: 9 July 2026","intro":"এই সেৱাৰ চৰ্তাৱলীয়ে (“চৰ্তাৱলী”) GO PRACHI LABS (“আমি”, “আমাৰ”) দ্বাৰা প্ৰদত্ত মোবাইল এপ্লিকেচন GPS Map Camera & Compass (“এপ”)ৰ আপোনাৰ ব্যৱহাৰ নিয়ন্ত্ৰণ কৰে। এপ ডাউনলোড, ইনষ্টল, বা ব্যৱহাৰ কৰি, আপুনি এই চৰ্তাৱলীৰ সৈতে সন্মত হয়। যদি আপুনি সন্মত নহয়, অনুগ্ৰহ কৰি এপ ব্যৱহাৰ নকৰিব।","h1":"1. এপ ব্যৱহাৰ কৰাৰ অনুজ্ঞাপত্ৰ","p1":"আমি আপোনাক এই চৰ্তাৱলী আৰু আপুনি যি এপ ষ্টোৰৰ পৰা ইয়াক ডাউনলোড কৰিছে তাৰ নিয়মৰ অধীনত, আপোনাৰ ব্যক্তিগত বা আভ্যন্তৰীণ ব্যৱসায়িক ব্যৱহাৰৰ বাবে, আপুনি মালিকীস্বত্ব বা নিয়ন্ত্ৰণ কৰা ডিভাইচত এপ ইনষ্টল আৰু ব্যৱহাৰ কৰিবলৈ এটা ব্যক্তিগত, সীমিত, অ-বিশেষ, অ-স্থানান্তৰযোগ্য, প্ৰত্যাহাৰযোগ্য অনুজ্ঞাপত্ৰ প্ৰদান কৰোঁ।","h2":"2. আপোনাৰ বিষয়বস্তু","p2":"আপুনি এপৰ সৈতে কেপচাৰ বা সৃষ্টি কৰা ফটো, ভিডিঅ', আৰু অন্য বিষয়বস্তু (“আপোনাৰ বিষয়বস্তু”) আপোনাৰ। অৱস্থান, তাৰিখ/সময়, কম্পাছ, আৰু সম্পৰ্কিত তথ্য যোগ কৰিবলৈ এপে আপোনাৰ ডিভাইচত আপোনাৰ বিষয়বস্তু প্ৰক্ৰিয়াকৰণ কৰে। আপোনাৰ বিষয়বস্তুৰ বাবে আৰু আপুনি ইয়াক কেনেকৈ ব্যৱহাৰ, সংৰক্ষণ, আৰু শ্বেয়াৰ কৰে তাৰ বাবে আপুনিয়েই সম্পূৰ্ণ দায়বদ্ধ, আৰু আপুনি নিশ্চিত কৰে যে ইয়াক কেপচাৰ আৰু ব্যৱহাৰ কৰাৰ অধিকাৰ আপোনাৰ আছে।","h3":"3. অৱস্থান আৰু কম্পাছ সঠিকতা — গুৰুত্বপূৰ্ণ","note3":"এপৰ অৱস্থান, স্থানাংক, ঠিকনা, উচ্চতা, কম্পাছৰ দিশ, চুম্বকীয় বিচ্যুতি, আৰু সূৰ্য/চন্দ্ৰ আৰু বতৰৰ তথ্য কেৱল সাধাৰণ তথ্যমূলক উদ্দেশ্যৰ বাবে প্ৰদান কৰা হৈছে আৰু ভুল, অসম্পূৰ্ণ, বা পলম হ'ব পাৰে। নেভিগেচন, জৰুৰীকালীন, বিমান চলাচল, সামুদ্ৰিক, জৰীপ, আইনী, সুৰক্ষা-সংকটজনক, বা জীৱন-সংকটজনক উদ্দেশ্যৰ বাবে এপৰ ওপৰত নিৰ্ভৰ নকৰিব। এনে সিদ্ধান্তৰ বাবে সদায় আধিকাৰিক যন্ত্ৰ আৰু উৎস ব্যৱহাৰ কৰক। আপুনি এই তথ্য আপোনাৰ নিজৰ বিপদত ব্যৱহাৰ কৰে।","h4":"4. ক্ৰয়সমূহ","p4":"এপ ব্যৱহাৰ কৰিবলৈ বিনামূলীয়া আৰু বিজ্ঞাপনৰ দ্বাৰা সমৰ্থিত। আপুনি বৈকল্পিকভাৱে কিছুমান বৈশিষ্ট্য আনলক কৰা এবাৰৰ “Remove Ads / Pro” আপগ্ৰেড কিনিব পাৰে। সকলো ক্ৰয় Google Play-এ প্ৰক্ৰিয়াকৰণ আৰু বিল কৰে, আৰু Google Play-ৰ চৰ্তাৱলী আৰু ধন ঘূৰাই দিয়া নীতিৰ অধীন। আমি আপোনাৰ পেমেণ্ট বিৱৰণ গ্ৰহণ বা সংৰক্ষণ নকৰোঁ। যিহেতু ই এবাৰৰ ডিজিটেল আনলক, আইন বা Google Play-ৰ নীতিৰ দ্বাৰা প্ৰয়োজন নোহোৱালৈকে ক্ৰয় সাধাৰণতে ধন ঘূৰাই দিব নোৱাৰি। আপুনি একে Google একাউণ্টত এপৰ ভিতৰৰ পৰা এটা পূৰ্বৰ ক্ৰয় পুনৰ স্থাপন কৰিব পাৰে।","h5":"5. বিজ্ঞাপনসমূহ","p5":"আপুনি বিজ্ঞাপন-মুক্ত আপগ্ৰেড নিকিনালৈকে, এপে তৃতীয়-পক্ষ (Google AdMob সহ) দ্বাৰা প্ৰদত্ত বিজ্ঞাপন প্ৰদৰ্শন কৰে। বিজ্ঞাপনৰ বিষয়বস্তু বা সিহঁতে প্ৰচাৰ কৰা কোনো পণ্য বা সেৱাৰ বাবে আমি দায়বদ্ধ নহওঁ।","h6":"6. গ্ৰহণযোগ্য ব্যৱহাৰ","p6_intro":"আপুনি নিম্নলিখিতসমূহ নকৰিবলৈ সন্মত হয়:","li6_1":"কোনো বেআইনী উদ্দেশ্যৰ বাবে বা কোনো প্ৰযোজ্য আইন বা নিয়মৰ উলংঘনত এপ ব্যৱহাৰ কৰা;","li6_2":"এই প্ৰতিবন্ধকতা আইনৰ দ্বাৰা নিষিদ্ধ হোৱা সীমা বাদ দি, এপৰ ছ'ৰ্চ ক'ড কপি, পৰিৱৰ্তন, ৰিভাৰ্ছ-ইঞ্জিনিয়াৰ, ডিকম্পাইল, বা উলিয়াবলৈ চেষ্টা কৰা;","li6_3":"এপ বা ইয়াৰ সম্পৰ্কিত ব্যৱস্থাসমূহত হস্তক্ষেপ, ব্যাঘাত, বা অননুমোদিত এক্সেছ পাবলৈ চেষ্টা কৰা;","li6_4":"আনৰ অধিকাৰ উলংঘন কৰিবলৈ বা আপোনাক কেপচাৰ কৰিবলৈ অনুমতি নথকা বিষয়বস্তু কেপচাৰ কৰিবলৈ এপ ব্যৱহাৰ কৰা; বা","li6_5":"এপত থকা কোনো মালিকীস্বত্ব জাননী আঁতৰোৱা, ঢাকি ৰখা, বা সলনি কৰা।","h7":"7. বৌদ্ধিক সম্পত্তি","p7":"এপ, ইয়াৰ ছফ্টৱেৰ, ডিজাইন, ল'গো, আৰু ট্ৰেডমাৰ্কসহ (কিন্তু আপোনাৰ বিষয়বস্তু আৰু তৃতীয়-পক্ষৰ সামগ্ৰী বাদ দি), GO PRACHI LABS-ৰ মালিকীস্বত্বত আছে আৰু বৌদ্ধিক-সম্পত্তি আইনৰ দ্বাৰা সুৰক্ষিত। ওপৰত প্ৰদান কৰা অনুজ্ঞাপত্ৰ বাদ দি, আপোনাক কোনো অধিকাৰ স্থানান্তৰ কৰা নহয়।","h8":"8. তৃতীয়-পক্ষৰ সেৱাসমূহ","p8":"এপে Google Play Services, Google Maps, Google AdMob, Firebase, আৰু Google Play Billing-ৰ দৰে তৃতীয়-পক্ষৰ সেৱা ব্যৱহাৰ কৰে। সেই সেৱাসমূহৰ আপোনাৰ ব্যৱহাৰ সিহঁতৰ নিজৰ চৰ্তাৱলী আৰু গোপনীয়তা নীতিৰ অধীন হ'ব পাৰে। তৃতীয়-পক্ষৰ সেৱা বা বিষয়বস্তুৰ বাবে আমি দায়বদ্ধ নহওঁ।","h9":"9. ৱাৰাণ্টিৰ অস্বীকৃতি","p9":"এপ “যেনেকৈ আছে” আৰু “যেনেকৈ উপলব্ধ” আধাৰত, ব্যক্ত বা অন্তৰ্নিহিত, বাণিজ্যিক উপযোগিতা, এটা নিৰ্দিষ্ট উদ্দেশ্যৰ বাবে উপযুক্ততা, সঠিকতা, আৰু অ-উলংঘনৰ অন্তৰ্নিহিত ৱাৰাণ্টিসহ, কোনো ধৰণৰ ৱাৰাণ্টি নোহোৱাকৈ প্ৰদান কৰা হয়। এপ নিৰবচ্ছিন্ন, ত্ৰুটিমুক্ত, সুৰক্ষিত হ'ব, বা ই প্ৰদান কৰা কোনো তথ্য সঠিক বা নিৰ্ভৰযোগ্য বুলি আমি ৱাৰাণ্টি নিদিওঁ।","h10":"10. দায়বদ্ধতাৰ সীমা","p10":"আইনৰ দ্বাৰা অনুমোদিত সৰ্বাধিক সীমালৈ, GO PRACHI LABS আৰু ইয়াৰ সহযোগীসমূহ এপৰ আপোনাৰ ব্যৱহাৰ (বা ব্যৱহাৰ কৰিবলৈ অক্ষমতা)ৰ পৰা উদ্ভৱ হোৱা বা ইয়াৰ সৈতে সম্পৰ্কিত কোনো পৰোক্ষ, আকস্মিক, বিশেষ, পৰিণামমূলক, বা দণ্ডাত্মক ক্ষতি, বা কোনো ডেটা, লাভ, বা সুনামৰ ক্ষতিৰ বাবে দায়বদ্ধ নহ'ব। দায়বদ্ধতা বাদ দিব নোৱাৰা সীমালৈ, আমাৰ মুঠ দায়বদ্ধতা দাবীৰ আগৰ বাৰ মাহত এপৰ বাবে আপুনি আমাক দিয়া পৰিমাণ (যদি কিবা থাকে)লৈ সীমিত।","h11":"11. ক্ষতিপূৰণ","p11":"আপুনি এপৰ আপোনাৰ ব্যৱহাৰ, আপোনাৰ বিষয়বস্তু, বা এই চৰ্তাৱলীৰ আপোনাৰ উলংঘনৰ পৰা উদ্ভৱ হোৱা কোনো দাবী, ক্ষতি, দায়বদ্ধতা, আৰু ব্যয়ৰ পৰা GO PRACHI LABS-ক ক্ষতিপূৰণ দিবলৈ আৰু ক্ষতিমুক্ত ৰাখিবলৈ সন্মত হয়।","h12":"12. সমাপ্তি","p12":"আপুনি এপ আনইনষ্টল কৰি যিকোনো সময়তে ইয়াৰ ব্যৱহাৰ বন্ধ কৰিব পাৰে। যদি আপুনি এই চৰ্তাৱলী উলংঘন কৰে বা যদি আমি এপ বন্ধ কৰোঁ তেন্তে আমি এপলৈ আপোনাৰ এক্সেছ স্থগিত বা সমাপ্ত কৰিব পাৰোঁ। যি বিধানসমূহ সিহঁতৰ প্ৰকৃতিৰ কাৰণে সমাপ্তিৰ পিছতো টিকি থকা উচিত (বৌদ্ধিক সম্পত্তি, অস্বীকৃতি, আৰু দায়বদ্ধতাৰ সীমাসহ) সেইবোৰ টিকি থাকিব।","h13":"13. এপ আৰু চৰ্তাৱলীৰ পৰিৱৰ্তন","p13":"আমি যিকোনো সময়তে এপ পৰিৱৰ্তন বা বন্ধ কৰিব পাৰোঁ, বা এই চৰ্তাৱলী আপডেট কৰিব পাৰোঁ। গুৰুত্বপূৰ্ণ পৰিৱৰ্তন এটা সংশোধিত কাৰ্যকৰী তাৰিখৰ সৈতে এই পৃষ্ঠাত প'ষ্ট কৰা হ'ব। পৰিৱৰ্তন কাৰ্যকৰী হোৱাৰ পিছত এপৰ আপোনাৰ নিৰন্তৰ ব্যৱহাৰে আপডেট কৰা চৰ্তাৱলীৰ গ্ৰহণ গঠন কৰে।","h14":"14. শাসক আইন","p14":"এই চৰ্তাৱলী আইন-সংঘাত নীতিসমূহ বিবেচনা নকৰাকৈ ভাৰতৰ আইনৰ দ্বাৰা পৰিচালিত। প্ৰযোজ্য গ্ৰাহক-সুৰক্ষা আইনৰ অধীনত আপোনাৰ বাবে এটা ভিন্ন বাধ্যতামূলক অধিকাৰক্ষেত্ৰ প্ৰযোজ্য নোহোৱালৈকে, কোনো বিবাদ ভাৰতত অৱস্থিত সক্ষম আদালতৰ একচেটিয়া অধিকাৰক্ষেত্ৰৰ অধীন হ'ব।","h15":"15. আমাৰ সৈতে যোগাযোগ কৰক","p15":"এই চৰ্তাৱলীৰ বিষয়ে প্ৰশ্ন? আমাৰ সৈতে ইয়াত যোগাযোগ কৰক:","footer":"© 2026 GO PRACHI LABS. সৰ্বস্বত্ব সংৰক্ষিত।"},"ui":{"ui_language":"ভাষা","ui_note":"এই অনুবাদ আপোনাৰ সুবিধাৰ বাবে প্ৰদান কৰা হৈছে। কোনো অসংগতিৰ ক্ষেত্ৰত, ইংৰাজী সংস্কৰণটোৱেই আইনীভাৱে আধিকাৰিক।"}},"ne":{"terms":{"title":"सेवाका सर्तहरू","eff":"प्रभावकारी मिति: 9 July 2026","intro":"यी सेवाका सर्तहरू (“सर्तहरू”) ले GO PRACHI LABS (“हामी”, “हाम्रो”) द्वारा प्रदान गरिएको मोबाइल एप्लिकेसन GPS Map Camera & Compass (“एप”) को तपाईंको प्रयोगलाई सञ्चालन गर्दछन्। एप डाउनलोड, इन्स्टल वा प्रयोग गरेर, तपाईं यी सर्तहरूमा सहमत हुनुहुन्छ। तपाईं सहमत हुनुहुन्न भने, कृपया एप प्रयोग नगर्नुहोस्।","h1":"1. एप प्रयोगको इजाजतपत्र","p1":"हामी तपाईंलाई यी सर्तहरू र तपाईंले एप डाउनलोड गर्नुभएको एप स्टोरका नियमहरूको अधीनमा रही, तपाईंको स्वामित्व वा नियन्त्रणमा रहेका यन्त्रहरूमा एप इन्स्टल गरी तपाईंको व्यक्तिगत वा आन्तरिक व्यावसायिक प्रयोगका लागि प्रयोग गर्न व्यक्तिगत, सीमित, गैर-विशेष, हस्तान्तरण नहुने, रद्द गर्न सकिने इजाजतपत्र प्रदान गर्छौं।","h2":"2. तपाईंको सामग्री","p2":"तपाईंले एपमार्फत खिच्नुभएका वा सिर्जना गर्नुभएका फोटो, भिडियो र अन्य सामग्री (“तपाईंको सामग्री”) तपाईंकै हुन्। एपले स्थान, मिति/समय, कम्पास र सम्बन्धित जानकारी थप्न तपाईंकै यन्त्रमा तपाईंको सामग्री प्रशोधन गर्छ। तपाईंको सामग्री र यसलाई तपाईंले कसरी प्रयोग, भण्डारण र साझेदारी गर्नुहुन्छ भन्ने कुराको एकमात्र जिम्मेवार तपाईं हुनुहुन्छ, र तपाईंसँग यसलाई खिच्ने र प्रयोग गर्ने अधिकार छ भन्ने कुरा पुष्टि गर्नुहुन्छ।","h3":"3. स्थान र कम्पास सटीकता — महत्त्वपूर्ण","note3":"एपका स्थान, निर्देशांक, ठेगाना, उचाइ, कम्पास दिशा, चुम्बकीय विचलन र सूर्य/चन्द्र तथा मौसम जानकारी सामान्य सूचनात्मक उद्देश्यका लागि मात्र प्रदान गरिएका हुन् र गलत, अपूर्ण वा ढिलो हुन सक्छन्। नेभिगेसन, आपत्कालीन, विमानन, समुद्री, सर्वेक्षण, कानुनी, सुरक्षा-महत्त्वपूर्ण वा जीवन-महत्त्वपूर्ण उद्देश्यका लागि एपमा भर नपर्नुहोस्। त्यस्ता निर्णयहरूका लागि सधैं आधिकारिक उपकरण र स्रोतहरू प्रयोग गर्नुहोस्। तपाईं यो जानकारी आफ्नै जोखिममा प्रयोग गर्नुहुन्छ।","h4":"4. किनमेल","p4":"एप प्रयोग गर्न निःशुल्क छ र विज्ञापनद्वारा समर्थित छ। तपाईं वैकल्पिक रूपमा केही सुविधाहरू अनलक गर्ने एक-पटकको “Remove Ads / Pro” अपग्रेड किन्न सक्नुहुन्छ। सबै किनमेल Google Play द्वारा प्रशोधन र बिल गरिन्छन्, र Google Play का सर्तहरू र फिर्ता नीतिको अधीनमा हुन्छन्। हामी तपाईंको भुक्तानी विवरण प्राप्त वा भण्डारण गर्दैनौं। यो एक-पटकको डिजिटल अनलक भएकाले, कानून वा Google Play का नीतिहरूद्वारा आवश्यक भएमा बाहेक किनमेल सामान्यतया फिर्ता हुँदैनन्। तपाईं उही Google खातामा एपभित्रैबाट अघिल्लो किनमेल पुनर्स्थापना गर्न सक्नुहुन्छ।","h5":"5. विज्ञापनहरू","p5":"तपाईंले विज्ञापन-रहित अपग्रेड नकिनेसम्म, एपले तेस्रो-पक्ष (Google AdMob सहित) द्वारा प्रदान गरिएका विज्ञापनहरू देखाउँछ। हामी विज्ञापनको सामग्री वा तिनले प्रवर्द्धन गर्ने कुनै पनि उत्पादन वा सेवाका लागि जिम्मेवार छैनौं।","h6":"6. स्वीकार्य प्रयोग","p6_intro":"तपाईं निम्न कुरा नगर्न सहमत हुनुहुन्छ:","li6_1":"एपलाई कुनै गैरकानुनी उद्देश्य वा कुनै लागू हुने कानून वा नियमको उल्लङ्घनमा प्रयोग गर्न;","li6_2":"कानूनले यो प्रतिबन्ध निषेध गरेको हदसम्म बाहेक, एपको स्रोत कोड कपी, परिमार्जन, रिभर्स-इन्जिनियर, डिकम्पाइल वा निकाल्ने प्रयास गर्न;","li6_3":"एप वा यसका सम्बन्धित प्रणालीहरूमा हस्तक्षेप, अवरोध वा अनधिकृत पहुँच प्राप्त गर्ने प्रयास गर्न;","li6_4":"अरूको अधिकार उल्लङ्घन गर्न वा तपाईंलाई खिच्न अनुमति नभएको सामग्री खिच्न एप प्रयोग गर्न; वा","li6_5":"एपमा भएका कुनै पनि स्वामित्व सूचनाहरू हटाउन, ढाक्न वा परिवर्तन गर्न।","h7":"7. बौद्धिक सम्पत्ति","p7":"एप, यसको सफ्टवेयर, डिजाइन, लोगो र ट्रेडमार्कसहित (तर तपाईंको सामग्री र तेस्रो-पक्ष सामग्री बाहेक), GO PRACHI LABS को स्वामित्वमा छ र बौद्धिक-सम्पत्ति कानूनहरूद्वारा संरक्षित छ। माथि प्रदान गरिएको इजाजतपत्र बाहेक, तपाईंलाई कुनै अधिकार हस्तान्तरण गरिँदैन।","h8":"8. तेस्रो-पक्ष सेवाहरू","p8":"एपले Google Play Services, Google Maps, Google AdMob, Firebase र Google Play Billing जस्ता तेस्रो-पक्ष सेवाहरू प्रयोग गर्छ। ती सेवाहरूको तपाईंको प्रयोग तिनीहरूका आफ्नै सर्त र गोपनीयता नीतिको अधीनमा हुन सक्छ। हामी तेस्रो-पक्ष सेवा वा सामग्रीका लागि जिम्मेवार छैनौं।","h9":"9. वारेन्टीहरूको अस्वीकरण","p9":"एप “जस्तो छ” र “उपलब्ध भएअनुसार” आधारमा, कुनै पनि प्रकारका वारेन्टी बिना, चाहे व्यक्त होस् वा निहित, व्यापारयोग्यता, कुनै खास उद्देश्यका लागि उपयुक्तता, सटीकता र गैर-उल्लङ्घनका निहित वारेन्टीसहित प्रदान गरिन्छ। एप निर्बाध, त्रुटिरहित, सुरक्षित हुनेछ, वा यसले प्रदान गर्ने कुनै जानकारी सटीक वा भरपर्दो हुनेछ भनेर हामी वारेन्टी दिँदैनौं।","h10":"10. दायित्वको सीमा","p10":"कानूनले अनुमति दिएको अधिकतम हदसम्म, GO PRACHI LABS र यसका सहयोगीहरू एपको तपाईंको प्रयोग (वा प्रयोग गर्न नसक्नु) बाट उत्पन्न वा सम्बन्धित कुनै पनि अप्रत्यक्ष, आकस्मिक, विशेष, परिणामजन्य वा दण्डात्मक क्षति, वा कुनै डेटा, नाफा वा सद्भावनाको हानिका लागि जिम्मेवार हुनेछैनन्। दायित्व बहिष्कार गर्न नसकिने हदसम्म, हाम्रो कुल दायित्व दाबीभन्दा अघिका बाह्र महिनामा एपका लागि तपाईंले हामीलाई तिर्नुभएको रकम (यदि छ भने) मा सीमित छ।","h11":"11. क्षतिपूर्ति","p11":"तपाईं एपको तपाईंको प्रयोग, तपाईंको सामग्री, वा यी सर्तहरूको तपाईंको उल्लङ्घनबाट उत्पन्न कुनै पनि दाबी, क्षति, दायित्व र खर्चबाट GO PRACHI LABS लाई क्षतिपूर्ति दिन र हानिरहित राख्न सहमत हुनुहुन्छ।","h12":"12. समाप्ति","p12":"तपाईं एप अनइन्स्टल गरेर जुनसुकै बेला यसको प्रयोग रोक्न सक्नुहुन्छ। तपाईंले यी सर्तहरू उल्लङ्घन गर्नुभएमा वा हामीले एप बन्द गरेमा हामी एपमा तपाईंको पहुँच निलम्बन वा समाप्त गर्न सक्छौं। जुन प्रावधानहरू आफ्नो प्रकृतिले समाप्तिपछि पनि कायम रहनुपर्छ (बौद्धिक सम्पत्ति, अस्वीकरण र दायित्वको सीमासहित) ती कायम रहनेछन्।","h13":"13. एप र सर्तहरूमा परिवर्तनहरू","p13":"हामी एप परिमार्जन वा बन्द गर्न, वा यी सर्तहरू अद्यावधिक गर्न, जुनसुकै बेला सक्छौं। महत्त्वपूर्ण परिवर्तनहरू संशोधित प्रभावकारी मितिसहित यस पृष्ठमा राखिनेछन्। परिवर्तनहरू लागू भएपछि एपको तपाईंको निरन्तर प्रयोगले अद्यावधिक सर्तहरूको स्वीकृति जनाउँछ।","h14":"14. शासकीय कानून","p14":"यी सर्तहरू कानून-द्वन्द्वका सिद्धान्तहरूलाई ध्यान नदिई भारतका कानूनहरूद्वारा सञ्चालित हुन्छन्। लागू हुने उपभोक्ता-संरक्षण कानूनअन्तर्गत तपाईंलाई फरक अनिवार्य अधिकार-क्षेत्र लागू नभएसम्म, कुनै पनि विवाद भारतमा अवस्थित सक्षम अदालतहरूको विशेष अधिकार-क्षेत्रको अधीनमा हुनेछन्।","h15":"15. हामीलाई सम्पर्क गर्नुहोस्","p15":"यी सर्तहरूबारे प्रश्न? हामीलाई यहाँ सम्पर्क गर्नुहोस्:","footer":"© 2026 GO PRACHI LABS. सर्वाधिकार सुरक्षित।"},"ui":{"ui_language":"भाषा","ui_note":"यो अनुवाद तपाईंको सुविधाका लागि प्रदान गरिएको हो। कुनै असमानता भएमा, अङ्ग्रेजी संस्करण नै कानुनी रूपमा आधिकारिक हुनेछ।"}},"es":{"terms":{"title":"Términos del Servicio","eff":"Fecha de entrada en vigor: 9 July 2026","intro":"Estos Términos del Servicio (“Términos”) rigen su uso de la aplicación móvil GPS Map Camera & Compass (la “App”), proporcionada por GO PRACHI LABS (“nosotros” o “nuestro”). Al descargar, instalar o usar la App, usted acepta estos Términos. Si no está de acuerdo, no use la App.","h1":"1. Licencia de uso de la App","p1":"Le concedemos una licencia personal, limitada, n
